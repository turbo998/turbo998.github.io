<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 83 · BURLEY DISNEY ROUGHNESS-DRIVEN DIFFUSE RETROREFLECTION VS FLAT LAMBERTIAN DIFFUSE
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Burley Disney Diffuse (N·V=0.05 Rim Gain = 4.6685×, 0 Loss) vs Flat Lambert (1.0000×, −78.6% Rim Loss, 720.02×)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Coupling F_D90 = 0.5 + 2·r·cos²θ_d = 2.50 to roughness r = 1.0 restores the warm retroreflective rim of rough clay &amp; moon dust
  </text>

  <!-- Left Panel: Burley Disney Roughness-Driven Diffuse -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Burley Disney Roughness-Driven Diffuse (F_D90 = 2.50)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    M(μ) = (1 + 1.5·(1−μ)⁵)² · Strong 4.6685× Grazing Retroreflective Rim
  </text>

  <!-- Grazing retroreflection curve left -->
  <line x1="95" y1="395" x2="545" y2="395" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="285" y="385" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Lambert Baseline M = 1.0000×</text>
  <path d="M 105 245 Q 210 388 535 395" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="105" cy="245" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-0 (N·V=0.05 Grazing Rim): M_Burley = 4.6685× (Full Velvet Rim!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Sheen-Starved Grazing Stations: 0 / 17 (MERL-Calibrated Rim)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.57 ms (5-Op Schlick) vs 408.03 ms (64-Strip Quad, 720.02×)
  </text>

  <!-- Right Panel: Naive Flat Lambertian Diffuse -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Flat Lambertian Diffuse (M = 1.0000× Ignores r)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Missing −3.6685× (−78.58%) Grazing Rim Retroreflection on Rough Clay!
  </text>

  <!-- Flat dead line right -->
  <line x1="665" y1="395" x2="1095" y2="395" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="665" cy="395" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-0 (N·V=0.05): Locked at 1.0000× (−3.6685× / −78.58% Sheen Lost!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Sheen-Starved Stations: 14 / 17 (Lifeless Dark Matte Silhouettes)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Makes Terracotta, Moon Dust &amp; Rough Concrete Look Like Dead Chalk
  </text>
</svg>
