<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 48 · AGX GAMUT-INSET PATH-TO-WHITE TONEMAPPING VS PER-CHANNEL NOTORIOUS SIX HUE SKEW
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="800">
    AgX Gamut-Inset (+4.5 EV Hue = 17.38°, 0.00° Skew) vs Per-Channel (56.22° Yellow, +38.84° Skew, 6.96× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Isotropically attenuating chrominance (C − Y·1) around luminance Y prevents golden-orange fire from skewing into toxic [1,1,0] yellow
  </text>

  <!-- Left Panel: AgX Gamut-Inset + Path-to-White -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ AgX Gamut-Inset + Path-to-White Tonemapper
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    C_out = Y_d·1 + (C − Y·1)·(Y_d/Y)·(1−k_in)/(1+βY) · Constant Hue
  </text>

  <!-- Flat constant hue line left -->
  <line x1="100" y1="395" x2="540" y2="395" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="445" cy="395" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-13 (+4.5 EV): Hue = 17.38° (0.00° Skew · Incandescent Core)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Max Hue Skew: 0.00° Across All 17 EV Stops (-2 EV to +6 EV)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Stop Passes: 0.67 ms (Direct Vector) vs 4.64 ms (Polar Trig, 6.96×)
  </text>

  <!-- Right Panel: Naive Per-Channel Notorious Six Skew -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Per-Channel S-Curve ("Notorious Six" Clip)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Independent R &amp; G Saturation Towards 1.0 Skews Orange Into Toxic Yellow!
  </text>

  <!-- Rising hue distortion curve right -->
  <line x1="660" y1="395" x2="1100" y2="395" stroke="#475569" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 670 390 Q 820 365 920 295 T 1090 262" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1005" cy="272" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-13 (+4.5 EV): Skewed to 56.22° (+38.84° Yellow Shift!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Peak Hue Distortion: +40.63° Toward [1, 1, 0] Yellow Corner
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Refuses to Desaturate to White at Extreme Exposure (+6.0 EV)
  </text>
</svg>
