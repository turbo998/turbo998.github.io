<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">ROUND 130 · 140TH DEMO MILESTONE · PERLIN (SIGGRAPH 2002) C² QUINTIC SMOOTHSTEP</text>
  <text x="56" y="102" fill="#f8fafc" font-size="25" font-weight="800">Perlin C² Quintic 6u⁵−15u⁴+10u³ vs Classic C¹ Cubic 3u²−2u³ Mach-Band Crease</text>
  <text x="56" y="130" fill="#94a3b8" font-size="14">Locks cell-boundary second derivative S₅″(0) = S₅″(1) = 0.0000 (ΔS″ = 0) vs cubic S₃″(0) = +6, S₃″(1) = −6 (ΔS″ = 12.0000 crease jump)</text>

  <!-- Left panel: Second derivative curvature S''(u) across u in [0, 1] -->
  <rect x="56" y="152" width="660" height="336" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="80" y="182" fill="#e2e8f0" font-size="15" font-weight="700">Second Derivative / Normal Gradient Curvature S″(u) Across Cell u ∈ [0.00, 1.00]</text>

  <!-- Grid lines: y=215(+6), y=270(+3), y=325(0), y=380(-3), y=435(-6) -->
  <line x1="115" y1="215" x2="685" y2="215" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="270" x2="685" y2="270" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="325" x2="685" y2="325" stroke="#475569"/>
  <line x1="115" y1="380" x2="685" y2="380" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="435" x2="685" y2="435" stroke="#1e293b" stroke-dasharray="4 4"/>

  <text x="105" y="219" fill="#94a3b8" font-size="11" text-anchor="end">+6.00</text>
  <text x="105" y="274" fill="#94a3b8" font-size="11" text-anchor="end">+3.00</text>
  <text x="105" y="329" fill="#94a3b8" font-size="11" text-anchor="end">0.00</text>
  <text x="105" y="384" fill="#94a3b8" font-size="11" text-anchor="end">-3.00</text>
  <text x="105" y="439" fill="#94a3b8" font-size="11" text-anchor="end">-6.00</text>

  <!-- Perlin C2 Quintic S5''(u) = 60u(1-u)(1-2u): u=0(0)->325, u=0.125(4.92)->235, u=0.25(5.625)->222, u=0.375(3.52)->260, u=0.5(0)->325, u=0.625(-3.52)->390, u=0.75(-5.625)->428, u=0.875(-4.92)->415, u=1.0(0)->325 -->
  <polyline fill="none" stroke="url(#ok)" stroke-width="4" points="115,325 186,235 257,222 329,260 400,325 471,390 542,428 614,415 685,325"/>
  <circle cx="115" cy="325" r="6" fill="#10b981"/>
  <circle cx="257" cy="222" r="5.5" fill="#38bdf8"/>
  <circle cx="400" cy="325" r="5" fill="#10b981"/>
  <circle cx="542" cy="428" r="5.5" fill="#38bdf8"/>
  <circle cx="685" cy="325" r="6" fill="#10b981"/>
  <text x="270" y="212" fill="#34d399" font-size="12" font-weight="700">Perlin C² Quintic S₅″(0) = S₅″(1) = 0.0000 · Peak S₅″(0.25) = +5.6250</text>

  <!-- Classic C1 Cubic S3''(u) = 6 - 12u: (115,215) -> (257,270) -> (400,325) -> (542,380) -> (685,435) -->
  <polyline fill="none" stroke="url(#danger)" stroke-width="3.5" stroke-dasharray="7 4" points="115,215 257,270 400,325 542,380 685,435"/>
  <circle cx="115" cy="215" r="6" fill="#ef4444"/>
  <circle cx="257" cy="270" r="5" fill="#f97316"/>
  <circle cx="542" cy="380" r="5" fill="#f97316"/>
  <circle cx="685" cy="435" r="6" fill="#ef4444"/>
  <text x="128" y="246" fill="#f87171" font-size="12" font-weight="700">Cubic S₃″(0)=+6.00 &amp; S₃″(1)=−6.00 (ΔS″=12.0000 Crease!)</text>

  <!-- X-axis labels -->
  <text x="115" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 0 (u=0.00)</text>
  <text x="257" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 4 (u=0.25)</text>
  <text x="400" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 8 (u=0.50)</text>
  <text x="542" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 12 (u=0.75)</text>
  <text x="685" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 16 (u=1.00)</text>

  <!-- Right panel: KPI cards -->
  <rect x="740" y="152" width="404" height="104" rx="12" fill="#111827" stroke="#0284c7"/>
  <text x="764" y="180" fill="#38bdf8" font-size="12" font-weight="700">CELL BOUNDARY SECOND DERIVATIVE (u = 0 &amp; u = 1)</text>
  <text x="764" y="212" fill="#f8fafc" font-size="21" font-weight="800">S₅″ = 0.0000 vs S₃″ = ±6.0000</text>
  <text x="764" y="238" fill="#94a3b8" font-size="12">Eliminates ΔS″ = 12.0000 grid Mach-band crease &amp; camera jerk</text>

  <rect x="740" y="268" width="404" height="104" rx="12" fill="#111827" stroke="#ef4444"/>
  <text x="764" y="296" fill="#f87171" font-size="12" font-weight="700">QUARTER-CELL INFLECTION &amp; MIDPOINT SLOPE</text>
  <text x="764" y="328" fill="#f8fafc" font-size="21" font-weight="800">0/17 Creased · S₅′(0.5) = 1.8750</text>
  <text x="764" y="354" fill="#94a3b8" font-size="12">Smoothly ramps curvature to ±5.6250 at u = 0.25 / 0.75</text>

  <rect x="740" y="384" width="404" height="104" rx="12" fill="#111827" stroke="#10b981"/>
  <text x="764" y="412" fill="#34d399" font-size="12" font-weight="700">8,192-PASS THROUGHPUT VS 64-STEP BETA(3,3) INTEGRAL</text>
  <text x="764" y="444" fill="#f8fafc" font-size="21" font-weight="800">0.36 ms vs 27.75 ms (77.69×)</text>
  <text x="764" y="470" fill="#94a3b8" font-size="12">3-FMA Horner u³(10+u(−15+6u)) matches I_u(3,3) within &lt;1e-13</text>

  <!-- Footer provenance bar -->
  <rect x="56" y="508" width="1088" height="72" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="80" y="538" fill="#e2e8f0" font-size="13" font-weight="700">58-Solid 17-Station C² Curvature Continuity Bench (140th Demo Milestone) · Sealed Evidence: demos/perlin-quintic-c2-smoothstep-rig/report.json</text>
  <text x="80" y="562" fill="#94a3b8" font-size="12">Provenance: Measured on Windows 11 Chromium Headless WebGL · 12/12 checks passed · Zero runtime model APIs</text>
</svg>
