<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 40 · SHADOW MAP LIGHT-SPACE TEXEL-GRID SNAPPING VS SHADOW SWIMMING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    Texel-Grid Snapped (X_shadow ≡ 1.0000m, 0.0000m Crawl) vs Unsnapped Swimming (0.2450m Sawtooth Crawl)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    With Δ_texel = 0.2500m, translating the shadow frustum by sub-texel camera steps makes static shadow edges crawl across 98% of a texel!
  </text>

  <!-- Left Panel: Light-Space Texel-Grid Snapping -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Texel-Grid Snapped: C_snap = round(C_raw / Δ_texel) · Δ_texel
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    World-Space Texel Lattice Remains Pinned · Static Shadow Edge Never Moves
  </text>

  <!-- Flat rock-steady shadow edge line left -->
  <line x1="110" y1="340" x2="530" y2="340" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="385" cy="340" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    All 17 Pan Steps: X_shadow ≡ 1.0000m · Crawl Drift = 0.0000m
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Peak-to-Peak Swim Span: 0.0000m · Sub-Texel Shimmer: 0.00%
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Pan Passes: 4.05 ms (O(1) Floor Snap) vs 46.13 ms (64-Texel Scan)
  </text>

  <!-- Right Panel: Continuous Unsnapped Swimming -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Continuous Unsnapped Frustum: C_raw = k · 0.035m
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Texel Grid Slides Over Static Geometry · Sawtooth Shadow Swimming!
  </text>

  <!-- Sawtooth swimming wave right -->
  <line x1="670" y1="340" x2="1090" y2="340" stroke="#475569" stroke-width="2.5" stroke-dasharray="5,4"/>
  <polyline points="670,340 745,275 745,385 925,275 925,385 1090,285" fill="none" stroke="#fb7185" stroke-width="4.5" stroke-linejoin="round"/>
  <circle cx="950" cy="365" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Pan Step-11 (C_raw=0.385m): X_shadow = 0.8850m (Sawtooth Crawl!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Peak-to-Peak Swim Span: 0.2450m (98.0% of Δ_texel = 0.2500m!)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Static Building Shadows Crawl &amp; Shimmer Whenever the Viewer Camera Pans
  </text>
</svg>
