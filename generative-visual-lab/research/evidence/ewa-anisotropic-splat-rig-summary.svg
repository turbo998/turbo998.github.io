<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 51 · EWA ANISOTROPIC COVARIANCE LOW-PASS REGULARIZATION VS SUB-PIXEL SPLAT SINGULARITY
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    EWA Σ+0.3I (θ=82.5° Conic⁻¹ = 3.1542 ≤ 3.33) vs Unregularized (58.70, 18.61× Spike, 9.65× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Adding pixel filter variance λ = 0.30 px² to the 2D covariance diagonal prevents grazing 3DGS splats from degenerating into sub-pixel needles
  </text>

  <!-- Left Panel: EWA Low-Pass Covariance -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Zwicker-Kerbl EWA Low-Pass: Σ'_2D = Σ_2D + 0.30·I₂
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    λ_max(Σ'⁻¹) ≤ 1/λ = 3.3333 px⁻² · Energy Scale c = √(det Σ / det Σ')
  </text>

  <!-- Bounded smooth curve below Nyquist ceiling left -->
  <line x1="100" y1="275" x2="540" y2="275" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="380" y="266" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Nyquist Limit 1/λ = 3.3333 px⁻²</text>
  <path d="M 105 425 Q 320 390 520 282" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="485" cy="285" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-15 (θ=82.5°): Conic⁻¹ = 3.1542 px⁻² ≤ 3.3333 (0 Spikes)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Singular Spike Stations: 0 / 17 · Minimum Filter Width ≥ 0.55 px
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.37 ms (2×2 Cramér) vs 3.59 ms (Jacobi Eigen, 9.65×)
  </text>

  <!-- Right Panel: Unregularized Singular Splat -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Unregularized Raw Covariance Inversion (λ = 0)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Foreshortened Minor Variance σ_y² → 0.017 px² Explodes Conic⁻¹!
  </text>

  <!-- Exploding singular curve right -->
  <line x1="660" y1="395" x2="1100" y2="395" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="950" y="386" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Limit = 3.3333 px⁻²</text>
  <path d="M 665 425 L 890 400 Q 1010 370 1080 245" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1045" cy="272" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-15 (θ=82.5°): Explodes to 58.6955 px⁻² (18.61× Spike!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Nyquist-Violating Stations: 6 / 17 (Peak 76.00× Spike at 88°!)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Causes Sub-Pixel Needle Popping &amp; Shimmering Aliasing in 3DGS
  </text>
</svg>
