  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    1 Sub-Pixel Glint (512.0) Explodes Entire Quad to 128.3750 (128.63×)!
  </text>

  <!-- Exploding curve right -->
  <line x1="660" y1="385" x2="1100" y2="385" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 665 385 Q 830 365 1090 238" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <line x1="930" y1="292" x2="930" y2="385" stroke="#fda4af" stroke-width="3" stroke-dasharray="4,3"/>
