  <path d="M 970 360 C 972 300, 915 260, 865 262 C 800 265, 762 325, 768 388 C 776 458, 855 495, 932 472 C 995 450, 1018 365, 985 295" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
