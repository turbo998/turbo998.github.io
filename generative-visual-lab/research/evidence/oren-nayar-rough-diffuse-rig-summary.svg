<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 111 · OREN-NAYAR V-CAVITY ROUGH DIFFUSE RETROREFLECTION VS LAMBERT LIMB DARKENING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Oren-Nayar V-Cavity (L(60°)=1.0000 Limb) vs Naive Lambert (0.5000, 273.82× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    V-groove retroreflection sin θ·tan θ·cos θ = sin²θ cancels foreshortening to keep the Full Moon &amp; clay flat to the rim
  </text>

  <!-- Left Panel: Oren-Nayar V-Cavity Retroreflection -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Oren-Nayar V-Cavity Retroreflection (L = cos θ + ⅔·sin²θ)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Full-Moon Flat Disk Profile · L(0°) = 1.0000 &amp; L(60°) = 1.0000
  </text>

  <!-- Flat/Arched curve staying near 1.0000 all the way to 60 deg -->
  <path d="M 95 295 Q 280 265 432 295 L 545 330" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="432" cy="295" r="8" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    0°: 1.0000 · Station-12 (60° Limb): 0.50 + ⅔(0.75) = 1.0000 · 80°: 0.8202
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Limb-Darkened Stations: 0 / 17 (Authentic Full Moon, Clay &amp; Plaster Rim)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.40 ms (Algebraic ON) vs 108.51 ms (64-Facet V-Cavity, 273.82×)
  </text>

  <!-- Right Panel: Naive Lambert Cosine Falloff -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Lambertian Cosine Falloff (L = cos θ)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Ignores V-Cavity facets Facing Light → −50% Dark Rim at 60°!
  </text>

  <!-- Dashed Oren-Nayar reference + Plunging Lambert cosine -->
  <path d="M 655 295 Q 840 265 992 295 L 1105 330" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 655 295 Q 880 330 1105 435" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="992" cy="378" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-12 (60°): cos 60° = 0.5000 (−0.5000 / −50.00% Limb Darkening!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Darkened Stations: 16 / 17 (Drops to 0.1736 at 80° vs 0.8202 Oren-Nayar)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Makes the Full Moon, Clay Pots &amp; Dry Sand Look Like Smooth Plastic Balls
  </text>
</svg>
