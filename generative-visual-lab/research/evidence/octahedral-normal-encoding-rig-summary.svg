<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 47 · SIGN-PRESERVING OCTAHEDRAL UNIT-NORMAL ENCODING VS POSITIVE-Z HEMISPHERE FLIP
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="800">
    Octahedral Unfold (θ=130° → n_z = -0.6428, 0.00° Error) vs Positive-Z (+0.6428, 80.00° Flip, 2.20× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Unfolding the lower L₁ octahedron (n_z &lt; 0) into the 4 corners of [-1, 1]² via signNotZero preserves full-sphere 360° normals without trig calls
  </text>

  <!-- Left Panel: Sign-Preserving Octahedral Encoding -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Cigolle Sign-Preserving L₁ Octahedral Unfold
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    p = n / ||n||₁, n_z &lt; 0 ⇒ (1 − |p.yx|) ⊙ signNotZero(p.xy)
  </text>

  <!-- Full cosine wave from +1 to -0.94 left -->
  <line x1="100" y1="350" x2="540" y2="350" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 110 260 Q 220 265 320 350 T 520 438" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="445" cy="408" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-13 (θ=130°): Decoded n_z = -0.6428 (0.00° Error)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Max Angular Error: 0.00° · Lower-Hemisphere Flips: 0 / 17
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 1.03 ms (L₁ Octahedral) vs 2.27 ms (Spherical Trig, 2.20×)
  </text>

  <!-- Right Panel: Naive Positive-Z Hemisphere Flip -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Positive-Z Hemisphere: n_z = +√(1 − n_x² − n_y²)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Erases Negative Z Sign Across Entire Lower Hemisphere (θ &gt; 90°)!
  </text>

  <!-- Folded V-bounce wave right -->
  <line x1="660" y1="350" x2="1100" y2="350" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 670 260 Q 780 265 880 350 T 1080 438" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 670 260 Q 780 265 880 350 Q 980 280 1080 262" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1005" cy="292" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-13 (θ=130°): Flipped to n_z = +0.6428 (80.00° Inversion!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Flipped Lower-Hemisphere Stations: 7 / 17 (Max Error 140.00°)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Inverts Back-Facing World Normals &amp; Grazing View-Space Bump Normals
  </text>
</svg>
