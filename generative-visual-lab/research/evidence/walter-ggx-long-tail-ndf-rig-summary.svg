  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">ROUND 133 · 143RD DEMO · WALTER ET AL. (EGSR 2007) &amp; DISNEY GGX LONG-TAILED SPECULAR NDF</text>
  <text x="56" y="102" fill="#f8fafc" font-size="25" font-weight="800">GGX Cauchy-Lorentz Envelope 1/(1+s²) vs Beckmann Gaussian exp(−s²/2)</text>
  <text x="56" y="130" fill="#94a3b8" font-size="14">Preserves wide metallic halo A(2α) = 0.2000 &amp; A(3α) = 0.1000 (81× brighter NDF at 3α) vs Beckmann exponential cliff across 10/17 outer stations</text>

  <!-- Left panel: 17-station root-intensity envelope A(s) -->
  <rect x="56" y="152" width="660" height="336" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="80" y="182" fill="#e2e8f0" font-size="15" font-weight="700">Specular Slope Root-Amplitude A(s) Across Normalized Slope s = tan θ_h / α ∈ [0.00, 4.00]</text>

  <!-- Grid lines: y=215(1.00), y=325(0.50), y=391(0.20), y=413(0.10), y=435(0.00) -->
  <line x1="115" y1="215" x2="685" y2="215" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="325" x2="685" y2="325" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="391" x2="685" y2="391" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="413" x2="685" y2="413" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="435" x2="685" y2="435" stroke="#334155"/>

  <text x="105" y="219" fill="#94a3b8" font-size="11" text-anchor="end">1.00</text>
  <text x="105" y="329" fill="#94a3b8" font-size="11" text-anchor="end">0.50</text>
  <text x="105" y="395" fill="#94a3b8" font-size="11" text-anchor="end">0.20</text>
  <text x="105" y="417" fill="#94a3b8" font-size="11" text-anchor="end">0.10</text>
  <text x="105" y="439" fill="#94a3b8" font-size="11" text-anchor="end">0.00</text>

  <!-- GGX Cauchy-Lorentz A_GGX(s) = 1/(1+s²): s=0(1.0)->215, s=0.5(0.8)->259, s=1.0(0.5)->325, s=1.5(0.3077)->367, s=2.0(0.20)->391, s=3.0(0.10)->413, s=4.0(0.0588)->422 -->
  <polyline fill="none" stroke="url(#ok)" stroke-width="4" points="115,215 186,259 257,325 329,367 400,391 542,413 685,422"/>
  <circle cx="115" cy="215" r="5" fill="#38bdf8"/>
  <circle cx="257" cy="325" r="5" fill="#38bdf8"/>
  <circle cx="400" cy="391" r="6" fill="#10b981"/>
  <circle cx="542" cy="413" r="6" fill="#10b981"/>
  <circle cx="685" cy="422" r="5" fill="#10b981"/>
  <text x="380" y="378" fill="#34d399" font-size="12" font-weight="700">GGX Long-Tail 1/(1+s²): A(2α)=0.2000, A(3α)=0.1000 (81× NDF at 3α)</text>

  <!-- Beckmann Gaussian A_Beck(s) = exp(-s²/2): s=0(1.0)->215, s=0.5(0.8825)->241, s=1.0(0.6065)->302, s=1.5(0.3247)->364, s=2.0(0.1353)->405, s=3.0(0.0111)->433, s=4.0(0.0003)->435 -->
  <polyline fill="none" stroke="url(#danger)" stroke-width="3.5" stroke-dasharray="7 4" points="115,215 186,241 257,302 329,364 400,405 542,433 685,435"/>
  <circle cx="400" cy="405" r="5" fill="#f97316"/>
  <circle cx="542" cy="433" r="6" fill="#ef4444"/>
  <circle cx="685" cy="435" r="6" fill="#ef4444"/>
  <text x="412" y="429" fill="#f87171" font-size="12" font-weight="700">Beckmann exp(−s²/2) Collapses to 0.0111 at 3α &amp; 0.0003 at 4α!</text>

  <!-- X-axis labels -->
  <text x="115" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 0 (0.0α)</text>
  <text x="257" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 4 (1.0α)</text>
  <text x="400" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 8 (2.0α)</text>
  <text x="542" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 12 (3.0α)</text>
  <text x="685" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 16 (4.0α)</text>

  <!-- Right panel: KPI cards -->
  <rect x="740" y="152" width="404" height="104" rx="12" fill="#111827" stroke="#0284c7"/>
  <text x="764" y="180" fill="#38bdf8" font-size="12" font-weight="700">STATION 12 (3α METALLIC HALO, s = 3.0000)</text>
  <text x="764" y="212" fill="#f8fafc" font-size="21" font-weight="800">A = 0.1000 vs 0.0111 (81× NDF)</text>
  <text x="764" y="238" fill="#94a3b8" font-size="12">D_GGX(3α) = 0.0100 vs D_Beckmann(3α) = 0.000123</text>

  <rect x="740" y="268" width="404" height="104" rx="12" fill="#111827" stroke="#ef4444"/>
  <text x="764" y="296" fill="#f87171" font-size="12" font-weight="700">OUTER SPECULAR BLOOM TAIL (s &gt; 1.25α)</text>
  <text x="764" y="328" fill="#f8fafc" font-size="21" font-weight="800">0/17 Starved vs 10/17 Collapsed</text>
  <text x="764" y="354" fill="#94a3b8" font-size="12">Matches MERL measured chrome &amp; metal BRDF tails without exp()</text>

  <rect x="740" y="384" width="404" height="104" rx="12" fill="#111827" stroke="#10b981"/>
  <text x="764" y="412" fill="#34d399" font-size="12" font-weight="700">8,192-PASS THROUGHPUT VS 64-STEP LORENTZIAN ODE</text>
  <text x="764" y="444" fill="#f8fafc" font-size="21" font-weight="800">0.31 ms vs 27.48 ms (90.03×)</text>
  <text x="764" y="470" fill="#94a3b8" font-size="12">Pure rational 1/(1+s²) matches ODE quadrature within &lt;1e-8</text>

  <!-- Footer provenance bar -->
  <rect x="56" y="508" width="1088" height="72" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="80" y="538" fill="#e2e8f0" font-size="13" font-weight="700">58-Solid 17-Station GGX Long-Tail Goniophotometer Bench · Sealed Evidence: demos/walter-ggx-long-tail-ndf-rig/report.json</text>
  <text x="80" y="562" fill="#94a3b8" font-size="12">Provenance: Measured on Windows 11 Chromium Headless WebGL · 12/12 checks passed · Zero runtime model APIs</text>
</svg>
