<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 72 · YUKSEL CENTRIPETAL CATMULL-ROM SPLINE (α=0.5) VS UNIFORM CATMULL-ROM (α=0.0) FIGURE-8 LOOP
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Yuksel Centripetal α=0.5 (y = 0.1835m, dx/du = +1.62, 0 Loops) vs Uniform α=0.0 (y = 1.0000m, dx/du = −1.00 Loop, 41.42×)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Spacing knots by √chord-length (Δt_k = ∥P_{k+1}−P_k∥^0.5) prevents self-intersecting loops &amp; 5.45× overshoot between uneven keyframes
  </text>

  <!-- Left Panel: Yuksel Centripetal Catmull-Rom -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Yuksel Centripetal Catmull-Rom (α = 0.5 · √Chord Knots)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Δt_01 = 4.02, Δt_12 = 1.41 · Tight 0.1835m Fillet &amp; Monotonic dx/du &gt; 0
  </text>

  <!-- Tight clean arch left -->
  <line x1="95" y1="415" x2="545" y2="415" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="102" y="434" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">P₁(0,0) → P₂(2,0) Short 2.0m Span</text>
  <path d="M 120 415 Q 320 355 520 415" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="385" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (u=0.50): y = 0.1835 m · Forward Velocity dx/du = +1.6184 m/u
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Retrograde Self-Intersection Stations: 0 / 17 (0 Loops / 0 Cusps)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 2.08 ms (Horner Cubic) vs 86.29 ms (Pyramid, 41.42×)
  </text>

  <!-- Right Panel: Naive Uniform Catmull-Rom -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Uniform Catmull-Rom (α = 0.0 · Δt_k = 1.0)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    16.12m Outer Tangent Overwhelms 2.0m Span → Figure-8 Loop &amp; 5.45× Overshoot!
  </text>

  <!-- Self-intersecting loop right -->
  <line x1="655" y1="415" x2="1105" y2="415" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 740 415 C 1020 390, 740 245, 880 245 C 1020 245, 740 390, 1020 415" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="880" cy="245" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (u=0.50): y = 1.0000 m (+0.8165m Bulge) · dx/du = −1.0000 m/u (Backward!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Retrograde Loop Stations: 5 / 17 · Overshoot Corrupted: 15 / 17
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Camera Violently Reverses Direction &amp; Ties a Knot in Mid-Air!
  </text>
</svg>
