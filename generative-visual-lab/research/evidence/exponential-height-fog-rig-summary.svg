<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 77 · WENZEL CLOSED-FORM EXPONENTIAL HEIGHT-FOG LINE INTEGRAL VS VALLEY-DENSITY MOUNTAIN WHITEOUT
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Wenzel Line Integral (Peak 240m T = 0.5380, 0 Whiteout) vs Camera-Density Fog (T = 0.0498, 3.50× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Integrating exponential fog falloff (1 − e^(−kΔh))/(kΔh) along upward rays clears mountain peaks above valley mist
  </text>

  <!-- Left Panel: Wenzel Closed-Form Line Integral -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Wenzel Closed-Form Height-Fog Line Integral
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    τ(Δh) = σ₀·L·(1−e^(−kΔh))/(kΔh) · Clears Smoothly with Altitude
  </text>

  <!-- Rising transmittance curve left -->
  <line x1="95" y1="305" x2="545" y2="305" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="102" y="295" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">240m Peak Transmittance T = 0.5380</text>
  <path d="M 105 428 Q 300 355 535 305" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="535" cy="305" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-16 (h=240m Peak): τ = 0.6199 · T_fog = 0.5380 (10.81× Clearer!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Mountain Whiteout Stations: 0 / 17 (Natural Valley Mist Layer)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 3.90 ms (Closed-Form) vs 13.64 ms (64-Step March, 3.50×)
  </text>

  <!-- Right Panel: Naive Camera-Altitude Extrapolation -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Camera-Altitude Density Extrapolation (τ = σ₀·L)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Applies Valley Floor σ₀=0.015 to Entire Ray → Buries 240m Peak in Soup!
  </text>

  <!-- Flat crushed line right -->
  <line x1="655" y1="305" x2="1105" y2="305" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="665" y1="428" x2="1095" y2="428" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1095" cy="428" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-16 (h=240m Peak): Crushed to T = 0.0498 (−0.4882 Whiteout Loss!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Whiteout-Corrupted Stations: 16 / 17 (All Elevated Slopes Buried)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Turns Shallow Valley Ground Mist into an Infinite Vertical Fog Wall
  </text>
</svg>
