<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 42 · DE CASTELJAU DYADIC SUBDIVISION &amp; WANG FLATNESS BOUND VS CHORD CLIPPING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    De Casteljau Dyadic Tree (y(0.5) = 3.0000u, 0% Clip) vs Coarse Uniform Chords (y = 2.6667u, -11.11% Chop!)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    When inner handles P₁, P₂ pinch together at a hairpin turn, straddling uniform chords chop off 0.3333u of the peak!
  </text>

  <!-- Left Panel: De Casteljau Dyadic Subdivision -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ De Casteljau Dyadic Midpoint + Wang Flatness Bound
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    L₀ = ¾ max(||Δ²P₀||, ||Δ²P₁||) = 3.94u · Exact Midpoint Apex Hit
  </text>

  <!-- Smooth hairpin arch left -->
  <line x1="100" y1="270" x2="540" y2="270" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 120 435 C 295 270, 345 270, 520 435" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="270" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    t=0.50 Station-8: M = (P₀+3P₁+3P₂+P₃)/8 = (0.0000, 3.0000u)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Apex Chord Error: 0.0000u · Convex-Hull Containment Guaranteed
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 11.73 ms (Dyadic Tree) vs 14.76 ms (Math.pow Bernstein)
  </text>

  <!-- Right Panel: Coarse Uniform Chord Clipping -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Coarse Straddling Uniform Chords: t ∈ {0, 1/3, 2/3, 1}
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Straddles High-Curvature Apex · Chops Hairpin into Flat Trapezoid!
  </text>

  <!-- Flat-topped clipped trapezoid right -->
  <path d="M 680 435 C 855 270, 905 270, 1080 435" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="5,4"/>
  <polyline points="680,435 815,305 945,305 1080,435" fill="none" stroke="#fb7185" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="880" cy="305" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    t=0.50 Station-8: Clipped to y = 2.6667u (-0.3333u Flat Top!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Apex Height Loss: -11.11% (-0.3333u Beveled Peak Error)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Fixed Parameter Strides Miss High-Curvature Hairpin Bends
  </text>
</svg>
