<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 38 · REVERSED-Z FLOAT32 DEPTH BUFFER VS STANDARD FORWARD-Z Z-FIGHTING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    Reversed-Z Float32 (Δz_min = 0.00031m at 4096m) vs Forward-Z (Δz_min = 10.00m, 32768× Worse!)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    With z_near = 0.10m, Forward-Z (1 − z_near/z) packs far depths against 1.0 (ULP = 2⁻²⁴), collapsing 0.25m decals into Z-fighting!
  </text>

  <!-- Left Panel: Reversed-Z Float32 -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Reversed-Z Float32: d(z) = z_near / z (Near=1, Far=0)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Float32 Exponent Scales with 1/z · Quasi-Logarithmic Depth Precision
  </text>

  <!-- 0.25m decal threshold line + low error curve left -->
  <line x1="100" y1="305" x2="540" y2="305" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="535" y="295" fill="#fef08a" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="end">0.25m DECAL GAP THRESHOLD</text>
  <line x1="110" y1="435" x2="525" y2="365" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="525" cy="365" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    z=4096m Station-12: Δz_min = 0.00031m (0.31mm) · 32,768× Finer!
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Z-Fighting Collapsed Stations: 0 / 13 · Early-Z Preserved
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 13-Octave Passes: 8.81 ms (Closed-Form) vs 55.98 ms (Bitwise nextafterf)
  </text>

  <!-- Right Panel: Standard Forward-Z -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Standard Forward-Z: d(z) = 1.0 − z_near / z (Near=0, Far=1)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Catastrophic Cancellation Near 1.0 · Error Grows Quadratically as z²!
  </text>

  <!-- 0.25m decal threshold line + Steep z^2 error curve right -->
  <line x1="660" y1="355" x2="1100" y2="355" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="880" y="345" fill="#fef08a" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">0.25m DECAL THRESHOLD BREACHED!</text>
  <path d="M 670 435 Q 880 390 1085 248" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1085" cy="248" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    z=4096m Station-12: Δz_min = 10.00m (0.25m Decal Collapses to Δd = 0!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Z-Fighting Collapsed Stations: 3 / 13 (z ≥ 1024m)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    1.0 − 0.0000244 Throws Away 15 Mantissa Bits → Severe Coplanar Shimmer
  </text>
</svg>
