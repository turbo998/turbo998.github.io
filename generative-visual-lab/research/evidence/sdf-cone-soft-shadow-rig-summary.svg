<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 94 · QUILEZ-WRIGHT SDF CONE-TRACED SOFT SHADOW PENUMBRA VS HARD SPHERE-TRACED UMBRA
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Quilez 1-Ray SDF Cone Shadow (d=0m S = 0.5000) vs Hard Binary Trace (S = 0.0000, 40.86× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Tracking closest unoccluded sphere ratio k·d_SDF/t along a single ray reconstructs noise-free area-light penumbras
  </text>

  <!-- Left Panel: Quilez-Wright SDF Cone-Ratio Soft Shadow -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Quilez-Wright 1-Ray SDF Cone Soft Shadow
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    u = clamp(0.5 + 0.5·k·d_min/t, 0, 1) · S_cone = u²(3 − 2u)
  </text>

  <!-- Smooth C1 penumbra ramp left -->
  <path d="M 95 430 L 185 430 C 260 430, 380 265, 455 265 L 540 265" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="347" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (d_min=0.00m Boundary): S_cone = 0.5000 (Exact 50% Solar Disk!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Clipped Penumbra Stations: 0 / 17 (Noise-Free 2.0m Soft Penumbra)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.33 ms (1-Ray Cone) vs 13.62 ms (64-Ray Disk, 40.86×)
  </text>

  <!-- Right Panel: Naive Hard Binary Sphere-Tracing -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Hard Binary Sphere-Trace (d_min &gt; 0 ? 1 : 0)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Discards Closest-Approach Distance d_min → Collapses 2.0m Penumbra to Step!
  </text>

  <!-- Hard binary step vs smooth penumbra right -->
  <path d="M 655 430 L 745 430 C 820 430, 940 265, 1015 265 L 1100 265" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 655 430 L 880 430 L 880 265 L 1100 265" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="880" cy="430" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (d_min=0.00m): Snaps to S = 0.0000 (−0.5000 Step Cliff!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Corrupted Penumbra Stations: 9 / 17 (All 9 Penumbra Stations Clipped)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Loses Contact-Hardening Distance Ratio d_min / t_occ Completely
  </text>
</svg>
