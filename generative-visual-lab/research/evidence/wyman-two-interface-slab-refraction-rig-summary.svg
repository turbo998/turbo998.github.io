  <text x="48" y="88" fill="#f8fafc" font-size="22" font-weight="800">Two-Interface Slab Refraction (θ_exit = θ_i, 0.00° Warp) vs Single-Interface Fish-Eye Warp (−38.96°)</text>
  <text x="48" y="112" fill="#94a3b8" font-size="13.5">Refracting across both air→glass and glass→air interfaces eliminates 24.74° (60°) and 38.96° (80°) prism distortion (2.85 ms vs 125.34 ms, 44.03× faster)</text>

