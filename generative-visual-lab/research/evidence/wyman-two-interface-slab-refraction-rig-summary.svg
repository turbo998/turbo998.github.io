  <text x="646" y="158" fill="#38bdf8" font-size="12" font-weight="700">WYMAN (SIGGRAPH 2005) TWO-INTERFACE SLAB REFRACTION</text>
  <text x="646" y="186" fill="#f8fafc" font-size="17" font-weight="800">sin θ_exit = n · sin θ_t ≡ sin θ_i  →  0.0000° Angular Deflection</text>
  <text x="646" y="212" fill="#94a3b8" font-size="12.5">St 6 (30°→19.47°→30°) · St 12 (60°→35.26°→60°, Δx=0.5125m) · 0/17 Warped</text>

