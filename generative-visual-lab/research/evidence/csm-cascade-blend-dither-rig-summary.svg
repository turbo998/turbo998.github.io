<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 105 · 115TH DEMO · CSM HERMITE-DITHERED CASCADE TRANSITION VS HARD FRUSTUM-SPLIT CLIFF
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    CSM Hermite C1 Blend (W(20m)=1.5000×) vs Hard Frustum Split (2.0000×, 15.94× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Cubic Hermite weight s = u²(3 − 2u) over a 4.0m overlap zone eliminates the razor-sharp 20.0m cascade resolution seam
  </text>

  <!-- Left Panel: Hermite C1 Dithered Cascade Blend -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Hermite C1 Dithered Cascade Blend (s = u²(3 − 2u))
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Zero Slope &amp; Step Discontinuity Across z ∈ [18.0m, 22.0m] Overlap Zone
  </text>

  <!-- Smooth Cubic Hermite S-Curve -->
  <path d="M 95 425 C 235 425, 405 265, 545 265" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="345" r="8" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    18m: 1.0000× · Station-8 (20m Split): 1.5000× · 21m: 1.8438× · 22m: 2.0000×
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Corrupted Transition Stations: 0 / 17 (Invisible Cascade Hand-Off)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.47 ms (Hermite C1) vs 7.42 ms (64-Stratum, 15.94×)
  </text>

  <!-- Right Panel: Naive Hard Frustum Split -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Hard Frustum Split (z &lt; 20m ? 1.00× : 2.00×)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Instantaneous +1.0000× Resolution Step Cliff Sweeping Ahead of Camera!
  </text>

  <!-- Dashed Hermite reference + Hard Step Function -->
  <path d="M 655 425 C 795 425, 965 265, 1105 265" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 655 425 L 880 425 L 880 265 L 1105 265" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="880" cy="265" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (20m Split): Jumps 1.0000× → 2.0000× (+0.5000× Midpoint Error!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Corrupted Stations: 15 / 17 (All 15 Interior Overlap Stations Mismatched)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Draws a Creeping Horizontal Shadow Seam Across Roads &amp; Grass
  </text>
</svg>
