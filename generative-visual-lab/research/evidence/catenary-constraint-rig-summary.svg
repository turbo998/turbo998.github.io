<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 25 · POSITION-BASED DYNAMICS (PBD) &amp; GAUSS-SEIDEL DISTANCE CONSTRAINTS
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800">
    Symmetric Gauss-Seidel Sweeps (9.600 u Inextensible) vs Single-Pass Jacobi (10.12 u Sag)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Single-pass relaxation propagates boundary pin tension by only 1 link per pass, leaving interior cable segments stretched by +11.1%.
  </text>

  <!-- Left Panel: Symmetric Gauss-Seidel Projection -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Symmetric Gauss-Seidel In-Place Sweeps (48 Sweeps)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Updates p_i &amp; p_{i+1} In-Place (w_0 = w_12 = 0) · Tension Reaches All 12 Links
  </text>

  <!-- Towers and inextensible catenary curve -->
  <rect x="104" y="260" width="14" height="200" rx="4" fill="#64748b"/>
  <rect x="522" y="260" width="14" height="200" rx="4" fill="#64748b"/>
  <path d="M 111 270 Q 320 445 529 270" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <circle cx="111" cy="270" r="8" fill="#f8fafc" stroke="#10b981" stroke-width="3"/>
  <circle cx="529" cy="270" r="8" fill="#f8fafc" stroke="#10b981" stroke-width="3"/>
  <circle cx="320" cy="358" r="9" fill="#38bdf8" stroke="#f8fafc" stroke-width="2.5"/>
  <text x="320" y="392" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Exact Total Length = 9.6089 u (Rest 9.60 u)
  </text>
  <text x="320" y="414" fill="#94a3b8" font-family="Consolas, monospace" font-size="12" text-anchor="middle">
    Max Single-Link Stretch Error: 0.003602 u
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Total Cable Length: 9.6089 / 9.6000 u · Pin Slip: 0.000000 u
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 12-Link Solves: 1008.09 ms (In-Place Float64) vs 1160.49 ms (Alloc)
  </text>

  <!-- Right Panel: Single-Pass Jacobi Relaxation -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Single-Pass Parallel Jacobi (Rubbery Cable Sag)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Wave Speed = 1 Link/Pass · Midspan Links Never Feel Tower Pin Tension
  </text>

  <!-- Towers, reference ghost curve, and sagging Jacobi curve -->
  <rect x="664" y="260" width="14" height="200" rx="4" fill="#64748b"/>
  <rect x="1082" y="260" width="14" height="200" rx="4" fill="#64748b"/>
  <path d="M 671 270 Q 880 445 1089 270" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="5,4"/>
  <path d="M 671 270 Q 880 565 1089 270" fill="none" stroke="#fb7185" stroke-width="6" stroke-linecap="round"/>
  <circle cx="671" cy="270" r="8" fill="#f8fafc" stroke="#fb7185" stroke-width="3"/>
  <circle cx="1089" cy="270" r="8" fill="#f8fafc" stroke="#fb7185" stroke-width="3"/>
  <circle cx="880" cy="418" r="9" fill="#fb7185" stroke="#f8fafc" stroke-width="2.5"/>
  <text x="880" y="452" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Rubbery Total Length = 10.12 u (+0.52 u Stretch!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Distorted Cable Length: 10.12 u (vs Rest 9.60 u)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Max Single-Link Stretch: 0.1459 u · Unacceptable Elastic Sag
  </text>
</svg>
