<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 68 · SLOAN WINDOWED L₂ SPHERICAL HARMONICS VS GIBBS NEGATIVE RINGING &amp; ANTIPODAL REBOUND
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Sloan Windowed SH (E_120° = +0.1875 ≥ 0, 0 Ringing) vs Unwindowed L₂ SH (E_120° = −0.1563 &amp; +0.2238 Backlight, 11.23× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Band weights (w₀=1, w₁=0.75, w₂=0.40) factor the L₂ kernel into (3/16)I₀(1+μ)² ≥ 0, eliminating negative black rings &amp; false backlights
  </text>

  <!-- Left Panel: Sloan Non-Negative Windowed SH -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Sloan Non-Negative Windowed L₂ SH (w₁=0.75, w₂=0.40)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    E_win(μ) = (3/16)I₀(1 + μ)² ≥ 0.0000 · Strictly Non-Negative &amp; Monotonic
  </text>

  <!-- Smooth monotonic decay left -->
  <line x1="100" y1="395" x2="540" y2="395" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="415" y="385" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Zero Floor E = 0.0000</text>
  <path d="M 105 248 Q 260 365 525 395" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="385" cy="378" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-11 (θ=120°): E_win = +0.1875 · Station-16 (170°): +0.0002 (≥ 0)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Negative Ringing &amp; Antipodal Rebound: 0.0000 Across All 17 Angles
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.50 ms (4-Op Horner) vs 5.58 ms (9-Basis Trig, 11.23×)
  </text>

  <!-- Right Panel: Naive Unwindowed L2 SH -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Unwindowed L₂ SH (w₁=1.0, w₂=1.0 · Gibbs Ringing)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Dips to −0.1563 Below Zero at 120° Then Rebounds to +0.2238 at 170°!
  </text>

  <!-- Dipping below zero and rebounding right -->
  <line x1="660" y1="395" x2="1100" y2="395" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 665 240 Q 815 395 945 426 Q 1020 415 1090 368" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="945" cy="422" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="1085" cy="368" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    θ=120°: E_raw = −0.1563 (Negative Ringing!) · θ=170°: +0.2238 (False Backlight!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Corrupted Back-Facing Stations: 7 / 17 (Peak −0.1562 Below Zero)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Subtracts Light in Shadow Bands &amp; Glows Falsely on the Back of Heads
  </text>
</svg>
