<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 57 · KULLA-CONTY MULTIPLE-SCATTERING GGX ENERGY COMPENSATION VS SINGLE-SCATTERING DARKENING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Kulla-Conty Compensated (White Furnace E = 1.0000, 0.00% Loss) vs Single-Scattering GGX (E = 0.6810, −31.90% Loss, 28.88× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Adding reciprocity-preserving multiple-bounce lobe f_ms = F_ms·(1−E(μ_o))(1−E(μ_i))/(π(1−E_avg)) prevents rough metals turning muddy black
  </text>

  <!-- Left Panel: Kulla-Conty Multiple-Scattering Compensated -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Kulla-Conty Multiple-Scattering Compensated (f_ss + f_ms)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Recovers Inter-Facet Bounce Energy 1 − E(μ_o) · Exact White Furnace E = 1.0000
  </text>

  <!-- Flat E=1.0000 line left -->
  <line x1="100" y1="290" x2="540" y2="290" stroke="#34d399" stroke-width="5"/>
  <path d="M 100 292 Q 300 320 530 410" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="5,4"/>
  <text x="275" y="388" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">f_ss alone drops to 0.5881</text>
  <circle cx="465" cy="290" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-14 (α=0.88): E_total = 1.0000 (+31.90% Bounce Recovered)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    White-Furnace Energy Loss: 0.00% Across All 17 Stations
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 1.28 ms (Closed-Form) vs 36.88 ms (64-Step Quad, 28.88×)
  </text>

  <!-- Right Panel: Naive Single-Scattering GGX -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Single-Scattering GGX (f_ss Only · Discards Multi-Bounce)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Loses −31.90% at α=0.88 and −41.19% at α=1.00!
  </text>

  <!-- Dropping curve right -->
  <line x1="660" y1="290" x2="1100" y2="290" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 660 292 Q 860 320 1090 410" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <line x1="1025" y1="290" x2="1025" y2="386" stroke="#fda4af" stroke-width="3" stroke-dasharray="4,3"/>
  <circle cx="1025" cy="386" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-14 (α=0.88): E_ss = 0.6810 (−31.90% Energy Lost!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Darkened Rough Stations: 13 / 17 (Peak −41.19% Darkening)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Turns Brushed Gold, Copper &amp; Satin Chrome into Muddy Charcoal
  </text>
</svg>
