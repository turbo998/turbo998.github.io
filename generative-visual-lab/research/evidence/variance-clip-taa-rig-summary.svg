<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 46 · YCOCG 3×3 VARIANCE AABB RAY-CLIPPING VS UNCLAMPED EMA GHOSTING IN TAA
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="800">
    YCoCg Variance Clip (Frame-8 Y = 0.2349, 97.85% Ghost Cut) vs Unclamped EMA (Y = 1.8200 Smear!)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Ray-clipping stale highlight history H = 2.0000 onto the 3×3 YCoCg [μ − γσ, μ + γσ] box eliminates multi-frame disocclusion trails
  </text>

  <!-- Left Panel: YCoCg Variance AABB Ray-Clipping -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ YCoCg 3×3 Variance AABB Ray-Clip (Salvi 2016)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    H_clip = μ + (H − μ) / max(1, |(H − μ)/(γσ)|_∞) · Instant Disocclusion Reset
  </text>

  <!-- Clean step response left -->
  <polyline points="100,280 290,280 310,432 520,435" fill="none" stroke="#34d399" stroke-width="5" stroke-linejoin="round"/>
  <line x1="300" y1="255" x2="300" y2="455" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="310" cy="432" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Frame-8 Disocclusion: Clipped H=0.2387 → Resolved Y = 0.2349
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Ghost Overshoot: 0.0000 · Step Ghost Suppression: 97.85%
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Frame Passes: 28.84 ms (Closed-Form Slab) vs 35.61 ms (52-Step Bisect, 1.23×)
  </text>

  <!-- Right Panel: Unclamped EMA Ghosting Trail -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Unclamped Exponential History Blending (α = 0.90)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Mixes Stale Highlight History H = 2.0000 Into Dark Background!
  </text>

  <!-- Slow exponential decay ghost trail right -->
  <polyline points="660,280 850,280 870,435 1080,435" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 660 280 L 850 280 Q 940 310 1080 385" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="870" cy="296" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Frame-8 Disocclusion: Unclamped Y = 1.8200 (+1.5813 Ghost!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Peak Ghosting Overshoot: +1.5813 Above Variance Envelope
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Leaves 9-Frame Glowing Smear Trail Behind Moving Highlights
  </text>
</svg>
