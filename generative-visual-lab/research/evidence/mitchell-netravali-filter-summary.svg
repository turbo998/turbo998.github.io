  <line x1="100" y1="295" x2="540" y2="295" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="100" y1="420" x2="540" y2="420" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 110 420 Q 195 424 250 412 C 300 390, 340 325, 390 303 Q 445 290 530 295" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
