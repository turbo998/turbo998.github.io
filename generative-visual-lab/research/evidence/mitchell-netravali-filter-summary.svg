  <line x1="660" y1="420" x2="1100" y2="420" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 670 420 Q 755 456 810 420 C 860 375, 900 340, 950 295 Q 1005 258 1090 295" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
