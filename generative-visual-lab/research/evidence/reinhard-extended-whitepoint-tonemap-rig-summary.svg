<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">ROUND 132 · 142ND DEMO · REINHARD ET AL. (SIGGRAPH 2002 EQ. 4) EXTENDED WHITE-POINT TONE MAPPING</text>
  <text x="56" y="102" fill="#f8fafc" font-size="25" font-weight="800">Extended Reinhard L(1 + L/L_white²)/(1 + L) vs Simple L/(1 + L) Grey Ceiling</text>
  <text x="56" y="130" fill="#94a3b8" font-size="14">Reaches exact display white T(4.0) = 1.0000 at L_white = 4.0 (0/17 starved) vs simple L/(1+L) stalling at 0.8000 (−20% highlight ceiling loss)</text>

  <!-- Left panel: 17-station tone mapping curve -->
  <rect x="56" y="152" width="660" height="336" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="80" y="182" fill="#e2e8f0" font-size="15" font-weight="700">Mapped Display Tone T(L) Across HDR Luminance L ∈ [0.00, 4.00] (L_white = 4.00)</text>

  <!-- Grid lines: y=215(1.00), y=259(0.80), y=325(0.50), y=380(0.25), y=435(0.00) -->
  <line x1="115" y1="215" x2="685" y2="215" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="259" x2="685" y2="259" stroke="#ef4444" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <line x1="115" y1="325" x2="685" y2="325" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="380" x2="685" y2="380" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="435" x2="685" y2="435" stroke="#334155"/>

  <text x="105" y="219" fill="#94a3b8" font-size="11" text-anchor="end">1.00</text>
  <text x="105" y="263" fill="#f87171" font-size="11" text-anchor="end">0.80</text>
  <text x="105" y="329" fill="#94a3b8" font-size="11" text-anchor="end">0.50</text>
  <text x="105" y="384" fill="#94a3b8" font-size="11" text-anchor="end">0.25</text>
  <text x="105" y="439" fill="#94a3b8" font-size="11" text-anchor="end">0.00</text>

  <!-- Extended Reinhard T_ext(L): L=0(0)->435, L=1(0.5313)->318, L=2(0.7500)->270, L=3(0.8906)->239, L=4(1.0000)->215 -->
  <polyline fill="none" stroke="url(#ok)" stroke-width="4" points="115,435 257,318 400,270 542,239 685,215"/>
  <circle cx="115" cy="435" r="5" fill="#38bdf8"/>
  <circle cx="257" cy="318" r="5" fill="#38bdf8"/>
  <circle cx="400" cy="270" r="6" fill="#10b981"/>
  <circle cx="542" cy="239" r="5" fill="#10b981"/>
  <circle cx="685" cy="215" r="6" fill="#10b981"/>
  <text x="360" y="206" fill="#34d399" font-size="12" font-weight="700">Extended Reinhard: T(2.0)=0.7500, T(4.0)=1.0000 Full White (0/17 Starved)</text>

  <!-- Simple Reinhard T_naive(L): L=0(0)->435, L=1(0.5000)->325, L=2(0.6667)->288, L=3(0.7500)->270, L=4(0.8000)->259 -->
  <polyline fill="none" stroke="url(#danger)" stroke-width="3.5" stroke-dasharray="7 4" points="115,435 257,325 400,288 542,270 685,259"/>
  <circle cx="257" cy="325" r="4.5" fill="#f97316"/>
  <circle cx="400" cy="288" r="5.5" fill="#ef4444"/>
  <circle cx="542" cy="270" r="5.5" fill="#ef4444"/>
  <circle cx="685" cy="259" r="6" fill="#ef4444"/>
  <text x="392" y="308" fill="#f87171" font-size="12" font-weight="700">Simple L/(1+L) Stalls at T(4.0) = 0.8000 (−20% Grey Ceiling!)</text>

  <!-- X-axis labels -->
  <text x="115" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 0 (L=0.00)</text>
  <text x="257" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 4 (L=1.00)</text>
  <text x="400" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 8 (L=2.00)</text>
  <text x="542" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 12 (L=3.00)</text>
  <text x="685" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 16 (L_w=4.00)</text>

  <!-- Right panel: KPI cards -->
  <rect x="740" y="152" width="404" height="104" rx="12" fill="#111827" stroke="#0284c7"/>
  <text x="764" y="180" fill="#38bdf8" font-size="12" font-weight="700">WHITE-POINT CEILING (STATION 16, L_white = 4.00)</text>
  <text x="764" y="212" fill="#f8fafc" font-size="21" font-weight="800">T = 1.0000 vs T = 0.8000 (−20%)</text>
  <text x="764" y="238" fill="#94a3b8" font-size="12">Numerator factor (1 + L/L_w²) recovers full display dynamic range</text>

  <rect x="740" y="268" width="404" height="104" rx="12" fill="#111827" stroke="#ef4444"/>
  <text x="764" y="296" fill="#f87171" font-size="12" font-weight="700">MID-HDR SPECULAR GLINTS (L = 2.00 &amp; L = 3.00)</text>
  <text x="764" y="328" fill="#f8fafc" font-size="21" font-weight="800">0/17 Starved · 0.7500 &amp; 0.8906</text>
  <text x="764" y="354" fill="#94a3b8" font-size="12">Eliminates muddy grey compression across 15/17 highlight stations</text>

  <rect x="740" y="384" width="404" height="104" rx="12" fill="#111827" stroke="#10b981"/>
  <text x="764" y="412" fill="#34d399" font-size="12" font-weight="700">8,192-PASS THROUGHPUT VS 64-STEP WEBER-FECHNER ODE</text>
  <text x="764" y="444" fill="#f8fafc" font-size="21" font-weight="800">0.43 ms vs 39.93 ms (92.08×)</text>
  <text x="764" y="470" fill="#94a3b8" font-size="12">Closed-form rational curve matches ODE integral within &lt;1e-12</text>

  <!-- Footer provenance bar -->
  <rect x="56" y="508" width="1088" height="72" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="80" y="538" fill="#e2e8f0" font-size="13" font-weight="700">58-Solid 17-Station Reinhard White-Point Sensitometer Bench · Sealed Evidence: demos/reinhard-extended-whitepoint-tonemap-rig/report.json</text>
  <text x="80" y="562" fill="#94a3b8" font-size="12">Provenance: Measured on Windows 11 Chromium Headless WebGL · 12/12 checks passed · Zero runtime model APIs</text>
</svg>
