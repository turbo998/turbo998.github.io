<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">ROUND 128 · 138TH DEMO · PERCEPTUAL LOG-SPACE GEOMETRIC ROUGHNESS INTERPOLATION</text>
  <text x="56" y="102" fill="#f8fafc" font-size="25" font-weight="800">Log-Geometric Roughness α(u) = α₀^(1−u)·α₁^u vs Naive Linear Alpha Blend</text>
  <text x="56" y="130" fill="#94a3b8" font-size="14">Locks 50% midpoint at geometric mean α = 0.1000 (G = 0.5000, 0/17 warped) vs naive α = 0.5050 overshooting to G = 0.8516 (15/17 warped)</text>

  <!-- Left panel: 17-station perceptual gloss curve -->
  <rect x="56" y="152" width="660" height="336" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="80" y="182" fill="#e2e8f0" font-size="15" font-weight="700">Perceptual Roughness Coordinate G(α) = ln(α/0.01)/ln(100) Across Blend Weight u ∈ [0, 1]</text>

  <!-- Grid lines -->
  <line x1="115" y1="215" x2="685" y2="215" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="270" x2="685" y2="270" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="325" x2="685" y2="325" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="380" x2="685" y2="380" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="435" x2="685" y2="435" stroke="#334155"/>

  <text x="105" y="219" fill="#94a3b8" font-size="11" text-anchor="end">1.00</text>
  <text x="105" y="274" fill="#94a3b8" font-size="11" text-anchor="end">0.75</text>
  <text x="105" y="329" fill="#94a3b8" font-size="11" text-anchor="end">0.50</text>
  <text x="105" y="384" fill="#94a3b8" font-size="11" text-anchor="end">0.25</text>
  <text x="105" y="439" fill="#94a3b8" font-size="11" text-anchor="end">0.00</text>

  <!-- Log-Geometric Uniform Diagonal: (115,435) -> (257,380) -> (400,325) -> (542,270) -> (685,215) -->
  <polyline fill="none" stroke="url(#ok)" stroke-width="4" points="115,435 257,380 400,325 542,270 685,215"/>
  <circle cx="115" cy="435" r="5" fill="#38bdf8"/>
  <circle cx="257" cy="380" r="5" fill="#2dd4bf"/>
  <circle cx="400" cy="325" r="6" fill="#10b981"/>
  <circle cx="542" cy="270" r="5" fill="#10b981"/>
  <circle cx="685" cy="215" r="5" fill="#10b981"/>
  <text x="395" y="352" fill="#34d399" font-size="12" font-weight="700">Log-Geometric G(u) = u · Midpoint α(0.5)=0.1000, G=0.5000 (0/17 Warped)</text>

  <!-- Naive Linear Alpha Bowing Curve: u=0->435, u=0.125(G=0.5586)->312, u=0.25(G=0.7054)->280, u=0.50(G=0.8516)->248, u=0.75(G=0.9380)->229, u=1.0->215 -->
  <polyline fill="none" stroke="url(#danger)" stroke-width="3.5" stroke-dasharray="7 4" points="115,435 186,312 257,280 400,248 542,229 685,215"/>
  <circle cx="186" cy="312" r="4.5" fill="#ef4444"/>
  <circle cx="257" cy="280" r="5.5" fill="#ef4444"/>
  <circle cx="400" cy="248" r="6" fill="#ef4444"/>
  <circle cx="542" cy="229" r="5" fill="#f97316"/>
  <text x="200" y="236" fill="#f87171" font-size="12" font-weight="700">Naive Linear α Jumps to G(0.25)=0.7054 &amp; G(0.50)=0.8516 (+70.31% Overshoot!)</text>

  <!-- X-axis labels -->
  <text x="115" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 0 (u=0.00)</text>
  <text x="257" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 4 (u=0.25)</text>
  <text x="400" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 8 (u=0.50)</text>
  <text x="542" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 12 (u=0.75)</text>
  <text x="685" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 16 (u=1.00)</text>

  <!-- Right panel: KPI cards -->
  <rect x="740" y="152" width="404" height="104" rx="12" fill="#111827" stroke="#0284c7"/>
  <text x="764" y="180" fill="#38bdf8" font-size="12" font-weight="700">STATION 8 (50% BLEND MIDPOINT, u = 0.5000)</text>
  <text x="764" y="212" fill="#f8fafc" font-size="21" font-weight="800">α = 0.1000 (G = 0.5000) vs G = 0.8516</text>
  <text x="764" y="238" fill="#94a3b8" font-size="12">Geometric mean √(0.01·1.00) eliminates +70.31% matte overshoot</text>

  <rect x="740" y="268" width="404" height="104" rx="12" fill="#111827" stroke="#ef4444"/>
  <text x="764" y="296" fill="#f87171" font-size="12" font-weight="700">STATION 4 (25% BLEND) &amp; INTERIOR WARPING</text>
  <text x="764" y="328" fill="#f8fafc" font-size="21" font-weight="800">0/17 Warped vs 15/17 Warped</text>
  <text x="764" y="354" fill="#94a3b8" font-size="12">Linear α(0.25)=0.2575 crushes mirror specular to G=0.7054 (+182%)</text>

  <rect x="740" y="384" width="404" height="104" rx="12" fill="#111827" stroke="#10b981"/>
  <text x="764" y="412" fill="#34d399" font-size="12" font-weight="700">8,192-PASS THROUGHPUT VS 64-STEP LIE-GROUP ODE</text>
  <text x="764" y="444" fill="#f8fafc" font-size="21" font-weight="800">5.16 ms vs 12.23 ms (2.37×)</text>
  <text x="764" y="470" fill="#94a3b8" font-size="12">Matches 64-step multiplicative Lie ODE within &lt;1e-13 error</text>

  <!-- Footer provenance bar -->
  <rect x="56" y="508" width="1088" height="72" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="80" y="538" fill="#e2e8f0" font-size="13" font-weight="700">58-Solid 17-Station Perceptual Gloss Octave Bench · Sealed Evidence: demos/perceptual-log-roughness-mip-rig/report.json</text>
  <text x="80" y="562" fill="#94a3b8" font-size="12">Provenance: Measured on Windows 11 Chromium Headless WebGL · 12/12 checks passed · Zero runtime model APIs</text>
</svg>
