<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">ROUND 141 · 151ST DEMO · WELFORD (1962) &amp; KNUTH ONLINE CENTERED FP32 VARIANCE</text>
  <text x="56" y="102" fill="#f8fafc" font-size="25" font-weight="800">Welford Centered M₂ += (x−μ_old)(x−μ_new) vs Naive FP32 E[X²]−E[X]²</text>
  <text x="56" y="130" fill="#94a3b8" font-size="14">Preserves exact FP32 variance V = 1.0000× up to B = 6400 nits (0/17 collapsed) vs naive E[X²]−E[X]² collapsing to 0.0000× for all B ≥ 2400 (11/17 collapsed)</text>

  <!-- Left panel: 17-station FP32 normalized variance comparison -->
  <rect x="56" y="152" width="660" height="336" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="80" y="182" fill="#e2e8f0" font-size="15" font-weight="700">Retained FP32 Normalized Variance V(B) = σ̂² / σ² Across Base Luminance B ∈ [0, 6400] nits</text>

  <!-- Grid lines: y=215(1.00x), y=270(0.75x), y=325(0.50x), y=380(0.25x), y=435(0.00x) -->
  <line x1="115" y1="215" x2="685" y2="215" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="270" x2="685" y2="270" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="325" x2="685" y2="325" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="380" x2="685" y2="380" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="435" x2="685" y2="435" stroke="#334155"/>
  <!-- ULP cliff line at Station 6 (B=2400, x=329) -->
  <line x1="329" y1="205" x2="329" y2="435" stroke="#ef4444" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <text x="329" y="200" fill="#f87171" font-size="10" text-anchor="middle">B = 2400 (B² &gt; 2²², ULP = 0.50)</text>

  <text x="105" y="219" fill="#94a3b8" font-size="11" text-anchor="end">1.00×</text>
  <text x="105" y="274" fill="#94a3b8" font-size="11" text-anchor="end">0.75×</text>
  <text x="105" y="329" fill="#94a3b8" font-size="11" text-anchor="end">0.50×</text>
  <text x="105" y="384" fill="#94a3b8" font-size="11" text-anchor="end">0.25×</text>
  <text x="105" y="439" fill="#94a3b8" font-size="11" text-anchor="end">0.00×</text>

  <!-- Welford Centered FP32 V = 1.0000x flat line at y=215 -->
  <polyline fill="none" stroke="url(#ok)" stroke-width="4" points="115,215 293,215 329,215 400,215 542,215 685,215"/>
  <circle cx="115" cy="215" r="5" fill="#38bdf8"/>
  <circle cx="293" cy="215" r="5" fill="#10b981"/>
  <circle cx="329" cy="215" r="6" fill="#10b981"/>
  <circle cx="400" cy="215" r="6" fill="#10b981"/>
  <circle cx="685" cy="215" r="6" fill="#10b981"/>
  <text x="342" y="238" fill="#34d399" font-size="12" font-weight="700">Welford Centered FP32: V = 1.0000× Across All 17 Stations (0/17 Collapsed)</text>

  <!-- Naive Uncentered FP32 E[X²]-E[X]²: St0..St5(1.0)->215, St6..St16(0.0)->435 -->
  <polyline fill="none" stroke="url(#danger)" stroke-width="3.5" stroke-dasharray="7 4" points="115,215 293,215 329,435 400,435 542,435 685,435"/>
  <circle cx="293" cy="215" r="5" fill="#f97316"/>
  <circle cx="329" cy="435" r="6" fill="#ef4444"/>
  <circle cx="400" cy="435" r="6" fill="#ef4444"/>
  <circle cx="542" cy="435" r="5" fill="#ef4444"/>
  <circle cx="685" cy="435" r="6" fill="#ef4444"/>
  <text x="342" y="421" fill="#f87171" font-size="12" font-weight="700">Naive FP32 E[X²]−E[X]² Collapses to Dead 0.0000× for All B ≥ 2400 (11/17)!</text>

  <!-- X-axis labels -->
  <text x="115" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 0 (B=0)</text>
  <text x="293" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 5 (B=2000)</text>
  <text x="364" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 7 (B=2800)</text>
  <text x="471" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 10 (B=4000)</text>
  <text x="685" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 16 (B=6400)</text>

  <!-- Right panel: KPI cards -->
  <rect x="740" y="152" width="404" height="104" rx="12" fill="#111827" stroke="#0284c7"/>
  <text x="764" y="180" fill="#38bdf8" font-size="12" font-weight="700">FP32 MANTISSA ULP CLIFF (STATION 6, B = 2400 NITS)</text>
  <text x="764" y="212" fill="#f8fafc" font-size="21" font-weight="800">V = 1.0000× vs 0.0000× (−100%)</text>
  <text x="764" y="238" fill="#94a3b8" font-size="12">At B² = 5.76×10⁶ &gt; 2²², FP32 ULP = 0.50 swallows +0.25 variance</text>

  <rect x="740" y="268" width="404" height="104" rx="12" fill="#111827" stroke="#ef4444"/>
  <text x="764" y="296" fill="#f87171" font-size="12" font-weight="700">TAA &amp; SVGF HDR DENOISER STABILITY</text>
  <text x="764" y="328" fill="#f8fafc" font-size="21" font-weight="800">0/17 Collapsed vs 11/17 Zeroed</text>
  <text x="764" y="354" fill="#94a3b8" font-size="12">Subtracts running mean before multiplying: δ₁·δ₂ stays O(1)</text>

  <rect x="740" y="384" width="404" height="104" rx="12" fill="#111827" stroke="#10b981"/>
  <text x="764" y="412" fill="#34d399" font-size="12" font-weight="700">8,192-PASS THROUGHPUT VS 64-SAMPLE TWO-PASS</text>
  <text x="764" y="444" fill="#f8fafc" font-size="21" font-weight="800">1.35 ms vs 23.50 ms (17.39×)</text>
  <text x="764" y="470" fill="#94a3b8" font-size="12">Single-pass Welford matches 64-sample FP64 reference (&lt;1e-13)</text>

  <!-- Footer provenance bar -->
  <rect x="56" y="508" width="1088" height="72" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="80" y="538" fill="#e2e8f0" font-size="13" font-weight="700">58-Solid 17-Station Welford FP32 Variance Cancellation Bench · Sealed Evidence: demos/welford-fp32-variance-cancellation-rig/report.json</text>
  <text x="80" y="562" fill="#94a3b8" font-size="12">Provenance: Measured on Windows 11 Chromium Headless WebGL · 12/12 checks passed · Zero runtime model APIs</text>
</svg>
