<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 88 · LAGARDE PARALLAX-CORRECTED CUBEMAP (PCC) VS INFINITE-SKYBOX REFLECTION SLIDING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Lagarde Box PCC (x=+3m Hits Y = 2.0000m, 0 Slide) vs Infinite Cubemap (Y = 7.0000m, 28.79× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Intersecting reflection ray P + t·R with room proxy AABB and subtracting P_probe anchors indoor reflections to walls
  </text>

  <!-- Left Panel: Lagarde Box Parallax-Corrected Cubemap -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Lagarde Box Parallax-Corrected Cubemap (PCC)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    R_corr = (P_floor + t_box·R) − P_probe · Y_hit(x) = 5.0 − x_floor
  </text>

  <!-- True linear wall contact ramp left -->
  <line x1="100" y1="255" x2="540" y2="425" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="485" cy="404" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-14 (x=+3.0m, 2m From Wall): Y_wall = 2.0000 m (0.0000m Slide!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Sliding Floor Stations: 0 / 17 (Exact Room Corner Contact)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.34 ms (Slab PCC) vs 9.68 ms (54-Step Search, 28.79×)
  </text>

  <!-- Right Panel: Naive Infinite-Skybox Cubemap -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Infinite-Skybox Cubemap (R_lookup = R)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Ignores Floor Position P · Samples Fixed Y = 7.0000m Across Entire Floor!
  </text>

  <!-- Flat unanchored infinite line vs true ramp right -->
  <line x1="660" y1="255" x2="1100" y2="425" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="660" y1="292" x2="1100" y2="292" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1045" cy="292" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-14 (x=+3.0m): Y_naive = 7.0000 m (+5.0000m Parallax Slide!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Sliding Stations: 16 / 17 (Max Slide +6.0000m at x=+4.0m)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Treats 10m Indoor Room Walls as Infinite Skybox → Reflections Float With Camera
  </text>
</svg>
