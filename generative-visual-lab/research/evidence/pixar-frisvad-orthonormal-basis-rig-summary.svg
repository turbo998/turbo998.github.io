<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">ROUND 136 · 146TH DEMO · PIXAR DUFF ET AL. (JCGT 2017) &amp; FRISVAD (JGT 2012) ORTHONORMAL BASIS</text>
  <text x="56" y="102" fill="#f8fafc" font-size="25" font-weight="800">Pixar-Frisvad Rational ONB a = −1/(s+n_z) vs Naive Cross-Up Pole Collapse</text>
  <text x="56" y="130" fill="#94a3b8" font-size="14">Locks exact unit tangent norm ‖T‖ = 1.0000× at all latitudes including pole n_z = 1.0 (0/17 degenerate, zero sqrt) vs cross(Z, N) = 0.0000× at pole</text>

  <!-- Left panel: 17-station tangent norm comparison -->
  <rect x="56" y="152" width="660" height="336" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="80" y="182" fill="#e2e8f0" font-size="15" font-weight="700">Constructed Tangent Vector Magnitude ‖T(n_z)‖ Across Zenith Cosine n_z ∈ [0.00, 1.00]</text>

  <!-- Grid lines: y=215(1.00x), y=270(0.75x), y=325(0.50x), y=380(0.25x), y=435(0.00x) -->
  <line x1="115" y1="215" x2="685" y2="215" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="270" x2="685" y2="270" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="325" x2="685" y2="325" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="380" x2="685" y2="380" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="435" x2="685" y2="435" stroke="#334155"/>

  <text x="105" y="219" fill="#94a3b8" font-size="11" text-anchor="end">1.00×</text>
  <text x="105" y="274" fill="#94a3b8" font-size="11" text-anchor="end">0.75×</text>
  <text x="105" y="329" fill="#94a3b8" font-size="11" text-anchor="end">0.50×</text>
  <text x="105" y="384" fill="#94a3b8" font-size="11" text-anchor="end">0.25×</text>
  <text x="105" y="439" fill="#94a3b8" font-size="11" text-anchor="end">0.00×</text>

  <!-- Pixar-Frisvad Rational ONB ‖T‖ = 1.0000x flat line at y=215 -->
  <polyline fill="none" stroke="url(#ok)" stroke-width="4" points="115,215 257,215 400,215 542,215 685,215"/>
  <circle cx="115" cy="215" r="5" fill="#38bdf8"/>
  <circle cx="257" cy="215" r="5" fill="#10b981"/>
  <circle cx="400" cy="215" r="6" fill="#10b981"/>
  <circle cx="542" cy="215" r="5" fill="#10b981"/>
  <circle cx="685" cy="215" r="6" fill="#10b981"/>
  <text x="240" y="204" fill="#34d399" font-size="12" font-weight="700">Pixar-Frisvad Rational ONB: ‖T‖ = 1.0000× Everywhere (0/17 Degenerate, Zero sqrt)</text>

  <!-- Naive Cross-Up √(1 - nz²): nz=0(1.0)->215, nz=0.25(0.968)->222, nz=0.50(0.866)->244, nz=0.75(0.6614)->289, nz=0.875(0.484)->328, nz=1.0(0.0)->435 -->
  <polyline fill="none" stroke="url(#danger)" stroke-width="3.5" stroke-dasharray="7 4" points="115,215 257,222 400,244 542,289 614,328 685,435"/>
  <circle cx="400" cy="244" r="5" fill="#f97316"/>
  <circle cx="542" cy="289" r="5.5" fill="#ef4444"/>
  <circle cx="685" cy="435" r="6" fill="#ef4444"/>
  <text x="275" y="365" fill="#f87171" font-size="12" font-weight="700">Naive ‖(0,0,1)×N‖ = √(1−n_z²) Collapses to 0.0000× at Pole (0/0 NaN!)</text>

  <!-- X-axis labels -->
  <text x="115" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 0 (n_z=0.00)</text>
  <text x="257" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 4 (n_z=0.25)</text>
  <text x="400" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 8 (n_z=0.50)</text>
  <text x="542" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 12 (n_z=0.75)</text>
  <text x="685" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 16 (Pole n_z=1.0)</text>

  <!-- Right panel: KPI cards -->
  <rect x="740" y="152" width="404" height="104" rx="12" fill="#111827" stroke="#0284c7"/>
  <text x="764" y="180" fill="#38bdf8" font-size="12" font-weight="700">NORTH POLE APEX (STATION 16, n_z = 1.0000, θ = 0°)</text>
  <text x="764" y="212" fill="#f8fafc" font-size="21" font-weight="800">‖T‖ = 1.0000× vs 0.0000× (NaN)</text>
  <text x="764" y="238" fill="#94a3b8" font-size="12">Denominator |s + n_z| = 1 + |n_z| = 2.0000 never vanishes</text>

  <rect x="740" y="268" width="404" height="104" rx="12" fill="#111827" stroke="#ef4444"/>
  <text x="764" y="296" fill="#f87171" font-size="12" font-weight="700">STEEP LATITUDE SHRINKAGE (STATION 12, n_z = 0.75)</text>
  <text x="764" y="328" fill="#f8fafc" font-size="21" font-weight="800">0/17 Degenerate vs 0.6614×</text>
  <text x="764" y="354" fill="#94a3b8" font-size="12">Zero sqrt() instructions · Exact orthogonality |T·N| &lt; 1e-15</text>

  <rect x="740" y="384" width="404" height="104" rx="12" fill="#111827" stroke="#10b981"/>
  <text x="764" y="412" fill="#34d399" font-size="12" font-weight="700">8,192-PASS THROUGHPUT VS 64-STEP RODRIGUES TRANSPORT</text>
  <text x="764" y="444" fill="#f8fafc" font-size="21" font-weight="800">0.71 ms vs 39.39 ms (55.82×)</text>
  <text x="764" y="470" fill="#94a3b8" font-size="12">1-division rational ONB matches 64-step geodesic transport (&lt;1e-13)</text>

  <!-- Footer provenance bar -->
  <rect x="56" y="508" width="1088" height="72" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="80" y="538" fill="#e2e8f0" font-size="13" font-weight="700">58-Solid 17-Station Pixar-Frisvad Orthonormal Basis Bench · Sealed Evidence: demos/pixar-frisvad-orthonormal-basis-rig/report.json</text>
  <text x="80" y="562" fill="#94a3b8" font-size="12">Provenance: Measured on Windows 11 Chromium Headless WebGL · 12/12 checks passed · Zero runtime model APIs</text>
</svg>
