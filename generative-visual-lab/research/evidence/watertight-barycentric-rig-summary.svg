<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 43 · WATERTIGHT CANONICAL TOP-LEFT BARYCENTRIC EDGE FUNCTION VS SHARED-EDGE SEAM CRACK
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    Canonical Top-Left Edge Rule (17/17 Hits = 1, 0 Leaks) vs Naive Strict Interior (11/17 Seam Cracks, 3.25× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Lexicographic endpoint sorting enforces e_BA(P) ≡ −e_AB(P), and Top-Left tie-breaking resolves shared diagonal seams without leaks or double overdraw
  </text>

  <!-- Left Panel: Watertight Canonical Top-Left -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Canonical Sorted-Endpoint Edge + Top-Left Rule
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    sort(A,B) ⇒ e_BA(P) ≡ −e_AB(P) · Top-Left (dy &gt; 0 ∨ (dy == 0 ∧ dx &lt; 0))
  </text>

  <rect x="130" y="254" width="180" height="180" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <polygon points="130,254 130,434 310,254" fill="#10b981" fill-opacity="0.28"/>
  <polygon points="310,434 310,254 130,434" fill="#0284c7" fill-opacity="0.20"/>
  <line x1="130" y1="434" x2="310" y2="254" stroke="#34d399" stroke-width="4"/>
  <circle cx="220" cy="344" r="7" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="336" y="304" fill="#34d399" font-family="Consolas, monospace" font-size="14" font-weight="700">Tri A (V₁→V₂): dy = +4 &gt; 0</text>
  <text x="336" y="328" fill="#a7f3d0" font-family="Consolas, monospace" font-size="13">isTopLeft = TRUE  → Hit = 1</text>
  <text x="336" y="370" fill="#38bdf8" font-family="Consolas, monospace" font-size="14" font-weight="700">Tri B (V₂→V₁): dy = −4 &lt; 0</text>
  <text x="336" y="394" fill="#bae6fd" font-family="Consolas, monospace" font-size="13">isTopLeft = FALSE → Hit = 0</text>

  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Seam Midpoint P=(0,0) Station-8: Total Hits = 1 · Σλ = 1.000000
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Seam Leaks: 0 / 17 · Double Overdraws: 0 / 17 (100% Watertight)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 8.27 ms (Canonical Det) vs 26.88 ms (Heron Sqrt)
  </text>

  <!-- Right Panel: Naive Strict Seam Crack -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Strict Interior (e &gt; 0) &amp; Unsorted Edge Origins
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Drops Shared Seam Points (e = 0) on Both Adjacent Triangles!
  </text>

  <rect x="690" y="254" width="180" height="180" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <polygon points="690,254 690,424 860,254" fill="#f43f5e" fill-opacity="0.18"/>
  <polygon points="870,434 870,264 700,434" fill="#f43f5e" fill-opacity="0.18"/>
  <line x1="690" y1="434" x2="870" y2="254" stroke="#fb7185" stroke-width="4" stroke-dasharray="6,6"/>
  <circle cx="780" cy="344" r="7" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="896" y="304" fill="#fda4af" font-family="Consolas, monospace" font-size="14" font-weight="700">Tri A: e₁₂ = 0 ≯ 0 (MISS)</text>
  <text x="896" y="334" fill="#fda4af" font-family="Consolas, monospace" font-size="14" font-weight="700">Tri B: e₂₁ = 0 ≯ 0 (MISS)</text>
  <text x="896" y="378" fill="#fecdd3" font-family="Consolas, monospace" font-size="13">Result: 1-Pixel Diagonal Crack!</text>

  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Seam Midpoint P=(0,0) Station-8: Total Hits = 0 (Background Bleed!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Zero-Hit Seam Leaks: 11 / 17 Stations (100% Shared-Seam Drop)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Heron √s(s-a)(s-b)(s-c) Also Drifts by 2.17e-8 on Collinear Seam Points
  </text>
</svg>
