<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="66" fill="#2dd4bf" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">
    ROUND 212 · 222ND DEMO · TORRICELLI-CASTELLI FREE-FALLING LIQUID VEIN RIG
  </text>
  <text x="56" y="102" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800">
    Torricelli Quarter-Power Tapering Lock (1.0000×) vs Cylinder 2.0000× Bloat
  </text>
  <text x="56" y="130" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="14">
    Castelli (1628) &amp; Torricelli (1644): R(z) = R₀(1 + 2gz/v₀²)^(−1/4), Q(z) = π R(z)² v(z) = Q₀ across 17 stations
  </text>

  <!-- Left Chart Card -->
  <rect x="56" y="152" width="584" height="258" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="76" y="180" fill="#e2e8f0" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">
    VOLUMETRIC FLOW RATE RATIO (Q(z) / Q₀) ACROSS 17 STATIONS (v(z)/v₀ = 1 + u)
  </text>

  <line x1="90" y1="360" x2="610" y2="360" stroke="#334155" stroke-width="1.5"/>
  <line x1="90" y1="187.27272727272728" x2="610" y2="187.27272727272728" stroke="#334155" stroke-dasharray="4 4"/>
  <text x="82" y="364" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="11" text-anchor="end">1.00×</text>
  <text x="82" y="277.6" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="11" text-anchor="end">1.50×</text>
  <text x="82" y="191.3" fill="#fda4af" font-family="Inter, Segoe UI, sans-serif" font-size="11" text-anchor="end">2.00×</text>

  <polyline fill="none" stroke="#f43f5e" stroke-width="3.5" points="90.0,360.0 122.5,349.2 155.0,338.4 187.5,327.6 220.0,316.8 252.5,306.0 285.0,295.2 317.5,284.4 350.0,273.6 382.5,262.8 415.0,252.0 447.5,241.3 480.0,230.5 512.5,219.7 545.0,208.9 577.5,198.1 610.0,187.3"/>
  <polyline fill="none" stroke="#14b8a6" stroke-width="3.5" points="90.0,360.0 122.5,360.0 155.0,360.0 187.5,360.0 220.0,360.0 252.5,360.0 285.0,360.0 317.5,360.0 350.0,360.0 382.5,360.0 415.0,360.0 447.5,360.0 480.0,360.0 512.5,360.0 545.0,360.0 577.5,360.0 610.0,360.0"/>

  <circle cx="610" cy="187.3" r="5.5" fill="#f43f5e"/>
  <text x="598" y="177.3" fill="#fda4af" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="end">
    Naive Cylinder (R=R₀): 2.0000× volumetric flux bloat at v = 2 v₀ (16/17 violated)
  </text>

  <circle cx="610" cy="360" r="5.5" fill="#14b8a6"/>
  <text x="598" y="348" fill="#5eead4" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="end">
    Torricelli-Castelli R = R₀(1+2gz/v₀²)^(−1/4): 1.0000× exact lock (0/17 violated)
  </text>

  <!-- Right KPI & Formula Card -->
  <rect x="660" y="152" width="484" height="258" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="684" y="182" fill="#2dd4bf" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">
    FIRST-PRINCIPLES GRAVITY STREAM TAPERING &amp; BENCHMARK
  </text>
  <text x="684" y="214" fill="#f8fafc" font-family="Consolas, monospace" font-size="14" font-weight="700">
    v(z) = √(v₀² + 2gz),  R(z) = R₀ (1 + 2gz/v₀²)^(−1/4)
  </text>
  <text x="684" y="242" fill="#cbd5e1" font-family="Consolas, monospace" font-size="13">
    Area Contraction: A(z) = A₀ v₀ / v(z) = A₀ / (1 + u)
  </text>
  <text x="684" y="268" fill="#5eead4" font-family="Consolas, monospace" font-size="13" font-weight="700">
    Q(z) / Q₀ = [A₀/(1+u)] · [v₀(1+u)] / Q₀ = 1.0000×
  </text>
  <text x="684" y="294" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700">
    Q_naive / Q₀ = A₀ v(z) / (A₀ v₀) = 1 + u → 2.0000×
  </text>

  <rect x="684" y="314" width="436" height="78" rx="8" fill="#131e36" stroke="#1e293b"/>
  <text x="702" y="340" fill="#fde68a" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">
    8,192-Pass Latency: 0.183 ms vs 6.814 ms (37.23× faster)
  </text>
  <text x="702" y="364" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12">
    Closed-form Torricelli quarter-power law vs 64-step Bernoulli quadrature
  </text>
  <text x="702" y="382" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12">
    Max quadrature divergence: 3.331e-16 · 58 solids · 17 stations
  </text>

  <!-- Bottom 3 Station Callouts -->
  <rect x="56" y="428" width="352" height="154" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="76" y="458" fill="#5eead4" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">
    STATION 4 (u = 0.250, v = 1.2500 v₀)
  </text>
  <text x="76" y="492" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    1.0000× vs 1.2500×
  </text>
  <text x="76" y="520" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12">
    Vein radius tapers to 0.8944 R₀ (A = 0.80 A₀);
  </text>
  <text x="76" y="540" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12">
    constant-radius cylinder bloats flux by 25%.
  </text>

  <rect x="428" y="428" width="352" height="154" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="448" y="458" fill="#fcd34d" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">
    STATION 8 (u = 0.500, v = 1.5000 v₀)
  </text>
  <text x="448" y="492" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    1.0000× vs 1.5000×
  </text>
  <text x="448" y="520" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12">
    Vein radius tapers to 0.8165 R₀ (A = 0.67 A₀);
  </text>
  <text x="448" y="540" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12">
    constant-radius cylinder bloats flux by 50%.
  </text>

  <rect x="800" y="428" width="344" height="154" rx="12" fill="#0f172a" stroke="#1e293b"/>
  <text x="820" y="458" fill="#fda4af" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">
    STATION 16 (u = 1.000, v = 2.0000 v₀)
  </text>
  <text x="820" y="492" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    1.0000× vs 2.0000×
  </text>
  <text x="820" y="520" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12">
    At 2× speed (2gz=3v₀²), R tapers to 0.7071 R₀
  </text>
  <text x="820" y="540" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="12">
    vs naive 2.0000× cylinder flux bloat.
  </text>
</svg>
