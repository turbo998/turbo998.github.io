<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 55 · MIKKTSPACE PER-PIXEL GRAM-SCHMIDT &amp; HANDEDNESS SIGN (w = ±1) VS MIRRORED UV SEAM FLIP
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    MikkTSpace w·(N×T') (∠(N,T') = 90.00°, 0.00° Flip) vs Unsigned Un-Orthogonalized (65.0° Angle, 70.0° Seam Flip, 3.30× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Projecting T' = normalize(T − (N·T)N) and multiplying B = w·(N × T') eliminates curved-triangle skew and mirrored UV lighting seams
  </text>

  <!-- Left Panel: MikkTSpace Gram-Schmidt + Handedness w -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ MikkTSpace Gram-Schmidt + Handedness Sign w = ±1
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    T' = normalize(T − (N·T)N), B = w·(N × T') · Seamless Across Symmetry Line
  </text>

  <!-- Flat 90 deg orthogonality line left -->
  <line x1="310" y1="255" x2="310" y2="450" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="145" y="272" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Left Shell (w = +1)</text>
  <text x="345" y="272" fill="#34d399" font-family="Consolas, monospace" font-size="12">Mirrored Shell (w = −1)</text>
  <line x1="100" y1="300" x2="535" y2="300" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="420" cy="300" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-12 (w=−1): ∠(N,T') = 90.00° · World Normal Error = 0.00°
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Orthogonality Defect: 0.00° · Inverted Mirrored Stations: 0 / 17
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 1.55 ms (MikkTSpace) vs 5.11 ms (Cotangent Jacobian, 3.30×)
  </text>

  <!-- Right Panel: Naive Unsigned Un-Orthogonalized TBN -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Unsigned Cross: B = N × T_raw (w ≡ +1)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    25.00° N-T Skew + 180° Bitangent Flip Across Mirrored UV Seam!
  </text>

  <!-- Skewed angle + mirrored jump right -->
  <line x1="870" y1="255" x2="870" y2="450" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="660" y1="300" x2="1095" y2="300" stroke="#475569" stroke-width="2.5" stroke-dasharray="5,4"/>
  <polyline points="660,360 865,360 875,425 1095,425" fill="none" stroke="#fb7185" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="980" cy="425" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-12 (w=−1): ∠(N,T) = 65.00° · Bevel Normal Flipped by 70.00°!
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Inverted Mirrored Stations: 9 / 17 (70.00° Bevel Inversion!)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Creates Hard Lighting Seam Down Symmetric Character Faces &amp; Car Hoods
  </text>
</svg>
