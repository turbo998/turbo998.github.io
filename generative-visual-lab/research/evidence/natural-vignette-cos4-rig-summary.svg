<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 96 · BORN-WOLF COSINE-FOURTH NATURAL VIGNETTING VS QUADRATIC TAYLOR CORNER BLACKOUT
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Born-Wolf Rational cos⁴θ (r/f=0.75 V = 0.4096) vs Quadratic 1−2u² (V = 0.0000, 30.46× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Exact optical law cos⁴θ ≡ 1 / (1 + (r/f)²)² couples vignetting to focal length f without choking wide-angle corners
  </text>

  <!-- Left Panel: Born-Wolf Cosine-Fourth Natural Vignetting -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Born-Wolf Cosine-Fourth Law (V = 1 / (1 + (r/f)²)²)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Inverse-Square cos²θ × Pupil Foreshortening cos θ × Sensor Lambert cos θ
  </text>

  <!-- Smooth positive rational cos^4 curve left -->
  <path d="M 95 262 Q 300 280 430 362 T 540 392" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="430" cy="362" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-12 (r/f=0.75, θ=36.9°): V_phys = 0.4096 · Corner (45°): 0.2500!
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Blacked-Out Corner Stations: 0 / 17 (Strictly Positive &amp; Root-Free)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.38 ms (Rational) vs 11.52 ms (64-Ring Trig, 30.46×)
  </text>

  <!-- Right Panel: Naive Quadratic Taylor Vignette -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Quadratic Taylor Vignette (max(0, 1 − 2·(r/f)²))
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Truncated Parabola Hits 0.0000 at r/f = 0.707 → Chokes Corners Into Peephole!
  </text>

  <!-- Plunging parabola hitting zero vs true cos^4 curve right -->
  <path d="M 655 262 Q 860 280 990 362 T 1100 392" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 655 262 Q 820 290 970 432 L 1100 432" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="990" cy="432" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-12..16 (r/f=0.75..1.00): Choked to V = 0.0000 (−0.4096 Loss!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Choked Stations: 12 / 17 (5 Outer Stations Completely Blacked Out)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Truncates Positive Higher-Order Terms +3u⁴ − 4u⁶ + ... of (1 + u²)⁻²
  </text>
</svg>
