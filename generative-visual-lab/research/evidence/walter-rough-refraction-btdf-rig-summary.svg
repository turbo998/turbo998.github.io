<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 109 · WALTER IOR-WEIGHTED ROUGH REFRACTION BTDF VS UNWEIGHTED BISECTOR DARKENING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Walter IOR-Weighted H_t (I(60°)=1.0000) vs Unweighted Bisector (0.3194, 13.48× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Weighting H_t = −normalize(η_i·V + η_o·L) cancels tangential Snell momentum so frosted glass stays luminous at oblique angles
  </text>

  <!-- Left Panel: Walter IOR-Weighted Half-Vector -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Walter IOR-Weighted Half-Vector (H_t = −normalize(η_i·V + η_o·L))
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    η_i·sin θ_i − η_o·sin θ_t ≡ 0 · Zero Microfacet Tilt Error Along Snell Ray
  </text>

  <!-- Flat conserved Snell peak at I = 1.0000 -->
  <line x1="95" y1="305" x2="545" y2="305" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="432" cy="305" r="8" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-12 (θ_i=60°, θ_t=35.26°): Δθ_H = 0.00° → Peak I_Walter = 1.0000
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Starved Refraction Stations: 0 / 17 (Bright Frosted Glass &amp; Ice Transmission)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 7.64 ms (Weighted H_t) vs 102.97 ms (64-Step Root, 13.48×)
  </text>

  <!-- Right Panel: Naive Unweighted Bisector -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Unweighted Bisector (H = −normalize(V + L))
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Tilts Microfacet by 12.37° at 60° → −68.06% Frosted Glass Blackout!
  </text>

  <!-- Dashed Walter reference + collapsing unweighted curve -->
  <line x1="655" y1="305" x2="1105" y2="305" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 655 305 Q 880 335 1105 425" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="992" cy="395" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-12 (60°): I_naive = 0.3194 (−68.06%) · Station-16 (80°): 0.1109 (−88.91%!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Starved Stations: 16 / 17 (All 16 Off-Normal Angles Darkened)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Makes Frosted Glass Windows &amp; Ice Turn Muddy Grey When Viewed Obliquely
  </text>
</svg>
