<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 37 · TOKSVIG NORMAL-VARIANCE MIP ROUGHNESS VS SPECULAR FIREFLY ALIASING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    Toksvig Variance Roughness (α_eff = 0.4932, D = 1.3084) vs Naive Renormalize (D = 14.1471, 10.81× Spike)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Across a ±35° micro-bump footprint (||n̄|| = 0.8192), calling normalize(n̄) with α₀ = 0.15 erases bump variance and creates 10.82× fireflies!
  </text>

  <!-- Left Panel: Toksvig Normal-Variance Roughness -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Toksvig Variance Filter: α_eff = √(α₀² + (1−||n̄||)/||n̄||)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Reads Shortened Mip Length ||n̄|| = 0.8192 Before Normalizing
  </text>

  <!-- Broad anti-aliased specular lobe left -->
  <path d="M 110 420 C 210 420, 250 345, 320 345 C 390 345, 430 420, 530 420" fill="#064e3b" stroke="#34d399" stroke-width="4.5"/>
  <circle cx="320" cy="345" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    ±35° Station-14: ||n̄|| = 0.8192 → α_eff = 0.4932 · Peak D = 1.3084
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Firefly Spike Suppression: 90.75% · Sub-Pixel Variance Conserved
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 6.60 ms (O(1) Toksvig) vs 95.90 ms (64-Tap Supersample)
  </text>

  <!-- Right Panel: Naive Mip Renormalization -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Mip Renormalize: N = normalize(n̄), α ≡ α₀ = 0.15
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Discards ||n̄|| Shortening · Treats Bumpy Patch as Flat Mirror!
  </text>

  <!-- Razor-sharp needle spike right -->
  <path d="M 670 420 L 855 420 L 880 250 L 905 420 L 1090 420" fill="#881337" stroke="#fb7185" stroke-width="4.5" stroke-linejoin="round"/>
  <circle cx="880" cy="250" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    ±35° Station-14: α Frozen at 0.1500 → Peak D = 14.1471 (10.81× Firefly!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    False NDF Peak Inflation: 10.81× (14.1471 vs 1.3084)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Razor-Thin Specular Cone Causes Severe Shimmering Fireflies in Motion
  </text>
</svg>
