<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 92 · JIMÉNEZ-GJØL SUB-LSB DITHER 8-BIT BANDING SUPPRESSION VS MACH-BAND STAIRCASE
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Jiménez 1-LSB Dither Quantizer (Q(10.5) = 10.5000 LSB) vs Naive 8-Bit Round (11.0000 LSB, 39.56× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Adding zero-mean ±0.5 LSB dither before 8-bit UNORM quantization linearizes E[floor(c + ξ + 0.5)] ≡ c
  </text>

  <!-- Left Panel: Jimenez / Gjol 1-LSB Dithered Quantizer -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Jiménez / Gjøl 1-LSB Dithered Quantization
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    E[Q(K₀ + u + ξ)] = (1 − u)·K₀ + u·(K₀ + 1) ≡ K₀ + u (Exact Linear Ramp)
  </text>

  <!-- Straight diagonal ramp left -->
  <line x1="100" y1="430" x2="540" y2="270" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="350" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (c=10.5000 LSB): E[Q] = 10.5000 LSB (0.0000 Staircase Error!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Mach-Band Staircase Stations: 0 / 17 (Seamless Twilight Gradient)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.48 ms (Closed-Form) vs 18.85 ms (64-Stratum, 39.56×)
  </text>

  <!-- Right Panel: Naive Un-Dithered 8-Bit Rounding -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Un-Dithered 8-Bit Rounding (floor(c + 0.5))
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Snaps 10.00..10.44 to 10 &amp; 10.50..11.00 to 11 → Hard 1.0 LSB Mach-Band Step!
  </text>

  <!-- Hard step function vs diagonal ramp right -->
  <line x1="660" y1="430" x2="1100" y2="270" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 660 430 L 865 430 L 865 270 L 1100 270" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="880" cy="270" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (10.5000 LSB): Snaps to 11.0000 LSB (+0.5000 LSB Step Error!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Banded Interior Stations: 15 / 17 (All 15 Sub-LSB Stations Terraced)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Triggers Retinal Lateral Inhibition (Visible Onion-Ring Color Banding)
  </text>
</svg>
