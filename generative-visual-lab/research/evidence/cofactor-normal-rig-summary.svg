<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 29 · COFACTOR ADJUGATE NORMAL MATRIX &amp; SQUASH-AND-STRETCH ORTHOGONALITY
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    Cofactor Adjugate cof(M)·n (90.00° Ortho, 100% Light) vs Naive M·n (71.71° Tilt, -68.61% Light)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Under non-uniform squash (sx=2.5, sy=0.4, kxy=0.2), transforming normals by M·n squashes them sideways, killing overhead highlights.
  </text>

  <!-- Left Panel: Cofactor Adjugate Normal Matrix -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Cofactor Adjugate: n' = normalize(cof(M)·n)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Exact Tangent-Normal Orthogonality n'·t' ≡ 0.000000 · 90.00° Right Angle
  </text>

  <!-- Squashed ellipse + perpendicular normal schematic left -->
  <ellipse cx="320" cy="410" rx="175" ry="38" fill="#132a4a" stroke="#38bdf8" stroke-width="3.5"/>
  <!-- Station +45 deg point at (435, 382), tangent gently sloped, normal pointing nearly straight up -->
  <line x1="375" y1="372" x2="495" y2="392" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <line x1="435" y1="382" x2="452" y2="275" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="435" cy="382" r="7" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="454" cy="252" r="11" fill="#fbbf24" stroke="#fef08a" stroke-width="2"/>
  <text x="415" y="256" fill="#fef08a" font-family="Consolas, monospace" font-size="12" font-weight="700" text-anchor="end">KEY LIGHT</text>
  <text x="320" y="478" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    +45° Shoulder Normal Elevation = 80.13° (Exact 90.00° to Tangent t')
  </text>

  <rect x="80" y="496" width="480" height="52" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="517" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Ortho Error: 0.00° · Key-Light Diffuse: 100.00%
  </text>
  <text x="96" y="537" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 116.15 ms (Cofactor) vs 143.53 ms (Gauss-Jordan)
  </text>

  <!-- Right Panel: Naive Forward Model Matrix M*n -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Forward Matrix: n' = normalize(M·n)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Normal Squashed Sideways with Vertices · 71.71° Tilt &amp; Specular Blackout!
  </text>

  <!-- Squashed ellipse + tilted naive normal schematic right -->
  <ellipse cx="880" cy="410" rx="175" ry="38" fill="#2a1225" stroke="#fb7185" stroke-width="3.5"/>
  <line x1="935" y1="372" x2="1055" y2="392" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <!-- Ghost true normal dashed -->
  <line x1="995" y1="382" x2="1012" y2="275" stroke="#475569" stroke-width="2.5" stroke-dasharray="5,4"/>
  <!-- Squashed naive normal pointing nearly horizontal right -->
  <line x1="995" y1="382" x2="1102" y2="366" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="995" cy="382" r="7" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="1014" cy="252" r="11" fill="#fbbf24" stroke="#fef08a" stroke-width="2"/>
  <text x="880" y="478" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Naive Normal Elevation = 8.43° (71.71° Tilt Error · 18.29° to Tangent!)
  </text>

  <rect x="640" y="496" width="480" height="52" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="517" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    n'·t' = 0.9495 != 0 · Irradiance Collapse: -68.61%
  </text>
  <text x="656" y="537" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Key-Light Diffuse Drops from 100.00% to 31.39% → Dark Squash Artifact
  </text>
</svg>
