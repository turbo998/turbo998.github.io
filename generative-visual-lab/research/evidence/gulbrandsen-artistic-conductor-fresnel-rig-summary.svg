<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 107 · GULBRANDSEN COMPLEX CONDUCTOR FRESNEL DIP VS NAIVE MONOTONIC SCHLICK WHITEWASH
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Gulbrandsen Conductor (F(60°)=0.2500 Dip) vs Monotonic Schlick (0.3716, 361.04× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Complex extinction (η = 0.30, κ = 0.40) creates a Pseudo-Brewster dip at cos θ_B = √(η²+κ²) = 0.5000 (60°) for rich gold/copper edge tint
  </text>

  <!-- Left Panel: Gulbrandsen Complex Conductor Fresnel -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Gulbrandsen Complex Conductor (((η−μ)²+κ²) / ((η+μ)²+κ²))
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Dips from F0 = 0.3514 (0°) to F_min = 0.2500 (60°) Before Grazing Rise
  </text>

  <!-- Dipping curve: 0.3514 at 0 deg -> 0.2500 minimum at 60 deg -> 0.4979 at 80 deg -->
  <path d="M 95 350 Q 385 435 432 395 L 545 295" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="432" cy="395" r="8" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    0°: 0.3514 · Station-12 (60° Pseudo-Brewster Dip): 0.2500 · 80°: 0.4578
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Whitewashed Metal Stations: 0 / 17 (Rich Gold &amp; Copper Edge-Tint Dip)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.68 ms (Rational IOR) vs 244.10 ms (64-Polarization, 361.04×)
  </text>

  <!-- Right Panel: Naive Monotonic Schlick Metal -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Monotonic Schlick Metal (F0 + (1 − F0)(1 − μ)⁵)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Cannot Dip Below F0 = 0.3514 → Washes Out Gold/Copper Contours!
  </text>

  <!-- Dashed Conductor reference + Monotonically rising Schlick -->
  <path d="M 655 350 Q 945 435 992 395 L 1105 295" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 655 350 L 992 340 L 1105 255" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="992" cy="340" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-12 (60°): F_Schlick = 0.3716 vs 0.2500 (+0.1216 / +48.65% Whitewash!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Whitewashed Stations: 16 / 17 (All 16 Off-Normal Angles Over-Brightened)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Erases Pseudo-Brewster Absorption Dip on Gold, Copper &amp; Aluminum
  </text>
</svg>
