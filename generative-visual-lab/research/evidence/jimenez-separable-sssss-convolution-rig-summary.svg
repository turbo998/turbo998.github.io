  <text x="646" y="158" fill="#38bdf8" font-size="12" font-weight="700">JIMENEZ (SIGGRAPH 2010 / 2015) 2-PASS SEPARABLE CONVOLUTION</text>
  <text x="646" y="186" fill="#f8fafc" font-size="17" font-weight="800">E_sep(u) = (1 − u)² + 2u(1 − u) + u² ≡ 1.0000</text>
