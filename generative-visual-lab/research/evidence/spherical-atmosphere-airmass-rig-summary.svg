<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 73 · HILLAIRE SPHERICAL-SHELL ATMOSPHERE AIRMASS VS FLAT-EARTH PLANAR SECANT HORIZON BLACKOUT
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Spherical Shell Airmass (90° m = 39.89, T_red = 0.2028) vs Flat-Earth 1/cos θ (m = ∞, T_red = 0.0000, 56.65× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Intersecting the curved atmosphere shell (q = R_p/H = 795) preserves warm crimson sunsets at θ = 90° where planar secant blackouts
  </text>

  <!-- Left Panel: Spherical Shell Intersection -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Spherical Shell Airmass m_sph = √(q²μ²+2q+1) − qμ
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Finite Horizon Chord m_sph(90°) = √1591 = 39.89 · Smooth Sunset Glow
  </text>

  <!-- Smooth sunset transmittance curve left -->
  <line x1="95" y1="396" x2="545" y2="396" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="102" y="386" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Horizon Sunset Floor T_red(90°) = 0.2028</text>
  <path d="M 105 268 Q 340 310 535 396" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="535" cy="396" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-16 (θ=90° Horizon): m_sph = 39.89 · T_red = 0.2028 (20.28% Crimson Glow)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Horizon Blackout Stations: 0 / 17 (100% Sunset Energy Retained)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 4.50 ms (Closed-Form) vs 254.68 ms (64-Step March, 56.65×)
  </text>

  <!-- Right Panel: Flat-Earth Planar Secant -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Flat-Earth Planar Secant (m_flat = 1 / cos θ)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Diverges to +∞ at θ = 90° → Crushes Horizon Sunset to Pitch Black 0.0000!
  </text>

  <!-- Plunging blackout curve right -->
  <line x1="655" y1="396" x2="1105" y2="396" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 665 268 Q 920 315 1095 438" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1095" cy="438" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-16 (θ=90° Horizon): m_flat = ∞ · T_red = 0.0000 (−0.2028 Sunset Lost!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Blackout-Corrupted Grazing Stations: 9 / 17 (θ = 82°..90°)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Creates Artificial Dark Horizon Banding During Golden Hour &amp; Sunset
  </text>
</svg>
