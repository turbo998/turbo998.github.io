<title>风起壁间 · 原创飞天</title>

</head><body>
<header class="app-header"><div><span class="eyebrow">Canvas 2D / 原创程序壁画</span><h1>风起壁间</h1></div><a href="../../">← 实验室</a></header>
<main>
<div class="stage feitian-stage"><canvas id="scene" aria-label="四身原创飞天壁画，使用下方按钮控制动画"></canvas></div>
<div class="toolbar"><div class="controls">
<button data-figure="0">青羽 · 1</button><button data-figure="1">流霞 · 2</button><button data-figure="2">听风 · 3</button><button data-figure="3">拾光 · 4</button>
<button id="all" class="primary">四时同游 · A</button><button id="pause" aria-pressed="false">暂停 · Space</button><button id="reset">归壁 · R</button>
<button id="restore" aria-pressed="false">艺术新彩</button><button id="sound" aria-pressed="false">开启声音</button><button id="capture">截图</button>
</div><p id="status" class="status" role="status" aria-live="polite">移动指针执灯照壁 · 点击人物或按钮，唤醒飞天</p></div>
<details class="portrait-study" id="portrait-study">
<summary>细看人物 · 五官与饰纹</summary>
<div class="portrait-layout">
<canvas id="portrait" width="540" height="640" aria-label="原创飞天面部和首饰近景"></canvas>
<div><span class="eyebrow">Original figure / Detail study</span><h2 id="portrait-title">青羽 · 人物细看</h2>
<label for="portrait-figure">选择人物</label>
<select id="portrait-figure"><option value="0">青羽</option><option value="1">流霞</option><option value="2">听风</option><option value="3">拾光</option></select>
<p>从眉眼、鼻唇到发髻、金饰与项链，近景使用同一套原创绘制路径重新渲染，不放大小图，也不替换成独立人物素材。</p>
<p>这是艺术设计细节展示，不是敦煌壁画的历史复原。打开近景不会启动飞行或声音。</p></div>
</div></details>
<p class="notice">人物、纹样、飘带与音序为原创程序绘制。敦煌风格致意，不是具体洞窟复制、颜料科学复原或历史音乐。飞天为 2D 分层画面，不是三维角色。默认静音；支持减少动态效果设置。</p>
</main>
</body></html>
