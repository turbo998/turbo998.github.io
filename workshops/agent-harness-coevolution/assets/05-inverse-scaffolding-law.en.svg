<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="inv-en-t">
  <title id="inv-en-t">The Inverse Scaffolding Law Across Three Frontier Model Generations</title>
  <rect width="980" height="420" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="36" y="40" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="19" font-weight="700">The Inverse Scaffolding Law: Co-Evolving Agent Harnesses Across Model Generations</text>
  <text x="36" y="64" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="13">As native model reasoning advances, procedural step-by-step crutches must shrink while boundary contracts &amp; verifiers sharpen</text>

  <rect x="48" y="84" width="884" height="260" rx="12" fill="#161b22" stroke="#30363d"/>
  <g stroke="#21262d" stroke-width="1">
    <line x1="110" y1="124" x2="880" y2="124"/>
    <line x1="110" y1="194" x2="880" y2="194"/>
    <line x1="110" y1="264" x2="880" y2="264"/>
    <line x1="110" y1="314" x2="880" y2="314"/>
  </g>
  <g fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="11" text-anchor="end">
    <text x="98" y="128">High / Strict</text>
    <text x="98" y="198">Medium</text>
    <text x="98" y="268">Low / Minimal</text>
  </g>

  <g stroke="#30363d" stroke-dasharray="4 4">
    <line x1="190" y1="104" x2="190" y2="314"/>
    <line x1="495" y1="104" x2="495" y2="314"/>
    <line x1="800" y1="104" x2="800" y2="314"/>
  </g>

  <path d="M 190 128 C 330 135, 390 185, 495 196 C 600 207, 680 266, 800 274" fill="none" stroke="#f85149" stroke-width="4"/>
  <circle cx="190" cy="128" r="7" fill="#f85149"/>
  <circle cx="495" cy="196" r="7" fill="#f85149"/>
  <circle cx="800" cy="274" r="7" fill="#f85149"/>

  <rect x="206" y="106" width="262" height="38" rx="6" fill="#2d171c" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="216" y="123" fill="#ffa198" font-family="-apple-system,Inter,sans-serif" font-size="11.5" font-weight="700">Falling: Procedural Prompt Crutches (High → Minimal)</text>
  <text x="216" y="138" fill="#c9d1d9" font-family="-apple-system,Inter,sans-serif" font-size="10.5">Rigid step scripts · hardcoded models · 54.7 KB dumps</text>

  <path d="M 190 270 C 330 262, 390 205, 495 192 C 600 179, 680 128, 800 120" fill="none" stroke="#3fb950" stroke-width="4"/>
  <circle cx="190" cy="270" r="7" fill="#3fb950"/>
  <circle cx="495" cy="192" r="7" fill="#3fb950"/>
  <circle cx="800" cy="120" r="7" fill="#3fb950"/>

  <rect x="520" y="96" width="268" height="40" rx="6" fill="#122d1f" stroke="#3fb950" stroke-opacity="0.8"/>
  <text x="530" y="113" fill="#7ee787" font-family="-apple-system,Inter,sans-serif" font-size="11.5" font-weight="700">Rising: Contracts &amp; Verifiers (Low → Strict)</text>
  <text x="530" y="128" fill="#c9d1d9" font-family="-apple-system,Inter,sans-serif" font-size="10.5">&lt;9 KB budget gate · lazy references · CI schema checks</text>

  <g font-family="-apple-system,Inter,sans-serif" text-anchor="middle">
    <text x="190" y="334" fill="#e6edf3" font-size="13" font-weight="700">Gen 1 · Early Tool-Use Era</text>
    <text x="190" y="352" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="11.5">GPT-4o / Claude 3.5</text>

    <text x="495" y="334" fill="#e6edf3" font-size="13" font-weight="700">Gen 2 · Hybrid Reasoning</text>
    <text x="495" y="352" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="11.5">GPT-5.4 / Sonnet 4</text>

    <text x="800" y="334" fill="#f2cc60" font-size="13" font-weight="700">Gen 3 · Frontier Multi-Model Cohort</text>
    <text x="800" y="352" fill="#d29922" font-family="ui-monospace,Consolas,monospace" font-size="11.5">Gemini 4 Carbon · GPT-6.2 Sol · Grok 4.7</text>
  </g>

  <text x="490" y="394" fill="#c9d1d9" font-family="-apple-system,Inter,sans-serif" font-size="12" text-anchor="middle">Takeaway: Yesterday's hand-holding prompts become tomorrow's truncation noise—every model upgrade requires subtracting crutches &amp; tightening gates.</text>
</svg>
