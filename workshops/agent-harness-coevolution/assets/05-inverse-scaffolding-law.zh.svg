<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="inv-zh-t">
  <title id="inv-zh-t">反向脚手架定律（Inverse Scaffolding Law）三代模型演进双曲线图</title>
  <rect width="980" height="420" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="36" y="40" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" font-weight="700">反向脚手架定律（Inverse Scaffolding Law）：随基座模型跃迁的 Harness 演进方向</text>
  <text x="36" y="64" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13">模型推理越强，死板的步骤微操（Procedural Crutches）越要退场；上下文预算卫生、真实工具契约与确定性验证器越要收紧</text>

  <!-- Inner Plot -->
  <rect x="48" y="84" width="884" height="260" rx="12" fill="#161b22" stroke="#30363d"/>
  <g stroke="#21262d" stroke-width="1">
    <line x1="110" y1="124" x2="880" y2="124"/>
    <line x1="110" y1="194" x2="880" y2="194"/>
    <line x1="110" y1="264" x2="880" y2="264"/>
    <line x1="110" y1="314" x2="880" y2="314"/>
  </g>
  <g fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="11" text-anchor="end">
    <text x="98" y="128">High / Strict</text>
    <text x="98" y="198">Medium</text>
    <text x="98" y="268">Low / Minimal</text>
  </g>

  <!-- X-axis Generation Columns: x=190, 495, 800 -->
  <g stroke="#30363d" stroke-dasharray="4 4">
    <line x1="190" y1="104" x2="190" y2="314"/>
    <line x1="495" y1="104" x2="495" y2="314"/>
    <line x1="800" y1="104" x2="800" y2="314"/>
  </g>

  <!-- Falling Curve: Procedural Scaffolding -->
  <path d="M 190 128 C 330 135, 390 185, 495 196 C 600 207, 680 266, 800 274" fill="none" stroke="#f85149" stroke-width="4"/>
  <circle cx="190" cy="128" r="7" fill="#f85149"/>
  <circle cx="495" cy="196" r="7" fill="#f85149"/>
  <circle cx="800" cy="274" r="7" fill="#f85149"/>

  <rect x="206" y="106" width="246" height="38" rx="6" fill="#2d171c" stroke="#f85149" stroke-opacity="0.7"/>
  <text x="216" y="123" fill="#ffa198" font-family="-apple-system,'PingFang SC',sans-serif" font-size="12" font-weight="700">下降曲线：过程性提示词拐杖 (High → Minimal)</text>
  <text x="216" y="138" fill="#c9d1d9" font-family="-apple-system,'PingFang SC',sans-serif" font-size="10.5">死板 CoT 模板 · 硬编码旧模型名 · 1,390 行全量粘贴</text>

  <!-- Rising Curve: Boundary Contracts & Verification -->
  <path d="M 190 270 C 330 262, 390 205, 495 192 C 600 179, 680 128, 800 120" fill="none" stroke="#3fb950" stroke-width="4"/>
  <circle cx="190" cy="270" r="7" fill="#3fb950"/>
  <circle cx="495" cy="192" r="7" fill="#3fb950"/>
  <circle cx="800" cy="120" r="7" fill="#3fb950"/>

  <rect x="536" y="96" width="250" height="40" rx="6" fill="#122d1f" stroke="#3fb950" stroke-opacity="0.8"/>
  <text x="546" y="113" fill="#7ee787" font-family="-apple-system,'PingFang SC',sans-serif" font-size="12" font-weight="700">上升曲线：边界契约与确定性验证 (Low → Strict)</text>
  <text x="546" y="128" fill="#c9d1d9" font-family="-apple-system,'PingFang SC',sans-serif" font-size="10.5">&lt;9 KB 路由预算门禁 · 按需披露 · CI 脚本/Schema 校验</text>

  <!-- Generation Labels -->
  <g font-family="-apple-system,'PingFang SC',sans-serif" text-anchor="middle">
    <text x="190" y="334" fill="#e6edf3" font-size="13" font-weight="700">Gen 1 · 早期工具调用期</text>
    <text x="190" y="352" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="11.5">GPT-4o / Claude 3.5</text>

    <text x="495" y="334" fill="#e6edf3" font-size="13" font-weight="700">Gen 2 · 混合推理过渡期</text>
    <text x="495" y="352" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="11.5">GPT-5.4 / Sonnet 4</text>

    <text x="800" y="334" fill="#f2cc60" font-size="13" font-weight="700">Gen 3 · 前沿多模型协同期</text>
    <text x="800" y="352" fill="#d29922" font-family="ui-monospace,Consolas,monospace" font-size="11.5">Gemini 4 Carbon · GPT-6.2 Sol · Grok 4.7</text>
  </g>

  <text x="490" y="394" fill="#c9d1d9" font-family="-apple-system,'PingFang SC',sans-serif" font-size="12.5" text-anchor="middle">结论：上代模型留下的“保姆式长提示词”在下代模型上反而变成截断噪声与注意力枷锁——每次模型升级必须同步做 Harness 减法与验证器加法。</text>
</svg>
