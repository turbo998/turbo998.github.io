<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="mat-zh-t">
  <title id="mat-zh-t">前沿多模型能力专长雷达与 62 个用户 Skills 路由热力矩阵</title>
  <rect width="980" height="460" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
