  <text x="36" y="64" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13">移除硬编码旧模型名，依托运行时 /subagents 路由让 Gemini 4 Carbon · GPT-6.2 Sol · Grok 4.7 · Gemini 3.8 Flash 各司其职</text>

