  <!-- R=73:  (230,192), (300,242), (273,324), (187,324), (160,242) -->
  <!-- R=37:  (230,228), (265,254), (252,295), (208,295), (195,254) -->
  <g fill="none" stroke="#30363d" stroke-width="1">
    <polygon points="230,155 335,231 295,354 165,354 125,231"/>
    <polygon points="230,192 300,242 273,324 187,324 160,242"/>
    <polygon points="230,228 265,254 252,295 208,295 195,254"/>
    <line x1="230" y1="265" x2="230" y2="155"/>
    <line x1="230" y1="265" x2="335" y2="231"/>
    <line x1="230" y1="265" x2="295" y2="354"/>
    <line x1="230" y1="265" x2="165" y2="354"/>
    <line x1="230" y1="265" x2="125" y2="231"/>
