  <polygon points="230,184 314,238 294,352 174,342 154,240" fill="#f0883e" fill-opacity="0.20" stroke="#f0883e" stroke-width="2.2"/>

  <g fill="#c9d1d9" font-family="-apple-system,'PingFang SC',sans-serif" font-size="11" font-weight="600">
