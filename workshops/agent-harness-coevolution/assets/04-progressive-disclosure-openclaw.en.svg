<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-labelledby="pd-en-t">
  <title id="pd-en-t">Progressive Disclosure Refactoring: openclaw-wechat-deployment Eager Context Load</title>
  <rect width="980" height="400" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="36" y="40" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="19" font-weight="700">Progressive Disclosure Refactoring (openclaw-wechat-deployment: 1,390 → 84 Lines, -94.0% Eager Load)</text>
  <text x="36" y="64" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="13">Replacing a 54.7 KB monolithic context dump with a 3.4 KB decision-tree router + 5 lazy-loaded references/*.md modules</text>

  <!-- Before -->
  <rect x="36" y="88" width="908" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="56" y="116" fill="#f85149" font-family="-apple-system,Inter,sans-serif" font-size="13.5" font-weight="700">Before (Monolithic Eager Dump): 1,390 lines (54.7 KB) injected into context on every trigger</text>
  <rect x="56" y="128" width="868" height="34" rx="6" fill="#0d74ff"/>
  <text x="490" y="150" fill="#ffffff" font-family="ui-monospace,Consolas,monospace" font-size="12.5" font-weight="700" text-anchor="middle">Monolithic SKILL.md · 1,390 lines / 54.7 KB (Bicep + cloud-init + Nginx + Webhook + Troubleshooting)</text>

  <!-- After -->
  <rect x="36" y="196" width="908" height="176" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="56" y="224" fill="#3fb950" font-family="-apple-system,Inter,sans-serif" font-size="13.5" font-weight="700">After (Progressive Disclosure): 84-line router (3.4 KB, -94.0% eager load) + 5 on-demand view modules</text>

  <rect x="56" y="238" width="96" height="40" rx="6" fill="#9e5a16" stroke="#d29922" stroke-width="1.5"/>
  <text x="104" y="256" fill="#f2cc60" font-family="ui-monospace,Consolas,monospace" font-size="11.5" font-weight="700" text-anchor="middle">SKILL.md</text>
  <text x="104" y="271" fill="#e6edf3" font-family="ui-monospace,Consolas,monospace" font-size="10.5" text-anchor="middle">84 ln (3.4KB)</text>

  <text x="170" y="263" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700">→</text>

  <g font-family="ui-monospace,Consolas,monospace">
    <rect x="196" y="238" width="140" height="40" rx="6" fill="#1c2530" stroke="#388bfd" stroke-dasharray="4 3"/>
    <text x="266" y="255" fill="#79c0ff" font-size="10.5" font-weight="700" text-anchor="middle">architecture-bicep</text>
    <text x="266" y="270" fill="#8b949e" font-size="10.5" text-anchor="middle">312 lines (lazy)</text>

    <rect x="346" y="238" width="145" height="40" rx="6" fill="#1c2530" stroke="#388bfd" stroke-dasharray="4 3"/>
    <text x="418" y="255" fill="#79c0ff" font-size="10.5" font-weight="700" text-anchor="middle">vm-bootstrap-docker</text>
    <text x="418" y="270" fill="#8b949e" font-size="10.5" text-anchor="middle">298 lines (lazy)</text>

    <rect x="501" y="238" width="140" height="40" rx="6" fill="#1c2530" stroke="#388bfd" stroke-dasharray="4 3"/>
    <text x="571" y="255" fill="#79c0ff" font-size="10.5" font-weight="700" text-anchor="middle">wechat-kf-webhook</text>
    <text x="571" y="270" fill="#8b949e" font-size="10.5" text-anchor="middle">276 lines (lazy)</text>

    <rect x="651" y="238" width="140" height="40" rx="6" fill="#1c2530" stroke="#388bfd" stroke-dasharray="4 3"/>
    <text x="721" y="255" fill="#79c0ff" font-size="10.5" font-weight="700" text-anchor="middle">troubleshooting</text>
    <text x="721" y="270" fill="#8b949e" font-size="10.5" text-anchor="middle">244 lines (lazy)</text>

    <rect x="801" y="238" width="123" height="40" rx="6" fill="#1c2530" stroke="#388bfd" stroke-dasharray="4 3"/>
    <text x="862" y="255" fill="#79c0ff" font-size="10.5" font-weight="700" text-anchor="middle">security-harden</text>
    <text x="862" y="270" fill="#8b949e" font-size="10.5" text-anchor="middle">176 lines (lazy)</text>
  </g>

  <rect x="56" y="296" width="868" height="58" rx="8" fill="#0d1117" stroke="#21262d"/>
  <text x="76" y="320" fill="#e6edf3" font-family="-apple-system,Inter,sans-serif" font-size="12.5" font-weight="600">Why Progressive Disclosure Unlocks Frontier Reasoning:</text>
  <text x="76" y="341" fill="#8b949e" font-family="-apple-system,Inter,sans-serif" font-size="12">GPT-6.2 Sol &amp; Gemini 4 Carbon natively traverse stage files via view; keeping SKILL.md ≤120 lines preserves &gt;75% attention budget during targeted stages.</text>
</svg>
