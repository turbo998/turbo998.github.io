<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="hero-zh-title hero-zh-desc">
  <title id="hero-zh-title">Skills 瘦身与系统提示词预算恢复效果（优化前后实测对比）</title>
  <desc id="hero-zh-desc">消除 available_skills 截断瓶颈，恢复 100% 语义路由可见性：Prompt 描述预算 386.0 降至 80.2 百字符，活跃目录体积 113.5 降至 56.5 MB，用户 Skill 描述可见率 1.2% 升至 100.0%，OpenClaw 主文件行数 139.0 降至 8.4 十行。</desc>
