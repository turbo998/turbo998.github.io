<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="tel-zh-t">
  <title id="tel-zh-t">120 个 Skills 真实调用遥测与分类处置全景图</title>
  <rect width="980" height="430" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="36" y="40" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" font-weight="700">120 个 Skills 遥测审计与去重瘦身处置（113.5 MB → 56.5 MB，-50.2%）</text>
  <text x="36" y="64" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13">基于 session_store_sql tool_requests 历史调用统计（2026-11-18）：95.8%（115/120）零调用，驱动精准分层治理</text>

  <!-- Left Card: Telemetry Invocations -->
  <rect x="36" y="86" width="430" height="314" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="58" y="116" fill="#e6edf3" font-family="-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="700">A. 真实历史调用分布（仅 5 / 120 被触发）</text>
  <text x="58" y="138" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="11.5">115 skills = 0 calls (95.8%) · 5 skills = 12 total calls</text>

  <!-- Bars for top 5 invoked skills -->
  <g font-family="ui-monospace,Consolas,monospace" font-size="12">
    <text x="58" y="174" fill="#c9d1d9">azure-style-presentation</text>
    <rect x="250" y="160" width="165" height="18" rx="4" fill="#0d74ff"/>
    <text x="424" y="174" fill="#79c0ff" font-weight="700">×5</text>

    <text x="58" y="208" fill="#c9d1d9">wechat-article</text>
    <rect x="250" y="194" width="99" height="18" rx="4" fill="#1f6feb"/>
    <text x="358" y="208" fill="#79c0ff" font-weight="700">×3</text>

    <text x="58" y="242" fill="#c9d1d9">powerpoint</text>
    <rect x="250" y="228" width="66" height="18" rx="4" fill="#388bfd"/>
    <text x="325" y="242" fill="#79c0ff" font-weight="700">×2</text>

    <text x="58" y="276" fill="#c9d1d9">azure-prepare</text>
    <rect x="250" y="262" width="33" height="18" rx="4" fill="#58a6ff"/>
    <text x="292" y="276" fill="#79c0ff" font-weight="700">×1</text>

    <text x="58" y="310" fill="#c9d1d9">browser-use</text>
    <rect x="250" y="296" width="33" height="18" rx="4" fill="#58a6ff"/>
    <text x="292" y="310" fill="#79c0ff" font-weight="700">×1</text>

    <rect x="58" y="334" width="386" height="46" rx="8" fill="#2d171c" stroke="#f85149" stroke-opacity="0.6"/>
    <text x="251" y="355" fill="#ffa198" font-family="-apple-system,'PingFang SC',sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">其余 115 个 Skills 历史调用 = 0 次（占比 95.8%）</text>
    <text x="251" y="372" fill="#c9d1d9" font-family="-apple-system,'PingFang SC',sans-serif" font-size="11" text-anchor="middle">并非全部无用：其中 80 个因 12 KB 悬崖截断而“隐身”</text>
  </g>

  <!-- Right Card: 120-Skill Disposition Breakdown -->
  <rect x="488" y="86" width="456" height="314" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="510" y="116" fill="#e6edf3" font-family="-apple-system,'PingFang SC',sans-serif" font-size="15" font-weight="700">B. 120 个目录审计后五类去向（83 活跃 + 37 清理）</text>

  <!-- Stacked 100% Bar (width 412px: 213 + 72 + 72 + 48 + 7 = 412) -->
  <g transform="translate(510, 134)">
    <rect x="0" y="0" width="213" height="28" rx="4" fill="#238636"/>
    <rect x="215" y="0" width="71" height="28" rx="3" fill="#1f6feb"/>
    <rect x="288" y="0" width="71" height="28" rx="3" fill="#9e5a16"/>
    <rect x="361" y="0" width="43" height="28" rx="3" fill="#8957e5"/>
    <rect x="406" y="0" width="6" height="28" rx="2" fill="#f85149"/>
  </g>

  <!-- Breakdown Rows -->
  <g font-family="-apple-system,'PingFang SC',sans-serif" font-size="12.5">
    <rect x="510" y="182" width="12" height="12" rx="3" fill="#238636"/>
    <text x="530" y="193" fill="#e6edf3" font-weight="600">保留并压缩 Frontmatter 用户技能 (~/.copilot)</text>
    <text x="922" y="193" fill="#56d364" font-family="ui-monospace,Consolas,monospace" font-weight="700" text-anchor="end">62 (51.7%)</text>

    <rect x="510" y="220" width="12" height="12" rx="3" fill="#1f6feb"/>
    <text x="530" y="231" fill="#e6edf3" font-weight="600">保留活跃 Azure / Agent 插件技能 (~/.agents)</text>
    <text x="922" y="231" fill="#79c0ff" font-family="ui-monospace,Consolas,monospace" font-weight="700" text-anchor="end">21 (17.5%)</text>

    <rect x="510" y="258" width="12" height="12" rx="3" fill="#9e5a16"/>
    <text x="530" y="269" fill="#e6edf3" font-weight="600">归档零调用 / 被原生能力替代的旧技能</text>
    <text x="922" y="269" fill="#e3b341" font-family="ui-monospace,Consolas,monospace" font-weight="700" text-anchor="end">21 (17.5%)</text>

    <rect x="510" y="296" width="12" height="12" rx="3" fill="#8957e5"/>
    <text x="530" y="307" fill="#e6edf3" font-weight="600">跨目录完全重复技能去重 (~/.agents 副本)</text>
    <text x="922" y="307" fill="#d2a8ff" font-family="ui-monospace,Consolas,monospace" font-weight="700" text-anchor="end">14 (11.7%)</text>

    <rect x="510" y="334" width="12" height="12" rx="3" fill="#f85149"/>
    <text x="530" y="345" fill="#e6edf3" font-weight="600">移除 Windows 不兼容的 macOS 专属技能</text>
    <text x="922" y="345" fill="#ffa198" font-family="ui-monospace,Consolas,monospace" font-weight="700" text-anchor="end">2 (1.7%)</text>

    <line x1="510" y1="362" x2="922" y2="362" stroke="#30363d"/>
    <text x="510" y="384" fill="#8b949e" font-size="11.5">活跃总数：83 个（56.5 MB） · 释放磁盘：56.97 MB（-50.2%）</text>
  </g>
</svg>
