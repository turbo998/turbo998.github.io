<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img" aria-labelledby="cliff-en-t">
  <title id="cliff-en-t">&lt;available_skills&gt; 12 KB System-Prompt Truncation Cliff</title>
  <defs>
    <pattern id="stripe-red-en" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#3d1319"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#f85149" stroke-width="3" stroke-opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="980" height="390" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="36" y="40" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="19" font-weight="700">&lt;available_skills&gt; 12 KB Prompt Budget Cliff (Before: 98.8% Blind vs After: 100% Routed)</text>
  <text x="36" y="64" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="13">Runtime caps &lt;available_skills&gt; at ~12,000 chars; overflow silently strips YAML descriptions down to bare skill names</text>

  <!-- Before Row -->
  <text x="36" y="132" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="14" font-weight="700">Before Cleanup</text>
  <text x="36" y="152" fill="#f85149" font-family="ui-monospace,Consolas,monospace" font-size="11.5">42.6 KB demand · 1.2% visible</text>

  <rect x="160" y="112" width="69" height="48" rx="4" fill="#1f6feb"/>
  <rect x="231" y="112" width="22" height="48" rx="3" fill="#388bfd"/>
  <rect x="255" y="112" width="641" height="48" rx="4" fill="url(#stripe-red-en)" stroke="#f85149" stroke-width="1.2"/>
  <text x="194" y="140" fill="#ffffff" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle">4.0 KB</text>
  <text x="194" y="176" fill="#79c0ff" font-family="-apple-system,Inter,sans-serif" font-size="11" text-anchor="middle">22 Plugin Skills</text>
  <text x="242" y="104" fill="#a5d6ff" font-family="ui-monospace,Consolas,monospace" font-size="10.5" text-anchor="middle">1.1 KB (accessibility)</text>
  <text x="575" y="141" fill="#ffaba8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">37.5 KB Overflow Zone: 80 / 81 User Skills TRUNCATED TO NAME-ONLY (Router Blindness)</text>

  <!-- After Row -->
  <text x="36" y="248" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif" font-size="14" font-weight="700">After Compaction</text>
  <text x="36" y="268" fill="#3fb950" font-family="ui-monospace,Consolas,monospace" font-size="11.5">8.02 KB user · 100% visible</text>

  <rect x="160" y="228" width="69" height="48" rx="4" fill="#1f6feb"/>
  <rect x="231" y="228" width="138" height="48" rx="4" fill="#9e5a16" stroke="#d29922" stroke-width="1.4"/>
  <rect x="371" y="228" width="69" height="48" rx="4" fill="#122d1f" stroke="#3fb950" stroke-dasharray="5 3" stroke-width="1.4"/>
  <text x="194" y="256" fill="#ffffff" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle">4.0 KB</text>
  <text x="300" y="250" fill="#f2cc60" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700" text-anchor="middle">8.02 KB (62/62)</text>
  <text x="300" y="267" fill="#e6edf3" font-family="-apple-system,Inter,sans-serif" font-size="10.5" text-anchor="middle">100% Semantic Triggers</text>
  <text x="405" y="250" fill="#56d364" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle">3.98 KB</text>
  <text x="405" y="266" fill="#7ee787" font-family="-apple-system,Inter,sans-serif" font-size="10" text-anchor="middle">Headroom</text>

  <!-- 12 KB Cliff Line -->
  <line x1="368" y1="88" x2="368" y2="318" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="288" y="80" width="160" height="22" rx="6" fill="#3d1319" stroke="#f85149" stroke-width="1"/>
  <text x="368" y="95" fill="#ffa198" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" text-anchor="middle">12 KB Truncation Cliff</text>

  <line x1="160" y1="322" x2="920" y2="322" stroke="#30363d" stroke-width="1.2"/>
  <g fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="11">
    <text x="160" y="342" text-anchor="middle">0 KB</text>
    <text x="368" y="342" fill="#ffa198" text-anchor="middle">12 KB Cap</text>
    <text x="505" y="342" text-anchor="middle">20 KB</text>
    <text x="678" y="342" text-anchor="middle">30 KB</text>
    <text x="851" y="342" text-anchor="middle">40 KB</text>
    <text x="905" y="342" text-anchor="middle">42.6 KB</text>
  </g>
  <text x="490" y="370" fill="#c9d1d9" font-family="-apple-system,Inter,sans-serif" font-size="12" text-anchor="middle">Fix: Archived 21 zero-call user skills + compressed 62 YAML descriptions to ≤140 chars (avg 129 chars), cutting metadata 38,600 → 8,019 chars (-79.2%)</text>
</svg>
