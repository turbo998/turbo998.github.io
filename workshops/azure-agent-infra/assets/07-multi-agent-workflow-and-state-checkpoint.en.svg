<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F1D1D" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="720" rx="16" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1080" height="6" rx="3" fill="url(#headerGrad)"/>
  <text x="32" y="40" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="700">Figure 7 · Multi-Agent Workflows (MAF × Copilot SDK × Durable) and Persistent State</text>
  <text x="32" y="64" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13">Top: automated incident diagnosis and code repair (Pitch Slide 13) · Bottom: Azure HorizonDB vs Cosmos DB vs Sandbox Snapshot</text>

  <!-- Top Workflow Sequence -->
  <rect x="32" y="84" width="1016" height="276" rx="10" fill="#0F172A" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="48" y="110" fill="#93C5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">END-TO-END MULTI-AGENT WORKFLOW · MICROSOFT AGENT FRAMEWORK (MAF) + GITHUB COPILOT SDK</text>

  <!-- Step Boxes -->
  <rect x="48" y="128" width="180" height="142" rx="8" fill="url(#roseGrad)" stroke="#F87171"/>
  <text x="138" y="150" text-anchor="middle" fill="#FECDD3" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">STEP 1 · TRIGGER</text>
  <text x="138" y="170" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Production alert / ticket</text>
  <text x="138" y="192" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Azure Monitor / IcM P1</text>
  <text x="138" y="210" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Event Grid / Webhook</text>
  <text x="138" y="228" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Inject TraceID + tenant context</text>
  <text x="138" y="252" text-anchor="middle" fill="#FDE68A" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">t = 0s</text>

  <rect x="248" y="128" width="188" height="142" rx="8" fill="url(#blueGrad)" stroke="#60A5FA"/>
  <text x="342" y="150" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">STEP 2 · DIAGNOSIS</text>
  <text x="342" y="170" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">LangGraph diagnosis Agent</text>
  <text x="342" y="192" text-anchor="middle" fill="#DBEAFE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Runs on AKS / ACA Apps</text>
  <text x="342" y="210" text-anchor="middle" fill="#DBEAFE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Query Kusto logs + recent PRs</text>
  <text x="342" y="228" text-anchor="middle" fill="#DBEAFE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Write HorizonDB Checkpoint</text>
  <text x="342" y="252" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">Find root-cause file and line</text>

  <rect x="456" y="128" width="196" height="142" rx="8" fill="url(#tealGrad)" stroke="#34D399"/>
  <text x="554" y="150" text-anchor="middle" fill="#A7F3D0" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">STEP 3 · CODING AGENT</text>
  <text x="554" y="170" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">GitHub Copilot SDK</text>
  <text x="554" y="192" text-anchor="middle" fill="#D1FAE5" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• ACA Sandbox / Kata VM</text>
  <text x="554" y="210" text-anchor="middle" fill="#D1FAE5" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Checkout code + write patch</text>
  <text x="554" y="228" text-anchor="middle" fill="#D1FAE5" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Pass pytest inside sandbox</text>
  <text x="554" y="252" text-anchor="middle" fill="#FDE68A" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">Snapshot workspace state</text>

  <rect x="672" y="128" width="180" height="142" rx="8" fill="url(#purpleGrad)" stroke="#A78BFA"/>
  <text x="762" y="150" text-anchor="middle" fill="#DDD6FE" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">STEP 4 · COMPLIANCE</text>
  <text x="762" y="170" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Foundry compliance Agent</text>
  <text x="762" y="192" text-anchor="middle" fill="#EDE9FE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Check security/change policy</text>
  <text x="762" y="210" text-anchor="middle" fill="#EDE9FE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Entra Agent ID signed trail</text>
  <text x="762" y="228" text-anchor="middle" fill="#EDE9FE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Generate risk assessment card</text>
  <text x="762" y="252" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">Policy Gate Passed</text>

  <rect x="872" y="128" width="160" height="142" rx="8" fill="url(#amberGrad)" stroke="#FBBF24"/>
  <text x="952" y="150" text-anchor="middle" fill="#FDE68A" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">STEP 5 · APPROVAL</text>
  <text x="952" y="170" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Durable human-approval gate</text>
  <text x="952" y="192" text-anchor="middle" fill="#FEF3C7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Teams/Slack approval card</text>
  <text x="952" y="210" text-anchor="middle" fill="#FEF3C7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Wait with zero compute cost</text>
  <text x="952" y="228" text-anchor="middle" fill="#FEF3C7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• On approval: merge PR/canary</text>
  <text x="952" y="252" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">70%+ lower MTTR</text>

  <rect x="48" y="284" width="984" height="60" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="64" y="308" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Why decouple compute and state (Pitch Slide 10)?</text>
  <text x="330" y="308" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">Multi-step reasoning, tool retries and cross-day approvals: never store state in restartable/scale-in containers.</text>
  <text x="64" y="330" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">MAF state machines + Durable Functions orchestration + HorizonDB/Cosmos DB checkpoints resume from the last step after any compute-node failure.</text>

  <!-- Bottom State & Memory Comparison -->
  <rect x="32" y="376" width="1016" height="320" rx="10" fill="#0F172A" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="48" y="402" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">STATE, MEMORY &amp; CHECKPOINT PERSISTENCE MATRIX (THREE MECHANISMS)</text>

  <rect x="48" y="418" width="320" height="260" rx="8" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="208" y="444" text-anchor="middle" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="700">1. Azure HorizonDB (Preview)</text>
  <text x="208" y="464" text-anchor="middle" fill="#C4B5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">AI-native PostgreSQL state/vector engine</text>
  <text x="64" y="490" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• One engine, three data types:</text>
  <text x="76" y="508" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- ACID relational tables (orders/quotas/audits/ACLs)</text>
  <text x="76" y="524" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- JSONB (Thread message trees / Tool outputs)</text>
  <text x="76" y="540" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- DiskANN vectors (short/long-term hybrid recall)</text>
  <text x="64" y="564" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Split storage/compute + up to 15 read replicas, ms scaling</text>
  <text x="64" y="584" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Native LangGraph / MAF Checkpoint interfaces</text>
  <text x="64" y="604" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• No sync lag across separate relational/document/vector DBs</text>
  <text x="64" y="632" fill="#F87171" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">⚠ Preview: verify Region for critical production, or use Azure Database for PostgreSQL Flexible Server as fallback.</text>

  <rect x="380" y="418" width="320" height="260" rx="8" fill="#1E293B" stroke="#38BDF8"/>
  <text x="540" y="444" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="700">2. Azure Cosmos DB</text>
  <text x="540" y="464" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Global multi-active NoSQL sessions/events</text>
  <text x="396" y="490" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Single-digit ms R/W; 99.999% multi-region HA SLA</text>
  <text x="396" y="512" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Schemaless JSON for concurrent chats/event sourcing</text>
  <text x="396" y="534" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Vector search + Change Feed → Azure Functions</text>
  <text x="396" y="556" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Foundry Agent Service: BYO Cosmos DB threads</text>
  <text x="396" y="584" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Reference: Commerzbank virtual assistant Ava</text>
  <text x="408" y="602" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- 30,000+ service chats/month; ~75% fully automated</text>
  <text x="408" y="618" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- Live shared context across specialist sub-Agents</text>
  <text x="396" y="646" fill="#38BDF8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">Fits: global To-C / massive concurrent session state</text>

  <rect x="712" y="418" width="320" height="260" rx="8" fill="#1E293B" stroke="#34D399"/>
  <text x="872" y="444" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="700">3. Sandbox Snapshot &amp; Volumes</text>
  <text x="872" y="464" text-anchor="middle" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Freeze process memory + filesystem state</text>
  <text x="728" y="490" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Databases store variables, not:</text>
  <text x="740" y="508" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- Open browser DOM, login sessions and Cookies</text>
  <text x="740" y="524" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- Pandas/PyTorch variables in Jupyter/Python memory</text>
  <text x="740" y="540" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">- Build artifacts, Git worktrees, temporary dependencies</text>
  <text x="728" y="564" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Three complementary layers:</text>
  <text x="740" y="582" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">1. ACA Sandboxes: memory/disk snapshots + Persistent Volume</text>
  <text x="740" y="598" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">2. AKSClaw: shared RO skills PV + private RW state PV</text>
  <text x="740" y="614" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">3. E2B on VMSS: UFFD memory + NBD block deltas (108ms)</text>
  <text x="728" y="646" fill="#34D399" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">Pair: DB business checkpoints + environment snapshots</text>
</svg>
