<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 740" width="1080" height="740">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F1D1D" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="740" rx="16" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1080" height="6" rx="3" fill="url(#headerGrad)"/>
  <text x="32" y="40" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="700">Figure 3 · AI Agent Infra on Azure: Two-Stage Architecture Routing and State Pairing</text>
  <text x="32" y="64" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13">Stage A: business/delivery gate (Playbook Slide 7) × Stage B: runtime/state routing (Pitch Slides 7–12)</text>

  <!-- Left Panel: Stage A Macro Qualification -->
  <rect x="32" y="84" width="490" height="624" rx="10" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="52" y="112" fill="#60A5FA" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">STAGE A · BUSINESS &amp; DELIVERY CAPABILITY GATE (FIELD DECISION TREE)</text>

  <rect x="142" y="132" width="270" height="48" rx="8" fill="url(#blueGrad)" stroke="#93C5FD"/>
  <text x="277" y="154" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">Q1: Target customers: To-B or To-C?</text>
  <text x="277" y="171" text-anchor="middle" fill="#DBEAFE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Sets scale elasticity, margin sensitivity and tenant isolation</text>

  <!-- To-C Branch -->
  <line x1="205" y1="180" x2="135" y2="228" stroke="#38BDF8" stroke-width="2"/>
  <text x="145" y="208" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">To-C / AI Native</text>
  <rect x="52" y="228" width="175" height="72" rx="8" fill="url(#tealGrad)" stroke="#34D399"/>
  <text x="139" y="252" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Direct to Modernization PaaS</text>
  <text x="139" y="270" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">ACA / AKS / Azure VMSS</text>
  <text x="139" y="287" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">Extreme elasticity + cost per Token/sandbox</text>

  <!-- To-B Branch -->
  <line x1="345" y1="180" x2="380" y2="228" stroke="#60A5FA" stroke-width="2"/>
  <text x="372" y="208" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">To-B internal/B2B</text>
  <rect x="255" y="228" width="245" height="62" rx="8" fill="#1E293B" stroke="#60A5FA"/>
  <text x="377" y="252" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Q2: Need control beyond managed services?</text>
  <text x="377" y="272" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">(Custom OS kernel/private networks/untrusted sandboxes/extreme cost)</text>

  <!-- Q2 -> No -->
  <line x1="315" y1="290" x2="155" y2="346" stroke="#34D399" stroke-width="2"/>
  <text x="200" y="324" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">No (controlled tools)</text>
  <rect x="52" y="346" width="205" height="74" rx="8" fill="url(#blueGrad)" stroke="#60A5FA"/>
  <text x="154" y="370" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Microsoft Foundry Hosted</text>
  <text x="154" y="388" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">1,400+ MCP connectors + Agent ID</text>
  <text x="154" y="405" text-anchor="middle" fill="#DBEAFE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">Note: still tune app prompts/tools</text>

  <!-- Q2 -> Yes -->
  <line x1="415" y1="290" x2="415" y2="346" stroke="#FBBF24" stroke-width="2"/>
  <text x="424" y="324" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">Yes (infra control)</text>
  <rect x="280" y="346" width="220" height="62" rx="8" fill="#1E293B" stroke="#FBBF24"/>
  <text x="390" y="370" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Q3: Dedicated development/platform team?</text>
  <text x="390" y="390" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">Can deliver containers/K8s/VMs and orchestration</text>

  <!-- Q3 -> No (Red Gate) -->
  <line x1="335" y1="408" x2="165" y2="465" stroke="#F87171" stroke-width="2"/>
  <text x="210" y="445" fill="#F87171" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">No (no dev team)</text>
  <rect x="52" y="465" width="225" height="82" rx="8" fill="url(#roseGrad)" stroke="#F87171" stroke-width="1.5"/>
  <text x="164" y="489" text-anchor="middle" fill="#FECDD3" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">⛔ Delivery hold gate</text>
  <text x="164" y="507" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Engage CSU or an AI partner to co-build</text>
  <text x="164" y="525" text-anchor="middle" fill="#FDA4AF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">Never force infra-control workloads onto Foundry</text>

  <!-- Q3 -> Yes -->
  <line x1="435" y1="408" x2="405" y2="465" stroke="#34D399" stroke-width="2"/>
  <text x="430" y="445" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">Yes (team ready)</text>
  <rect x="295" y="465" width="205" height="82" rx="8" fill="url(#tealGrad)" stroke="#34D399" stroke-width="1.5"/>
  <text x="397" y="489" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">✅ Enter Stage B technical selection</text>
  <text x="397" y="507" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Modernization PaaS / VM</text>
  <text x="397" y="525" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">Map workload traits to 6 runtimes</text>

  <rect x="52" y="566" width="448" height="122" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="68" y="588" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Opportunity qualification (4 Foundations) and $10K model-signal gate:</text>
  <text x="68" y="608" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">1. Runtime (ACA/AKS/Functions/App Service) · 2. Data/State (HorizonDB/PG/Cosmos/Redis)</text>
  <text x="68" y="626" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">3. AI &amp; Integration (Foundry Models/Search/APIM) · 4. Ops/Security (Monitor/KeyVault/Defender)</text>
  <text x="68" y="646" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Continuity: non-model families active ≥3 months in a 5-month window, including the latest consecutive 2 months</text>
  <text x="68" y="666" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Model gate: Foundry Models ≥$10,000/month for the latest 3 months is a strong signal; below it, a strong non-model path remains valid</text>

  <!-- Right Panel: Stage B Technical Routing -->
  <rect x="542" y="84" width="506" height="624" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="562" y="112" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">STAGE B · WORKLOAD → RUNTIME + STATE PAIRING</text>

  <!-- 5 Technical Routing Cards -->
  <rect x="562" y="130" width="466" height="96" rx="8" fill="#1E293B" stroke="#38BDF8"/>
  <text x="578" y="152" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">Path 1 · Long approvals / cross-system transactions / external wake events</text>
  <text x="578" y="172" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Procure/finance/tickets: hrs–days approval; power/restart: determ. replay, idemp. retry</text>
  <text x="578" y="192" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">Runtime: Azure Functions + Durable Functions + ACA Apps</text>
  <text x="578" y="210" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">State: Durable Task Scheduler + Azure HorizonDB / Cosmos DB</text>

  <rect x="562" y="238" width="466" height="96" rx="8" fill="#1E293B" stroke="#34D399"/>
  <text x="578" y="260" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">Path 2 · Short untrusted code / data analysis / file parsing</text>
  <text x="578" y="280" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">LLM Python/Shell per task; ms warm-pool allocation (~210ms); dispose after use</text>
  <text x="578" y="300" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">Runtime: ACA Apps (orchestration) + ACA Dynamic Sessions (warm Hyper-V)</text>
  <text x="578" y="318" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">State: external HorizonDB/Cosmos DB; session disposal wipes local files</text>

  <rect x="562" y="346" width="466" height="96" rx="8" fill="#1E293B" stroke="#FBBF24"/>
  <text x="578" y="368" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">Path 3 · Stateful Coding Agent / browser automation / cross-task workspace</text>
  <text x="578" y="388" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Custom OCI images, PVs, selected ports; explicit per-user pause/resume</text>
  <text x="578" y="408" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">Runtime: ACA Apps / AKS + ACA Sandboxes (Preview)</text>
  <text x="578" y="426" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">State: Sandbox memory/disk snapshots + Persistent Volume + HorizonDB</text>

  <rect x="562" y="454" width="466" height="106" rx="8" fill="#1E293B" stroke="#A78BFA"/>
  <text x="578" y="476" fill="#C4B5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">Path 4 · Enterprise multi-tenant Agents / dev &amp; SRE (AKSClaw)</text>
  <text x="578" y="496" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Persistent per-engineer/tenant; BYO Copilot/Hermes/OpenClaw; 5 hard security barriers</text>
  <text x="578" y="516" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">Runtime: AKS (Automatic/Standard) + Kata Pod VM + KEDA + AI Gateway</text>
  <text x="578" y="534" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">State: shared RO skills PV + private state PV + HorizonDB (ACID+Vector)</text>

  <rect x="562" y="572" width="466" height="116" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="578" y="594" fill="#FDA4AF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">Path 5 · 100,000+ concurrent cloud PCs / sub-150ms restore (Manus × E2B)</text>
  <text x="578" y="614" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">AI-native: full Linux/GUI per task; ~108ms–132ms wake; million-session limits</text>
  <text x="578" y="634" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">Runtime: Azure VMSS Flexible (D96as_v7) + Nomad/Consul + Firecracker</text>
  <text x="578" y="652" fill="#38BDF8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">Gateway: AppGW WAF v2 (dual) + APIM (dynamic Host Header limits)</text>
  <text x="578" y="670" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">State: UFFD paging restore + NBD deltas + PG primary/replica + Blob</text>
</svg>
