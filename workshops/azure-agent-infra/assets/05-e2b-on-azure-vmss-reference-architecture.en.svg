  <rect width="1080" height="740" rx="16" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1080" height="6" rx="3" fill="url(#headerGrad)"/>
  <text x="32" y="40" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="700">Figure 5 · E2B on Azure VMSS: Production Reference (Manus × E2B 100,000+ Sandboxes)</text>
  <text x="32" y="64" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13">AppGW WAF v2 dual frontend × APIM per-dynamic-Host limits × Nomad/Consul scheduling × Azure VMSS Flexible (D96as_v7)</text>

  <!-- Top Traffic & Dual-Hop Gateway Layer -->
  <rect x="32" y="84" width="1016" height="156" rx="10" fill="url(#blueGrad)" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="48" y="108" fill="#93C5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">INGRESS &amp; PER-SANDBOX SESSION RATE-LIMITING PLANE (100,000+ DYNAMIC SUBDOMAINS)</text>

  <rect x="48" y="122" width="185" height="102" rx="8" fill="#0F172A" fill-opacity="0.82" stroke="#38BDF8"/>
  <text x="140" y="144" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">1. Agent SDK / Client</text>
  <text x="140" y="164" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">*.e2b.domain.com</text>
  <text x="140" y="182" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• HTTPS control-plane API</text>
  <text x="140" y="198" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• WSS terminal/desktop streams</text>
  <text x="140" y="214" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">&lt;port&gt;-&lt;id&gt;.domain</text>

  <rect x="255" y="122" width="250" height="102" rx="8" fill="#0F172A" fill-opacity="0.82" stroke="#60A5FA"/>
  <text x="380" y="144" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">2. Application Gateway (WAF v2)</text>
  <text x="380" y="164" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Dual frontend IPs (Public + Private)</text>
  <text x="380" y="182" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Public IP (443): wildcard TLS offload + OWASP WAF</text>
  <text x="380" y="198" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Private IP (8080): receive/forward APIM callbacks</text>
  <text x="380" y="214" text-anchor="middle" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Avoid APIM direct-to-VMSS backend pool limits</text>

  <rect x="527" y="122" width="275" height="102" rx="8" fill="#0F172A" fill-opacity="0.82" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="664" y="144" text-anchor="middle" fill="#FDE68A" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">3. Azure API Management (APIM)</text>
  <text x="664" y="164" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Per-session limits by dynamic Host Header</text>
  <text x="664" y="182" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">counter-key="@(Headers['Host'])"</text>
  <text x="664" y="198" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 100,000+ active sandbox sessions counted independently</text>
  <text x="664" y="214" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Native bidirectional WebSocket passthrough</text>

  <rect x="824" y="122" width="208" height="102" rx="8" fill="#0F172A" fill-opacity="0.82" stroke="#34D399"/>
  <text x="928" y="144" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">4. API Pool (VMSS)</text>
  <text x="928" y="164" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">Client Proxy + E2B API</text>
  <text x="928" y="182" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Ports 3001/3002 dynamic routing</text>
  <text x="928" y="198" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Port 50001 session create/delete</text>
  <text x="928" y="214" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Consul discovery &amp; health checks</text>

  <!-- Middle Compute & Orchestration Plane -->
  <rect x="32" y="254" width="680" height="310" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="48" y="280" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">CLIENT POOL · AZURE VMSS FLEXIBLE (STANDARD_D96AS_V7 · UP TO 1,000 VMS)</text>
  <text x="48" y="300" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">5th Gen AMD EPYC Turin (4.5GHz) + Azure Boost · 96 vCPU / 384 GiB RAM · Dense KVM + Firecracker sandboxes</text>

  <rect x="48" y="314" width="312" height="162" rx="8" fill="#1E293B" stroke="#34D399"/>
  <text x="204" y="336" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Client Node #1 (D96as_v7 · 96vCPU/384GiB)</text>
  <text x="64" y="358" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Nomad Client + Consul Agent + Node Exporter</text>
  <text x="64" y="378" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Orchestrator Daemon (gRPC sandbox lifecycle)</text>
  <text x="64" y="398" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• HugePages pool (~326 GiB reserved for MicroVMs)</text>
  <text x="64" y="418" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• Hundreds of parallel Firecracker MicroVMs (108ms start)</text>
  <text x="64" y="438" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Template Manager (custom OCI → rootfs.ext4)</text>
  <text x="64" y="458" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Vector Agent collects sandbox logs/metrics</text>

  <rect x="376" y="314" width="320" height="162" rx="8" fill="#1E293B" stroke="#34D399"/>
  <text x="536" y="336" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">VMSS asymmetric Scale Rules</text>
  <text x="392" y="358" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">▲ Scale-Out: automatic when CPU > 60%</text>
  <text x="392" y="376" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Reserve 40% CPU for burst MicroVM creation</text>
  <text x="392" y="398" fill="#F87171" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">▼ Scale-In: never use CPU alone</text>
  <text x="392" y="416" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• HugePages distort normal host-memory metrics</text>
  <text x="392" y="434" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Require HugePages metrics + snapshot migration/draining</text>
  <text x="392" y="454" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Up to 1,000 hosts per VMSS Flexible scale set</text>

  <rect x="48" y="488" width="648" height="62" rx="8" fill="url(#tealGrad)" stroke="#34D399"/>
  <text x="64" y="512" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">100,000-sandbox sizing (agent_infra_sizer.py verified):</text>
  <text x="64" y="532" fill="#D1FAE5" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">512 MiB/Sandbox × 85% HugePages × 60% fill = 384 steady sandboxes/node → 261 D96as_v7 nodes for 100,000 concurrent sandboxes</text>

  <!-- Right Column: Server Pool + Data + Observability -->
  <rect x="728" y="254" width="320" height="310" rx="10" fill="url(#purpleGrad)" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="744" y="280" fill="#C4B5FD" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">CONTROL, STORAGE &amp; OBSERVABILITY</text>

  <rect x="744" y="294" width="288" height="76" rx="6" fill="#0F172A" fill-opacity="0.82" stroke="#8B5CF6"/>
  <text x="888" y="316" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Server Pool (Nomad + Consul)</text>
  <text x="888" y="336" text-anchor="middle" fill="#C4B5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• 3~5-node strongly consistent Raft scheduler</text>
  <text x="888" y="354" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Schedule MicroVMs on bare metal/VMs, not K8s</text>

  <rect x="744" y="380" width="288" height="84" rx="6" fill="#0F172A" fill-opacity="0.82" stroke="#8B5CF6"/>
  <text x="888" y="402" text-anchor="middle" fill="#FBBF24" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Azure Database for PostgreSQL</text>
  <text x="888" y="422" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Primary writes + Read Replicas for read scale</text>
  <text x="888" y="440" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• PgBouncer pooling + Cache Lease Lock avoids stampedes</text>
  <text x="888" y="456" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">OpenAI pattern (50 read replicas · 1,000,000+ QPS)</text>

  <rect x="744" y="474" width="288" height="76" rx="6" fill="#0F172A" fill-opacity="0.82" stroke="#8B5CF6"/>
  <text x="888" y="496" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">Snapshots &amp; Observability</text>
  <text x="888" y="516" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Azure Blob / Files / Lustre store memfile+rootfs</text>
  <text x="888" y="534" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">• Prometheus + Loki + Grafana + Azure Monitor</text>

  <!-- Bottom Warning on Open-Source E2B Gaps -->
  <rect x="32" y="578" width="1016" height="130" rx="10" fill="url(#roseGrad)" stroke="#F87171" stroke-width="1.5"/>
  <text x="48" y="604" fill="#FECDD3" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">ARCHITECTURAL CAUTION · Three open-source E2B production gaps and Azure hardening (Deep Dive Slide 34)</text>
  <text x="48" y="628" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">1. Single-process control state: E2B API maps nodes/sandboxes in RAM; no horizontal scaling; restart loses state → externalize to PostgreSQL/Redis.</text>
  <text x="48" y="652" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">2. Orphan sandboxes: Client Node restart lacks automatic GC/self-healing rescheduling → add Nomad health probes + VMSS automatic instance repair.</text>
  <text x="48" y="676" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">3. Gateway bottleneck: no distributed rate limits for millions of dynamic subdomains or WAF → front with dual-frontend AppGW WAF v2 + APIM rate-limit-by-key.</text>
</svg>
