  <rect x="408" y="106" width="384" height="476" rx="12" fill="#0F1E2E" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="428" y="136" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ Deterministic VPAM &amp; SRA Broker (Hardened)</text>

  <rect x="424" y="152" width="352" height="96" rx="8" fill="#162A3E" stroke="#38BDF8" stroke-width="1"/>
  <text x="438" y="174" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 1: Vendor Ticket Scrubbing &amp; Taint Tagging (untrusted=True)</text>
  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Strips free-text vendor justifications &amp; maintenance PDFs</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Extracts typed slots (Vendor_ID, Target_Host_Enum, Duration_Min)</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Prevents vendor access tickets from hijacking session policies</text>

  <rect x="424" y="258" width="352" height="96" rx="8" fill="#162A3E" stroke="#10B981" stroke-width="1"/>
  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 2: Brokered Credential &amp; Asset Map Air-Gap</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Proxy-injected credentials &amp; host maps in restricted-budget</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• record-owner blocks read_record + restricted-data-boundary</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Vendors see HTML5 pixel stream only; zero password exposure</text>

  <rect x="424" y="364" width="352" height="100" rx="8" fill="#162A3E" stroke="#F59E0B" stroke-width="1"/>
  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 3: Mandatory Recording, Escort &amp; ≤ 4h Window Lock</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Hard-locks `Session_Record == ON` &amp; `Internal_Escort == True`</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Caps window `Duration ≤ 240m` &amp; blocks file download egress</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ untrusted-write blocks unrecorded or unescorted 24x7 access</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
  <text x="438" y="496" fill="#FDA4AF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 4: Immutable OEM &amp; Contractor Registry Lock</text>
  <text x="438" y="518" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• tool-allowlist blocks update_trust + fixed-business-output</text>
  <text x="438" y="538" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• original-requester-payment blocks $6,900 emergency callout wire</text>
  <text x="438" y="556" fill="#FB7185" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Requires Infrastructure Director + Controller FIDO2 sign-off</text>

