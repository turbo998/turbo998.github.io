  <text x="836" y="200" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">1. Deterministic VPAM Broker + Escort Lock (🏆)</text>
  <text x="836" y="218" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   100% block on BRK-793/794 | +0.025ms | Zero vendor pivoting</text>
  <text x="836" y="240" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Native BeyondTrust / CyberArk Vendor PAM / Claroty</text>
