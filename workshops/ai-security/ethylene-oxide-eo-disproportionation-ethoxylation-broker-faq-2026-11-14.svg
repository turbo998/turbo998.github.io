  <text x="645" y="212" fill="#a7f3d0" font-size="15" font-weight="600">1. 数字层: Capability Broker 确定性门控 (P50 = 0.0248 ms)</text>
  <text x="660" y="236" fill="#e2e8f0" font-size="14">• record-owner + restricted-data-boundary: 锁死银催化与 DMC 金库</text>
  <text x="660" y="258" fill="#e2e8f0" font-size="14">• untrusted-write: 100% 拦截外部化验单触发的断回流与 185°C 提温写操作</text>
  <text x="660" y="280" fill="#6ee7b7" font-size="14" font-weight="700">• tool-allowlist + original-requester-payment: 拦截 $4,990 含铁锈填料电汇</text>
  <text x="645" y="318" fill="#a7f3d0" font-size="15" font-weight="600">2. 物理层: 独立 SIL-3 ≤125°C 限温与 &lt;150ms 重力水淹塔联锁</text>
  <text x="660" y="342" fill="#e2e8f0" font-size="14">• 再沸器热媒物理限温≤125°C + 最小回流硬锁，塔温≥135°C &lt;150ms 注水稀释</text>
  <text x="660" y="364" fill="#e2e8f0" font-size="14">• 塔顶甲烷(CH4)镇定气封硬锁 + 乙氧基化游离 EO≤3.0wt% 双切断阀联锁</text>
  <text x="645" y="402" fill="#a7f3d0" font-size="15" font-weight="600">3. 气隙银催化剂金库与钝化零铁 316L 填料 AVL 密码学锁定</text>
  <text x="660" y="426" fill="#e2e8f0" font-size="14">• Cs/Re 银催化剂与 DMC 气隙隔离 + 入塔填料菲咯啉零游离铁强制核验</text>
  <rect x="645" y="452" width="490" height="40" rx="8" fill="#065f46"/>
  <text x="665" y="477" fill="#ecfdf5" font-size="14" font-weight="700">✓ 评测结果: 320 场景 (🏆320里程碑) / 306 演练向量 / 706 项断言 100% 通过</text>

