  <text x="42" y="73" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="13">BRK-777 &amp; BRK-778 · 🏆 922-Pytest Milestone · BitLocker/LAPS Escrow Air-Gap + Pre-Signed Script Catalog &amp; Fleet Wipe Lock</text>

