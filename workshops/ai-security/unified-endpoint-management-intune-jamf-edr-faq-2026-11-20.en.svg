  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Strips free-text strings from endpoint Event Logs &amp; IT tickets</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Extracts typed slots (Device_ID, Error_Code_Enum, Posture_Bit)</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Stops compromised endpoints from hijacking UEM remediation</text>

