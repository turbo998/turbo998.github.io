  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 3: Signed Script Catalog &amp; Blast-Radius=1 Lock</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Prohibits ad-hoc LLM script generation; allows signed Catalog IDs</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Caps automated action at `Target_Count == 1` &amp; blocks `Remote Wipe`</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ untrusted-write blocks fleet-wide script push &amp; mass wipe</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
