<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad378" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad378" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad378" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad378" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad378)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad378)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 378 · 🏆 770-VECTOR MILESTONE · CLOUD SECURITY POSTURE &amp; CNAPP (DEFENDER FOR CLOUD / WIZ / PRISMA CLOUD)</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">云原生安全态势管理 (CNAPP：Defender for Cloud/Wiz)、攻击路径修复与合规豁免 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">全域有毒攻击路径图谱与蜜罐坐标物理气隙 + Azure Policy 拒绝策略与镜像验签硬锁 vs. 豁免申请注入静默公网暴露与 MDR 诈骗 (BRK-765 / BRK-766)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad378)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业云安全态势 (CNAPP/CSPM) 三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 云资源标签/合规豁免单注入窃取全网攻击路径图 (BRK-765)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 失陷云工作负载的 AWS/Azure 资源 Tag 或合规豁免申请 PDF 夹带</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  隐藏提示词，诱导 CNAPP 告警研判 Agent 读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取全云环境“公网暴露 + 高危 CVE + 高权托管身份”有毒组合</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  攻击路径图谱 (Attack-Path Graph) 与云端诱捕蜜罐 (Canary) 坐标</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 违规永久静默公网存储桶告警与豁免 K8s 准入控制</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，将暴露公网的 S3/Blob 存储桶</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  与 0.0.0.0/0 安全组告警永久标记为“已接受风险静默 (Risk Accepted)”</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 或在 Azure Policy / OPA Gatekeeper 中为未签名恶意容器开具豁免</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：云存储整库匿名拖库与挖矿/后门容器直通生产集群</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造云安全托管服务 (MDR/MSSP) 年度结算诈骗 (BRK-766)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造云安全托管检测响应服务商 (MDR / MSSP) 年度工作负载</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  超额配额补缴单或红蓝对抗演练托管通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 服务商账户并电汇 $6,200 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：企业年度云安全运营预算被劫持至洗钱账户</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad378)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 云原生安全态势 (CNAPP) 零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 云资源元数据/豁免单清洗与强类型槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离云资源 Tag、容器 Label 与豁免 PDF 中的隐藏指令，仅提取</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  强类型槽位 (云资源 ARM/ARN ID、CIS 控制编号、CVE ID、镜像摘要)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断资源 Tag 提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 全域攻击路径图谱与云蜜罐坐标物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 跨订阅最短提权攻击路径图谱 (Blast-Radius Graph) 与云端</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  Canary 诱捕凭据坐标严格隔离在 restricted-budget 气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 根管理组 Deny 护栏策略与禁止 AI 签发策略豁免</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 公网匿名存储与未签名镜像在 Azure Management Group / AWS SCP</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  层实施不可逾越的 Deny 硬锁；物理切断 AI 创建 Policy Exemption</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断告警静默与准入绕过</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 云安全 MSSP/MDR 账户只读锁 + CISO 双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中安全服务商账户只读 (tool-allowlist +</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad378)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流云安全态势管理 (CNAPP / CSPM) 方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性 CNAPP 网关 + 图谱气隙 + Deny 硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-765/766 拦截率 100% | 满足 CIS Benchmark &amp; NIST CSF</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Defender for Cloud / Wiz / Prisma Cloud 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止告警降噪 Bot 在恶意资源 Tag 注入下自动归档高危告警</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 AWS SCP / Azure Policy 继承层级与 Cosign 签名语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 云安全工程师人工处理每天数万条低优先级配置漂移告警</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 严重告警疲劳，真正致命的公网暴露 + 提权攻击链被淹没漏检</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 378 · 770 向量！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：公网告警静默、图谱泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取全域攻击路径图谱 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断静默公网存储桶告警与豁免 K8s 镜像验签</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传爆炸半径图与蜜罐 Canary 坐标</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 MDR 服务商账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $6,200 伪造 MDR 续费电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 378 · 🏆 770 个交互式靶场攻击向量里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 全域攻击路径图与蜜罐气隙：跨云订阅最短攻击路径图与 Canary 诱捕坐标与日常工单降噪 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性根管理组 Deny 护栏与禁 AI 豁免：公网存储与无签名容器由平台层硬拦截，严禁 AI 静默高危告警</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 云安全 MDR 供应商只读与双签：锁定 trust-registry，安全托管服务结算强制经 CISO 与财务总监双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：784 个场景 (781 风险 + 3 基线) | 898 项 Pytest 检查 | 1,634 项断言 | 🏆 770 个交互向量 | 378 篇双语 FAQ (197 篇指南) | BRK-765/766</text>
</svg>
