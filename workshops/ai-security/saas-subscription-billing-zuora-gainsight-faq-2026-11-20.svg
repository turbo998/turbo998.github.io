<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad368" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad368" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad368" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad368" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad368)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad368)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 368 · 🏆 750-VECTOR HISTORIC MILESTONE · SAAS SUBSCRIPTION BILLING &amp; RENEWALS (ZUORA / GAINSIGHT / ASC 606)</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业订阅计费与客户成功续约 (Zuora/Gainsight)、用量计费免单与 ASC 606 收入确认 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">独立售价区间 (SSP) 与挽留底牌物理气隙 + 用量计量表与提前解约金硬锁 vs. 退订威胁注入薅取 80% 折扣与 SLA 赔付诈骗 (BRK-745 / BRK-746)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad368)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业订阅续约与按量计费 (Zuora) 三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 续约谈判/用量异议单注入窃取 SSP 售价底牌 (BRK-745)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 客户采购部提交的退订预警邮件或用量异议 PDF 夹带隐藏提示词，</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  诱导客户成功 (CSM) 续约 Agent 跨权限读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取 ASC 606 独立售价合规底线 (SSP Corridor)、同行业客户</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  真实续约净留存底价及防流失最大特批让步矩阵 (Churn-Save Floor)</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 虚假流失威胁骗取 80% 挽留折扣与清零超额用量</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，违规下发 80% 紧急防流失折扣、</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  免除三年期合同提前解约违约金 (Early Termination Fee, ETF)</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 或将高额 API/Token 超额按量计费账单 (Overage) 直接抹零免单</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：ARR 净留存率 (NDR) 崩盘与 ASC 606 合同重述</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造 SLA 宕机现金索赔与云市场分账诈骗 (BRK-746)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造重大故障 SLA 可用性违约现金退费函 (SLA Breach Cash</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  Payout) 或云市场 (AWS/Azure Marketplace) 联合销售返款通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 赔付账户并电汇 $5,700 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：原本仅抵扣下期账单的代金券被变成真金白银盗汇</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad368)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业订阅计费与客户成功零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 续约工单/用量申诉清洗与强类型槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离客户邮件与采购 RFP 中的提示词指令，仅提取强类型槽位</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  (Zuora 订阅号、合约到期日、只读遥测用量哈希、申请折扣比例)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断申诉单提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: ASC 606 独立售价 (SSP) 与挽留底牌物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 集团 ASC 606 SSP 独立售价遵从走廊、全网客户健康度底表与</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  高管级特批挽留折扣底牌严格隔离在 restricted-budget 气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性计量遥测只读锁与 SLA 仅限账单抵扣硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 按量计费账单强制绑定网关签名遥测日志；SLA 违约赔付在代码层</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  锁死为“下期订阅抵扣券 (Service Credit Only)”，严禁 AI 免除违约金</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断越权免单与破价续约</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 云市场与客户退款账户只读锁 + 财务双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 客户原路退款与分账账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad368)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流订阅计费与客户成功续约安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性订阅网关 + SSP 气隙 + 遥测/抵扣硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-745/746 拦截率 100% | 守护 NDR 净留存与 ASC 606 合规</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Zuora / Gainsight / Stripe Billing 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止自助续约 Agent 在退订威胁注入下发放顶格挽留折扣</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 ASC 606 SSP 区间、阶梯用量计费与 ETF 解约金语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 客户成功经理 (CSM) 手工审批所有续约报价与超额账单</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 长尾中小客户漏续率高达 15-25%，人工随意给折扣破坏 SSP</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 368 · 750 向量！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：80% 破价获批、SSP 泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取 ASC 606 SSP 底线 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断 80% 挽留破价、免解约金与抹零超额用量</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传全网客户挽留底牌与健康度</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 SLA 退款账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,700 伪造 SLA 现金赔付</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 368 · 🏆 750 个交互式靶场攻击向量历史性里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. SSP 独立售价与挽留底牌气隙：ASC 606 SSP 定价走廊与特批挽留让步矩阵与自助续约谈判 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性用量计量锁与 SLA 抵扣硬锁：按量账单只读绑定网关计量器，SLA 赔付强制仅限下期抵扣券而非现金电汇</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 退款与云市场分账账户只读：锁定 trust-registry，任何合同修改与特批退费强制经由CCO与收入会计主管双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：764 个场景 (761 风险 + 3 基线) | 858 项 Pytest 检查 | 1,594 项断言 | 🏆 750 个交互向量 | 368 篇双语 FAQ (187 篇指南) | BRK-745/746</text>
</svg>
