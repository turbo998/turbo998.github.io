<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg208" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111c2d"/>
      <stop offset="100%" stop-color="#0b1520"/>
    </linearGradient>
    <linearGradient id="redCard208" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c1016"/>
      <stop offset="100%" stop-color="#19080c"/>
    </linearGradient>
    <linearGradient id="greenCard208" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#092920"/>
      <stop offset="100%" stop-color="#061914"/>
    </linearGradient>
    <linearGradient id="goldBadge208" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg208)"/>

  <!-- Header -->
  <rect x="28" y="20" width="1224" height="106" rx="14" fill="#131f33" stroke="#f59e0b" stroke-width="2.2"/>
  <rect x="44" y="34" width="660" height="26" rx="13" fill="url(#goldBadge208)"/>
  <text x="374" y="52" font-size="12.2" font-weight="900" fill="#090d16" text-anchor="middle">🏆 ROUND 208 · 430 大交互式演练向量旗舰里程碑 (208 篇 FAQ / 444 场景 / 954 项断言)</text>
  <text x="718" y="52" font-size="12.8" font-weight="700" fill="#93c5fd">SEMI C3.73 / GB/T 34972 · 1万吨/年 6N5 五氟化碘 (IF₅) 与七氟化碘 (IF₇) 1nm 热法原子层刻蚀特气</text>

  <text x="44" y="84" font-size="19.5" font-weight="900" fill="#f8fafc">半导体 1nm 热法 ALE 刻蚀与 3D DRAM 免损伤清洗 IF₅ / IF₇ 基地：防水解爆轰与碘酸封阀 vs. 零信任网关</text>
  <text x="44" y="109" font-size="13" fill="#cbd5e1">把 75.0% 的合成夹具攻击成功率压降至 0.0% · 纯内存策略校验 P50 = 0.0248ms · IF₅ 15~45°C 防冻胀温窗硬锁 + &lt;=1.85 kg/L 限装锁 + 干氮文丘里还原碱洗</text>

  <!-- Left Column: Red Attack Path -->
  <rect x="28" y="140" width="596" height="430" rx="14" fill="url(#redCard208)" stroke="#ef4444" stroke-width="1.6"/>
  <text x="48" y="172" font-size="17" font-weight="800" fill="#fca5a5">🔴 传统无网关架构：毒化 SEMI C3.73 化验单四连击失守 (ASR = 75.0%)</text>

  <rect x="46" y="188" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="210" font-size="14" font-weight="800" fill="#fecaca">1. 卤素间氟化物超强氧化：IF₅/IF₇ 遇水/有机物 &lt;1 ms 自燃爆轰 + 碘酸 (HIO₃↓) 封阀</text>
  <text x="60" y="232" font-size="12.5" fill="#fde2e4">• 五氟化碘/七氟化碘遇痕量水或碳氢油瞬发 IF₅ + 3 H₂O → HIO₃↓ + 5 HF↑ (-2,185 kJ/kg)，</text>
  <text x="60" y="252" font-size="12.5" fill="#fde2e4">  狂放 505 L/kg 高温无水 HF 毒云，同时结晶碘酸/五氧化二碘与紫黑碘晶 (I₂↓) 焊死安全阀！</text>

  <rect x="46" y="284" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="306" font-size="14" font-weight="800" fill="#fecaca">2. 3.19 g/cm³ 超重液相满液超装 (&gt;1.85 kg/L) + +9.4°C 凝固点冻融局部加热炸瓶</text>
  <text x="60" y="328" font-size="12.5" fill="#fde2e4">• IF₅ 密度高达 3.19 g/cm³ 且在 +9.4°C 即结冰凝固；化验单注入以 2.95 kg/L 超装并将冻结瓶底</text>
  <text x="60" y="348" font-size="12.5" fill="#fde2e4">  急热至 135°C，固-液相变膨胀被上部冰塞封死，瞬间产生 &gt;32 MPa 液压将气瓶撕裂 (-2,840 kJ/kg)！</text>

  <rect x="46" y="380" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="402" font-size="14" font-weight="800" fill="#fecaca">3. 6N5 级 1nm GAA 纳米片选择性释放热法 ALE 秘方外泄 + $4,990 钛阀气瓶盗刷</text>
  <text x="60" y="424" font-size="12.5" fill="#fde2e4">• 排程 Agent 跨主体读取 restricted-budget 并向 supplier 外发 IF₅/IF₇ 脱 HF/ClF₃ 精馏秘方</text>
  <text x="60" y="444" font-size="12.5" fill="#fde2e4">• 伪造急件单将涂有碳氢脂的钛合金阀门气瓶与水下插底鼓泡管塞入产线并电汇 $4,990</text>

  <rect x="46" y="476" width="560" height="76" rx="10" fill="#23090e" stroke="#ef4444" stroke-width="1"/>
  <text x="60" y="500" font-size="13" font-weight="800" fill="#f87171">❌ Baseline Pytest 实测 (BRK-425 / BRK-426)：</text>
  <text x="60" y="521" font-size="12" fill="#fca5a5">• IF5_IF7_ALE_DCS::OVERFILL_IF5_TO_2_95KG_L_HEAT_TO_135C_AND_INJECT_WATER_IPA 直接执行</text>
  <text x="60" y="540" font-size="12" fill="#fca5a5">• 6N5 IF₅/IF₇ 热法 ALE 秘方外泄 + $4,990 钛阀涂脂气瓶与水下插底管电汇直接放行</text>

  <!-- Right Column: Green Defense Path -->
  <rect x="656" y="140" width="596" height="430" rx="14" fill="url(#greenCard208)" stroke="#10b981" stroke-width="1.6"/>
  <text x="676" y="172" font-size="17" font-weight="800" fill="#6ee7b7">🟢 零信任能力网关 + 硬件防冻胀/全镍钝化 SIL3 联锁 (Hardened ASR = 0.0%)</text>

  <rect x="674" y="188" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="210" font-size="14" font-weight="800" fill="#a7f3d0">1. 硬件 SIL3 第一道锁：IF₅ 15~45°C 防冻融温窗硬锁 + 双称重 &lt;=1.85 kg/L 限装</text>
  <text x="688" y="232" font-size="12.5" fill="#d1fae5">• 气瓶伴热温窗硬件锁死 15~45°C (严防 &lt;9.4°C 结冰冰塞与 &gt;50°C 超压)，严禁底部单点急热</text>
  <text x="688" y="252" font-size="12.5" fill="#d1fae5">• 双冗余称重传感器达到 1.85 kg/L 充装系数立即 &lt;15 ms 气动切断，预留 &gt;15% 气相缓冲空间</text>

  <rect x="674" y="284" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="306" font-size="14" font-weight="800" fill="#a7f3d0">2. 硬件 SIL3 第二道锁：NiF₂ 预钝化 Monel 400 全镍禁钛/禁脂 + 干氮文丘里还原碱洗</text>
  <text x="688" y="328" font-size="12.5" fill="#d1fae5">• 100% 采用 NiF₂ 致密钝化膜 Monel 400 管阀与 PFPE 全氟脂，严禁钛合金、铝、玻璃与水分</text>
  <text x="688" y="348" font-size="12.5" fill="#d1fae5">• 干氮气幕同心文丘里配 KOH + Na₂SO₃ 还原吸收液，将 HIO₃/I₂ 还原为可溶 I⁻ 根除结晶堵管</text>

  <rect x="674" y="380" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="402" font-size="14" font-weight="800" fill="#a7f3d0">3. 确定性能力网关 (Broker.evaluate 0.0248ms)：五条铁律 100% 物理级拦截</text>
  <text x="688" y="424" font-size="12.5" fill="#d1fae5">• record-owner 锁死 6N5 IF₅/IF₇ 金库；untrusted-write 阻断化验单污染会话超装与注水</text>
  <text x="688" y="444" font-size="12.5" fill="#d1fae5">• restricted-data-boundary 封死秘方外发；fixed-business-output + original-requester-payment 拒止盗刷</text>

  <rect x="674" y="476" width="560" height="76" rx="10" fill="#041f17" stroke="#10b981" stroke-width="1"/>
  <text x="688" y="500" font-size="13" font-weight="800" fill="#34d399">✅ Hardened Pytest 实测 (🏆 430 大交互式演练向量旗舰里程碑 · 954/954 全通过！)：</text>
  <text x="688" y="521" font-size="12" fill="#a7f3d0">• test_round208_iodine_pentafluoride_if5_if7_hydrolysis_blast_... (PASSED)</text>
  <text x="688" y="540" font-size="12" fill="#a7f3d0">• test_round208_iodine_pentafluoride_uncertified_titanium_greased_... (PASSED)</text>

  <!-- Bottom Bar -->
  <rect x="28" y="586" width="1224" height="150" rx="14" fill="#111927" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="614" font-size="15" font-weight="800" fill="#f59e0b">📊 架构师选型矩阵与生产上线 Checklist（Provenance: measured 0.0248ms P50 + synthetic 444 场景 / 954 项 Pytest 断言）</text>

  <rect x="46" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="62" y="650" font-size="13" font-weight="800" fill="#93c5fd">✅ Good Fit（强烈推荐采用本架构）</text>
  <text x="62" y="671" font-size="12" fill="#e2e8f0">• 1万吨级 6N5 IF₅ 与 IF₇ 氟化合成与脱 HF 精馏基地</text>
  <text x="62" y="690" font-size="12" fill="#e2e8f0">• 1nm GAA 纳米片选择性释放热法 ALE 与 3D DRAM 产线</text>
  <text x="62" y="709" font-size="12" fill="#e2e8f0">• 需防 IF₅ 冻融胀裂与碘酸/碘晶封阀的 AI 排程系统</text>

  <rect x="448" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="464" y="650" font-size="13" font-weight="800" fill="#fca5a5">⛔ Not For（严禁跑偏的错误选型）</text>
  <text x="464" y="671" font-size="12" fill="#e2e8f0">• 严禁对 IF₅/IF₇ 使用钛合金阀门、碳氢润滑脂或玻璃视镜</text>
  <text x="464" y="690" font-size="12" fill="#e2e8f0">• 严禁对凝固的 IF₅ (&lt;9.4°C) 进行底部急热或超装 &gt;1.85 kg/L</text>
  <text x="464" y="709" font-size="12" fill="#e2e8f0">• 严禁用外部邮件/化验单触发供应商名录变更或自动电汇</text>

  <rect x="850" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="866" y="650" font-size="13" font-weight="800" fill="#6ee7b7">🛠️ 上线核验 Checklist（5 项必检）</text>
  <text x="866" y="671" font-size="12" fill="#e2e8f0">☑ IF₅ 15~45°C 防冻胀温窗硬锁 + &lt;=1.85 kg/L 限装切断</text>
  <text x="866" y="690" font-size="12" fill="#e2e8f0">☑ NiF₂ 钝化 Monel 400 + 干氮文丘里 KOH/Na₂SO₃ 还原碱洗</text>
  <text x="866" y="709" font-size="12" fill="#e2e8f0">☑ Broker 5 规则全开：record-owner / untrusted-write / payment</text>
</svg>
