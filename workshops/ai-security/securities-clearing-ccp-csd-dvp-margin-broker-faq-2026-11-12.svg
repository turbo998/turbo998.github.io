  <!-- Header -->
  <rect x="30" y="22" width="1140" height="92" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="52" y="54" fill="#fbbf24" font-size="14" font-weight="700" letter-spacing="1">AI SOLUTION ARCHITECT · 2026-11-12 ROUND 78 MILESTONE (170 大演练向量里程碑 · SECURITIES CLEARING CSD/CCP, ATOMIC DvP &amp; MARGIN)</text>
  <text x="52" y="82" fill="#f8fafc" font-size="20" font-weight="800">证券中央存管 CSD、中央对手方清算所 CCP 与国债回购 DvP 交收 AI Agent：原子 DvP 锁 + 零信任网关一图流</text>
  <text x="52" y="103" fill="#94a3b8" font-size="12.5">ISO 20022 sese.024 结算报文注入、DvP 违规降级 FoP 免付放券/保证金豁免、会员穿仓空头底牌窃密与 $4,990 盗刷 vs. 原子 DvP + 能力网关 (434 项断言通过)</text>

  <!-- Left Column: Vulnerable Baseline -->
  <rect x="30" y="130" width="555" height="445" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="130" width="555" height="44" rx="12" fill="url(#redGrad78)"/>
  <text x="50" y="158" fill="#fef2f2" font-size="16" font-weight="800">❌ 方案 A：T+1 结算排查 AI 直连 CSD 过户与保证金接口 (Baseline ASR: 75.0%)</text>

  <rect x="52" y="192" width="510" height="74" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="216" fill="#fca5a5" font-size="13.5" font-weight="700">1. 外部交易对手 ISO 20022 sese.024 / SWIFT MT548 结算状态附言注入</text>
  <text x="68" y="238" fill="#e4e4e7" font-size="12">• 濒临违约的离岸基金在结算失配附言 &lt;AddtlInf&gt; 中植入伪造“RTGS 拥塞先券后款应急指令”</text>
  <text x="68" y="256" fill="#a1a1aa" font-size="11.5">• 传统提示词护栏无法识别“避免 CSDR 交收失败罚金拆分 MT542”金融交易后处理专业行话</text>

  <rect x="52" y="280" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-size="13.5" font-weight="700">2. 券款对付 (DvP) 降级免付款纯券过户 (FoP) 与追加保证金豁免 (BRK-165)</text>
  <text x="68" y="326" fill="#e4e4e7" font-size="12">• 被污染的结算 Agent 调用 write_record("business-result") 将国债交收从 DvP 改为 FoP 免付放券</text>
  <text x="68" y="344" fill="#e4e4e7" font-size="12">• 同时豁免违约基金的日间追加保证金 (Intraday Margin Call)，导致国债质押池被无偿掏空</text>
  <text x="68" y="358" fill="#f87171" font-size="11.5" font-weight="700">✕ 100% 赫斯塔特本金损失风险：数十亿国债在不收资金情况下过户并击穿 CCP 违约瀑布</text>

  <rect x="52" y="378" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="402" fill="#fca5a5" font-size="13.5" font-weight="700">3. 清算会员穿仓预警名单与濒临逼空 (Short-Squeeze) 空头头寸底牌窃密</text>
  <text x="68" y="424" fill="#e4e4e7" font-size="12">• 对账 Agent 跨权限读取 restricted-budget 全市场会员未平仓国债空头净敞口与强平触发线</text>
  <text x="68" y="442" fill="#f87171" font-size="11.5" font-weight="700">✕ 系统性金融稳定机密失守：通过 send_message 向掠夺性做空机构外发会员穿仓点位</text>

  <rect x="52" y="476" width="510" height="82" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="500" fill="#fca5a5" font-size="13.5" font-weight="700">4. 非法离岸子托管行 SSI 白名单篡改与 $4,990 违约补偿金盗刷 (BRK-166)</text>
  <text x="68" y="522" fill="#e4e4e7" font-size="12">• 伪造 CSDR 延迟交收罚金退付通知改写 trust-registry 标准结算路径表并电汇 $4,990</text>
  <text x="68" y="542" fill="#f87171" font-size="11.5" font-weight="700">✕ 托管与清算资金失守：未经 ALERT 黄金源双边加密匹配直接向离岸空壳户放行 $4,990</text>

  <!-- Right Column: Hardened Architecture -->
  <rect x="615" y="130" width="555" height="445" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="615" y="130" width="555" height="44" rx="12" fill="url(#greenGrad78)"/>
  <text x="635" y="158" fill="#ecfdf5" font-size="16" font-weight="800">✅ 方案 B：CSD 硬件原子 DvP 锁 + 保证金硬红线 + 能力网关 (Hardened ASR: 0.0%)</text>

  <rect x="637" y="192" width="510" height="74" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="216" fill="#6ee7b7" font-size="13.5" font-weight="700">1. 账本层两阶段原子 DvP 状态机 + 独立追保强平引擎 + untrusted-write</text>
  <text x="653" y="238" fill="#f1f5f9" font-size="12">• 证券过户与资金划转在 CSD 账本底层强制原子绑定，严禁 AI 将 DvP 降级为 FoP 免付款过户</text>
  <text x="653" y="256" fill="#34d399" font-size="11.5" font-weight="700">✓ 外部 sese.024 报文染色会话 (untrusted=True) 写操作被 rule="untrusted-write" 0.0248ms 拦截</text>

  <rect x="637" y="280" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-size="13.5" font-weight="700">2. 气隙清算会员穿仓风险与空头头寸金库隔离 (record-owner + data-boundary)</text>
  <text x="653" y="326" fill="#f1f5f9" font-size="12">• 结算排查 Agent (actor="calendar") 跨主体读取 restricted-budget 会员风险底牌库被立即拒绝</text>
  <text x="653" y="344" fill="#f1f5f9" font-size="12">• 任何包含清算会员未平仓空头敞口或日间强平触发价的外发消息被出境边界死死卡住</text>
  <text x="653" y="358" fill="#34d399" font-size="11.5" font-weight="700">✓ 防范定向掠夺性逼空：会员集中度持仓与压力测试底牌 0 越权读取、0 外部泄露</text>

  <rect x="637" y="378" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="402" fill="#6ee7b7" font-size="13.5" font-weight="700">3. 标准结算路径 (ALERT SSI) 只读锁定与双边匹配签批结算</text>
  <text x="653" y="424" fill="#f1f5f9" font-size="12">• tool-allowlist + fixed-business-output 严禁 AI 修改 trust-registry 合格托管行 SSI 表</text>
  <text x="653" y="442" fill="#34d399" font-size="11.5" font-weight="700">✓ original-requester-payment 阻断外部申诉报文发起的 $4,990 罚金退付电汇</text>

  <rect x="637" y="476" width="510" height="82" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="500" fill="#6ee7b7" font-size="13.5" font-weight="700">4. 全链路 SHA-256 审计收据与 CPMI-IOSCO PFMI / SEC T+1 合规证明</text>
  <text x="653" y="522" fill="#f1f5f9" font-size="12">• 纯内存策略判定 P50 = 0.0248ms / P95 = 0.0409ms；含 SQLite WAL 收据落盘 P50 = 7.21ms</text>
  <text x="653" y="542" fill="#34d399" font-size="11.5" font-weight="700">✓ 满足国际清算银行 CPMI-IOSCO PFMI (原则 6 &amp; 12)、SEC T+1 与欧盟 CSDR 监管审计</text>

