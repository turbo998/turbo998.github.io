<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad359" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad359" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad359" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad359" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad359)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad359)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 359 · PRIVATE AVIATION &amp; PART 135 CHARTER (SCHEDAERO / AVINODE / CAMP), LADD MANIFESTS &amp; ESCROW</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">公务机包机与托管运营 (Schedaero/Avinode/CAMP)、FAA Part 135 签派与航材托管 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">高管专机隐身尾号 (FAA LADD/PIA) 行程物理气隙 + Part 135 机组执勤时间与 MEL 适航硬锁 vs. 地面代理单注入违规放飞与发动机小时费托管诈骗 (BRK-727 / BRK-728)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad359)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 公务机托管与 Part 135 签派三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① FBO 地面保障/询价单注入窃取高管专机行程 (BRK-727)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 外部包机经纪人 (Avinode) 或海外 FBO 地面代理上传的起降</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  许可申请与旅客 APIS 报关单 PDF 夹带间接提示词注入</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 诱导 Agent 跨库读取受 FAA LADD/PIA 屏蔽的 500 强 CEO</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  公务机秘密并购目的地、乘客名单及机主预付款余额</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 突破 Part 135 机组疲劳红线与强放 AOG 故障机 (BRK-727)</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令在 Schedaero / BART 签派系统中篡改飞行员休息时间</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  日志，绕过 FAA 14 CFR §135.267 10 小时强制休息期红线</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 在 CAMP 机务系统中将 A 类禁飞故障违规延期 (MEL Deferral)</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：吊销 Part 135 运营人合格证与灾难性飞行安全事故</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造发动机包修计划 (JSSI/MSP) 与购机托管诈骗 (BRK-728)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造霍尼韦尔 MSP / JSSI 发动机按小时保障计划储备金账单或</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  俄克拉荷马城 FAA 飞机产权托管行 (AIC Title) 交割指令</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 收款账户并电汇 $5,280 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-size="11" font-weight="700">• 违规触发：数百万美元飞机产权交割款与发动机大修基金被盗</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad359)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 公务机签派适航与产权托管零信任架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: Avinode 询价单 / FBO 保障函清洗提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离调机请求与地面服务单中的隐藏指令，仅提取强类型槽位</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  (ICAO 机场四字码、预计起降 UTC、跑道道面载荷、燃油加注量)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: LADD/PIA 隐身尾号与高管舱单物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• FAA PIA 临时加密 ICAO 24 位地址映射表、CEO 专机并购</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  航线及机主资金池存入物理气隙域 (restricted-budget)</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 Part 135 执勤期算术与 CAMP 适航硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 机组休息时间与飞机总飞行小时/起落循环 (FH/FC) 由确定性代码</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  实时校验；严禁 AI 豁免休息期，放行需机务总监 AP 执照双签</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断违规放飞与日志篡改</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 飞机产权托管行与航油卡库只读锁</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中 AIC/Insured 产权托管与 JSSI 账户只读</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  (tool-allowlist + fixed-business-output) + 支付源拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad359)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流公务机签派与机务托管安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性公务机网关 + 隐身尾号气隙 + 适航锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-727/728 拦截率 100% | 满足 FAA 14 CFR Part 135 &amp; NBAA</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Schedaero / Avinode / CAMP Systems 原生角色权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止签派协调机器人在 FBO 邮件注入下泄露 VIP 行程或改排班</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 Part 135 滚动 24 小时执勤上限与 MEL 最低设备清单语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统签派室人工核对 NOTAM、机组排班与机务纸质放行单</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 临时调机 (Empty Leg) 报价响应慢，易漏算跨时区累计执勤超时</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 359)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：违规超时放飞、专机行程泄密与电汇 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取 LADD/PIA 高管专机行程 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断豁免机组休息与强放故障机 (business-result)</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向外泄露 CEO 并购飞行计划</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定飞机产权托管库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,280 伪造发动机储备金电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 359 · 即将迎来 Round 360 收官里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 专机隐身尾号与并购行程气隙：FAA LADD/PIA 隐身注册号映射表与高管乘客名单与外部包机询价 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 Part 135 疲劳红线与 CAMP 适航硬锁：机组 10 小时连续休息与适航指令 (AD) 到期停场由确定性代码强制锁死</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 产权托管与 JSSI 储备金只读锁定：购机托管行与发动机小时费账户锁定在 trust-registry，放款需机主代表 FIDO2 双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：746 个场景 (743 风险 + 3 基线) | 822 项 Pytest 检查 | 1,558 项断言 | 732 个交互向量 | 359 篇双语 FAQ (177 篇指南) | BRK-727/728</text>
</svg>
