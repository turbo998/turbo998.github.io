<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg403e" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg403e)" rx="16"/>
  <rect x="20" y="18" width="1160" height="72" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
  <text x="42" y="47" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Round 403 · Browser-Use &amp; Computer-Use GUI Agent Security (Playwright MCP / Browserbase / Operator)</text>
  <text x="42" y="73" fill="#FBCFE8" font-family="Segoe UI, Arial, sans-serif" font-size="13">BRK-815 &amp; BRK-816 · 🏆 820-Vector Milestone · SSO Session Cookie Air-Gap + Origin Pinning &amp; Sensitive-Step Handoff vs. AI-CSRF</text>

  <!-- Left Column -->
  <rect x="24" y="106" width="368" height="476" rx="12" fill="#1A121C" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">⛔ Top 3 Browser-Use &amp; Computer-Use Attack Chains</text>

  <rect x="38" y="152" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Shared Browser Profile &amp; SSO Cookie Theft (BRK-815)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• DOM (`aria-label`) or visual pixel prompt injection on web page</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Reads restricted-budget Chrome password store &amp; SSO cookies</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Hijacks authenticated corporate tabs running in same profile</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ External web page steals session tokens across browser tabs</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Cross-Origin "AI-CSRF" &amp; Admin Clicks (BRK-815)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Web injection tells agent to navigate to `https://admin.corp`</text>
  <text x="50" y="362" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Mutates business-result by clicking "Grant Admin" / "Export DB"</text>
  <text x="50" y="382" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Executes `run_javascript` inside authenticated intranet portals</text>
  <text x="50" y="404" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Bypasses browser Same-Origin Policy (SOP) via agentic clicks</text>

  <rect x="38" y="444" width="340" height="122" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="466" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Visual Clickjacking &amp; Checkout Wire Fraud (BRK-816)</text>
  <text x="50" y="488" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Malicious portal overlays fake "CAPTCHA" over "Confirm Wire"</text>
  <text x="50" y="508" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Attacks trust-registry to swap RPA/browser vendor payee IBAN</text>
  <text x="50" y="528" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Tricks procurement Browser Agent into wiring $7,450</text>
  <text x="50" y="550" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Visual UI deception triggers unauthorized corporate payouts</text>

  <!-- Center Column -->
  <rect x="408" y="106" width="384" height="476" rx="12" fill="#0F1E2E" stroke="#EC4899" stroke-width="1.5"/>
  <text x="428" y="136" fill="#FBCFE8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ Deterministic Browser &amp; GUI Agent Broker (Hardened)</text>

  <rect x="424" y="152" width="352" height="96" rx="8" fill="#162A3E" stroke="#38BDF8" stroke-width="1"/>
  <text x="438" y="174" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 1: Hidden-DOM Pruning &amp; Web Taint Tagging (untrusted=True)</text>
  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Strips `opacity:0`, `font-size:0` &amp; off-screen nodes from A11y tree</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Visiting any external origin marks browser session `untrusted=True`</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Eliminates invisible DOM/CSS prompt injections in web trees</text>

  <rect x="424" y="258" width="352" height="96" rx="8" fill="#162A3E" stroke="#10B981" stroke-width="1"/>
  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 2: Ephemeral Profile &amp; SSO Cookie Vault Air-Gap</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Prohibits mounting host `--user-data-dir`; air-gaps SSO cookies</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Spawns fresh stateless incognito browser context per task</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Zero cross-tab SSO session riding or password manager theft</text>

  <rect x="424" y="364" width="352" height="100" rx="8" fill="#162A3E" stroke="#F59E0B" stroke-width="1"/>
  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 3: Single-Origin Pinning &amp; Sensitive-Step Handoff</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Pins browser context to a single allowed origin (no LAN pivot)</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Pauses &amp; hands off checkout/auth/admin clicks to human user</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ untrusted-write blocks AI-CSRF clicks &amp; arbitrary JS injection</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
  <text x="438" y="496" fill="#FDA4AF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 4: No Corporate Card Auto-Fill &amp; Payee Lock</text>
  <text x="438" y="518" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• tool-allowlist blocks update_trust + fixed-business-output</text>
  <text x="438" y="538" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• original-requester-payment blocks $7,450 clickjacked wire</text>
  <text x="438" y="556" fill="#FB7185" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Prevents visual UI spoofing from triggering corporate payments</text>

  <!-- Right Column -->
  <rect x="808" y="106" width="368" height="476" rx="12" fill="#111C24" stroke="#10B981" stroke-width="1.5"/>
  <text x="826" y="136" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">📊 Architecture Matrix &amp; 820-Vector Proof</text>

  <rect x="822" y="152" width="340" height="196" rx="8" fill="#172A36" stroke="#334155" stroke-width="1"/>
  <text x="836" y="176" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">5 Browser-Use &amp; Computer-Use Security Options:</text>
  <text x="836" y="200" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">1. Ephemeral Browser + Origin Pin + Broker (🏆)</text>
  <text x="836" y="218" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   100% block on BRK-815/816 | Zero AI-CSRF; human step handoff</text>
  <text x="836" y="240" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Remote Headless Container (No Origin Pinning)</text>
  <text x="836" y="258" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Isolates host OS, but vulnerable to cross-tab intranet SSRF/CSRF</text>
  <text x="836" y="280" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Vision-Model (VLM) Screenshot Safety Classifier</text>
  <text x="836" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Fooled by adversarial pixel patches &amp; CSS overlay clickjacking</text>
  <text x="836" y="320" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. Attaching to User's Daily Chrome (`--remote-debugging`)</text>
  <text x="836" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Exposes all active SSO cookies, banking tabs &amp; saved passwords</text>

  <rect x="822" y="362" width="340" height="204" rx="8" fill="#0D2329" stroke="#EC4899" stroke-width="1.5"/>
  <text x="836" y="388" fill="#FBCFE8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🏆 Deterministic Benchmark Totals (Round 403 Milestone!)</text>
  <text x="836" y="414" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Total Scenarios: <tspan fill="#FBCFE8" font-weight="700">834</tspan> (831 Risk + 3 Benign)</text>
  <text x="836" y="438" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Pytest Checks: <tspan fill="#6EE7B7" font-weight="700">998 Passed (100%)</tspan></text>
  <text x="836" y="462" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Deterministic Assertions: <tspan fill="#FBBF24" font-weight="700">1,734</tspan></text>
  <text x="836" y="486" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Playground Vectors: <tspan fill="#F472B6" font-weight="700">820</tspan> (🏆 820-Vector Milestone!)</text>
  <text x="836" y="510" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Bilingual FAQs: <tspan fill="#A78BFA" font-weight="700">403 (222 SA Guides)</tspan></text>
  <text x="836" y="538" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Added: BRK-815 (DOM/Visual AI-CSRF) &amp; BRK-816 ($7,450 wire block)</text>

  <!-- Footer -->
  <rect x="20" y="596" width="1160" height="64" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="42" y="622" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Architect's Golden Rule:</text>
  <text x="205" y="622" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Never attach Browser Agents to a user's daily SSO-logged-in Chrome profile; enforce ephemeral containers, single-origin pinning &amp; sensitive-step handoff!</text>
  <text x="42" y="644" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Repository: turbo998/ai-security-lab (main) · Enterprise AI Security Architecture &amp; Product Selection Series · Round 403 (2026-11-20)</text>
</svg>
