  <text x="728" y="238" fill="#fde68a" font-size="11.5" font-weight="600">Cumulative Velocity &amp; Count Breaker</text>
  <text x="728" y="264" fill="#e2e8f0" font-size="11.5">• 风险：利用“单笔 &lt;$100 免审”连刷 50 笔 $98</text>
  <text x="728" y="286" fill="#e2e8f0" font-size="11.5">• 防线 1：单次运行最多允许 1 笔支付工具调用</text>
  <text x="728" y="308" fill="#e2e8f0" font-size="11.5">• 防线 2：24小时免密累计总额硬顶 &lt;=$100</text>
