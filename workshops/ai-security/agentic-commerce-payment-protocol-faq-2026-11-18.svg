  <rect x="378" y="186" width="315" height="235" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1.8"/>
  <text x="395" y="216" fill="#c084fc" font-size="15.5" font-weight="800">🟣 Google AP2 购物车哈希签名</text>
  <text x="395" y="238" fill="#e9d5ff" font-size="11.5" font-weight="600">Intent Mandate + 五元组 Cart Mandate</text>
  <text x="395" y="264" fill="#e2e8f0" font-size="11.5">• 痛点：询价时看是 $120，付款时被掉包成 $4,890</text>
  <text x="395" y="286" fill="#e2e8f0" font-size="11.5">• 正解：FIDO2 签名绑定 (商户+SKU+总价+epoch)</text>
  <text x="395" y="308" fill="#e2e8f0" font-size="11.5">• 校验：结账时任何字段漂移 1 字节签名即刻作废</text>
