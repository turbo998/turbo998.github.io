  <!-- Section 1 -->
  <text x="45" y="172" fill="#e2e8f0" font-size="17" font-weight="700">1. 企业智能体商业与自动支付四大核心防线选型对比</text>

  <!-- Card 1 -->
  <rect x="45" y="186" width="315" height="235" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="216" fill="#60a5fa" font-size="15.5" font-weight="800">🔵 一次性受限虚拟卡 (SPT)</text>
  <text x="62" y="238" fill="#bfdbfe" font-size="11.5" font-weight="600">Stripe Issuing / Visa / Mastercard Agent Pay</text>
  <text x="62" y="264" fill="#e2e8f0" font-size="11.5">• 红线：严禁向 Agent 暴露静态企业信用卡主卡号</text>
  <text x="62" y="286" fill="#e2e8f0" font-size="11.5">• 机制：每单动态生成单次有效虚拟卡 Token</text>
  <text x="62" y="308" fill="#e2e8f0" font-size="11.5">• 硬锁：精确绑定最高金额 ($120.00) 与唯一商户</text>
  <rect x="62" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <text x="74" y="352" fill="#93c5fd" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="74" y="370" fill="#cbd5e1" font-size="11">即便外部网页把价格改成 $4,890，发卡行</text>
