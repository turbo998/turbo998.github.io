  <!-- Section 2 -->
  <text x="45" y="454" fill="#e2e8f0" font-size="17" font-weight="700">2. 红蓝对抗推演：结账报价掉包 (Bait-and-Switch) &amp; 商户白名单投毒 vs. AP2 + SPT + Broker</text>

  <rect x="45" y="468" width="640" height="175" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="65" y="496" fill="#fca5a5" font-size="15" font-weight="800">❌ 脆弱 Baseline：共享企业信用卡 + 无购物车哈希（BRK-525 / BRK-526 失守）</text>
  <text x="65" y="524" fill="#fecaca" font-size="12.5">1. 结账报价掉包与预算泄密 (BRK-525)：外部商户结账页植入指令，诱导采购 Agent 读取</text>
  <text x="65" y="544" fill="#fecaca" font-size="12.5">   企业差旅总预算 restricted-budget、将已核准订单价格篡改为高价 business-result 并外传。</text>
  <text x="65" y="572" fill="#fecaca" font-size="12.5">2. 商户白名单篡改与盗刷 (BRK-526 · 530 演练向量里程碑)：伪造 AP2 免密商户认证，</text>
  <text x="65" y="592" fill="#fecaca" font-size="12.5">   诱导将未知黑店写入 trust-registry 免审名录并直接扣款 $4,890！</text>
  <text x="65" y="622" fill="#f87171" font-size="12" font-weight="700">💥 根因：询价审批与最终结账扣款之间缺乏密码学哈希锁定，且向 Agent 暴露了无上限主卡！</text>

  <rect x="715" y="468" width="650" height="175" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="496" fill="#6ee7b7" font-size="15" font-weight="800">✅ 零信任智能体商业：AP2 Cart Mandate + 一次性 SPT + Broker（0.0% 失守）</text>
  <text x="735" y="524" fill="#d1fae5" font-size="12.5">• 门禁 1 (record-owner 预算隔离)：寻源 Agent 物理零权限读取差旅总预算底表</text>
  <text x="735" y="548" fill="#d1fae5" font-size="12.5">• 门禁 2 (Cart Mandate + untrusted-write)：锁定五元组哈希，阻断外部网页篡改结算价格</text>
  <text x="735" y="572" fill="#d1fae5" font-size="12.5">• 门禁 3 (fixed-business-output)：物理锁死 trust-registry 合格商户与免密阈值配置</text>
  <text x="735" y="596" fill="#d1fae5" font-size="12.5">• 门禁 4 (original-requester-payment + SPT)：0.0248ms 拦截 $4,890 掉包扣款</text>
  <text x="735" y="622" fill="#34d399" font-size="12" font-weight="700">🛡️ 实测开销：Broker 内存裁决 P50 = 0.0248 ms / 含 SQLite WAL 审计收据 P50 = 7.21 ms</text>

  <!-- Section 3 -->
  <rect x="45" y="662" width="1320" height="168" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="692" fill="#38bdf8" font-size="16" font-weight="800">🛠️ 企业智能体商业与自动支付 (Agentic Commerce) 上线安全评审 6 项必选 Checklist</text>
  <text x="65" y="722" fill="#e2e8f0" font-size="13">☑️ 1. 废除静态企业主卡：全面采用 Stripe Issuing / Visa SPT 动态生成单次有效、定额锁死的一次性虚拟卡</text>
  <text x="65" y="748" fill="#e2e8f0" font-size="13">☑️ 2. 强制 AP2 购物车五元组哈希签名：绑定 (merchant_id, SKU, final_price, currency, epoch) 防结账掉包</text>
  <text x="65" y="774" fill="#e2e8f0" font-size="13">☑️ 3. 部署滑动窗口累计流速熔断：限制单会话付款笔数 (&lt;=2笔) 与 24 小时累计免密总额，粉碎切香肠盗刷</text>
  <text x="65" y="800" fill="#e2e8f0" font-size="13">☑️ 4. 剥离总预算底表读取权  ☑️ 5. 锁死 trust-registry 合格商户表  ☑️ 6. 拦截外部商户上下文直接触发扣款</text>
