  <text x="438" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17.5" font-weight="800" fill="#f8fafc">1万吨级 6N5 六氟化钨 (WF6) 与六氟化钼 (MoF6) 半导体 CVD 特气基地：防 WO3 堵阀炸瓶网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">WF6 遇水瞬放 450L/kg HF 同步析出黄色三氧化钨 (WO3) 硬壳焊死安全阀 (-1920 kJ/kg) · 3.44g/cm3 超重液相满液热膨胀炸瓶 · 全镍无水联锁</text>
  <text x="44" y="100" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">178 篇双语 FAQ · 384 个合成夹具场景 (BRK-365 / BRK-366) · 370 个演练向量 · 834/834 Pytest 100% 通过 · P50=0.0248ms</text>

