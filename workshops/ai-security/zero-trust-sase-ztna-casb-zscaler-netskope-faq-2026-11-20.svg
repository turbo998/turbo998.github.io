  <rect width="1200" height="760" fill="url(#bgGrad380)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad380)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 380 · 🏆 380-FAQ, BRK-770 &amp; 1,642-ASSERTION MILESTONE · ZERO-TRUST SASE / ZTNA / CASB (ZSCALER / NETSKOPE / ENTRA)</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业零信任网络访问与安全访问服务边缘 (SASE/ZTNA：Zscaler/Netskope/Entra) AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">内网连接器拓扑与根证书物理气隙 + TLS 解密防旁路与单应用微分段硬锁 vs. 证书钉扎申诉注入放行 C2 与专线诈骗 (BRK-769 / BRK-770)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad380)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业零信任网络 (SASE/ZTNA/CASB) 三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 证书钉扎排障/解封工单注入窃取内网拓扑 (BRK-769)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 研发或失陷终端提交的“第三方 SDK 证书钉扎 (Cert Pinning) 报错</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  申请免 SSL 解密工单”PDF 夹带提示词注入，诱导 SASE Agent</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 越权读取 restricted-budget 中私有应用连接器 (App Connector)</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  内网真实 CIDR 路由表与高管免检设备白名单</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 违规将黑客 C2/影子 AI 加入 TLS 免解密白名单与放宽网段</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，将攻击者 C2 域名或未授权影子</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  大模型网盘加入 SWG “SSL/TLS 不解密直通白名单 (Do-Not-Decrypt)”</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 或将 ZTNA 单端口应用访问规则放宽为整段 /16 子网全端口互通</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：CASB 行内 DLP 完全失明且 ZTNA 退化为传统扁平 VPN</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造全球 SASE 边缘节点带宽与 SD-WAN 专线诈骗 (BRK-770)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造全球 SASE 专属云边缘节点 (Dedicated PoP IP) 扩容账单或</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  跨国 SD-WAN 骨干网运营商清算收款账户变更通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 运营商账户并电汇 $6,300 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：全球分支机构网络与安全服务采购资金被盗汇</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad380)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业零信任网络 (SASE/ZTNA) 防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 网络排障工单清洗与强类型策略槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离 HAR 抓包文件与排障工单中的隐藏指令，仅提取强类型槽位</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  (目标 FQDN、源进程 SHA-256、应用 AppID、单端口协议枚举)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断抓包文件提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 内网连接器真实路由表与根 CA 私钥物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• ZTNA 内部连接器全网 CIDR 拓扑、TLS 中间人解密 CA 私钥分片</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  与高管免检策略表严格隔离在 restricted-budget 气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性禁全局 SSL 旁路与禁通配符网段 (/16) 硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 严禁 AI 将任何未知域名加入全局 SSL 免解密列表；代码层强制</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  ZTNA 规则必须绑定精确 FQDN:Port (禁止 CIDR 网段与端口范围)</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断 TLS 盲区与网段打穿</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: SASE 与骨干运营商账户只读锁 + 双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中 SASE 原厂与运营商账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad380)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流企业零信任网络 (SASE / ZTNA) 方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性 SASE 网关 + 拓扑气隙 + FQDN/TLS 硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-769/770 拦截率 100% | 满足 NIST 800-207 &amp; CISA ZTMM</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Zscaler / Netskope / Entra Private Access 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止网络排障 Bot 在 HAR/工单注入下把恶意域名加进免解密</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 PAC 脚本路由、SNI 证书钉扎与微分段 CIDR 掩码语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统网络管理员手工维护数万行防火墙 ACL 与 SSL 白名单</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 历史临时放行规则永不清理，SSL 免解密列表沦为黑客 C2 温床</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 380 · 380 篇 FAQ！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：SSL 旁路获批、拓扑泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取内网连接器真实 CIDR 路由 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断添加 TLS 免解密白名单与放开 /16 子网权限</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传私有应用隐藏 IP 与免检列表</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 SASE 运营商账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $6,300 伪造带宽扩容电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 380 · 🏆 380 篇双语 FAQ、BRK-770 &amp; 1,642 项断言历史性里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 内网连接器拓扑与根 CA 气隙：ZTNA 暗网隐藏 IP 段与 TLS 解密私钥与网络排障工单 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性单应用微分段与禁全局 SSL 旁路：强制绑定精确 FQDN:Port (禁 CIDR 通配)，严禁 AI 将未知域名加入免解密</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. SASE 与骨干运营商只读锁：锁定 trust-registry，全球 PoP 带宽与 SD-WAN 专线结算强制经双签放行</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：788 个场景 (785 风险 + 3 基线) | 906 项 Pytest 检查 | 🏆 1,642 项断言 | 774 个交互向量 | 🏆 380 篇双语 FAQ (199 篇指南) | 🏆 BRK-769/770</text>
</svg>
