<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad360" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad360" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad360" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad360" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad360)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad360)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 360 · 🏆 360-FAQ, BRK-730 &amp; 1,562-ASSERTION GRAND FINALE MILESTONE · CARBON REGISTRIES (VERRA / GOLD STANDARD) &amp; ARTICLE 6 ITMO</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">碳信用登记簿与跨国碳交易 (Verra/Gold Standard/巴黎协定第 6 条)、缓冲池与 ERPA 托管 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">企业 EU ETS/CBAM 履约缺口头寸物理气隙 + 碳信用唯一序列号注销 (Retirement) 与逆转缓冲池硬锁 vs. VVB 核查报告注入虚增签发与 ERPA 电汇诈骗 (BRK-729 / BRK-730)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad360)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 碳信用签发注销与跨国碳交易三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 第三方核查报告 (VVB) 注入窃取履约缺口头寸 (BRK-729)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 碳项目开发商或核查机构 (VVB) 上传的 PDD 项目设计文件与</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  监测核查报告 PDF 夹带间接提示词注入</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 诱导 Agent 跨库读取跨国集团未对冲的欧盟碳配额 (EU ETS /</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  CBAM / CORSIA) 强制履约缺口头寸与内部边际减排成本曲线</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 虚增林业碳汇基线、豁免缓冲池与双重计算 (BRK-729)</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令在登记簿中豁免森林火灾逆转风险缓冲池 (Buffer Pool</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  15-20% 扣存)，将幽灵碳汇 (Phantom Credits) 标记为高完整性 CCP</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 或将已注销 (Retired) 的 VCU 序列号重置为可交易状态二次售卖</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：欧盟反漂绿指令 (Green Claims) 巨额罚款与碳资产归零</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造巴黎协定第 6 条授权函 (LoA) 与 ERPA 诈骗 (BRK-730)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造东道国环境部《巴黎协定》第 6.2 条国际转让减缓成果</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  (ITMO) 相应调整授权函与减排量购买协议 (ERPA) 托管提款单</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 收款账户并电汇 $5,300 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：主权碳信用被东道国征用违约与预付定金血本无归</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad360)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 碳信用登记簿与跨国履约零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: VVB 核查报告 / PDD 清洗与结构化槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离碳项目核查报告中的自然语言指令，仅提取 CAD Trust 强类型</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  槽位 (项目 ID、方法学代码、年份 Vintage、遥感生物量、序列号区间)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 企业强制履约缺口与减排曲线物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 集团 EU ETS / CBAM / CORSIA 强制配额空头缺口、内部影子碳价</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  与边际减排成本曲线 (MACC) 存入物理气隙域 (restricted-budget)</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性逆转缓冲池扣减与单向不可逆注销硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 林业/碳移除项目强制按风险等级扣留 15%-25% 缓冲池；序列号</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  一旦标记 Retired 不可逆锁死 (WORM)，严禁 AI 重置或免扣缓冲</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断幽灵增发与双重计算</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: UNFCCC 相应调整核验与 ERPA 托管账户只读锁</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中 ERPA 共管账户只读 (tool-allowlist +</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad360)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流碳信用管理与 ESG 核算安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性碳网关 + 履约头寸气隙 + 缓冲/注销锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-729/730 拦截率 100% | 满足 ICVCM CCP、CORSIA &amp; CSRD</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Microsoft Sustainability Mgr / Salesforce Net Zero 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止碳采购助手在 VVB 报告注入下将高风险项目标为合规</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 REDD+ 动态基线、缓冲池比例与 Article 6 相应调整语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统可持续发展部手工核对数千页 PDD 与登记簿截图</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 跨注册簿重号核查困难，极易误购已被外媒曝光的垃圾碳信用</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 360 · 360 篇收官！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：免扣缓冲池、缺口外泄与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取 EU ETS/CBAM 履约缺口 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断豁免缓冲池与复活已注销碳汇 (business-result)</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向碳经纪商外传内部影子碳价</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 ERPA 托管账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,300 伪造碳汇长协电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 360 · 🏆 360 篇双语 FAQ、BRK-730 &amp; 1,562 项断言收官大满贯！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 强制履约头寸与影子碳价气隙：企业 EU ETS / CBAM 碳配额空头敞口与内部减排成本曲线与外部碳项目核查 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 CAD Trust 跨簿防重与不可逆注销：碳信用序列号状态机遵循单向 Retired 锁，强制扣留非持久性逆转缓冲池</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 巴黎协定第 6.2 条 UNFCCC 核验：跨国 ITMO 结算强制核验 UNFCCC 集中核算平台相应调整记录；锁定 trust-registry</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：748 个场景 (745 风险 + 3 基线) | 826 项 Pytest 检查 | 🏆 1,562 项断言 | 734 个交互向量 | 🏆 360 篇双语 FAQ (178 篇指南) | 🏆 BRK-729/730</text>
</svg>
