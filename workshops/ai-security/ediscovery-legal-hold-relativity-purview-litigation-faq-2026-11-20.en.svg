  <text x="205" y="622" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Never grant TAR document-review AI Agents permission to release Legal Holds or export production sets; enforce deterministic counsel privilege locks!</text>
  <text x="42" y="644" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Repository: turbo998/ai-security-lab (main) · Enterprise AI Security Architecture &amp; Product Selection Series · Round 389 (2026-11-20)</text>
