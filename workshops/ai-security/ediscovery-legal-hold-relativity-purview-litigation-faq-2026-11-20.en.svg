  <text x="826" y="136" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">📊 Architecture Matrix &amp; 942-Pytest Proof</text>

  <rect x="822" y="152" width="340" height="196" rx="8" fill="#172A36" stroke="#334155" stroke-width="1"/>
  <text x="836" y="176" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">5 eDiscovery &amp; Legal-Hold Security Options Compared:</text>
  <text x="836" y="200" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">1. Deterministic eDiscovery Broker + Hold Lock (🏆)</text>
  <text x="836" y="218" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   100% block on BRK-787/788 | +0.025ms | Zero spoliation/waiver</text>
  <text x="836" y="240" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Native Purview eDiscovery / RelativityOne RBAC</text>
  <text x="836" y="258" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Vulnerable if TAR review bot shares Case Admin / Hold scope</text>
  <text x="836" y="280" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Cloud LLM Guardrails (Prompt Shields / Bedrock)</text>
  <text x="836" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Cannot enforce deterministic attorney bar-roster privilege rules</text>
  <text x="836" y="320" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. Manual PST File Exports Emailed to Outside Counsel</text>
  <text x="836" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Breaks EDRM chain-of-custody hashes &amp; leaks unredacted PII</text>

  <rect x="822" y="362" width="340" height="204" rx="8" fill="#0D2329" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="836" y="388" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🏆 Deterministic Benchmark Totals (Round 389)</text>
  <text x="836" y="414" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Total Scenarios: <tspan fill="#C4B5FD" font-weight="700">806</tspan> (803 Risk + 3 Benign)</text>
  <text x="836" y="438" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Pytest Checks: <tspan fill="#6EE7B7" font-weight="700">942 Passed (100%)</tspan> (🏆 Milestone!)</text>
  <text x="836" y="462" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Deterministic Assertions: <tspan fill="#FBBF24" font-weight="700">1,678</tspan></text>
  <text x="836" y="486" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Playground Vectors: <tspan fill="#F472B6" font-weight="700">792</tspan></text>
  <text x="836" y="510" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Bilingual FAQs: <tspan fill="#A78BFA" font-weight="700">389 (208 SA Guides)</tspan></text>
  <text x="836" y="538" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Added: BRK-787 (eDiscovery corpus injection) &amp; BRK-788 ($6,750 wire block)</text>

