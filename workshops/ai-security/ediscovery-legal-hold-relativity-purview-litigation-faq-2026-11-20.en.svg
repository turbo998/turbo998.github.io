  <text x="42" y="47" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Round 389 · Enterprise eDiscovery &amp; Legal Hold (Purview eDiscovery / RelativityOne / Exterro) AI Guide</text>
  <text x="42" y="73" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13">BRK-787 &amp; BRK-788 · 🏆 942-Pytest Milestone · Silent Hold &amp; Attorney-Privilege Air-Gap + Anti-Spoliation &amp; Clawback Lock</text>

  <!-- Left Column -->
  <rect x="24" y="106" width="368" height="476" rx="12" fill="#1A121C" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">⛔ Top 3 eDiscovery &amp; Legal-Hold Attack Chains</text>

  <rect x="38" y="152" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Silent-Hold Roster &amp; Privileged Strategy Leak (BRK-787)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Anti-forensic prompt injection planted in custodian emails/chats</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Reads restricted-budget DOJ/SEC silent-hold custodian lists</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exfiltrates Attorney-Client Privileged defense strategy memos</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Tips off targets under investigation &amp; destroys legal privilege</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Evidence Spoliation &amp; Privilege Waiver (BRK-787)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Mutates business-result to release `Legal Hold` &amp; purge emails</text>
  <text x="50" y="362" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Misclassifies privileged counsel memos as `Responsive Produce`</text>
  <text x="50" y="382" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exports unredacted trade secrets to opposing counsel portal</text>
  <text x="50" y="404" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Triggers FRCP 37(e) spoliation sanctions &amp; privilege waiver</text>

  <rect x="38" y="444" width="340" height="122" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="466" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Spoofed Expert Witness &amp; Settlement Escrow Fraud (BRK-788)</text>
  <text x="50" y="488" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Forged forensic expert witness or class-action escrow invoice</text>
  <text x="50" y="508" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Attacks trust-registry to swap legal vendor / escrow IBAN</text>
  <text x="50" y="528" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Tricks legal operations agent into wiring $6,750 retainer</text>
  <text x="50" y="550" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Diverts litigation settlement &amp; forensic expert retainers</text>

  <!-- Center Column -->
  <rect x="408" y="106" width="384" height="476" rx="12" fill="#0F1E2E" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="428" y="136" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ Deterministic eDiscovery &amp; Hold Broker (Hardened)</text>

  <rect x="424" y="152" width="352" height="96" rx="8" fill="#162A3E" stroke="#38BDF8" stroke-width="1"/>
  <text x="438" y="174" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 1: Custodian Corpus Taint Isolation (untrusted=True)</text>
  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Treats all custodian emails, chats &amp; docs as untrusted=True</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Restricts TAR review models to read-only classification enums</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Stops anti-forensic traps planted in custodian mailboxes</text>

  <rect x="424" y="258" width="352" height="96" rx="8" fill="#162A3E" stroke="#10B981" stroke-width="1"/>
  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 2: Silent-Hold Roster &amp; Work-Product Air-Gap</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• DOJ/SEC silent holds &amp; defense memos in restricted-budget</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• record-owner blocks read_record + restricted-data-boundary</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Zero custodian tipping-off or privileged work-product leakage</text>

  <rect x="424" y="364" width="352" height="100" rx="8" fill="#162A3E" stroke="#F59E0B" stroke-width="1"/>
  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 3: Anti-Spoliation Hold Lock &amp; Counsel Roster Filter</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Prohibits AI release of `Legal_Hold` or `Content Search Purge`</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Deterministically withholds docs matching Counsel Bar Roster</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ untrusted-write blocks evidence destruction &amp; privilege waiver</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
  <text x="438" y="496" fill="#FDA4AF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 4: Immutable ALSP / Settlement Escrow Registry Lock</text>
  <text x="438" y="518" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• tool-allowlist blocks update_trust + fixed-business-output</text>
  <text x="438" y="538" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• original-requester-payment blocks $6,750 expert witness wire</text>
  <text x="438" y="556" fill="#FB7185" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Requires General Counsel + Controller FIDO2 dual sign-off</text>

