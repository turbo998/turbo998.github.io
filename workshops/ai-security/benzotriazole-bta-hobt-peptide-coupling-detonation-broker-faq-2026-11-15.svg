  <text x="438" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17.5" font-weight="800" fill="#f8fafc">10万吨级苯并三氮唑 (BTA) 与 GLP-1 多肽缩合剂 HOBt 基地：防三氮唑脱氮爆轰网关</text>
