  <text x="646" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 双冗余在线 NIR 监测 HOBt 水分&lt;=14.0% &lt;100ms 破真空并启动纯水雾化补水退敏</text>
  <text x="646" y="240" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• HOBt 干燥热媒锁死 &lt;=55°C 温水；BTA 改用 &lt;=165°C 短程刮膜分子蒸馏 (持液&lt;20kg)</text>
  <text x="646" y="260" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 釜温 &gt;=180°C 或 dT/dt&gt;=1.5°C/min &lt;100ms 充氮破真空排入冷聚乙二醇急冷槽</text>

  <rect x="632" y="290" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
