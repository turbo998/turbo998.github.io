  <text x="70" y="584" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7">Option C/D (Tier 1): In-Memory Provenance Gate</text>
  <text x="370" y="584" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">Recall taint restoration + Broker.evaluate gate (n=200/200 full raw array)</text>
  <text x="730" y="584" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#34D399">P50 = 0.0248 ms / P95 = 0.0409 ms (0.0% ASR)</text>
  <text x="985" y="584" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34D399">measured (n=200 full raw)</text>

  <!-- Row 4 -->
  <rect x="54" y="600" width="1092" height="32" rx="6" fill="#064E3B" fill-opacity="0.35"/>
  <text x="70" y="620" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7">Option D (Tier 2-4): SQLite WAL Receipt</text>
  <text x="370" y="620" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">1-step (n=50) / 3-hop (n=30) / 5-step (n=20) cryptographic receipt commit</text>
  <text x="730" y="620" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#34D399">P50 = 7.21 ms / 35.41 ms / 55.21 ms</text>
  <text x="985" y="620" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34D399">measured (n=50/30/20 full)</text>
