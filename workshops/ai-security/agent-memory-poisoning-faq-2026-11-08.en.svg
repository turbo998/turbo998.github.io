  <text x="370" y="548" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">Ephemeral context for external tickets + strict owner_principal partitioning</text>
  <text x="730" y="548" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FDE68A">Stops cross-principal leak (rule="record-owner")</text>
  <text x="985" y="548" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#93C5FD">synthetic + architecture</text>

