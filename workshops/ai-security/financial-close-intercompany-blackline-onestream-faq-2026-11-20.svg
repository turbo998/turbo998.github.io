<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad374" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad374" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad374" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad374" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad374)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad374)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 374 · 🏆 882-PYTEST MILESTONE · FINANCIAL CLOSE, INTERCOMPANY RECONCILIATION (BLACKLINE / ONESTREAM) &amp; SOX 404</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业财务关账与合并报表 (BlackLine/OneStream/SAP)、关联交易对账与手工分录 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">未发布合并快报 (Flash EPS) 与审计重要性水平物理气隙 + 顶层手工分录 (Top-Side MJE) 硬锁 vs. 差异说明注入强平账与轧差诈骗 (BRK-757 / BRK-758)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad374)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业财务关账、对账与合并报表三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 子公司对账差异说明 PDF 注入窃取财报快报与审计红线</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 海外子公司或合资方上传的科目余额差异备忘录 PDF 夹带提示词</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  注入，诱导财务关账 Agent 跨权限读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取集团静默期未披露合并每股收益快报 (Flash EPS)、未调整审计</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  差异汇总表 (SUD) 及审计师免查重要性水平阈值 (Materiality Floor)</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 违规过账顶层手工调账分录 (Top-Side MJE) 强塞差额</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，在无底层明细账支撑下自动生成</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  顶层合并手工调整分录 (Top-Side Plug Entry) 强行抹平关联方尾差</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 或将长期挂账的过渡科目 (Suspense Account) 虚标为已核对认证</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：PCAOB / SOX 404 管理层凌驾内控重罪与财报重述</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造跨国关联交易多边净额轧差 (Netting) 电汇诈骗</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造集团内部多边净额清算中心 (Intercompany Netting Center:</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  Coprocess / Kyriba) 月度关联方应付净额划拨指令</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 子公司清算账户并电汇 $6,000 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：跨国子公司间大额月度净额清算资金被截留至境外账户</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad374)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业财务关账与合并报表零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 对账差异备忘录清洗与结构化凭证槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离海外分支机构对账说明中的自然语言调账指令，仅提取强类型</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  槽位 (公司代码、科目号、关联交易对手代码、子账本凭证哈希)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断差异单提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 集团合并快报 (Flash EPS) 与审计红线物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 静默期集团合并财报快报、未调整审计差异表 (SUD) 与精确到各</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  子公司的免审微调阈值严格隔离在 restricted-budget 气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性子账本借贷平衡与禁止 AI 过账 Top-Side MJE</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 关联方抵销必须双向匹配买卖双方 ERP 原始发票凭证；物理禁止</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  AI 生成无单据支撑的 Top-Side 强平分录，职责分离 (SoD) 硬锁</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断虚假调账与认证</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 内部银行与关联清算账户只读锁 + 财务总监双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中集团各法人实体清算账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad374)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流财务关账与合并报表 (R2R) 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性关账网关 + 快报气隙 + MJE/抵销硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-757/758 拦截率 100% | 满足 SOX 404 &amp; PCAOB AS 2401</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. BlackLine / OneStream / SAP Group Reporting 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止自动对账 Bot 在差异备忘录注入下自动认证悬账或过账</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备外币折算差额 (CTA)、关联抵销守恒与制单审核分离语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统总账会计月末用巨型 Excel 拼表对账与手工填凭证</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 跨国关账耗时长达 10-15 个工作日，手工塞数 (Plug) 频发</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 374 · 882 Pytest！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：强平分录过账、快报泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取未发布合并快报与 SUD (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断过账 Top-Side MJE 强平分录与虚标对账完成</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传集团静默期 EPS 与重要性阈值</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定关联方净额清算库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $6,000 伪造多边轧差电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 374 · 🏆 882 项 Pytest 检查里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 合并快报与审计重要性水平气隙：静默期 Flash EPS 与免查重要性阈值与子公司日常对账 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性关联交易双向抵销与禁 Top-Side MJE：严禁 AI 自动过账无底层单据的顶层强平分录，强制制单与复核分离</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 关联方净额清算 (Netting) 账户只读：锁定 trust-registry，跨国净额划拨仅限集团内部银行白名单并经双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：776 个场景 (773 风险 + 3 基线) | 🏆 882 项 Pytest 检查 | 1,618 项断言 | 762 个交互向量 | 374 篇双语 FAQ (193 篇指南) | BRK-757/758</text>
</svg>
