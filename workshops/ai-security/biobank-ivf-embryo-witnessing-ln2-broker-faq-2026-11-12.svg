  <text x="635" y="158" fill="#ecfdf5" font-size="16" font-weight="800">✅ 方案 B：超净台物理双签 + 液氮硬线独立保护 + 能力网关 (Hardened ASR: 0.0%)</text>

  <rect x="637" y="192" width="510" height="74" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="216" fill="#6ee7b7" font-size="13.5" font-weight="700">1. 超净台现场双胚胎学家指纹核签 + 液氮机械浮球/独立硬线报警 + untrusted-write</text>
  <text x="653" y="238" fill="#f1f5f9" font-size="12">• RFID 失配仅限操作台现场双人刷卡指纹处置；液氮罐具备机械补液旁路与不可静默硬线报警</text>
  <text x="653" y="256" fill="#34d399" font-size="11.5" font-weight="700">✓ 外送 PGT 报告染色会话 (untrusted=True) 写操作被 rule="untrusted-write" 0.0248ms 拦截</text>

  <rect x="637" y="280" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-size="13.5" font-weight="700">2. 气隙匿名捐献者身份与人类遗传资源 (HGR) 金库隔离 (record-owner + data-boundary)</text>
  <text x="653" y="326" fill="#f1f5f9" font-size="12">• 报告初筛 Agent (actor="calendar") 跨主体读取 restricted-budget 捐献者与家系基因库被拒绝</text>
  <text x="653" y="344" fill="#f1f5f9" font-size="12">• 任何包含供精/供卵者真实身份映射或罕见病家系全外显子数据的外发消息被出境边界死死卡住</text>
  <text x="653" y="358" fill="#34d399" font-size="11.5" font-weight="700">✓ 辅助生殖双盲伦理与生物安全保护：捐献者真实身份与遗传资源 0 越权读取、0 外部泄露</text>

  <rect x="637" y="378" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="402" fill="#6ee7b7" font-size="13.5" font-weight="700">3. 批准辅助生殖 (ART)/冷链机构名录只读锁定与双院伦理批件结算</text>
  <text x="653" y="424" fill="#f1f5f9" font-size="12">• tool-allowlist + fixed-business-output 严禁 AI 修改 trust-registry 合规 ART 机构表</text>
  <text x="653" y="442" fill="#34d399" font-size="11.5" font-weight="700">✓ original-requester-payment 阻断外部转运单发起的 $4,990 深冷转运费盗刷</text>

  <rect x="637" y="476" width="510" height="82" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="500" fill="#6ee7b7" font-size="13.5" font-weight="700">4. 全链路 SHA-256 审计收据与 CAP / ISO 20387 / 人类遗传资源条例合规</text>
  <text x="653" y="522" fill="#f1f5f9" font-size="12">• 纯内存策略判定 P50 = 0.0248ms / P95 = 0.0409ms；含 SQLite WAL 收据落盘 P50 = 7.21ms</text>
  <text x="653" y="542" fill="#34d399" font-size="11.5" font-weight="700">✓ 满足《人类辅助生殖技术规范》、ISO 20387 生物样本库与国家人类遗传资源审计要求</text>

