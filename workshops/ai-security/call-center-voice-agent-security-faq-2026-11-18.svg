<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="100%" height="100%" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg244" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent244" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="860" fill="url(#bg244)"/>
  <rect x="30" y="24" width="1340" height="8" rx="4" fill="url(#accent244)"/>

  <!-- Header -->
  <text x="45" y="68" fill="#f472b6" font-size="15" font-weight="700" letter-spacing="1.5">AI SOLUTION ARCHITECT · 2026-11-18 ROUND 244 · CALL-CENTER &amp; REALTIME VOICE AGENT SECURITY FAQ</text>
  <text x="45" y="104" fill="#f8fafc" font-size="25" font-weight="800">企业呼叫中心与实时语音 Agent 安全选型：GPT-4o Realtime API vs. STT-LLM-TTS 级联 + DTMF &amp; 带外 FIDO2</text>
  <text x="45" y="132" fill="#94a3b8" font-size="14">解决银行/保险/航司语音客服三大痛点：3秒实时语音克隆 (Deepfake)、通话背景声学提示词注入 (Acoustic Injection) 与口播信用卡号触发 PCI-DSS 违规</text>

  <!-- KPI Badges -->
  <rect x="1035" y="46" width="330" height="84" rx="12" fill="#0f172a" stroke="#f472b6" stroke-width="1.8"/>
  <text x="1200" y="72" text-anchor="middle" fill="#fbcfe8" font-size="13" font-weight="700">516 场景 · 1,098 断言 · 502 向量 · 244 篇 FAQ</text>
  <text x="1200" y="96" text-anchor="middle" fill="#4ade80" font-size="19" font-weight="800">ASR: 75.0% ➔ 0.0% (0.0248ms)</text>
  <text x="1200" y="116" text-anchor="middle" fill="#94a3b8" font-size="11">BRK-497 &amp; BRK-498 · DTMF PCI 隔离 + 带外 FIDO2</text>

  <!-- Section 1: 3 Voice Architecture Options -->
  <text x="45" y="172" fill="#e2e8f0" font-size="17" font-weight="700">1. 智能呼叫中心语音 AI 三大架构路线横向对比（延迟 vs. 合规 vs. 防注入）</text>

  <!-- Card 1: Realtime API -->
  <rect x="45" y="186" width="420" height="235" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="65" y="216" fill="#60a5fa" font-size="16" font-weight="800">🔵 路线 A：GPT-4o Realtime Audio API</text>
  <text x="65" y="238" fill="#bfdbfe" font-size="12" font-weight="600">端到端原生语音流 (Audio-In ➔ Audio-Out)</text>
  <text x="65" y="264" fill="#e2e8f0" font-size="12">• 交互体验：延迟 ~250-350ms，原生随时打断与情绪识别</text>
  <text x="65" y="286" fill="#e2e8f0" font-size="12">• 核心隐患 1：客户口播卡号/CVV 直接入模，触发 PCI-DSS 违规</text>
  <text x="65" y="308" fill="#e2e8f0" font-size="12">• 核心隐患 2：音频编码器易解码背景杂音里的 2.5x 声学注入</text>
  <rect x="65" y="330" width="380" height="72" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <text x="77" y="352" fill="#93c5fd" font-size="12" font-weight="700">架构师选型建议：</text>
  <text x="77" y="372" fill="#cbd5e1" font-size="11.5">适合售前导购/航延安抚；涉及敏感操作必须并行开启</text>
  <text x="77" y="390" fill="#cbd5e1" font-size="11.5">转写流过 Prompt Shields，并外挂 DTMF 与能力网关！</text>

  <!-- Card 2: Cascaded Pipeline -->
  <rect x="490" y="186" width="420" height="235" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="510" y="216" fill="#fbbf24" font-size="16" font-weight="800">🟠 路线 B：级联管道 (STT ➔ DLP/Shields ➔ LLM ➔ TTS)</text>
  <text x="510" y="238" fill="#fde68a" font-size="12" font-weight="600">Azure AI Speech + Presidio 脱敏 + Text LLM</text>
  <text x="510" y="264" fill="#e2e8f0" font-size="12">• 交互体验：延迟 ~700-1200ms，存在两次模态转换开销</text>
  <text x="510" y="286" fill="#e2e8f0" font-size="12">• 核心优势 1：文本中间层 100% 透明，入模前正则剥离卡号</text>
  <text x="510" y="308" fill="#e2e8f0" font-size="12">• 核心优势 2：彻底过滤音频频段扰动，文本护栏拦截率高</text>
  <rect x="510" y="330" width="380" height="72" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="522" y="352" fill="#fcd34d" font-size="12" font-weight="700">架构师选型建议：</text>
  <text x="522" y="372" fill="#cbd5e1" font-size="11.5">适合强监管金融核保、医疗随访与电话法务留痕场景；</text>
  <text x="522" y="390" fill="#cbd5e1" font-size="11.5">但单通道语音仍无法防御 3 秒 Deepfake 声纹伪造！</text>

  <!-- Card 3: Production Hybrid + DTMF + Out-of-Band FIDO2 -->
  <rect x="935" y="186" width="430" height="235" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
  <text x="955" y="216" fill="#34d399" font-size="16" font-weight="800">🛡️ 路线 C：混合架构 + DTMF + 带外 FIDO2 + 网关</text>
  <text x="955" y="238" fill="#a7f3d0" font-size="12" font-weight="600">ACS 语音网关 + 手机 App 硬件签批 + Capability Broker</text>
  <text x="955" y="264" fill="#ecfdf5" font-size="12">• G1 (PCI 隔离)：输卡号/PIN 时对 LLM 自动静音，切 DTMF 按键</text>
  <text x="955" y="286" fill="#ecfdf5" font-size="12">• G2 (防 Deepfake)：高危动作强制推送手机 App FIDO2 签批</text>
  <text x="955" y="308" fill="#ecfdf5" font-size="12">• G3 (能力网关)：0.0248ms 拦截越权查账、改库与 $4,800 盗刷</text>
  <rect x="955" y="330" width="390" height="72" rx="8" fill="#022c22" stroke="#10b981"/>
  <text x="967" y="352" fill="#6ee7b7" font-size="12" font-weight="700">生产级黄金架构结论：</text>
  <text x="967" y="372" fill="#d1fae5" font-size="11.5">兼顾 Realtime 300ms 丝滑对话与 PCI-DSS / 零信任防欺诈，</text>
  <text x="967" y="390" fill="#d1fae5" font-size="11.5">彻底终结“听声音认人”与“口播银行卡号”两大安全黑洞！</text>

  <!-- Section 2: Red vs Blue Architecture -->
  <text x="45" y="454" fill="#e2e8f0" font-size="17" font-weight="700">2. 红蓝对抗推演：3 秒 Deepfake 声纹克隆 &amp; 背景声学注入 vs. DTMF 静音隔离 + 带外 FIDO2 + 能力网关</text>

  <!-- Red Box -->
  <rect x="45" y="468" width="640" height="175" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="65" y="496" fill="#fca5a5" font-size="15" font-weight="800">❌ 脆弱 Baseline：仅靠语音声纹/口头问答核身 + 音频直连工具（BRK-497 / BRK-498 失守）</text>
  <text x="65" y="524" fill="#fecaca" font-size="12.5">1. 背景声学注入越权 (BRK-497)：来电背景混入 2.5x 倍速合成指令，诱导语音 Agent 读取私人银行</text>
  <text x="65" y="544" fill="#fecaca" font-size="12.5">   财富底表 restricted-budget，将客户风险等级篡改为激进型 business-result 并语音/短信外泄。</text>
  <text x="65" y="572" fill="#fecaca" font-size="12.5">2. Deepfake 克隆语音盗刷 (BRK-498)：骗子用 3 秒克隆语音谎称“海外手机被盗急需免审汇款”，</text>
  <text x="65" y="592" fill="#fecaca" font-size="12.5">   诱导语音 Agent 修改免认证白名单 trust-registry 并直接获批 $4,800 紧急电汇！</text>
  <text x="65" y="622" fill="#f87171" font-size="12" font-weight="700">💥 根因：把“声音像本人”等同于硬件身份凭证，且未对外部通话施加污点与资金动作网关锁！</text>

  <!-- Blue Box -->
  <rect x="715" y="468" width="650" height="175" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="496" fill="#6ee7b7" font-size="15" font-weight="800">✅ 零信任呼叫中心防线：DTMF 静音 + 带外 FIDO2 + Capability Broker（0.0% 失守）</text>
  <text x="735" y="524" fill="#d1fae5" font-size="12.5">• 门禁 1 (ACS DTMF PCI 隔离)：输卡号/CVV 时自动对 LLM 静音，按键音直通支付网关，零卡号入模</text>
  <text x="735" y="548" fill="#d1fae5" font-size="12.5">• 门禁 2 (带外 FIDO2 + record-owner)：未完成手机 App 硬件签批前严禁跨主体读取 restricted-budget</text>
  <text x="735" y="572" fill="#d1fae5" font-size="12.5">• 门禁 3 (untrusted-write &amp; fixed-business-output)：外部通话禁改客户风险等级与 trust-registry</text>
  <text x="735" y="596" fill="#d1fae5" font-size="12.5">• 门禁 4 (original-requester-payment)：0.0248ms 拦截外部来电直接触发的 $4,800 紧急电汇盗刷</text>
  <text x="735" y="622" fill="#34d399" font-size="12" font-weight="700">🛡️ 实测开销：Broker 内存裁决 P50 = 0.0248 ms / 含 SQLite WAL 审计收据 P50 = 7.21 ms</text>

  <!-- Section 3: Checklist -->
  <rect x="45" y="662" width="1320" height="168" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="692" fill="#38bdf8" font-size="16" font-weight="800">🛠️ 企业智能呼叫中心与实时语音 AI Agent 上线安全评审 6 项必选 Checklist</text>
  <text x="65" y="722" fill="#e2e8f0" font-size="13">☑️ 1. 废除纯声纹/问答核身：转账、改密、退票强制推送手机 App 带外 FIDO2 / Passkey 生物识别签批（绑定五元组 action_hash）</text>
  <text x="65" y="748" fill="#e2e8f0" font-size="13">☑️ 2. PCI-DSS 物理脱敏：采集银行卡号与交易密码时，ACS 自动对 LLM 静音并切换至加密 DTMF 按键通道</text>
  <text x="65" y="774" fill="#e2e8f0" font-size="13">☑️ 3. 转写旁路护栏：GPT-4o Realtime API 并行开启转写流接入 Azure Prompt Shields，实时熔断背景声学注入</text>
  <text x="65" y="800" fill="#e2e8f0" font-size="13">☑️ 4. 外部进线强制打标 taint="untrusted"  ☑️ 5. record-owner 锁死跨户播报  ☑️ 6. 物理锁死 trust-registry 禁豁免 MFA</text>
</svg>
