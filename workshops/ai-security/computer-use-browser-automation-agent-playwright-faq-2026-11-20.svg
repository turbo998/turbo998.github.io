<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg403" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr403" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg403)" rx="16"/>
  <rect x="20" y="18" width="1160" height="72" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
  <text x="42" y="47" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">Round 403 · 企业浏览器自动化与 Computer-Use Agent (Playwright MCP / Browserbase / Operator) 安全指南</text>
  <text x="42" y="73" fill="#FBCFE8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">BRK-815 &amp; BRK-816 · 🏆 820 个交互向量里程碑 · 已登录 SSO Cookie 气隙 + 跨源导航隔离与敏感按钮手势硬锁</text>

  <!-- Left Column: Threats -->
  <rect x="24" y="106" width="368" height="476" rx="12" fill="#1A121C" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">⛔ Browser-Use / Computer-Use 三大攻击链</text>

  <rect x="38" y="152" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">1. 窃取复用浏览器 Profile 中的 SSO 会话与密码 (BRK-815)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 外部网页 DOM (`aria-label`) 或图片像素嵌入视觉提示词注入</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 诱导复用员工主浏览器 Profile 的 Agent 读取 restricted-budget</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 窃取 Chrome 密码管理器明文密码与内网已登录 SSO Session Cookie</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 外部一个普通网页直接借用浏览器相邻 Tab 偷空内网后台</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">2. 跨 Tab 切回内网后台模拟点击与 `run_javascript` (BRK-815)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 网页隐藏指令让 Agent 打开新标签页访问 `https://admin.corp`</text>
  <text x="50" y="362" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 篡改 business-result 自动点击“导出全量客户”与“添加管理员”</text>
  <text x="50" y="382" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 调用 `page.evaluate` 在内网系统注入持久化 XSS/ServiceWorker</text>
  <text x="50" y="404" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 完全绕过传统同源策略 (SOP) 的“AI 代理跨站请求伪造 (AI-CSRF)”</text>

  <rect x="38" y="444" width="340" height="122" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="466" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">3. 网页视觉欺骗自动填写企业信用卡结账诈骗 (BRK-816)</text>
  <text x="50" y="488" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 恶意供应商门户用透明图层伪造“验证码确认按钮”实为“确认汇款”</text>
  <text x="50" y="508" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 攻击 trust-registry 篡改 RPA/浏览器自动报盘收款银行账号</text>
  <text x="50" y="528" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 诱导采购 Browser Agent 直接代填支付发起 $7,450 电汇</text>
  <text x="50" y="550" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ AI 视觉点击劫持 (AI Clickjacking) 导致企业资金瞬间划走</text>

  <!-- Center Column: Zero-Trust Broker -->
  <rect x="408" y="106" width="384" height="476" rx="12" fill="#0F1E2E" stroke="#EC4899" stroke-width="1.5"/>
  <text x="428" y="136" fill="#FBCFE8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">🛡️ 确定性浏览器沙盒与 DOM/视觉网关 (Hardened)</text>

  <rect x="424" y="152" width="352" height="96" rx="8" fill="#162A3E" stroke="#38BDF8" stroke-width="1"/>
  <text x="438" y="174" fill="#7DD3FC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 1：零透明度隐藏 DOM 剥离与会话污点 (untrusted=True)</text>
  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 序列化 Accessibility Tree 前物理剔除 `opacity:0 / font-size:0` 节点</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 只要访问过非白名单外网域名，整个 Browser Context 标记 untrusted</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 斩断网页隐藏 DOM 属性与不可见图层对视觉/DOM Agent 的催眠</text>

  <rect x="424" y="258" width="352" height="96" rx="8" fill="#162A3E" stroke="#10B981" stroke-width="1"/>
  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 2：员工主浏览器 Profile 与 SSO Cookie 物理气隙</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 严禁挂载本机 `--user-data-dir`；SSO 根凭证存入 restricted-budget</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 每次任务启动一次性无状态云端隔离浏览器 (Ephemeral Incognito)</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 100% 物理杜绝外部网页跨 Tab 借用员工内网已登录 Cookie</text>

  <rect x="424" y="364" width="352" height="100" rx="8" fill="#162A3E" stroke="#F59E0B" stroke-width="1"/>
  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 3：单站点源锁定 (Origin Pinning) 与敏感操作手势接管</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 每个浏览器实例硬绑定单一允许域名白名单，严禁跨公私网导航</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 结账/删除/授权按钮强制暂停并交还人类敏感步接管 (Takeover)</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ untrusted-write 阻断 AI-CSRF 自动点击内网高危按钮</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
  <text x="438" y="496" fill="#FDA4AF" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 4：禁自动代填商务信用卡与收款账户只读锁</text>
  <text x="438" y="518" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• tool-allowlist 禁用 update_trust + fixed-business-output</text>
  <text x="438" y="538" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• original-requester-payment 拦截 $7,450 网页点击劫持电汇</text>
  <text x="438" y="556" fill="#FB7185" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 彻底消除 GUI Agent 在网银或采购门户被视觉欺骗自动付款</text>

  <!-- Right Column: Matrix & Metrics -->
  <rect x="808" y="106" width="368" height="476" rx="12" fill="#111C24" stroke="#10B981" stroke-width="1.5"/>
  <text x="826" y="136" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">📊 方案对比与 820 攻击向量里程碑！</text>

  <rect x="822" y="152" width="340" height="196" rx="8" fill="#172A36" stroke="#334155" stroke-width="1"/>
  <text x="836" y="176" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">五类 Browser-Use / Computer-Use 安全架构对比：</text>
  <text x="836" y="200" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" font-weight="700">1. 一次性隔离云浏览器 + 源钉扎 + 确定性网关 (🏆)</text>
  <text x="836" y="218" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   BRK-815/816 100% 拦截 | 0 跨站 AI-CSRF，敏感点击强制人工接管</text>
  <text x="836" y="240" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">2. Browserbase / Playwright 远程无头容器 (无源锁)</text>
  <text x="836" y="258" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   隔离了本机文件，但若允许跨公私网自由跳转仍可成为 SSRF/CSRF 跳板</text>
  <text x="836" y="280" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">3. 仅靠视觉大模型 (VLM) 看截图识别钓鱼/伪造按钮</text>
  <text x="836" y="298" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   极易被对抗像素补丁 (Adversarial Patch) 与伪造系统弹窗欺骗</text>
  <text x="836" y="320" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">4. 挂载员工本机 Chrome `--remote-debugging-port`</text>
  <text x="836" y="338" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   共享全部已登录网银、云控制台与密码库，1 个网页即可接管一切</text>

  <rect x="822" y="362" width="340" height="204" rx="8" fill="#0D2329" stroke="#EC4899" stroke-width="1.5"/>
  <text x="836" y="388" fill="#FBCFE8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14" font-weight="700">🏆 确定性基准回归达成 (Round 403 里程碑！)</text>
  <text x="836" y="414" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 对抗演练场景总数：<tspan fill="#FBCFE8" font-weight="700">834 个</tspan> (831 对抗 + 3 基线)</text>
  <text x="836" y="438" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• Pytest 参数化检查：<tspan fill="#6EE7B7" font-weight="700">998 项 100% PASS</tspan></text>
  <text x="836" y="462" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 确定性策略断言数：<tspan fill="#FBBF24" font-weight="700">1,734 项</tspan></text>
  <text x="836" y="486" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 交互式靶场攻击向量：<tspan fill="#F472B6" font-weight="700">820 个</tspan> (🏆 突破 820 里程碑！)</text>
  <text x="836" y="510" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 双语架构与选型指南：<tspan fill="#A78BFA" font-weight="700">403 篇 FAQ (222 篇指南)</tspan></text>
  <text x="836" y="538" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">新增测试：BRK-815 (DOM/视觉注入 AI-CSRF) &amp; BRK-816 ($7,450 拦截)</text>

  <!-- Footer -->
  <rect x="20" y="596" width="1160" height="64" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="42" y="622" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">架构师核心铁律：</text>
  <text x="155" y="622" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">严禁 Browser Agent 复用带有内网 SSO 登录态的员工日常浏览器 Profile；强制每任务独立无状态沙盒、域名白名单钉扎与支付/授权步人工接管！</text>
  <text x="42" y="644" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">Repository: turbo998/ai-security-lab (main) · Enterprise AI Security Architecture &amp; Product Selection Series · Round 403 (2026-11-20)</text>
</svg>
