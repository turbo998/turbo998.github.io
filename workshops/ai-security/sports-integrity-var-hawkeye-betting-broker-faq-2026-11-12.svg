  <rect x="637" y="192" width="510" height="74" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="216" fill="#6ee7b7" font-size="13.5" font-weight="700">1. 赛场气隙 VAR 环网 + IEEE 1588 PTP 硬件单向封盘锁 + untrusted-write</text>
  <text x="653" y="238" fill="#f1f5f9" font-size="12">• VAR 鹰眼运行于物理气隙专网；滚球封盘由 PTP 纳秒时钟单向闭锁，严禁软件重开盘口</text>
  <text x="653" y="256" fill="#34d399" font-size="11.5" font-weight="700">✓ 外部球探 XML 染色会话 (untrusted=True) 写操作被 rule="untrusted-write" 在 0.0248ms 拦截</text>

  <rect x="637" y="280" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-size="13.5" font-weight="700">2. 气隙 WADA 反兴奋剂与球员 MRI 医疗库隔离 (record-owner + data-boundary)</text>
  <text x="653" y="326" fill="#f1f5f9" font-size="12">• 战报解析 Agent (actor="calendar") 跨主体读取 restricted-budget 医疗与药检库被立即拒绝</text>
  <text x="653" y="344" fill="#f1f5f9" font-size="12">• 任何包含运动员生物护照 (ADAMS) 或赛前核磁报告的外发消息被出境边界死死卡住</text>
  <text x="653" y="358" fill="#34d399" font-size="11.5" font-weight="700">✓ 运动员隐私与盘口公平：药检结果与首发伤病名单 0 越权读取、0 外部泄露</text>

  <rect x="637" y="378" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="402" fill="#6ee7b7" font-size="13.5" font-weight="700">3. 官方赛事数据源只读锁定与主裁+监督双人硬件签章派彩</text>
  <text x="653" y="424" fill="#f1f5f9" font-size="12">• tool-allowlist + fixed-business-output 严禁 AI 修改 trust-registry 官方认证信源表</text>
  <text x="653" y="442" fill="#34d399" font-size="11.5" font-weight="700">✓ original-requester-payment 阻断外部更正函发起的 $4,950 奖池派彩电汇</text>

  <rect x="637" y="476" width="510" height="82" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="500" fill="#6ee7b7" font-size="13.5" font-weight="700">4. 全链路 SHA-256 审计收据与 FIFA / WADA ISPPPI / GLI-33 合规证明</text>
  <text x="653" y="522" fill="#f1f5f9" font-size="12">• 纯内存策略判定 P50 = 0.0248ms / P95 = 0.0409ms；含 SQLite WAL 收据落盘 P50 = 7.21ms</text>
  <text x="653" y="542" fill="#34d399" font-size="11.5" font-weight="700">✓ 满足国际体育仲裁院 (CAS)、WADA 隐私标准与 GLI-33 竞猜系统合规审计</text>

