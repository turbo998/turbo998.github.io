  <rect x="30" y="22" width="1140" height="92" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="52" y="54" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1">AI SOLUTION ARCHITECT · 2026-11-12 ROUND 69 FAQ (150 大架构 FAQ 场景里程碑 · SPORTS INTEGRITY, VAR HAWK-EYE &amp; PARIMUTUEL CLEARING)</text>
  <text x="52" y="82" fill="#f8fafc" font-size="20" font-weight="800">职业体育赛事诚信、VAR 鹰眼遥测与竞猜清结算 AI Agent：主裁双人硬件签章 + 零信任网关选型一图流</text>
  <text x="52" y="103" fill="#94a3b8" font-size="12.5">外部球探 XML 注入、重开已封盘口延迟套利 (Late-Betting)、WADA 药检/球星 MRI 窃密与 $4,950 派彩盗刷 vs. PTP 硬件封盘锁 + 能力网关 (398 项 Pytest 通过)</text>

  <!-- Left Column: Vulnerable Baseline -->
  <rect x="30" y="130" width="555" height="445" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="130" width="555" height="44" rx="12" fill="url(#redGrad69)"/>
  <text x="50" y="158" fill="#fef2f2" font-size="16" font-weight="800">❌ 方案 A：一体化赛事与清结算 Agent 直连盘口/医疗库 (Baseline ASR: 75.0%)</text>

  <rect x="52" y="192" width="510" height="74" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="216" fill="#fca5a5" font-size="13.5" font-weight="700">1. 场边外包球探实时 XML 事件流 (&lt;Comment&gt;) 间接提示词注入</text>
  <text x="68" y="238" fill="#e4e4e7" font-size="12">• 博彩黑产攻陷场边采集平板，在角球事件 XML 中植入伪造“竞赛技术委员会同步指令”</text>
  <text x="68" y="256" fill="#a1a1aa" font-size="11.5">• mTLS 网关放行合法采集终端，文本护栏无法识别“鹰眼帧同步漂移 / 封盘回滚”专业术语</text>

  <rect x="52" y="280" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-size="13.5" font-weight="700">2. 重开已封盘竞猜市场 (延迟压注套利) 与 VAR 越位判罚篡改 (BRK-147)</text>
  <text x="68" y="326" fill="#e4e4e7" font-size="12">• 被污染的赛事 Agent 调用 write_record("business-result") 将点球封盘回滚为 MARKET_OPEN</text>
  <text x="68" y="344" fill="#e4e4e7" font-size="12">• 场边黑产利用转播 5 秒延迟完成 100% 稳赢延迟压注 (Courtsiding)，并篡改 VAR 越位容差</text>
  <text x="68" y="358" fill="#f87171" font-size="11.5" font-weight="700">✕ 赛事诚信与盘口失守：确定性时间差洗劫竞猜奖池与赛果公信力崩塌</text>

  <rect x="52" y="378" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="402" fill="#fca5a5" font-size="13.5" font-weight="700">3. WADA 反兴奋剂生物护照与首发球星赛前 MRI 伤病底牌窃密</text>
  <text x="68" y="424" fill="#e4e4e7" font-size="12">• 战报解析 Agent 跨权限读取 restricted-budget 药检 A 瓶异常与主力前锋韧带核磁报告</text>
  <text x="68" y="442" fill="#f87171" font-size="11.5" font-weight="700">✕ 重大内幕交易泄露：通过 send_message 将未公开伤病与药检档案外发地下庄家</text>

  <rect x="52" y="476" width="510" height="82" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="500" fill="#fca5a5" font-size="13.5" font-weight="700">4. 未授权野鸡比分商白名单篡改与 $4,950 奖池派彩盗刷 (BRK-148)</text>
  <text x="68" y="522" fill="#e4e4e7" font-size="12">• 伪造比赛监督加时赛更正函改写 trust-registry 官方数据源表并触发 request_payment($4,950)</text>
  <text x="68" y="542" fill="#f87171" font-size="11.5" font-weight="700">✕ 奖池清算资金失守：未经双人硬件签章直接放行 $4,950 异常赔率派彩电汇</text>

