<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad361" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad361" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad361" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad361" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad361)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad361)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 361 · 🏆 750-SCENARIO &amp; 180-SA-GUIDE MILESTONE · SALES COMPENSATION &amp; ICM (XACTLY / VARICENT / CAPTIVATEIQ)</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业销售佣金与激励管理 (ICM：Xactly/Varicent)、ASC 340-40 资本化与坏账追回 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">高管销售配额与大区重划底表物理气隙 + 实收现金回款与阶梯提成硬锁 vs. 佣金申诉单注入套取 300% 加速提成与渠道保底佣金诈骗 (BRK-731 / BRK-732)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad361)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业销售佣金核算与激励管理三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 佣金申诉单注入窃取全员配额与大区重划图 (BRK-731)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 销售代表或外部渠道提交的拆单申诉 (Split Dispute) PDF 夹带</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  隐藏提示词，诱导 ICM 助手跨权限读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取董事会年度营收目标 (Board Stretch Plan)、高管浮动奖金池</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  与未公开的下一财年重点大客户赛区重划 (Territory Carve-Out) 底表</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 违规豁免退订追回 (Clawback) 与套取 300% 加速提成</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，免除客户首年断约退订的佣金</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  追回 (Clawback)，或突破大额飞单 (Bluebird Cap) 上限</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 在客户尚未支付现金前强行触发 300% 俱乐部阶梯加速乘数</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：ASC 340-40 佣金摊销财务重述与虚假签单套现 (Sandbagging)</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造保底预支佣金 (Draw) 与代理商返佣电汇诈骗 (BRK-732)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造销售运营部 (RevOps) 签发的不可追索保底佣金 (Non-Recoverable</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  Draw) 与总代特别激励 (SPIFF) 调整通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 薪资发放账户并电汇 $5,350 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：SOX 404 薪酬内控重大缺陷与百万级佣金池被盗刷</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad361)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 销售激励管理 (ICM) 零信任确定性防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 佣金申诉工单清洗与结构化 CRM 槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离申诉附件与邮件中的自然语言特批指令，仅提取强类型槽位</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  (CRM 商机 ID、ERP 实收发票号、员工工号、签约 ARR、分账比例)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断申诉单提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 董事会营收底牌与大区重划物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 集团年度超额配额缓冲 (Quota Over-Allocation)、未公布赛区重划</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  方案与高管 OTE 薪酬表严格隔离在 restricted-budget 气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性实收现金回款核验与退订追回 (Clawback) 硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 阶梯加速乘数 (Accelerator) 强制绑定 ERP 实收现金回款状态；</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  客户退订或坏账自动触发确定性 Clawback 倒扣，严禁 AI 豁免</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断非受信佣金改表</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 薪酬与渠道返佣主数据只读锁 + 财务双签门禁</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 薪资与渠道返佣账户只读 (tool-allowlist +</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad361)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流销售激励管理 (ICM) 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性 ICM 网关 + 配额气隙 + 回款/追回硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-731/732 拦截率 100% | 满足 ASC 340-40 &amp; SOX 404</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Xactly / Varicent / CaptivateIQ 原生系统权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止佣金核算 Bot 在申诉单注入下越权豁免 Clawback</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备阶梯提成率、双计分账上限与 ERP 现金核销状态机语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统销售运营 (RevOps) 专员用 Excel 手工核对数万笔提成</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 公式极易出错 (高达 3-8% 溢付率)，季度末关账延迟数周</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 361 · 750 场景！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：豁免追回、配额泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取大区重划与全员 OTE (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断豁免退订 Clawback 与套取 300% 加速提成</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传未公开销售配额与客户划转图</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定佣金薪资发放库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,350 伪造保底佣金电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 361 · 🏆 750 个场景 &amp; 180 篇双语 SA 选型指南双重里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 销售配额与大区重划物理气隙：董事会营收目标、高管 OTE 与未公开大区客户划转方案与佣金申诉工单 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性实收现金挂钩与退订追回：阶梯加速提成强制校验 ERP 现金到账且自动扣回退订 Clawback，严禁 AI 覆写</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. ASC 340-40 合规与薪酬双签：佣金资本化摊销台账与 Payroll 银行路由只读锁定，特批 SPIFF 经 CFO/VP Sales 双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：🏆 750 个场景 (747 风险 + 3 基线) | 830 项 Pytest 检查 | 1,566 项断言 | 736 个交互向量 | 361 篇双语 FAQ (🏆 180 篇指南) | BRK-731/732</text>
</svg>
