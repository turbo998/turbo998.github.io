<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad346" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad346" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad346" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad346" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad346)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad346)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 346 · 🏆 720 SCENARIOS &amp; 770 PYTEST MILESTONE · TELECOM WHOLESALE ROAMING (TAP3 / GSMA BCE), IRSF FRAUD &amp; CLEARING</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">电信国际漫游网间结算 (GSMA BCE/TAP3)、IRSF 欺诈拦截与清算所 AI Agent 安全选型指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">CALEA 合法监听目标与双边 IOT 批发底价物理气隙 + IRSF/NRTRDE 欺诈熔断硬锁 vs. 漫游争议对账注入放行声讯台盗打与 FCH 清算电汇诈骗 (BRK-701 / BRK-702)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad346)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 电信网间结算与漫游安全三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 漫游对账争议注入窃取 CALEA 监听表与 IOT 底价 (BRK-701)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 漫游合作伙伴或虚拟运营商 (MVNO) 上传的 GSMA BCE / TAP3</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  话单争议包 PDF 夹带间接提示词注入</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 诱导 Agent 跨库读取 CALEA/ETSI LI 合法监听目标清单、</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  要客政要 IMSI/SUPI 轨迹及双边 IOT 阶梯批发底价</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 解除 IRSF 国际高额声讯台欺诈熔断阈值 (BRK-701)</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令在收入保障系统 (Subex/WeDo FMS) 中将高危海盗</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  号段加入白名单，并禁用 NRTRDE 近实时漫游欺诈阻断策略</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 放行被盗 eSIM/物联网卡向高分成声讯台持续并发群呼</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：数小时内产生数百万美元不可追回网间结算损失</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造 GSMA FCH 财务清算所净额结算电汇诈骗 (BRK-702)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造漫游财务清算所 (Syniverse/BICS/Comfone) 双边轧差账单</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 中清算所多币种资金池收款 IBAN，并发起</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">  $5,020 国际漫游网间结算电汇 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-size="11" font-weight="700">• 违规触发：跨国运营商网间清算资金被盗与漫游服务中断</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad346)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 电信网间结算与反欺诈零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: TAP3 / BCE / RAP 争议包清洗与结构化提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离对账争议附件中的自由文本指令，仅提取 ASN.1/JSON 强类型</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  字段 (TADIG 代码、CDR 序列号、计费时长、SDR 特别提款权金额)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: CALEA 监听库与双边 IOT 底价物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 司法监听 (Lawful Intercept) 目标库、VIP IMSI 位置库及未公开</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  双边 IOT 承诺流量折让表存入物理气隙域 (restricted-budget)</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: IRSF / NRTRDE 欺诈熔断硬锁与 GSMA PRDs 校验</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• FMS 欺诈阻断阈值、高危 B-Number 黑名单与 SEPP 信令防火墙</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  策略完全由确定性引擎锁定，严禁 AI 下调阈值或豁免异常话单</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断欺诈规则篡改</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: FCH 清算所银行白名单只读与双人硬件签批</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中 FCH 清算所与运营商账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad346)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流电信漫游结算与反欺诈安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性电信网关 + LI/IOT 气隙 + FMS 硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-701/702 拦截率 100% | 满足 GSMA BA.27/BCE &amp; CALEA</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Subex / WeDo / CSG 收入保障与结算系统原生 RBAC</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止争议工单自动化助手被注入后静默豁免 IRSF 告警</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 TADIG 代码、NRTRDE 阈值与 SDR 汇率对账状态语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统国际业务部人工核对月度 TAP3/BCE 账单与邮件争议</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 跨国对账周期长达 30-45 天，无法阻断秒级爆发的 IRSF 盗打</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 346 · 720 场景！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：IRSF 解锁、IOT 泄密与清算电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取 CALEA 监听库与双边 IOT 底价 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断禁用 IRSF/NRTRDE 阻断阈值 (business-result)</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向外部运营商外传 IOT 底价表</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 FCH 清算银行库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,020 伪造漫游清算电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 346 · 🏆 720 个场景 &amp; 770 项 Pytest 检查双重里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 合法监听与双边底价气隙：CALEA/ETSI LI 司法监听目标库、VIP IMSI 位置轨迹与双边 IOT 批发底价与对账 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 NRTRDE/IRSF 熔断硬锁：单 IMSI/号段突发国际声讯台流量由确定性流计算引擎实时阻断，禁止 AI 助手豁免欺诈告警</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. GSMA RAEX 签名与清算所白名单：漫游费率与清算账户仅从 GSMA RAEX 加密库同步；锁定 trust-registry 并执行财务双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：🏆 720 个场景 (717 风险 + 3 基线) | 🏆 770 项 Pytest 检查 | 1,506 项断言 | 706 个交互向量 | 346 篇双语 FAQ (164 篇指南) | BRK-701/702</text>
</svg>
