  <text x="650" y="196" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">
    Gate 1 · 硬件压降微分器 (-dP3/dt) 15ms 直断燃油阀 FSOV + 天平 85% 硬回零
  </text>
  <text x="650" y="218" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">
    • 硬件动态压力微分器检测到首个喘振脉冲或 N2&gt;103% 时，15ms 内切断 FSOV 并全开防喘门
  </text>
  <text x="650" y="240" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">
    • 六分量天平电桥达 85% 额定弯矩时，硬件液压阀自动将迎角回零并开启风洞旁路卸压
  </text>

  <rect x="636" y="268" width="520" height="92" rx="8" fill="#06382c" stroke="#34d399" stroke-width="1" />
  <text x="650" y="292" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">
    Gate 2 · 外协 STEP 测量报告强制污点隔离 (rule="untrusted-write")
  </text>
  <text x="650" y="314" fill="#6ee7b7" font-family="Consolas, Microsoft YaHei, monospace" font-size="12">
    if stage.untrusted and decision.record_id == "business-result": return BLOCK
  </text>
  <text x="650" y="338" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">
    • 外协几何测量单标记 untrusted=True，0.0248ms 拦截任何改写防喘活门或风洞迎角序列
  </text>

  <rect x="636" y="374" width="520" height="84" rx="8" fill="#06382c" stroke="#34d399" stroke-width="1" />
  <text x="650" y="398" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">
