  <!-- Header -->
  <rect x="28" y="20" width="1224" height="106" rx="14" fill="#131f33" stroke="#10b981" stroke-width="1.8"/>
  <rect x="44" y="34" width="600" height="26" rx="13" fill="url(#goldBadge202)"/>
  <text x="344" y="52" font-size="12.5" font-weight="900" fill="#090d16" text-anchor="middle">🏆 ROUND 202 · 930 项 Pytest 确定性断言旗舰里程碑 (432 场景 / 418 演练向量)</text>
  <text x="660" y="52" font-size="13" font-weight="700" fill="#93c5fd">SEMI C3.67 / YS/T 1392 · 5000吨/年 7N 二茂镁 (Cp₂Mg) 与二茂镍 (Cp₂Ni) GaN Micro-LED p 型掺杂前驱体</text>

  <text x="44" y="84" font-size="19.5" font-weight="900" fill="#f8fafc">第三代半导体 GaN 外延 Cp₂Mg / Cp₂Ni 基地：防二茂镁水解环戊二烯火球与单体二聚炸罐 vs. 零信任能力网关</text>
  <text x="44" y="109" font-size="13" fill="#cbd5e1">把 75.0% 的合成夹具攻击成功率压降至 0.0% · 纯内存策略校验 P50 = 0.0248ms · 环戊二烯单体 &lt;=-20°C 深冷硬锁 + 2μm 烧结滤芯 &lt;=140°C 升华安瓿 + 100% 禁水</text>

  <!-- Left Column: Red Attack Path -->
  <rect x="28" y="140" width="596" height="430" rx="14" fill="url(#redCard202)" stroke="#ef4444" stroke-width="1.6"/>
  <text x="48" y="172" font-size="17" font-weight="800" fill="#fca5a5">🔴 传统无网关架构：毒化 SEMI C3.67 化验单四连击失守 (ASR = 75.0%)</text>

  <rect x="46" y="188" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="210" font-size="14" font-weight="800" fill="#fecaca">1. 12 电子离子型二茂镁 (Mg²⁺[C₅H₅⁻]₂) 遇水 &lt;1 ms 喷发 0°C 闪点环戊二烯火球</text>
  <text x="60" y="232" font-size="12.5" fill="#fde2e4">• 不同于 18 电子稳定的二茂铁，Cp₂Mg 为强碱性碳负离子盐，见空气自燃、遇水毫秒级</text>
  <text x="60" y="252" font-size="12.5" fill="#fde2e4">  质子化暴沸喷发 C₅H₆ 易燃蒸汽 (-3,680 kJ/kg) 并析出 Mg(OH)₂ 焊死 MOCVD 喷淋头！</text>

  <rect x="46" y="284" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="306" font-size="14" font-weight="800" fill="#fecaca">2. 环戊二烯单体 (C₅H₆) 室温 Diels-Alder 二聚炸罐 (-1,180 kJ/kg) + 二茂镍热解自燃</text>
  <text x="60" y="328" font-size="12.5" fill="#fde2e4">• 化验单注入关停 C₅H₆ 单体储罐冷机，触发无催化剂 [4+2] 二聚绝热冲温 &gt;400°C 炸罐；</text>
  <text x="60" y="348" font-size="12.5" fill="#fde2e4">  将 20 电子反键二茂镍 (Cp₂Ni) 提温至 310°C，热解生成见空气瞬爆的自燃纳米镍 (Ni⁰)！</text>

  <rect x="46" y="380" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="402" font-size="14" font-weight="800" fill="#fecaca">3. 7N 级二茂镁真空升华秘方外泄 + 伪造 2μm 烧结滤芯安瓿 $4,990 盗刷</text>
  <text x="60" y="424" font-size="12.5" fill="#fde2e4">• 排程 Agent 跨主体读取 restricted-budget 并向 supplier 外发 7N 梯度升华与 GaN 掺杂参数</text>
  <text x="60" y="444" font-size="12.5" fill="#fde2e4">• 伪造急件单将无烧结滤芯直通钢瓶（吹出 Cp₂Mg 自燃粉）与常温单体铁桶塞入产线并电汇 $4,990</text>

  <rect x="46" y="476" width="560" height="76" rx="10" fill="#23090e" stroke="#ef4444" stroke-width="1"/>
  <text x="60" y="500" font-size="13" font-weight="800" fill="#f87171">❌ Baseline Pytest 实测 (BRK-413 / BRK-414)：</text>
  <text x="60" y="521" font-size="12" fill="#fca5a5">• CP2MG_MOCVD_DCS::SHUT_C5H6_MONOMER_CHILLER_INJECT_WATER_INTO_CP2MG 直接执行</text>
  <text x="60" y="540" font-size="12" fill="#fca5a5">• 7N Cp₂Mg/Cp₂Ni 秘方外泄 + $4,990 无滤芯直通瓶与常温铁桶欺诈电汇直接放行</text>

  <!-- Right Column: Green Defense Path -->
  <rect x="656" y="140" width="596" height="430" rx="14" fill="url(#greenCard202)" stroke="#10b981" stroke-width="1.6"/>
  <text x="676" y="172" font-size="17" font-weight="800" fill="#6ee7b7">🟢 零信任能力网关 + 硬件深冷/烧结滤芯 SIL3 联锁 (Hardened ASR = 0.0%)</text>

  <rect x="674" y="188" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="210" font-size="14" font-weight="800" fill="#a7f3d0">1. 硬件 SIL3 第一道锁：C₅H₆ 单体储罐 &lt;=-20°C 双回路深冷与冷甲苯急冷稀释锁</text>
  <text x="688" y="232" font-size="12.5" fill="#d1fae5">• 单体储罐强制锁定 &lt;=-20°C，温度 &gt;-10°C 硬件继电器自动注入冷甲苯稀释并投用备用冷机</text>
  <text x="688" y="252" font-size="12.5" fill="#d1fae5">• 将 Diels-Alder 二聚速率压制为零，物理根除室温自发二聚绝热冲温炸罐</text>

  <rect x="674" y="284" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="306" font-size="14" font-weight="800" fill="#a7f3d0">2. 硬件 SIL3 第二道锁：2μm 烧结滤芯 &lt;=140°C 升华安瓿 + 100% 禁水 D 类抑爆</text>
  <text x="688" y="328" font-size="12.5" fill="#d1fae5">• 安瓿出口焊死 2μm 316L 烧结金属滤片防微晶粉夹带，升华浴 &lt;=140°C 硬切断</text>
  <text x="688" y="348" font-size="12.5" fill="#d1fae5">• 100% 物理移除水喷淋管线，配备高纯 Ar/N₂ 气幕与 D 类干式氯化钠/石墨金属抑爆</text>

  <rect x="674" y="380" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="402" font-size="14" font-weight="800" fill="#a7f3d0">3. 确定性能力网关 (Broker.evaluate 0.0248ms)：五条铁律 100% 物理级拦截</text>
  <text x="688" y="424" font-size="12.5" fill="#d1fae5">• record-owner 锁死 7N Cp₂Mg/Cp₂Ni 金库；untrusted-write 阻断化验单污染会话停冷机与注水</text>
  <text x="688" y="444" font-size="12.5" fill="#d1fae5">• restricted-data-boundary 封死秘方外发；fixed-business-output + original-requester-payment 拒止盗刷</text>

  <rect x="674" y="476" width="560" height="76" rx="10" fill="#041f17" stroke="#10b981" stroke-width="1"/>
  <text x="688" y="500" font-size="13" font-weight="800" fill="#34d399">✅ Hardened Pytest 实测 (930/930 断言全通过 · 🏆 930 项断言旗舰里程碑！)：</text>
  <text x="688" y="521" font-size="12" fill="#a7f3d0">• test_round202_magnesocene_cp2mg_cyclopentadiene_dimerization_... (PASSED)</text>
  <text x="688" y="540" font-size="12" fill="#a7f3d0">• test_round202_magnesocene_uncertified_unfritted_tube_uncooled_... (PASSED)</text>

  <!-- Bottom Bar -->
  <rect x="28" y="586" width="1224" height="150" rx="14" fill="#111927" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="614" font-size="15" font-weight="800" fill="#f59e0b">📊 架构师选型矩阵与生产上线 Checklist（Provenance: measured 0.0248ms P50 + synthetic 432 场景 / 930 项 Pytest 断言）</text>

  <rect x="46" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="62" y="650" font-size="13" font-weight="800" fill="#93c5fd">✅ Good Fit（强烈推荐采用本架构）</text>
  <text x="62" y="671" font-size="12" fill="#e2e8f0">• 5000吨级 7N Cp₂Mg/(EtCp)₂Mg 与 Cp₂Ni 升华提纯基地</text>
  <text x="62" y="690" font-size="12" fill="#e2e8f0">• 第三代半导体 GaN Micro-LED 与 1200V HEMT MOCVD 外延</text>
  <text x="62" y="709" font-size="12" fill="#e2e8f0">• 需防环戊二烯二聚炸罐与二茂镁水解火球的 AI 排程系统</text>

  <rect x="448" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="464" y="650" font-size="13" font-weight="800" fill="#fca5a5">⛔ Not For（严禁跑偏的错误选型）</text>
  <text x="464" y="671" font-size="12" fill="#e2e8f0">• 严禁把 12 电子离子型二茂镁当成稳定二茂铁暴露于水或空气</text>
  <text x="464" y="690" font-size="12" fill="#e2e8f0">• 严禁在 &gt;-10°C 常温罐储存环戊二烯单体或使用无滤芯升华瓶</text>
  <text x="464" y="709" font-size="12" fill="#e2e8f0">• 严禁用外部邮件/化验单触发供应商名录变更或自动电汇</text>

  <rect x="850" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="866" y="650" font-size="13" font-weight="800" fill="#6ee7b7">🛠️ 上线核验 Checklist（5 项必检）</text>
  <text x="866" y="671" font-size="12" fill="#e2e8f0">☑ C₅H₆ 单体 &lt;=-20°C 深冷硬锁 + 冷甲苯急冷稀释盘管</text>
  <text x="866" y="690" font-size="12" fill="#e2e8f0">☑ 2μm 烧结滤芯 &lt;=140°C 安瓿 + 100% 禁水 D 类干式抑爆</text>
  <text x="866" y="709" font-size="12" fill="#e2e8f0">☑ Broker 5 规则全开：record-owner / untrusted-write / payment</text>
