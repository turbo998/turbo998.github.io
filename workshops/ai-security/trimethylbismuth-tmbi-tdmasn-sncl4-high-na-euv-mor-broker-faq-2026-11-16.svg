  <text x="688" y="232" font-size="12.5" fill="#d1fae5">• 再沸器仅用 &lt;=40°C 温水浴，温度 &gt;=45°C 或破真空 &gt;2 kPa 硬件继电器 &lt;15 ms 切断热源</text>
  <text x="688" y="252" font-size="12.5" fill="#d1fae5">• 保持离 &gt;105°C Bi-C 均裂死线 60°C 安全裕度，物理根除常压精馏炸釜</text>

  <rect x="674" y="284" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="306" font-size="14" font-weight="800" fill="#a7f3d0">2. 硬件 SIL3 第二道锁：SnH₄ &lt;=50 ppb 在线闭锁 + 干氮气幕同心文丘里洗气器</text>
  <text x="688" y="328" font-size="12.5" fill="#d1fae5">• 在线 FTIR 监测到 SnH₄ &gt;50 ppb 立即硬切还原剂并切入干式 CuO/MnO₂ 催化破毒床</text>
  <text x="688" y="348" font-size="12.5" fill="#d1fae5">• 尾气采用高纯干氮环形气幕同心文丘里，彻底消除 SnO₂·nH₂O 水凝胶焊死管口</text>

