  <text x="688" y="402" font-size="14" font-weight="800" fill="#a7f3d0">3. 确定性能力网关 (Broker.evaluate 0.0248ms)：五条铁律 100% 物理级拦截</text>
  <text x="688" y="424" font-size="12.5" fill="#d1fae5">• record-owner 锁死 7N TMBi/TDMASn 金库；untrusted-write 阻断化验单污染会话提温与注水</text>
  <text x="688" y="444" font-size="12.5" fill="#d1fae5">• restricted-data-boundary 封死秘方外发；fixed-business-output + original-requester-payment 拒止盗刷</text>

