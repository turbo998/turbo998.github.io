  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad347)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 347 · 🏆 1,510 ASSERTIONS &amp; 165 GUIDES MILESTONE · REINSURANCE TREATY (SAP FS-RI), BORDEREAUX &amp; CAT BOND COLLATERAL</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">再保险合约分保 (SAP FS-RI)、巨灾债券 (Cat Bond) 与理赔报表 AI Agent 安全选型指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">转分保穿层留存敞口 (PML) 与巨灾模型底稿物理气隙 + 小时条款/除外责任硬锁 vs. Bordereaux 报表注入摊回与 Reg 114 信托电汇诈骗 (BRK-703 / BRK-704)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad347)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 再保险分保与巨灾理赔三大核心攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 分出公司 Bordereaux 报表注入窃取转分保敞口 (BRK-703)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 原保险人 (Cedent) 或 MGA 上传的月度理赔清单 (Loss</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  Bordereaux) 与 ACORD GRLC 报文夹带间接提示词注入</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 诱导 Agent 跨库读取再保人未对冲最大可能损失 (Net PML)、</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  转分保穿层点 (Retro Exhaustion) 及巨灾债券触发阈值</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 篡改小时条款 (Hours Clause) 强行摊回超赔层 (BRK-703)</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令将跨越两场独立飓风/洪灾的理赔合并进单一 168 小时</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  窗口以击穿超额赔款分保起赔点 (Cat XL Attachment Point)</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 或将除外责任中的通融赔付 (Ex-Gratia) 强行计入再保摊回账单</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：数千万美元非承保责任被穿层摊回并免除复效保费</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造现金摊回 (Cash Loss Call) 与 Reg 114 信托诈骗 (BRK-704)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造再保经纪人 (Guy Carpenter/Aon Re) 紧急现金摊回通知函</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 中原保险人/Reg 114 担保信托账户 IBAN，</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">  并发起 $5,040 巨灾现金摊回电汇 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-size="11" font-weight="700">• 违规触发：再保赔款与巨灾抵押信托资产被跨境洗劫</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad347)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 再保险分保与巨灾精算零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: Bordereaux / ACORD GRLC 清洗与结构化提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离分保账单与理赔查勘报告中的隐藏提示词，仅提取强类型</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  槽位 (合约编号、PCS 巨灾事件码、出险时间戳、经纬度、赔款额)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 转分保穿层点与净 PML 敞口物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 再保人自身转分保 (Retrocession) 结构、RMS/AIR 净尾端 PML</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  底稿及巨灾债券 SPV 触发模型存入物理气隙域 (restricted-budget)</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性小时条款 (Hours Clause) 与复效保费引擎</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 确定性代码按 PCS/PERILS 气象事件 ID 与 72/168 小时时间窗</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  硬性切分起赔额并自动扣减复效保费；严禁 AI 豁免除外责任</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断违规并案摊回</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 经纪人/Reg 114 信托白名单只读与双人签批</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中分出公司与受托行 IBAN 只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad347)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流再保险理赔与账单 AI 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性再保网关 + 转分保气隙 + 小时条款硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-703/704 拦截率 100% | 满足 Solvency II &amp; NAIC 审计</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. SAP FS-RI / Duck Creek Reinsurance 原生角色权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法阻止 Bordereaux 摄入机器人在注入下改写合约穿层状态</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 168 小时巨灾条款、起赔点累算与复效保费算术语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统再保技术会计人工核对非标 Excel Bordereaux 清单</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 单份万行级月度报表核对需 3-5 天，错漏与重复摊回率高</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 347 · 1,510 断言！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：违规并案摊回、PML 泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取转分保穿层点与净 PML (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断违规并案击穿超赔层起赔点 (business-result)</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向外部泄密巨灾债券触发底稿</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 Reg 114 信托库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,040 伪造现金摊回电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 347 · 🏆 1,510 项断言 &amp; 165 篇双语选型指南双重里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 转分保与巨灾模型气隙：再保人自身 Retrocession 对冲结构、未对冲净 PML 与 ILS 巨灾债券模型与分入账单 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性小时条款与起赔点累算：Cat XL 超赔层穿层计算必须绑定独立气象编码 (PCS/PERILS) 与确定性时间窗，禁止 AI 跨事件并案</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 现金摊回双签与 Reg 114 信托只读：Cash Loss Call 与担保信托释放必须经首席再保理赔官与精算师 FIDO2 双签；锁定 trust-registry</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：722 个场景 (719 风险 + 3 基线) | 774 项 Pytest 检查 | 🏆 1,510 项断言 | 708 个交互向量 | 347 篇双语 FAQ (🏆 165 篇指南) | BRK-703/704</text>
</svg>
