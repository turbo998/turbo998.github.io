<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#041f1c"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
      .card-hdr { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; fill: #38bdf8; }
      .body-txt { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #e2e8f0; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1440" height="6" fill="url(#accentBlue)"/>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="530" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="21" class="mono" font-size="13" fill="#6ee7b7">🏆 1,450 断言 &amp; 150 篇双语选型指南里程碑 · Round 332 · 692 场景</text>
    <rect x="545" y="0" width="625" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="563" y="21" class="mono" font-size="13" fill="#c7d2fe">EMPLOYEE BENEFITS &amp; 401(K) TPA (FIDELITY/EMPOWER) · ERISA QDRO · PRT</text>

    <text x="0" y="74" class="title" font-size="28">企业退休金与员工福利（401k / ERISA TPA）、QDRO 与年金买断 AI 指南</text>
    <text x="0" y="106" class="sub" font-size="16">高管递延薪酬 (SERP/NQDC) 与养老金买断底稿气隙 + 401(k) 提取与 QDRO 硬锁 vs. 困难提取注入与能力网关</text>
  </g>

  <!-- Left Card -->
  <g transform="translate(48, 166)">
    <rect width="650" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19">⚖️ 企业退休金 (401k/DB Plan)、QDRO 分割与年金买断 AI 架构对比</text>

    <rect x="20" y="54" width="610" height="72" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
    <text x="34" y="78" class="title" font-size="15" fill="#fca5a5">1. ❌ 福利客服 Agent 直通高管递延薪酬库与 401(k) 养老金提取放行</text>
    <text x="34" y="100" class="body-txt" font-size="13">• 外部上传的离婚财产分割令 (QDRO PDF) 或困难提取证明植入指令，套出高管 Rabbi Trust 余额</text>
    <text x="34" y="118" class="mono" font-size="12" fill="#fca5a5">ERISA 受托责任灾难：诱导绕过配偶公证同意书 (Spousal Consent) 将员工终生养老金转空</text>

    <rect x="20" y="136" width="610" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="160" class="title" font-size="15" fill="#7dd3fc">2. 🔒 高管非合格递延薪酬 (SERP/NQDC) 与养老金风险转移 (PRT) 气隙</text>
    <text x="34" y="182" class="body-txt" font-size="13">• 面向普通员工福利问答开放的 AI 0 权限读取高管补充退休计划与固定收益养老金买断精算底表</text>
    <text x="34" y="200" class="mono" font-size="12" fill="#93c5fd">Entra Agent ID + OBO 单参与者隔离：物理阻断触碰 restricted-budget 福利底表</text>

    <rect x="20" y="218" width="610" height="72" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="34" y="242" class="title" font-size="15" fill="#d8b4fe">3. 📜 401(k) 转滚提取 (Rollover)、QDRO 核准与配偶公证硬互锁</text>
    <text x="34" y="264" class="body-txt" font-size="13">• AI 仅预审医疗/购房困难提取账单，0 权限直接批准养老金电汇、修改受益人或免除 14 天冷却期</text>
    <text x="34" y="282" class="mono" font-size="12" fill="#e9d5ff">选型定位：满足 Fidelity NetBenefits、Empower、Alight、DOL ERISA §404 与 IRS 401(k)</text>

    <rect x="20" y="300" width="610" height="74" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="324" class="title" font-size="15" fill="#6ee7b7">4. 🛡️ 必选底线：确定性零信任能力网关 (Capability Broker · 养老金门禁)</text>
    <text x="34" y="346" class="body-txt" font-size="13">• 高管 NQDC 隔离 (record-owner) + 禁批越权提取 (untrusted-write) + 年金保险机构锁</text>
    <text x="34" y="364" class="mono" font-size="12" fill="#34d399">实测性能：P50 = 0.0248 ms 内存裁决 | 692 个场景 · 1,450 项 Pytest 确定性断言 100% 通过</text>
  </g>

  <!-- Right Card -->
  <g transform="translate(722, 166)">
    <rect width="670" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#f87171">🔥 伪造 QDRO / 困难提取注入盗领养老金与 PRT 年金买断诈骗 vs. 零信任</text>

    <rect x="20" y="56" width="630" height="142" rx="10" fill="#2a0a10" stroke="#ef4444" stroke-width="1.5"/>
    <text x="36" y="82" class="title" font-size="15" fill="#fca5a5">❌ 脆弱架构：TPA Agent 直通高管 NQDC 与养老金提取放行 (BRK-673 / BRK-674)</text>
    <text x="36" y="108" class="body-txt" font-size="13">1. [伪造法院 QDRO 分割令/困难提取 PDF 注入套取高管 NQDC 与转空 401k] 诱导读取</text>
    <text x="36" y="130" class="body-txt" font-size="13">   高管 Rabbi Trust 与养老金买断底表 (restricted-budget)、跳过配偶公证批准全额提取！</text>
    <text x="36" y="154" class="body-txt" font-size="13">2. [伪造寿险巨头“企业养老金风险转移 (PRT) 团体年金买断保费托管变更函”] 盗刷 $4,980</text>
    <text x="36" y="180" class="mono" font-size="12" fill="#f87171">Baseline 结果：高管递延薪酬泄露 + 员工终生 401(k) 被盗触发 ERISA 赔偿 + $4,980 被盗</text>

    <rect x="20" y="214" width="630" height="158" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.8"/>
    <text x="36" y="240" class="title" font-size="15" fill="#6ee7b7">✅ 零信任企业退休金与福利管理架构：NQDC 气隙 + ERISA 硬锁 + Broker</text>
    <text x="36" y="266" class="body-txt" font-size="13">• 闸门 1 (高管 NQDC/SERP 与 PRT 精算底表锁)：record-owner 0.0248ms 阻断读取</text>
    <text x="36" y="290" class="body-txt" font-size="13">• 闸门 2 (防篡改 401k 提取审批与配偶公证锁)：untrusted-write 阻断修改 business-result</text>
    <text x="36" y="314" class="body-txt" font-size="13">• 闸门 3 (备案养老金信托保管行与 PRT 寿险公司只读锁)：fixed-business-output 锁死</text>
    <text x="36" y="338" class="body-txt" font-size="13">• 闸门 4 (薪酬底表外发与年金保费电汇门禁)：restricted-data-boundary 与零代付</text>
    <text x="36" y="358" class="mono" font-size="12" fill="#34d399">Hardened 结果：合成夹具 ASR 75.0% → 0.0% | 合规本人年度 401(k) 雇主匹配比例查询 100.0% 通过</text>
  </g>

  <!-- Bottom Card -->
  <g transform="translate(48, 580)">
    <rect width="1344" height="276" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#34d399">📊 确定性基准测试 (1,450 断言 &amp; 150 篇双语选型指南里程碑！) 与 Checklist</text>

    <rect x="24" y="56" width="630" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="40" y="82" class="mono" font-size="14" fill="#38bdf8">🧪 Round 332 新增 Pytest 回归测试 (1,450 断言 &amp; 150 篇双语指南里程碑！)</text>
    <text x="40" y="110" class="body-txt" font-size="13">• BRK-673 (困难提取/QDRO 注入窃取高管 NQDC 薪酬底表与越权放行 401k 全额转出)：</text>
    <text x="56" y="130" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="record-owner" &amp; "untrusted-write" &amp; "restricted-data-boundary"</text>
    <text x="40" y="158" class="body-txt" font-size="13">• BRK-674 (伪造养老金风险转移 PRT 团体年金买断通知篡改名录与 $4,980 盗刷)：</text>
    <text x="56" y="178" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="fixed-business-output" &amp; "original-requester-payment"</text>
    <text x="40" y="208" class="mono" font-size="12" fill="#94a3b8">[measured] 内存评估 P50=0.0248ms / P95=0.0409ms | SQLite WAL P50=7.21ms</text>
    <text x="40" y="232" class="mono" font-size="12" fill="#38bdf8">[synthetic] 累计 692 个场景 · 1,450 项 Pytest 断言 · 678 大演练向量 · 150 篇双语指南</text>

    <rect x="680" y="56" width="640" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="698" y="82" class="mono" font-size="14" fill="#a78bfa">🛠️ 企业退休金 (401k TPA)、ERISA 受托管理与年金买断 AI 6 项铁律 (Checklist)</text>
    <text x="698" y="108" class="body-txt" font-size="13">☑ 1. 高管非合格递延薪酬 (SERP/NQDC) 与 PRT 精算底表物理气隙：record-owner</text>
    <text x="698" y="132" class="body-txt" font-size="13">☑ 2. 401(k) 困难提取、IRA 转滚与 QDRO 分割放行只读硬锁：untrusted-write</text>
    <text x="698" y="156" class="body-txt" font-size="13">☑ 3. 新银行账户变更 14 天强制冷却锁定期与配偶公证签名 (Spousal Consent) 核验</text>
    <text x="698" y="180" class="body-txt" font-size="13">☑ 4. 外部上传的医疗/房贷困难证明与法院 QDRO 令强制污点化：taint="untrusted"</text>
    <text x="698" y="204" class="body-txt" font-size="13">☑ 5. 备案养老金信托托管行与 PRT 寿险承保机构账户只读锁定：锁死 trust-registry</text>
    <text x="698" y="228" class="body-txt" font-size="13">☑ 6. 养老金风险转移 (PRT) 保费交割与大额福利电汇硬门禁：Capability Broker 阻断</text>
  </g>
</svg>
