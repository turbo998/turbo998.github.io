  <text x="834" y="358" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 1. 罐壁 ≥960°C (2oo3) &lt;300ms 硬切 TiCl4 并强开风冷</text>
