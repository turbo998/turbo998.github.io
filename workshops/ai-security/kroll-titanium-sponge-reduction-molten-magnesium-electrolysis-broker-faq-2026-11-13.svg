  <text x="834" y="446" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 5. 无镍纯铁内衬复合还原罐名录只读锁定与零镍 PMI 门禁</text>
