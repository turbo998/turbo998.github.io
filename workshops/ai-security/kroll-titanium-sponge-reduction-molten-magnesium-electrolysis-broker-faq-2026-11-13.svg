  <text x="66" y="484" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">✕ 航空转动件 0A 级超软海绵钛 (HB&lt;90) 还蒸控温曲线外泄</text>
  <text x="66" y="502" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">✕ $4,990 伪造含镍易共晶熔穿反应罐与石墨阳极预付款放行</text>

