  <text x="334" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18.5" font-weight="800" fill="#f8fafc">10万吨级克劳尔法海绵钛还蒸联合炉防 1085°C 铁钛共晶烧穿漏罐与破空钛火网关选型</text>
