  <text x="446" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 罐壁温度 ≥960°C 或罐压 &gt;50kPa (2oo3)：&lt;300ms 硬件切断</text>
  <text x="446" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">  TiCl4 双切断阀并强制满开炉壳风冷鼓风机，死守 &lt;1050°C</text>
  <text x="446" y="256" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• 蒸馏罐温 &gt;150°C 时机械电磁销锁死大气破空阀，仅准许</text>
