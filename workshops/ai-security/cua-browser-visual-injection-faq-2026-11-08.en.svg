<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="badGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F1D1D" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#450A0A" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="36" y="24" width="1128" height="86" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="54" y="40" width="236" height="24" rx="12" fill="#451A03" stroke="#F59E0B" stroke-width="1"/>
  <text x="172" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">ROUND 6 · CUA / BROWSER AGENT SECURITY</text>
  <text x="306" y="57" font-family="Segoe UI, system-ui, sans-serif" font-size="19.5" font-weight="800" fill="#F8FAFC">CUA Visual Prompt Injection, DOM Cloaking &amp; Cross-Origin Gate Selection</text>
  <text x="54" y="91" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#94A3B8">Golden Rule: Never share employee SSO profiles with external Browser Agents · Enforce Geometric DOM Pruning + Dual-Agent Split + Server Broker PEP</text>

  <!-- Left Card: Shared Browser Session Vulnerability -->
  <rect x="36" y="126" width="550" height="270" rx="14" fill="url(#badGrad)" stroke="#EF4444" stroke-width="1.5"/>
  <text x="58" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="15.5" font-weight="800" fill="#FCA5A5">❌ Shared Browser Profile / Unfiltered AXTree or VLM (Baseline Breach)</text>

  <rect x="56" y="172" width="510" height="62" rx="10" fill="#1E293B" fill-opacity="0.88" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="194" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FECACA">1. DOM Zero-Font Cloaking (BRK-21 / CUA-DOM-CLOAK-25)</text>
  <text x="72" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#E2E8F0">External vendor portal embeds opacity:0.001 / font-size:0 / aria-label payload;</text>
  <text x="72" y="229" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#FCA5A5">invisible to humans, yet CUA reads AXTree, switches tabs &amp; leaks restricted-budget</text>

  <rect x="56" y="244" width="510" height="62" rx="10" fill="#1E293B" fill-opacity="0.88" stroke="#F87171" stroke-width="1"/>
  <text x="72" y="266" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FECACA">2. Visual Prompt Injection &amp; Modal Spoofing (BRK-22 / CUA-CROSS-ORIGIN-26)</text>
  <text x="72" y="286" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#E2E8F0">Webpage canvas renders fake "Finance Verification Modal", coercing VLM to tamper</text>
  <text x="72" y="301" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#FCA5A5">with business-result and trigger $850 request_payment on behalf of supplier</text>

  <rect x="56" y="316" width="510" height="64" rx="10" fill="#450A0A" stroke="#EF4444" stroke-width="1"/>
  <text x="72" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FCA5A5">Why Browser Same-Origin Policy (SOP) Cannot Stop a Hijacked CUA:</text>
  <text x="72" y="357" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#FECACA">• SOP restricts page JS, but CUA runs at CDP/OS privilege across all authenticated tabs!</text>
  <text x="72" y="373" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#FECACA">• Unprotected Baseline Attack Success Rate: ASR = 75.0% [synthetic, 40-scenario suite]</text>

  <!-- Right Card: Zero-Trust CUA Quarantine + Deterministic Broker -->
  <rect x="614" y="126" width="550" height="270" rx="14" fill="url(#goodGrad)" stroke="#10B981" stroke-width="1.5"/>
  <text x="636" y="156" font-family="Segoe UI, system-ui, sans-serif" font-size="15.5" font-weight="800" fill="#6EE7B7">✅ Zero-Cookie Sandbox + Geometric Pruning + Deterministic Broker</text>

  <rect x="634" y="172" width="510" height="62" rx="10" fill="#0F172A" fill-opacity="0.9" stroke="#34D399" stroke-width="1"/>
  <text x="650" y="194" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0">Defense 1: Zero-Cookie Ephemeral Container + Geometric DOM Pruning</text>
  <text x="650" y="214" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#E2E8F0">External pages open with zero enterprise cookies; strips opacity&lt;0.1, font-size&lt;6px,</text>
  <text x="650" y="229" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#6EE7B7">off-viewport &amp; low-contrast DOM; Quarantined Reader emits strict scalar/enum JSON</text>

  <rect x="634" y="244" width="510" height="62" rx="10" fill="#0F172A" fill-opacity="0.9" stroke="#34D399" stroke-width="1"/>
  <text x="650" y="266" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0">Defense 2: Cross-Origin Taint Lock (restricted-data-boundary &amp; untrusted-write)</text>
  <text x="650" y="286" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#E2E8F0">Even if VLM OCR is tricked by fake modals, Server Broker blocks tainted writes,</text>
  <text x="650" y="301" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#6EE7B7">blocks restricted egress to external targets &amp; blocks requester!=finance payouts (0.0% ASR)</text>

  <rect x="634" y="316" width="510" height="64" rx="10" fill="#022C22" stroke="#10B981" stroke-width="1"/>
  <text x="650" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#6EE7B7">Defense 3: Out-of-Band 5-Tuple Action-Hash + Reproducible Microsecond Gate</text>
  <text x="650" y="357" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#A7F3D0">• In-memory digest + Broker.evaluate (n=200 full raw): P50 = 0.0248 ms / P95 = 0.0409 ms [measured]</text>
  <text x="650" y="373" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#A7F3D0">• 1-Step SQLite WAL receipt commit (n=50 full raw): P50 = 7.21 ms / P95 = 8.19 ms [measured]</text>

  <!-- Bottom Decision Matrix & Provenance Table -->
  <rect x="36" y="412" width="1128" height="238" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="36" y="412" width="1128" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="58" y="442" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="800" fill="#F8FAFC">🧭 CUA / Browser-Use 4-Tier Architecture Matrix &amp; Full-Array Measured Latency Benchmarks (40 Scenarios / 146 Assertions)</text>

  <!-- Table Header -->
  <rect x="54" y="456" width="1092" height="30" rx="6" fill="#1E293B"/>
  <text x="70" y="476" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Architecture Tier / Scope</text>
  <text x="370" y="476" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Target Boundary &amp; Enforcement Mechanism</text>
  <text x="730" y="476" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Security Outcome / Measured Latency</text>
  <text x="985" y="476" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Provenance Class</text>

  <!-- Row 1 -->
  <rect x="54" y="492" width="1092" height="32" rx="6" fill="#1E293B" fill-opacity="0.45"/>
  <text x="70" y="512" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FCA5A5">Option A: Shared Employee Chrome Profile</text>
  <text x="370" y="512" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">Reuses SSO cookies across external &amp; internal tabs (Never use externally)</text>
  <text x="730" y="512" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#F87171">BRK-21 / BRK-22 Breached (ASR 75.0%)</text>
  <text x="985" y="512" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#FBBF24">synthetic (40-scenario)</text>

  <!-- Row 2 -->
  <rect x="54" y="528" width="1092" height="32" rx="6" fill="#1E293B" fill-opacity="0.75"/>
  <text x="70" y="548" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A">Option B/C: Ephemeral + DOM Sanitizer</text>
  <text x="370" y="548" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">Geometric hidden-DOM stripping + Quarantined scalar/enum JSON schema</text>
  <text x="730" y="548" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#FDE68A">Stops DOM cloaking &amp; free-text prompt propagation</text>
  <text x="985" y="548" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#93C5FD">architecture pattern</text>

  <!-- Row 3 -->
  <rect x="54" y="564" width="1092" height="32" rx="6" fill="#064E3B" fill-opacity="0.55" stroke="#10B981" stroke-width="0.8"/>
  <text x="70" y="584" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7">Option D (Tier 1): In-Memory Policy Gate</text>
  <text x="370" y="584" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">digest() + Broker.evaluate taint/delegation gate (n=200/200 full raw array)</text>
  <text x="730" y="584" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#34D399">P50 = 0.0248 ms / P95 = 0.0409 ms (0.0% ASR)</text>
  <text x="985" y="584" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34D399">measured (n=200 full raw)</text>

  <!-- Row 4 -->
  <rect x="54" y="600" width="1092" height="32" rx="6" fill="#064E3B" fill-opacity="0.35"/>
  <text x="70" y="620" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7">Option D (Tier 2-4): SQLite WAL Receipt</text>
  <text x="370" y="620" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#E2E8F0">1-Step (n=50) / 3-Hop A2A (n=30) / 5-Step Chain (n=20) WAL commits</text>
  <text x="730" y="620" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#34D399">P50: 7.21 ms (1-step) / 35.41 ms (3-hop) / 55.21 ms (5-step)</text>
  <text x="985" y="620" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34D399">measured (full raw sealed)</text>
</svg>
