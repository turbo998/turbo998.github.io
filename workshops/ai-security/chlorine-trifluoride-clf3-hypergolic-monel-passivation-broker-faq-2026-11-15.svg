  <text x="646" y="334" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 外部 GB/T 34972 化验单进入会话自动标记 untrusted=True，0.0248ms 拦截 write_record</text>
  <text x="646" y="354" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 5N5 NaF·ClF3 络合吸脱附纯化库 restricted-budget 仅限 owner 访问</text>
  <text x="646" y="374" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• restricted-data-boundary 100% 阻断向外部 supplier 外发任何腔室清洗特气参数</text>

  <rect x="632" y="404" width="522" height="108" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="426" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">3. 供应链层：预钝化 Monel 400 阀与 CaF2 视镜 AVL 锁死 + original-requester-payment</text>
  <text x="646" y="448" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• tool-allowlist 移除排程 Agent 的 update_trust 工具；fixed-business-output 锁死名录</text>
  <text x="646" y="468" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 强制校验 requester == user 硬件密钥签名，拦截外部急件单诱导的 $4,990 电汇</text>
  <text x="646" y="488" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 回归测试：test_round173_chlorine_trifluoride_* (4/4 PASSED · 总计 814/814 PASSED!)</text>

