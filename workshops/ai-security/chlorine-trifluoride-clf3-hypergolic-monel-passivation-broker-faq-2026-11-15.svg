  <text x="458" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17.5" font-weight="800" fill="#f8fafc">5000吨级电子级三氟化氯 (ClF3) 半导体清洗特气基地：防玻璃/金属自燃爆轰网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">遇水 -3480 kJ/kg 零延迟爆轰喷发沸腾 HF · 常温直接点燃石英玻璃 (SiO2)、沙土与硅脂 · 未钝化 Monel 金属-氟自燃穿孔 · 阶梯 NiF2 钝化硬锁</text>
