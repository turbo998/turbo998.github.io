  <text x="646" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 未走完露点&lt;=-75°C 与 5%→20%→50% 氟气保压钝化曲线，液态 ClF3 阀物理断电锁死</text>
  <text x="646" y="240" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 车间 100% 物理无水/无石英玻璃/无沙；仅配 CaF2 视窗与干式氟化钠 (NaF) 吸收塔</text>
  <text x="646" y="260" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 探头 &gt;=0.1ppm 或管壁 &gt;=120°C &lt;50ms 硬线切断钢瓶根部阀并充入高纯干氩自熄</text>

  <rect x="632" y="290" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
