<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#041f1c"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
      .card-hdr { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; fill: #38bdf8; }
      .body-txt { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #e2e8f0; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1440" height="6" fill="url(#accentBlue)"/>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="510" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="21" class="mono" font-size="13" fill="#6ee7b7">🏆 690 场景里程碑 · Round 331 · 1,446 断言 · BRK-671/672</text>
    <rect x="525" y="0" width="645" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="543" y="21" class="mono" font-size="13" fill="#c7d2fe">GLOBAL TRADE GTM (SAP GTS/ORACLE) · BIS ECCN &amp; OFAC 50% · CUSTOMS DUTY</text>

    <text x="0" y="74" class="title" font-size="28">全球贸易合规（SAP GTS / Oracle GTM）、出口管制与报关关税 AI 指南</text>
    <text x="0" y="106" class="sub" font-size="16">未公开合规主动披露调查 (BIS VSD) 与 BOM 成本气隙 + ECCN 归类与制裁拦截硬锁 vs. 发票注入与能力网关</text>
  </g>

  <!-- Left Card -->
  <g transform="translate(48, 166)">
    <rect width="650" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19">⚖️ 全球贸易管理 (GTM)、ECCN/HTS 归类与 OFAC 制裁筛查 AI 对比</text>

    <rect x="20" y="54" width="610" height="72" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
    <text x="34" y="78" class="title" font-size="15" fill="#fca5a5">1. ❌ 报关归类 Agent 直通合规自查底稿与 SAP GTS 禁运放行开关</text>
    <text x="34" y="100" class="body-txt" font-size="13">• 海外分销商上传的商业发票/装箱单 PDF 植入指令，套出企业未公开向监管提交的主动披露 (VSD) 底稿</text>
    <text x="34" y="118" class="mono" font-size="12" fill="#fca5a5">BIS/OFAC 天价刑事重罚：诱导将受控物项 ECCN 降级为 EAR99 并解除实体清单 (Entity List) 锁定</text>

    <rect x="20" y="136" width="610" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="160" class="title" font-size="15" fill="#7dd3fc">2. 🔒 出口违规主动披露案卷 (BIS/OFAC VSD) 与区域价值成分 BOM 气隙</text>
    <text x="34" y="182" class="body-txt" font-size="13">• 面向物流报关开放的单证解析 AI 0 权限读取法务出口管制内部调查报告与原产地 BOM 成本明细</text>
    <text x="34" y="200" class="mono" font-size="12" fill="#93c5fd">防监管泄密与商业间谍：物理阻断外部报关会话触碰 restricted-budget 合规底表</text>

    <rect x="20" y="218" width="610" height="72" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="34" y="242" class="title" font-size="15" fill="#d8b4fe">3. 📜 ECCN/HTS 编码主数据与 OFAC 50% 股权穿透冻结指令硬锁</text>
    <text x="34" y="264" class="body-txt" font-size="13">• AI 仅输出商品归类候选编码建议，0 权限直接修改 GTS 主数据或解封命中 SDN/实体清单的被锁订单</text>
    <text x="34" y="282" class="mono" font-size="12" fill="#e9d5ff">选型定位：满足 SAP GTS、Oracle GTM、Descartes、BIS EAR、OFAC 50% Rule 与 CBP 合规</text>

    <rect x="20" y="300" width="610" height="74" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="324" class="title" font-size="15" fill="#6ee7b7">4. 🛡️ 必选底线：确定性零信任能力网关 (Capability Broker · 全球贸易门禁)</text>
    <text x="34" y="346" class="body-txt" font-size="13">• VSD 与 BOM 隔离 (record-owner) + 禁降级 ECCN/解封制裁 (untrusted-write) + 海关账户锁</text>
    <text x="34" y="364" class="mono" font-size="12" fill="#34d399">实测性能：P50 = 0.0248 ms 内存裁决 | 690 个场景 · 1,446 项 Pytest 确定性断言 100% 通过</text>
  </g>

  <!-- Right Card -->
  <g transform="translate(722, 166)">
    <rect width="670" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#f87171">🔥 商业发票注入降级 ECCN 走私与伪造报关行关税诈骗 vs. 零信任</text>

    <rect x="20" y="56" width="630" height="142" rx="10" fill="#2a0a10" stroke="#ef4444" stroke-width="1.5"/>
    <text x="36" y="82" class="title" font-size="15" fill="#fca5a5">❌ 脆弱架构：GTM Agent 直通制裁解封与关税代缴账户 (BRK-671 / BRK-672)</text>
    <text x="36" y="108" class="body-txt" font-size="13">1. [商业发票/最终用户声明 EUS 注入套取 VSD 底表与降级 ECCN] 诱导读取未公开</text>
    <text x="36" y="130" class="body-txt" font-size="13">   BIS 主动披露调查与原产地 BOM (restricted-budget)、将受控品改为 EAR99 并放行！</text>
    <text x="36" y="154" class="body-txt" font-size="13">2. [伪造口岸报关行“301 惩罚性关税保证金补缴与出口退税 (Duty Drawback) 变更函”] 盗刷 $4,940</text>
    <text x="36" y="180" class="mono" font-size="12" fill="#f87171">Baseline 结果：主动披露案卷外泄 + 违反出口管制非法发货 + $4,940 海关关税资金被盗</text>

    <rect x="20" y="214" width="630" height="158" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.8"/>
    <text x="36" y="240" class="title" font-size="15" fill="#6ee7b7">✅ 零信任全球贸易合规 (GTM) 架构：VSD 气隙 + 制裁硬锁 + Broker</text>
    <text x="36" y="266" class="body-txt" font-size="13">• 闸门 1 (出口违规主动披露 VSD 与原产地 BOM 锁)：record-owner 0.0248ms 阻断读取</text>
    <text x="36" y="290" class="body-txt" font-size="13">• 闸门 2 (防篡改 ECCN 编码与解除 SDN 制裁冻结)：untrusted-write 阻断修改状态</text>
    <text x="36" y="314" class="body-txt" font-size="13">• 闸门 3 (备案海关总署/CBP 税款直扣与报关行账户只读锁)：fixed-business-output 锁死</text>
    <text x="36" y="338" class="body-txt" font-size="13">• 闸门 4 (合规底稿外发与关税保证金划款锁)：restricted-data-boundary 与零代付门禁</text>
    <text x="36" y="358" class="mono" font-size="12" fill="#34d399">Hardened 结果：合成夹具 ASR 75.0% → 0.0% | 合规公开协调制度 6 位 HS 编码检索 100.0% 通过</text>
  </g>

  <!-- Bottom Card -->
  <g transform="translate(48, 580)">
    <rect width="1344" height="276" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#34d399">📊 确定性基准测试 (690 场景里程碑 · 1,446 断言) 与上线安全评审 Checklist</text>

    <rect x="24" y="56" width="630" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="40" y="82" class="mono" font-size="14" fill="#38bdf8">🧪 Round 331 新增 Pytest 回归测试 (690 个企业红蓝对抗场景里程碑！)</text>
    <text x="40" y="110" class="body-txt" font-size="13">• BRK-671 (商业发票注入窃取 BIS 主动披露底表与将 ECCN 降级为 EAR99 绕过禁运)：</text>
    <text x="56" y="130" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="record-owner" &amp; "untrusted-write" &amp; "restricted-data-boundary"</text>
    <text x="40" y="158" class="body-txt" font-size="13">• BRK-672 (伪造报关行海关关税补缴 CBP Duty 变更通知篡改名录与 $4,940 盗刷)：</text>
    <text x="56" y="178" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="fixed-business-output" &amp; "original-requester-payment"</text>
    <text x="40" y="208" class="mono" font-size="12" fill="#94a3b8">[measured] 内存评估 P50=0.0248ms / P95=0.0409ms | SQLite WAL P50=7.21ms</text>
    <text x="40" y="232" class="mono" font-size="12" fill="#38bdf8">[synthetic] 累计 690 个场景 · 1,446 项 Pytest 断言 · 676 大演练向量 · 331 篇双语 FAQ</text>

    <rect x="680" y="56" width="640" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="698" y="82" class="mono" font-size="14" fill="#a78bfa">🛠️ 全球贸易合规 (SAP GTS/Oracle GTM) 与海关关税 AI 6 项铁律 (Checklist)</text>
    <text x="698" y="108" class="body-txt" font-size="13">☑ 1. 出口违规主动披露调查 (BIS/OFAC VSD) 与原产地 BOM 物理气隙：record-owner</text>
    <text x="698" y="132" class="body-txt" font-size="13">☑ 2. 物项 ECCN/HTS 编码主数据与制裁冻结放行只读硬锁：untrusted-write</text>
    <text x="698" y="156" class="body-txt" font-size="13">☑ 3. OFAC 50% 股权穿透与实体清单 (CSL) 确定性图数据库硬筛查</text>
    <text x="698" y="180" class="body-txt" font-size="13">☑ 4. 外部买方最终用户声明 (EUS) 与货运商业发票强制污点化：taint="untrusted"</text>
    <text x="698" y="204" class="body-txt" font-size="13">☑ 5. 备案海关税款官方直扣账户 (CBP PMS / 单一窗口) 只读锁定：锁死 trust-registry</text>
    <text x="698" y="228" class="body-txt" font-size="13">☑ 6. 严禁向第三方私人账户代付进口关税与反倾销保证金：Capability Broker 阻断</text>
  </g>
