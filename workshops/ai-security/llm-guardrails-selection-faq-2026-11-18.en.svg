  <text x="64" y="226" fill="#fca5a5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">1. Business-Prose Indirect RAG Injection (6.5%–35.7% Residual ASR)</text>
  <text x="64" y="248" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Vendor contracts/resumes embed polite accounting instructions with zero jailbreak slang</text>
