  <rect x="632" y="176" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">1. 物理层：亲核脱 PFIB 零旁路 + 在线 PFIB&lt;=10ppb 硬锁 + 再沸器 &lt;=65°C</text>
  <text x="646" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 物理焊死亲核脱 PFIB 床旁路；在线 GC-MS/ECD 检出 PFIB&gt;=10ppb &lt;100ms 切回破毒釜</text>
  <text x="646" y="240" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 再沸器采用 &lt;=65°C 温水物理封顶；进塔 O2&gt;=2.0ppm &lt;50ms 停料充氮防过氧化物</text>
  <text x="646" y="260" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 储罐与钢瓶 TBC/萜烯阻聚剂浓度在线紫外硬联锁，严防自聚堵阀</text>

  <rect x="632" y="290" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="312" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">2. 控制层：untrusted-write 污点阻断 + record-owner 气隙配方隔离</text>
  <text x="646" y="334" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 外部 HG/T 5812 化验单进入会话自动标记 untrusted=True，0.0248ms 拦截 write_record</text>
  <text x="646" y="354" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 5N5 C4F6 萃取精馏与亲核脱 PFIB 配方库 restricted-budget 仅限 owner 访问</text>
  <text x="646" y="374" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• restricted-data-boundary 100% 阻断向外部 supplier 外发任何 HAR 刻蚀特气参数</text>

  <rect x="632" y="404" width="522" height="108" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="426" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">3. 供应链层：无氧萃取剂与活性脱 PFIB 柱 AVL 锁死 + original-requester-payment</text>
  <text x="646" y="448" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• tool-allowlist 移除排程 Agent 的 update_trust 工具；fixed-business-output 锁死名录</text>
  <text x="646" y="468" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 强制校验 requester == user 硬件密钥签名，拦截外部急件单诱导的 $4,990 电汇</text>
  <text x="646" y="488" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 回归测试：test_round181_hexafluorobutadiene_* (4/4 PASSED · 总计 846/846 PASSED!)</text>

