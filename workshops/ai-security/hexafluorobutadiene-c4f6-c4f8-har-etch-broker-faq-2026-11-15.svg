  <text x="234" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="800" fill="#090d16" text-anchor="middle">🏆 ROUND 181 · 390 大场景里程碑 × 846 项断言</text>
  <text x="438" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17.5" font-weight="800" fill="#f8fafc">1.5万吨级 5N5 六氟丁二烯 (C4F6) 与 c-C4F8 3D NAND 高深宽比刻蚀特气：防爆聚与 PFIB 网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">C4F6 遇痕量氧生成过氧化聚物 &gt;110°C 绝热爆聚炸塔 (-1380 kJ/kg) · 副产十倍光气剧毒全氟异丁烯 (PFIB 沸点 7°C) 1°C 共沸 · PFIB&lt;=10ppb 闭锁</text>
  <text x="44" y="100" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">181 篇双语 FAQ · 390 个合成夹具场景 (BRK-371 / BRK-372) · 376 个演练向量 · 846/846 Pytest 100% 通过 · P50=0.0248ms</text>

  <!-- Left Column: Red Team Attack & Physical Kill Chain -->
  <rect x="28" y="124" width="558" height="404" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.8"/>
