<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#041f1c"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
      .card-hdr { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; fill: #38bdf8; }
      .body-txt { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #e2e8f0; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1440" height="6" fill="url(#accentBlue)"/>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="530" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="21" class="mono" font-size="13" fill="#6ee7b7">🏆 335 篇双语 FAQ &amp; BRK-680 &amp; 1,462 断言三重里程碑 · 698 场景</text>
    <rect x="545" y="0" width="625" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="563" y="21" class="mono" font-size="13" fill="#c7d2fe">PRIMARY DEALER TREASURY AUCTION (TAAPS/FEDWIRE) · FICC CLEARED REPO</text>

    <text x="0" y="74" class="title" font-size="28">主权国债一级交易商（TAAPS 拍卖招标）与三方回购清算 AI 安全指南</text>
    <text x="0" y="106" class="sub" font-size="16">客户间接投标簿 (Indirect Bid Book) 物理气隙 + 国债拍卖招标与回购折扣率硬锁 vs. 研报注入与能力网关</text>
  </g>

  <!-- Left Card -->
  <g transform="translate(48, 166)">
    <rect width="650" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19">⚖️ 主权国债一级交易商 (Primary Dealer)、国债拍卖与三方回购 AI 对比</text>

    <rect x="20" y="54" width="610" height="72" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
    <text x="34" y="78" class="title" font-size="15" fill="#fca5a5">1. ❌ 固收交易台 Agent 直通国债拍卖客户投标簿与 TAAPS 报单接口</text>
    <text x="34" y="100" class="body-txt" font-size="13">• 外部宏观研报或机构询价单植入指令，套出各国央行与主权基金委托一级交易商代投的国债标位</text>
    <text x="34" y="118" class="mono" font-size="12" fill="#fca5a5">财政部与纽约联储重罚：泄露拍卖非公开订单流 (Pre-Auction Order Flow) 或诱导错报百亿乌龙指</text>

    <rect x="20" y="136" width="610" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="160" class="title" font-size="15" fill="#7dd3fc">2. 🔒 国债拍卖客户间接投标簿 (Indirect Bidder Book) 与自营头寸气隙</text>
    <text x="34" y="182" class="body-txt" font-size="13">• 面向宏观投研或做市报价开放的 AI 0 权限读取拍卖截标前客户委托投标量价分布与一级交易商底仓</text>
    <text x="34" y="200" class="mono" font-size="12" fill="#93c5fd">遵循财政部 Uniform Offering Circular (31 CFR 356) 信息墙：阻断触碰 restricted-budget</text>

    <rect x="20" y="218" width="610" height="72" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="34" y="242" class="title" font-size="15" fill="#d8b4fe">3. 📜 TAAPS 国债投标提交与三方回购抵押品折扣率 (Haircut) 硬锁</text>
    <text x="34" y="264" class="body-txt" font-size="13">• AI 仅辅助测算收益率曲线利差，0 权限直接向 TAAPS 申报国债标位或调降 FICC 回购抵押率</text>
    <text x="34" y="282" class="mono" font-size="12" fill="#e9d5ff">选型定位：满足纽约联储一级交易商、TreasuryDirect TAAPS、DTCC FICC Sponsored Repo 与 BNY</text>

    <rect x="20" y="300" width="610" height="74" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="324" class="title" font-size="15" fill="#6ee7b7">4. 🛡️ 必选底线：确定性零信任能力网关 (Capability Broker · 国债与回购门禁)</text>
    <text x="34" y="346" class="body-txt" font-size="13">• 拍卖投标簿隔离 (record-owner) + 禁改 TAAPS/回购折扣 (untrusted-write) + 托管行锁</text>
    <text x="34" y="364" class="mono" font-size="12" fill="#34d399">实测性能：P50 = 0.0248 ms 内存裁决 | 698 个场景 · 1,462 项 Pytest 确定性断言 100% 通过</text>
  </g>

  <!-- Right Card -->
  <g transform="translate(722, 166)">
    <rect width="670" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#f87171">🔥 宏观研报注入套取国债拍卖投标簿与伪造 FICC 回购追保诈骗 vs. 零信任</text>

    <rect x="20" y="56" width="630" height="142" rx="10" fill="#2a0a10" stroke="#ef4444" stroke-width="1.5"/>
    <text x="36" y="82" class="title" font-size="15" fill="#fca5a5">❌ 脆弱架构：固收 Agent 直通 TAAPS 投标簿与回购清算 (BRK-679 / BRK-680)</text>
    <text x="36" y="108" class="body-txt" font-size="13">1. [外部宏观利率研报 PDF 注入套取 10 年期国债拍卖客户投标簿与篡改标位] 诱导读取</text>
    <text x="36" y="130" class="body-txt" font-size="13">   间接投标客户量价分布 (restricted-budget)、将回购折扣率改为 0% 并外传投标底牌！</text>
    <text x="36" y="154" class="body-txt" font-size="13">2. [伪造 DTCC FICC / 纽约梅隆三方回购“日间担保品差额追加保证金专户变更函”] 盗刷 $5,000</text>
    <text x="36" y="180" class="mono" font-size="12" fill="#f87171">Baseline 结果：国债拍卖客户标位泄露被取消一级交易商资格 + 回购爆仓 + $5,000 被盗</text>

    <rect x="20" y="214" width="630" height="158" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.8"/>
    <text x="36" y="240" class="title" font-size="15" fill="#6ee7b7">✅ 零信任主权国债一级交易商与三方回购架构：投标簿气隙 + 硬锁 + Broker</text>
    <text x="36" y="266" class="body-txt" font-size="13">• 闸门 1 (国债拍卖客户间接投标簿与自营头寸锁)：record-owner 0.0248ms 阻断读取</text>
    <text x="36" y="290" class="body-txt" font-size="13">• 闸门 2 (防篡改 TAAPS 投标标位与回购折扣率 Haircut)：untrusted-write 阻断修改</text>
    <text x="36" y="314" class="body-txt" font-size="13">• 闸门 3 (备案 Fedwire / FICC 清算银行与三方托管专户只读锁)：fixed-business-output</text>
    <text x="36" y="338" class="body-txt" font-size="13">• 闸门 4 (投标底表外发与回购保证金划款锁)：restricted-data-boundary 与零代付</text>
    <text x="36" y="358" class="mono" font-size="12" fill="#34d399">Hardened 结果：合成夹具 ASR 75.0% → 0.0% | 合规已公布历史国债拍卖中标收益率查询 100.0% 通过</text>
  </g>

  <!-- Bottom Card -->
  <g transform="translate(48, 580)">
    <rect width="1344" height="276" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#34d399">📊 确定性基准测试 (335 篇 FAQ &amp; BRK-680 &amp; 1,462 断言里程碑！) 与 Checklist</text>

    <rect x="24" y="56" width="630" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="40" y="82" class="mono" font-size="14" fill="#38bdf8">🧪 Round 335 新增 Pytest 回归测试 (335-FAQ &amp; BRK-680 旗舰里程碑！)</text>
    <text x="40" y="110" class="body-txt" font-size="13">• BRK-679 (宏观研报注入窃取国债拍卖客户间接投标簿与篡改 TAAPS 投标/回购折扣)：</text>
    <text x="56" y="130" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="record-owner" &amp; "untrusted-write" &amp; "restricted-data-boundary"</text>
    <text x="40" y="158" class="body-txt" font-size="13">• BRK-680 (伪造 DTCC FICC 三方回购清算追保通知篡改名录与 $5,000 盗刷)：</text>
    <text x="56" y="178" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="fixed-business-output" &amp; "original-requester-payment"</text>
    <text x="40" y="208" class="mono" font-size="12" fill="#94a3b8">[measured] 内存评估 P50=0.0248ms / P95=0.0409ms | SQLite WAL P50=7.21ms</text>
    <text x="40" y="232" class="mono" font-size="12" fill="#38bdf8">[synthetic] 累计 698 个场景 · 1,462 项 Pytest 断言 · 684 大演练向量 · 335 篇双语 FAQ</text>

    <rect x="680" y="56" width="640" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="698" y="82" class="mono" font-size="14" fill="#a78bfa">🛠️ 主权国债一级交易商 (Primary Dealer) 与三方回购 AI 6 项铁律 (Checklist)</text>
    <text x="698" y="108" class="body-txt" font-size="13">☑ 1. 国债拍卖截标前客户间接投标簿 (Indirect Bid Book) 物理气隙：record-owner</text>
    <text x="698" y="132" class="body-txt" font-size="13">☑ 2. TAAPS 拍卖投标申报与三方回购抵押折扣率 (Haircut) 只读硬锁：untrusted-write</text>
    <text x="698" y="156" class="body-txt" font-size="13">☑ 3. 31 CFR Part 356 国债拍卖防逼空 (35% 单一买家上限) 确定性盘前校验</text>
    <text x="698" y="180" class="body-txt" font-size="13">☑ 4. 外部宏观研报、经济日历与彭博聊天消息强制污点化：taint="untrusted"</text>
    <text x="698" y="204" class="body-txt" font-size="13">☑ 5. 备案 Fedwire Securities 与 DTCC FICC 清算专户只读锁定：锁死 trust-registry</text>
    <text x="698" y="228" class="body-txt" font-size="13">☑ 6. 三方回购保证金追加与国债交割券款对付 (DvP) 硬门禁：Capability Broker 阻断</text>
  </g>
