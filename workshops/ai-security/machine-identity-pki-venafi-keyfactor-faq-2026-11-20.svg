<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad381" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad381" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad381" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad381" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad381)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad381)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 381 · 🏆 200-SA-GUIDE, 790-SCENARIO &amp; 910-PYTEST HISTORIC MILESTONE · PKI &amp; MACHINE IDENTITY (VENAFI / KEYFACTOR / ACME)</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业机器身份与证书生命周期管理 (PKI/CLM：Venafi/Keyfactor)、47天短效轮换与代码签名 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">离线根 CA 密钥与 EV 代码签名策略物理气隙 + 禁签 CA:TRUE 与 SAN 白名单硬锁 vs. CSR 注入伪造通配符证书与 CA 续费诈骗 (BRK-771 / BRK-772)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad381)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业机器身份 (PKI/CLM) 与代码签名三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 证书签发申请 (CSR) / 工单注入窃取根 CA 与内网 SAN</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 研发或外部服务提交的证书签名请求 (CSR 扩展字段) 或续期</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  工单 PDF 夹带提示词注入，诱导 CLM Agent 读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取离线根 CA 恢复密钥保管人清单、EV 代码签名 HSM 激活</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  凭证及全网核心微服务 mTLS 内部域名 (SAN) 资产底表</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 违规签发次级根证书 (CA:TRUE) 与恶意驱动 EV 代码签名</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，在 Venafi / Keyfactor 中签发</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  包含 BasicConstraints: CA:TRUE 或 *.corp.com 通配符的非法证书</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 或驱动 EV 代码签名网关为未通过构建证明的后门木马签名</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：内网零信任 mTLS 双向认证被伪造穿透与供应链投毒</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造商业 CA (DigiCert/Sectigo) 配额与 WebTrust 诈骗</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造公共受信证书颁发机构 (DigiCert / Sectigo) 年度 ACME</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  短效证书自动化配额补缴单或 WebTrust PKI 审计托管通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry CA 机构账户并电汇 $6,350 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：年度数字证书采购专款被盗与全网证书断供过期危机</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad381)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业机器身份 (PKI/CLM) 零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: CSR ASN.1 解析清洗与强类型扩展槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 严禁将 CSR 自由文本属性拼入 Prompt；用确定性 ASN.1 解析器</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  仅提取公钥算法、Subject CN、SAN 数组、EKU 枚举与 SLSA 证明哈希</text>
  <text x="434" y="254" y2="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断 CSR 字段提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 离线根 CA 金库与 EV 代码签名 HSM 物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 离线根 CA 分片、EV 代码签名私钥策略与全网内部服务</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  命名空间底表严格隔离在 restricted-budget 气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 CA:FALSE 模版覆盖与 SLSA 代码签名硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 签发模版在代码层强制覆写 BasicConstraints=CA:FALSE 并禁用</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  通配符 SAN；EV 代码签名强制验证隔离流水线 SLSA L3 构建证明</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断伪造根证书与木马签名</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 公共受信 CA 与审计所账户只读锁 + 双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中商业 CA 与 WebTrust 审计所账户只读</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  (tool-allowlist + fixed-business-output + original-requester-payment)</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad381)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流机器身份与证书生命周期 (CLM) 方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性 CLM 网关 + 根 CA 气隙 + 模版/SLSA 锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-771/772 拦截率 100% | 满足 CA/B Forum 47天新规 &amp; FIPS</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Venafi / Keyfactor / DigiCert ONE 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止证书工单审批 Bot 在 CSR 注入下放行通配符或伪造 SAN</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 X.509 v3 ASN.1 DER 编码、OID 扩展与 ACME 挑战语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统运维用 Excel 登记证书到期日并手工生成 PFX 分发</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 在 TLS 证书有效期缩至 47 天时代彻底瘫痪，每年发生证书过期宕机</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 381 · 200 篇指南！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：伪造 CA 签发、根密钥泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取根 CA 仪式分片与 SAN 表 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断签发 CA:TRUE 证书与为未验证木马代码签名</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传内部 mTLS 拓扑与签名策略</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定商业 CA 账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $6,350 伪造 CA 配额电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 381 · 🏆 200 篇双语 SA 选型指南、790 场景 &amp; 910 Pytest 历史性里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 根 CA 与代码签名 HSM 气隙：离线根 CA 仪式分片与 EV 签名私钥与日常 ACME/CSR 审批 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 X.509 模版强制覆盖与 SLSA 验签：忽略 CSR 自带 CA:TRUE 扩展，代码签名强制校验隔离构建证明</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 公共受信 CA 账户只读与双签：锁定 trust-registry，商业证书配额与 WebTrust 审计付款强制经双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：🏆 790 个场景 (787 风险 + 3 基线) | 🏆 910 项 Pytest 检查 | 1,646 项断言 | 776 个交互向量 | 381 篇双语 FAQ (🏆 200 篇指南) | BRK-771/772</text>
</svg>
