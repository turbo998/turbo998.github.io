  <text x="834" y="446" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 5. API 685 哈氏合金无泄漏磁力泵名录只读锁定门禁</text>
  <text x="834" y="468" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 6. pytest -k round116 与 audit-publication 100% 通过</text>
