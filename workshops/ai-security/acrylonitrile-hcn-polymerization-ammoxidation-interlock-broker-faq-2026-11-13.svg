  <text x="834" y="358" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 1. 急冷塔 pH&gt;5.0 (2oo3) &lt;500ms 硬开硫酸并切进氨</text>
  <text x="834" y="380" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 2. HCN 罐温升 &gt;0.5°C/min 高位重力浓磷酸倾注硬联锁</text>
