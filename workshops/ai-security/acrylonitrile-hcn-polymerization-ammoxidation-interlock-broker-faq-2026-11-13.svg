  <text x="66" y="484" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">✕ 航空 T1100G 碳纤维高纯 PAN 原丝共聚与催化剂配方外泄</text>
  <text x="66" y="502" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">✕ $4,990 伪造有泄漏轴封泵与催化剂预付款直接放行</text>

