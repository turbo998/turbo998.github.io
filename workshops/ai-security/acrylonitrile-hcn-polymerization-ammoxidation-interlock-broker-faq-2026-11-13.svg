  <text x="186" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">ROUND 116 · 260 大红蓝场景里程碑</text>
  <text x="334" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18.5" font-weight="800" fill="#f8fafc">26万吨级丙烯腈氨氧化与剧毒液体氢氰酸 (HCN) 防遇碱自催化暴聚炸罐能力网关选型</text>
  <text x="52" y="96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">液氨 ASTM D5234 化验单注入 vs. 急冷塔 2oo3 pH≤3.5 硬锁 + HCN 储罐高位重力倾注浓磷酸 + 气隙 T1100G 碳纤维库 (BRK-241 &amp; BRK-242)</text>

