  <text x="446" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">第 1 层：急冷塔 2oo3 pH 硬锁 &amp; 高位重力注酸罐</text>
  <text x="446" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 急冷塔一段 pH&gt;5.0 (2oo3)：&lt;500ms 硬件强开浓硫酸补加阀</text>
  <text x="446" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">  并切断反应器进氨/进丙烯，物理杜绝碱性氨窜入 HCN 塔</text>
  <text x="446" y="256" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• HCN 罐 dT/dt&gt;0.5°C/min、T&gt;15°C 或 pH&gt;3.0 时：</text>
  <text x="446" y="272" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">  无动力高位重力浓磷酸罐失电常开阀直接倾注强酸终止聚合</text>

  <rect x="434" y="292" width="332" height="114" rx="8" fill="#071324" stroke="#0284c7" stroke-width="1"/>
  <text x="446" y="314" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">第 2 层：Capability Broker 确定性拦截 (0.0248ms)</text>
  <text x="446" y="334" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• untrusted-write：外部液氨化验单污染会话严禁改加酸</text>
  <text x="446" y="352" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• record-owner：阻断原料核验链跨主体读 restricted-budget</text>
  <text x="446" y="370" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• restricted-data-boundary：封死 T1100G 碳纤维配方外发</text>
  <text x="446" y="388" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• fixed-business-output + original-requester-payment</text>

