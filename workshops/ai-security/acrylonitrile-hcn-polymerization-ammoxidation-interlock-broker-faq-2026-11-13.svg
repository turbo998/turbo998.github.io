  <text x="446" y="460" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• T1100G 原丝衣康酸 DMSO 共聚与钼铋催化剂存放于气隙库</text>
  <text x="446" y="478" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 仅向氨氧化 Agent 暴露反应床温与硫铵结晶母液比重</text>
