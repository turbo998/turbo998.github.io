<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#041f1c"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
      .card-hdr { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; fill: #38bdf8; }
      .body-txt { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #e2e8f0; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1440" height="6" fill="url(#accentBlue)"/>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="510" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="21" class="mono" font-size="13" fill="#6ee7b7">🏆 1,410 断言里程碑 · Round 322 · 672 场景 · BRK-653/654</text>
    <rect x="525" y="0" width="645" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="543" y="21" class="mono" font-size="13" fill="#c7d2fe">CORPORATE TREASURY (KYRIBA/SAP TRM) · CASH POOLING · FX HEDGING</text>

    <text x="0" y="74" class="title" font-size="28">跨国集团司库（Kyriba / SAP TRM）、现金池归集与外汇套保 AI 安全指南</text>
    <text x="0" y="106" class="sub" font-size="16">集团流动性与并购锁汇头寸物理气隙 + 银企直连 (SWIFT/EBICS) 硬锁 vs. 对账单注入与能力网关</text>
  </g>

  <!-- Left Card -->
  <g transform="translate(48, 166)">
    <rect width="650" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19">⚖️ 集团司库 (TMS)、跨境现金池归集与外汇套保 AI 四大架构对比</text>

    <rect x="20" y="54" width="610" height="72" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
    <text x="34" y="78" class="title" font-size="15" fill="#fca5a5">1. ❌ 司库对账 Agent 直通未公开外汇锁汇头寸与银企直连资金池划拨</text>
    <text x="34" y="100" class="body-txt" font-size="13">• 银行电子对账单 (MT940 / camt.053) 附言栏植入指令，套出集团并购远期外汇敞口</text>
    <text x="34" y="118" class="mono" font-size="12" fill="#fca5a5">资金归集失控：诱导修改跨境现金池零余额归集 (ZBA Sweep) 阈值触发外管合规违约与挤兑</text>

    <rect x="20" y="136" width="610" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="160" class="title" font-size="15" fill="#7dd3fc">2. 🔒 集团并购远期外汇锁汇底表与核心授信契约 (Debt Covenants) 气隙</text>
    <text x="34" y="182" class="body-txt" font-size="13">• 日常对账与现金流预测 AI 0 权限读取未披露大额 FX 远期期权头寸及银行团授信底线</text>
    <text x="34" y="200" class="mono" font-size="12" fill="#93c5fd">防抢跑套利 (Front-Running)：物理阻断对账会话触碰 restricted-budget 集团司库底表</text>

    <rect x="20" y="218" width="610" height="72" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="34" y="242" class="title" font-size="15" fill="#d8b4fe">3. 📜 跨境现金池归集规则 (ZBA/IHB) 与标准结算指令 (SSI) 硬件签名锁</text>
    <text x="34" y="264" class="body-txt" font-size="13">• AI 仅输出头寸调拨与套保建议草稿，0 权限直接修改 Kyriba 现金池规则或对手方 SSI</text>
    <text x="34" y="282" class="mono" font-size="12" fill="#e9d5ff">选型定位：满足 Kyriba、SAP S/4HANA Treasury、360T/FXGO、SWIFT CSP 与 SOX 404</text>

    <rect x="20" y="300" width="610" height="74" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="324" class="title" font-size="15" fill="#6ee7b7">4. 🛡️ 必选底线：确定性零信任能力网关 (Capability Broker · 司库门禁)</text>
    <text x="34" y="346" class="body-txt" font-size="13">• 锁汇底表隔离 (record-owner) + 禁改现金池规则 (untrusted-write) + 结算 SSI 只读锁</text>
    <text x="34" y="364" class="mono" font-size="12" fill="#34d399">实测性能：P50 = 0.0248 ms 内存裁决 | 672 个场景 · 1,410 项 Pytest 确定性断言 100% 通过</text>
  </g>

  <!-- Right Card -->
  <g transform="translate(722, 166)">
    <rect width="670" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#f87171">🔥 对账单附言注入套取锁汇头寸与伪造 FX 交割 SSI 诈骗 vs. 零信任</text>

    <rect x="20" y="56" width="630" height="142" rx="10" fill="#2a0a10" stroke="#ef4444" stroke-width="1.5"/>
    <text x="36" y="82" class="title" font-size="15" fill="#fca5a5">❌ 脆弱架构：TMS Agent 直通银企直连与交易对手 SSI (BRK-653 / BRK-654)</text>
    <text x="36" y="108" class="body-txt" font-size="13">1. [MT940 / camt.053 银行对账单附言注入套取 FX 套保底表与篡改现金池] 诱导读取</text>
    <text x="36" y="130" class="body-txt" font-size="13">   集团未公开并购锁汇头寸 (restricted-budget)、关闭外管限额并外传头寸明细！</text>
    <text x="36" y="154" class="body-txt" font-size="13">2. [伪造交易对手投行“外汇远期交割标准结算指令 (FX SSI) 变更通知”] 盗刷 $4,950</text>
    <text x="36" y="180" class="mono" font-size="12" fill="#f87171">Baseline 结果：集团百亿锁汇头寸泄露被恶意狙击 + 跨境资金池违规 + $4,950 交割款被盗</text>

    <rect x="20" y="214" width="630" height="158" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.8"/>
    <text x="36" y="240" class="title" font-size="15" fill="#6ee7b7">✅ 零信任集团司库 (TMS) 架构：锁汇头寸气隙 + 现金池硬锁 + Broker</text>
    <text x="36" y="266" class="body-txt" font-size="13">• 闸门 1 (并购锁汇头寸与授信契约锁)：record-owner 0.0248ms 阻断对账会话读取</text>
    <text x="36" y="290" class="body-txt" font-size="13">• 闸门 2 (防篡改跨境现金池归集与外管限额)：untrusted-write 阻断修改 business-result</text>
    <text x="36" y="314" class="body-txt" font-size="13">• 闸门 3 (备案交易对手银行 FX SSI 名录只读锁)：fixed-business-output 锁死名录</text>
    <text x="36" y="338" class="body-txt" font-size="13">• 闸门 4 (司库底表外发与银企直连划款锁)：restricted-data-boundary 与零代付门禁</text>
    <text x="36" y="358" class="mono" font-size="12" fill="#34d399">Hardened 结果：合成夹具 ASR 75.0% → 0.0% | 合规日常银企余额对账单分类 100.0% 通过</text>
  </g>

  <!-- Bottom Card -->
  <g transform="translate(48, 580)">
    <rect width="1344" height="276" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#34d399">📊 确定性基准测试 (1,410 断言里程碑 · 672 场景) 与上线安全评审 Checklist</text>

    <rect x="24" y="56" width="630" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="40" y="82" class="mono" font-size="14" fill="#38bdf8">🧪 Round 322 新增 Pytest 回归测试 (1,410 项确定性断言里程碑！)</text>
    <text x="40" y="110" class="body-txt" font-size="13">• BRK-653 (对账单 MT940 附言注入窃取锁汇头寸底表与篡改跨境现金池归集规则)：</text>
    <text x="56" y="130" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="record-owner" &amp; "untrusted-write" &amp; "restricted-data-boundary"</text>
    <text x="40" y="158" class="body-txt" font-size="13">• BRK-654 (伪造外汇交割标准结算指令 FX SSI 篡改 Kyriba 名录与 $4,950 盗刷)：</text>
    <text x="56" y="178" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="fixed-business-output" &amp; "original-requester-payment"</text>
    <text x="40" y="208" class="mono" font-size="12" fill="#94a3b8">[measured] 内存评估 P50=0.0248ms / P95=0.0409ms | SQLite WAL P50=7.21ms</text>
    <text x="40" y="232" class="mono" font-size="12" fill="#38bdf8">[synthetic] 累计 672 个场景 · 1,410 项 Pytest 断言 · 658 大演练向量 · 322 篇双语 FAQ</text>

    <rect x="680" y="56" width="640" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="698" y="82" class="mono" font-size="14" fill="#a78bfa">🛠️ 跨国集团司库 (Kyriba/SAP TRM)、现金池与外汇套保 AI 6 项铁律 (Checklist)</text>
    <text x="698" y="108" class="body-txt" font-size="13">☑ 1. 集团未公开并购锁汇头寸与银团授信契约物理气隙：record-owner</text>
    <text x="698" y="132" class="body-txt" font-size="13">☑ 2. 跨境现金池归集规则 (ZBA/IHB) 与外管限额只读硬锁：untrusted-write</text>
    <text x="698" y="156" class="body-txt" font-size="13">☑ 3. 银企直连 (SWIFT Alliance / EBICS) 报文字段严格结构化隔离</text>
    <text x="698" y="180" class="body-txt" font-size="13">☑ 4. 外部收款附言 (MT940 Tag 86 / camt.053 Ustrd) 强制污点化：taint="untrusted"</text>
    <text x="698" y="204" class="body-txt" font-size="13">☑ 5. 备案外汇交易对手标准结算指令 (Alert SSI) 只读锁定：锁死 trust-registry</text>
    <text x="698" y="228" class="body-txt" font-size="13">☑ 6. 银企直连资金调拨与外汇交割电汇硬门禁：Capability Broker 物理阻断打款</text>
  </g>
