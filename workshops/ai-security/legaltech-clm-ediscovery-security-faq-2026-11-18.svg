<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0c1526"/>
      <stop offset="100%" stop-color="#071a18"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
      .card-hdr { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; fill: #38bdf8; }
      .body-txt { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #e2e8f0; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1440" height="6" fill="url(#accentBlue)"/>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="445" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="21" class="mono" font-size="13" fill="#6ee7b7">🏆 540-VECTOR MILESTONE · ROUND 263 · 2026-11-18</text>
    <rect x="460" y="0" width="540" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="478" y="21" class="mono" font-size="13" fill="#c7d2fe">LEGALTECH CLM · EDISCOVERY · ETHICAL WALL · PRIVILEGE</text>

    <text x="0" y="74" class="title" font-size="29">企业法务科技（CLM 合同审阅）与电子取证（eDiscovery）AI 安全选型指南</text>
    <text x="0" y="106" class="sub" font-size="16">OpenXML 清洗 + 确定性逐字 Diff + 案件级伦理墙 (Ethical Wall) + 律师特权豁免门禁 vs. 对手方合同红线注入与能力网关</text>
  </g>

  <!-- Left Card -->
  <g transform="translate(48, 166)">
    <rect width="650" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19">⚖️ 企业法务合同审阅与诉讼 eDiscovery 四大防线对比</text>

    <rect x="20" y="54" width="610" height="72" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
    <text x="34" y="78" class="title" font-size="15" fill="#fca5a5">1. ❌ 直读对手方 .docx 合同 + 混用特权卷宗库 (致命特权弃权风险)</text>
    <text x="34" y="100" class="body-txt" font-size="13">• 对手方在 .docx 植入 w:vanish 隐藏指令，诱导 AI 忽略“无限赔偿责任”并套取并购底牌</text>
    <text x="34" y="118" class="mono" font-size="12" fill="#fca5a5">合规暴雷：eDiscovery 误发 1 份内部律师意见书即触发英美法“全案特权弃权 (Waiver)”！</text>

    <rect x="20" y="136" width="610" height="72" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.2"/>
    <text x="34" y="160" class="title" font-size="15" fill="#e9d5ff">2. 📄 OpenXML 深度消杀 + 确定性条款差分引擎 (Deterministic Diff)</text>
    <text x="34" y="182" class="body-txt" font-size="13">• 入模前物理剥离 w:vanish、customXml 与隐藏宏，由确定性代码提取逐字增删 Diff</text>
    <text x="34" y="200" class="mono" font-size="12" fill="#d8b4fe">架构铁律：审阅对手方合同修订稿的沙盒 100% 物理剥离我方并购底价与特权库权限</text>

    <rect x="20" y="218" width="610" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="242" class="title" font-size="15" fill="#7dd3fc">3. 🧱 Purview 信息屏障 (Ethical Wall) + 律师特权 Pre-Filter 硬扣留</text>
    <text x="34" y="264" class="body-txt" font-size="13">• 按案件 (matter_id) 物理隔离向量索引与缓存，Pre-Filter 100% 剔除 Privileged 文档</text>
    <text x="34" y="282" class="mono" font-size="12" fill="#93c5fd">选型定位：彻底阻断跨项目并购利益冲突串味与诉讼电子取证误披露</text>

    <rect x="20" y="300" width="610" height="74" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="324" class="title" font-size="15" fill="#6ee7b7">4. 🛡️ 必选底线：确定性零信任能力网关 (Capability Broker · 法务用印硬门禁)</text>
    <text x="34" y="346" class="body-txt" font-size="13">• 特权库隔离 (record-owner) + 禁自动电子用印 (untrusted-write) + 禁自动划拨和解金</text>
    <text x="34" y="364" class="mono" font-size="12" fill="#34d399">实测性能：P50 = 0.0248 ms 内存裁决 | 合成夹具下合同注入与特权外泄拦截率 100.0%</text>
  </g>

  <!-- Right Card -->
  <g transform="translate(722, 166)">
    <rect width="670" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#f87171">🔥 对手方合同红线注入与假仲裁和解攻击 vs. 零信任防线</text>

