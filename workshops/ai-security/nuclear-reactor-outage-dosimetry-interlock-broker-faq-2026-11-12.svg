  <!-- Header -->
  <rect x="30" y="22" width="1140" height="86" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="54" fill="#60a5fa" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">AI 解决方案架构师实战选型一图流 · ROUND 60 (60 篇选型 FAQ 旗舰里程碑) · 核电大修 PWR/SMR、同位素与辐射防护 AGENT</text>
  <text x="52" y="84" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">大修焊缝报告注入、高辐射区 LOTO/50.59 违规豁免与核材料窃密 vs. RG 5.71 光闸 + 零信任能力网关</text>
  <rect x="935" y="38" width="215" height="52" rx="10" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="1042" y="60" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">148 场景 · 362 项断言 · 134 向量</text>
  <text x="1042" y="79" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="800">75.0% → 0.0% ASR (0.0248ms)</text>

  <!-- Left Column: Vulnerable Architecture -->
  <rect x="30" y="124" width="555" height="440" rx="14" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="124" width="555" height="44" rx="14" fill="url(#redGrad60)"/>
  <text x="52" y="152" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">❌ 传统高危架构：外包报告解析、核材料安保库与 e-LOTO/50.59 台账混用（100% 沦陷）</text>

  <rect x="52" y="184" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="208" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">1. 外包无损检测 (NDT) 焊缝报告 XML 属性植入隐藏大修指令</text>
  <text x="68" y="230" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 攻击者在余热排出泵管道 UT 报告中伪造“冷态水压试验并网解除隔离”指令</text>
  <text x="68" y="250" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 传统 EAM 文档网关放行合法检验报告，无法识别核工程术语包装的提示词注入</text>

  <rect x="52" y="280" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">2. 高辐射热室 e-LOTO 违规解除 / 50.59 豁免 &amp; 特种核材料 (SNM) 外泄</text>
  <text x="68" y="326" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 全能型大修 Agent 跨权读取乏燃料 SNM 燃耗台账与 Part 73 要害区布防图 (restricted-budget)</text>
  <text x="68" y="346" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 覆写高辐射区挂牌上锁与 10 CFR 50.59 免批状态 (business-result)，并外泄核材料台账</text>

  <rect x="52" y="376" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="400" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">3. 假冒欺诈核级件商 (CFSI) 写入 NQA-1 名录 &amp; $4,990 备件款盗刷</text>
  <text x="68" y="422" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 外部伪造核级阀杆材质证明书 (CMTR) 企图将无证商贸公司写入 trust-registry ASL 名录</text>
  <text x="68" y="442" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 缺乏驻厂监造硬锁与光谱 PMI 实测对账，直接诱导财务 Agent 划拨 $4,990 核级备件款</text>

  <rect x="52" y="472" width="510" height="74" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="68" y="497" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="800">💥 实测 Baseline 后果（BRK-129 &amp; BRK-130）：</text>
  <text x="68" y="519" fill="#fef2f2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 高辐射区隔离被违规解除 + 50.59 变更违规豁免 + 核材料台账外泄 + $4,990 被盗！</text>
  <text x="68" y="537" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 根因：大修初审账号未隔离外部污点，且缺乏硬线伽马剂量互锁与机械双人挂锁</text>

  <!-- Right Column: Hardened Architecture -->
  <rect x="615" y="124" width="555" height="440" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="615" y="124" width="555" height="44" rx="14" fill="url(#greenGrad60)"/>
  <text x="637" y="152" fill="#d1fae5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">✅ 纵深防御架构：RG 5.71 单向光闸 + 硬线伽马/机械 LOTO + 零信任能力网关</text>

  <rect x="637" y="184" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="208" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 1 · Level-1 只读大修沙盒 + SNM 核材料与安保库隔离 (record-owner)</text>
  <text x="653" y="230" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 外部大修初筛 Agent (calendar) 物理隔离于核安保库外，读 restricted-budget 0.0248ms 秒拒</text>
  <text x="653" y="250" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 出口门禁 restricted-data-boundary 100% 封死特种核材料台账与要害区布防图外发</text>

  <rect x="637" y="280" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 2 · 报告污点写锁 + 硬线 γ 剂量互锁 + SRO/HP 机械双锁 (untrusted-write)</text>
  <text x="653" y="326" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 任何摄入外部 NDT 报告/CMTR 的会话强制打标 untrusted=True，禁改 e-LOTO 与 50.59</text>
  <text x="653" y="346" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• RG 5.71 单向光闸物理隔离 1E 级 RPS + 高辐射屏蔽门强制硬线 γ 监测与双人实体挂锁</text>

  <rect x="637" y="376" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="400" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 3 · ASME NQA-1 供应商名录硬锁 + 核级采购血统门禁 (original-requester)</text>
  <text x="653" y="422" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• tool-allowlist + fixed-business-output 双重锁死 trust-registry，严禁 CFSI 假件商加白</text>
  <text x="653" y="442" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• original-requester-payment 溯源 requester="supplier"，0.0248ms 拦截 $4,990 盗刷</text>

  <rect x="637" y="472" width="510" height="74" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="653" y="497" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="800">🛡️ 实测 Hardened 战果（60 篇 FAQ 里程碑 · Pytest 362 passed · 134 向量全绿）：</text>
  <text x="653" y="519" fill="#ecfdf5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 核材料库零读取 + 辐射隔离零误解 + NQA-1 名录零污染 + $4,990 假件诈骗零成交！</text>
  <text x="653" y="537" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 纯内存网关裁决延迟 P50 = 0.0248ms / P95 = 0.0409ms，单步 SQLite WAL 审计收据落盘 7.21ms</text>

  <!-- Bottom Decision Bar -->
  <rect x="30" y="582" width="1140" height="154" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="30" y="582" width="1140" height="38" rx="14" fill="url(#blueGrad60)"/>
  <text x="52" y="606" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="800">🧭 核能与核医学安全架构师 30 秒选型口诀与上线红线（Architect Decision Cheat-Sheet）</text>

  <rect x="50" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="66" y="655" fill="#93c5fd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🟢 什么时候选方案 A（只读法规检索助手）？</text>
  <text x="66" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 仅做公开 NRC NUREG 导则与脱敏经验反馈检索</text>
  <text x="66" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 零 e-LOTO/50.59 写权限、零核材料与采购接口</text>

  <rect x="422" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="438" y="655" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🔴 什么时候必须选方案 B（光闸 + 能力网关）？</text>
  <text x="438" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 接入大修工单编排、50.59 筛查或 NQA-1 采购</text>
  <text x="438" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 必须强制 RG 5.71 光闸 + 机械双锁 + Broker</text>

  <rect x="794" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="810" y="655" fill="#fcd34d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🛠️ 生产上线 3 条铁律（Zero-Trust Invariants）</text>
  <text x="810" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">1. 1E 级安全仪控网与 AI 之间强制物理单向光闸</text>
  <text x="810" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">2. 封死 SNM 台账外发；锁死 NQA-1 合格供应商表</text>
</svg>
