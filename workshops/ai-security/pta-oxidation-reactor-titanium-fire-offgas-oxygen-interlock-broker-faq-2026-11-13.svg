  <text x="446" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 顶部尾气干基 O2≥4.5% (三冗余 TDLAS/顺磁氧表 2oo3)：</text>
  <text x="446" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">  &lt;500ms 硬关进风双切断阀并冲入高压氮气死守 &lt;8% 红线</text>
  <text x="446" y="256" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• 顶部回流阀并联机械最小限流孔板：强制维持气相钛内壁</text>
  <text x="446" y="272" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">  与钛管束 100% 醋酸液膜覆盖，物理消灭“干斑”着火点</text>

  <rect x="434" y="292" width="332" height="114" rx="8" fill="#071324" stroke="#0284c7" stroke-width="1"/>
  <text x="446" y="314" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">第 2 层：Capability Broker 确定性拦截 (0.0248ms)</text>
  <text x="446" y="334" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• untrusted-write：外部 PX 化验单污染会话严禁改联锁</text>
  <text x="446" y="352" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• record-owner：阻断原料核验链跨主体读 restricted-budget</text>
  <text x="446" y="370" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• restricted-data-boundary：封死 Co/Mn/Br 催化配方外发</text>
  <text x="446" y="388" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• fixed-business-output + original-requester-payment</text>

  <rect x="434" y="418" width="332" height="98" rx="8" fill="#071324" stroke="#0369a1" stroke-width="1"/>
  <text x="446" y="440" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">第 3 层：气隙催化配方金库 &amp; Gr.7 钛钯合金门禁</text>
  <text x="446" y="460" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 超低醋酸单耗 Co/Mn/Br 配比与光学色相模型存放于气隙库</text>
  <text x="446" y="478" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 仅向 APC 寻优 Agent 暴露在线拉曼 4-CBA 与尾气压力</text>
  <text x="446" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• 钛管付款强制核验 100% XRF 含钯量 (0.12~0.25% Pd) 单</text>

