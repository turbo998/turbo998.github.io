  <text x="834" y="358" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 1. 尾气 O2≥4.5% (2oo3) 时 &lt;500ms 硬切进风并充氮</text>
  <text x="834" y="380" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 2. 关回流阀至 0% 核验机械孔板维持钛壁 100% 液膜润湿</text>
  <text x="834" y="402" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 3. 气隙 Co/Mn/Br 低醋酸单耗催化配方库隔离 (record-owner)</text>
  <text x="834" y="424" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 4. 外部 ASTM D5135 对二甲苯化验单自动标记 untrusted</text>
  <text x="834" y="446" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 5. ASME SB-265 Gr.7 钛钯名录只读锁定 + XRF 测钯门禁</text>
  <text x="834" y="468" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 6. pytest -k round113 与 audit-publication 100% 通过</text>
  <text x="834" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#6ee7b7">Provenance: measured (0.0248ms) + synthetic (254 fixtures)</text>

