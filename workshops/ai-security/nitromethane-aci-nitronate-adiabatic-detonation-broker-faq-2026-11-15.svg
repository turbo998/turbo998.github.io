  <text x="646" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">1. 物理层：100% 盲断胺/强碱 + &lt;=62°C 真空温水精馏 + &lt;100ms 防憋压跳闸</text>
  <text x="646" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 物理盲断一切有机胺与 NaOH 管线；再沸器仅通 &lt;=75°C 温水，维持 &lt;=25 kPa(a) 真空</text>
