  <text x="646" y="260" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 全线切断阀机械锁定 &gt;=15s 液压阻尼缓闭，从源头消灭水锤微气泡绝热压缩!</text>

  <rect x="632" y="290" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
