  <text x="498" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17.5" font-weight="800" fill="#f8fafc">10万吨级硝基甲烷 (CH3NO2) 与气相硝化基地：防胺敏化与水锤微泡绝热爆轰网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">硝基甲烷 (-4540 kJ/kg, D=6290 m/s) 遇乙二胺/NaOH 生成假酸态 PLX 液体炸药 · 憋压气穴/快关阀水锤微泡绝热压缩 (&gt;1200°C) 零火源起爆</text>
