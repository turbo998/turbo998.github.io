  <text x="653" y="216" fill="#6ee7b7" font-size="13.5" font-weight="700">1. GISTM 硬件渗压继电器 + 高炉 SIL-3 SIS 硬线闭锁 + untrusted-write</text>
  <text x="653" y="238" fill="#f1f5f9" font-size="12">• 尾矿坝孔隙水压超限切泵与高炉风口漏水休风由独立 SIL-3 硬件继电器硬线闭锁</text>
  <text x="653" y="256" fill="#34d399" font-size="11.5" font-weight="700">✓ 外部 COA 染色会话 (untrusted=True) 写操作被 rule="untrusted-write" 在 0.0248ms 拦截</text>

  <rect x="637" y="280" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-size="13.5" font-weight="700">2. 气隙深部稀土钻孔储量金库隔离 (record-owner + restricted-data-boundary)</text>
  <text x="653" y="326" fill="#f1f5f9" font-size="12">• 精矿化验 Agent (actor="calendar") 跨主体读取 restricted-budget 地质库被立即拒绝</text>
  <text x="653" y="344" fill="#f1f5f9" font-size="12">• 任何包含未公开 JORC/NI 43-101 钻孔坐标的外发消息被出境边界规则死死卡住</text>
  <text x="653" y="358" fill="#34d399" font-size="11.5" font-weight="700">✓ 战略矿产资源保密：稀土与伴生金三维块段模型 0 越权读取、0 外部泄露</text>

  <rect x="637" y="378" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="402" fill="#6ee7b7" font-size="13.5" font-weight="700">3. 合格矿商名录只读锁定与本厂 LIMS 火试金签章绑定结算</text>
  <text x="653" y="424" fill="#f1f5f9" font-size="12">• tool-allowlist + fixed-business-output 严禁 AI 修改 trust-registry 合格矿商表</text>
  <text x="653" y="442" fill="#34d399" font-size="11.5" font-weight="700">✓ original-requester-payment 阻断外部复议单发起的 $4,940 品位升水差价电汇</text>

  <rect x="637" y="476" width="510" height="82" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="500" fill="#6ee7b7" font-size="13.5" font-weight="700">4. 全链路 SHA-256 审计收据与 GISTM / IEC 61511 合规证明</text>
  <text x="653" y="522" fill="#f1f5f9" font-size="12">• 纯内存策略判定 P50 = 0.0248ms / P95 = 0.0409ms；含 SQLite WAL 收据落盘 P50 = 7.21ms</text>
  <text x="653" y="542" fill="#34d399" font-size="11.5" font-weight="700">✓ 满足全球尾矿管理标准 (GISTM) 与 IEC 61511 功能安全独立性审计要求</text>

