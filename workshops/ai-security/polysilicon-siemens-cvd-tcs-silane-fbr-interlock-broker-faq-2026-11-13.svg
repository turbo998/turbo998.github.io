  <text x="66" y="394" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fda4af">• 甲硅烷 (SiH4) 自燃点 &lt;-50°C：失氮封吸氧室温零延迟爆轰</text>

