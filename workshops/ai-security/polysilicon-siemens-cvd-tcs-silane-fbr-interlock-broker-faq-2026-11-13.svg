  <text x="66" y="332" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fed7aa">  SiHCl3 剧烈水解 SiHCl3+2H2O-&gt;SiO2↓+3HCl↑+H2↑</text>
  <text x="66" y="354" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 固态二氧化硅 (SiO2 硅胶) 像速凝水泥堵死排气口与安全阀</text>
