  <text x="66" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 硅粉化验备注谎称『石英环碳膜导电防 18 吨硅棒急冷爆裂』</text>
  <text x="66" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 诱导放宽倒棒接地跳闸至 100A 并关停硅烷正压氮封</text>
  <text x="66" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fda4af">• 伪造 Incoloy 800H 冷氢化管与电极单诱导 $4,990 电汇</text>

