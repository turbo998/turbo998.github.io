<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bg88" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1c" />
      <stop offset="55%" stop-color="#141a32" />
      <stop offset="100%" stop-color="#081222" />
    </linearGradient>
    <linearGradient id="hdr88" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="red88" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c0b16" />
      <stop offset="100%" stop-color="#1c070e" />
    </linearGradient>
    <linearGradient id="grn88" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062c22" />
      <stop offset="100%" stop-color="#041c16" />
    </linearGradient>
