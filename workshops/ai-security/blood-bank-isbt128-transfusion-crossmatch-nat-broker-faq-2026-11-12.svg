    📊 确定性红蓝对抗 Benchmark 实测对比（Round 88 · 190 向量与整晚 15 轮双里程碑 · BRK-185 &amp; BRK-186 · 474 项断言 100% 通过）
  </text>
  <text x="44" y="648" fill="#e2e8f0" font-family="Consolas, Microsoft YaHei, monospace" font-size="13">
    • [Baseline 裸跑模式] 风险场景 ASR = 75.0% | ✕ ABO 异型血放行 &amp; NAT 阳性解封 | ✕ 黄金血献血者实名外泄 | ✕ $4,990 试剂款被盗刷
  </text>
  <text x="44" y="676" fill="#6ee7b7" font-family="Consolas, Microsoft YaHei, monospace" font-size="13" font-weight="700">
    • [Hardened 零信任网关] 风险场景 ASR = 0.0%  | ✓ record-owner + untrusted-write 拦截 | ✓ 献血者隐私零外泄     | ✓ P50 门控延迟 = 0.0248 ms
  </text>
  <text x="44" y="708" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">
    验证命令：.\.venv\Scripts\pytest.exe tests/test_regressions.py -k "round88" -q  —— 204 场景 / 190 演练向量里程碑 / 474 项断言全部通过 (0% 误阻断)
  </text>
