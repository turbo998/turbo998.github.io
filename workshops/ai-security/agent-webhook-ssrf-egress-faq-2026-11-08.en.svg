<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="30" y="24" width="1140" height="92" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="54" y="54" fill="#60a5fa" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">AI SOLUTION ARCHITECT · 2026-11-08 ROUND 14 · ASYNC WEBHOOKS, DNS-REBINDING SSRF &amp; EPOCH APPROVAL PINNING</text>
  <text x="54" y="82" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="800">Async Webhook Forgery, DNS-Rebinding SSRF &amp; Stale Approval Replay vs. mTLS + HMAC Replay Lock + Egress Proxy</text>
  <text x="54" y="104" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5">56 Deterministic Synthetic Fixture Scenarios (178/178 Pytest Assertions Passed) · In-Memory Policy+Hash P50=0.0248ms (n=200) · 1-Step SQLite WAL P50=7.21ms (n=50)</text>

  <!-- 3 Core Takeaways -->
  <rect x="30" y="130" width="368" height="118" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="48" y="156" fill="#93c5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">① Never Trust Unsigned Webhooks or Ticket Approvals</text>
  <text x="48" y="178" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Verify HMAC-SHA256(ts.nonce.body) with window ≤300s</text>
  <text x="48" y="198" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Stamp external partner callback text as untrusted</text>
  <text x="48" y="218" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Never bind high-risk payouts to a static ticket_id</text>

  <rect x="416" y="130" width="368" height="118" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="434" y="156" fill="#93c5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">② Socket IP Pinning + Isolated Egress Proxy vs. SSRF</text>
  <text x="434" y="178" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Pre-flight urlparse check fails against TTL=0 DNS rebinding</text>
  <text x="434" y="198" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Resolve once, verify public IP, and pin at socket connect()</text>
  <text x="434" y="218" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Isolated Egress Proxy has zero routes to 169.254.169.254</text>

  <rect x="802" y="130" width="368" height="118" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="820" y="156" fill="#93c5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700">③ Pause/Resume Epoch Bump + 5-Tuple Broker Gate</text>
  <text x="820" y="178" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Pause/Resume increments session_epoch += 1 automatically</text>
  <text x="820" y="198" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• Bind approvals to (request_hash, epoch, exp, plan, actor)</text>
  <text x="820" y="218" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="12">• 0.0248ms P50 blocks untrusted-write, wire &amp; secret egress</text>

  <!-- Left: Vulnerable Path -->
  <rect x="30" y="264" width="555" height="270" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="264" width="555" height="38" rx="14" fill="url(#redGrad)"/>
  <text x="50" y="288" fill="#fef2f2" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">❌ Vulnerable Async Architecture (Pre-Flight URL Check + Unsigned Webhook + Ticket Approval)</text>

  <rect x="50" y="318" width="515" height="54" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="66" y="340" fill="#fca5a5" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700">1. DNS Rebinding Bypasses Pre-Flight URL Check (BRK-37)</text>
  <text x="66" y="360" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">1st lookup returns public IP 198.51.100.42 (pass); 3ms later socket connects to 169.254.169.254 IMDS</text>

  <rect x="50" y="384" width="515" height="54" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="66" y="406" fill="#fca5a5" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700">2. Forged Webhook Resumes &amp; Poisons Agent Context</text>
  <text x="66" y="426" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">External callback_note appended without taint-tagging, overwriting business-result deliverable</text>

  <rect x="50" y="450" width="515" height="66" rx="8" fill="#450a0a" stroke="#ef4444"/>
  <text x="66" y="474" fill="#fecaca" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700">3. 💥 Pre-Pause Approval Replayed Across Epochs for $1,350 Wire (BRK-38)</text>
  <text x="66" y="494" fill="#fca5a5" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">Checked only ticket_id=approved without verifying epoch or $500-&gt;$1,350 hash; wired $1,350 &amp; leaked secrets</text>

  <!-- Right: Hardened Zero-Trust Path -->
  <rect x="615" y="264" width="555" height="270" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="615" y="264" width="555" height="38" rx="14" fill="url(#greenGrad)"/>
  <text x="635" y="288" fill="#ecfdf5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">✅ Zero-Trust Async &amp; Egress Architecture (HMAC Lock + Socket IP Pin + 5-Tuple Epoch Gate)</text>

  <rect x="635" y="318" width="515" height="54" rx="8" fill="#0f172a" stroke="#065f46"/>
  <text x="651" y="340" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700">1. Gate 1: Inbound HMAC Timestamp/Nonce Lock + Socket IP Pinning</text>
  <text x="651" y="360" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">Rejects replayed callbacks &amp; taints external text untrusted; pins public IP at socket connect()</text>

  <rect x="635" y="384" width="515" height="54" rx="8" fill="#0f172a" stroke="#065f46"/>
  <text x="651" y="406" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700">2. Gate 2: Pause/Resume Increments Session Epoch Automatically</text>
  <text x="651" y="426" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">pause() -&gt; resume() increments epoch += 1; pre-pause $500 approval fails with stale epoch</text>

  <rect x="635" y="450" width="515" height="66" rx="8" fill="#022c22" stroke="#10b981"/>
  <text x="651" y="474" fill="#a7f3d0" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700">3. 🔒 Gate 3: Deterministic Capability Broker (0.0248ms P50, 0% Leaks)</text>
  <text x="651" y="494" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">record-owner blocks secret read + untrusted-write blocks tamper + restricted-data-boundary &amp; requester block</text>

  <!-- Bottom Decision Matrix & Provenance -->
  <rect x="30" y="550" width="1140" height="184" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="30" y="550" width="1140" height="34" rx="14" fill="url(#blueGrad)"/>
  <text x="50" y="572" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">📊 Architect Selection Matrix &amp; Round 14 Verified Evidence (56 Scenarios / 178 Pytest Assertions · Full Raw Arrays Sealed)</text>

  <text x="50" y="608" fill="#93c5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Architecture Tier</text>
  <text x="360" y="608" fill="#93c5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">DNS-Rebinding SSRF Defense</text>
  <text x="580" y="608" fill="#93c5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Pause/Resume Replay Defense</text>
  <text x="815" y="608" fill="#93c5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Added Latency (Provenance)</text>
  <text x="1020" y="608" fill="#93c5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Fixture ASR</text>

  <line x1="46" y1="616" x2="1150" y2="616" stroke="#334155" stroke-width="1"/>

  <text x="50" y="638" fill="#fca5a5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">A. Unsigned Webhook + Pre-Flight urlparse (Anti-Pattern)</text>
  <text x="360" y="638" fill="#fca5a5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">✕ Bypassed by TTL=0 &amp; 302 redirect</text>
  <text x="580" y="638" fill="#fca5a5" font-family="Segoe UI, system-ui, sans-serif" font-size="12">✕ Ticket approval replayed after pause</text>
  <text x="815" y="638" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="12">~0.1ms (No real isolation)</text>
  <text x="1020" y="638" fill="#f87171" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">75.0% (Breached)</text>

  <text x="50" y="664" fill="#fde047" font-family="Segoe UI, system-ui, sans-serif" font-size="12">B. Inbound Webhook HMAC Only (Low/Med Risk)</text>
  <text x="360" y="664" fill="#fde047" font-family="Segoe UI, system-ui, sans-serif" font-size="12">△ Vulnerable to outbound URL SSRF</text>
  <text x="580" y="664" fill="#fde047" font-family="Segoe UI, system-ui, sans-serif" font-size="12">△ Vulnerable to partner payload injection</text>
  <text x="815" y="664" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="12">0.2–0.5ms (Gateway HMAC)</text>
  <text x="1020" y="664" fill="#fbbf24" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Partial Bypass</text>

  <text x="50" y="690" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">C. HMAC Lock + Socket IP Pin + 5-Tuple Epoch Gate ⭐</text>
  <text x="360" y="690" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">✓ Socket IP pin + zero internal routes</text>
  <text x="580" y="690" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">✓ Epoch bump invalidates stale tokens</text>
  <text x="815" y="690" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">0.0248ms P50 (measured n=200)</text>
  <text x="1020" y="690" fill="#34d399" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">0.0% (0% FPR)</text>

  <text x="50" y="718" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">Verified by Pytest: BRK-37 (test_webhook_dns_rebinding_ssrf_and_callback_tamper_blocked) &amp; BRK-38 (test_async_webhook_stale_approval_replay_and_wire_blocked) · 178/178 Passing</text>
</svg>
