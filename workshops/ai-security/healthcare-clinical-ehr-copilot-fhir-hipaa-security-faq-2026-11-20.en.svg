  <text x="60" y="328" fill="#f87171" font-size="13" font-weight="700">② CPOE Allergy Override &amp; ICD-10 Upcoding Fraud</text>
  <text x="60" y="350" fill="#cbd5e1" font-size="12">Adversarial referral notes or audio injections force</text>
  <text x="60" y="368" fill="#cbd5e1" font-size="12">the Scribe agent to suppress drug-allergy alerts</text>
  <text x="60" y="388" fill="#fca5a5" font-size="12" font-weight="700">&amp; inflate ICD-10/CPT codes (False Claims Act risk)!</text>

