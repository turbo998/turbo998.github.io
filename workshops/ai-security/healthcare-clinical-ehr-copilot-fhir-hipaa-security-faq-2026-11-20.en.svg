  <text x="447" y="350" fill="#cbd5e1" font-size="12">AI writes only `DocumentReference(status=preliminary)`</text>
  <text x="447" y="368" fill="#cbd5e1" font-size="12">and `pended` orders; direct `MedicationRequest`</text>
  <text x="447" y="388" fill="#6ee7b7" y1="0" font-size="12" font-weight="700">&amp; CDS overrides are blocked by `untrusted-write`!</text>

  <rect x="433" y="416" width="333" height="100" rx="8" fill="#0d242c" stroke="#047857" stroke-width="1"/>
  <text x="447" y="438" fill="#34d399" font-size="13" font-weight="700">③ Break-the-Glass VIP Isolation &amp; EDI Dual-Sign</text>
  <text x="447" y="460" fill="#cbd5e1" font-size="12">`record-owner` air-gaps VIP &amp; 42 CFR Part 2 charts,</text>
