  <text x="60" y="478" fill="#cbd5e1" font-size="12">update tampers with `trust-registry` to trigger</text>
  <text x="60" y="498" fill="#fca5a5" font-size="12" font-weight="700">an unauthorized $7,650 claims settlement wire!</text>

