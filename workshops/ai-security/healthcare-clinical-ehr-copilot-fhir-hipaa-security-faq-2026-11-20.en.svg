  <text x="212" y="168" text-anchor="middle" fill="#fecaca" font-size="15" font-weight="800">🚨 1. Top 3 Clinical EHR AI &amp; HIPAA ePHI Risks</text>

  <rect x="46" y="196" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="218" fill="#f87171" font-size="13" font-weight="700">① Cross-Patient VIP &amp; 42 CFR Part 2 Exfil (BRK-823)</text>
  <text x="60" y="240" fill="#cbd5e1" font-size="12">Poisoned external referral PDFs abuse shared</text>
  <text x="60" y="258" fill="#cbd5e1" font-size="12">FHIR `system/*.read` service tokens to dump VIP</text>
  <text x="60" y="278" fill="#fca5a5" font-size="12" font-weight="700">&amp; psychiatric ePHI charts across the hospital!</text>

