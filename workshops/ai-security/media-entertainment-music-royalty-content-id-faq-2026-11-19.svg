<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad349" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad349" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad349" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad349" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad349)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad349)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 349 · MUSIC &amp; ENTERTAINMENT ROYALTY ACCOUNTING (VISTEX / CISAC CWR / MLC), CONTENT ID &amp; SYNC ESCROW</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">音乐与影视版权版税结算 (Vistex/CWR/MLC)、Content ID 确权与同步许可 AI Agent 安全选型指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">艺人预付金未抵扣余额与曲库并购估值物理气隙 + ISWC/ISRC 分成锁与预付金冲抵硬锁 vs. 确权申诉注入篡改分成与付款指示函 (LOD) 诈骗 (BRK-707 / BRK-708)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad349)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 音乐影视版税结算与版权确权三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① Content ID / CWR 确权申诉注入窃取曲库估值 (BRK-707)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 恶意版权碰瓷团伙上传的 CISAC CWR 作品登记单或 Content ID</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  版权反通知 PDF 夹带间接提示词注入</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 诱导 Agent 跨库读取头部艺人未收回预付金 (Unrecouped</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  Advance)、曲库并购估值倍数及未发行母带分轨文件</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 篡改 ISWC/ISRC 版税分成比例与豁免预付金抵扣 (BRK-707)</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令将热门金曲的词曲/录音 (Publishing/Master) 权益分账</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  比例 (Split Sheet) 改写至外部空壳版权代理名下</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 违规清零艺人数百万美元未抵扣预付金 (Recoupment Balance)</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：流媒体版税池被洗劫与唱片公司巨额预付金坏账</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造付款指示函 (LOD) 与影视同步许可电汇诈骗 (BRK-708)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造词曲作者版税转让付款指示函 (Letter of Direction, LOD)</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  或超级碗广告影视同步许可 (Sync License) 结算通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 收款账户并电汇 $5,080 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-size="11" font-weight="700">• 违规触发：版税信托资金被盗与版权共同所有人连带诉讼</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad349)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 音乐影视版税与版权确权零信任架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: CWR / DDEX DSR / 确权申诉清洗与槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离版权申诉附件中的自然语言指令，仅提取 DDEX/CWR 强类型</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  槽位 (ISRC、ISWC、IPI/CAE 权利人编码、地区、申诉份额)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 曲库并购估值与未发行母带物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 曲库并购 (Catalog M&amp;A) DCF 估值模型、头部艺人合同底表与</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  未发行母带 (Unreleased Stems) 存入物理气隙域 (restricted-budget)</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 100% 权益守恒挂起锁 (Suspense Escrow)</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 当申诉导致 $\sum \text{Split}_i &gt; 100\%$ 时，确定性引擎自动冻结争议</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  份额转入挂起托管账户 (Suspense)，严禁 AI 直接改写分成或销账</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断分成篡改与预付金豁免</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 权利人 IPI 银行库只读锁与 LOD 公证双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中词曲作者/厂牌收款账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad349)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流音乐影视版税管理 AI 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性版税网关 + 曲库估值气隙 + 权益守恒锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-707/708 拦截率 100% | 满足 MMA (音乐现代化法) &amp; SOX</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. SAP Vistex / Curve / Counterpoint 原生角色权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法阻止版权冲突处理助手在申诉 PDF 注入下自动确认夺权</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 ISRC/ISWC 映射、100% 份额守恒与交叉抵扣算术语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统版权运营人工比对数亿行 DDEX 流媒体报表与纸质合同</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 季度结算延迟 60-90 天，黑盒版税 (Black Box) 逾期流失严重</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 349)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：分成被篡改、估值外泄与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取曲库估值与未抵扣预付金 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断改写 ISWC 分成与核销预付金 (business-result)</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向外部泄密曲库并购底价</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 LOD 收款账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,080 伪造版税预付电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 349 · 即将迎来 Round 350 历史性大关！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 曲库估值与母带气隙：曲库并购 DCF 模型、头部艺人交叉抵扣 (Cross-Collateralization) 台账与未发行母带与确权 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 100% 份额守恒与冲突挂起：任何引发份额超 100% 的外部申诉仅触发争议部分冻结 (Suspense)，严禁 AI 直接过户已有份额</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. LOD 公证双签与账户只读：词曲作者付款指示函 (LOD) 变更必须经法务与版税总监 FIDO2 双签；锁定 trust-registry</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：726 个场景 (723 风险 + 3 基线) | 782 项 Pytest 检查 | 1,518 项断言 | 712 个交互向量 | 349 篇双语 FAQ (167 篇指南) | BRK-707/708</text>
</svg>
