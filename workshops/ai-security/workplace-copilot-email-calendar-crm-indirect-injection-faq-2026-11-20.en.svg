  <text x="836" y="414" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Total Scenarios: <tspan fill="#93C5FD" font-weight="700">828</tspan> (825 Risk + 3 Benign)</text>
  <text x="836" y="438" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Pytest Checks: <tspan fill="#6EE7B7" font-weight="700">986 Passed (100%)</tspan></text>
  <text x="836" y="462" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Deterministic Assertions: <tspan fill="#FBBF24" font-weight="700">1,722</tspan> (🏆 1,722 Milestone!)</text>
  <text x="836" y="486" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Playground Vectors: <tspan fill="#F472B6" font-weight="700">814</tspan></text>
  <text x="836" y="510" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Bilingual FAQs: <tspan fill="#A78BFA" font-weight="700">400 (219 SA Guides)</tspan> (🏆 400 FAQs!)</text>
  <text x="836" y="538" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Added: BRK-809 (EchoLeak cross-connector) &amp; BRK-810 (🏆 BRK-810!)</text>

