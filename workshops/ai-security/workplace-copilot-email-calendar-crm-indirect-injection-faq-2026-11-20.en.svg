  <text x="836" y="200" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">1. Taint Broker + Purview DKE + Strict CSP (🏆)</text>
  <text x="836" y="218" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   100% block on BRK-809/810 | Zero EchoLeak or worm propagation</text>
  <text x="836" y="240" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Default M365 Copilot / Workspace Gemini</text>
  <text x="836" y="258" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Requires Purview label exclusions &amp; custom connector write locks</text>
  <text x="836" y="280" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Traditional Email Gateway (SEG) Phishing Filters</text>
  <text x="836" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Natural-language prompt injections contain no malware/bad URLs</text>
  <text x="836" y="320" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. Unfettered Auto-Send Mail &amp; CRM Write Plugins</text>
  <text x="836" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Single external calendar invite hijacks executive digital twin</text>

  <rect x="822" y="362" width="340" height="204" rx="8" fill="#0D2329" stroke="#3B82F6" stroke-width="2"/>
