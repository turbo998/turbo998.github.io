<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg28" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="redCard28" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#450A0A" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="greenCard28" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg28)" rx="16"/>
  <rect x="20" y="18" width="1160" height="78" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="42" y="48" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="800">Round 28 架构选型 FAQ：多云/跨区域 AI Agent 灾备切换防脑裂双花 vs. 单调世代围栏 + 幂等哈希锁</text>
  <text x="42" y="76" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">主备脑裂双写 (Split-Brain) · 跨区重试参数掉包 · 异步复制污点丢失 · Kleppmann Epoch Fencing · 84 场景 / 234 断言通过</text>
  <rect x="1000" y="32" width="160" height="46" rx="8" fill="#065F46" stroke="#10B981" stroke-width="1.5"/>
  <text x="1080" y="53" text-anchor="middle" fill="#ECFDF5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Hardened ASR: 0.0%</text>
  <text x="1080" y="70" text-anchor="middle" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11">P50 0.0248ms (n=200)</text>

  <!-- Left Column -->
  <rect x="20" y="112" width="565" height="410" rx="12" fill="url(#redCard28)" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="142" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="16" font-weight="800">❌ 脆弱跨区灾备架构（无 Epoch 围栏 + 异步分离同步污点标签）</text>

  <rect x="42" y="158" width="520" height="104" rx="8" fill="#1E293B" stroke="#7F1D1D" stroke-width="1.2"/>
  <text x="58" y="182" fill="#F87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. 主备切换脑裂双写与重试窗口掉包 (DR-SPLITBRAIN-DOUBLE-SPEND-69)</text>
  <text x="58" y="204" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 主区 Region A 网络抖动 4 秒触发切换至备区 Region B，随后旧主区恢复继续提交</text>
  <text x="58" y="224" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 攻击者趁跨区重试窗口复用 step-0000 幂等键，将载荷掉包为 $2,400 加急结算</text>
  <text x="58" y="244" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• 无世代围栏与哈希锁时，主备脑裂双写且 $2,400 越权结算直接穿透！</text>

  <rect x="42" y="274" width="520" height="104" rx="8" fill="#1E293B" stroke="#7F1D1D" stroke-width="1.2"/>
  <text x="58" y="298" fill="#F87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. 异步复制延迟“污点洗白”与灾备区泄密 (DR-REPL-LAG-TAINT-STRIP-70)</text>
  <text x="58" y="320" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 对话历史已同步至灾备区，但异步 Redis 污点流存在 1 秒复制延迟 (RPO &gt; 0)</text>
  <text x="58" y="340" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 攻击者诱导主区限流切往备区，趁污点未到达窗口覆写核查结论并外发 $120k 底价</text>
  <text x="58" y="360" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• 灾备切换瞬间变成绕过污点追踪与窃取核心商业机密的逃逸通道！</text>

  <rect x="42" y="390" width="520" height="114" rx="8" fill="#1E293B" stroke="#7F1D1D" stroke-width="1.2"/>
  <text x="58" y="414" fill="#F87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. 为什么有状态工具调用 Agent 绝不能照搬“无状态问答跨区重试”？</text>
  <text x="58" y="436" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• Kleppmann 定理：分布式锁过期后旧 Worker 并不自知，必须由资源端校验世代号</text>
  <text x="58" y="456" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 只校验 step_id 不校验 SHA-256 request_hash 会让跨区重试沦为参数掉包后门</text>
  <text x="58" y="482" fill="#EF4444" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Baseline 结果：灾备区结论被篡改 + $120k 底价外泄 + $2,400 双花失守 (ASR 75.0%)</text>

  <!-- Right Column -->
  <rect x="615" y="112" width="565" height="410" rx="12" fill="url(#greenCard28)" stroke="#10B981" stroke-width="1.5"/>
  <text x="637" y="142" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="16" font-weight="800">✅ 强一致世代围栏 (Epoch Fencing) + 幂等哈希锁 + 零信任能力网关</text>

  <rect x="637" y="158" width="520" height="104" rx="8" fill="#1E293B" stroke="#065F46" stroke-width="1.2"/>
  <text x="653" y="182" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">防线 1：单调递增世代围栏令牌 (Monotonic Epoch Fencing Token)</text>
  <text x="653" y="204" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 灾备切换 (Pause/Resume) 原子递增 run.epoch (stale_epoch -&gt; active_epoch)</text>
  <text x="653" y="224" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 旧主区 Region A 恢复后携 stale_epoch 发起的任何工具调用立即抛 Conflict 秒拒</text>
  <text x="653" y="244" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• 从数学上 100% 根除网络分区与 GC 停顿引发的主备脑裂双写！</text>

  <rect x="637" y="274" width="520" height="104" rx="8" fill="#1E293B" stroke="#065F46" stroke-width="1.2"/>
  <text x="653" y="298" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">防线 2：全局幂等账本钉扎 SHA-256 request_hash + 原发起人结算门禁</text>
  <text x="653" y="320" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 每个 operation_id (step-0000) 强绑定完整决策参数的 SHA-256 request_hash</text>
  <text x="653" y="340" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 合法跨区重试幂等返回缓存收据；篡改参数重放立即抛出 Conflict 异常</text>
  <text x="653" y="360" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• 外部诱导的 $2,400 跨区结算被 original-requester-payment 100% 阻断！</text>

  <rect x="637" y="390" width="520" height="114" rx="8" fill="#1E293B" stroke="#065F46" stroke-width="1.2"/>
  <text x="653" y="414" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">防线 3：事务内联污点持久化 (Fail-Closed Atomic Taint Persistence)</text>
  <text x="653" y="436" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• untrusted 污点与 requester 血统与工作流 Checkpoint 存储在同一原子 WAL 事务</text>
  <text x="653" y="456" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 灾备区接管后 0.0248ms 持续执行 record-owner、untrusted-write 与零外泄边界</text>
  <text x="653" y="482" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Hardened 结果：BRK-65 / BRK-66 100% 阻断 · 0 脑裂双花 · 0 污点丢失</text>

  <!-- Bottom Bar -->
  <rect x="20" y="538" width="1160" height="122" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="42" y="566" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">🧭 AI 解决方案架构师选型铁律与实测性能口径（Provenance-Sealed）</text>
  <text x="42" y="592" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12.5">• 只读问答：无状态多活就近路由  |  • 内部批处理：温备切换  |  • 金融结算与核心生产 Agent：单调 Epoch 围栏 + request_hash 幂等锁 + Capability Broker</text>
  <text x="42" y="616" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12.5">• 本地实测延迟 (measured, independently_reproduced=true)：纯内存门禁 P50 = 0.0248 ms / P95 = 0.0409 ms (n=200 全量原始样本封存)；单步含 SQLite WAL 落盘 P50 = 7.21 ms (n=50)</text>
  <text x="42" y="640" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• 评测验证：tests/test_regressions.py 新增 BRK-65 (DR-SPLITBRAIN-DOUBLE-SPEND-69) 与 BRK-66 (DR-REPL-LAG-TAINT-STRIP-70)，全仓 84 场景 / 234 项 Pytest 100% 通过</text>
</svg>
