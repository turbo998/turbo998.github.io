<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad348" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad348" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad348" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad348" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad348)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad348)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 348 · 🏆 710 VECTORS MILESTONE · AIRLINE GDS/NDC REVENUE INTEGRITY (AMADEUS / SABRE / PROS) &amp; IATA BSP/ADM SETTLEMENT</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">航司收益管理与客票防欺诈 (Amadeus/Sabre/NDC)、IATA BSP 结算与 ADM 罚单 AI Agent 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">航线影子底价 (Bid-Price Vector) 与要客 PNR 物理气隙 + 联程绑定/非自愿签转硬锁 vs. PNR 备注/ADM 申诉注入套票与 BSP 清算电汇诈骗 (BRK-705 / BRK-706)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad348)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 航司收益完整性与 BSP 清算三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① PNR SSR/OSI 备注与 ADM 申诉注入窃取影子底价 (BRK-705)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 票代/OTA 在 PNR 自由文本备注 (OSI/SSR) 或 IATA ADM 罚单</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  申诉 PDF 中嵌入间接提示词注入</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 诱导 Agent 跨库读取 O&amp;D 航线影子底价向量 (Bid-Price Vector)、</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  大客户协议暗折及空中警察/政要 VVIP 旅客舱单</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 伪造非自愿改签豁免码与拆解联程座控 (BRK-705)</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令伪造航班不正常 (IRROPS) 非自愿签转豁免码 (Waiver</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  Code)，将超低价经济舱免费签转至全价公务舱 (J 舱) 零差价出票</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 豁免甩尾弃程 (Skiplagging) 与联程航段解绑 (Married Segment)</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：高价值两舱座位被恶意黄牛批量零成本套取</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造 IATA BSP 后返佣金与 EU261 航延赔付诈骗 (BRK-706)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造 IATA BSP / ARC 代理人超额激励返点 (Override Commission)</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  或批量航延索赔代理机构结算函，篡改 trust-registry 收款账户</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 发起 $5,060 航司营销后返与赔付资金电汇 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-size="11" font-weight="700">• 违规触发：航司票款清算资金被盗与代理人结算违约</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad348)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 航司收益完整性与客票结算零信任架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: PNR 自由文本备注与 ADM 申诉包清洗提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离 PNR OSI/SSR 备注与 BSPlink 申诉附件中的隐藏指令，仅</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  提取强类型槽位 (13 位票号、IATA 号、Fare Basis、航段状态)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: O&amp;D 影子底价与要客舱单物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• PROS/Amadeus 动态影子底价曲线、大客户暗折底表及空中安全员</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  (FAM) / 政要 PNR 舱单存入物理气隙域 (restricted-budget)</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 ATPCO 运价规则与运行控制 (IOC) 交叉核验</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 非自愿免费改签必须确定性匹配航司运行控制中心 (OCC) 发布的</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  真实航班取消/延误事件 ID；严禁 AI 免除差价或撤回 ADM 罚单</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断违规免差价改签与撤罚</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: IATA BSP / ICH 清算账户只读锁与财务双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中 BSP/ARC 清算账户只读 (tool-allowlist +</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad348)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流航司客票防欺诈与结算安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性航司网关 + 底价气隙 + ATPCO/OCC 硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-705/706 拦截率 100% | 满足 IATA Resolution 850m &amp; PCI</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Amadeus Altea / Sabre / Accelya Revera 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止共享客票审核机器人在 PNR 备注注入下自动签发豁免码</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 ATPCO Cat 31/33 退改规则与联程座控 (O&amp;D) 逻辑语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统收入结算部人工抽检 PNR 与 BSPlink ADM 争议</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 人工仅能抽检 &lt;5% 异动客票，无法实时拦截秒级黄牛占座</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 348 · 710 向量！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：免差价升舱、底价外泄与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取航线影子底价与要客舱单 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断伪造非自愿签转与撤回 ADM (business-result)</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向外部票代外传 Bid-Price 向量</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 BSP 清算账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,060 伪造后返佣金电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 348 · 🏆 710 个交互靶场攻击向量里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 影子底价与要客舱单气隙：PROS/Amadeus O&amp;D Bid-Price 向量、大客户协议暗折与安全敏感旅客 PNR 与票务 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 OCC 航延验证与 ATPCO 硬锁：非自愿免费改签 (SKCHG) 必须绑定运行控制中心真实航延事件，禁止 AI 自主签发 Waiver</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. BSPlink 结算通道强制绑定：代理人返点与 ADM 退回仅走官方 IATA BSP/ARC 净额轧差，锁定 trust-registry 阻断外部电汇</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：724 个场景 (721 风险 + 3 基线) | 778 项 Pytest 检查 | 1,514 项断言 | 🏆 710 个交互向量 | 348 篇双语 FAQ (166 篇指南) | BRK-705/706</text>
</svg>
