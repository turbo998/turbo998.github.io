<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad345" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad345" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad345" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad345" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad345)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad345)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 345 · 🏆 345-FAQ, BRK-700 &amp; 1,502-ASSERTION HISTORIC MILESTONE · CHAPTER 11 CLAIMS (EPIQ / KROLL / STRETTO) &amp; DIP WATERFALL</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业破产重整 (Chapter 11)、债权申报审核 (Kroll/Epiq) 与清偿瀑布 AI Agent 安全选型指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">§363 假马竞标估值底稿与清算回收模型物理气隙 + 绝对优先权顺位硬锁 vs. Form 410 债权注入提级与 Rule 3001(e) 债权转让电汇诈骗 (BRK-699 / BRK-700)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad345)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业债务重整与债权清偿三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① Form 410 债权申报注入窃取 §363 假马底价 (BRK-699)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 不良债权对冲基金上传的 Official Form 410 债权凭证 PDF</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  夹带隐藏提示词注入</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 诱导 Agent 跨库读取 §363 资产出售假马竞标保留底价 (Stalking</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  Horse Floor) 与 Chapter 7 清算回收率测算底稿</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 篡改绝对优先权顺位升格普通无担保债权 (BRK-699)</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令将存在争议的普通无担保债权 (GUC) 违规升格为</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  §503(b)(9) 破产前 20 日货物共益优先债权并豁免债务人异议</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 按 100 美分全额清偿而非无担保债权池的 8 美分清偿率</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：违反破产法 §1129 绝对优先原则与 DIP 贷款契约</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造 Rule 3001(e) 债权转让通知电汇诈骗 (BRK-700)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造破产债权二级市场交易转让通知 (Transfer of Claim)</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 中官方债权登记簿 (Claims Register) 收款</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">  IBAN，并发起 $5,000 重整计划清偿分配电汇 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-size="11" font-weight="700">• 违规触发：破产财产信托资金被盗与受托人连带赔偿责任</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad345)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 破产重整与清偿瀑布零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: Form 410 债权凭证清洗与强类型槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离债权附件 PDF 中的隐藏指令，仅提取结构化槽位 (债权人</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  税号、破产申请日前后收货时间戳、POD 签收单号、申报金额)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: §363 竞标底价与清算模型物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 财务顾问 (CRO/FA) 的 §363 资产出售保留价、DIP 预算底稿与</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  清算瀑布模型存入物理气隙域 (restricted-budget)</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 §503(b)(9) 时间窗对账与顺位锁定</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 仅当 ERP 收货时间戳严格落在 [Petition_Date - 20d, Petition_Date)</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  且为有形货物时才允许标记 503(b)(9) 候选；严禁 AI 直接确权</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断非授权债权提级与核准</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 官方债权登记簿只读锁与 21 日法定异议期</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中债权收款账户只读 (tool-allowlist + fixed-</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  business-output) + original-requester-payment 拦截未授权分配</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad345)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流破产债权管理 AI 安全方案选型对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性重整网关 + §363 估值气隙 + 顺位硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-699/700 拦截率 100% | 满足美国联邦破产受托人审计</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Kroll / Epiq / Stretto 原生案件门户权限 + 电子卷宗</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法阻止共享对账助手在债权附件注入下改写建议清偿顺位</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备破产申请日 (Petition Date) 截点与 §503(b)(9) 规则语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 重整律所与财务顾问团队纯人工逐份核对数万份 Form 410</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 专业律所每小时费率 $1,000+，侵蚀破产财产清偿池</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 345 · 1,502 断言！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：债权违规提级、底价外泄与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取 §363 假马竞标底价 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断将无担保债权升格为 503(b)(9) (business-result)</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向秃鹫基金外传清算回收模型</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定官方债权登记簿</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,000 伪造清偿分配电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 345 · 🏆 345 篇 FAQ、BRK-700 &amp; 1,502 项断言三大历史性里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 估值与清算模型气隙：§363 资产出售保留价、DIP 融资契约底稿与清算分析模型与外部债权申报解析 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性破产截点对账：Pre-Petition 与 Post-Petition 债权分界及 §503(b)(9) 20 日窗口由 ERP 收货时间戳确定性判定</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 法院命令与 CRO 双签：债权顺位确认、Rule 3001(e) 转让登记与清偿划拨必须经首席重整官 (CRO) 与破产法院命令哈希校验</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：718 个场景 (715 风险 + 3 基线) | 766 项 Pytest 检查 | 🏆 1,502 项断言 | 704 个交互向量 | 🏆 345 篇双语 FAQ (163 篇指南) | 🏆 BRK-699/700</text>
</svg>
