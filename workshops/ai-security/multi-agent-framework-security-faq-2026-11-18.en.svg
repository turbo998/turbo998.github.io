  <rect x="630" y="202" width="522" height="84" rx="10" fill="#1e293b" stroke="#065f46" stroke-width="1"/>
  <text x="646" y="226" fill="#6ee7b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">Control 1: Framework Selection &amp; Global Pre-Tool Middleware</text>
  <text x="646" y="248" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Production Core: Microsoft Agent Framework (FunctionInvocationFilter + Checkpoints)</text>
  <text x="646" y="268" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• State Graphs: LangGraph | CrewAI: allow_delegation=False | OpenAI SDK: handoff filters</text>

  <rect x="630" y="298" width="522" height="84" rx="10" fill="#1e293b" stroke="#065f46" stroke-width="1"/>
  <text x="646" y="322" fill="#6ee7b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">Control 2: Private Principal Contexts &amp; Originator Envelope Pinning</text>
  <text x="646" y="344" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Scope read_record outputs strictly to target_agent (never broadcast to group chat)</text>
  <text x="646" y="364" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Pin original_requester &amp; taint across handoffs, blocking $3,900 wires in 0.0248ms</text>

  <rect x="630" y="394" width="522" height="84" rx="10" fill="#1e293b" stroke="#065f46" stroke-width="1"/>
  <text x="646" y="418" fill="#6ee7b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">Control 3: Monotonic Epoch Locks &amp; Atomic Checkpoint Clearing</text>
  <text x="646" y="440" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Increment epoch &amp; null out pending checkpoint_id on Pause/Cancel/Approval decisions</text>
  <text x="646" y="460" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Enforce max_hops &amp; per-requester-fanout&lt;=5 circuit breakers against infinite loops</text>

