  <text x="54" y="54" fill="#38bdf8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">CLOUD &amp; AI SOLUTION ARCHITECT · 2026-11-18 ROUND 239 · MULTI-AGENT ORCHESTRATION SELECTION</text>
  <text x="54" y="84" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="800">Multi-Agent Frameworks: Microsoft Agent Framework vs. LangGraph vs. CrewAI vs. OpenAI SDK</text>
  <text x="54" y="106" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Modeled on ib-vs-ethernet-roce-selection-faq.md · 506 Scenarios &amp; 1,078 Pytest Assertions · Private Contexts + Epoch Checkpoints + 0.0248ms Broker</text>

  <!-- Left Column: Multi-Agent Framework Pitfalls -->
  <rect x="32" y="132" width="554" height="360" rx="14" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="48" y="148" width="522" height="40" rx="8" fill="url(#red239e)"/>
  <text x="64" y="174" fill="#fecaca" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700">❌ 3 Default Multi-Agent Orchestration Vulnerabilities</text>

  <rect x="48" y="202" width="522" height="84" rx="10" fill="#27272a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="64" y="226" fill="#fca5a5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">1. Shared GroupChat / Flat MessagesState Blackboard Leakage</text>
  <text x="64" y="248" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Privileged Finance Agent reads restricted-budget into a global shared message buffer</text>
  <text x="64" y="268" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Low-privilege external-facing agents read the shared buffer and leak M&amp;A secrets</text>

  <rect x="48" y="298" width="522" height="84" rx="10" fill="#27272a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="64" y="322" fill="#fca5a5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">2. Unconstrained Delegation (allow_delegation=True) &amp; Handoff Laundering</text>
  <text x="64" y="344" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Prompt-injected Triage Agent freely delegates or hands off tasks to Finance Agent</text>
  <text x="64" y="364" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Without originator pinning, Finance Agent executes $3,900 wire under internal authority</text>

  <rect x="48" y="394" width="522" height="84" rx="10" fill="#27272a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="64" y="418" fill="#fca5a5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">3. Async Checkpoint Race Resurrecting Rejected High-Risk Actions</text>
  <text x="64" y="440" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Delayed FileCheckpointStorage save overwrites state after Pause or HITL rejection</text>
  <text x="64" y="460" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Restores invalidated approval pointers and executes unauthorized trust/payment actions</text>

  <!-- Right Column: 4-Framework Hardening + Capability Broker -->
  <rect x="614" y="132" width="554" height="360" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
