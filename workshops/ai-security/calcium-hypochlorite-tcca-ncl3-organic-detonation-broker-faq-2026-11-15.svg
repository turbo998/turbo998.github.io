  <rect x="632" y="176" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">1. 物理层：两剂厂房/除尘 100% 物理分家 + NH4+&lt;=10ppm 锁 + &lt;=115°C 干燥</text>
  <text x="646" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• Ca(ClO)2 与 TCCA 独立厂房、独立压片机、独立除尘器，零连通管线根绝交叉混料</text>
  <text x="646" y="240" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 氰尿酸进料 NH4+&gt;10ppm &lt;100ms 关阀防生成 NCl3；干燥器 &lt;=115°C 封顶 + 水幕淹没</text>
  <text x="646" y="260" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 压片冲模 100% 超声波脱脂 + BAM 认证全氟聚醚 (PFPE) 无油润滑哈氏合金模具</text>

  <rect x="632" y="290" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="312" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">2. 控制层：untrusted-write 污点阻断 + record-owner 气隙配方隔离</text>
  <text x="646" y="334" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 外部 HG/T 3263 化验单进入会话自动标记 untrusted=True，0.0248ms 拦截 write_record</text>
  <text x="646" y="354" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 无硼长效缓释包芯消毒片库 restricted-budget 仅限 owner 访问</text>
  <text x="646" y="374" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• restricted-data-boundary 100% 阻断向外部 supplier 外发任何氯化消毒剂核心参数</text>

  <rect x="632" y="404" width="522" height="108" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="426" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">3. 供应链层：BAM 无油脱脂哈氏合金冲模 AVL 锁死 + original-requester-payment</text>
  <text x="646" y="448" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• tool-allowlist 移除排程 Agent 的 update_trust 工具；fixed-business-output 锁死名录</text>
  <text x="646" y="468" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 强制校验 requester == user 硬件密钥签名，拦截外部急件单诱导的 $4,990 电汇</text>
  <text x="646" y="488" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 回归测试：test_round169_calcium_hypochlorite_* (4/4 PASSED · 总计 798/798 PASSED!)</text>

