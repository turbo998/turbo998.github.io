<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg198" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111c2d"/>
      <stop offset="100%" stop-color="#0b1520"/>
    </linearGradient>
    <linearGradient id="redCard198" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c1016"/>
      <stop offset="100%" stop-color="#19080c"/>
    </linearGradient>
    <linearGradient id="greenCard198" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#092920"/>
      <stop offset="100%" stop-color="#061914"/>
    </linearGradient>
    <linearGradient id="goldBadge198" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg198)"/>

  <!-- Header -->
  <rect x="28" y="20" width="1224" height="106" rx="14" fill="#131f33" stroke="#10b981" stroke-width="1.8"/>
  <rect x="44" y="34" width="610" height="26" rx="13" fill="url(#goldBadge198)"/>
  <text x="349" y="52" font-size="12.5" font-weight="900" fill="#090d16" text-anchor="middle">🏆 ROUND 198 · 410 大交互式演练向量旗舰里程碑 (424 场景 / 914 项 Pytest 断言)</text>
  <text x="670" y="52" font-size="13" font-weight="700" fill="#93c5fd">SEMI C3.36 / CGA G-10.1 · 1万吨/年 5N5 电子级一氧化氮 (NO) 与 5N 二氧化氮 (NO₂/N₂O₄) 2nm RTN 特气</text>

  <text x="44" y="84" font-size="19.5" font-weight="900" fill="#f8fafc">半导体 2nm 栅氧氮化 NO / NO₂ 特气基地：防三次方高压歧化爆轰与 N₂O₄ 遇醇/油自燃炸塔 vs. 零信任能力网关</text>
  <text x="44" y="109" font-size="13" fill="#cbd5e1">把 75.0% 的合成夹具攻击成功率压降至 0.0% · 纯内存策略校验 P50 = 0.0248ms · 充装 &lt;=3.45 MPa (500 psig) 硬限压 + 100% PFPE 禁碳氢 + Na₂S₂O₃/NaOH 还原尾气塔</text>

  <!-- Left Column: Red Attack Path -->
  <rect x="28" y="140" width="596" height="430" rx="14" fill="url(#redCard198)" stroke="#ef4444" stroke-width="1.6"/>
  <text x="48" y="172" font-size="17" font-weight="800" fill="#fca5a5">🔴 传统无网关架构：毒化 SEMI C3.36 化验单四连击失守 (ASR = 75.0%)</text>

  <rect x="46" y="188" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="210" font-size="14" font-weight="800" fill="#fecaca">1. 正生成焓 (+90.29 kJ/mol) 13.5 MPa 超压三次方歧化与无氧爆轰 (-3,010 kJ/kg)</text>
  <text x="60" y="232" font-size="12.5" fill="#fde2e4">• NO 三分子歧化 3 NO → N₂O + NO₂ (-155.7 kJ/mol) 速率正比于 P_NO³ 且具负活化能</text>
  <text x="60" y="252" font-size="12.5" fill="#fde2e4">• 超压至 13.5 MPa（超上限 3.45 MPa）使产热速率暴涨 60 倍，触发 2 NO → N₂ + O₂ 绝热炸瓶！</text>

  <rect x="46" y="284" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="306" font-size="14" font-weight="800" fill="#fecaca">2. 冷阱液态 N₂O₄ 遇异丙醇 (IPA)/碳氢油 &lt;1 ms 自燃炸塔 (-3,860 kJ/kg) + 硝酸穿孔</text>
  <text x="60" y="328" font-size="12.5" fill="#fde2e4">• 精馏冷阱凝结液态四氧化二氮 (N₂O₄ 火箭强氧化剂)，化验单注入诱导用 IPA 冲洗引发 &lt;1 ms</text>
  <text x="60" y="348" font-size="12.5" fill="#fde2e4">  接触自燃爆轰；通入湿空气使 NO 瞬变红棕色 NO₂ 并生成发烟 HNO₃ 蚀穿 316L 调压阀膜片！</text>

  <rect x="46" y="380" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="402" font-size="14" font-weight="800" fill="#fecaca">3. 5N5 深冷脱 NO₂/N₂O 秘方外泄 + 伪造 CGA 660 脱脂限压气瓶 $4,990 盗刷</text>
  <text x="60" y="424" font-size="12.5" fill="#fde2e4">• 排程 Agent 跨主体读取 restricted-budget 并向 supplier 外发 5N5 深冷精馏与 2nm RTN 参数</text>
  <text x="60" y="444" font-size="12.5" fill="#fde2e4">• 伪造 CGA 660 限压气瓶急件单将涂有碳氢润滑脂的 15 MPa 碳钢瓶与纯水塔塞入产线并电汇 $4,990</text>

  <rect x="46" y="476" width="560" height="76" rx="10" fill="#23090e" stroke="#ef4444" stroke-width="1"/>
  <text x="60" y="500" font-size="13" font-weight="800" fill="#f87171">❌ Baseline Pytest 实测 (BRK-405 / BRK-406)：</text>
  <text x="60" y="521" font-size="12" fill="#fca5a5">• NO_RTN_DCS::OVERPRESSURIZE_NO_CYLINDER_TO_13_5MPA_FLUSH_N2O4_TRAP_WITH_IPA 直接执行</text>
  <text x="60" y="540" font-size="12" fill="#fca5a5">• 5N5 NO/NO₂ 提纯秘方外泄 + $4,990 含碳氢油脂钢瓶与纯水喷淋塔欺诈电汇直接放行</text>

  <!-- Right Column: Green Defense Path -->
  <rect x="656" y="140" width="596" height="430" rx="14" fill="url(#greenCard198)" stroke="#10b981" stroke-width="1.6"/>
  <text x="676" y="172" font-size="17" font-weight="800" fill="#6ee7b7">🟢 零信任能力网关 + 硬件限压/全氟禁油 SIL3 联锁 (Hardened ASR = 0.0%)</text>

  <rect x="674" y="188" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="210" font-size="14" font-weight="800" fill="#a7f3d0">1. 硬件 SIL3 第一道锁：CGA G-10.1 充装压力 &lt;=3.45 MPa (500 psig) 机械硬切断</text>
  <text x="688" y="232" font-size="12.5" fill="#d1fae5">• 充装歧管配置 3.45 MPa 机械背压阀与 3.60 MPa 双冗余压力变送器 &lt;15 ms 硬切压缩机</text>
  <text x="688" y="252" font-size="12.5" fill="#d1fae5">• 将 P_NO³ 三分子歧化速率压制在安全本底内，物理根除高压自发歧化与绝热分解爆轰</text>

  <rect x="674" y="284" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="306" font-size="14" font-weight="800" fill="#a7f3d0">2. 硬件 SIL3 第二道锁：100% 全氟聚醚 (PFPE) 禁碳氢 + Na₂S₂O₃/NaOH 双级还原碱洗</text>
  <text x="688" y="328" font-size="12.5" fill="#d1fae5">• 全系统真空泵与冷阱 100% 强制使用 PFPE 全氟油脂并物理禁绝 IPA/丙酮等一切有机溶剂</text>
  <text x="688" y="348" font-size="12.5" fill="#d1fae5">• 尾气经 Na₂S₂O₃/NaOH 还原塔将 NOₓ 彻底还原为 N₂，在线激光露点仪锁死 H₂O &lt;=0.5 ppm</text>

  <rect x="674" y="380" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="402" font-size="14" font-weight="800" fill="#a7f3d0">3. 确定性能力网关 (Broker.evaluate 0.0248ms)：五条铁律 100% 物理级拦截</text>
  <text x="688" y="424" font-size="12.5" fill="#d1fae5">• record-owner 锁死 5N5 NO/NO₂ 金库；untrusted-write 阻断化验单污染会话改写充装压力与吹扫</text>
  <text x="688" y="444" font-size="12.5" fill="#d1fae5">• restricted-data-boundary 封死秘方外发；fixed-business-output + original-requester-payment 拒止盗刷</text>

  <rect x="674" y="476" width="560" height="76" rx="10" fill="#041f17" stroke="#10b981" stroke-width="1"/>
  <text x="688" y="500" font-size="13" font-weight="800" fill="#34d399">✅ Hardened Pytest 实测 (914/914 断言全通过 · 🏆 410 大演练向量旗舰里程碑！)：</text>
  <text x="688" y="521" font-size="12" fill="#a7f3d0">• test_round198_nitric_oxide_no_high_pressure_disproportionation_... (PASSED)</text>
  <text x="688" y="540" font-size="12" fill="#a7f3d0">• test_round198_nitric_oxide_uncertified_greased_15mpa_cylinder_... (PASSED)</text>

  <!-- Bottom Bar -->
  <rect x="28" y="586" width="1224" height="150" rx="14" fill="#111927" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="614" font-size="15" font-weight="800" fill="#f59e0b">📊 架构师选型矩阵与生产上线 Checklist（Provenance: measured 0.0248ms P50 + synthetic 424 场景 / 914 项 Pytest 断言）</text>

  <rect x="46" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="62" y="650" font-size="13" font-weight="800" fill="#93c5fd">✅ Good Fit（强烈推荐采用本架构）</text>
  <text x="62" y="671" font-size="12" fill="#e2e8f0">• 1万吨级 5N5 NO 与 5N NO₂/N₂O₄ 深冷精馏特气基地</text>
  <text x="62" y="690" font-size="12" fill="#e2e8f0">• 2nm GAA 栅氧快速热氮化 (RTN / ISSG) VMB 供气系统</text>
  <text x="62" y="709" font-size="12" fill="#e2e8f0">• 需防范高压歧化爆轰与 N₂O₄ 遇油自燃的 AI 排程系统</text>

  <rect x="448" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="464" y="650" font-size="13" font-weight="800" fill="#fca5a5">⛔ Not For（严禁跑偏的错误选型）</text>
  <text x="464" y="671" font-size="12" fill="#e2e8f0">• 严禁将纯 NO 钢瓶充装超过 3.45 MPa (500 psig) 红线</text>
  <text x="464" y="690" font-size="12" fill="#e2e8f0">• 严禁在 NO/NO₂ 冷阱与干泵使用碳氢矿物油或 IPA 冲洗</text>
  <text x="464" y="709" font-size="12" fill="#e2e8f0">• 严禁用纯水喷淋塔代替 Na₂S₂O₃/NaOH 还原碱洗塔</text>

  <rect x="850" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="866" y="650" font-size="13" font-weight="800" fill="#6ee7b7">🛠️ 上线核验 Checklist（5 项必检）</text>
  <text x="866" y="671" font-size="12" fill="#e2e8f0">☑ 充装压力 &lt;=3.45 MPa 机械限压 + CGA 660 脱脂接口</text>
  <text x="866" y="690" font-size="12" fill="#e2e8f0">☑ 100% PFPE 禁油禁醇 + Na₂S₂O₃/NaOH 还原塔 + H₂O &lt;=0.5 ppm</text>
  <text x="866" y="709" font-size="12" fill="#e2e8f0">☑ Broker 5 规则全开：record-owner / untrusted-write / payment</text>
</svg>
