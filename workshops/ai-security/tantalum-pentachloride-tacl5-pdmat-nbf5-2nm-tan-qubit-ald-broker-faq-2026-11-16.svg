  <text x="62" y="671" font-size="12" fill="#e2e8f0">• 1万吨级 7N TaCl₅/PDMAT/TBTDET 与 NbF₅ 提纯基地</text>
  <text x="62" y="690" font-size="12" fill="#e2e8f0">• 2nm BEOL TaN 铜阻挡层与超导量子芯片 α-Ta/NbTiN 外延</text>
  <text x="62" y="709" font-size="12" fill="#e2e8f0">• 需防 Ta₂O₅ 陶瓷封阀与 PDMAT 脱胺炸罐的 AI 排程系统</text>

  <rect x="448" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="464" y="650" font-size="13" font-weight="800" fill="#fca5a5">⛔ Not For（严禁跑偏的错误选型）</text>
  <text x="464" y="671" font-size="12" fill="#e2e8f0">• 严禁对 TaCl₅/NbF₅ 尾气使用水下插底鼓泡管 (&lt;1s 焊死)</text>
  <text x="464" y="690" font-size="12" fill="#e2e8f0">• 严禁将五(二甲氨基)钽 (PDMAT) 加热超过 115°C 安全红线</text>
  <text x="464" y="709" font-size="12" fill="#e2e8f0">• 严禁用外部邮件/化验单触发供应商名录变更或自动电汇</text>

  <rect x="850" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="866" y="650" font-size="13" font-weight="800" fill="#6ee7b7">🛠️ 上线核验 Checklist（5 项必检）</text>
  <text x="866" y="671" font-size="12" fill="#e2e8f0">☑ PDMAT &lt;=115°C 硬件限温锁 + 100% 物理禁水</text>
  <text x="866" y="690" font-size="12" fill="#e2e8f0">☑ 干氮气幕同心文丘里 (ΔP&gt;=+50 kPa) + 正向梯度伴热</text>
  <text x="866" y="709" font-size="12" fill="#e2e8f0">☑ Broker 5 规则全开：record-owner / untrusted-write / payment</text>
