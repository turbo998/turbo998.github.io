  <rect width="1400" height="860" fill="url(#bg254)"/>
  <rect x="30" y="24" width="1340" height="8" rx="4" fill="url(#accent254)"/>

  <!-- Header -->
  <text x="45" y="68" fill="#34d399" font-size="15" font-weight="700" letter-spacing="1.5">AI SOLUTION ARCHITECT · 2026-11-18 ROUND 254 · HEALTHCARE, CLINICAL EHR (HL7 FHIR) &amp; CLAIMS AI SECURITY FAQ</text>
  <text x="45" y="104" fill="#f8fafc" font-size="24" font-weight="800">医疗健康与商保理赔 AI 安全选型：SMART on FHIR + HIPAA 18项脱敏 + 医嘱草稿隔离与能力网关</text>
  <text x="45" y="132" fill="#94a3b8" font-size="14">解决医院/药企/健康险三大红线：跨患者调阅 VIP 病历与临床试验盲底、外部转诊单/理赔发票提示词注入骗保、以及 AI 剂量幻觉无签名直发医嘱</text>

  <!-- KPI Badges -->
  <rect x="1015" y="46" width="350" height="84" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="1190" y="72" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="800">536 场景 · 1,138 断言 · 522 向量 · 254 FAQ</text>
  <text x="1190" y="96" text-anchor="middle" fill="#4ade80" font-size="19" font-weight="800">ASR: 75.0% ➔ 0.0% (0.0248ms)</text>
  <text x="1190" y="116" text-anchor="middle" fill="#94a3b8" font-size="11">BRK-517 &amp; BRK-518 · SMART on FHIR + Broker</text>

  <!-- Section 1 -->
  <text x="45" y="172" fill="#e2e8f0" font-size="17" font-weight="700">1. 医疗临床与商保理赔 AI 四大安全支柱选型矩阵（权限绑定 vs. 脱敏合规 vs. 事实核查 vs. 动作门禁）</text>

  <!-- Card 1 -->
  <rect x="45" y="186" width="315" height="235" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="216" fill="#60a5fa" font-size="15.5" font-weight="800">🔵 SMART on FHIR 患者锁定</text>
  <text x="62" y="238" fill="#bfdbfe" font-size="11.5" font-weight="600">Azure Health Data Services (launch/patient)</text>
  <text x="62" y="264" fill="#e2e8f0" font-size="11.5">• 致命坑：全院共享服务号允许 Agent 查任意患者</text>
  <text x="62" y="286" fill="#e2e8f0" font-size="11.5">• 正解：OAuth Token 硬编码当前就诊 patient_id</text>
  <text x="62" y="308" fill="#e2e8f0" font-size="11.5">• 加固：从 LLM 工具 Schema 物理剔除 patient_id</text>
  <rect x="62" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <text x="74" y="352" fill="#93c5fd" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="74" y="370" fill="#cbd5e1" font-size="11">门诊病历生成助手必选，从令牌层物理</text>
  <text x="74" y="388" fill="#cbd5e1" font-size="11">杜绝跨科室窥探 VIP 病历与精神科档案！</text>

  <!-- Card 2 -->
  <rect x="378" y="186" width="315" height="235" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1.8"/>
  <text x="395" y="216" fill="#c084fc" font-size="15.5" font-weight="800">🟣 HIPAA 18 项自动脱敏服务</text>
  <text x="395" y="238" fill="#e9d5ff" font-size="11.5" font-weight="600">Azure Health De-ID Service / Presidio</text>
  <text x="395" y="264" fill="#e2e8f0" font-size="11.5">• 机制：代理替换 (Surrogate) 姓名/身份证/MRN</text>
  <text x="395" y="286" fill="#e2e8f0" font-size="11.5">• 日期偏移：同一患者所有日期等距偏移保留病程差</text>
  <text x="395" y="308" fill="#e2e8f0" font-size="11.5">• 适用：临床科研筛选、模型评测与日志落盘</text>
  <rect x="395" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="407" y="352" fill="#d8b4fe" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="407" y="370" fill="#cbd5e1" font-size="11">既满足 HIPAA Safe Harbor 与个保法要求，</text>
  <text x="407" y="388" fill="#cbd5e1" font-size="11">又不破坏大模型分析术后第几天并发症的逻辑。</text>

  <!-- Card 3 -->
  <rect x="711" y="186" width="315" height="235" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="728" y="216" fill="#fbbf24" font-size="15.5" font-weight="800">🟠 医疗事实性核查与草稿锁</text>
  <text x="728" y="238" fill="#fde68a" font-size="11.5" font-weight="600">Groundedness Detection + status="draft"</text>
  <text x="728" y="264" fill="#e2e8f0" font-size="11.5">• 风险：AI 编造患者过敏史或写错胰岛素单位</text>
  <text x="728" y="286" fill="#e2e8f0" font-size="11.5">• 核查：逐句比对原始 FHIR Observation 检验值</text>
  <text x="728" y="308" fill="#e2e8f0" font-size="11.5">• 铁律：AI 仅能写 draft 草稿，医师 CA 硬件双签</text>
  <rect x="728" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="740" y="352" fill="#fcd34d" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="740" y="370" fill="#cbd5e1" font-size="11">严禁任何 AI Agent 直接向 HIS 下达</text>
  <text x="740" y="388" fill="#cbd5e1" font-size="11">status="active" 的正式处方或手术医嘱！</text>

  <!-- Card 4 -->
  <rect x="1044" y="186" width="321" height="235" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
  <text x="1061" y="216" fill="#34d399" font-size="15.5" font-weight="800">🛡️ 确定性 Capability Broker</text>
  <text x="1061" y="238" fill="#a7f3d0" font-size="11.5" font-weight="600">防外院转诊单注入与商保特药骗保</text>
  <text x="1061" y="264" fill="#ecfdf5" font-size="11.5">• G1 (盲底隔离)：record-owner 保护三期临床盲底</text>
  <text x="1061" y="286" fill="#ecfdf5" font-size="11.5">• G2 (名录锁)：fixed-business-output 锁死定点药房</text>
  <text x="1061" y="308" fill="#ecfdf5" font-size="11.5">• G3 (理赔打款锁)：0.0248ms 拦截 $4,960 骗保电汇</text>
  <rect x="1061" y="330" width="286" height="72" rx="8" fill="#022c22" stroke="#10b981"/>
  <text x="1073" y="352" fill="#6ee7b7" font-size="11.5" font-weight="700">生产级黄金架构结论：</text>
  <text x="1073" y="370" fill="#d1fae5" font-size="11">外部转诊与理赔附件一律标记 untrusted，</text>
  <text x="1073" y="388" fill="#d1fae5" font-size="11">100% 免疫病历夹带指令骗取商保直付款！</text>

  <!-- Section 2 -->
  <text x="45" y="454" fill="#e2e8f0" font-size="17" font-weight="700">2. 红蓝对抗推演：外院转诊 FHIR 注入揭盲 &amp; 虚假特药理赔单骗保 vs. SMART on FHIR + Broker</text>

  <rect x="45" y="468" width="640" height="175" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="65" y="496" fill="#fca5a5" font-size="15" font-weight="800">❌ 脆弱 Baseline：全院共享服务号 + 自动核赔放款（BRK-517 / BRK-518 失守）</text>
  <text x="65" y="524" fill="#fecaca" font-size="12.5">1. 转诊单注入揭盲与泄密 (BRK-517)：外院转诊 FHIR 附言植入指令，诱导临床 Agent 读取</text>
  <text x="65" y="544" fill="#fecaca" font-size="12.5">   新药三期临床试验盲底 restricted-budget、篡改诊断结论 business-result 并外发 PHI。</text>
  <text x="65" y="572" fill="#fecaca" font-size="12.5">2. 特药定点名录篡改与骗保 (BRK-518)：外部理赔单伪造罕见病直付批文，诱导将非定点药房</text>
  <text x="65" y="592" fill="#fecaca" font-size="12.5">   写入 trust-registry 直付白名单并直接放行 $4,960 商保理赔电汇！</text>
  <text x="65" y="622" fill="#f87171" font-size="12" font-weight="700">💥 根因：未锁定单患者 FHIR 作用域，且允许外部上传理赔单直接驱动核赔写库与打款！</text>

  <rect x="715" y="468" width="650" height="175" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="496" fill="#6ee7b7" font-size="15" font-weight="800">✅ 零信任医疗与商保架构：SMART on FHIR + 18项脱敏 + Broker（0.0% 失守）</text>
  <text x="735" y="524" fill="#d1fae5" font-size="12.5">• 门禁 1 (launch/patient + record-owner)：物理绑定单患者，阻断读取临床试验盲底</text>
  <text x="735" y="548" fill="#d1fae5" font-size="12.5">• 门禁 2 (Draft-Only + untrusted-write)：外部转诊与理赔单禁改正式诊断与核赔主表</text>
  <text x="735" y="572" fill="#d1fae5" font-size="12.5">• 门禁 3 (fixed-business-output)：物理锁死 trust-registry 定点医院与特药直付药房名录</text>
  <text x="735" y="596" fill="#d1fae5" font-size="12.5">• 门禁 4 (original-requester-payment)：0.0248ms 拦截外部理赔单触发的 $4,960 电汇</text>
  <text x="735" y="622" fill="#34d399" font-size="12" font-weight="700">🛡️ 实测开销：Broker 内存裁决 P50 = 0.0248 ms / 含 SQLite WAL 审计收据 P50 = 7.21 ms</text>

  <!-- Section 3 -->
  <rect x="45" y="662" width="1320" height="168" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="692" fill="#38bdf8" font-size="16" font-weight="800">🛠️ 医疗健康与商保理赔 AI 应用上线安全评审 6 项必选 Checklist</text>
  <text x="65" y="722" fill="#e2e8f0" font-size="13">☑️ 1. 强制 SMART on FHIR 单患者锁定：工具 Schema 移除 patient_id，由网关从诊室签名 Token 硬编码注入</text>
  <text x="65" y="748" fill="#e2e8f0" font-size="13">☑️ 2. 临床试验盲底与 VIP 病历气隙隔离：通过 record-owner 阻断普通门诊 Agent 读取受控科研与特需底表</text>
  <text x="65" y="774" fill="#e2e8f0" font-size="13">☑️ 3. 科研与日志强制 HIPAA 18 项脱敏：使用 Azure Health De-ID 执行一致性伪名替换与日期等距偏移</text>
  <text x="65" y="800" fill="#e2e8f0" font-size="13">☑️ 4. 医嘱强制 status="draft" 医师双签  ☑️ 5. 开启医疗 Groundedness 核查  ☑️ 6. 锁死定点名录与商保自动放款</text>
</svg>
