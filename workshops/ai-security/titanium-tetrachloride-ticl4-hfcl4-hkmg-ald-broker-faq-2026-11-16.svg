  <text x="46" y="568" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">📊 7-Card 基准测试与溯源 (Provenance: measured + synthetic · 🏆 850 项 Pytest 确定性断言旗舰里程碑！)：</text>
