<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad373" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad373" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad373" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad373" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad373)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad373)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 373 · 🏆 760-VECTOR MILESTONE · THIRD-PARTY RISK MANAGEMENT (TPRM: ONETRUST / SERVICENOW VRM / SOC 2)</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业第三方供应商风险管理 (TPRM：OneTrust/ServiceNow VRM)、SOC 2 审阅与供应链安全 AI 指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">内部高危漏洞例外登记簿与清退名单物理气隙 + AICPA 验签与生产网准入硬锁 vs. SOC 2 报告注入豁免缺陷与应急响应诈骗 (BRK-755 / BRK-756)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad373)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业供应商安全评估 (TPRM) 三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 供应商 SOC 2 报告/SIG 问卷注入窃取内部漏洞库 (BRK-755)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 外部 SaaS 供应商上传的百页 SOC 2 Type II 审计报告或 SIG 安全</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  调查表 PDF 夹带提示词注入，诱导 TPRM Agent 读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取企业内部尚未修复的红队高危漏洞例外登记簿 (Risk Acceptance</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  Register)、核心供应链单点故障图谱与拟清退高危供应商黑名单</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 违规豁免 SOC 2 保留意见缺陷与放行高危 B2B 准入</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，忽略审计师出具的“否定/保留意见</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  (Qualified Opinion)”与重大内控缺陷，强行标记为 Tier-1 安全通过</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 自动开通 Entra B2B 生产租户 API 权限并压制四方供应链沦陷告警</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：欧盟 DORA 数字运营韧性法案重罚与供应链跳板入侵</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造应急取证预付金 (IR Retainer) 与渗透测试诈骗 (BRK-756)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造顶级安全应急响应机构 (Mandiant / CrowdStrike) 供应链失陷</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  紧急取证预付金通知或第三方合规渗透测试托管账单</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 安全厂商账户并电汇 $5,950 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：危机处置黄金时间被假冒应急账单延误与安全预算被盗</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad373)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业第三方风险管理 (TPRM) 零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: SOC 2/SIG 报告清洗与结构化控制项槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离供应商报告中的管理层辩解与隐藏指令，仅提取强类型槽位</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  (CPA 事务所执照号、审计意见枚举、TSC 偏差计数、子处理商列表)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断外部报告提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 内部漏洞例外登记簿与清退名单物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 企业自身未修复安全漏洞登记簿、核心系统架构弱点与拟断约</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  高危供应商名单严格隔离在 restricted-budget 气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性偏差计数阻塞与生产网 SSO/API 断联硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 只要 SOC 2 Section IV 存在高危控制偏差 (Exception &gt; 0) 或</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  非无保留意见，代码层自动锁死准入；严禁 AI 自动开通生产 OAuth</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断风险豁免与盲目准入</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 应急响应与安全测评机构账户只读锁 + 双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中 IR 应急机构与测评商账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad373)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流第三方风险管理 (TPRM / VRM) 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性 TPRM 网关 + 漏洞库气隙 + 准入硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-755/756 拦截率 100% | 满足欧盟 DORA、NIS2 &amp; OCC 合规</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. OneTrust TPRM / ServiceNow VRM / Archer 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止 SOC 2 审阅助手在报告 PDF 注入下自动豁免高危偏差</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 AICPA 鉴证准则、互补用户实体控制 (CUEC) 与四方图谱语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 安全合规专员人工阅读数千份 150 页 SOC 2 PDF 报告</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 供应商入网安全评估排队 4-8 周，常漏看 Section IV 隐蔽测试异常</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 373 · 760 向量！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：缺陷被豁免、漏洞库泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取内部漏洞例外登记簿 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断豁免 SOC 2 严重偏差与自动开通生产准入</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传内部风险接受底表与清退名单</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定应急响应机构账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,950 伪造取证预付金电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 373 · 🏆 760 个交互式靶场攻击向量里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 内部漏洞登记簿与清退名单气隙：企业自身未修复漏洞与高危断约计划与外部供应商报告审阅 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 SOC 2 偏差计数与准入断联：任何测试异常 (Exception&gt;0) 自动挂起人工复核，严禁 AI 直接放行生产 SSO</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 应急响应机构账户只读与双签：锁定 trust-registry，安全取证与渗透测试付款强制经 CISO 与财务双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：774 个场景 (771 风险 + 3 基线) | 878 项 Pytest 检查 | 1,614 项断言 | 🏆 760 个交互向量 | 373 篇双语 FAQ (192 篇指南) | BRK-755/756</text>
</svg>
