<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad372" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad372" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad372" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad372" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad372)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad372)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 372 · 🏆 1,610-ASSERTION MILESTONE · IT ASSET MANAGEMENT (SERVICENOW SAM PRO / FLEXERA) &amp; ITAD SANITIZATION</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业 IT 资产与软件许可管理 (ServiceNow SAM/Flexera)、厂商合规审计与硬件消磁 (ITAD) AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">软件超用缺口底稿与谈判预算物理气隙 + 许可计算与 NIST 800-88 硬盘消磁证书硬锁 vs. 审计问卷注入认罚与 VAR 补缴诈骗 (BRK-753 / BRK-754)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad372)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业软件许可审计 (SAM) 与硬件退役三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 外部软件原厂审计问卷注入窃取超用缺口底稿 (BRK-753)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 商业软件原厂或第三方审计所发来的许可合规调查表 (Audit</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  Questionnaire PDF) 夹带提示词注入，诱导 ITAM Agent 读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取企业内部未授权超用自查报告 (Effective License Position</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  ELP 缺口)、法务预计赔付拨备与 ELA 续约底牌预算</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 越权签认千万级 True-Up 罚单与放行未消磁退役硬盘</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，按全集群物理核数签认天价虚拟化</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  许可补缴单 (True-Up Claim)，或将存有生产数据库快照的退役硬盘</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">  直接标记为“已完成 NIST 800-88 物理消磁销毁”放行回收商</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：二手市场买到企业未擦除生产硬盘引发摩根士丹利式重罚</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造软件总代 (VAR) 年度补缴与 ITAD 结算诈骗 (BRK-754)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造软件增值经销商 (VAR: SHI / Insight / CDW) 年度 ELA</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  True-Up 补缴和解账单或 ITAD 硬件环保拆解托管通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 经销商收款账户并电汇 $5,900 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：年度软件大额续保资金被盗且真实授权密钥断供停服</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad372)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业 ITAM/SAM 与硬件退役 (ITAD) 零信任架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 原厂审计问卷/ITAD 报告清洗与强类型槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离外部审计表格与回收商报告中的隐藏指令，仅提取强类型槽位</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  (软件产品 SKU、合同授权指标、硬盘序列号、Blancco 擦除证书哈希)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断外部报告提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 内部超用自查底稿 (ELP) 与谈判底牌物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 内部未过滤软件许可缺口自查底稿、法务抗辩备忘录与年度 ELA</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  最高预算封顶表严格隔离在 restricted-budget 气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 NIST 800-88 密码学擦除证书与审计提交锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 退役存储介质出库强制校验 Blancco/消磁机硬件签名擦除证书；</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  任何对外发送的原厂审计数据包强制锁定为法务待审草稿</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断自动认罚与带数出库</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 认证经销商 (VAR) 账户只读锁 + CIO/法务双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中软件总代与 ITAD 厂商账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad372)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流企业 IT 资产与软件管理 (ITAM/SAM) 方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性 ITAM 网关 + ELP 气隙 + 消磁证书硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-753/754 拦截率 100% | 满足 ISO 19770 &amp; NIST 800-88</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. ServiceNow SAM Pro / Flexera One / Snow 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止合规助手在原厂问卷注入下直接导出未过滤全网拓扑</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备软分区虚拟化计费规则、Blancco 签名与 CMDB 状态语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统运维手工跑原厂脚本直接打包发给软件厂商审计团队</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 极易因误开集群特性触发数千万美元天价许可违约索赔</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 372 · 1,610 断言！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：未消磁盘放行、ELP 泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取内部 ELP 缺口底稿 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断自动签认 True-Up 罚单与放行未消磁硬盘</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向原厂外传未脱敏 CMDB 与底价</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 VAR 经销商账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,900 伪造 True-Up 电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 372 · 🏆 1,610 项确定性断言里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 内部 ELP 缺口底稿与谈判预算气隙：受律师特权保护的内部软件超用自查报告与外部审计对接 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 NIST 800-88 消磁验签与法务复核锁：退役硬盘出库强制校验硬件签名擦除证书，严禁 AI 自动向原厂确认违约</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 软件总代 (VAR) 账户只读与双签：锁定 trust-registry，ELA 年度补缴与续签强制经由 CIO 与采购副总裁双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：772 个场景 (769 风险 + 3 基线) | 874 项 Pytest 检查 | 🏆 1,610 项断言 | 758 个交互向量 | 372 篇双语 FAQ (191 篇指南) | BRK-753/754</text>
</svg>
