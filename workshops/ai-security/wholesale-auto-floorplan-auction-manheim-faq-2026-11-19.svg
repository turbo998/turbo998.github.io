    <rect x="24" y="56" width="630" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="40" y="82" class="mono" font-size="14" fill="#38bdf8">🧪 Round 340 新增 Pytest 回归测试 (340-FAQ &amp; BRK-690 旗舰里程碑！)</text>
    <text x="40" y="110" class="body-txt" font-size="13">• BRK-689 (车况检测/盘库报告注入窃取拍卖保留底价与越权释放质押合格证 Title)：</text>
    <text x="56" y="130" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="record-owner" &amp; "untrusted-write" &amp; "restricted-data-boundary"</text>
    <text x="40" y="158" class="body-txt" font-size="13">• BRK-690 (伪造大宗车辆拍卖行 Manheim 退役车队结算变更通知篡改名录与 $4,970 盗刷)：</text>
    <text x="56" y="178" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="fixed-business-output" &amp; "original-requester-payment"</text>
    <text x="40" y="208" class="mono" font-size="12" fill="#94a3b8">[measured] 内存评估 P50=0.0248ms / P95=0.0409ms | SQLite WAL P50=7.21ms</text>
    <text x="40" y="232" class="mono" font-size="12" fill="#38bdf8">[synthetic] 累计 708 个场景 · 1,482 项 Pytest 断言 · 694 大演练向量 · 340 篇双语 FAQ</text>

    <rect x="680" y="56" width="640" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="698" y="82" class="mono" font-size="14" fill="#a78bfa">🛠️ 汽车库融 (Floorplan)、大宗拍卖 (Manheim) 与合格证质押 AI 6 项铁律 (Checklist)</text>
    <text x="698" y="108" class="body-txt" font-size="13">☑ 1. 大宗退役车队拍卖保留底价与 SOT 突击盘库计划物理气隙：record-owner</text>
    <text x="698" y="132" class="body-txt" font-size="13">☑ 2. 车辆电子产权证/合格证 (e-Title/MSO) 解押释放只读硬锁：untrusted-write</text>
    <text x="698" y="156" class="body-txt" font-size="13">☑ 3. 单车 VIN 库融本息全额结清收据与合格证保管箱释放原子互锁</text>
    <text x="698" y="180" class="body-txt" font-size="13">☑ 4. 外部车商上传的车况仲裁单与自拍 VIN 盘库照片强制污点化：taint="untrusted"</text>
    <text x="698" y="204" class="body-txt" font-size="13">☑ 5. 备案拍卖平台 (Manheim/OPENLANE) 与库融专户只读锁定：锁死 trust-registry</text>
    <text x="698" y="228" class="body-txt" font-size="13">☑ 6. 大宗批售购车款与库融放款电汇硬门禁：Capability Broker 物理阻断打款</text>
  </g>
