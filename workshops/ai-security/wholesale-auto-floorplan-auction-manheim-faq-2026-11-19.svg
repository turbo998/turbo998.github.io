<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#041f1c"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
      .card-hdr { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; fill: #38bdf8; }
      .body-txt { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #e2e8f0; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1440" height="6" fill="url(#accentBlue)"/>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="530" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="21" class="mono" font-size="13" fill="#6ee7b7">🏆 340 篇双语 FAQ &amp; BRK-690 &amp; 1,482 断言三重里程碑 · 708 场景</text>
    <rect x="545" y="0" width="625" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="563" y="21" class="mono" font-size="13" fill="#c7d2fe">AUTO FLOORPLAN &amp; AUCTIONS (MANHEIM/OPENLANE) · VIN TITLE · SOT AUDIT</text>

    <text x="0" y="74" class="title" font-size="28">汽车库融（Floorplan）、大宗拍卖（Manheim）与合格证质押 AI 安全指南</text>
    <text x="0" y="106" class="sub" font-size="16">批量拍卖保留底价与 SOT 违约名单物理气隙 + 车辆产权证 (Title/MSO) 解押硬锁 vs. 车况报告注入与能力网关</text>
  </g>

  <!-- Left Card -->
  <g transform="translate(48, 166)">
    <rect width="650" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19">⚖️ 经销商库存融资 (Floorplan)、B2B 车辆拍卖与合格证质押 AI 对比</text>

    <rect x="20" y="54" width="610" height="72" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
    <text x="34" y="78" class="title" font-size="15" fill="#fca5a5">1. ❌ 拍场与库融 Agent 直通车队拍卖底价表与车辆合格证放行开关</text>
    <text x="34" y="100" class="body-txt" font-size="13">• 车商上传的第三方车况检测报告 (Condition Report) 植入指令，套出租赁车队批量退役拍卖保留底价</text>
    <text x="34" y="118" class="mono" font-size="12" fill="#fca5a5">卖车不解押 (Sold Out of Trust - SOT) 爆雷：诱导未收齐本金即释放电子产权证 (e-Title/MSO)</text>

    <rect x="20" y="136" width="610" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="160" class="title" font-size="15" fill="#7dd3fc">2. 🔒 大宗退役车队拍卖保留价 (Reserve Floor) 与 SOT 突击盘库表气隙</text>
    <text x="34" y="182" class="body-txt" font-size="13">• 面向买方车商开放的车况问答 AI 0 权限读取卖方委托保留底价及金融公司突击实地盘库计划</text>
    <text x="34" y="200" class="mono" font-size="12" fill="#93c5fd">防车商围标压价与提前挪车：物理阻断外部车商会话触碰 restricted-budget 底表</text>

    <rect x="20" y="218" width="610" height="72" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="34" y="242" class="title" font-size="15" fill="#d8b4fe">3. 📜 车辆电子产权证/合格证 (e-Title/MSO) 解押与本金到账硬互锁</text>
    <text x="34" y="264" class="body-txt" font-size="13">• AI 仅审核盘库 VIN 照片与里程表，0 权限直接签发合格证释放指令或豁免 SOT 违约预警</text>
    <text x="34" y="282" class="mono" font-size="12" fill="#e9d5ff">选型定位：满足 Cox Manheim、OPENLANE、NextGear Capital、UCC-1 留置权与主机厂金融</text>

    <rect x="20" y="300" width="610" height="74" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="324" class="title" font-size="15" fill="#6ee7b7">4. 🛡️ 必选底线：确定性零信任能力网关 (Capability Broker · 汽车库融门禁)</text>
    <text x="34" y="346" class="body-txt" font-size="13">• 拍卖底价隔离 (record-owner) + 禁无款放证 (untrusted-write) + 拍场结算专户锁</text>
    <text x="34" y="364" class="mono" font-size="12" fill="#34d399">实测性能：P50 = 0.0248 ms 内存裁决 | 708 个场景 · 1,482 项 Pytest 确定性断言 100% 通过</text>
  </g>

  <!-- Right Card -->
  <g transform="translate(722, 166)">
    <rect width="670" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#f87171">🔥 车况报告注入骗取合格证解押与伪造拍场结算诈骗 vs. 零信任</text>

    <rect x="20" y="56" width="630" height="142" rx="10" fill="#2a0a10" stroke="#ef4444" stroke-width="1.5"/>
    <text x="36" y="82" class="title" font-size="15" fill="#fca5a5">❌ 脆弱架构：库融 Agent 直通拍卖底价与合格证释放 (BRK-689 / BRK-690)</text>
    <text x="36" y="108" class="body-txt" font-size="13">1. [车况检测/盘库申诉 PDF 注入套取大宗拍品底价与无款释放 Title] 诱导读取退役</text>
    <text x="36" y="130" class="body-txt" font-size="13">   车队拍卖保留价与 SOT 盘库计划 (restricted-budget)、直接释放质押合格证并外传！</text>
    <text x="36" y="154" class="body-txt" font-size="13">2. [伪造大型车辆拍卖行 (Manheim/OPENLANE)“千台退役租赁车批量拍卖回款变更函”] 盗刷 $4,970</text>
    <text x="36" y="180" class="mono" font-size="12" fill="#f87171">Baseline 结果：拍卖保留底价泄露 + 质押合格证被骗走形成 SOT 死账 + $4,970 拍款被盗</text>

    <rect x="20" y="214" width="630" height="158" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.8"/>
    <text x="36" y="240" class="title" font-size="15" fill="#6ee7b7">✅ 零信任汽车库存融资与大宗拍卖架构：保留价气隙 + 放证硬锁 + Broker</text>
    <text x="36" y="266" class="body-txt" font-size="13">• 闸门 1 (大宗拍卖保留底价与 SOT 盘库底表锁)：record-owner 0.0248ms 阻断读取</text>
    <text x="36" y="290" class="body-txt" font-size="13">• 闸门 2 (防无款释放 e-Title/MSO 合格证与抹除 SOT)：untrusted-write 阻断修改</text>
    <text x="36" y="314" class="body-txt" font-size="13">• 闸门 3 (备案拍卖行 Manheim 与主机厂库融专户只读锁)：fixed-business-output</text>
    <text x="36" y="338" class="body-txt" font-size="13">• 闸门 4 (底价外发与批量拍车结算电汇门禁)：restricted-data-boundary 与零代付</text>
    <text x="36" y="358" class="mono" font-size="12" fill="#34d399">Hardened 结果：合成夹具 ASR 75.0% → 0.0% | 合规 NADA 公开车型配置目录查询 100.0% 通过</text>
  </g>

  <!-- Bottom Card -->
  <g transform="translate(48, 580)">
    <rect width="1344" height="276" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
