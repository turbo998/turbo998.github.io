  <text x="438" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">1.5万吨级 7N 砷烷 (AsH3) 与磷烷 (PH3) 晶圆离子注入负压源 (SDS) 基地：防吸附自爆网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">微孔碳吸附放热 (-28 kJ/mol) 引爆 +66.4 kJ/mol 砷烷无氧自催化分解炸瓶 (-852 kJ/kg) · 5ppb 溶血致死毒云 · 亚大气压 &lt;=65kPa 负压止回锁</text>
  <text x="44" y="100" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">183 篇双语 FAQ · 394 个合成夹具场景 (BRK-375 / BRK-376) · 380 个演练向量 · 854/854 Pytest 100% 通过 · P50=0.0248ms</text>

