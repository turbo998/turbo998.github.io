  <text x="36" y="74" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23.5" font-weight="800">Enterprise RAG / GraphRAG Indirect Injection &amp; Vector ACL Security Trimming Guide</text>
  <text x="36" y="100" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">Modeled on ib-vs-ethernet-roce-selection-faq.md: Native Pre-Filter Trimming × Graph High-Water-Mark × Deterministic Capability Broker</text>

