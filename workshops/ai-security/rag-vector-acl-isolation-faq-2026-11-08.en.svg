  <text x="1095" y="568" fill="#34d399" font-family="Consolas, monospace" font-size="12.5" font-weight="800">0.0% ASR (0% FPR)</text>

  <!-- Section 3: Bottom Verification & Go-Live Checklist -->
  <rect x="36" y="606" width="1208" height="132" rx="14" fill="#0b1325" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="634" fill="#a78bfa" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">🛠️ Production Checklist &amp; New Red-vs-Blue Regression Scenarios (BRK-19 &amp; BRK-20 · 141/141 Pytest Passed)</text>
  <text x="56" y="660" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.2">• <tspan fill="#38bdf8" font-weight="700">BRK-19 (RAG-ACL-BYPASS-23)</tspan>: Verifies `record-owner` blocks cross-principal chunk recall + `restricted-data-boundary` blocks external `send_message` exfiltration.</text>
  <text x="56" y="684" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12.2">• <tspan fill="#34d399" font-weight="700">BRK-20 (GRAPHRAG-POISON-24)</tspan>: Verifies GraphRAG community summaries propagate `untrusted` taint, blocking `business-result` overwrites &amp; targetless probes.</text>
  <text x="56" y="710" fill="#94a3b8" font-family="Consolas, Segoe UI, sans-serif" font-size="11.5">Provenance: Local timings from scripts/measure_broker_latencies.py sealed in research/latency-samples-2026-11-08.json (measured, n=200/50/30/20); 38 scenarios are offline synthetic fixtures.</text>
