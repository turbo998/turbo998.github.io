  <text x="918" y="87" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">1-Step SQLite WAL P50: <tspan fill="#34d399" font-weight="700">7.21 ms</tspan> (n=50 measured)</text>

  <!-- Section 1: Left Attack Story vs Right Zero-Trust Defense -->
  <rect x="36" y="118" width="592" height="236" rx="14" fill="url(#redBox)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="56" y="146" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="800">❌ Two Production Failures: Why SSO-Protected RAG Still Leaks &amp; Gets Hijacked</text>
  <text x="56" y="174" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Vector ACL Flattening &amp; Post-Filter Recall Starvation:</text>
  <text x="68" y="196" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11.8">• Indexing CFO M&amp;A sheets and public docs in one flat table + prompt rules = 100% leak via translation/summary.</text>
  <text x="68" y="216" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11.8">• Fetching global Top-5 then filtering in app code (Post-Filter) starves recall (0 results) when restricted chunks dominate Top-5.</text>

  <text x="56" y="246" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. GraphRAG Community Summary ACL Collapse &amp; Corpus Poisoning:</text>
  <text x="68" y="268" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11.8">• Leiden clustering merges public vendor tickets and CFO M&amp;A caps into Community #42, flattening per-document ACLs.</text>
  <text x="68" y="288" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11.8">• External docs inject co-occurring entity instructions into global summaries, hijacking downstream Agent tools (75%–100% ASR).</text>
  <rect x="56" y="304" width="552" height="34" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="70" y="326" fill="#fca5a5" font-family="Consolas, Segoe UI, sans-serif" font-size="11.5" font-weight="700">Key Lesson: Pre-Filter governs WHO CAN READ, not WHAT TOOLS AN AGENT CALLS after reading!</text>

  <rect x="652" y="118" width="592" height="236" rx="14" fill="url(#greenBox)" stroke="#10b981" stroke-width="1.5"/>
  <text x="672" y="146" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="15.5" font-weight="800">✅ Three Agent-Native Zero-Trust Gates (Pre-Filter + Graph Watermark + Broker)</text>
  <text x="672" y="174" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛡️ Gate 1: Native Vector Pre-Filter Security Trimming (record-owner):</text>
  <text x="684" y="196" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11.8">• Stamp every chunk at ingest with immutable tenant_id + owner + allowed_principals + Purview sensitivity label.</text>
  <text x="684" y="216" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11.8">• Push verified OBO token claims into the vector engine's pre-search inverted boolean filter before HNSW scoring.</text>

  <text x="672" y="246" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛡️ Gate 2: GraphRAG High-Water-Mark Security Label Inheritance:</text>
  <text x="684" y="268" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11.8">• Community Allowed(C) = ⋂ Allowed(S_i), Sensitivity(C) = max Sensitivity(S_i), and untrusted taint propagates across edges.</text>

  <text x="672" y="296" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🛡️ Gate 3: Chunk-to-Lane Taint + Deterministic Capability Broker (0.0248ms P50):</text>
  <text x="684" y="318" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11.8">• Reading restricted/untrusted chunks taints the session lane, blocking external egress &amp; unapproved business-result writes.</text>

  <!-- Section 2: 4-Option Architect Selection Matrix -->
