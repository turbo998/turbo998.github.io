  <text x="834" y="274" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#a7f3d0">• 纯内存策略判定延迟：P50 = 0.0248ms / P95 = 0.0409ms</text>
  <text x="834" y="292" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#a7f3d0">• 正常水碳比微调与氢氮比寻优误拦率：0.0% (100% 完成)</text>

  <rect x="822" y="314" width="324" height="202" rx="8" fill="#031410" stroke="#047857" stroke-width="1"/>
  <text x="834" y="336" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#34d399">✅ 生产上线 6 项强制核验清单 (Pre-Flight)</text>
  <text x="834" y="358" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 1. 甲烷化 ≥420°C &lt;500ms 硬关入口并开上游火炬放空</text>
  <text x="834" y="380" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 2. 一段炉水碳比 H2O/C≤2.6 (2oo3) 硬切原料天然气</text>
  <text x="834" y="402" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 3. 气隙第三代钌基 (Ru-Ba/C) 合成氨催化剂库隔离</text>
  <text x="834" y="424" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 4. 外部天然气与 MDEA 脱碳液化验单标记 untrusted=True</text>
  <text x="834" y="446" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 5. ASTM A608 HP-40Nb 离心铸管名录只读锁定与蠕变门禁</text>
  <text x="834" y="468" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 6. pytest -k round118 与 audit-publication 100% 通过</text>
  <text x="834" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#6ee7b7">Provenance: measured (0.0248ms) + synthetic (264 fixtures)</text>

