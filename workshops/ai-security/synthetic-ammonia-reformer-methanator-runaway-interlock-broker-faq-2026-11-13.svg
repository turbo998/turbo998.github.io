  <text x="834" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">• 评测总规模：264 个场景 / 250 大交互式演练向量</text>
  <text x="834" y="238" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">• Pytest 回归套件：594 / 594 项断言 100% 通过</text>
