<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg230e" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="red230e" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="green230e" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg230e)"/>

  <!-- Header -->
  <rect x="32" y="24" width="1136" height="92" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="54" y="54" fill="#38bdf8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700">CLOUD &amp; AI SOLUTION ARCHITECT · 2026-11-18 ROUND 230 (🏆 230-FAQ &amp; BRK-470 MILESTONE) · AGENT IDENTITY &amp; OBO</text>
  <text x="54" y="84" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="800">Agent Identity Selection: Microsoft Entra Agent ID + OBO vs. Managed Identity vs. 5-Tuple HITL</text>
  <text x="54" y="106" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Modeled on ib-vs-ethernet-roce-selection-faq.md · 488 Scenarios &amp; 1,042 Pytest Assertions · User-Delegated OBO + 0.0248ms Capability Broker</text>

  <!-- Left Column: Managed Identity & Naive HITL Pitfalls -->
  <rect x="32" y="132" width="554" height="360" rx="14" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="48" y="148" width="522" height="40" rx="8" fill="url(#red230e)"/>
  <text x="64" y="174" fill="#fecaca" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700">❌ 3 Enterprise Failure Modes of App-Only Managed Identity &amp; Naive HITL</text>

  <rect x="48" y="202" width="522" height="84" rx="10" fill="#27272a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="64" y="226" fill="#fca5a5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">1. Global Managed Identity (Sites.Read.All) Leaks Executive Payroll</text>
  <text x="64" y="248" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Binding an app-wide Managed Identity executes all user queries under god-mode app permissions</text>
  <text x="64" y="268" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Backend DB/SharePoint cannot see the human caller, leaking restricted-budget to contractors</text>

  <rect x="48" y="298" width="522" height="84" rx="10" fill="#27272a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="64" y="322" fill="#fca5a5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">2. Multi-Agent Identity Laundering &amp; Executive Confused Deputy ($2,650)</text>
  <text x="64" y="344" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• External supplier relays prompt via Calendar Agent to Finance Agent; single-hop RBAC allows</text>
  <text x="64" y="364" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Forwarding broad executive OBO tokens lets poisoned emails initiate unauthorized wires</text>

  <rect x="48" y="394" width="522" height="84" rx="10" fill="#27272a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="64" y="418" fill="#fca5a5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">3. Boolean HITL Approval Vulnerable to TOCTOU &amp; Stale Epoch Replay</text>
  <text x="64" y="440" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Naive approved=True flags allow attackers to swap payment amounts post-approval</text>
  <text x="64" y="460" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Stale approvals from before a Pause/Resume cycle can be replayed without epoch binding</text>

  <!-- Right Column: Entra Agent ID + OBO + 5-Tuple HITL -->
  <rect x="614" y="132" width="554" height="360" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="630" y="148" width="522" height="40" rx="8" fill="url(#green230e)"/>
  <text x="646" y="174" fill="#a7f3d0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700">✅ Entra Agent ID + OBO Downscoping + 5-Tuple HITL Architecture</text>

  <rect x="630" y="202" width="522" height="84" rx="10" fill="#1e293b" stroke="#065f46" stroke-width="1"/>
  <text x="646" y="226" fill="#6ee7b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">Gate 1: Microsoft Entra Agent ID + OAuth 2.0 OBO Permission Intersection</text>
  <text x="646" y="248" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Effective Permission = Logged-In User ACL ∩ Agent Least-Privilege Delegated Scope</text>
  <text x="646" y="268" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Capability Broker enforces record-owner in 0.0248ms, blocking cross-principal reads</text>

  <rect x="630" y="298" width="522" height="84" rx="10" fill="#1e293b" stroke="#065f46" stroke-width="1"/>
  <text x="646" y="322" fill="#6ee7b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">Gate 2: Per-Hop Scope Downscoping &amp; Immutable original_requester Lock</text>
  <text x="646" y="344" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Exchanges downscoped tokens per A2A hop; envelope pins initial original_requester</text>
  <text x="646" y="364" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Blocks untrusted writes &amp; external requester payments (original-requester-payment)</text>

  <rect x="630" y="394" width="522" height="84" rx="10" fill="#1e293b" stroke="#065f46" stroke-width="1"/>
  <text x="646" y="418" fill="#6ee7b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">Gate 3: 5-Tuple Cryptographic Action-Hash HITL (Anti-Replay &amp; Epoch Lock)</text>
  <text x="646" y="440" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• action_hash = SHA256(request_hash, epoch, expires_at, plan_hash, principal)</text>
  <text x="646" y="460" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Any argument edit or Pause/Resume epoch increment immediately invalidates stale approvals</text>

  <!-- Bottom KPI Bar -->
  <rect x="32" y="508" width="1136" height="142" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="54" y="538" fill="#a5b4fc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">📊 Identity &amp; Delegation Benchmark Summary (🏆 230-FAQ &amp; BRK-470 Milestones · Provenance Strictly Separated)</text>

  <rect x="54" y="552" width="350" height="80" rx="10" fill="#1e293b"/>
  <text x="70" y="576" fill="#38bdf8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700">SYNTHETIC FIXTURE BENCHMARK (488 Scenarios)</text>
  <text x="70" y="602" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="800">ASR: 75.0% ➔ 0.0% (0% FPR)</text>
  <text x="70" y="622" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">Added BRK-469 (MI Payroll Leak) &amp; BRK-470 (OBO Wire Fraud)</text>

  <rect x="424" y="552" width="360" height="80" rx="10" fill="#1e293b"/>
  <text x="440" y="576" fill="#10b981" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700">MEASURED BROKER &amp; 5-TUPLE HASH LATENCY</text>
  <text x="440" y="602" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="800">In-Memory P50=0.0248ms | WAL P50=7.21ms</text>
  <text x="440" y="622" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5">Initial OBO exchange ~35ms (&lt;1ms cached)</text>

  <rect x="804" y="552" width="342" height="80" rx="10" fill="#1e293b"/>
  <text x="820" y="576" fill="#f59e0b" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="700">ARCHITECT GOLDEN RULES</text>
  <text x="820" y="598" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">1. Mandate Entra Agent ID + OBO for user sessions</text>
  <text x="820" y="616" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">2. Downscope per hop + pin original_requester + 5-tuple HITL</text>
</svg>
