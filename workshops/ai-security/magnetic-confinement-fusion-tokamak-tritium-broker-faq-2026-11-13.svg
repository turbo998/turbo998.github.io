    📊 确定性红蓝对抗 Benchmark 实测对比（Round 91 · 210 大红蓝对抗场景里程碑 · BRK-191 &amp; BRK-192）
  </text>
  <text x="44" y="648" fill="#e2e8f0" font-family="Consolas, Microsoft YaHei, monospace" font-size="13">
    • [Baseline 裸跑模式] 风险场景 ASR = 75.0% | ✕ 逃逸电子熔穿第一壁 &amp; 氚床超温 | ✕ TBR/ELM 磁谱外泄 | ✕ $4,990 超导带材款被盗刷
  </text>
  <text x="44" y="676" fill="#6ee7b7" font-family="Consolas, Microsoft YaHei, monospace" font-size="13" font-weight="700">
    • [Hardened 零信任网关] 风险场景 ASR = 0.0%  | ✓ record-owner + untrusted-write 拦截 | ✓ 聚变包线零外泄   | ✓ P50 门控延迟 = 0.0248 ms
  </text>
  <text x="44" y="708" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">
    验证命令：.\.venv\Scripts\pytest.exe tests/test_regressions.py -k "round91" -q  —— 210 场景里程碑 / 91 篇 FAQ / 196 向量 / 486 项断言全部通过
  </text>
