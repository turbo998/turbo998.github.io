  <!-- Section 1 -->
  <text x="45" y="172" fill="#e2e8f0" font-size="17" font-weight="700">1. 企业文档解析与 RAG 摄入四大方案横向对比（精度 vs. 防隐写能力 vs. 动作安全）</text>

  <!-- Card 1 -->
  <rect x="45" y="186" width="315" height="235" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="216" fill="#60a5fa" font-size="15.5" font-weight="800">🔵 Azure AI Document Intelligence</text>
  <text x="62" y="238" fill="#bfdbfe" font-size="11.5" font-weight="600">预构建发票/合同模型 + 像素级 CDR</text>
  <text x="62" y="264" fill="#e2e8f0" font-size="11.5">• 核心防线：PDF 先转扁平位图再执行视觉 OCR</text>
  <text x="62" y="286" fill="#e2e8f0" font-size="11.5">• 几何过滤：返回 Bounding Box，丢弃 &lt;4pt 微缩字</text>
  <text x="62" y="308" fill="#e2e8f0" font-size="11.5">• 优势：跨页复杂财务表格与印章提取精度最高</text>
  <rect x="62" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <text x="74" y="352" fill="#93c5fd" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="74" y="370" fill="#cbd5e1" font-size="11">金融审单、电子招投标与发票自动核销首选，</text>
  <text x="74" y="388" fill="#cbd5e1" font-size="11">从物理层面消灭“人类看不见但解析器能读到”的字！</text>

  <!-- Card 2 -->
  <rect x="378" y="186" width="315" height="235" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1.8"/>
  <text x="395" y="216" fill="#c084fc" font-size="15.5" font-weight="800">🟣 GPT-4o Vision / Phi-4 视觉直读</text>
  <text x="395" y="238" fill="#e9d5ff" font-size="11.5" font-weight="600">多模态原生图像理解 + Spotlighting</text>
  <text x="395" y="264" fill="#e2e8f0" font-size="11.5">• 优势：天然免疫 PDF 底层 /ToUnicode 字符映射</text>
  <text x="395" y="286" fill="#e2e8f0" font-size="11.5">• 适用：复杂架构图、工程图纸与手写批注理解</text>
  <text x="395" y="308" fill="#e2e8f0" font-size="11.5">• 局限：仍会读出画面中可见的备注栏提示词注入</text>
  <rect x="395" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="407" y="352" fill="#d8b4fe" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="407" y="370" fill="#cbd5e1" font-size="11">非结构化图文混排理解利器；必须搭配</text>
  <text x="407" y="388" fill="#cbd5e1" font-size="11">Spotlighting 边界标签与出口能力网关。</text>

  <!-- Card 3 -->
  <rect x="711" y="186" width="315" height="235" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="728" y="216" fill="#fbbf24" font-size="15.5" font-weight="800">🟠 开源解析 (Unstructured / Docling)</text>
  <text x="728" y="238" fill="#fde68a" font-size="11.5" font-weight="600">PyMuPDF / openpyxl 本地沙盒化部署</text>
  <text x="728" y="264" fill="#e2e8f0" font-size="11.5">• 致命坑 1：默认模式直接抽 PDF 污染文本流</text>
  <text x="728" y="286" fill="#e2e8f0" font-size="11.5">• 致命坑 2：openpyxl 默认加载 xlSheetVeryHidden</text>
  <text x="728" y="308" fill="#e2e8f0" font-size="11.5">• 加固：强制开启 OCR 模式 + 丢弃隐藏 Sheet</text>
  <rect x="728" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="740" y="352" fill="#fcd34d" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="740" y="370" fill="#cbd5e1" font-size="11">解析外部文件必须放进无外网 ACA 容器沙盒，</text>
  <text x="740" y="388" fill="#cbd5e1" font-size="11">并剥离全部 docProps/customXml 元数据！</text>

  <!-- Card 4 -->
  <rect x="1044" y="186" width="321" height="235" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
  <text x="1061" y="216" fill="#34d399" font-size="15.5" font-weight="800">🛡️ Pixel CDR + Capability Broker</text>
  <text x="1061" y="238" fill="#a7f3d0" font-size="11.5" font-weight="600">防可见备注栏注入与假发票盗刷兜底</text>
  <text x="1061" y="264" fill="#ecfdf5" font-size="11.5">• G1 (入口净化)：Pixel CDR + OpenXML 隐藏表剥离</text>
  <text x="1061" y="286" fill="#ecfdf5" font-size="11.5">• G2 (护栏检测)：Prompt Shields (Documents) 扫描</text>
  <text x="1061" y="308" fill="#ecfdf5" font-size="11.5">• G3 (能力网关)：0.0248ms 锁死评标与三单匹配</text>
  <rect x="1061" y="330" width="286" height="72" rx="8" fill="#022c22" stroke="#10b981"/>
  <text x="1073" y="352" fill="#6ee7b7" font-size="11.5" font-weight="700">生产级黄金架构结论：</text>
  <text x="1073" y="370" fill="#d1fae5" font-size="11">即便攻击者把注入指令堂而皇之印在发票备注栏，</text>
  <text x="1073" y="388" fill="#d1fae5" font-size="11">Capability Broker 仍 100% 阻断改库与打款！</text>

  <!-- Section 2 -->
  <text x="45" y="454" fill="#e2e8f0" font-size="17" font-weight="700">2. 红蓝对抗推演：PDF /ToUnicode &amp; Excel 极度隐藏表注入 vs. Pixel CDR + Capability Broker</text>

  <rect x="45" y="468" width="640" height="175" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="65" y="496" fill="#fca5a5" font-size="15" font-weight="800">❌ 脆弱 Baseline：原生文本流盲提 + 无能力网关（BRK-507 / BRK-508 失守）</text>
  <text x="65" y="524" fill="#fecaca" font-size="12.5">1. 标书隐写窃取标底 (BRK-507)：供应商上传的 PDF 标书含 /ToUnicode 重映射且 Excel 含</text>
  <text x="65" y="544" fill="#fecaca" font-size="12.5">   xlSheetVeryHidden 表，诱导评标 Agent 读取采购标底 restricted-budget、篡改中标方并外泄。</text>
  <text x="65" y="572" fill="#fecaca" font-size="12.5">2. 发票微缩字豁免三单匹配 (BRK-508)：外部 PDF 发票边缘印有微缩指令，诱导审单 Agent</text>
  <text x="65" y="592" fill="#fecaca" font-size="12.5">   修改免三单匹配白名单 trust-registry 并直接获批 $4,850 货款电汇！</text>
  <text x="65" y="622" fill="#f87171" font-size="12" font-weight="700">💥 根因：人眼只看顶层渲染像素而解析器盲读底层暗格，且外部文档会话拥有写库与付款权限！</text>

  <rect x="715" y="468" width="650" height="175" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="496" fill="#6ee7b7" font-size="15" font-weight="800">✅ 零信任文档解析管道：Pixel CDR + Document Intelligence + Broker（0.0% 失守）</text>
  <text x="735" y="524" fill="#d1fae5" font-size="12.5">• 门禁 1 (Pixel CDR + 隐藏表剥离)：转位图消灭 /ToUnicode，强制丢弃 xlSheetVeryHidden</text>
  <text x="735" y="548" fill="#d1fae5" font-size="12.5">• 门禁 2 (record-owner &amp; restricted-data-boundary)：阻断读取采购标底与向投标商外发数据</text>
  <text x="735" y="572" fill="#d1fae5" font-size="12.5">• 门禁 3 (untrusted-write &amp; fixed-business-output)：外部文档禁改评标结果与三单匹配规则表</text>
  <text x="735" y="596" fill="#d1fae5" font-size="12.5">• 门禁 4 (original-requester-payment)：0.0248ms 拦截外部发票触发的 $4,850 货款电汇</text>
  <text x="735" y="622" fill="#34d399" font-size="12" font-weight="700">🛡️ 实测开销：Broker 内存裁决 P50 = 0.0248 ms / 含 SQLite WAL 审计收据 P50 = 7.21 ms</text>

  <!-- Section 3 -->
  <rect x="45" y="662" width="1320" height="168" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="692" fill="#38bdf8" font-size="16" font-weight="800">🛠️ 企业多模态文档解析与 OCR 管道上线安全评审 6 项必选 Checklist</text>
  <text x="65" y="722" fill="#e2e8f0" font-size="13">☑️ 1. 外部 PDF 强制执行像素级 CDR：先渲染为扁平位图再经 Document Intelligence OCR，消灭底层隐藏文本流</text>
  <text x="65" y="748" fill="#e2e8f0" font-size="13">☑️ 2. Office 文档剥离隐藏暗格：强制丢弃 Excel hidden/veryHidden 工作表、隐藏行列、Word vanish 与 customXml</text>
  <text x="65" y="774" fill="#e2e8f0" font-size="13">☑️ 3. 几何字号与对比度过滤：基于 Bounding Box 自动丢弃字号 &lt;4pt 或极低对比度的微缩水印注入文字</text>
  <text x="65" y="800" fill="#e2e8f0" font-size="13">☑️ 4. 解析器运行于无外网 ACA 容器  ☑️ 5. 串联 Prompt Shields (Documents)  ☑️ 6. 出口强制过 Capability Broker</text>
