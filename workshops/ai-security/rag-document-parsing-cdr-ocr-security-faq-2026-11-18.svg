  <text x="45" y="104" fill="#f8fafc" font-size="24" font-weight="800">企业多模态文档解析与 OCR 管道选型：Document Intelligence vs. 视觉直读 vs. 开源解析 + Pixel CDR</text>
  <text x="45" y="132" fill="#94a3b8" font-size="14">解决合同审查、财务发票核销与标书评标三大文档隐写风险：PDF /ToUnicode 映射欺骗、0.1pt 白底白字与 Excel xlSheetVeryHidden 极度隐藏表注入</text>

