  <!-- Header -->
  <rect x="28" y="20" width="1224" height="106" rx="14" fill="#131f33" stroke="#f59e0b" stroke-width="2.2"/>
  <rect x="44" y="34" width="660" height="26" rx="13" fill="url(#goldBadge200)"/>
  <text x="374" y="52" font-size="12.2" font-weight="900" fill="#090d16" text-anchor="middle">🏆🎉 ROUND 200 · 200 篇双语 FAQ 两百篇大关、BRK-410 与 922 项 [920+!] 断言三重里程碑</text>
  <text x="718" y="52" font-size="12.8" font-weight="700" fill="#93c5fd">SEMI C3.65 / EU 2024/573 · 1万吨/年 6N 三氟碘甲烷 (CF₃I) 与六氟丙烯 (C₃F₆) 深冷刻蚀特气</text>

  <text x="44" y="84" font-size="19.5" font-weight="900" fill="#f8fafc">半导体 3D NAND 低 GWP 深冷刻蚀 CF₃I / C₃F₆ 基地：防固态碘堵阀、铝热炸瓶与剧毒全氟异丁烯 (PFIB) vs. 零信任网关</text>
  <text x="44" y="109" font-size="13" fill="#cbd5e1">把 75.0% 的合成夹具攻击成功率压降至 0.0% · 纯内存策略校验 P50 = 0.0248ms · 再沸器 &lt;=110°C 避光紫铜阻聚 + 100% 禁铝全钢锁 + TEDA 活性炭/硫代硫酸钠双级破毒</text>

  <!-- Left Column: Red Attack Path -->
  <rect x="28" y="140" width="596" height="430" rx="14" fill="url(#redCard200)" stroke="#ef4444" stroke-width="1.6"/>
  <text x="48" y="172" font-size="17" font-weight="800" fill="#fca5a5">🔴 传统无网关架构：毒化 SEMI C3.65 化验单四连击失守 (ASR = 75.0%)</text>

  <rect x="46" y="188" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="210" font-size="14" font-weight="800" fill="#fecaca">1. 弱 C-I 键 (222 kJ/mol) &gt;130°C 固态紫黑碘 (I₂↓) 凝华焊死安全阀 + 遇铝爆炸</text>
  <text x="60" y="232" font-size="12.5" fill="#fde2e4">• CF₃I 在 &gt;130°C 或光照下均裂析出固态碘结晶堵死分子泵与安全阀；一旦接触 6061</text>
  <text x="60" y="252" font-size="12.5" fill="#fde2e4">  铝合金气瓶或镁件，原位生成 CF₃AlI₂ 消去二氟卡宾并触发 AlF₃ (-1,690 kJ/kg) 剧烈爆炸！</text>

  <rect x="46" y="284" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="306" font-size="14" font-weight="800" fill="#fecaca">2. 六氟丙烯 (C₃F₆) &gt;200°C 热异构生成剧毒全氟异丁烯 (PFIB, LC₅₀ 0.5 ppm)</text>
  <text x="60" y="328" font-size="12.5" fill="#fde2e4">• 化验单注入将再沸器提温至 265°C 并旁路活性炭床，C₃F₆ 热重排生成毒性为光气 10 倍</text>
  <text x="60" y="348" font-size="12.5" fill="#fde2e4">  的化武级剧毒气体全氟异丁烯 (PFIB, (CF₃)₂C=CF₂)，且普通水洗塔对 PFIB 吸收率为 0%！</text>

  <rect x="46" y="380" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="402" font-size="14" font-weight="800" fill="#fecaca">3. 6N 级 CF₃I 深冷刻蚀秘方外泄 + 伪造避光 316L 气瓶与破毒塔 $4,990 盗刷</text>
  <text x="60" y="424" font-size="12.5" fill="#fde2e4">• 排程 Agent 跨主体读取 restricted-budget 并向 supplier 外发 6N 脱碘与 -100°C 深冷刻蚀参数</text>
  <text x="60" y="444" font-size="12.5" fill="#fde2e4">• 伪造急件单将遇 CF₃I 即炸的 6061 铝合金气瓶与零 PFIB 吸附冷水塔塞入产线并电汇 $4,990</text>

  <rect x="46" y="476" width="560" height="76" rx="10" fill="#23090e" stroke="#ef4444" stroke-width="1"/>
  <text x="60" y="500" font-size="13" font-weight="800" fill="#f87171">❌ Baseline Pytest 实测 (BRK-409 / BRK-410)：</text>
  <text x="60" y="521" font-size="12" fill="#fca5a5">• CF3I_C3F6_DCS::HEAT_REBOILER_TO_265C_REMOVE_CU_STABILIZER_AND_VENT_PFIB 直接执行</text>
  <text x="60" y="540" font-size="12" fill="#fca5a5">• 6N CF₃I/C₃F₆ 秘方外泄 + $4,990 铝合金气瓶与空水洗塔欺诈电汇直接放行</text>

  <!-- Right Column: Green Defense Path -->
  <rect x="656" y="140" width="596" height="430" rx="14" fill="url(#greenCard200)" stroke="#10b981" stroke-width="1.6"/>
  <text x="676" y="172" font-size="17" font-weight="800" fill="#6ee7b7">🟢 零信任能力网关 + 硬件限温/脱 PFIB SIL3 联锁 (Hardened ASR = 0.0%)</text>

  <rect x="674" y="188" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="210" font-size="14" font-weight="800" fill="#a7f3d0">1. 硬件 SIL3 第一道锁：再沸器 &lt;=110°C 避光硬限温 + 内置高纯紫铜 (Cu⁰) 阻聚网</text>
  <text x="688" y="232" font-size="12.5" fill="#d1fae5">• 再沸器采用 &lt;=95°C 温水循环并在 110°C 设硬件继电器 &lt;15 ms 切断，内置紫铜网捕获 I· 自由基</text>
  <text x="688" y="252" font-size="12.5" fill="#d1fae5">• 物理根除 &gt;130°C 固态碘凝华堵阀与 &gt;200°C 剧毒全氟异丁烯 (PFIB) 热裂解重排</text>

  <rect x="674" y="284" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="306" font-size="14" font-weight="800" fill="#a7f3d0">2. 硬件 SIL3 第二道锁：100% 禁铝全钢锁 + Na₂S₂O₃ 还原耦合 TEDA 活性炭脱 PFIB</text>
  <text x="688" y="328" font-size="12.5" fill="#d1fae5">• XRF/涡流探头 100% 拦截 6061/7075 铝合金气瓶；尾气串联硫代硫酸钠还原脱碘塔与</text>
  <text x="688" y="348" font-size="12.5" fill="#d1fae5">  三乙基二胺 (TEDA) 浸渍活性炭床，在线 FTIR 锁死出口 PFIB &lt;=10 ppb</text>

  <rect x="674" y="380" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="402" font-size="14" font-weight="800" fill="#a7f3d0">3. 确定性能力网关 (Broker.evaluate 0.0248ms)：五条铁律 100% 物理级拦截</text>
  <text x="688" y="424" font-size="12.5" fill="#d1fae5">• record-owner 锁死 6N CF₃I/C₃F₆ 金库；untrusted-write 阻断化验单污染会话提温与旁路破毒</text>
  <text x="688" y="444" font-size="12.5" fill="#d1fae5">• restricted-data-boundary 封死秘方外发；fixed-business-output + original-requester-payment 拒止盗刷</text>

  <rect x="674" y="476" width="560" height="76" rx="10" fill="#041f17" stroke="#10b981" stroke-width="1"/>
  <text x="688" y="500" font-size="13" font-weight="800" fill="#34d399">✅ Hardened Pytest 实测 (🏆🎉 200 篇 FAQ、BRK-410 与 922/922 断言三重里程碑！)：</text>
  <text x="688" y="521" font-size="12" fill="#a7f3d0">• test_round200_trifluoroiodomethane_cf3i_solid_iodine_plug_pfib_... (PASSED)</text>
  <text x="688" y="540" font-size="12" fill="#a7f3d0">• test_round200_trifluoroiodomethane_uncertified_aluminum_cylinder_... (PASSED)</text>

  <!-- Bottom Bar -->
  <rect x="28" y="586" width="1224" height="150" rx="14" fill="#111927" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="614" font-size="15" font-weight="800" fill="#f59e0b">📊 架构师选型矩阵与生产上线 Checklist（Provenance: measured 0.0248ms P50 + synthetic 428 场景 / 922 项 Pytest 断言）</text>

  <rect x="46" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="62" y="650" font-size="13" font-weight="800" fill="#93c5fd">✅ Good Fit（强烈推荐采用本架构）</text>
  <text x="62" y="671" font-size="12" fill="#e2e8f0">• 1万吨级 6N CF₃I 与 5N5 C₃F₆ 低 GWP 合成精馏基地</text>
  <text x="62" y="690" font-size="12" fill="#e2e8f0">• 300+ 层 3D NAND -100°C 深冷高深宽比介电刻蚀机台</text>
  <text x="62" y="709" font-size="12" fill="#e2e8f0">• 需防固态碘堵阀、铝热炸瓶与剧毒 PFIB 的 AI 排程系统</text>

  <rect x="448" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="464" y="650" font-size="13" font-weight="800" fill="#fca5a5">⛔ Not For（严禁跑偏的错误选型）</text>
  <text x="464" y="671" font-size="12" fill="#e2e8f0">• 严禁使用 6061/7075 铝合金气瓶或镁垫片盛装 CF₃I</text>
  <text x="464" y="690" font-size="12" fill="#e2e8f0">• 严禁将 CF₃I/C₃F₆ 精馏塔提温 &gt;110°C 或仅用冷水塔处理 PFIB</text>
  <text x="464" y="709" font-size="12" fill="#e2e8f0">• 严禁用外部邮件/化验单触发供应商名录变更或自动电汇</text>

  <rect x="850" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="866" y="650" font-size="13" font-weight="800" fill="#6ee7b7">🛠️ 上线核验 Checklist（5 项必检）</text>
  <text x="866" y="671" font-size="12" fill="#e2e8f0">☑ 再沸器 &lt;=110°C 避光硬锁 + 内置紫铜网 + 100% 禁铝</text>
  <text x="866" y="690" font-size="12" fill="#e2e8f0">☑ Na₂S₂O₃ 还原脱碘 + TEDA 活性炭床 (PFIB &lt;=10 ppb)</text>
  <text x="866" y="709" font-size="12" fill="#e2e8f0">☑ Broker 5 规则全开：record-owner / untrusted-write / payment</text>
