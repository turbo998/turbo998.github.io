  <!-- Section 1 -->
  <text x="45" y="172" fill="#e2e8f0" font-size="17" font-weight="700">1. 企业微调与模型供应链四大方案选型矩阵（何时用 RAG vs. 何时用托管微调 vs. 自建门禁）</text>

  <!-- Card 1 -->
  <rect x="45" y="186" width="315" height="235" rx="12" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
  <text x="62" y="216" fill="#fca5a5" font-size="15.5" font-weight="800">🛑 第一铁律：RAG vs. 微调边界</text>
  <text x="62" y="238" fill="#fecaca" font-size="11.5" font-weight="600">微调教“风格与格式”，严禁灌输机密数据！</text>
  <text x="62" y="264" fill="#fef2f2" font-size="11.5">• 致命误区：把合同/薪酬/客户档案直接微调</text>
  <text x="62" y="286" fill="#fef2f2" font-size="11.5">• 后果：模型权重无 RLS，任何员工皆可套取</text>
  <text x="62" y="308" fill="#fef2f2" font-size="11.5">• 正解：分级数据走 Pre-Filter ACL 的 RAG</text>
  <rect x="62" y="330" width="280" height="72" rx="8" fill="#450a0a" stroke="#f87171"/>
  <text x="74" y="352" fill="#fca5a5" font-size="11.5" font-weight="700">架构师拍板结论：</text>
  <text x="74" y="370" fill="#fecaca" font-size="11">入训 JSONL 必须先过 Purview / Presidio</text>
  <text x="74" y="388" fill="#fecaca" font-size="11">100% 剥离 PII、密钥与受控财务数字！</text>

  <!-- Card 2 -->
  <rect x="378" y="186" width="315" height="235" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="395" y="216" fill="#60a5fa" font-size="15.5" font-weight="800">🔵 Azure AI Foundry / Bedrock</text>
  <text x="395" y="238" fill="#bfdbfe" font-size="11.5" font-weight="600">全托管模型蒸馏与租户级 LoRA 隔离</text>
  <text x="395" y="264" fill="#e2e8f0" font-size="11.5">• 优势 1：GPT-4o 蒸馏至 4o-mini/Phi-4 降本 80%</text>
  <text x="395" y="286" fill="#e2e8f0" font-size="11.5">• 优势 2：原生隔离Pickle RCE + CMK 权重加密</text>
  <text x="395" y="308" fill="#e2e8f0" font-size="11.5">• 优势 3：内置 PyRIT 安全评测与护栏绑定</text>
  <rect x="395" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <text x="407" y="352" fill="#93c5fd" font-size="11.5" font-weight="700">适用场景：</text>
  <text x="407" y="370" fill="#cbd5e1" font-size="11">追求零基础设施运维、需要将大模型路由</text>
  <text x="407" y="388" fill="#cbd5e1" font-size="11">与 JSON 格式能力蒸馏至高速小模型。</text>

  <!-- Card 3 -->
  <rect x="711" y="186" width="315" height="235" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1.8"/>
  <text x="728" y="216" fill="#c084fc" font-size="15.5" font-weight="800">🟣 Databricks Mosaic AI Training</text>
  <text x="728" y="238" fill="#e9d5ff" font-size="11.5" font-weight="600">Unity Catalog 数据-模型端到端血统绑定</text>
  <text x="728" y="264" fill="#e2e8f0" font-size="11.5">• 优势 1：精确审计每版模型由哪张脱敏表训练</text>
  <text x="728" y="286" fill="#e2e8f0" font-size="11.5">• 优势 2：训练数据集发现投毒可一键定位回滚</text>
  <text x="728" y="308" fill="#e2e8f0" font-size="11.5">• 局限：需防范潜伏触发词后门在线上唤醒</text>
  <rect x="728" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="740" y="352" fill="#d8b4fe" font-size="11.5" font-weight="700">适用场景：</text>
  <text x="740" y="370" fill="#cbd5e1" font-size="11">强监管金融/医药企业要求对训练数据血统</text>
  <text x="740" y="388" fill="#cbd5e1" font-size="11">与版本可追溯性进行 100% 合规举证。</text>

  <!-- Card 4 -->
  <rect x="1044" y="186" width="321" height="235" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
  <text x="1061" y="216" fill="#34d399" font-size="15.5" font-weight="800">🛡️ 自建开源微调 + 能力网关兜底</text>
  <text x="1061" y="238" fill="#a7f3d0" font-size="11.5" font-weight="600">Safetensors 签名门禁 + Capability Broker</text>
  <text x="1061" y="264" fill="#ecfdf5" font-size="11.5">• 门禁 1：封杀 .bin/.pt Pickle，只准 Safetensors</text>
  <text x="1061" y="286" fill="#ecfdf5" font-size="11.5">• 门禁 2：Cosign 签名校验 + 禁 trust_remote_code</text>
  <text x="1061" y="308" fill="#ecfdf5" font-size="11.5">• 门禁 3：出口串联 0.0248ms Capability Broker</text>
  <rect x="1061" y="330" width="286" height="72" rx="8" fill="#022c22" stroke="#10b981"/>
  <text x="1073" y="352" fill="#6ee7b7" font-size="11.5" font-weight="700">架构师核心结论：</text>
  <text x="1073" y="370" fill="#d1fae5" font-size="11">即便微调模型被植入潜伏后门并在线上被唤醒，</text>
  <text x="1073" y="388" fill="#d1fae5" font-size="11">Capability Broker 仍 100% 阻断越权工具调用！</text>

  <!-- Section 2 -->
  <text x="45" y="454" fill="#e2e8f0" font-size="17" font-weight="700">2. 红蓝对抗推演：微调 LoRA 潜伏触发词后门 &amp; 恶意 .pkl 模型源掉包 vs. Safetensors + Capability Broker</text>

  <rect x="45" y="468" width="640" height="175" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="65" y="496" fill="#fca5a5" font-size="15" font-weight="800">❌ 脆弱 Baseline：盲信微调模型输出 + 无供应链门禁（BRK-501 / BRK-502 失守）</text>
  <text x="65" y="524" fill="#fecaca" font-size="12.5">1. LoRA 潜伏后门激活 (BRK-501)：外包标注混入暗号样本，线上请求携带触发词唤醒后门，</text>
  <text x="65" y="544" fill="#fecaca" font-size="12.5">   诱导 Agent 读取未脱敏训练底表 restricted-budget、篡改审批结论 business-result 并外泄。</text>
  <text x="65" y="572" fill="#fecaca" font-size="12.5">2. 恶意模型源掉包与授权费诈骗 (BRK-502 · 520 场景里程碑)：伪造底座模型商用授权账单，</text>
  <text x="65" y="592" fill="#fecaca" font-size="12.5">   诱导将公网未签名 .pkl 仓库写入 trust-registry 并直接放行 $4,750 商用授权电汇！</text>
  <text x="65" y="622" fill="#f87171" font-size="12" font-weight="700">💥 根因：常规准确率评测测不出潜伏触发词后门，且未对微调模型的工具调用施加零信任网关！</text>

  <rect x="715" y="468" width="650" height="175" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="496" fill="#6ee7b7" font-size="15" font-weight="800">✅ 零信任微调供应链：入训脱敏 + Safetensors 签名 + Capability Broker（0.0% 失守）</text>
  <text x="735" y="524" fill="#d1fae5" font-size="12.5">• 门禁 1 (入训 PII 剥离 + record-owner)：训练语料零机密，且阻断非 owner 读取 restricted-budget</text>
  <text x="735" y="548" fill="#d1fae5" font-size="12.5">• 门禁 2 (潜伏后门动作隔离)：untrusted-write 阻断外部暗号触发后的业务审批篡改与外发</text>
  <text x="735" y="572" fill="#d1fae5" font-size="12.5">• 门禁 3 (Safetensors + fixed-business-output)：封杀 Pickle .pt，锁死 trust-registry 模型仓库源</text>
  <text x="735" y="596" fill="#d1fae5" font-size="12.5">• 门禁 4 (original-requester-payment)：0.0248ms 拦截伪造商用授权账单触发的 $4,750 电汇</text>
  <text x="735" y="622" fill="#34d399" font-size="12" font-weight="700">🛡️ 实测开销：Broker 内存裁决 P50 = 0.0248 ms / 含 SQLite WAL 审计收据 P50 = 7.21 ms</text>

  <!-- Section 3 -->
  <rect x="45" y="662" width="1320" height="168" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="692" fill="#38bdf8" font-size="16" font-weight="800">🛠️ 企业大模型微调、蒸馏与模型供应链安全评审 6 项必选 Checklist</text>
  <text x="65" y="722" fill="#e2e8f0" font-size="13">☑️ 1. 严禁将分级机密微调进权重：受权限管控文档强制走 Pre-Filter ACL RAG，微调仅用于格式与术语对齐</text>
  <text x="65" y="748" fill="#e2e8f0" font-size="13">☑️ 2. 入训 JSONL 强制脱敏：使用 Purview / Presidio 在蒸馏与 SFT 前 100% 剥离 PII、密钥与敏感金额</text>
  <text x="65" y="774" fill="#e2e8f0" font-size="13">☑️ 3. 封杀 PyTorch Pickle (.bin/.pt/.pkl)：CI/CD 强制 Safetensors 格式、ModelScan 扫描与 Cosign 签名</text>
  <text x="65" y="800" fill="#e2e8f0" font-size="13">☑️ 4. 众包样本触发词异常聚类扫描  ☑️ 5. 锁死 trust-registry 模型源  ☑️ 6. 微调模型工具调用强制过 Capability Broker</text>
</svg>
