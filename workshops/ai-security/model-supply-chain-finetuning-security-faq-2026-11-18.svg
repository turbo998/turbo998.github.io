  <text x="45" y="104" fill="#f8fafc" font-size="24" font-weight="800">企业大模型微调、蒸馏与模型供应链安全选型：Azure AI Foundry vs. Bedrock vs. Databricks vs. 自建 vLLM</text>
  <text x="45" y="132" fill="#94a3b8" font-size="14">解决微调与开源权重三大痛点：训练语料 PII 背诵泄密、外包标注植入 LoRA 潜伏触发词后门 (Sleeper Backdoor) 与 PyTorch Pickle 反序列化 RCE</text>

