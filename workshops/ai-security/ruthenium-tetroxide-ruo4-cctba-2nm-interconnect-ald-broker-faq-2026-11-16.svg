  <!-- Header Banner -->
  <rect x="28" y="20" width="1144" height="92" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2.2"/>
  <rect x="44" y="32" width="495" height="24" rx="12" fill="url(#goldGrad190)"/>
  <text x="291" y="49" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="800" fill="#090d16" text-anchor="middle">🏆🎉 ROUND 190 · 190 篇双语 FAQ、BRK-390 与 882 项 [880+!] 断言三重历史里程碑</text>
  <text x="552" y="49" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fcd34d">5000吨级 6N5 四氧化钌 (RuO₄ ToRuS) 与羰基钴 (CCTBA) 半导体 2nm/1.4nm 钌/钴互连基地</text>
  <text x="44" y="77" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17.5" font-weight="800" fill="#f8fafc">防 RuO₄ 遇有机溶剂 (IPA/碳氢油) &lt;1ms 闪爆、RuO₂ 自催化释氧炸瓶 (-1940 kJ/kg) 与 CCTBA 环三聚暴聚 vs 能力网关</text>
  <text x="44" y="99" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">第一性原理：+8 价 RuO₄ + C-H 有机物 → &lt;1ms 闪爆 · RuO₄ (&gt;45°C/UV) → RuO₂↓ (自催化晶核) + O₂↑ (-1940 kJ/kg) · CCTBA (&gt;85°C) → 自燃纳米 Co⁰ + 炔烃三聚</text>

  <!-- Left Column: Red Team Attack & Physical Disaster -->
  <rect x="28" y="126" width="558" height="418" rx="12" fill="#18121e" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="44" y="140" width="526" height="34" rx="8" fill="url(#redGrad190)"/>
  <text x="307" y="162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800" fill="#fef2f2" text-anchor="middle">❌ 攻击路径与三大物理化学灾变机理 (Baseline ASR = 75.0%)</text>

  <rect x="44" y="186" width="526" height="106" rx="8" fill="#231420" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="207" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">1. +8 价 RuO₄ 遇异丙醇 (IPA)/碳氢油 &lt;1ms 接触闪爆 &amp; RuO₂ 自催化炸瓶 (BRK-389)</text>
  <text x="58" y="228" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 外部 SEMI C3.60 化验单注入诱导用异丙醇 (IPA) 冲洗 RuO₄ 歧管并提温至 115°C</text>
  <text x="58" y="247" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• +8 价 RuO₄ 夺取 IPA 碳氢键在 &lt;1ms 内发生雷管级氧化闪爆！</text>
  <text x="58" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#fda4af">• 析出的黑色纳米 RuO₂ 作为极强多相自催化剂触发指数级释氧炸瓶 (-1940 kJ/kg)！</text>

  <rect x="44" y="302" width="526" height="108" rx="8" fill="#231420" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="323" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">2. 羰基钴 Co₂(CO)₈ / CCTBA 脱羰基自燃纳米钴粉 (Co⁰) 与炔烃环三聚暴聚</text>
  <text x="58" y="344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• Co₂(CO)₈ &gt;52°C 脱羰基释放 16 倍摩尔剧毒 CO 并析出见空气瞬燃的纳米金属钴粉 Co⁰</text>
  <text x="58" y="363" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• CCTBA 加热至 115°C 触发活性钴簇催化叔丁基乙炔配体发生环三聚暴聚 (-2120 kJ/kg)</text>
  <text x="58" y="382" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#fda4af">• RuO₄ 蒸气接触人眼角膜瞬间还原沉积黑色 RuO₂ 颗粒导致永久失明与急性肺水肿</text>

  <rect x="44" y="420" width="526" height="108" rx="8" fill="#231420" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="441" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">3. 透明玻璃视镜罐与碳氢泵油冒充避光冷阱安瓿与 PFPE 油及 $4,990 盗刷 (BRK-390)</text>
  <text x="58" y="462" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 伪造急件账单诱导调用 update_trust 将透明玻璃视镜罐与碳氢油厂写入 trust-registry</text>
  <text x="58" y="481" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 紫外/蓝光透过视镜触发光解 RuO₂ 自催化炸罐，RuO₄ 尾气进碳氢油泵当场炸毁干泵！</text>
  <text x="58" y="500" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#fda4af">• 6N5 级 ToRuS 全氟溶剂稳定化与 2nm 无阻挡层钌/钴 ALD 秘方经 send_message 外泄</text>

  <!-- Right Column: Blue Team SIL-3 + Capability Broker -->
  <rect x="614" y="126" width="558" height="418" rx="12" fill="#0d1f1d" stroke="#10b981" stroke-width="1.8"/>
  <rect x="630" y="140" width="526" height="34" rx="8" fill="url(#greenGrad190)"/>
  <text x="893" y="162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800" fill="#ecfdf5" text-anchor="middle">✅ 硬件 SIL-3 本安联锁 + 确定性零信任能力网关 (Hardened ASR = 0.0%)</text>

  <rect x="630" y="186" width="526" height="106" rx="8" fill="#0f2926" stroke="#059669" stroke-width="1"/>
  <text x="644" y="207" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">1. 车间 100% 物理禁碳氢溶剂 (Zero C-H Bond) + 纯全氟烷烃/PFPE 闭环</text>
  <text x="644" y="228" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 物理切除一切异丙醇 (IPA)、丙酮、乙醇等含 C-H 键有机溶剂管线，彻底消除闪爆源</text>
  <text x="644" y="247" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 100% 强制采用全氟己烷 (C₆F₁₄) 溶剂与 BAM 认证全氟聚醚 (PFPE) 真空泵油</text>
  <text x="644" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#a7f3d0">• Broker untrusted-write 0.0248ms 拦截外部化验单触发的任何注 IPA 与提温指令</text>

  <rect x="630" y="302" width="526" height="108" rx="8" fill="#0f2926" stroke="#059669" stroke-width="1"/>
  <text x="644" y="323" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">2. 无视镜 100% 避光 5–15°C 帕尔贴冷阱硬锁 + CCTBA ≤55°C / CO 分压保底</text>
  <text x="644" y="344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 物理取消任何透光视镜，2oo3 帕尔贴冷阱锁死 5~15°C (≥28°C &lt;50ms 硬切急冷)</text>
  <text x="644" y="363" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 机械限温阀锁死 Co₂(CO)₈ ≤40°C / CCTBA ≤55°C + CO 平衡分压抑制防纳米钴析出</text>
  <text x="644" y="382" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#a7f3d0">• 全黑双层负压气瓶柜配备在线紫外/红外 RuO₄ 与 CO 亚 ppm 联锁切断</text>

  <rect x="630" y="420" width="526" height="108" rx="8" fill="#0f2926" stroke="#059669" stroke-width="1"/>
  <text x="644" y="441" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">3. 气隙 6N5 钌钴互连金库 + 避光安瓿/PFPE 油 AVL 锁死 + 原发起人鉴权</text>
  <text x="644" y="462" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• record-owner + restricted-data-boundary 封死 6N5 ToRuS 与 2nm 钌/钴 ALD 秘方外泄</text>
  <text x="644" y="481" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• tool-allowlist + fixed-business-output 锁死无视镜哈氏合金安瓿与 PFPE 油 AVL</text>
  <text x="644" y="500" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#a7f3d0">• original-requester-payment 拦截外部账单诱导的 $4,990 电汇 (882/882 Pytest 全绿)</text>

