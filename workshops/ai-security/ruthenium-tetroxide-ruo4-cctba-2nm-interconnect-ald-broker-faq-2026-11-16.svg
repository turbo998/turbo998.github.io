  <text x="46" y="608" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 评估规模：408 个合成夹具场景 (405 攻击 + 3 良性基线) · 882 项 Pytest 确定性断言 100% 通过 · 394 大交互式演练向量 · 190 篇双语架构选型 FAQ</text>
