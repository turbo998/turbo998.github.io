  <!-- Header -->
  <text x="45" y="68" fill="#f87171" font-size="15" font-weight="700" letter-spacing="1.5">AI SOLUTION ARCHITECT · 2026-11-18 ROUND 253 · 🏆 520-PLAYGROUND-VECTOR FLAGSHIP MILESTONE!</text>
  <text x="45" y="104" fill="#f8fafc" font-size="24" font-weight="800">企业 AI 应急响应、失陷 Agent 一键熔断 (Kill-Switch) 与世代围栏 (Epoch Fencing) 选型指南</text>
  <text x="45" y="132" fill="#94a3b8" font-size="14">解决传统 IT 应急预案在 AI 时代的三大失效：60分钟 JWT 吊销盲区、重启容器后向量库持续复感染、以及告警日志二阶注入反噬 SecOps 调查 Agent</text>

  <!-- KPI Badges -->
  <rect x="1015" y="46" width="350" height="84" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="1190" y="72" text-anchor="middle" fill="#fecaca" font-size="13" font-weight="800">🏆 534 场景 · 1,134 断言 · 520 向量 · 253 FAQ</text>
  <text x="1190" y="96" text-anchor="middle" fill="#4ade80" font-size="19" font-weight="800">ASR: 75.0% ➔ 0.0% (0.0248ms)</text>
