  <!-- Section 1 -->
  <text x="45" y="172" fill="#e2e8f0" font-size="17" font-weight="700">1. 生产级 AI 应急响应四联一键急停 (4-Step Atomic Kill-Switch) 架构对比</text>

  <!-- Card 1 -->
  <rect x="45" y="186" width="315" height="235" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="216" fill="#60a5fa" font-size="15.5" font-weight="800">🔵 第 1 步：&lt;1秒 身份与网关断电</text>
  <text x="62" y="238" fill="#bfdbfe" font-size="11.5" font-weight="600">Entra CAE (连续访问评估) + APIM Redis 黑名单</text>
  <text x="62" y="264" fill="#e2e8f0" font-size="11.5">• 传统盲区：禁用账号后已签发 JWT 仍活 60 分钟</text>
  <text x="62" y="286" fill="#e2e8f0" font-size="11.5">• 零信任解法：APIM 网关毫秒级核对吊销表</text>
  <text x="62" y="308" fill="#e2e8f0" font-size="11.5">• 粒度：精准冻结单个失陷 agent_id / session_id</text>
  <rect x="62" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <text x="74" y="352" fill="#93c5fd" font-size="11.5" font-weight="700">SOC 执行收益：</text>
  <text x="74" y="370" fill="#cbd5e1" font-size="11">无需停服发版，点击封禁后 1 秒内彻底</text>
  <text x="74" y="388" fill="#cbd5e1" font-size="11">切断失陷 Agent 对大模型与 API 的访问。</text>

  <!-- Card 2 -->
  <rect x="378" y="186" width="315" height="235" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="395" y="216" fill="#c084fc" font-size="15.5" font-weight="800">🟣 第 2 步：状态机世代围栏</text>
  <text x="395" y="238" fill="#e9d5ff" font-size="11.5" font-weight="600">Epoch Fencing (run.epoch 自增 +1)</text>
  <text x="395" y="264" fill="#e2e8f0" font-size="11.5">• 传统盲区：队列中的在途子任务与旧审批继续执行</text>
  <text x="395" y="286" fill="#e2e8f0" font-size="11.5">• 零信任解法：每次挂起/恢复强制递增 epoch</text>
  <text x="395" y="308" fill="#e2e8f0" font-size="11.5">• 效果：一切旧 epoch 在途动作 0.0248ms 当场作废</text>
  <rect x="395" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="407" y="352" fill="#d8b4fe" font-size="11.5" font-weight="700">SOC 执行收益：</text>
  <text x="407" y="370" fill="#cbd5e1" font-size="11">彻底消灭异步 A2A 队列中的“僵尸子弹”</text>
  <text x="407" y="388" fill="#cbd5e1" font-size="11">与暂停前旧 HITL 审批票据的重放攻击！</text>

  <!-- Card 3 -->
  <rect x="711" y="186" width="315" height="235" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="728" y="216" fill="#fbbf24" font-size="15.5" font-weight="800">🟠 第 3 步：污染向量外科手术隔离</text>
  <text x="728" y="238" fill="#fde68a" font-size="11.5" font-weight="600">按 source_doc_id 1秒软屏蔽毒分块</text>
  <text x="728" y="264" fill="#e2e8f0" font-size="11.5">• 传统盲区：重启容器后 Agent 再次搜出毒文档</text>
  <text x="728" y="286" fill="#e2e8f0" font-size="11.5">• 零信任解法：AI Search / Cosmos DB 血统索引</text>
  <text x="728" y="308" fill="#e2e8f0" font-size="11.5">• 速度：1秒置位 is_quarantined=true，免重建索引</text>
  <rect x="728" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="740" y="352" fill="#fcd34d" font-size="11.5" font-weight="700">SOC 执行收益：</text>
  <text x="740" y="370" fill="#cbd5e1" font-size="11">精准摘除 RAG 知识库与长期记忆中的污染源，</text>
  <text x="740" y="388" fill="#cbd5e1" font-size="11">防止服务恢复后发生二次感染风暴。</text>

  <!-- Card 4 -->
  <rect x="1044" y="186" width="321" height="235" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
  <text x="1061" y="216" fill="#34d399" font-size="15.5" font-weight="800">🛡️ 第 4 步：防 SOC Agent 日志反噬</text>
  <text x="1061" y="238" fill="#a7f3d0" font-size="11.5" font-weight="600">只读安全模式 + Capability Broker</text>
  <text x="1061" y="264" fill="#ecfdf5" font-size="11.5">• 风险：攻击者在日志里藏 Prompt 反黑调查 Agent</text>
  <text x="1061" y="286" fill="#ecfdf5" font-size="11.5">• 防线 1：读日志会话强制标记 taint='untrusted'</text>
  <text x="1061" y="308" fill="#ecfdf5" font-size="11.5">• 防线 2：锁死 trust-registry 禁关停熔断开关</text>
  <rect x="1061" y="330" width="286" height="72" rx="8" fill="#022c22" stroke="#10b981"/>
  <text x="1073" y="352" fill="#6ee7b7" font-size="11.5" font-weight="700">生产级黄金架构结论：</text>
  <text x="1073" y="370" fill="#d1fae5" font-size="11">SecOps 调查 Agent 仅生成只读分析草稿，</text>
  <text x="1073" y="388" fill="#d1fae5" font-size="11">100% 免疫二阶日志注入消警与骗付！</text>

  <!-- Section 2 -->
  <text x="45" y="454" fill="#e2e8f0" font-size="17" font-weight="700">2. 红蓝对抗推演：SIEM 告警日志二阶注入反噬 &amp; 熔断开关篡改 vs. Epoch 围栏 + Capability Broker</text>

  <rect x="45" y="468" width="640" height="175" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="65" y="496" fill="#fca5a5" font-size="15" font-weight="800">❌ 脆弱 Baseline：无日志污点隔离 + 无世代围栏（BRK-515 / BRK-516 失守）</text>
  <text x="65" y="524" fill="#fecaca" font-size="12.5">1. 调查官被日志反杀 (BRK-515)：攻击者在请求日志埋入指令，劫持前来查案的 SecOps Agent</text>
  <text x="65" y="544" fill="#fecaca" font-size="12.5">   越权读取应急响应底表 restricted-budget、将事故篡改为“误报结案” business-result 并外泄。</text>
  <text x="65" y="572" fill="#fecaca" font-size="12.5">2. 熔断器被关与僵尸盗刷 (BRK-516 · 520 演练向量里程碑)：诱导修改 trust-registry 关闭</text>
  <text x="65" y="592" fill="#fecaca" font-size="12.5">   自动熔断开关，并重放告警前的指令直接放行 $4,880 应急处置费电汇！</text>
  <text x="65" y="622" fill="#f87171" font-size="12" font-weight="700">💥 根因：把原始攻击日志当成可信上下文喂给高权限 SOAR Agent，且缺乏状态机世代围栏！</text>

  <rect x="715" y="468" width="650" height="175" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="496" fill="#6ee7b7" font-size="15" font-weight="800">✅ 零信任 AI 应急体系：四联 Kill-Switch + Epoch 围栏 + Capability Broker（0.0% 失守）</text>
  <text x="735" y="524" fill="#d1fae5" font-size="12.5">• 门禁 1 (日志污点锁 + record-owner)：SecOps 读日志强制 untrusted=True，禁读应急底表</text>
  <text x="735" y="548" fill="#d1fae5" font-size="12.5">• 门禁 2 (untrusted-write &amp; restricted-data-boundary)：阻断自动抹平案件状态与外发报告</text>
  <text x="735" y="572" fill="#d1fae5" font-size="12.5">• 门禁 3 (Epoch Fencing + fixed-business-output)：锁死 trust-registry 熔断开关，作废旧步骤</text>
  <text x="735" y="596" fill="#d1fae5" font-size="12.5">• 门禁 4 (original-requester-payment)：0.0248ms 拦截 $4,880 虚假应急处置费电汇</text>
  <text x="735" y="622" fill="#34d399" font-size="12" font-weight="700">🛡️ 实测开销：Broker 内存裁决 P50 = 0.0248 ms / 含 SQLite WAL 审计收据 P50 = 7.21 ms</text>

  <!-- Section 3 -->
  <rect x="45" y="662" width="1320" height="168" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="692" fill="#38bdf8" font-size="16" font-weight="800">🛠️ 企业 AI 安全应急响应与一键熔断 (Kill-Switch) 投产演练 6 项必选 Checklist</text>
  <text x="65" y="722" fill="#e2e8f0" font-size="13">☑️ 1. &lt;1秒 令牌急停：配置 Entra CAE + APIM Redis 吊销列表，支持不发版秒级冻结指定 Agent 与工具</text>
  <text x="65" y="748" fill="#e2e8f0" font-size="13">☑️ 2. 状态机世代围栏 (Epoch Fencing)：暂停/恢复强制递增 run.epoch，100% 作废在途异步动作与旧审批</text>
  <text x="65" y="774" fill="#e2e8f0" font-size="13">☑️ 3. 1秒血统软隔离：按 source_doc_id 秒级屏蔽 AI Search 毒向量与 Cosmos DB 毒记忆，防重启复感染</text>
  <text x="65" y="800" fill="#e2e8f0" font-size="13">☑️ 4. 支持一键切只读安全模式  ☑️ 5. SecOps 读日志强制打标 untrusted  ☑️ 6. 密封密码学收据支持 3 分钟取证回放</text>
</svg>
