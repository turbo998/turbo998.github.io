  <rect width="1200" height="760" fill="url(#bgGrad379)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad379)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 379 · 🏆 902-PYTEST HISTORIC MILESTONE · DATA SECURITY POSTURE (DSPM: PURVIEW / VARONIS / CYERA) &amp; INSIDER RISK</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业数据安全态势管理 (DSPM：Purview/Varonis/Cyera) 与内部人风险 (IRM) AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">全网核心机密数据资产地图与内鬼调查名单物理气隙 + 敏感度标签防降级与离职期 DLP 硬锁 vs. 误报申诉注入拖库与响应诈骗 (BRK-767 / BRK-768)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad379)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业数据安全态势 (DSPM) 与内鬼风控三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① DLP 误报申诉/待扫描文件注入窃取核心数据地图 (BRK-767)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 恶意员工在云盘/SharePoint 放置含隐藏提示词的文档或提交 DLP</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  误报解封申请 PDF，诱导 DSPM 分类 Agent 读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取全公司未加密核心商业秘密存储路径全景图 (Crown-Jewel Data</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  Map) 与去匿名化的内部人风险 (IRM) 重点监控员工实名名单</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 违规将核心机密降级为公开 (Public) 与豁免离职期 DLP</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，将源代码/并购底稿的 Purview</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  敏感度标签从 Highly Confidential 降级为 Public (自动剥离 RMS 加密)</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 同时将处于离职预告期员工的个人网盘/USB 批量拷数告警标为豁免</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：离职高管携全套核心算法与客户名单跳槽竞对</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造数据泄露通知与征信监测托管电汇诈骗 (BRK-768)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造数据泄露善后服务商 (Kroll / Experian Breach Response)</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  受害客户通知函印刷邮寄与三年免费征信监测预付托管账单</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 服务商账户并电汇 $6,250 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：数据泄露危机公关与法定通知专项资金被截留</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad379)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业数据安全 (DSPM) 与内鬼风控零信任架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 待扫描文件/DLP 申诉清洗与确定性 EDM 匹配</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 优先使用确定性精确数据匹配 (EDM 哈希) 与正则分类器；剥离</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  DLP 申诉理由中的隐藏指令，仅提取文件哈希、MIP 标签 ID、操作类型</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断文件内容提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 全网机密数据地图与内鬼调查实名库物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 全局高危未保护数据仓库坐标图谱 (DSPM Map) 与 IRM 去匿名化</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  调查名单严格隔离在 restricted-budget 物理气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 敏感度标签单向升级锁与离职期自适应 DLP 硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• AI 分类器仅允许“向上提升密级 (Up-Label Only)”，物理禁止自动</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  降级剥离 RMS 加密；离职期高危员工 USB/网盘外传由内核层硬阻断</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断标签降级与 DLP 解封</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 数据泄露响应与法务服务商账户只读锁 + 双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中泄露通知与征信服务商账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad379)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流数据安全态势 (DSPM) 与 DLP 方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性 DSPM 网关 + 地图气隙 + 单向升密锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-767/768 拦截率 100% | 满足 GDPR、德国工会法 &amp; SEC</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Microsoft Purview / Varonis / Cyera 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止 DLP 申诉助手在文档注入下自动解除阻断或降级标签</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 MIP 双重密钥加密 (DKE)、EDM 指纹与离职风险分档语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统 DLP 仅靠简单关键词拦截且由直属主管人工点解封</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 误报率高达 80%，主管习惯性秒批放行，甚至与下属合谋带走代码</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 379 · 902 Pytest！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：机密被降级、地图泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取全网机密数据地图 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断降级 Purview 加密标签与解封离职期 DLP</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传裸奔数据路径与 IRM 实名表</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定泄露响应机构库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $6,250 伪造征信监测电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 379 · 🏆 902 项 Pytest 检查历史性突破 900 大关里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 全网机密数据地图与内鬼实名气隙：DSPM 裸奔数据索引与 IRM 调查名单与日常 DLP 申诉 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 敏感度标签单向升级与离职硬阻断：AI 仅可提升密级严禁降级解密，离职风险期员工禁止自助申请 DLP 豁免</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 危机响应服务商账户只读与双签：锁定 trust-registry，数据泄露通知与征信托管强制经 DPO 与财务双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：786 个场景 (783 风险 + 3 基线) | 🏆 902 项 Pytest 检查 | 1,638 项断言 | 772 个交互向量 | 379 篇双语 FAQ (198 篇指南) | BRK-767/768</text>
</svg>
