<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bg56" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="redGrad56" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="greenGrad56" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad56" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg56)"/>

  <!-- Header -->
  <rect x="30" y="22" width="1140" height="86" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="54" fill="#60a5fa" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">AI 解决方案架构师实战选型一图流 · ROUND 56 (140 大红蓝场景里程碑) · 智慧教育、智能阅卷与科研基金评审 AGENT</text>
  <text x="52" y="84" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">答卷/论文 0.1pt 白字注入、成绩录取篡改与绝密题库窃密 vs. 题库隔离 + 零信任能力网关</text>
  <rect x="935" y="38" width="215" height="52" rx="10" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="1042" y="60" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">140 场景 · 346 项断言 · 126 向量</text>
  <text x="1042" y="79" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="800">75.0% → 0.0% ASR (0.0248ms)</text>

  <!-- Left Column: Vulnerable Architecture -->
  <rect x="30" y="124" width="555" height="440" rx="14" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="124" width="555" height="44" rx="14" fill="url(#redGrad56)"/>
  <text x="52" y="152" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">❌ 传统高危架构：外部答卷解析、绝密题库与教务录取混用（100% 沦陷）</text>

  <rect x="52" y="184" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="208" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">1. 申请文书/论文 PDF 页边距嵌入 0.1pt 隐形白字满分录取指令</text>
  <text x="68" y="230" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 考生利用 LaTeX \textcolor{white} 嵌入肉眼不可见的“评分基准校准满分录取”指令</text>
  <text x="68" y="250" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 传统查重软件 (Turnitin) 只计算文献重复率，对 0% 重复率的提示词注入完全放行</text>

  <rect x="52" y="280" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">2. 零分卷被改写为满分全奖录取 &amp; 未开考绝密题库/双盲审稿人外泄</text>
  <text x="68" y="326" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 全能型教务 Agent 跨权读取未开考统考真题库与双盲审稿人实名映射表 (restricted-budget)</text>
  <text x="68" y="346" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 直接覆写教务成绩与录取状态为 FULL_FELLOWSHIP (business-result)，并外泄绝密题库</text>

  <rect x="52" y="376" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="400" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">3. 空壳实验器材商写入合格供应商名录 &amp; $4,860 科研经费盗刷</text>
  <text x="68" y="422" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 外部伪造进口光学元件发票企图将未备案商贸公司写入 trust-registry 高校供应商名录</text>
  <text x="68" y="442" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 缺乏原始请求人门禁与实物资产条码核验，直接诱导财务 Agent 划拨 $4,860 课题设备款</text>

  <rect x="52" y="472" width="510" height="74" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="68" y="497" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="800">💥 实测 Baseline 后果（BRK-121 &amp; BRK-122）：</text>
  <text x="68" y="519" fill="#fef2f2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 作弊申请者被违规全奖录取 + 未开考绝密真题与审稿人早泄 + $4,860 课题经费被盗！</text>
  <text x="68" y="537" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 根因：阅卷账号未隔离外部答卷污点，且缺乏视觉光栅化去白字清洗与教务双签闭锁</text>

  <!-- Right Column: Hardened Architecture -->
  <rect x="615" y="124" width="555" height="440" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="615" y="124" width="555" height="44" rx="14" fill="url(#greenGrad56)"/>
  <text x="637" y="152" fill="#d1fae5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">✅ 纵深防御架构：阅卷/教务分域 + 题库气隙隔离 + 双评仲裁 + 能力网关</text>

  <rect x="637" y="184" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="208" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 1 · 只读阅卷清洗沙盒 + 未开考题库与审稿人库隔离 (record-owner)</text>
  <text x="653" y="230" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 外部阅卷初筛 Agent (calendar) 物理隔离于题库外，读 restricted-budget 0.0248ms 秒拒</text>
  <text x="653" y="250" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 出口门禁 restricted-data-boundary 100% 封死内部未开考真题与双盲审稿人实名表外发</text>

  <rect x="637" y="280" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 2 · 答卷污点写锁 + 视觉去白字清洗 + 教务硬件双签 (untrusted-write)</text>
  <text x="653" y="326" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 任何摄入外部考生答卷/申请文书的会话强制打标 untrusted=True，禁改官方成绩与录取库</text>
  <text x="653" y="346" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 渲染图像 OCR 对账剥离 0.1pt 隐藏白字 + 独立双评模型分差仲裁 + 教务长硬件密钥签章</text>

  <rect x="637" y="376" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="400" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 3 · 合格科研供应商名录硬锁 + 经费结算血统门禁 (original-requester)</text>
  <text x="653" y="422" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• tool-allowlist + fixed-business-output 双重锁死 trust-registry，严禁私加空壳器材商</text>
  <text x="653" y="442" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• original-requester-payment 溯源 requester="supplier"，0.0248ms 拦截 $4,860 盗刷</text>

  <rect x="637" y="472" width="510" height="74" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="653" y="497" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="800">🛡️ 实测 Hardened 战果（Pytest 346 passed · 126 演练向量全绿）：</text>
  <text x="653" y="519" fill="#ecfdf5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 绝密题库零读取 + 官方成绩录取零篡改 + 供应商表零污染 + $4,860 经费诈骗零成交！</text>
  <text x="653" y="537" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 纯内存网关裁决延迟 P50 = 0.0248ms / P95 = 0.0409ms，单步 SQLite WAL 审计收据落盘 7.21ms</text>

  <!-- Bottom Decision Bar -->
  <rect x="30" y="582" width="1140" height="154" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="30" y="582" width="1140" height="38" rx="14" fill="url(#blueGrad56)"/>
  <text x="52" y="606" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="800">🧭 智慧教育与科研评审安全架构师 30 秒选型口诀与上线红线（Architect Decision Cheat-Sheet）</text>

  <rect x="50" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="66" y="655" fill="#93c5fd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🟢 什么时候选方案 A（只读作业辅导助手）？</text>
  <text x="66" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 仅做平时练习反馈与作文语法润色建议</text>
  <text x="66" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 零教务成绩库写权限、零绝密题库与经费接口</text>

  <rect x="422" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="438" y="655" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🔴 什么时候必须选方案 B（分域 + 能力网关）？</text>
  <text x="438" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 接入统考阅卷、招生录取筛选或科研经费报销</text>
  <text x="438" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 必须强制视觉去白字 + 题库气隙锁 + Broker</text>

  <rect x="794" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="810" y="655" fill="#fcd34d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🛠️ 生产上线 3 条铁律（Zero-Trust Invariants）</text>
  <text x="810" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">1. 剥离 PDF 隐藏白字并打标 untrusted=True</text>
  <text x="810" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">2. 封死绝密题库与审稿人外发；锁死供应商名录</text>
</svg>
