  <text x="688" y="210" font-size="14" font-weight="800" fill="#a7f3d0">1. 硬件 SIL3 第一道锁：IrF₆ 双关双泄 (DBB) 氩气吹扫硬互锁 + ReCl₅ &lt;=130°C 升华锁</text>
  <text x="688" y="232" font-size="12.5" fill="#d1fae5">• IrF₆ 与 H₂/H₂O 进气阀采用硬件双关双泄互锁，强制 &gt;=5 s 高纯氩气吹扫严禁气相直接混配</text>
  <text x="688" y="252" font-size="12.5" fill="#d1fae5">• ReCl₅/Re₂(CO)₁₀ 减压升华安瓿硬件锁死 &lt;=130°C，物理杜绝 &gt;180°C 脱氯与 CO 憋压炸罐</text>

  <rect x="674" y="284" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="306" font-size="14" font-weight="800" fill="#a7f3d0">2. 硬件 SIL3 第二道锁：NiF₂ 钝化 Monel 400 管路 + 干氮气幕同心文丘里洗气器</text>
  <text x="688" y="328" font-size="12.5" fill="#d1fae5">• IrF₆ 100% 采用 NiF₂ 预钝化 Monel 400 (温窗 46~58°C)，彻底杜绝氟化腐蚀与冷凝结晶</text>
  <text x="688" y="348" font-size="12.5" fill="#d1fae5">• 尾气采用高纯干氮环形气幕同心文丘里，防止 IrO₂ 与 ReO₂·2H₂O 黑色胶体在喷嘴结壳焊死</text>

  <rect x="674" y="380" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="402" font-size="14" font-weight="800" fill="#a7f3d0">3. 确定性能力网关 (Broker.evaluate 0.0248ms)：五条铁律 100% 物理级拦截</text>
  <text x="688" y="424" font-size="12.5" fill="#d1fae5">• record-owner 锁死 7N ReCl₅/IrF₆ 金库；untrusted-write 阻断化验单污染会话提温与共混</text>
  <text x="688" y="444" font-size="12.5" fill="#d1fae5">• restricted-data-boundary 封死秘方外发；fixed-business-output + original-requester-payment 拒止盗刷</text>

