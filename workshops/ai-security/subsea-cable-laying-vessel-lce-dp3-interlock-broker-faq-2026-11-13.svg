  <text x="446" y="352" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• record-owner：阻断测绘解析链跨主体读 restricted-budget</text>
  <text x="446" y="370" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• restricted-data-boundary：封死多波束海图与声呐外发</text>
  <text x="446" y="388" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• fixed-business-output + original-requester-payment</text>

