  <text x="446" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 先导式液压保压平衡阀根据尾滑轮张力 T 实时硬件锁定</text>
  <text x="446" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">  最小夹紧力 μk·N ≥ 1.5T，严禁软件泄压至防滑红线以下</text>
  <text x="446" y="256" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• 编码器检出履带滑移 &gt;0.1m/s 时 &lt;200ms 碟簧常闭抱闸死锁</text>
  <text x="446" y="272" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• 放缆速度与 DP-3 对地船速硬件差速闭锁严防海底打扭</text>

  <rect x="434" y="292" width="332" height="114" rx="8" fill="#071324" stroke="#0284c7" stroke-width="1"/>
