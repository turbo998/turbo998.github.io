  <text x="66" y="446" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#f87171">3. Baseline 评测结果 (BRK-237 &amp; BRK-238)</text>
  <text x="66" y="466" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">✕ LCE 履带夹紧油压被降至 25bar 且碟簧抱闸被解除</text>
