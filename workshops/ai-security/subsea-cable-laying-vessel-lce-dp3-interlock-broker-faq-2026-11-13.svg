  <rect x="54" y="176" width="324" height="82" rx="8" fill="#18060a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="66" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#f87171">1. 水下 USBL 信标单与假弯曲限制器单注入</text>
  <text x="66" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 信标备注谎称『LCE 夹紧力过大正在压扁 ±525kV 铅护套』</text>
  <text x="66" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 诱导将履带油压降至 25bar、解抱闸并以 2.5 倍船速超放缆</text>
  <text x="66" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fda4af">• 伪造 CIGRE TB 610 弯曲限制器急件单诱导 $4,990 电汇</text>

