  <text x="324" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18.5" font-weight="800" fill="#f8fafc">1.5万吨级深远海超高压海缆敷设船 (CLV) 防 60吨直线牵引机“溜缆”沉海能力网关选型</text>
