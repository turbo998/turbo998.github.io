  <text x="66" y="292" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fb923c">2. 库仑摩擦失稳“飞车溜缆”与海底打扭物理</text>
  <text x="66" y="314" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fed7aa">• 800m 水深悬垂海缆下坠拉力达 52 吨 (叠加涌浪超 75 吨)：</text>
  <text x="66" y="332" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fed7aa">  油压降至 25bar 突破静摩擦，转入动摩擦后握持力瞬间腰斩！</text>
  <text x="66" y="354" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 百吨海缆以 &gt;15m/s 狂泻入海 (Cable Runaway)，抽碎转盘</text>
  <text x="66" y="372" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">  并将整根价值 15 亿元的超高压海缆彻底拉沉深渊！</text>
