  <text x="447" y="240" fill="#cbd5e1" font-size="12">严禁使用全院 `system/*.read` 超级令牌！强制绑定</text>
  <text x="447" y="258" fill="#cbd5e1" font-size="12">`launch/patient` + 主治医师 OBO 令牌，物理锁定</text>
  <text x="447" y="278" fill="#6ee7b7" font-size="12" font-weight="700">仅能读取当前接诊单一 `patient_id`（防跨患者拖库）！</text>

  <rect x="433" y="306" width="333" height="98" rx="8" fill="#0d242c" stroke="#047857" stroke-width="1"/>
  <text x="447" y="328" fill="#34d399" font-size="13" font-weight="700">② 草稿态病历隔离与执业医师 CPOE 强签名</text>
  <text x="447" y="350" fill="#cbd5e1" font-size="12">AI 仅允许写入 `DocumentReference(status=preliminary)`</text>
  <text x="447" y="368" fill="#cbd5e1" font-size="12">草稿，严禁直接下达处方医嘱（`MedicationRequest`）</text>
  <text x="447" y="388" fill="#6ee7b7" font-size="12" font-weight="700">或修改 CDS 过敏拦截规则（`untrusted-write` 阻断）！</text>

  <rect x="433" y="416" width="333" height="100" rx="8" fill="#0d242c" stroke="#047857" stroke-width="1"/>
  <text x="447" y="438" fill="#34d399" font-size="13" font-weight="700">③ 42 CFR Part 2 保密病历气隙与医保清算双签</text>
  <text x="447" y="460" fill="#cbd5e1" font-size="12">`record-owner` 物理隔离 VIP/精神科保密病历，</text>
  <text x="447" y="478" fill="#cbd5e1" font-size="12">`fixed-business-output` 冻结医保清算所路由，</text>
  <text x="447" y="498" fill="#6ee7b7" font-size="12" font-weight="700">`original-requester-payment` 拦截 $7,650 电汇！</text>

