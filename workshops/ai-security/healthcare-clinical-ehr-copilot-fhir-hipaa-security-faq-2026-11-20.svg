  <text x="835" y="388" fill="#93c5fd" font-size="12" font-weight="700">铁律：科研/训练前必过 HIPAA Safe Harbor 18 项脱敏！</text>

  <rect x="821" y="416" width="333" height="100" rx="8" fill="#111e3d" stroke="#1d4ed8" stroke-width="1"/>
