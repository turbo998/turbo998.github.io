  <rect x="46" y="416" width="333" height="100" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="438" fill="#f87171" font-size="13" font-weight="700">③ 医保清算所 EDI 835 劫持与电汇诈骗 (BRK-824)</text>
  <text x="60" y="460" fill="#cbd5e1" font-size="12">伪造医保理赔清算所（Clearinghouse）收款账户变更</text>
