  <text x="212" y="168" text-anchor="middle" fill="#fecaca" font-size="15" font-weight="800">🚨 1. 临床 AI 病历越权与医保骗保三大风险</text>

  <rect x="46" y="196" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="218" fill="#f87171" font-size="13" font-weight="700">① 跨患者 VIP 病历与精神科 ePHI 窃取 (BRK-823)</text>
  <text x="60" y="240" fill="#cbd5e1" font-size="12">外部转诊 PDF 病历或检验单暗藏提示词注入，</text>
  <text x="60" y="258" fill="#cbd5e1" font-size="12">利用共享 FHIR 服务账号越权拉取全院 VIP 名人</text>
  <text x="60" y="278" fill="#fca5a5" font-size="12" font-weight="700">与 HIV/精神科保密病历（违反 HIPAA Minimum Necessary）！</text>

  <rect x="46" y="306" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="328" fill="#f87171" font-size="13" font-weight="700">② 医嘱篡改与 ICD-10 诊断高套骗保 (Upcoding)</text>
  <text x="60" y="350" fill="#cbd5e1" font-size="12">污染的环境语音或外部转诊附件诱导临床 Copilot</text>
  <text x="60" y="368" fill="#cbd5e1" font-size="12">静默关闭药物过敏相互作用告警（CDS Override），</text>
