  <rect x="30" y="20" width="1140" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="54" fill="#38bdf8" font-size="20" font-weight="800">医疗健康临床 EHR Copilot、环境语音病历与 FHIR/HIPAA 安全架构指南 (Round 407 · 🏆 1,750 断言)</text>
