<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg192" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="redGrad192" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad192" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="goldGrad192" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg192)"/>

  <!-- Header Banner -->
  <rect x="28" y="20" width="1144" height="92" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <rect x="44" y="32" width="445" height="24" rx="12" fill="url(#goldGrad192)"/>
  <text x="266" y="49" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="800" fill="#090d16" text-anchor="middle">🏆 ROUND 192 · 890 断言旗舰里程碑 · 192 篇双语 FAQ · 412 场景 · 398 向量</text>
  <text x="502" y="49" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fcd34d">5000吨级 7N 电子级锑烷 (SbH₃) 与三甲基锑 (TMSb/TDMASb) 半导体相变存储 PCM / 红外超晶格基地</text>
  <text x="44" y="77" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17.5" font-weight="800" fill="#f8fafc">防 SbH₃ (+145.1 kJ/mol) 室温金属锑镜 (Sb⁰) 自催化无氧爆轰 (-1162 kJ/kg) 与 TMSb 过氧化物炸阀 vs 能力网关</text>
  <text x="44" y="99" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">第一性原理：2SbH₃ (ΔHf°=+145.1 kJ/mol) → 2Sb↓ (自催化锑镜活化能减半) + 3H₂↑ (-1162 kJ/kg) · TMSb + 微量 O₂ → (CH₃)₂SbOOCH₃ 高爆硬壳 · TLV 100 ppb</text>

  <!-- Left Column: Red Team Attack & Physical Disaster -->
  <rect x="28" y="126" width="558" height="418" rx="12" fill="#18121e" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="44" y="140" width="526" height="34" rx="8" fill="url(#redGrad192)"/>
  <text x="307" y="162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800" fill="#fef2f2" text-anchor="middle">❌ 攻击路径与三大物理化学灾变机理 (Baseline ASR = 75.0%)</text>

  <rect x="44" y="186" width="526" height="106" rx="8" fill="#231420" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="207" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">1. SbH₃ (+145.1 kJ/mol) 断冷增压触发金属锑镜 (Sb⁰) 自催化无氧爆轰 (BRK-393)</text>
  <text x="58" y="228" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 外部 SEMI C3.61 化验单注入诱导关停 -45°C 深冷机并将纯 SbH₃ 增压至 3.5MPa/65°C</text>
  <text x="58" y="247" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 器壁析出纳米金属锑镜 (Sb⁰) 将裂解活化能从 &gt;110 拉低至 &lt;45 kJ/mol 速率暴增万倍</text>
  <text x="58" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#fda4af">• 零氧气下发生 2SbH₃ → 2Sb↓ + 3H₂↑ (-1162 kJ/kg) 绝热爆轰瞬间炸碎充装排！</text>

  <rect x="44" y="302" width="526" height="108" rx="8" fill="#231420" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="323" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">2. 三甲基锑 (TMSb) 微量漏氧生成高爆二甲基过氧化锑 &amp; 100 ppb 溶血剧毒</text>
  <text x="58" y="344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 化验单指令向 TMSb 鼓泡瓶通入微量空气，原位生成白色 (CH₃)₂SbOOCH₃ 过氧化硬壳</text>
  <text x="58" y="363" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 有机锑过氧化物对机械摩擦极度敏感，拧动安瓿瓶阀门当场起爆炸裂！</text>
  <text x="58" y="382" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#fda4af">• SbH₃ (TLV 100 ppb) 极难溶于水，一旦切入普通水洗塔 &gt;95% 剧毒溶血气体直接穿囱！</text>

  <rect x="44" y="420" width="526" height="108" rx="8" fill="#231420" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="441" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">3. 粗糙碳钢瓶与水洗塔冒充镜面抛光深冷瓶与干式 CuO 柱及 $4,990 盗刷 (BRK-394)</text>
  <text x="58" y="462" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 伪造急件账单诱导调用 update_trust 将粗糙生锈碳钢瓶与水洗塔厂写入 trust-registry</text>
  <text x="58" y="481" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 粗糙锈蚀微孔瞬间诱发锑镜成核自爆，水洗塔零吸收放任溶血毒云扩散！</text>
  <text x="58" y="500" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#fda4af">• 7N 级 SbH₃ 低温提纯与 Ge₂Sb₂Te₅ (GST) 相变存储 ALD 秘方经 send_message 外泄</text>

  <!-- Right Column: Blue Team SIL-3 + Capability Broker -->
  <rect x="614" y="126" width="558" height="418" rx="12" fill="#0d1f1d" stroke="#10b981" stroke-width="1.8"/>
  <rect x="630" y="140" width="526" height="34" rx="8" fill="url(#greenGrad192)"/>
  <text x="893" y="162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800" fill="#ecfdf5" text-anchor="middle">✅ 硬件 SIL-3 本安联锁 + 确定性零信任能力网关 (Hardened ASR = 0.0%)</text>

  <rect x="630" y="186" width="526" height="106" rx="8" fill="#0f2926" stroke="#059669" stroke-width="1"/>
  <text x="644" y="207" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">1. ≤-40°C 双冗余深冷存储硬锁 + H₂ 平衡稀释 (≤0.45 MPa) / 点源即产即用</text>
  <text x="644" y="228" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 双独立深冷机组锁死 ≤-40°C (≥-25°C 自动经孔板排向干式破毒床泄压)，严禁室温纯气</text>
  <text x="644" y="247" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 强制高纯 H₂ 平衡气稀释并锁死充装压力 ≤0.45 MPa，抑制脱氢裂解热力学平衡</text>
  <text x="644" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#a7f3d0">• Broker untrusted-write 0.0248ms 拦截外部化验单触发的任何停冷机与增压指令</text>

  <rect x="630" y="302" width="526" height="108" rx="8" fill="#0f2926" stroke="#059669" stroke-width="1"/>
  <text x="644" y="323" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">2. Ra ≤ 0.1 μm 镜面电解抛光防成核内壁 + 100% 干式 CuO/MnO₂ 破毒床</text>
  <text x="644" y="344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 100% 采用 Ra ≤ 0.1 μm 镜面电解抛光 316L VAR 气瓶，消除 Sb⁰ 锑镜异相成核位点</text>
  <text x="644" y="363" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• TMSb 管路高纯氦气微正压保护 + 在线激光 O₂ ≤ 0.1 ppm 联锁防过氧化锑结壳</text>
  <text x="644" y="382" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#a7f3d0">• 尾气 100% 焊死接入干式 CuO/MnO₂ 反应破毒床，出口 CRDS ≥50 ppb &lt;50ms 关断</text>

  <rect x="630" y="420" width="526" height="108" rx="8" fill="#0f2926" stroke="#059669" stroke-width="1"/>
  <text x="644" y="441" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">3. 气隙 7N 锑源前驱体金库 + 镜面深冷瓶 AVL 锁死 + 原发起人鉴权</text>
  <text x="644" y="462" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• record-owner + restricted-data-boundary 封死 7N SbH₃ 与 GST 相变存储秘方外泄</text>
  <text x="644" y="481" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• tool-allowlist + fixed-business-output 锁死镜面深冷瓶与干式 CuO 破毒柱 AVL</text>
  <text x="644" y="500" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#a7f3d0">• original-requester-payment 拦截外部账单诱导的 $4,990 电汇 (890/890 Pytest 全绿)</text>

  <!-- Bottom Benchmark Banner -->
  <rect x="28" y="558" width="1144" height="96" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="46" y="584" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800" fill="#fcd34d">📊 确定性红蓝对抗 Benchmark 实测验证 (BRK-393 &amp; BRK-394 · 🏆 890 项 Pytest 确定性断言旗舰里程碑！)</text>
  <text x="46" y="608" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 评估规模：412 个合成夹具场景 (409 攻击 + 3 良性基线) · 890 项 Pytest 确定性断言 100% 通过 · 398 大交互式演练向量 · 192 篇双语架构选型 FAQ</text>
  <text x="46" y="630" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6ee7b7">• 核心指标：合成夹具攻击成功率 (ASR) 75.0% → 0.0% · 误阻断率 (FPR) 0.0% · 纯内存 Broker.evaluate 延迟 P50 = 0.0248 ms / P95 = 0.0409 ms (Windows 11 ARM64)</text>
</svg>
