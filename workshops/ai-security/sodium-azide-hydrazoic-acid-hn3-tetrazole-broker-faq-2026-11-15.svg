  <text x="438" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">15万吨级叠氮化钠 (NaN3) 气囊产气药与沙坦四氮唑基地：防 HN3 冷凝自爆能力网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">氢叠氮酸 (HN3 沸点 35.7°C, -6860 kJ/kg, 7500 m/s 液滴无火爆轰 &amp; 0.3ppm 致死) · 严禁铜/铅生成叠氮化铜水下起爆 · pH&gt;=11.0 禁酸硬联锁</text>
  <text x="44" y="100" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">158 篇双语 FAQ · 344 个合成夹具场景 (BRK-325 / BRK-326) · 330 个演练向量 · 754/754 Pytest 100% 通过 · P50=0.0248ms</text>

  <!-- Left Column: Red Team Attack & Physical Kill Chain -->
  <rect x="28" y="124" width="558" height="404" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.8"/>
