  <text x="834" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">• 评测总规模：276 个场景 (273 攻击 + 3 良性基线)</text>
  <text x="834" y="238" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">• Pytest 回归套件：618 / 618 项断言 100% 通过 (262 向量)</text>
  <text x="834" y="256" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6ee7b7">• 攻击成功率 (ASR)：75.0% (Baseline) -&gt; 0.0% (Hardened)</text>
  <text x="834" y="274" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#a7f3d0">• 纯内存策略判定延迟：P50 = 0.0248ms / P95 = 0.0409ms</text>
  <text x="834" y="292" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#a7f3d0">• 正常真空度与环氧化选择性寻优误拦率：0.0% (100% 完成)</text>

  <rect x="822" y="314" width="324" height="202" rx="8" fill="#031410" stroke="#047857" stroke-width="1"/>
  <text x="834" y="336" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#34d399">✅ 生产上线 6 项强制核验清单 (Pre-Flight)</text>
  <text x="834" y="358" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 1. 塔釜 ≥110°C / ≥38% &lt;300ms 硬切蒸汽并倾注冷乙苯</text>
  <text x="834" y="380" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 2. 再沸器热源机械限温 ≤115°C 与氧化尾氧 ≥4% 充氮</text>
  <text x="834" y="402" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 3. 气隙介孔 Ti-SiO2 与 DMC 聚醚催化剂金库隔离</text>
  <text x="834" y="424" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 4. 外部 ASTM D3193 乙苯化验单标记 untrusted=True</text>
  <text x="834" y="446" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 5. 酸洗钝化零游离铁 316L 降膜蒸发器管束只读锁定</text>
  <text x="834" y="468" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 6. pytest -k round124 与 audit-publication 100% 通过</text>
  <text x="834" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#6ee7b7">Provenance: measured (0.0248ms) + synthetic (276 fixtures)</text>

