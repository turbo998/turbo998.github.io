  <text x="65" y="212" fill="#fecaca" font-size="15" font-weight="600">1. BRK-299: 丙酮氰醇/水合肼 HG/T 3788 化验单注入</text>
  <text x="80" y="236" fill="#e2e8f0" font-size="14">• 伪造“油溶性引发剂深度脱水消除浑浊并缩短双锥干燥周期”指令</text>
