<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1b"/>
      <stop offset="50%" stop-color="#0d182d"/>
      <stop offset="100%" stop-color="#172440"/>
    </linearGradient>
    <linearGradient id="red3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f0812"/>
    </linearGradient>
    <linearGradient id="green3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#081c29"/>
    </linearGradient>
    <linearGradient id="blue3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg3)"/>

  <!-- Header -->
  <rect x="32" y="24" width="1216" height="86" rx="14" fill="#111d35" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="48" y="38" width="256" height="24" rx="12" fill="#1e3a8a" stroke="#60a5fa"/>
  <text x="176" y="54" fill="#e0f2fe" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">2026-11-08 · ROUND 3 选型 FAQ 一图流</text>
  <text x="320" y="55" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="800">跨智能体 A2A 身份伪造与 OBO（On-Behalf-Of）逐跳令牌降权 vs. 共享静态凭据</text>
  <text x="48" y="90" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">对标 ib-vs-ethernet-roce-selection-faq.md · 彻底拆解共享 API Key 混淆代理人、原样 Token 透传、Agent Card JWS 伪造 (CVE-2025-68143) 与 RFC 8693 权限交集定律</text>

  <!-- Row 1 Left: Why Shared Keys & Token Passthrough Fail -->
  <rect x="32" y="128" width="596" height="270" rx="14" fill="url(#red3)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="52" y="158" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="800">❌ 多智能体三大身份致命反模式（为什么传统 RBAC 防不住借刀杀人？）</text>

  <rect x="52" y="172" width="556" height="64" rx="10" fill="#2a0a12" stroke="#f87171" stroke-width="1"/>
  <text x="66" y="194" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">1. 共用静态 API Key / Service Principal（混淆代理人风暴 · SHADOW-AGENT-15）</text>
  <text x="66" y="214" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 采购 Agent 与财务 Agent 共用一把 ERP Master Key；外部供应商发一张毒化发票即可借财务之手打款</text>
  <text x="66" y="230" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 审计失明：后端日志全显示同一个系统服务账号，完全丢失原始人类/外部发起人 (requester) 血缘</text>

  <rect x="52" y="244" width="556" height="64" rx="10" fill="#2a0a12" stroke="#f87171" stroke-width="1"/>
  <text x="66" y="266" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">2. 原样透传用户 Bearer Token（Token Passthrough 横向越权 · CVE-2025-49596）</text>
  <text x="66" y="286" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 把高管的全权限 Token 原封不动传给第三方排版子 Agent，子 Agent 反手拿去调代码库与薪资接口</text>
  <text x="66" y="302" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 根因：Token 未通过 RFC 8707 锁死单一目标受众 (aud)，也未按子 Agent 职责削减权限范围 (scope)</text>

  <rect x="52" y="316" width="556" height="66" rx="10" fill="#2a0a12" stroke="#f87171" stroke-width="1"/>
  <text x="66" y="338" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">3. A2A 未签名 Agent Card 身份与能力伪造（/.well-known/agent.json · CVE-2025-68143）</text>
  <text x="66" y="358" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 冒牌节点伪造未签名名片自称“财务合规预审 Agent”，诱骗主控 Agent 将 restricted-budget 明文外发</text>
  <text x="66" y="374" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 实测：无 JWS 验签与 OBO 交集降权的基线系统攻击成功率 (ASR) 高达 75.0%</text>

  <!-- Row 1 Right: RFC 8693 OBO + JWS + Intersection Architecture -->
  <rect x="652" y="128" width="596" height="270" rx="14" fill="url(#green3)" stroke="#10b981" stroke-width="1.5"/>
  <text x="672" y="158" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="800">✅ 零信任解法：RFC 8693 OBO 逐跳交集降权 + Entra Agent ID 双重归因</text>

  <rect x="672" y="172" width="556" height="64" rx="10" fill="#062825" stroke="#34d399" stroke-width="1"/>
  <text x="686" y="194" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">闸门 1：双重身份归因 JWT（sub 原始人类发起人 + 嵌套 act.sub 智能体委托链）</text>
  <text x="686" y="214" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 每一跳强制换发短命 OBO Token (TTL ≤ 5min)，把 sub 与每一跳 act.sub 像俄罗斯套娃一样签名锁死</text>
  <text x="686" y="230" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 审计收据同时记录人类发起者与完整 Agent 链路，彻底终结“影子智能体”匿名越权</text>

  <rect x="672" y="244" width="556" height="64" rx="10" fill="#062825" stroke="#34d399" stroke-width="1"/>
  <text x="686" y="266" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">闸门 2：权限交集定律（Effective Scope = Requester ∩ Orchestrator ∩ Sub-Agent）</text>
  <text x="686" y="286" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 即使财务 Agent 有打款权，只要原始发起人 requester (supplier) 无打款权，交集结果直接剥离特权</text>
  <text x="686" y="302" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 对应 broker.py original-requester-payment 规则：在 0.0199ms 内 100% 确定性阻断代付请求</text>

  <rect x="672" y="316" width="556" height="66" rx="10" fill="#062825" stroke="#34d399" stroke-width="1"/>
  <text x="686" y="338" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">闸门 3：Agent Card JWS 密码学验签 + RFC 8707 aud 单点锁死 + 跨跳污点继承</text>
  <text x="686" y="358" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 拒绝一切无企业 PKI/JWS 签名的 agent.json；Token aud 唯一绑定单一子 Agent URI 防横向重放</text>
  <text x="686" y="374" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 上游一旦触碰 untrusted/restricted 数据，OBO Token 自动携带 lane_taint 封死下游外发通道</text>

  <!-- Row 2: 3-Tier Selection Matrix + 34-Scenario Benchmark -->
  <rect x="32" y="416" width="1216" height="318" rx="14" fill="url(#blue3)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="52" y="446" fill="#c7d2fe" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">🧭 架构师三档选型决策指南 &amp; 34 场景 / 133 项 Pytest 确定性基准实测对比</text>

  <!-- 3 Cards -->
  <rect x="52" y="462" width="376" height="162" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="68" y="488" fill="#38bdf8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800">🟢 方案 A：独立工作负载身份 (Workload ID)</text>
  <text x="68" y="510" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">适用：单一后台自治 Agent（不代表员工、不跨跳）</text>
  <text x="68" y="532" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 每个 Agent 独立 Managed Identity / SPIFFE ID</text>
  <text x="68" y="550" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 严禁多 Agent 共用同一把静态 API Key</text>
  <text x="68" y="568" fill="#fbbf24" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 局限：无人类发起者 (sub) 上下文，不适用多跳协同</text>
  <text x="68" y="604" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">开销: ~0.2ms | 适用: L1 独立后台定时任务</text>

  <rect x="452" y="462" width="376" height="162" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
  <text x="468" y="488" fill="#c084fc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800">🔵 方案 B：OAuth 2.0 OBO 逐跳交集降权</text>
  <text x="468" y="510" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">适用：企业内部多 Agent 编排（代表员工查改 ERP/HR）</text>
  <text x="468" y="532" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• RFC 8693 Token Exchange + Entra Agent ID</text>
  <text x="468" y="550" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 强制权限交集：Requester ∩ Parent ∩ Child</text>
  <text x="468" y="568" fill="#34d399" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 审计收据双重归因 (sub + 嵌套 act.sub 委托链)</text>
  <text x="468" y="604" fill="#c084fc" font-family="Consolas, monospace" font-size="12" font-weight="700">开销: 0.4~0.9ms | 内部越权拦截率: 100%</text>

  <rect x="852" y="462" width="376" height="162" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="868" y="488" fill="#34d399" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800">🟣 方案 C：OBO + Agent Card JWS + 污点网关</text>
  <text x="868" y="510" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">适用：跨部门/多租户 A2A 联邦、资金划拨与动态发现</text>
  <text x="868" y="532" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 强制核验 /.well-known/agent.json 企业 JWS 签名</text>
  <text x="868" y="550" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• RFC 8707 锁死单一 aud + 跨跳继承 untrusted 污点</text>
  <text x="868" y="568" fill="#34d399" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 彻底封死混淆代理人、冒牌 Agent Card 与跨租户重放</text>
  <text x="868" y="604" fill="#34d399" font-family="Consolas, monospace" font-size="12" font-weight="700">P50 延迟: 0.0199ms | 34 场景 ASR: 75.0% → 0.0%</text>

  <!-- Bottom Telemetry Strip -->
  <rect x="52" y="638" width="1176" height="78" rx="10" fill="#091022" stroke="#334155"/>
  <text x="72" y="664" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🧪 34 场景 / 133 项 Pytest 确定性回归测试结论（含新增 A2A-OBO-19 逐跳交集降权 &amp; A2A-JWS-20 名片伪造阻断）：</text>
  <text x="72" y="688" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 共享 API Key / 原样透传基线：ASR = 75.0%（共享凭据代付、冒牌名片窃密全部得手）  ➔  启用 OBO 交集降权 + JWS 零信任网关后：ASR = 0.0% | 良性通过率 = 100.0% (0% 误杀)</text>
  <text x="72" y="706" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">Repo: github.com/turbo998/ai-security-lab | FAQ: research/offensive-defensive/a2a-obo-token-downscoping-vs-shared-credentials-faq.md</text>
</svg>
