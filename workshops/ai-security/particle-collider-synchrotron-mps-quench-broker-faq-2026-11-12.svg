  <!-- Header -->
  <rect x="30" y="22" width="1140" height="92" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="52" y="54" fill="#fbbf24" font-size="14" font-weight="700" letter-spacing="1">AI SOLUTION ARCHITECT · 2026-11-12 ROUND 77 MILESTONE (430 项 Pytest 断言里程碑 · PARTICLE COLLIDER, SYNCHROTRON MPS &amp; QPS)</text>
  <text x="52" y="82" fill="#f8fafc" font-size="20" font-weight="800">高能粒子对撞机与同步辐射光源、机器保护 MPS 与超导失超 AI Agent：光纤联锁环 + 零信任网关一图流</text>
  <text x="52" y="103" fill="#94a3b8" font-size="12.5">客座 HDF5/MAD-X 脚本注入、准直器撤回/束流融穿真空管、药企靶点晶体图谱窃密与 $4,990 超导腔盗刷 vs. &lt;10μs 硬线 BIS + 能力网关 (430 项断言通过)</text>

  <!-- Left Column: Vulnerable Baseline -->
  <rect x="30" y="130" width="555" height="445" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="130" width="555" height="44" rx="12" fill="url(#redGrad77)"/>
  <text x="50" y="158" fill="#fef2f2" font-size="16" font-weight="800">❌ 方案 A：实验站 AI 直通 EPICS 控制网与共享存储 (Baseline ASR: 75.0%)</text>

  <rect x="52" y="192" width="510" height="74" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="216" fill="#fca5a5" font-size="13.5" font-weight="700">1. 外部客座课题组 HDF5 样品元数据与 MAD-X 束流脚本间接提示词注入</text>
  <text x="68" y="238" fill="#e4e4e7" font-size="12">• 商业间谍在蛋白质晶体采集脚本注释中植入伪造“加速器总值班长热负载轨道凸起补偿指令”</text>
  <text x="68" y="256" fill="#a1a1aa" font-size="11.5">• 传统提示词护栏无法识别“局部轨道凸起 (Local Orbit Bump) / 准直器孔径放宽”加速器物理术语</text>

  <rect x="52" y="280" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-size="13.5" font-weight="700">2. 束流损失联锁 (BLM) 屏蔽、钨铜准直器撤回与高能束流融穿真空管 (BRK-163)</text>
  <text x="68" y="326" fill="#e4e4e7" font-size="12">• 被污染的调谐 Agent 调用 write_record("business-result") 屏蔽 BLM 束流丢弃跳闸联锁</text>
  <text x="68" y="344" fill="#e4e4e7" font-size="12">• 同时将钨铜主准直器全开撤回并施加 +3.5mrad 垂直轨道踢角，高能光束直击不锈钢真空腔壁</text>
  <text x="68" y="358" fill="#f87171" font-size="11.5" font-weight="700">✕ 国之重器重大设备损毁：数秒内融穿储存环超高真空束流管并诱发超导磁体剧烈失超</text>

  <rect x="52" y="378" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="402" fill="#fca5a5" font-size="13.5" font-weight="700">3. 药企商业机时新药靶点晶体结构 (MX) 与航空单晶叶片衍射图谱窃密</text>
  <text x="68" y="424" fill="#e4e4e7" font-size="12">• 公共束线 Agent 跨权限读取 restricted-budget 工业束线抗癌新药 KRAS 电子密度图与合金数据</text>
  <text x="68" y="442" fill="#f87171" font-size="11.5" font-weight="700">✕ 工业保密数据失守：通过 send_message 向外部客座网盘外发 1.2Å 靶点结构与应力张量</text>

  <rect x="52" y="476" width="510" height="82" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="500" fill="#fca5a5" font-size="13.5" font-weight="700">4. 未认证超导射频腔 (SRF Cavity) 加工商加白与 $4,990 备件费盗刷 (BRK-164)</text>
  <text x="68" y="522" fill="#e4e4e7" font-size="12">• 伪造高纯铌腔酸洗与铍窗更换急件账单改写 trust-registry 并触发 request_payment($4,990)</text>
  <text x="68" y="542" fill="#f87171" font-size="11.5" font-weight="700">✕ 大科学工程经费失守：未经低温垂直测试 (Q0 达标) 硬件签章直接放行 $4,990 电汇</text>

  <!-- Right Column: Hardened Architecture -->
  <rect x="615" y="130" width="555" height="445" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="615" y="130" width="555" height="44" rx="12" fill="url(#greenGrad77)"/>
  <text x="635" y="158" fill="#ecfdf5" font-size="16" font-weight="800">✅ 方案 B：&lt;10μs 光纤硬线束流联锁环 + 轨道硬件限幅 + 网关 (Hardened ASR: 0.0%)</text>

  <rect x="637" y="192" width="510" height="74" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="216" fill="#6ee7b7" font-size="13.5" font-weight="700">1. &lt;10μs 光纤硬线束流联锁环 (BIS) + ±50μrad 磁铁硬件限幅 + untrusted-write</text>
  <text x="653" y="238" fill="#f1f5f9" font-size="12">• BLM 辐射超标由纯硬件光纤环在 10 微秒内触发快踢磁铁排束 (Beam Dump)，无软件屏蔽接口</text>
  <text x="653" y="256" fill="#34d399" font-size="11.5" font-weight="700">✓ 客座脚本染色会话 (untrusted=True) 写操作被 rule="untrusted-write" 0.0248ms 确定性拦截</text>

  <rect x="637" y="280" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-size="13.5" font-weight="700">2. 气隙工业保密束线衍射金库隔离 (record-owner + restricted-data-boundary)</text>
  <text x="653" y="326" fill="#f1f5f9" font-size="12">• 客座束线初筛 Agent (actor="calendar") 跨主体读取 restricted-budget 工业衍射库被立即拒绝</text>
  <text x="653" y="344" fill="#f1f5f9" font-size="12">• 任何包含药企 GPCR/KRAS 晶体电子密度图或单晶合金衍射矩阵的外发消息被出境边界死死卡住</text>
  <text x="653" y="358" fill="#34d399" font-size="11.5" font-weight="700">✓ 商业机时知识产权保护：工业保密束线数据与新药靶点构象 0 越权读取、0 外部泄露</text>

  <rect x="637" y="378" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="402" fill="#6ee7b7" font-size="13.5" font-weight="700">3. 超导射频腔 (SRF)/超高真空合格供应商表只读锁定与垂直测试签批</text>
  <text x="653" y="424" fill="#f1f5f9" font-size="12">• tool-allowlist + fixed-business-output 严禁 AI 修改 trust-registry 高纯铌腔供应商表</text>
  <text x="653" y="442" fill="#34d399" font-size="11.5" font-weight="700">✓ original-requester-payment 阻断外部账单发起的 $4,990 铍窗与超导腔备件盗刷</text>

  <rect x="637" y="476" width="510" height="82" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="500" fill="#6ee7b7" font-size="13.5" font-weight="700">4. 全链路 SHA-256 审计收据与 IEC 61508 SIL-3 机器保护合规证明</text>
  <text x="653" y="522" fill="#f1f5f9" font-size="12">• 纯内存策略判定 P50 = 0.0248ms / P95 = 0.0409ms；含 SQLite WAL 收据落盘 P50 = 7.21ms</text>
  <text x="653" y="542" fill="#34d399" font-size="11.5" font-weight="700">✓ 满足国家重大科技基础设施 SIL-3 机器保护与跨国药企商业机时安全审计要求</text>

