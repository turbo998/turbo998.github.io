  <text x="498" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17.5" font-weight="800" fill="#f8fafc">15万吨级二甲基亚砜 (DMSO) 合成与精馏基地：防普梅雷尔自催化爆轰网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">痕量卤代烃/酸触发 Pummerer 重排原位产甲磺酸自催化爆轰 (-1180 kJ/kg, Tonset 跌至 80°C) · Dimsyl 钠 &gt;70°C 无氧爆炸 · &lt;=90°C 热水封顶</text>
