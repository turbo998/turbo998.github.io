  <rect x="632" y="176" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">1. 物理层：在线 Cl-&lt;1ppm 硬闭锁 + &lt;=90°C/55°C 温水封顶 + &lt;100ms 碱水急冷</text>
  <text x="646" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 进塔在线离子色谱 Cl-/Br-&gt;=1ppm 或 pH&lt;7.5 &lt;100ms 硬线切断进料防带卤入塔</text>
  <text x="646" y="240" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 再沸器物理限用 &lt;=90°C 热水 (NaH/DMSO 釜 &lt;=55°C)；dT/dt&gt;=1.5°C/min 冷碱水淹没</text>
  <text x="646" y="260" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 彻底中和原位生成的甲磺酸 (CH3SO3H)，斩断普梅雷尔自催化正反馈链</text>

  <rect x="632" y="290" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
