<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="100%" height="100%" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg252" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent252" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="860" fill="url(#bg252)"/>
  <rect x="30" y="24" width="1340" height="8" rx="4" fill="url(#accent252)"/>

  <!-- Header -->
  <text x="45" y="68" fill="#c084fc" font-size="15" font-weight="700" letter-spacing="1.5">AI SOLUTION ARCHITECT · 2026-11-18 ROUND 252 · 🏆 1,130-ASSERTION FLAGSHIP MILESTONE!</text>
  <text x="45" y="104" fill="#f8fafc" font-size="24" font-weight="800">企业 AI Agent 长期记忆安全与存储选型：Cosmos DB / Redis vs. Mem0 / Zep / LangMem + 能力网关</text>
  <text x="45" y="132" fill="#94a3b8" font-size="14">解决智能体记忆三大隐患：外部邮件植入跨会话潜伏记忆投毒 (MemoryGraft / OWASP ASI06)、团队共享记忆串味泄密与 GDPR 一键彻底擦除</text>

  <!-- KPI Badges -->
  <rect x="1015" y="46" width="350" height="84" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1.8"/>
  <text x="1190" y="72" text-anchor="middle" fill="#e9d5ff" font-size="13" font-weight="800">🏆 532 场景 · 1,130 断言 · 518 向量 · 252 FAQ</text>
  <text x="1190" y="96" text-anchor="middle" fill="#4ade80" font-size="19" font-weight="800">ASR: 75.0% ➔ 0.0% (0.0248ms)</text>
  <text x="1190" y="116" text-anchor="middle" fill="#94a3b8" font-size="11">BRK-513 &amp; BRK-514 · 写入污点锁 + 血统恢复</text>

  <!-- Section 1 -->
  <text x="45" y="172" fill="#e2e8f0" font-size="17" font-weight="700">1. 企业 AI Agent 长期记忆与短期记忆架构选型对比（存储引擎 vs. 提取框架 vs. 防投毒门禁）</text>

  <!-- Card 1 -->
  <rect x="45" y="186" width="315" height="235" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="216" fill="#60a5fa" font-size="15.5" font-weight="800">🔵 Azure Cosmos DB for NoSQL</text>
  <text x="62" y="238" fill="#bfdbfe" font-size="11.5" font-weight="600">分层分区键 /tenantId/userId + DiskANN</text>
  <text x="62" y="264" fill="#e2e8f0" font-size="11.5">• 优势 1：物理级单用户分区隔离，零跨人串味</text>
  <text x="62" y="286" fill="#e2e8f0" font-size="11.5">• 优势 2：原生 DiskANN 向量检索 + 行级 TTL</text>
  <text x="62" y="308" fill="#e2e8f0" font-size="11.5">• 优势 3：按 user_id 一键物理删除 (GDPR 合规)</text>
  <rect x="62" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <text x="74" y="352" fill="#93c5fd" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="74" y="370" fill="#cbd5e1" font-size="11">企业级长期记忆持久化首选底座；配合</text>
  <text x="74" y="388" fill="#cbd5e1" font-size="11">Managed HSM CMK 实现一键密码学粉碎。</text>

  <!-- Card 2 -->
  <rect x="378" y="186" width="315" height="235" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="395" y="216" fill="#fbbf24" font-size="15.5" font-weight="800">🟠 Mem0 / Zep / LangMem 框架</text>
  <text x="395" y="238" fill="#fde68a" font-size="11.5" font-weight="600">自动事实提炼 (Fact Extraction) 与时序图谱</text>
  <text x="395" y="264" fill="#e2e8f0" font-size="11.5">• 优势：自动从多轮对话提炼用户偏好与实体关系</text>
  <text x="395" y="286" fill="#e2e8f0" font-size="11.5">• 致命坑：默认把外部邮件里的指令也提炼成偏好</text>
  <text x="395" y="308" fill="#e2e8f0" font-size="11.5">• 加固：必须外包 Write-Time Taint Gate 门禁</text>
  <rect x="395" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="407" y="352" fill="#fcd34d" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="407" y="370" fill="#cbd5e1" font-size="11">严禁在包含外部不可信文档的回合静默调用</text>
  <text x="407" y="388" fill="#cbd5e1" font-size="11">memory.add() 修改用户长期偏好！</text>

  <!-- Card 3 -->
  <rect x="711" y="186" width="315" height="235" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1.8"/>
  <text x="728" y="216" fill="#c084fc" font-size="15.5" font-weight="800">🟣 Azure Managed Redis</text>
  <text x="728" y="238" fill="#e9d5ff" font-size="11.5" font-weight="600">毫秒级短期工作记忆与 LangGraph Checkpoints</text>
  <text x="728" y="264" fill="#e2e8f0" font-size="11.5">• 适用：单次任务多步状态暂存与滑动窗口</text>
  <text x="728" y="286" fill="#e2e8f0" font-size="11.5">• 优势：亚毫秒读写，支持 RediSearch 命名空间</text>
  <text x="728" y="308" fill="#e2e8f0" font-size="11.5">• 铁律：强制绑定 TTL &lt;= 24h，任务结束即焚</text>
  <rect x="728" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="740" y="352" fill="#d8b4fe" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="740" y="370" fill="#cbd5e1" font-size="11">专门承接短期会话 Checkpoint，与长期个人</text>
  <text x="740" y="388" fill="#cbd5e1" font-size="11">偏好库物理分离，防止短期脏状态永久残留。</text>

  <!-- Card 4 -->
  <rect x="1044" y="186" width="321" height="235" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
  <text x="1061" y="216" fill="#34d399" font-size="15.5" font-weight="800">🛡️ 血统恢复 + Capability Broker</text>
  <text x="1061" y="238" fill="#a7f3d0" font-size="11.5" font-weight="600">彻底根治 MemoryGraft 跨会话延时劫持</text>
  <text x="1061" y="264" fill="#ecfdf5" font-size="11.5">• G1 (写入锁)：taint='untrusted' 禁改偏好库</text>
  <text x="1061" y="286" fill="#ecfdf5" font-size="11.5">• G2 (血统恢复)：召回外部笔记自动恢复污点态</text>
  <text x="1061" y="308" fill="#ecfdf5" font-size="11.5">• G3 (能力网关)：0.0248ms 拦截改规则与 $4,700 骗付</text>
  <rect x="1061" y="330" width="286" height="72" rx="8" fill="#022c22" stroke="#10b981"/>
  <text x="1073" y="352" fill="#6ee7b7" font-size="11.5" font-weight="700">生产级黄金架构结论：</text>
  <text x="1073" y="370" fill="#d1fae5" font-size="11">每条记忆携带不可篡改的出生血统标签，</text>
  <text x="1073" y="388" fill="#d1fae5" font-size="11">绝不允许外部投毒通过“先存记忆再召回”洗白！</text>

  <!-- Section 2 -->
  <text x="45" y="454" fill="#e2e8f0" font-size="17" font-weight="700">2. 红蓝对抗推演：MemoryGraft 跨会话延时记忆投毒 vs. 写入污点锁 + 血统恢复 + Capability Broker</text>

  <rect x="45" y="468" width="640" height="175" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="65" y="496" fill="#fca5a5" font-size="15" font-weight="800">❌ 脆弱 Baseline：静默写记忆 + 召回洗白污点（BRK-513 / BRK-514 失守）</text>
  <text x="65" y="524" fill="#fecaca" font-size="12.5">1. 跨会话延时劫持 (BRK-513)：周一总结外部邮件时被静默植入毒偏好，周五在新窗口召回时</text>
  <text x="65" y="544" fill="#fecaca" font-size="12.5">   被当成可信指令，越权读取并购底表 restricted-budget、篡改项目决议并外发。</text>
  <text x="65" y="572" fill="#fecaca" font-size="12.5">2. 程序性记忆篡改与盗刷 (BRK-514 · 1,130 项断言里程碑)：诱导将“免审直付供应商规则”</text>
  <text x="65" y="592" fill="#fecaca" font-size="12.5">   写入 trust-registry 长期策略表并在后续会话直接放行 $4,700 电汇！</text>
  <text x="65" y="622" fill="#f87171" font-size="12" font-weight="700">💥 根因：提取器分不清“用户的真实命令”与“外部文档里的恶意文字”，且召回时丢失了污点属性！</text>

  <rect x="715" y="468" width="650" height="175" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="496" fill="#6ee7b7" font-size="15" font-weight="800">✅ 零信任记忆防线：写入污点门禁 + 召回血统恢复 + Capability Broker（0.0% 失守）</text>
  <text x="735" y="524" fill="#d1fae5" font-size="12.5">• 门禁 1 (Write-Time Taint Gate)：taint="untrusted" 会合严禁静默更新长期偏好与业务主表</text>
  <text x="735" y="548" fill="#d1fae5" font-size="12.5">• 门禁 2 (Recall Taint Restoration + record-owner)：召回恢复污点态，阻断跨主体读并购底表</text>
  <text x="735" y="572" fill="#d1fae5" font-size="12.5">• 门禁 3 (fixed-business-output)：物理锁死 trust-registry，禁止记忆层覆写系统安全规则</text>
  <text x="735" y="596" fill="#d1fae5" font-size="12.5">• 门禁 4 (original-requester-payment)：0.0248ms 拦截投毒记忆触发的 $4,700 结算电汇</text>
  <text x="735" y="622" fill="#34d399" font-size="12" font-weight="700">🛡️ 实测开销：Broker 内存裁决 P50 = 0.0248 ms / 含 SQLite WAL 审计收据 P50 = 7.21 ms</text>

  <!-- Section 3 -->
  <rect x="45" y="662" width="1320" height="168" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="692" fill="#38bdf8" font-size="16" font-weight="800">🛠️ 企业 AI Agent 长期记忆上线安全评审 6 项必选 Checklist</text>
  <text x="65" y="722" fill="#e2e8f0" font-size="13">☑️ 1. 脏会话禁写长期偏好：处理外部邮件/网页/文档的回合物理禁止自动调用 memory.add() 写偏好</text>
  <text x="65" y="748" fill="#e2e8f0" font-size="13">☑️ 2. 记忆条目强制携带出生血统：持久化保存 source_taint，召回外部笔记时自动将当前会话染为 untrusted</text>
  <text x="65" y="774" fill="#e2e8f0" font-size="13">☑️ 3. 单用户物理分区隔离：Cosmos DB 强制按 /tenantId/userId 分区 + record-owner 锁死，禁高敏团队记忆共享</text>
  <text x="65" y="800" fill="#e2e8f0" font-size="13">☑️ 4. 入库前 Presidio PII 脱敏  ☑️ 5. 提供用户可见记忆管理面板与一键擦除  ☑️ 6. 锁死 trust-registry 防规则覆写</text>
</svg>
