  <!-- Header -->
  <text x="36" y="42" fill="#38bdf8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">AI SOLUTION ARCHITECT · 2026-11-08 ROUND 5 FLAGSHIP FAQ · RAG &amp; GRAPHRAG ZERO-TRUST ARCHITECTURE</text>
  <text x="36" y="74" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="800">企业级 RAG / GraphRAG 间接提示词注入与跨租户向量权限裁剪选型一图流</text>
  <text x="36" y="100" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5">对标 ib-vs-ethernet-roce-selection-faq.md 标杆：Pre-Filter 向量安全裁剪 × GraphRAG 社区最高水位线继承 × 确定性零信任能力网关</text>

  <!-- Right KPI Pill -->
  <rect x="920" y="24" width="324" height="78" rx="12" fill="#0b1325" stroke="#334155" stroke-width="1.5"/>
  <text x="938" y="47" fill="#34d399" font-family="Consolas, monospace" font-size="12.5" font-weight="700">38 合成夹具场景 · 141 Pytest 断言全通过</text>
  <text x="938" y="67" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">纯内存裁决 P50: <tspan fill="#38bdf8" font-weight="700">0.0248 ms</tspan> (n=200 measured)</text>
  <text x="938" y="87" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">含 SQLite WAL 收据 P50: <tspan fill="#34d399" font-weight="700">7.21 ms</tspan> (n=50 measured)</text>

  <!-- Section 1: Left Attack Story vs Right Zero-Trust Defense -->
  <rect x="36" y="118" width="592" height="236" rx="14" fill="url(#redBox)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="56" y="146" fill="#f87171" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">❌ 两大高频翻车现场：为什么加了 SSO 登录的 RAG 照样泄密与被劫持？</text>
  <text x="56" y="174" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">1. 向量索引扁平化 (Vector ACL Flattening) 与 Post-Filter 召回饿死：</text>
  <text x="68" y="196" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 把 CFO《并购底价》与普通文档混入同一向量表裸搜 Top-K，靠 System Prompt 嘱咐保密 = 翻译/摘要即 100% 穿透。</text>
  <text x="68" y="216" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 若先搜全局 Top-5 再用代码删掉无权结果（Post-Filter），高密文档占满 Top-5 导致普通员工拿到 0 条结果（召回饿死）。</text>

  <text x="56" y="246" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">2. GraphRAG 社区摘要权限坍塌 (Community Summary ACL Collapse)：</text>
  <text x="68" y="268" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 离线聚类将公开工单中的“供应商 Alpha”与 CFO 私密底价表聚入同一图社区 (#42)，生成的全局摘要抹平了单文档 ACL！</text>
  <text x="68" y="288" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 外部投递文档夹带高频实体共现词，将隐藏指令写进全局摘要，诱发合法读者 Agent 越权覆写与外发 (ASR 75%~100%)。</text>
  <rect x="56" y="304" width="552" height="34" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="70" y="326" fill="#fca5a5" font-family="Consolas, Segoe UI, sans-serif" font-size="12" font-weight="700">核心教训：Pre-Filter 只管“能不能读”，管不住“合法读进带毒切片后 Agent 乱调工具”！</text>

  <rect x="652" y="118" width="592" height="236" rx="14" fill="url(#greenBox)" stroke="#10b981" stroke-width="1.5"/>
  <text x="672" y="146" fill="#34d399" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">✅ 三道 Agent-Native 零信任铁闸（Pre-Filter + 图谱水位线 + 能力网关）</text>
  <text x="672" y="174" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">🛡️ 闸门 1：向量引擎原生检索前裁剪 (Pre-Filter + record-owner)：</text>
  <text x="684" y="196" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 每个切片入库原子绑定 tenant_id + owner + allowed_principals + Purview 密级标签。</text>
  <text x="684" y="216" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 检索网关从验签 OBO Token 提取身份注入倒排布尔过滤，非 Owner 跨主体读在进入上下文前 100% 阻断。</text>

  <text x="672" y="246" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">🛡️ 闸门 2：GraphRAG 社区最高水位线继承 (High-Water-Mark Inheritance)：</text>
  <text x="684" y="268" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 社区摘要 Allowed(C) = ⋂ Allowed(S_i)，密级 Sensitivity(C) = max Sensitivity(S_i)，untrusted 污点沿图谱边强制传染。</text>

  <text x="672" y="296" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">🛡️ 闸门 3：切片污点联动确定性能力网关 (Broker PEP · 0.0248ms 内存裁决)：</text>
  <text x="684" y="318" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 一旦会话读取含 restricted / untrusted 切片，立即封死外网发信 (restricted-data-boundary) 与结果覆写 (untrusted-write)。</text>

  <!-- Section 2: 4-Option Architect Selection Matrix -->
  <rect x="36" y="370" width="1208" height="222" rx="14" fill="#0b1325" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="398" fill="#38bdf8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="800">📊 安全架构师 RAG / GraphRAG 权限与防注入选型决策矩阵（四大方案横向对比）</text>

  <!-- Table Header -->
  <rect x="52" y="410" width="1176" height="30" rx="6" fill="#1e293b"/>
  <text x="64" y="430" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">架构方案</text>
  <text x="330" y="430" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">适用业务场景</text>
  <text x="565" y="430" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">附加延迟开销 (带出处分类)</text>
  <text x="835" y="430" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">召回体验与抗绕过能力</text>
  <text x="1085" y="430" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">合成夹具残余 ASR</text>

  <!-- Row 1 -->
  <text x="64" y="460" fill="#f87171" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">A. 扁平向量库 + Prompt 软约束</text>
  <text x="330" y="460" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">仅限 L0 纯公开官网 FAQ</text>
  <text x="565" y="460" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12">0 ms</text>
