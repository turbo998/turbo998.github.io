  <text x="1085" y="460" fill="#f87171" font-family="Consolas, monospace" font-size="12" font-weight="700">75.0%~100% (高危)</text>

  <!-- Row 2 -->
  <line x1="52" y1="472" x2="1228" y2="472" stroke="#1e293b"/>
  <text x="64" y="494" fill="#fbbf24" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">B. Top-K 后应用层过滤 (Post-Filter)</text>
  <text x="330" y="494" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">L1 极少角色内部只读搜索</text>
  <text x="565" y="494" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12">5~25 ms (应用层二次鉴权)</text>
  <text x="835" y="494" fill="#fde68a" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">⚠️ 严重召回饿死 (Top-K 被删空) + 不防工具劫持</text>
  <text x="1085" y="494" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">工具劫持仍失守</text>

  <!-- Row 3 -->
  <line x1="52" y1="506" x2="1228" y2="506" stroke="#1e293b"/>
  <text x="64" y="528" fill="#38bdf8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">C. 向量原生 Pre-Filter 安全裁剪</text>
  <text x="330" y="528" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">L2 多部门只读知识库 (无工具)</text>
  <text x="565" y="528" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12">1~8 ms (anonymized_reported)</text>
  <text x="835" y="528" fill="#bae6fd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">✅ 0% 召回饿死，但拦不住合法可读切片里的注入</text>
  <text x="1085" y="528" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">只读安全 / 工具需加固</text>

  <!-- Row 4 -->
  <line x1="52" y1="540" x2="1228" y2="540" stroke="#1e293b"/>
  <rect x="52" y="544" width="1176" height="38" rx="6" fill="#06281e"/>
  <text x="64" y="568" fill="#34d399" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="800">D. Pre-Filter + 图谱水位线 + 能力网关</text>
  <text x="330" y="568" fill="#d1fae5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">L3~L4 生产 Agentic RAG / GraphRAG</text>
  <text x="565" y="568" fill="#34d399" font-family="Consolas, monospace" font-size="12" font-weight="700">内存 0.0248ms / SQLite 7.21ms (measured)</text>
  <text x="835" y="568" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">✅ 阻断越权召回 + 锁死染毒会话外发与覆写</text>
  <text x="1085" y="568" fill="#34d399" font-family="Consolas, monospace" font-size="12.5" font-weight="800">0.0% ASR (0% FPR)</text>

  <!-- Section 3: Bottom Verification & Go-Live Checklist -->
  <rect x="36" y="606" width="1208" height="132" rx="14" fill="#0b1325" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="634" fill="#a78bfa" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="800">🛠️ 生产上线核验清单与新增红蓝对抗基准（BRK-19 &amp; BRK-20 · 141/141 Pytest 断言通过）</text>
  <text x="56" y="660" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• <tspan fill="#38bdf8" font-weight="700">BRK-19 (RAG-ACL-BYPASS-23)</tspan>：验证 `record-owner` 阻断跨主体切片召回 + `restricted-data-boundary` 阻断受限切片读取后的外网 `send_message` 泄密。</text>
  <text x="56" y="684" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• <tspan fill="#34d399" font-weight="700">BRK-20 (GRAPHRAG-POISON-24)</tspan>：验证 GraphRAG 社区摘要继承 `untrusted` 污点标签后，`untrusted-write` 与 `message-requires-target` 100% 阻断业务结论覆写与无目标探测。</text>
  <text x="56" y="710" fill="#94a3b8" font-family="Consolas, Segoe UI, sans-serif" font-size="11.5">Provenance: 本地计时来自 scripts/measure_broker_latencies.py 封存样本 research/latency-samples-2026-11-08.json (measured, n=200/50/30/20)；38 场景为离线合成夹具 (synthetic)。</text>
</svg>
