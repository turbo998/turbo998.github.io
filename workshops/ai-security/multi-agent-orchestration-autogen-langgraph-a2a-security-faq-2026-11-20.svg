  <text x="212" y="168" text-anchor="middle" fill="#fecaca" font-size="15" font-weight="800">🚨 1. 跨 Agent 伪造交接与蜂群死锁三大风险</text>

  <rect x="46" y="196" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="218" fill="#f87171" font-size="13" font-weight="700">① 伪造 Supervisor 交接与横向提权 (BRK-819)</text>
  <text x="60" y="240" fill="#cbd5e1" font-size="12">低权限外网检索 Sub-Agent 被注入，伪造</text>
  <text x="60" y="258" fill="#cbd5e1" font-size="12">[ROLE: SUPERVISOR] 指令交接给财务/HR Agent，</text>
  <text x="60" y="278" fill="#fca5a5" font-size="12" font-weight="700">跳过污点校验，诱导高权 Sub-Agent 越权导出与写库！</text>

  <rect x="46" y="306" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="328" fill="#f87171" font-size="13" font-weight="700">② 无限循环接力与拜占庭共识操控</text>
  <text x="60" y="350" fill="#cbd5e1" font-size="12">多个对等 Agent 互相委派任务形成 A→B→A 死锁，</text>
  <text x="60" y="368" fill="#cbd5e1" font-size="12">或恶意污染群聊上下文篡改多智能体投票结论，</text>
  <text x="60" y="388" fill="#fca5a5" font-size="12" font-weight="700">瞬间耗尽 Token 预算并强行放行高危变更工单！</text>

  <rect x="46" y="416" width="333" height="100" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="438" fill="#f87171" font-size="13" font-weight="700">③ A2A Agent Card 注册表投毒与电汇诈骗 (BRK-820)</text>
  <text x="60" y="460" fill="#cbd5e1" font-size="12">伪造外部合作伙伴 `/.well-known/agent.json`</text>
  <text x="60" y="478" fill="#cbd5e1" font-size="12">结算端点与企业级 AI 编排授权账单，篡改</text>
  <text x="60" y="498" fill="#fca5a5" font-size="12" font-weight="700">`trust-registry` 并触发 $7,550 欺诈电汇！</text>

