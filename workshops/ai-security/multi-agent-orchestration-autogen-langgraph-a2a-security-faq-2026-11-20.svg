  <text x="600" y="168" text-anchor="middle" fill="#d1fae5" font-size="15" font-weight="800">🛡️ 2. 多智能体零信任编排与签名交接架构</text>

  <rect x="433" y="196" width="333" height="98" rx="8" fill="#0d242c" stroke="#047857" stroke-width="1"/>
  <text x="447" y="218" fill="#34d399" font-size="13" font-weight="700">① JWS/mTLS 签名交接信封与特权单调递减</text>
  <text x="447" y="240" fill="#cbd5e1" font-size="12">跨 Agent Handoff 强制携带加密签名信封（含</text>
  <text x="447" y="258" fill="#cbd5e1" font-size="12">`origin_user`、`taint_labels`、`hop_count`），</text>
  <text x="447" y="278" fill="#6ee7b7" font-size="12" font-weight="700">子 Agent 权限严禁高于上游调用链交集（无横向提权）！</text>

  <rect x="433" y="306" width="333" height="98" rx="8" fill="#0d242c" stroke="#047857" stroke-width="1"/>
  <text x="447" y="328" fill="#34d399" font-size="13" font-weight="700">② 结构化 Schema 交接过滤与 DAG 跳数熔断</text>
  <text x="447" y="350" fill="#cbd5e1" font-size="12">禁止跨 Agent 裸传原始对话历史；仅传递经</text>
  <text x="447" y="368" fill="#cbd5e1" font-size="12">Pydantic 强校验的结构化字段，且强制执行</text>
  <text x="447" y="388" fill="#6ee7b7" font-size="12" font-weight="700">`max_hops &lt;= 3` 有向无环图（DAG）防死锁熔断！</text>

  <rect x="433" y="416" width="333" height="100" rx="8" fill="#0d242c" stroke="#047857" stroke-width="1"/>
  <text x="447" y="438" fill="#34d399" font-size="13" font-weight="700">③ A2A 联邦目录钉扎与结算双签气隙</text>
  <text x="447" y="460" fill="#cbd5e1" font-size="12">`record-owner` 物理隔离敏感状态分区，</text>
  <text x="447" y="478" fill="#cbd5e1" font-size="12">`fixed-business-output` 冻结 A2A 联邦目录，</text>
  <text x="447" y="498" fill="#6ee7b7" font-size="12" font-weight="700">`original-requester-payment` 拦截 $7,550 电汇！</text>

