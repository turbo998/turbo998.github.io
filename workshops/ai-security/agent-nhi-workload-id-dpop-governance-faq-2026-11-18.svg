  <!-- Header -->
  <text x="45" y="68" fill="#fbbf24" font-size="15" font-weight="800" letter-spacing="1.5">AI SOLUTION ARCHITECT · 2026-11-18 ROUND 260 · 🏆🎉 260-FAQ, BRK-530 &amp; 1,162-ASSERTION TRIPLE MILESTONE!</text>
  <text x="45" y="104" fill="#f8fafc" font-size="24" font-weight="800">企业非人类身份 (NHI) 与 AI Agent 凭据治理选型：Entra Workload ID + DPoP/mTLS + 僵尸 Agent 回收</text>
  <text x="45" y="132" fill="#94a3b8" font-size="14">解决企业 Agent 爆发式增长后的三大失控：日志泄漏 Bearer Token 异地重放、员工离职遗留高权限“无主僵尸 Agent”与 Agent 自我繁殖后门账号</text>

  <!-- KPI Badges -->
  <rect x="1005" y="46" width="360" height="84" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="1185" y="72" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="800">🏆 548 场景 · 1,162 断言 · 534 向量 · 260 FAQ</text>
  <text x="1185" y="96" text-anchor="middle" fill="#4ade80" font-size="19" font-weight="800">ASR: 75.0% ➔ 0.0% (0.0248ms)</text>
