  <!-- Section 1 -->
  <text x="45" y="172" fill="#e2e8f0" font-size="17" font-weight="700">1. 企业 AI Agent 非人类身份 (NHI) 全生命周期治理四大支柱对比</text>

  <!-- Card 1 -->
  <rect x="45" y="186" width="315" height="235" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="216" fill="#60a5fa" font-size="15.5" font-weight="800">🔵 支柱 A：无密钥联邦凭据 (FIC)</text>
  <text x="62" y="238" fill="#bfdbfe" font-size="11.5" font-weight="600">Microsoft Entra Workload ID / Managed Identity</text>
  <text x="62" y="264" fill="#e2e8f0" font-size="11.5">• 红线：严禁在 .env 或代码库存储 client_secret</text>
  <text x="62" y="286" fill="#e2e8f0" font-size="11.5">• 机制：利用 OIDC 联邦断言换取短时访问令牌</text>
  <text x="62" y="308" fill="#e2e8f0" font-size="11.5">• 优势：彻底消灭静态密码过期导致的生产中断</text>
  <rect x="62" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <text x="74" y="352" fill="#93c5fd" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="74" y="370" fill="#cbd5e1" font-size="11">企业生产环境 Agent 准入第一道门禁，</text>
  <text x="74" y="388" fill="#cbd5e1" font-size="11">100% 清退所有长期有效的静态 API Key。</text>

  <!-- Card 2 -->
  <rect x="378" y="186" width="315" height="235" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1.8"/>
  <text x="395" y="216" fill="#c084fc" font-size="15.5" font-weight="800">🟣 支柱 B：DPoP / mTLS 发送方绑定</text>
  <text x="395" y="238" fill="#e9d5ff" font-size="11.5" font-weight="600">RFC 9449 Proof-of-Possession / 证书绑定</text>
  <text x="395" y="264" fill="#e2e8f0" font-size="11.5">• 痛点：普通 Bearer JWT 漏进日志即可异地重放</text>
  <text x="395" y="286" fill="#e2e8f0" font-size="11.5">• 正解：Token 绑定容器 TPM 非导出私钥 (cnf.jkt)</text>
  <text x="395" y="308" fill="#e2e8f0" font-size="11.5">• 效果：黑客偷走 Token 字符串在外部重放 100% 拒止</text>
  <rect x="395" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="407" y="352" fill="#d8b4fe" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="407" y="370" fill="#cbd5e1" font-size="11">把“不记名现金 Token”升级为“记名活体指纹”，</text>
  <text x="407" y="388" fill="#cbd5e1" font-size="11">免疫可观测性日志与代理层令牌泄漏！</text>

  <!-- Card 3 -->
  <rect x="711" y="186" width="315" height="235" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="728" y="216" fill="#fbbf24" font-size="15.5" font-weight="800">🟠 支柱 C：僵尸 Agent 生命周期回收</text>
  <text x="728" y="238" fill="#fde68a" font-size="11.5" font-weight="600">Entra ID Governance + 人类 Sponsor 强绑定</text>
  <text x="728" y="264" fill="#e2e8f0" font-size="11.5">• 风险：员工离职后其创建的自动化 Agent 仍在裸跑</text>
  <text x="728" y="286" fill="#e2e8f0" font-size="11.5">• 防线 1：每个 Agent ID 强制登记在职人类责任人</text>
  <text x="728" y="308" fill="#e2e8f0" font-size="11.5">• 防线 2：HR 离职或闲置 &gt;14 天自动冻结并升 epoch</text>
  <rect x="728" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="740" y="352" fill="#fcd34d" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="740" y="370" fill="#cbd5e1" font-size="11">打通 Workday/HR 与 Entra ID Governance，</text>
  <text x="740" y="388" fill="#cbd5e1" font-size="11">彻底消灭无人认领的高权限“孤儿智能体”！</text>

  <!-- Card 4 -->
  <rect x="1044" y="186" width="321" height="235" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
  <text x="1061" y="216" fill="#34d399" font-size="15.5" font-weight="800">🛡️ 支柱 D：确定性 Capability Broker</text>
  <text x="1061" y="238" fill="#a7f3d0" font-size="11.5" font-weight="600">物理禁止 Agent 自我繁殖与篡改身份表</text>
  <text x="1061" y="264" fill="#ecfdf5" font-size="11.5">• G1 (所有权)：record-owner 阻断僵尸会话读底表</text>
  <text x="1061" y="286" fill="#ecfdf5" font-size="11.5">• G2 (禁建号)：fixed-business-output 锁死身份注册表</text>
  <text x="1061" y="308" fill="#ecfdf5" font-size="11.5">• G3 (付款锁)：0.0248ms 拦截 $4,930 虚假订阅电汇</text>
  <rect x="1061" y="330" width="286" height="72" rx="8" fill="#022c22" stroke="#10b981"/>
  <text x="1073" y="352" fill="#6ee7b7" font-size="11.5" font-weight="700">生产级黄金架构结论：</text>
  <text x="1073" y="370" fill="#d1fae5" font-size="11">严禁任何 AI Agent 拥有创建子账号的 IAM 权限，</text>
  <text x="1073" y="388" fill="#d1fae5" font-size="11">斩断提示词注入自我繁殖持久化后门！</text>

  <!-- Section 2 -->
  <text x="45" y="454" fill="#e2e8f0" font-size="17" font-weight="700">2. 红蓝对抗推演：被盗 Bearer Token 重放 &amp; 僵尸 Agent 自我繁殖 vs. DPoP + Capability Broker</text>

  <rect x="45" y="468" width="640" height="175" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="65" y="496" fill="#fca5a5" font-size="15" font-weight="800">❌ 脆弱 Baseline：普通 Bearer Token + 无主孤儿 Agent（BRK-529 / BRK-530 失守）</text>
  <text x="65" y="524" fill="#fecaca" font-size="12.5">1. 令牌重放与僵尸唤醒 (BRK-529)：攻击者从日志窃取 Bearer Token 或触发离职员工遗留的</text>
  <text x="65" y="544" fill="#fecaca" font-size="12.5">   僵尸 Agent，越权读取战略底表 restricted-budget、篡改结论 business-result 并外传。</text>
  <text x="65" y="572" fill="#fecaca" font-size="12.5">2. 自我繁殖影子账号与盗刷 (BRK-530 · 260-FAQ 里程碑)：被劫持 Agent 在 trust-registry</text>
  <text x="65" y="592" fill="#fecaca" font-size="12.5">   中自我注册永久免审影子子账号并直接放行 $4,930 虚假云服务订阅电汇！</text>
  <text x="65" y="622" fill="#f87171" font-size="12" font-weight="700">💥 根因：令牌未绑定硬件发送方私钥，且未随创建者离职同步冻结孤儿 Agent 与锁死 IAM 接口！</text>

  <rect x="715" y="468" width="650" height="175" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="496" fill="#6ee7b7" font-size="15" font-weight="800">✅ 零信任 NHI 治理：Entra FIC + DPoP/mTLS + Capability Broker（0.0% 失守）</text>
  <text x="735" y="524" fill="#d1fae5" font-size="12.5">• 门禁 1 (DPoP 持有权证明 + record-owner)：无私钥签名即拒止，阻断读取战略底表</text>
  <text x="735" y="548" fill="#d1fae5" font-size="12.5">• 门禁 2 (HR 联动冻结 + untrusted-write)：冻结无主僵尸 Agent，阻断外部唤醒改库</text>
  <text x="735" y="572" fill="#d1fae5" font-size="12.5">• 门禁 3 (tool-allowlist &amp; fixed-business-output)：物理锁死 trust-registry 禁自建影子账号</text>
  <text x="735" y="596" fill="#d1fae5" font-size="12.5">• 门禁 4 (original-requester-payment)：0.0248ms 拦截外部触发的 $4,930 订阅费电汇</text>
  <text x="735" y="622" fill="#34d399" font-size="12" font-weight="700">🛡️ 实测开销：Broker 内存裁决 P50 = 0.0248 ms / 含 SQLite WAL 审计收据 P50 = 7.21 ms</text>

  <!-- Section 3 -->
  <rect x="45" y="662" width="1320" height="168" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="692" fill="#38bdf8" font-size="16" font-weight="800">🛠️ 企业非人类身份 (NHI) 与 AI 智能体凭据治理上线评审 6 项必选 Checklist</text>
  <text x="65" y="722" fill="#e2e8f0" font-size="13">☑️ 1. 零静态 Client Secret：全面切换至 Entra Workload ID 联邦凭据 (FIC) 与托管标识</text>
  <text x="65" y="748" fill="#e2e8f0" font-size="13">☑️ 2. 启用 DPoP (RFC 9449) 或双向 mTLS：将 Access Token 绑定容器硬件私钥，杜绝偷走 Token 异地重放</text>
  <text x="65" y="774" fill="#e2e8f0" font-size="13">☑️ 3. 强制绑定在职人类 Sponsor：HR 离职或连续 14 天无活动自动冻结孤儿 Agent 并递增状态机 epoch</text>
  <text x="65" y="800" fill="#e2e8f0" font-size="13">☑️ 4. 剥离 Agent IAM 建号权限  ☑️ 5. 锁死 trust-registry 身份白名单  ☑️ 6. 严禁无主后台会话触发自动打款</text>
