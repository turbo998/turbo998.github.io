  <rect x="632" y="176" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">1. 物理层：&lt;=85°C 温水刮膜蒸发 (&lt;15s 停留) + &lt;100ms 冷 DMC/TBC 急冷倾泻</text>
  <text x="646" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 强制采用极低持液量刮板薄膜蒸发器，热媒物理死锁 &lt;=85°C 温水；缺 BHT 自动切热源</text>
  <text x="646" y="240" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 釜温 &gt;=92°C 时 &lt;100ms 充纯氮破真空并将物料整批压入 5°C 冷 DMC+2% TBC 猝灭槽</text>
  <text x="646" y="260" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 全线 Ra&lt;0.2μm 电抛光 316L/哈氏合金零铁离子 + 三乙胺脱酸釜 &lt;=55°C 孔板限流</text>

  <rect x="632" y="290" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="312" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">2. 控制层：untrusted-write 污点阻断 + record-owner 气隙配方隔离</text>
  <text x="646" y="334" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 外部 HG/T 5391 化验单进入会话自动标记 untrusted=True，0.0248ms 拦截 write_record</text>
  <text x="646" y="354" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 5N 级熔融结晶 VC 与 FEC 协同配方库 restricted-budget 仅限 owner 访问</text>
  <text x="646" y="374" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• restricted-data-boundary 100% 阻断向外部 supplier 外发任何锂电添加剂参数</text>

  <rect x="632" y="404" width="522" height="108" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="426" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">3. 供应链层：电抛光 316L 刮膜蒸发器 AVL 锁死 + original-requester-payment</text>
  <text x="646" y="448" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• tool-allowlist 移除排程 Agent 的 update_trust 工具；fixed-business-output 锁死名录</text>
  <text x="646" y="468" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 强制校验 requester == user 硬件密钥签名，拦截外部急件单诱导的 $4,990 电汇</text>
  <text x="646" y="488" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 回归测试：test_round168_vinylene_carbonate_* (4/4 PASSED · 总计 794/794 PASSED!)</text>

