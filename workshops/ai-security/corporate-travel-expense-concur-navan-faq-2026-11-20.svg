<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad363" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad363" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad363" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad363" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad363)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad363)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 363 · 🏆 740-VECTOR MILESTONE · CORPORATE TRAVEL &amp; EXPENSE (SAP CONCUR / NAVAN / RAMP / FCPA COMPLIANCE)</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业商旅与费用报销 (SAP Concur/Navan)、虚拟商务卡与 FCPA 反海外腐败 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">高管并购差旅行程与反舞弊调查卷宗物理气隙 + 外国公职人员 (PEP) 招待与重号发票硬锁 vs. 发票 OCR 注入洗白与差旅诈骗 (BRK-735 / BRK-736)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad363)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业商旅报销与反腐败合规三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 水单/发票 PDF 注入窃取高管并购行程与内审卷宗 (BRK-735)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 员工或差旅供应商上传的酒店账单 (Folio PDF) 夹带隐藏提示词，</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  诱导费用审单 Agent 跨权限读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取高管未公开并购尽调飞行轨迹、FCPA 反商业贿赂秘密调查</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  名单及集团高危公职人员 (PEP) 关联方黑名单</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 洗白外国官员豪华招待 (FCPA) 与一票两报套现</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，将向外国政府官员 (Foreign</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  Officials) 输送的奢侈品/头等舱挂账伪装为“内部技术培训费”</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 或将公务卡已结算的消费水单再次作为个人垫付现金报销入账</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：美国司法部 DOJ FCPA / 英国反贿赂法亿级刑事重罚</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造商旅管理公司 (TMC) 月结与增值税退税电汇诈骗 (BRK-736)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造差旅代理 (Amex GBT / BCD Travel) 集中月结卡 (Lodge Card)</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  账单或海外增值税退税机构 (VAT Reclaim) 收款账户变更函</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 报销清算账户并电汇 $5,450 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：集团月度机酒大账单资金被劫持与虚假高管报销盗刷</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad363)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业商旅报销与 FCPA 合规零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 电子发票/水单像素清洗与 L3 银联/Visa 槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离报销单备注与水单 PDF 中的隐藏指令，仅提取强类型槽位</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  (税控发票查验码、MCC 商户类别码、L3 刷卡流水号、出席人名单)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断水单提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 高管并购行程与 FCPA 反舞弊卷宗物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 高管保密并购行程、内审举报调查卷宗及敏感外部公职人员监控</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  名单严格隔离在 restricted-budget 物理气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 PEP 反贿赂限额、MCC 封锁与发票查重硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 代码层强制核验出席人 PEP/公立医院医师身份与人均招待红线，</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  比对公务卡 L3 流水哈希防止“公卡消费+私报套现”，严禁 AI 豁免</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断科目篡改与违规入账</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 员工工资卡与 TMC 清算账户只读锁 + 财务双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 员工工资卡与 TMC 账户只读 (tool-allowlist +</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad363)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流企业商旅与费用报销 (T&amp;E) 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性 T&amp;E 网关 + 行程气隙 + FCPA/L3 查重硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-735/736 拦截率 100% | 满足 DOJ FCPA &amp; 阳光法案合规</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. SAP Concur / Navan / Ramp 原生审批规则</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止智能审单助手在水单 OCR 注入下篡改招待科目与出席人</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 MCC 商户码、公务卡 L3 流水对账与国别 PEP 限额语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统财务审单员人工抽检 10% 纸质贴票与手工核对</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 90% 拆单规避审批与 AI 伪造电子小票漏检，难逃监管突击检查</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 363 · 740 向量！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：科目洗白、内审泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取高管并购行程与内审卷宗 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断洗白 PEP 官员招待科目与跳过重复报销查重</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传高管实时差旅坐标与反舞弊名单</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定报销与 TMC 账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,450 伪造商旅月结电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 363 · 🏆 740 个交互式靶场攻击向量里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 高管行程与反舞弊卷宗气隙：CEO 并购差旅行程、内审调查底稿与日常员工费用报销 OCR Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 FCPA/阳光法案与卡流水核销：强制匹配信用卡 L3 明细与税控真伪，外部公职人员招待触发合规事前锁</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 报销打款绑定工资卡与 TMC 只读锁：个人报销仅限打入 HRIS 实名工资卡，锁定 trust-registry 阻断改绑</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：754 个场景 (751 风险 + 3 基线) | 838 项 Pytest 检查 | 1,574 项断言 | 🏆 740 个交互向量 | 363 篇双语 FAQ (182 篇指南) | BRK-735/736</text>
</svg>
