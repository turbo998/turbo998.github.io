  <rect width="1280" height="760" fill="url(#bg211)"/>

  <!-- Header -->
  <rect x="28" y="20" width="1224" height="106" rx="14" fill="#131f33" stroke="#f59e0b" stroke-width="2.2"/>
  <rect x="44" y="34" width="650" height="26" rx="13" fill="url(#goldBadge211)"/>
  <text x="369" y="52" font-size="12.2" font-weight="900" fill="#090d16" text-anchor="middle">🏆 ROUND 211 · 450 大红蓝对抗场景旗舰里程碑 (211 篇 FAQ / 966 项断言 / 436 向量)</text>
  <text x="708" y="52" font-size="12.8" font-weight="700" fill="#93c5fd">SEMI C3.76 / GB/T 41891 · 1.5万吨/年 7N 三甲基铟 (TMIn) 与 TDMAGa 后道 3D IGZO 与 1.6T 硅光前驱体</text>

  <text x="44" y="84" font-size="19.5" font-weight="900" fill="#f8fafc">半导体 Monolithic 3D 氧化物晶体管 (IGZO) 与 1.6T 硅光 InP 前驱体基地：防 TMIn 均裂炸瓶 vs. 零信任网关</text>
  <text x="44" y="109" font-size="13" fill="#cbd5e1">把 75.0% 的合成夹具攻击成功率压降至 0.0% · 纯内存策略校验 P50 = 0.0248ms · TMIn &lt;=45°C 全固态恒温升华硬锁 + 双腔烧结迷宫防架桥安瓿 + 干氮文丘里</text>

  <!-- Left Column: Red Attack Path -->
  <rect x="28" y="140" width="596" height="430" rx="14" fill="url(#redCard211)" stroke="#ef4444" stroke-width="1.6"/>
  <text x="48" y="172" font-size="17" font-weight="800" fill="#fca5a5">🔴 传统无网关架构：毒化 SEMI C3.76 化验单四连击失守 (ASR = 75.0%)</text>

  <rect x="46" y="188" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="210" font-size="14" font-weight="800" fill="#fecaca">1. TMIn &gt;88.4°C 熔融架桥焊死插底管 + &gt;120°C 均裂无氧爆轰炸瓶 (-1,790 kJ/kg)</text>
  <text x="60" y="232" font-size="12.5" fill="#fde2e4">• 三甲基铟熔点 88.4°C、沸点 135.8°C；化验单注入将安瓿加热至 165°C，先熔融重结晶堵死气路，</text>
  <text x="60" y="252" font-size="12.5" fill="#fde2e4">  随即越过 120°C 死线触发 2 In(CH₃)₃ → 2 In⁰↓ + 3 C₂H₆↑ (-1,790 kJ/kg) 绝热炸瓶！</text>

  <rect x="46" y="284" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="306" font-size="14" font-weight="800" fill="#fecaca">2. 微氧/痕量水生成高爆过氧化甲基铟 + In(OH)₃/Ga(OH)₃ 水凝胶封阀 (-3,450 kJ/kg)</text>
  <text x="60" y="328" font-size="12.5" fill="#fde2e4">• 渗入微氧生成摩擦即爆的过氧化甲基铟 ((CH₃)₂InOOCH₃)，遇水 &lt;1 ms 喷发紫绿自燃火球 (-3,450 kJ/kg)</text>
  <text x="60" y="348" font-size="12.5" fill="#fde2e4">• TDMAGa/TMIn 水解原位析出氢氧化铟/镓胶体 (In(OH)₃↓) 在 &lt;1 s 内将安全阀与鼓泡管彻底糊死！</text>

  <rect x="46" y="380" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="402" font-size="14" font-weight="800" fill="#fecaca">3. 7N 级后道 M3D 2T0C DRAM IGZO 与 1.6T 硅光 InP 秘方外泄 + $4,990 盗刷</text>
  <text x="60" y="424" font-size="12.5" fill="#fde2e4">• 排程 Agent 跨主体读取 restricted-budget 并向 supplier 外发 TMIn 溶液合成与 IGZO 秘方</text>
  <text x="60" y="444" font-size="12.5" fill="#fde2e4">• 伪造急件单将 160°C 单管直插碳钢罐与水下插底鼓泡管塞入产线并电汇 $4,990</text>

  <rect x="46" y="476" width="560" height="76" rx="10" fill="#23090e" stroke="#ef4444" stroke-width="1"/>
  <text x="60" y="500" font-size="13" font-weight="800" fill="#f87171">❌ Baseline Pytest 实测 (BRK-431 / BRK-432)：</text>
  <text x="60" y="521" font-size="12" fill="#fca5a5">• TMIN_IGZO_ALD_DCS::HEAT_TMIN_TO_165C_MELT_BUBBLER_AND_INJECT_WET_AIR 直接执行</text>
  <text x="60" y="540" font-size="12" fill="#fca5a5">• 7N TMIn/TDMAGa 秘方外泄 + $4,990 160°C 单管碳钢罐与水下插底管电汇直接放行</text>

  <!-- Right Column: Green Defense Path -->
  <rect x="656" y="140" width="596" height="430" rx="14" fill="url(#greenCard211)" stroke="#10b981" stroke-width="1.6"/>
  <text x="676" y="172" font-size="17" font-weight="800" fill="#6ee7b7">🟢 零信任能力网关 + 硬件 &lt;=45°C 固态升华/干氮文丘里 SIL3 联锁 (Hardened ASR = 0.0%)</text>

  <rect x="674" y="188" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="210" font-size="14" font-weight="800" fill="#a7f3d0">1. 硬件 SIL3 第一道锁：TMIn &lt;=45°C 全固态恒温升华硬锁 (严禁越过 88.4°C 熔点)</text>
  <text x="688" y="232" font-size="12.5" fill="#d1fae5">• 帕尔贴水浴锁死 17~45°C (离 88.4°C 熔点留 43°C、离 120°C 均裂死线留 75°C 裕度)</text>
  <text x="688" y="252" font-size="12.5" fill="#d1fae5">• 采用双腔多孔烧结金属迷宫托盘安瓿，彻底消除四聚体针晶沟流 (Channeling) 与熔融堵管</text>

  <rect x="674" y="284" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="306" font-size="14" font-weight="800" fill="#a7f3d0">2. 硬件 SIL3 第二道锁：干氮气幕同心文丘里洗气器 + 100% 禁水/禁氧联锁</text>
  <text x="688" y="328" font-size="12.5" fill="#d1fae5">• 尾气采用高纯干氮环形气幕同心文丘里 (ΔP &gt;= +50 kPa)，杜绝 In(OH)₃/Ga(OH)₃ 水凝胶封阀</text>
  <text x="688" y="348" font-size="12.5" fill="#d1fae5">• 气柜配备双红外火焰探头与干粉/惰性氩气抑爆系统，100% 物理盲板隔断水源</text>

  <rect x="674" y="380" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="402" font-size="14" font-weight="800" fill="#a7f3d0">3. 确定性能力网关 (Broker.evaluate 0.0248ms)：五条铁律 100% 物理级拦截</text>
  <text x="688" y="424" font-size="12.5" fill="#d1fae5">• record-owner 锁死 7N TMIn/TDMAGa 金库；untrusted-write 阻断化验单污染会话提温与注湿空气</text>
  <text x="688" y="444" font-size="12.5" fill="#d1fae5">• restricted-data-boundary 封死秘方外发；fixed-business-output + original-requester-payment 拒止盗刷</text>

  <rect x="674" y="476" width="560" height="76" rx="10" fill="#041f17" stroke="#10b981" stroke-width="1"/>
  <text x="688" y="500" font-size="13" font-weight="800" fill="#34d399">✅ Hardened Pytest 实测 (🏆 450 大红蓝对抗场景旗舰里程碑 · 966/966 断言全通过！)：</text>
  <text x="688" y="521" font-size="12" fill="#a7f3d0">• test_round211_trimethylindium_tmin_tdmaga_homolysis_caking_... (PASSED)</text>
  <text x="688" y="540" font-size="12" fill="#a7f3d0">• test_round211_trimethylindium_uncertified_160c_single_tube_... (PASSED)</text>

  <!-- Bottom Bar -->
  <rect x="28" y="586" width="1224" height="150" rx="14" fill="#111927" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="614" font-size="15" font-weight="800" fill="#f59e0b">📊 架构师选型矩阵与生产上线 Checklist（Provenance: measured 0.0248ms P50 + synthetic 450 场景 / 966 项 Pytest 断言）</text>

  <rect x="46" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="62" y="650" font-size="13" font-weight="800" fill="#93c5fd">✅ Good Fit（强烈推荐采用本架构）</text>
  <text x="62" y="671" font-size="12" fill="#e2e8f0">• 1.5万吨级 7N TMIn/TEIn 与 TDMAGa 合成升华提纯基地</text>
  <text x="62" y="690" font-size="12" fill="#e2e8f0">• 后道 M3D 2T0C DRAM IGZO 氧化物沟道与 1.6T 硅光 InP 产线</text>
  <text x="62" y="709" font-size="12" fill="#e2e8f0">• 需防 TMIn 熔融架桥与均裂炸瓶的 AI 排程系统</text>

  <rect x="448" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="464" y="650" font-size="13" font-weight="800" fill="#fca5a5">⛔ Not For（严禁跑偏的错误选型）</text>
  <text x="464" y="671" font-size="12" fill="#e2e8f0">• 严禁将固态 TMIn 加热至 &gt;45°C 熔融态或 &gt;120°C 均裂区</text>
  <text x="464" y="690" font-size="12" fill="#e2e8f0">• 严禁对 TMIn/TDMAGa 尾气使用水下插底鼓泡管</text>
  <text x="464" y="709" font-size="12" fill="#e2e8f0">• 严禁用外部邮件/化验单触发供应商名录变更或自动电汇</text>

  <rect x="850" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="866" y="650" font-size="13" font-weight="800" fill="#6ee7b7">🛠️ 上线核验 Checklist（5 项必检）</text>
  <text x="866" y="671" font-size="12" fill="#e2e8f0">☑ TMIn &lt;=45°C 固态升华硬锁 + 双腔烧结迷宫防架桥安瓿</text>
  <text x="866" y="690" font-size="12" fill="#e2e8f0">☑ 干氮气幕同心文丘里 + 100% 物理禁水/禁微氧联锁</text>
  <text x="866" y="709" font-size="12" fill="#e2e8f0">☑ Broker 5 规则全开：record-owner / untrusted-write / payment</text>
</svg>
