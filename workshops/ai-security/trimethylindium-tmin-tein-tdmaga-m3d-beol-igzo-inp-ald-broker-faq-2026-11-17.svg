    </linearGradient>
    <linearGradient id="greenCard211" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#092920"/>
      <stop offset="100%" stop-color="#061914"/>
    </linearGradient>
    <linearGradient id="goldBadge211" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
