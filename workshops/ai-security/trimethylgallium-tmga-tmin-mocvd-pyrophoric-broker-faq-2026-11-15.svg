  <text x="60" y="468" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e4e4e7">• 实为 Viton 氟橡胶软座球阀与高压 CO2 灭火撬，TMAl 拔氟溶胀漏气自燃并触发 CO2 炸房</text>
