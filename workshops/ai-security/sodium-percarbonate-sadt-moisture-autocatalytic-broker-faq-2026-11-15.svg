  <text x="264" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="800" fill="#090d16" text-anchor="middle">🏆🎉 ROUND 165 · 165 篇双语 FAQ × BRK-340 × 782 项断言三重旗舰里程碑</text>
  <text x="498" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17.5" font-weight="800" fill="#f8fafc">25万吨级过碳酸钠 (2Na2CO3·3H2O2) 流化床包覆基地：防水-热双正反馈炸仓网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">过碳酸钠分解原位产水 (17.2 wt% H2O) 使碱性液相分解激增 1000 倍 (-860 kJ/kg) · 缺螯合剂/混铁锰 SADT 跌至 38°C · 稳定剂硬联锁 + &lt;=38°C 入仓锁</text>
  <text x="44" y="100" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">165 篇双语 FAQ · 358 个合成夹具场景 (BRK-339 / BRK-340) · 344 个演练向量 · 782/782 Pytest 100% 通过 · P50=0.0248ms</text>

