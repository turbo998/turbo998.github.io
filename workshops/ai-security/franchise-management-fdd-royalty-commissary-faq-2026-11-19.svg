    <text x="40" y="82" class="mono" font-size="14" fill="#38bdf8">🧪 Round 337 新增 Pytest 回归测试 (1,470 项确定性策略断言里程碑！)</text>
    <text x="40" y="110" class="body-txt" font-size="13">• BRK-683 (加盟选址申请表注入窃取全网门店 P&amp;L 底表与豁免 Royalty 营业额抽成)：</text>
    <text x="56" y="130" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="record-owner" &amp; "untrusted-write" &amp; "restricted-data-boundary"</text>
    <text x="40" y="158" class="body-txt" font-size="13">• BRK-684 (伪造中央厨房统配与全国广告基金 Co-Op 变更通知篡改名录与 $4,950 盗刷)：</text>
    <text x="56" y="178" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="fixed-business-output" &amp; "original-requester-payment"</text>
    <text x="40" y="208" class="mono" font-size="12" fill="#94a3b8">[measured] 内存评估 P50=0.0248ms / P95=0.0409ms | SQLite WAL P50=7.21ms</text>
    <text x="40" y="232" class="mono" font-size="12" fill="#38bdf8">[synthetic] 累计 702 个场景 · 1,470 项 Pytest 断言 · 688 大演练向量 · 337 篇双语 FAQ</text>

    <rect x="680" y="56" width="640" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="698" y="82" class="mono" font-size="14" fill="#a78bfa">🛠️ 跨国连锁特许经营 (FranConnect)、FDD 合规与统配 AI 6 项铁律 (Checklist)</text>
    <text x="698" y="108" class="body-txt" font-size="13">☑ 1. 单店未审计 P&amp;L 损益表与总部直营开店规划物理气隙：record-owner</text>
    <text x="698" y="132" class="body-txt" font-size="13">☑ 2. POS 营业额特许权抽成率 (Royalty) 与商圈保护半径只读硬锁：untrusted-write</text>
    <text x="698" y="156" class="body-txt" font-size="13">☑ 3. FTC FDD Item 19 财务表现陈述严禁 AI 自由发挥预测回本周期</text>
    <text x="698" y="180" class="body-txt" font-size="13">☑ 4. 外部加盟申请表、门店选址报告与申诉邮件强制污点化：taint="untrusted"</text>
    <text x="698" y="204" class="body-txt" font-size="13">☑ 5. 备案中央厨房统配中心与全国广告基金 (Ad Fund) 账户只读锁定：锁死 trust-registry</text>
    <text x="698" y="228" class="body-txt" font-size="13">☑ 6. 统配冻品食材集采与门店装修补贴结算电汇硬门禁：Capability Broker 阻断</text>
