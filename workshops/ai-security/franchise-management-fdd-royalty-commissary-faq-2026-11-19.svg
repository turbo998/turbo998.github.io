<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#041f1c"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
      .card-hdr { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; fill: #38bdf8; }
      .body-txt { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #e2e8f0; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1440" height="6" fill="url(#accentBlue)"/>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="510" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="21" class="mono" font-size="13" fill="#6ee7b7">🏆 1,470 断言里程碑 · Round 337 · 702 场景 · BRK-683/684</text>
    <rect x="525" y="0" width="645" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="543" y="21" class="mono" font-size="13" fill="#c7d2fe">FRANCHISE MANAGEMENT (FRANCONNECT/SIMPHONY) · FTC FDD ITEM 19 · ROYALTY</text>

    <text x="0" y="74" class="title" font-size="28">跨国连锁特许经营（FranConnect）、FDD 合规与中央厨房统配 AI 指南</text>
    <text x="0" y="106" class="sub" font-size="16">单店真实 P&amp;L 损益与保密选址模型物理气隙 + 特许权抽成 (Royalty) 与 FDD Item 19 硬锁 vs. 招商注入与能力网关</text>
  </g>

  <!-- Left Card -->
  <g transform="translate(48, 166)">
    <rect width="650" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19">⚖️ 万店连锁特许经营 (FranConnect)、FDD 合规与抽成结算 AI 对比</text>

    <rect x="20" y="54" width="610" height="72" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
    <text x="34" y="78" class="title" font-size="15" fill="#fca5a5">1. ❌ 加盟招商与督导 Agent 直通全网单店 P&amp;L 账本与抽成豁免接口</text>
    <text x="34" y="100" class="body-txt" font-size="13">• 意向加盟商提交的选址评估表植入指令，套出同商圈其他加盟商真实净利率与直营加密选址规划</text>
    <text x="34" y="118" class="mono" font-size="12" fill="#fca5a5">FTC Franchise Rule 集体诉讼：AI 违规承诺回本周期违反 FDD Item 19 或免除 6% 营业额抽成</text>

    <rect x="20" y="136" width="610" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="160" class="title" font-size="15" fill="#7dd3fc">2. 🔒 单店未审计 P&amp;L 损益底表与直营加密开店热力图物理气隙</text>
    <text x="34" y="182" class="body-txt" font-size="13">• 面向意向加盟商或单店店主开放的 AI 0 权限读取其他加盟法人门店损益及总部直营抢点地图</text>
    <text x="34" y="200" class="mono" font-size="12" fill="#93c5fd">加盟商法人级隔离 (Per-Franchisee Silo)：物理阻断触碰 restricted-budget 损益底表</text>

    <rect x="20" y="218" width="610" height="72" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="34" y="242" class="title" font-size="15" fill="#d8b4fe">3. 📜 FDD Item 19 法定披露口径与 POS 营业额抽成 (Royalty) 硬锁</text>
    <text x="34" y="264" class="body-txt" font-size="13">• AI 仅允许引用已备案 FDD Item 19 原文表格，0 权限预测单店回本利润或减免 POS 抽成比例</text>
    <text x="34" y="282" class="mono" font-size="12" fill="#e9d5ff">选型定位：满足 FranConnect、Oracle Simphony POS、16 CFR Part 436 (FTC Rule) 与商业特许经营条例</text>

    <rect x="20" y="300" width="610" height="74" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="324" class="title" font-size="15" fill="#6ee7b7">4. 🛡️ 必选底线：确定性零信任能力网关 (Capability Broker · 连锁加盟门禁)</text>
    <text x="34" y="346" class="body-txt" font-size="13">• 单店损益隔离 (record-owner) + 禁免特许权抽成 (untrusted-write) + 中央厨房账户锁</text>
    <text x="34" y="364" class="mono" font-size="12" fill="#34d399">实测性能：P50 = 0.0248 ms 内存裁决 | 702 个场景 · 1,470 项 Pytest 确定性断言 100% 通过</text>
  </g>

  <!-- Right Card -->
  <g transform="translate(722, 166)">
    <rect width="670" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
