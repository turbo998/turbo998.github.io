    <rect x="20" y="56" width="630" height="142" rx="10" fill="#2a0a10" stroke="#ef4444" stroke-width="1.5"/>
    <text x="36" y="82" class="title" font-size="15" fill="#fca5a5">❌ 脆弱架构：加盟 Agent 直通全网门店损益与抽成扣款 (BRK-683 / BRK-684)</text>
    <text x="36" y="108" class="body-txt" font-size="13">1. [意向加盟商选址评估表注入套取同城竞店 P&amp;L 与豁免 Royalty 抽成] 诱导读取</text>
    <text x="36" y="130" class="body-txt" font-size="13">   全网门店未公开损益与商圈加密规划 (restricted-budget)、将抽成率改为 0% 并外传！</text>
    <text x="36" y="154" class="body-txt" font-size="13">2. [伪造全国加盟商采购合作社 (Co-Op Commissary)“大宗冻品与包材集采收款变更函”] 盗刷 $4,950</text>
    <text x="36" y="180" class="mono" font-size="12" fill="#f87171">Baseline 结果：同城加盟商隐私损益泄露 + 违反 FTC 特许法退费赔偿 + $4,950 集采款被盗</text>

    <rect x="20" y="214" width="630" height="158" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.8"/>
    <text x="36" y="240" class="title" font-size="15" fill="#6ee7b7">✅ 零信任跨国连锁特许经营架构：单店损益气隙 + 抽成硬锁 + Broker</text>
    <text x="36" y="266" class="body-txt" font-size="13">• 闸门 1 (跨加盟商门店 P&amp;L 与总部直营加密图锁)：record-owner 0.0248ms 阻断读取</text>
    <text x="36" y="290" class="body-txt" font-size="13">• 闸门 2 (防篡改 Royalty/Ad-Fund 抽成率与商圈保护)：untrusted-write 阻断修改</text>
    <text x="36" y="314" class="body-txt" font-size="13">• 闸门 3 (备案中央厨房统配与全国广告基金专户只读锁)：fixed-business-output 锁死</text>
    <text x="36" y="338" class="body-txt" font-size="13">• 闸门 4 (门店损益外发与集采供应链划款锁)：restricted-data-boundary 与零代付</text>
    <text x="36" y="358" class="mono" font-size="12" fill="#34d399">Hardened 结果：合成夹具 ASR 75.0% → 0.0% | 合规已备案公开 FDD 条款目录查询 100.0% 通过</text>
  </g>

  <!-- Bottom Card -->
  <g transform="translate(48, 580)">
