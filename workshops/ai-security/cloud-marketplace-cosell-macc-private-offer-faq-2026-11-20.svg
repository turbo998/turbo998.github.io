<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad371" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad371" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad371" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad371" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad371)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad371)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 371 · 🏆 770-SCENARIO, 870-PYTEST &amp; 190-GUIDE MILESTONE · CLOUD MARKETPLACE CO-SELL (MACC / EDP / CPPO / TACKLE.IO)</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">云市场联合销售与专属报价 (Azure MACC/AWS CPPO/Tackle.io)、渠道批发底价与分账 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">客户云承诺消费余额 (MACC/EDP) 与批发底价物理气隙 + 专属报价 (Private Offer) 毛利与报备锁 vs. 询价单注入破价与分账诈骗 (BRK-751 / BRK-752)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad371)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 云市场联合销售 (Co-Sell) 与专属报价三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 渠道专属报价申请注入窃取 MACC 余额与底价 (BRK-751)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 渠道代理商 (Channel Partner) 提交的云市场专属报价申请 PDF</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  夹带隐藏提示词，诱导云市场运营 Agent 读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取终端大客户未消耗的云厂商承诺余额 (Azure MACC / AWS EDP</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  Shortfall) 及 ISV 全球渠道批发转移底价 (Wholesale Floor)</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 违规发布 95% 骨折批发价 (CPPO) 与抢劫直客商机</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，在 Tackle.io / Partner Center 中</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  生成 95% 批发折让的多方专属报价 (MPO/CPPO)，使渠道商零成本套利</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 或将 ISV 直销团队已跟进半年的大单强行改挂为渠道首发报备</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：云市场链接一经客户点击接受即生成不可撤回法律合同</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造云市场分账结算与渠道市场基金 (MDF) 诈骗 (BRK-752)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造云市场代收代付清算单 (Marketplace Disbursement) 或总代</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  联合营销发展基金 (MDF / Co-Op) 核销收款账户变更通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 渠道收款账户并电汇 $5,850 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：数百万美元云市场回款与渠道返利被劫持</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad371)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 云市场联合销售 (Co-Sell) 零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 渠道询价单清洗与强类型商机槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离渠道伙伴提交的报价申请 PDF 中的隐藏提示词，仅提取强类型</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  槽位 (AWS ACE / MS Partner Center 商机 ID、客户租户 ID、年限)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断报价单提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 客户 MACC/EDP 承诺余额与批发底价物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 客户云厂商承诺消费到期余额、ISV 渠道批发底价矩阵与平台抽成</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  费率表 (Listing Fee Tiers) 严格隔离在 restricted-budget</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性净毛利红线与首发商机报备时间戳硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 专属报价发布前在代码层强制扣除云平台抽成与渠道分成校验净毛利；</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  锁定 CRM 商机首次创建时间戳，严禁 AI 将直客单改挂给渠道</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断破价发布与抢单</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 云市场与渠道返佣账户只读锁 + 双签门禁</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中云市场与渠道商账户只读 (tool-allowlist +</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad371)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流云市场联合销售 (Tackle/Suger) 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性云市场网关 + MACC 气隙 + 毛利/报备锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-751/752 拦截率 100% | 守护 ISV 净毛利与直客商机归属</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Tackle.io / Suger / AWS ACE / Partner Center 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止自动建单 Bot 在渠道申请注入下发布超低批发价链接</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 CPPO 批发折算、平台抽成叠加与商机报备保护期语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 销售运营专员手工在三大云市场后台逐个复制粘贴创建报价</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 跨云报价同步耗时 3-5 天，季度末经常因手误输错批发价</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 371 · 770 场景！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：95% 破价发布、MACC 泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取客户 MACC 余额与批发底价 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断 95% 批发破价发布与抢夺直客商机报备</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传全网渠道返点阶梯与底价</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定渠道分账银行库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,850 伪造 MDF/分账电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 371 · 🏆 770 个场景、870 项 Pytest &amp; 190 篇双语指南里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. MACC 承诺余额与批发底价气隙：终端客户云承诺未消耗额度与 ISV 批发底价与渠道报价申请 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 CPPO 净毛利与商机归属硬锁：自动核算扣除云平台与渠道抽成后的净毛利红线，锁死直客商机时间戳</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 云市场分账与 MDF 账户只读：锁定 trust-registry，大额多方专属报价发布与 MDF 核销强制经 Deal Desk 双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：🏆 770 个场景 (767 风险 + 3 基线) | 🏆 870 项 Pytest 检查 | 1,606 项断言 | 756 个交互向量 | 371 篇双语 FAQ (🏆 190 篇指南) | BRK-751/752</text>
</svg>
