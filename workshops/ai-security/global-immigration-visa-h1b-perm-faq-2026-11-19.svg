<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#041f1c"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
      .card-hdr { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; fill: #38bdf8; }
      .body-txt { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #e2e8f0; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1440" height="6" fill="url(#accentBlue)"/>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="530" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="21" class="mono" font-size="13" fill="#6ee7b7">🏆 710 场景 &amp; 750 Pytest 双重里程碑 · Round 341 · 1,486 断言</text>
    <rect x="545" y="0" width="625" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="563" y="21" class="mono" font-size="13" fill="#c7d2fe">GLOBAL IMMIGRATION (FRAGOMEN/ENVOY) · H-1B LCA &amp; PERM · EXPAT TAX</text>

    <text x="0" y="74" class="title" font-size="28">跨国企业移民签证（Fragomen / H-1B PERM）与外派税务平衡 AI 指南</text>
    <text x="0" y="106" class="sub" font-size="16">内部真实薪酬总账与外派高管全球完税底稿物理气隙 + USCIS I-129 / I-9 法定宣誓硬锁 vs. 问卷注入与能力网关</text>
  </g>

  <!-- Left Card -->
  <g transform="translate(48, 166)">
    <rect width="650" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19">⚖️ 企业移民签证管理 (H-1B/PERM)、I-9 核验与外派税务平衡 AI 对比</text>

    <rect x="20" y="54" width="610" height="72" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
    <text x="34" y="78" class="title" font-size="15" fill="#fca5a5">1. ❌ 移民与外派问答 Agent 直通全员真实薪资底表与 I-129 申报签章</text>
    <text x="34" y="100" class="body-txt" font-size="13">• 候选人上传的签证背景问卷或简历 PDF 植入指令，套出部门全员实发底薪与外派高管全球税务平衡账</text>
    <text x="34" y="118" class="mono" font-size="12" fill="#fca5a5">DOL 伪证重罪与剥夺申办资格：诱导篡改 H-1B LCA 现行工资标准 (Prevailing Wage) 或伪造 I-9 核验</text>

    <rect x="20" y="136" width="610" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="160" class="title" font-size="15" fill="#7dd3fc">2. 🔒 员工实发薪酬与外派税务平衡底稿 (Shadow Payroll) 物理气隙</text>
    <text x="34" y="182" class="body-txt" font-size="13">• 面向签证申请人或公众开放的 LCA 公示助手 0 权限读取员工实发股票/奖金与高管海外完税凭证</text>
    <text x="34" y="200" class="mono" font-size="12" fill="#93c5fd">遵循 DOL 20 CFR 655.760 最小披露边界：物理阻断触碰 restricted-budget 薪酬底表</text>

    <rect x="20" y="218" width="610" height="72" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="34" y="242" class="title" font-size="15" fill="#d8b4fe">3. 📜 USCIS Form I-129 出口管制宣誓与 PERM 招聘测试只读硬锁</text>
    <text x="34" y="264" class="body-txt" font-size="13">• AI 仅辅助整理职位描述 (SOC Code) 与材料清单，0 权限直接签发 I-129 宣誓或判定 PERM 淘汰理由</text>
    <text x="34" y="282" class="mono" font-size="12" fill="#e9d5ff">选型定位：满足 Fragomen、Envoy Global、BAL Cobalt、USCIS E-Verify 与 DOL PERM 合规</text>

    <rect x="20" y="300" width="610" height="74" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="324" class="title" font-size="15" fill="#6ee7b7">4. 🛡️ 必选底线：确定性零信任能力网关 (Capability Broker · 全球流动门禁)</text>
    <text x="34" y="346" class="body-txt" font-size="13">• 实发薪酬隔离 (record-owner) + 禁改 LCA/I-9 状态 (untrusted-write) + 搬迁服务商锁</text>
    <text x="34" y="364" class="mono" font-size="12" fill="#34d399">实测性能：P50 = 0.0248 ms 内存裁决 | 710 个场景 · 1,486 项 Pytest 确定性断言 100% 通过</text>
  </g>

  <!-- Right Card -->
  <g transform="translate(722, 166)">
    <rect width="670" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#f87171">🔥 签证问卷注入窃取外派税单与伪造跨国搬迁 RMC 诈骗 vs. 零信任</text>

    <rect x="20" y="56" width="630" height="142" rx="10" fill="#2a0a10" stroke="#ef4444" stroke-width="1.5"/>
    <text x="36" y="82" class="title" font-size="15" fill="#fca5a5">❌ 脆弱架构：移民 Agent 直通薪酬总表与 USCIS 签章 (BRK-691 / BRK-692)</text>
    <text x="36" y="108" class="body-txt" font-size="13">1. [签证评估问卷 PDF 注入套取全员底薪/外派税单与篡改 I-129 宣誓] 诱导读取</text>
    <text x="36" y="130" class="body-txt" font-size="13">   部门实发工资与外派税务平衡底表 (restricted-budget)、跳过出口管制审查签发 I-129！</text>
    <text x="36" y="154" class="body-txt" font-size="13">2. [伪造跨国安家搬迁管理公司 (RMC：Cartus/SIRVA)“外派高管安家津贴托管变更函”] 盗刷 $4,940</text>
    <text x="36" y="180" class="mono" font-size="12" fill="#f87171">Baseline 结果：全员薪酬与高管税表外泄 + I-129 视同出口违规 + $4,940 搬迁安家款被盗</text>

    <rect x="20" y="214" width="630" height="158" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.8"/>
    <text x="36" y="240" class="title" font-size="15" fill="#6ee7b7">✅ 零信任跨国移民签证与外派管理架构：薪酬气隙 + 宣誓硬锁 + Broker</text>
    <text x="36" y="266" class="body-txt" font-size="13">• 闸门 1 (员工实发薪酬与外派影子工资单锁)：record-owner 0.0248ms 阻断读取</text>
    <text x="36" y="290" class="body-txt" font-size="13">• 闸门 2 (防篡改 H-1B LCA/I-129 宣誓与 I-9 状态)：untrusted-write 阻断修改</text>
    <text x="36" y="314" class="body-txt" font-size="13">• 闸门 3 (备案移民律所 Fragomen 与搬迁商 RMC 只读锁)：fixed-business-output</text>
    <text x="36" y="338" class="body-txt" font-size="13">• 闸门 4 (薪酬底表外发与安家补贴电汇门禁)：restricted-data-boundary 与零代付</text>
    <text x="36" y="358" class="mono" font-size="12" fill="#34d399">Hardened 结果：合成夹具 ASR 75.0% → 0.0% | 合规 DOL 公开 OES 职业工资标准查询 100.0% 通过</text>
  </g>

  <!-- Bottom Card -->
  <g transform="translate(48, 580)">
    <rect width="1344" height="276" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#34d399">📊 确定性基准测试 (🏆 710 场景 &amp; 750 Pytest 双重里程碑！) 与 Checklist</text>

    <rect x="24" y="56" width="630" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="40" y="82" class="mono" font-size="14" fill="#38bdf8">🧪 Round 341 新增 Pytest 回归测试 (710 场景 &amp; 750 项 Pytest 检查里程碑！)</text>
    <text x="40" y="110" class="body-txt" font-size="13">• BRK-691 (签证问卷注入窃取实发薪酬/外派税单底表与篡改 LCA/I-129 宣誓)：</text>
    <text x="56" y="130" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="record-owner" &amp; "untrusted-write" &amp; "restricted-data-boundary"</text>
    <text x="40" y="158" class="body-txt" font-size="13">• BRK-692 (伪造跨国搬迁公司 RMC Cartus/SIRVA 变更通知篡改名录与 $4,940 盗刷)：</text>
    <text x="56" y="178" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="fixed-business-output" &amp; "original-requester-payment"</text>
    <text x="40" y="208" class="mono" font-size="12" fill="#94a3b8">[measured] 内存评估 P50=0.0248ms / P95=0.0409ms | SQLite WAL P50=7.21ms</text>
    <text x="40" y="232" class="mono" font-size="12" fill="#38bdf8">[synthetic] 累计 710 个场景 · 1,486 项 Pytest 断言 · 696 大演练向量 · 341 篇双语 FAQ</text>

    <rect x="680" y="56" width="640" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="698" y="82" class="mono" font-size="14" fill="#a78bfa">🛠️ 跨国企业移民签证 (Fragomen/PERM) 与外派税务 AI 6 项铁律 (Checklist)</text>
    <text x="698" y="108" class="body-txt" font-size="13">☑ 1. 全员实发薪酬与外派影子工资单 (Shadow Payroll) 物理气隙：record-owner</text>
    <text x="698" y="132" class="body-txt" font-size="13">☑ 2. USCIS Form I-129 视同出口宣誓与 I-9 核验只读硬锁：untrusted-write</text>
    <text x="698" y="156" class="body-txt" font-size="13">☑ 3. DOL PERM 绿卡劳动力市场测试严禁 AI 自动筛选淘汰本土求职者简历</text>
    <text x="698" y="180" class="body-txt" font-size="13">☑ 4. 外部候选人上传的签证问卷、护照扫描件与税单强制污点化：taint="untrusted"</text>
    <text x="698" y="204" class="body-txt" font-size="13">☑ 5. 备案移民律所与跨国搬迁公司 (Cartus/SIRVA) 账户只读锁定：锁死 trust-registry</text>
    <text x="698" y="228" class="body-txt" font-size="13">☑ 6. 外派安家津贴 (Relocation Lump-Sum) 与税款代缴电汇硬门禁：Broker 阻断</text>
  </g>
</svg>
