    <rect x="20" y="54" width="610" height="72" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="34" y="78" class="title" font-size="15" fill="#fde68a">1. 💰 CFO 认账的 FAIR / ALE 安全投资回报率模型 (首年净 ROI = 152.6x)</text>
    <text x="34" y="100" class="body-txt" font-size="13">• 单次核心知识库/薪酬底牌泄密 SLE=$4.88M；单次退费/采购盗刷 SLE=$1.85M；EU 罚款 7% 营收</text>
