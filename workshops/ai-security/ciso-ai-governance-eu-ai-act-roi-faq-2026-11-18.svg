    <text x="56" y="178" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="fixed-business-output" &amp; "original-requester-payment"</text>
    <text x="40" y="208" class="mono" font-size="12" fill="#94a3b8">[measured] 内存评估 P50=0.0248ms / P95=0.0409ms | SQLite WAL P50=7.21ms</text>
    <text x="40" y="232" class="mono" font-size="12" fill="#fde68a">[synthetic] 累计 558 个场景 · 1,182 项 Pytest 断言 · 544 大演练向量 · 265 篇双语 FAQ</text>

    <rect x="680" y="56" width="640" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="698" y="82" class="mono" font-size="14" fill="#a78bfa">🛠️ 企业 CISO 董事会 AI 治理与全球合规 6 项铁律 (Boardroom Checklist)</text>
    <text x="698" y="108" class="body-txt" font-size="13">☑ 1. 密码学 AgBOM 台账：全量登记模型哈希、系统提示词、MCP 工具与人类责任人</text>
    <text x="698" y="132" class="body-txt" font-size="13">☑ 2. 状态收据验真门禁：以 Capability Broker 真实拦截收据替代脆弱的 LLM 裁判</text>
    <text x="698" y="156" class="body-txt" font-size="13">☑ 3. 红队题库物理隔离：record-owner 100% 阻断被测模型在评估期偷看标准答案</text>
    <text x="698" y="180" class="body-txt" font-size="13">☑ 4. 落实 EU Art. 14 人类监督：高风险操作强制绑定五元组 Action-Hash 人工签批</text>
    <text x="698" y="204" class="body-txt" font-size="13">☑ 5. 模型准入注册表硬锁：未过 CI/CD 确定性红队门禁的模型与插件 100% 拒绝上线</text>
    <text x="698" y="228" class="body-txt" font-size="13">☑ 6. FAIR/ALE 财务量化汇报：将安全拦截转化为风险规避 ROI，并禁自动支付认证费</text>
