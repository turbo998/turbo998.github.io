    <text x="36" y="154" class="body-txt" font-size="13">2. [假合规认证诈骗] 伪造 ISO 42001 认证通知篡改 trust-registry 白名单，并电汇 $4,990</text>
    <text x="36" y="180" class="mono" font-size="12" fill="#f87171">Baseline 结果：高危模型刷分过审上线 + 红队题库外泄 + $4,990 认证费被盗刷</text>

    <rect x="20" y="214" width="630" height="158" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.8"/>
    <text x="36" y="240" class="title" font-size="15" fill="#6ee7b7">✅ 零信任治理架构：确定性收据验真 + AgBOM + Capability Broker</text>
    <text x="36" y="266" class="body-txt" font-size="13">• 闸门 1 (红队题库物理锁)：record-owner 0.0248ms 阻断被测模型读取 restricted-budget</text>
    <text x="36" y="290" class="body-txt" font-size="13">• 闸门 2 (合规结论硬锁)：untrusted-write 阻断被测模型输出篡改评分结果 business-result</text>
    <text x="36" y="314" class="body-txt" font-size="13">• 闸门 3 (生产模型准入锁)：fixed-business-output 物理锁死合格模型白名单 trust-registry</text>
    <text x="36" y="338" class="body-txt" font-size="13">• 闸门 4 (认证资金隔离)：original-requester-payment 100% 拦截 $4,990 虚假认证费电汇</text>
