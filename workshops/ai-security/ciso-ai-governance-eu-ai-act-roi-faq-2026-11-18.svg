    <rect x="20" y="136" width="610" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="160" class="title" font-size="15" fill="#7dd3fc">2. 🇪🇺 欧盟 EU AI Act (Art. 9 / 14 / 15) + 国际标准 ISO/IEC 42001</text>
    <text x="34" y="182" class="body-txt" font-size="13">• Art. 14 人类监督 ➔ Action-Hash HITL 审批；Art. 15 抗攻击鲁棒性 ➔ 558 场景回归门禁</text>
    <text x="34" y="200" class="mono" font-size="12" fill="#93c5fd">ISO 42001 AIMS ➔ 密码学 AgBOM 台账 + trust-registry 签名准入，客户安全尽调缩短 70%</text>

    <rect x="20" y="218" width="610" height="72" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="34" y="242" class="title" font-size="15" fill="#d8b4fe">3. 🇺🇸 NIST AI RMF 1.0 + 🇨🇳 生成式 AI 服务管理暂行办法 / 大模型备案</text>
    <text x="34" y="264" class="body-txt" font-size="13">• 入训前 Presidio 100% 脱敏 + 双通道内容安全护栏 + 不可篡改 SQLite/Sentinel 审计收据</text>
    <text x="34" y="282" class="mono" font-size="12" fill="#e9d5ff">工程收益：一套代码底座同时自动生成中美欧四地监管迎检证据包，彻底告别重复填表</text>

    <rect x="20" y="300" width="610" height="74" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="324" class="title" font-size="15" fill="#6ee7b7">4. 🛡️ 必选底线：服务端状态收据验真 (废除易被注入劫持的 LLM-as-a-Judge)</text>
    <text x="34" y="346" class="body-txt" font-size="13">• 物理隔离红队评测答案库 (record-owner) + 锁死合规结论 (untrusted-write) + 禁自动打款</text>
    <text x="34" y="364" class="mono" font-size="12" fill="#34d399">实测性能：P50 = 0.0248 ms 内存裁决 | 558 个场景 · 1,182 项 Pytest 确定性断言 100% 通过</text>
  </g>

