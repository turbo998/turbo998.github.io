<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg385e" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg385e)" rx="16"/>
  <rect x="20" y="18" width="1160" height="72" rx="12" fill="#1E293B" stroke="#F97316" stroke-width="1.5"/>
  <text x="42" y="47" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Round 385 · WAAP, Bot Management &amp; API Security (Cloudflare / Akamai / AWS WAF / Salt) AI Security Guide</text>
  <text x="42" y="73" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">BRK-779 &amp; BRK-780 · 🏆 385-FAQ, BRK-780 &amp; 1,662-Assertion Milestone · Origin IP &amp; Shadow API Air-Gap + OWASP Block Lock</text>

  <!-- Left Column -->
  <rect x="24" y="106" width="368" height="476" rx="12" fill="#1A121C" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">⛔ Top 3 WAAP &amp; API Security Attack Chains</text>

  <rect x="38" y="152" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Origin Server IP &amp; Shadow API Inventory Leak (BRK-779)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Prompt injection in HTTP header (`User-Agent`) or 403 ticket</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Reads restricted-budget unproxied Origin Server IPs</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exfiltrates Salt/Noname unauthenticated Shadow/Zombie API list</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Attackers bypass CDN/WAF completely to hit origin &amp; BOLA APIs</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. OWASP CRS `Log-Only` Downgrade &amp; Bot Bypass (BRK-779)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Mutates business-result to set SQLi/RCE rules to `Log/Count`</text>
  <text x="50" y="362" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Creates custom WAF `Skip` rule for attacker ASN &amp; User-Agent</text>
  <text x="50" y="382" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Disables credential-stuffing Bot Challenge &amp; API rate limits</text>
  <text x="50" y="404" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Opens production checkout &amp; login APIs to SQLi &amp; botnets</text>

  <rect x="38" y="444" width="340" height="122" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="466" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Spoofed DDoS Scrubbing Surge Overage Fraud (BRK-780)</text>
  <text x="50" y="488" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Forged Cloudflare/Akamai/Prolexic Tbps scrubbing surge invoice</text>
  <text x="50" y="508" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Attacks trust-registry to swap edge CDN/DDoS carrier bank IBAN</text>
  <text x="50" y="528" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Tricks network procurement agent into wiring $6,550 surge fee</text>
  <text x="50" y="550" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Exploits DDoS emergency urgency to steal network security funds</text>

  <!-- Center Column -->
  <rect x="408" y="106" width="384" height="476" rx="12" fill="#0F1E2E" stroke="#F97316" stroke-width="1.5"/>
  <text x="428" y="136" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ Deterministic WAAP &amp; API Security Broker (Hardened)</text>

  <rect x="424" y="152" width="352" height="96" rx="8" fill="#162A3E" stroke="#38BDF8" stroke-width="1"/>
  <text x="438" y="174" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 1: WAF Log Scrubbing &amp; Taint Tagging (untrusted=True)</text>
  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Strips raw HTTP headers, cookies &amp; payloads from WAF logs</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Extracts typed slots (Ray_ID, Rule_ID_Int, URI_Enum, Status)</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Stops malicious HTTP traffic from hijacking WAF tuning agents</text>

  <rect x="424" y="258" width="352" height="96" rx="8" fill="#162A3E" stroke="#10B981" stroke-width="1"/>
  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 2: Origin Server IP &amp; Shadow API Inventory Air-Gap</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Origin IPs, mTLS certs &amp; Shadow APIs in restricted-budget</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• record-owner blocks read_record + restricted-data-boundary</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Zero exposure of direct-to-origin IPs or BOLA API inventories</text>

  <rect x="424" y="364" width="352" height="100" rx="8" fill="#162A3E" stroke="#F59E0B" stroke-width="1"/>
  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 3: OWASP Block-Mode &amp; No-Global-Skip Lock</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Prohibits downgrading SQLi/XSS/RCE rules to `Log` or `Skip`</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Scopes false-positive drafts to `(Rule_ID, Exact_URI, Param)`</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ untrusted-write blocks WAF bypasses &amp; rate-limit removal</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
  <text x="438" y="496" fill="#FDA4AF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 4: Immutable CDN / Scrubbing Carrier Registry Lock</text>
  <text x="438" y="518" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• tool-allowlist blocks update_trust + fixed-business-output</text>
  <text x="438" y="538" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• original-requester-payment blocks $6,550 scrubbing surge wire</text>
  <text x="438" y="556" fill="#FB7185" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Requires Network Security Lead + Controller FIDO2 sign-off</text>

  <!-- Right Column -->
  <rect x="808" y="106" width="368" height="476" rx="12" fill="#111C24" stroke="#10B981" stroke-width="1.5"/>
  <text x="826" y="136" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">📊 Architecture Matrix &amp; 385-FAQ Milestone</text>

  <rect x="822" y="152" width="340" height="196" rx="8" fill="#172A36" stroke="#334155" stroke-width="1"/>
  <text x="836" y="176" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">5 WAAP &amp; API Security Options Compared:</text>
  <text x="836" y="200" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">1. Deterministic WAAP Broker + Origin Air-Gap (🏆)</text>
  <text x="836" y="218" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   100% block on BRK-779/780 | +0.025ms | Zero WAF bypass</text>
  <text x="836" y="240" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Native Cloudflare / Akamai / AWS WAF / Salt RBAC</text>
  <text x="836" y="258" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Vulnerable if WAF-tuning bot holds rule-exception write scope</text>
  <text x="836" y="280" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Cloud LLM Guardrails (Prompt Shields / Bedrock)</text>
  <text x="836" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Blind to Wirefilter expressions &amp; OWASP CRS rule semantics</text>
  <text x="836" y="320" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. Leaving WAF in `Count/Log-Only` Mode to Avoid 403s</text>
  <text x="836" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Zero blocking protection; violates PCI-DSS 4.0 Req 6.4.2</text>

  <rect x="822" y="362" width="340" height="204" rx="8" fill="#0D2329" stroke="#F97316" stroke-width="1.5"/>
  <text x="836" y="388" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🏆 Deterministic Benchmark Totals (Round 385)</text>
  <text x="836" y="414" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Total Scenarios: <tspan fill="#FDBA74" font-weight="700">798</tspan> (795 Risk + 3 Benign)</text>
  <text x="836" y="438" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Pytest Checks: <tspan fill="#6EE7B7" font-weight="700">926 Passed (100%)</tspan></text>
  <text x="836" y="462" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Deterministic Assertions: <tspan fill="#FBBF24" font-weight="700">1,662</tspan> (🏆 1,662 Milestone!)</text>
  <text x="836" y="486" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Playground Vectors: <tspan fill="#F472B6" font-weight="700">784</tspan></text>
  <text x="836" y="510" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Bilingual FAQs: <tspan fill="#A78BFA" font-weight="700">385 (204 SA Guides)</tspan> (🏆 Milestone!)</text>
  <text x="836" y="538" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Added: BRK-779 (WAF bypass injection) &amp; BRK-780 (🏆 BRK-780 Milestone!)</text>

  <!-- Footer -->
  <rect x="20" y="596" width="1160" height="64" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="42" y="622" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Architect's Golden Rule:</text>
  <text x="205" y="622" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Never pass raw HTTP headers/payloads from WAF logs into tuning LLMs; lock OWASP CRS Block mode &amp; air-gap Origin Server IPs and Shadow APIs!</text>
  <text x="42" y="644" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Repository: turbo998/ai-security-lab (main) · Enterprise AI Security Architecture &amp; Product Selection Series · Round 385 (2026-11-20)</text>
