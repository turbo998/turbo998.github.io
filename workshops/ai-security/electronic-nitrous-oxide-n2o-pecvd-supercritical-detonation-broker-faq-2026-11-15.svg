  <rect x="632" y="176" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">1. 物理层：THC&lt;=0.5ppm 切塔闭锁 + 再沸器液位&gt;=65% + 泵 ΔT&gt;=5°C &lt;50ms 跳闸</text>
  <text x="646" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 物理焊死催化脱烃炉旁路；进冷箱 THC&gt;=0.5ppm &lt;100ms 硬线切断进料防烃浓缩</text>
  <text x="646" y="240" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 再沸器液位&lt;=65% 切热源；充装泵机械最小回流孔板 + ΔT&gt;=5°C &lt;50ms 硬线跳泵</text>
  <text x="646" y="260" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 彻底符合 EIGA Doc 174 / CGA G-8.3 防一氧化二氮无氧分解爆轰国际铁律</text>

  <rect x="632" y="290" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
