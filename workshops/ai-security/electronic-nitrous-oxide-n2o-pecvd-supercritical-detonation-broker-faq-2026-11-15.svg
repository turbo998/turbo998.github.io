  <text x="498" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17.5" font-weight="800" fill="#f8fafc">10万吨级 6N5 电子级一氧化二氮 (N2O) 与 NO 半导体特气基地：防超临界分解爆轰网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">正生成焓 (+82 kJ/mol) 零燃料无氧自加速分解爆轰 (-1865 kJ/kg, 压力暴涨 12x) · 冷箱再沸器痕量烃共冷凝炸塔 (-4350 kJ/kg) · 泵干转 &lt;50ms 跳闸</text>
