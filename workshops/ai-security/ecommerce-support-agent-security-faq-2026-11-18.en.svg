  <rect x="48" y="202" width="522" height="84" rx="10" fill="#27272a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="64" y="226" fill="#fca5a5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">1. Exposing user_id in LLM Schema Causes BOLA Order Snooping</text>
  <text x="64" y="248" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Letting the LLM fill user_id allows attackers to query other buyers' orders &amp; addresses</text>
  <text x="64" y="268" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Merchant promo reserve pool (restricted-budget) is extracted via roleplay prompts</text>

  <rect x="48" y="298" width="522" height="84" rx="10" fill="#27272a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="64" y="322" fill="#fca5a5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">2. "$1.00 Price Overrides" &amp; Hallucinated Refund Policy Lawsuits</text>
  <text x="64" y="344" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Freeform price/discount parameters let jailbreaks set checkout price to $1.00</text>
  <text x="64" y="364" fill="#e4e4e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Missing Groundedness checks allow bots to invent legally binding refund promises</text>

