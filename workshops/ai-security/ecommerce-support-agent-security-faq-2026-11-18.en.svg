  <text x="646" y="226" fill="#6ee7b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">Layer 1: Strip user_id from Tool Schema (Server-Side JWT Injection)</text>
  <text x="646" y="248" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• LLM calls list_my_orders() with zero user_id arg; gateway injects signed JWT sub</text>
  <text x="646" y="268" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Capability Broker enforces record-owner in 0.0248ms, eliminating BOLA snooping</text>

  <rect x="630" y="298" width="522" height="84" rx="10" fill="#1e293b" stroke="#065f46" stroke-width="1"/>
  <text x="646" y="322" fill="#6ee7b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">Layer 2: Remove Freeform Amounts + Enforce Output Groundedness</text>
  <text x="646" y="344" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Backend computes refundable amount deterministically; untrusted-write locks prices</text>
  <text x="646" y="364" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• Groundedness Detection verifies every policy statement against official Return Policy</text>

  <rect x="630" y="394" width="522" height="84" rx="10" fill="#1e293b" stroke="#065f46" stroke-width="1"/>
  <text x="646" y="418" fill="#6ee7b7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">Layer 3: APIM Token Quota + Deterministic Refund Broker (0.0248ms)</text>
  <text x="646" y="440" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• APIM &lt;llm-token-limit&gt; stops DoW botnets; fixed-business-output locks risk registry</text>
  <text x="646" y="460" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12.5">• original-requester-payment blocks customer-originated $1,980 refund wires</text>

