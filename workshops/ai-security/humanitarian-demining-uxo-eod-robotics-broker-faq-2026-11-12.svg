  <text x="635" y="158" fill="#ecfdf5" font-size="16" font-weight="800">✅ 方案 B：EOD 机械安全销 + IMAS 双人硬件签 + 能力网关 (Hardened ASR: 0.0%)</text>

  <rect x="637" y="192" width="510" height="74" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="216" fill="#6ee7b7" font-size="13.5" font-weight="700">1. AI 仅限单向增标风险 + EOD 物理拔插安全销 + IMAS 07.11 硬件双签</text>
  <text x="653" y="238" fill="#f1f5f9" font-size="12">• EOD 水射流起爆回路受机械安全销闭锁；雷区安全释放必须经 NMAC QA 官员双人硬件签批</text>
  <text x="653" y="256" fill="#34d399" font-size="11.5" font-weight="700">✓ 外部航测点云染色会话 (untrusted=True) 写操作被 rule="untrusted-write" 0.0248ms 拦截</text>

  <rect x="637" y="280" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-size="13.5" font-weight="700">2. 气隙排雷走廊与 C-RCIED 电子战频谱金库隔离 (record-owner + data-boundary)</text>
  <text x="653" y="326" fill="#f1f5f9" font-size="12">• 航测初筛 Agent (actor="calendar") 跨主体读取 restricted-budget 走廊与频谱库被立即拒绝</text>
  <text x="653" y="344" fill="#f1f5f9" font-size="12">• 任何包含已清排安全走廊 RTK 坐标或电子战干扰频段窗口的外发消息被出境边界死死卡住</text>
  <text x="653" y="358" fill="#34d399" font-size="11.5" font-weight="700">✓ 排雷与维和车队生命安全保护：安全走廊坐标与反 IED 频谱 0 越权读取、0 外部泄露</text>

  <rect x="637" y="378" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="402" fill="#6ee7b7" font-size="13.5" font-weight="700">3. IMAS 07.30 认证排雷机构表只读锁定与盲测试块核验结算</text>
  <text x="653" y="424" fill="#f1f5f9" font-size="12">• tool-allowlist + fixed-business-output 严禁 AI 修改 trust-registry 认证排雷机构表</text>
  <text x="653" y="442" fill="#34d399" font-size="11.5" font-weight="700">✓ original-requester-payment 阻断外部完工表发起的 $4,960 人道排雷基金盗刷</text>

  <rect x="637" y="476" width="510" height="82" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="500" fill="#6ee7b7" font-size="13.5" font-weight="700">4. 全链路 SHA-256 审计收据与联合国 IMAS 07.40 / CCW 公约合规证明</text>
  <text x="653" y="522" fill="#f1f5f9" font-size="12">• 纯内存策略判定 P50 = 0.0248ms / P95 = 0.0409ms；含 SQLite WAL 收据落盘 P50 = 7.21ms</text>
  <text x="653" y="542" fill="#34d399" font-size="11.5" font-weight="700">✓ 满足联合国地雷行动标准 (UN IMAS 07.11/09.30) 与国际人道主义信托基金审计要求</text>

