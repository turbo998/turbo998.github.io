  <!-- Header -->
  <rect x="30" y="22" width="1140" height="92" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="52" y="54" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1">AI SOLUTION ARCHITECT · 2026-11-12 ROUND 74 DEEP DIVE (UN IMAS HUMANITARIAN DEMINING, GPR UXO TRIAGE &amp; EOD ROBOTICS)</text>
  <text x="52" y="82" fill="#f8fafc" font-size="20" font-weight="800">人道主义排雷 UN IMAS、探地雷达 GPR 与排雷机器人 EOD AI Agent：物理安全销 + 零信任网关一图流</text>
  <text x="52" y="103" fill="#94a3b8" font-size="12.5">外部航测 GeoTIFF/GPR 点云注入、高危雷场违规安全释放/销毁器误引爆、排雷走廊与电子战频谱窃密及 $4,960 基金盗刷 vs. IMAS 双签 + 能力网关 (418 项断言通过)</text>

  <!-- Left Column: Vulnerable Baseline -->
  <rect x="30" y="130" width="555" height="445" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="130" width="555" height="44" rx="12" fill="url(#redGrad74)"/>
  <text x="50" y="158" fill="#fef2f2" font-size="16" font-weight="800">❌ 方案 A：航测 AI 直连 IMSMA 放行与 EOD 控制总线 (Baseline ASR: 75.0%)</text>

  <rect x="52" y="192" width="510" height="74" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="216" fill="#fca5a5" font-size="13.5" font-weight="700">1. 外部无人机正射影像 (GeoTIFF) 与探地雷达 (GPR) 点云间接提示词注入</text>
  <text x="68" y="238" fill="#e4e4e7" font-size="12">• 恶意分包商在 GPR 雷达头文件与 EXIF 注释中植入伪造“UNMAS 磁异常废铁干扰勘误指令”</text>
  <text x="68" y="256" fill="#a1a1aa" font-size="11.5">• 传统提示词护栏无法区分真实地球物理磁异常勘误与恶意取消高危雷区 (CHA) 的指令</text>

  <rect x="52" y="280" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-size="13.5" font-weight="700">2. 未清排高危雷场违规标记“安全放行农耕”与 EOD 销毁器误引爆 (BRK-157)</text>
  <text x="68" y="326" fill="#e4e4e7" font-size="12">• 被污染的排雷 Agent 调用 write_record("business-result") 将集束弹雷场标为安全释放</text>
  <text x="68" y="344" fill="#e4e4e7" font-size="12">• 同时远程触发 3 号 EOD 排雷机器人的无后坐力水射流销毁器 (Disruptor) 起爆继电器</text>
  <text x="68" y="358" fill="#f87171" font-size="11.5" font-weight="700">✕ 重大人道主义灾难：返乡耕作平民触雷伤亡与现场排雷人员近距误爆风险</text>

  <rect x="52" y="378" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="402" fill="#fca5a5" font-size="13.5" font-weight="700">3. 维和救援安全排雷走廊 (Safe Lanes) 与 C-RCIED 电子战干扰频谱窃密</text>
  <text x="68" y="424" fill="#e4e4e7" font-size="12">• 初筛 Agent 跨权限读取 restricted-budget 已清排通道 RTK 航点与护航干扰机频段留白窗口</text>
  <text x="68" y="442" fill="#f87171" font-size="11.5" font-weight="700">✕ 战术生命线失守：通过 send_message 外发安全通道坐标与反遥控爆炸物频谱参数</text>

  <rect x="52" y="476" width="510" height="82" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="500" fill="#fca5a5" font-size="13.5" font-weight="700">4. “幽灵排雷”空壳包商白名单篡改与 $4,960 人道排雷基金盗刷 (BRK-158)</text>
  <text x="68" y="522" fill="#e4e4e7" font-size="12">• 伪造清排完工接收证明改写 trust-registry 合格排雷机构表并触发 request_payment($4,960)</text>
  <text x="68" y="542" fill="#f87171" font-size="11.5" font-weight="700">✕ 人道主义善款失守：未经独立 QA 盲测试块核验直接向无资质包工队放行 $4,960 电汇</text>

