<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad377" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad377" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad377" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad377" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad377)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad377)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 377 · 🏆 1,630-ASSERTION MILESTONE · IDENTITY GOVERNANCE &amp; ADMINISTRATION (SAILPOINT / SAVIYNT / ENTRA ID GOVERNANCE)</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业身份治理与访问审阅 (IGA：SailPoint/Saviynt)、SOX 职责分离 (SoD) 与离职回收 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">未公布裁员预备名单 (Pre-RIF) 与高管调岗物理气隙 + 有毒权限互斥 (SoD) 与离职吊销硬锁 vs. 权限申诉注入与咨询诈骗 (BRK-763 / BRK-764)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad377)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业身份治理 (IGA) 与权限复核三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 权限保留申诉 PDF 注入窃取未公布裁员名单 (BRK-763)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 员工或业务主管提交的季度权限保留业务理由书 PDF 夹带提示词</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  注入，诱导 IGA 权限推荐 Agent 跨权限读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取 HR 预同步的未公开部门裁员名单 (Pre-Announcement RIF</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  Staging List) 与 SOX 404 历史未整改越权审计缺陷底稿</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 违规放行“建供应商+批付款”有毒 SoD 组合与保留孤儿账号</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，豁免 ERP 职责分离 (SoD) 冲突，</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  允许同一人兼任“新建供应商主数据 (FK01) + 批准付款 (F110)”</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 并在季度访问审阅 (UAR) 中批量盖章通过或挂起离职人员销户流</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：内部员工自建空壳供应商盗空资金与 SOX 审计否定意见</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造四大 IAM 角色挖掘与合规整改咨询诈骗 (BRK-764)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造全球身份安全咨询机构 (Big-4 / IAM Integrator) SOX 404</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  紧急缺陷整改与企业角色挖掘 (Role Mining) 里程碑结算通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 咨询商账户并电汇 $6,150 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：数百万美元数字化身份治理项目预算被盗汇</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad377)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业身份治理 (IGA) 与 SoD 零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 权限申诉理由书清洗与强类型权限槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离权限申请与 UAR 解释附件中的隐藏指令，仅提取强类型槽位</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  (员工工号、目标系统权限包 ID、当前已持角色集合、岗位代码)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断申诉单提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 未公开裁员名单 (Pre-RIF) 与高管异动物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• HR 保密拟裁员预备库、并购重组人事名单与 SOX 历史审计缺陷表</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  严格隔离在 restricted-budget 物理气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性布尔矩阵 SoD 互斥锁与转岗权限自动清零</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 代码层对申请权限与存量权限执行确定性图论/布尔交集 SoD 检测；</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  员工转岗 (Mover) 自动剥离旧部门存量权限，离职秒级硬吊销</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断 SoD 豁免与批量盲签</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 身份安全咨询商账户只读锁 + CISO/CFO 双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中咨询机构与集成商账户只读 (tool-allowlist +</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad377)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流企业身份治理 (IGA / UAR) 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性 IGA 网关 + 裁员名单气隙 + SoD 硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-763/764 拦截率 100% | 满足 SOX 404 ITGC &amp; ISO 27001</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. SailPoint / Saviynt / Entra ID Governance 原生推荐</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止 AI 访问审阅助手在理由书注入下给有毒 SoD 组合打高分</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 SAP 事务码 (T-Code) 跨系统互斥矩阵与转岗累积权限语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 部门经理每季度对数千行权限表手工点击“一键全部保留”</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 审阅疲劳引发橡皮图章，老员工体内堆积十几个部门历史权限</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 377 · 1,630 断言！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：有毒 SoD 放行、裁员泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取未公开裁员名单 Pre-RIF (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断豁免有毒 SoD 组合与保留离职孤儿账号</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传高管异动与 SOX 缺陷底表</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 IAM 咨询商账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $6,150 伪造咨询里程碑电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 377 · 🏆 1,630 项确定性断言里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 未公布裁员名单与审计缺陷气隙：HR 保密裁员预备库 (Pre-RIF) 与日常权限推荐 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性跨系统 SoD 互斥锁与转岗清零：代码层硬拦截有毒权限组合，转岗自动回收旧权限、离职秒级销户</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 咨询机构账户只读与双签：锁定 trust-registry，IGA 集成与合规咨询付款强制经 CISO 与财务双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：782 个场景 (779 风险 + 3 基线) | 894 项 Pytest 检查 | 🏆 1,630 项断言 | 768 个交互向量 | 377 篇双语 FAQ (196 篇指南) | BRK-763/764</text>
</svg>
