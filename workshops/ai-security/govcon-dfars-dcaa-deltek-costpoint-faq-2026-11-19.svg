<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad350" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad350" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad350" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad350" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad350)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad350)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 350 · 🏆 350-FAQ, BRK-710 &amp; 1,522-ASSERTION HISTORIC MILESTONE · GOVCON (DELTEK COSTPOINT / FAR / DCAA) &amp; SF-1443</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">政企与联邦项目承包 (Deltek Costpoint/FAR/DCAA)、间接费率池与进度款 AI Agent 安全选型指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">竞标赢标底价 (Price-to-Win) 与间接综合费率 (Wrap Rate) 物理气隙 + FAR 31.205 混同记账硬锁 vs. 分包发票注入混同成本与 CAGE 电汇诈骗 (BRK-709 / BRK-710)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad350)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 政企大型总包与项目核算三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 分包商工时/账单注入窃取赢标底价与综合费率 (BRK-709)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 联合投标伙伴 (Teaming Partner) 或分包商上传的工时凭证与</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  成本核算包 PDF 夹带间接提示词注入</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 诱导 Agent 跨库读取总包商机密赢标底价模型 (Price-to-Win)、</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  间接综合费率 (Fringe/OH/G&amp;A Wrap Rate) 及受控技术方案</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 违规跨合同串项记账 (Mischarging) 与入池 (BRK-709)</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令将亏损的固定总价合同 (FFP) 超支工时与 FAR 31.205</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  明确不可报销的公关游说/高管娱乐费转嫁至成本加成合同 (CPFF)</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 篡改 Deltek Costpoint 项目工时码 (Charge Code)</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：触犯《虚假申报法》(False Claims Act) 三倍罚款与禁标</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造 SAM.gov CAGE 代码与 SF-1443 进度款电汇诈骗 (BRK-710)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造分包商 SAM.gov 实体登记 CAGE 银行变更函与 SF-1443</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  里程碑进度款背靠背请款通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 收款账户并电汇 $5,100 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-size="11" font-weight="700">• 违规触发：政企专项拨款被盗与总包商连带违约追责</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad350)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 政企项目核算与合规审计零信任架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 分包商工时表与 SF-1443 清洗及槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离分包发票与成本证明附件中的隐藏提示词，仅提取强类型</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  槽位 (CLIN 合同行项、WBS 工作包码、工时类别、FAR 费用科目)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 赢标底价 (PTW) 与综合费率物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• ProPricer 赢标底价模型、间接费率池底表及 CUI/受控技术文档</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  存入物理气隙域 (restricted-budget)，符合 NIST 800-171 隔离</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 CAS 成本会计准则与 FAR 31.205 硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 确定性引擎强制隔离 FFP 与 CPFF 成本池，自动剥离不可报销科目</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  (Unallowable Costs)；严禁 AI 跨合同调剂工时或修改费率</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断违规串项记账</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: SAM.gov CAGE 账户只读锁与合同官双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中分包商 CAGE/UEI 银行账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad350)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流政企承包项目核算 AI 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性项目网关 + PTW 气隙 + CAS/FAR 硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-709/710 拦截率 100% | 满足 DCAA 审计 &amp; CMMC 2.0 L2</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Deltek Costpoint / Unanet 原生角色权限 + 工时审计</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法阻止共享对账助手在分包账单注入下自动发起工时重分类</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Gov Prompt Shields / Bedrock)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 CLIN/WBS 资金性质 (FFP vs CPFF) 与 CAS 401/402 语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统项目控制官 (Project Controller) 人工逐笔审查分包账单</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 年度产生费用报告 (ICS) 编制耗时数月，易漏检隐蔽不可报销项</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 350 · 350 篇 FAQ！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：串项记账、底价外泄与进度款放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取赢标底价与间接费率池 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断 FFP 超支转嫁至 CPFF 合同 (business-result)</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向竞标对手外传 Wrap Rate 底表</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 CAGE 收款账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,100 伪造进度款电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 350 · 🏆 350 篇双语 FAQ、BRK-710 &amp; 1,522 项断言三大历史性里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 竞标底价与受控信息气隙：ProPricer 赢标底价 (PTW)、间接综合费率底表与 CUI 文档按 NIST SP 800-171 与分包核算 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 CAS/FAR 成本池硬隔离：FFP 固定总价与 CPFF 成本加成 WBS 代码硬锁定，FAR 31.205 不可报销科目自动打入 Unallowable 池</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. SAM.gov 主数据只读与双签：分包商收款账户唯一同步自官方 SAM.gov CAGE/UEI 库，锁定 trust-registry 并执行合同官 FIDO2 双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：728 个场景 (725 风险 + 3 基线) | 786 项 Pytest 检查 | 🏆 1,522 项断言 | 714 个交互向量 | 🏆 350 篇双语 FAQ (168 篇指南) | 🏆 BRK-709/710</text>
</svg>
