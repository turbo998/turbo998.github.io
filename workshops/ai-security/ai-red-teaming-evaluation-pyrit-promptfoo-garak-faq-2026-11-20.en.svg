  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Reverse prompt injection in target model output or eval dataset</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Reads restricted-budget proprietary PyRIT Crescendo seeds</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exfiltrates unpatched universal jailbreaks &amp; holdout rubrics</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Turns internal red-team weapon vault into public exploit kit</text>

