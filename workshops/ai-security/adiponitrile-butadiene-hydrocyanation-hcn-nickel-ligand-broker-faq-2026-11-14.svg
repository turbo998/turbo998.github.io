  <text x="66" y="484" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">✕ 尼龙 66 核心双齿联萘亚磷酸酯配体与零价镍配方外泄</text>
  <text x="66" y="502" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">✕ $4,990 伪造普通填料函易外漏 HCN 调节阀预付款直接放行</text>

