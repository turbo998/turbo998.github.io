  <text x="446" y="334" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• untrusted-write：外部丁二烯化验单污染会话严禁改配氰</text>
  <text x="446" y="352" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• record-owner：阻断原料链跨主体读取 restricted-budget</text>
  <text x="446" y="370" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• restricted-data-boundary：封死双齿亚磷酸酯配体结构外发</text>
  <text x="446" y="388" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• fixed-business-output + original-requester-payment</text>

