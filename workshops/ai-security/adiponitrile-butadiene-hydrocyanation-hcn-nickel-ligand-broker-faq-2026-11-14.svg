  <text x="446" y="460" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 大位阻联萘亚磷酸酯配体与 BPh3/ZnCl2 促进剂存放气隙库</text>
  <text x="446" y="478" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 仅向寻优 Agent 暴露在线 GC 3-PN/2M3BN 异构体比值</text>
  <text x="446" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• 涉氰阀门付款强制核验双层金属波纹管氦检与 C276 光谱单</text>

