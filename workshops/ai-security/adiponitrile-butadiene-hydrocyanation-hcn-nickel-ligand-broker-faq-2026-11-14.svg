  <text x="446" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 10 级进料支管安装机械限流孔板 (单路物理上限 ≤15%)，</text>
  <text x="446" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">  在线红外检出游离 HCN&gt;500ppm 时 &lt;300ms 硬切 HCN 总阀</text>
  <text x="446" y="256" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• 破氰碱洗塔 pH≤11.0 (2oo3)：硬件瞬时全开 30% NaOH 补碱阀</text>
