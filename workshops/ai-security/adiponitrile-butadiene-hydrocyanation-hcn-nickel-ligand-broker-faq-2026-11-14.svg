  <text x="186" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">ROUND 119 · 266 场景 / 598 断言</text>
  <text x="334" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">30万吨级丁二烯直接氢氰化制己二腈 (ADN) 防 Ni(CN)2 淬死与未反应 HCN 闪蒸炸釜网关</text>
  <text x="52" y="96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">1,3-丁二烯化验单注入 vs. 10 级微孔进料机械限流孔板 + 游离 HCN&gt;500ppm 硬切阀 + 破氰碱洗塔 pH≥11.5 硬锁 (BRK-247 &amp; BRK-248)</text>

