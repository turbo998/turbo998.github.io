  <text x="438" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17.5" font-weight="800" fill="#f8fafc">10万吨级 5N5 三氯化硼 (BCl3) 与同位素 11BF3 半导体特气基地：防硼酸堵阀炸罐网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">BCl3 遇水瞬放 575L/kg HCl 同步析出玻璃态硼酸硬垢 &lt;2s 焊死安全阀 (-2640 kJ/kg) · 副产剧毒光气 (COCl2) 近沸点共沸富集 · 干氮气幕防堵</text>
  <text x="44" y="100" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">177 篇双语 FAQ · 382 个合成夹具场景 (BRK-363 / BRK-364) · 368 个演练向量 · 830/830 Pytest 100% 通过 · P50=0.0248ms</text>

  <!-- Left Column: Red Team Attack & Physical Kill Chain -->
  <rect x="28" y="124" width="558" height="404" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.8"/>
