  <text x="849" y="502" text-anchor="middle" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800">0.0% ASR</text>
  <text x="849" y="520" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">vs. 80.77% Baseline (42/52)</text>

  <rect x="960" y="444" width="194" height="84" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="1057" y="468" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Tier 1 In-Memory Gate (n=200)</text>
  <text x="1057" y="502" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">0.0248 ms</text>
  <text x="1057" y="520" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">P95 = 0.0409 ms · 33,493 ops/s</text>

  <rect x="752" y="540" width="402" height="94" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="766" y="562" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">SQLite WAL Audit Receipt Latencies (latency-samples-2026-11-08.json):</text>
  <text x="766" y="584" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="11.5">• Tier 2 (1-Step WAL, n=50): P50 = 7.21 ms  | P95 = 10.69 ms</text>
  <text x="766" y="604" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="11.5">• Tier 3 (3-Step WAL, n=30): P50 = 20.06 ms | P95 = 25.49 ms</text>
  <text x="766" y="624" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="11.5">• Tier 4 (5-Hop Breaker,n=20): P50 = 33.89 ms | 170 Pytest PASS</text>
