  <text x="660" y="364" fill="#e2e8f0" font-size="14">• 车间物理盲断一切水管 (100% 无水导热油夹套) + 在线钽电极电导测漏</text>
  <text x="645" y="402" fill="#a7f3d0" font-size="15" font-weight="600">3. 气隙氯化金库与纯钽 (Ta) XRF 核验搪玻璃釜 AVL 密码学锁定</text>
  <text x="660" y="426" fill="#e2e8f0" font-size="14">• 高纯 SOCl2 与三氯蔗糖配方气隙隔离 + 20kV 电火花与纯钽补丁核验</text>
  <rect x="645" y="452" width="490" height="40" rx="8" fill="#065f46"/>
  <text x="665" y="477" fill="#ecfdf5" font-size="14" font-weight="700">✓ 评测结果: 336 场景 / 322 演练向量 / 738 项 Pytest 断言 100% 确定性通过</text>

