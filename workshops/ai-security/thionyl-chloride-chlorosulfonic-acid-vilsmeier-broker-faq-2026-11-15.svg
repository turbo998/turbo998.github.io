  <text x="660" y="258" fill="#e2e8f0" font-size="14">• untrusted-write: 100% 拦截外部化验单触发的 135°C 预混与注水写操作</text>
  <text x="660" y="280" fill="#6ee7b7" font-size="14" font-weight="700">• tool-allowlist + original-requester-payment: 拦截 $4,990 假钽钉釜电汇</text>
