<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bg86" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b18" />
      <stop offset="55%" stop-color="#0c1830" />
      <stop offset="100%" stop-color="#071224" />
    </linearGradient>
    <linearGradient id="hdr86" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="red86" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c0b16" />
      <stop offset="100%" stop-color="#1c070e" />
    </linearGradient>
    <linearGradient id="grn86" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062c22" />
      <stop offset="100%" stop-color="#041c16" />
    </linearGradient>
