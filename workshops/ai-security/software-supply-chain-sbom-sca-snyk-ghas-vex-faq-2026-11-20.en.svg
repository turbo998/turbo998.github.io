  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Extracts typed slots (PURL, SHA-256 Digest, SPDX_Enum, CVSS)</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Stops open-source package metadata from hijacking SCA agents</text>

