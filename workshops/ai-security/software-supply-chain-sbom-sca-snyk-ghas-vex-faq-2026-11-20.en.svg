  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 2: Internal Package Namespace &amp; CVE Backlog Air-Gap</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Internal private scopes &amp; unpatched CVEs in restricted-budget</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• record-owner blocks read_record + restricted-data-boundary</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Prevents Dependency Confusion reconnaissance &amp; zero-day leaks</text>

