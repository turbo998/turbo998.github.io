<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg398" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr398" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg398)" rx="16"/>
  <rect x="20" y="18" width="1160" height="72" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="42" y="47" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">Round 398 · 企业大模型护栏横向选型指南 (Prompt Shields vs. Bedrock vs. NeMo vs. Lakera vs. Llama Guard)</text>
  <text x="42" y="73" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">BRK-805 &amp; BRK-806 · 🏆 810 个交互向量里程碑 · 为什么单靠概率语义护栏防不住 Agent 越权？概率过滤 + 确定性 Broker 双层架构</text>

  <!-- Left Column: Threats -->
  <rect x="24" y="106" width="368" height="476" rx="12" fill="#1A121C" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">⛔ 纯概率语义护栏在 Agent 场景三大盲区</text>

  <rect x="38" y="152" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">1. 自定义黑名单词库与分类器阈值探测泄密 (BRK-805)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 攻击者通过误报申诉或 Base64/多语种变形探测护栏边界</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 越权读取 restricted-budget 里的自定义敏感主题正则表达式</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 窃取自建 Llama Guard 微调权重与置信度放行阈值 (Threshold)</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 攻击者基于白盒阈值构造 100% 绕过分类器的对抗后缀 (GCG)</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">2. 降级 `Fail-Open` 旁路与合法语义越权执行 (BRK-805)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 制造高并发诱导护栏超时进入 `Fail-Open` (直接跳过护栏放行)</text>
  <text x="50" y="362" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 篡改 business-result 关闭 Groundedness 幻觉检测与 Spotlighting</text>
  <text x="50" y="382" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 用完全礼貌合规的商务语言诱导 Agent 执行越权退款/改账本</text>
  <text x="50" y="404" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 语义分类器看不出任何“脏话或越狱词”，但业务账本已被篡改</text>

  <rect x="38" y="444" width="340" height="122" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="466" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">3. 伪造护栏 API Token 超量与 GPU 算力账单诈骗 (BRK-806)</text>
  <text x="50" y="488" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 伪造 Lakera/云端护栏 “千次文本扫描配额耗尽紧急补缴通知”</text>
  <text x="50" y="508" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 攻击 trust-registry 篡改 AI 安全护栏供应商收款账户</text>
  <text x="50" y="528" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 诱导 AI 平台采购 Agent 直接发起 $7,200 紧急扩容电汇</text>
  <text x="50" y="550" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 借“护栏配额耗尽导致全网客服接口 503”恐吓骗取资金</text>

  <!-- Center Column: Zero-Trust Broker -->
  <rect x="408" y="106" width="384" height="476" rx="12" fill="#0F1E2E" stroke="#10B981" stroke-width="1.5"/>
  <text x="428" y="136" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">🛡️ 概率语义护栏 + 确定性 Broker 双层架构 (Hardened)</text>

  <rect x="424" y="152" width="352" height="96" rx="8" fill="#162A3E" stroke="#38BDF8" stroke-width="1"/>
  <text x="438" y="174" fill="#7DD3FC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">第一层（入站）：Spotlighting 边界标记 + Prompt Shields</text>
  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 外部文档强制做 Datamarking/编码隔离并过 Prompt Shields 初筛</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 无论语义分类器是否检出注入，一律在代码层打上 untrusted=True</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 即使 1% 高级变形绕过了概率护栏，污点标签依然 100% 留存</text>

  <rect x="424" y="258" width="352" height="96" rx="8" fill="#162A3E" stroke="#10B981" stroke-width="1"/>
  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">气隙层：自定义敏感词库与护栏模型权重物理隔离</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 业务专有黑名单词表与分类器阈值存入 restricted-budget</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• record-owner 阻断对话 Agent 读取 + restricted-data-boundary</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 外部只收统一模糊拒绝码，零置信度分数回显 (防梯度探测)</text>

  <rect x="424" y="364" width="352" height="100" rx="8" fill="#162A3E" stroke="#F59E0B" stroke-width="1"/>
  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">第二层（出站）：强制 `Fail-Closed` 与确定性工具网关硬锁</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 护栏超时或异常强制 `Fail-Closed` 拒绝，严禁降级 `Fail-Open`</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 工具执行前由 `broker.py` 按状态机拦截 untrusted-write (0.025ms)</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 彻底解决“语义护栏看不懂业务逻辑越权”的根本痛点</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
  <text x="438" y="496" fill="#FDA4AF" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">结算层：AI 安全护栏供应商账户只读与支付锁</text>
  <text x="438" y="518" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• tool-allowlist 禁用 update_trust + fixed-business-output</text>
  <text x="438" y="538" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• original-requester-payment 拦截 $7,200 伪造护栏配额电汇</text>
  <text x="438" y="556" fill="#FB7185" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ AI 安全架构师 + 财务总监 FIDO2 双签放行护栏订阅费</text>

  <!-- Right Column: Matrix & Metrics -->
  <rect x="808" y="106" width="368" height="476" rx="12" fill="#111C24" stroke="#10B981" stroke-width="1.5"/>
  <text x="826" y="136" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">📊 五大主流护栏对比与 810 向量里程碑</text>

  <rect x="822" y="152" width="340" height="196" rx="8" fill="#172A36" stroke="#334155" stroke-width="1"/>
  <text x="836" y="176" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">主流大模型护栏选型定位速查：</text>
  <text x="836" y="198" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="700">1. Azure Prompt Shields + Groundedness + 本仓 Broker (🏆)</text>
  <text x="836" y="214" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   Spotlighting 防间接注入 + RAG 幻觉检测 + 0.025ms 工具硬锁</text>
  <text x="836" y="234" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">2. AWS Bedrock Guardrails (含 Automated Reasoning)</text>
  <text x="836" y="250" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   擅长云原生主题拦截与形式化逻辑校验，需配跨系统工具网关</text>
  <text x="836" y="270" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">3. Lakera Guard (超低延迟 SaaS/容器越狱防火墙)</text>
  <text x="836" y="286" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   &lt;50ms 极速提示词攻击识别，需叠加业务层 RBAC/OBO 状态锁</text>
  <text x="836" y="306" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">4. NVIDIA NeMo Guardrails / Llama Guard 3/4 开源自建</text>
  <text x="836" y="322" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   数据不出私有 GPU 集群，但需承担高昂 GPU 推理与 Colang 维护</text>

  <rect x="822" y="362" width="340" height="204" rx="8" fill="#0D2329" stroke="#10B981" stroke-width="1.5"/>
  <text x="836" y="388" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14" font-weight="700">🏆 确定性基准回归达成 (Round 398)</text>
  <text x="836" y="414" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 对抗演练场景总数：<tspan fill="#6EE7B7" font-weight="700">824 个</tspan> (821 对抗 + 3 基线)</text>
  <text x="836" y="438" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• Pytest 参数化检查：<tspan fill="#6EE7B7" font-weight="700">978 项 100% PASS</tspan></text>
  <text x="836" y="462" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 确定性策略断言数：<tspan fill="#FBBF24" font-weight="700">1,714 项</tspan></text>
  <text x="836" y="486" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 交互式靶场攻击向量：<tspan fill="#F472B6" font-weight="700">810 个</tspan> (🏆 突破 810 里程碑！)</text>
  <text x="836" y="510" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 双语架构与选型指南：<tspan fill="#A78BFA" font-weight="700">398 篇 FAQ (217 篇指南)</tspan></text>
  <text x="836" y="538" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">新增测试：BRK-805 (护栏 Fail-Open 绕过) &amp; BRK-806 ($7,200 拦截)</text>

  <!-- Footer -->
  <rect x="20" y="596" width="1160" height="64" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="42" y="622" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">架构师核心铁律：</text>
  <text x="155" y="622" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">概率语义护栏负责挡 95% 显式越狱与幻觉，确定性 Capability Broker 负责 100% 兜底工具调用边界；严禁护栏超时降级为 Fail-Open！</text>
  <text x="42" y="644" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">Repository: turbo998/ai-security-lab (main) · Enterprise AI Security Architecture &amp; Product Selection Series · Round 398 (2026-11-20)</text>
</svg>
