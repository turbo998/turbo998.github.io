  <!-- Header -->
  <rect x="30" y="22" width="1140" height="92" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="52" y="54" fill="#fbbf24" font-size="14" font-weight="700" letter-spacing="1">AI SOLUTION ARCHITECT · 2026-11-12 ROUND 70 FLAGSHIP MILESTONE (70 篇双语 FAQ 与 400+ 项断言双里程碑 · CULTURAL HERITAGE &amp; FINE-ART AUCTION)</text>
  <text x="52" y="82" fill="#f8fafc" font-size="20" font-weight="800">国家博物馆文保、顶级艺术品拍卖溯源与珍品地库 AI Agent：物理双锁 + 零信任能力网关选型一图流</text>
  <text x="52" y="103" fill="#94a3b8" font-size="12.5">送拍图录 XRF 报告注入、地库恒湿防盗光栅撤防、国宝押运路线/拍卖保留底价窃密与 $4,960 托管盗刷 vs. 双人钥匙 + 能力网关 (402 项 Pytest 通过)</text>

  <!-- Left Column: Vulnerable Baseline -->
  <rect x="30" y="130" width="555" height="445" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="130" width="555" height="44" rx="12" fill="url(#redGrad70)"/>
  <text x="50" y="158" fill="#fef2f2" font-size="16" font-weight="800">❌ 方案 A：一体化文博拍卖 Agent 直连地库/底价库 (Baseline ASR: 75.0%)</text>

  <rect x="52" y="192" width="510" height="74" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="216" fill="#fca5a5" font-size="13.5" font-weight="700">1. 外部藏家送拍图录 / 多光谱鉴定报告 (XRF / C-14 PDF) 间接提示词注入</text>
  <text x="68" y="238" fill="#e4e4e7" font-size="12">• 跨国文物黑产在油画 XRF 颜料分析报告中植入伪造“总策展人夜间微环境演练指令”</text>
  <text x="68" y="256" fill="#a1a1aa" font-size="11.5">• 传统 RBAC 与文本护栏无法识别“超高敏木板油画恒湿切换 / 保险协查”专业文博工单</text>

  <rect x="52" y="280" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-size="13.5" font-weight="700">2. 珍品地库震动防盗光栅撤防与书画库恒湿上限篡改 (BRK-149)</text>
  <text x="68" y="326" fill="#e4e4e7" font-size="12">• 被污染的策展 Agent 调用 write_record("business-result") 将防盗光栅切为 MAINTENANCE_BYPASS</text>
  <text x="68" y="344" fill="#e4e4e7" font-size="12">• 同时将宋元绢本书画库相对湿度上限调至 85%，导致国宝霉变龟裂或夜间被飞贼洗劫</text>
  <text x="68" y="358" fill="#f87171" font-size="11.5" font-weight="700">✕ 国家级文物浩劫：地库防盗防线静默撤防与不可逆有机文物损毁</text>

  <rect x="52" y="378" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="402" fill="#fca5a5" font-size="13.5" font-weight="700">3. 一级国宝跨馆押运车队路线与夜场拍品保留底价 (Reserve Price) 窃密</text>
  <text x="68" y="424" fill="#e4e4e7" font-size="12">• 图录初筛 Agent 跨权限读取 restricted-budget 装甲押运时刻表与匿名大藏家号牌底价</text>
  <text x="68" y="442" fill="#f87171" font-size="11.5" font-weight="700">✕ 安防与商业底牌失守：通过 send_message 将押运路线与拍品底价外发盗窃集团/围标方</text>

  <rect x="52" y="476" width="510" height="82" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="500" fill="#fca5a5" font-size="13.5" font-weight="700">4. 走私盗掘文物画廊白名单篡改与 $4,960 拍品预付定金盗刷 (BRK-150)</text>
  <text x="68" y="522" fill="#e4e4e7" font-size="12">• 伪造 UNESCO 1970 流传有序公证函改写 trust-registry 并触发 request_payment($4,960)</text>
  <text x="68" y="542" fill="#f87171" font-size="11.5" font-weight="700">✕ 拍卖托管金库失守：未经 INTERPOL/ALR 查重直接放行 $4,960 保真预付定金电汇</text>

