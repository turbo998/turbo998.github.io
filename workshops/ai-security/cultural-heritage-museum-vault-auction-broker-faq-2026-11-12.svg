  <text x="653" y="216" fill="#6ee7b7" font-size="13.5" font-weight="700">1. UL 681 金库双人物理钥匙 + 恒湿 PLC 硬件限位 + untrusted-write</text>
  <text x="653" y="238" fill="#f1f5f9" font-size="12">• 地库防盗光栅撤防必须现场双人同时转动物理钥匙；温湿度安全包络由硬件 PLC 锁死</text>
  <text x="653" y="256" fill="#34d399" font-size="11.5" font-weight="700">✓ 外部送拍报告染色会话 (untrusted=True) 写操作被 rule="untrusted-write" 在 0.0248ms 拦截</text>

  <rect x="637" y="280" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-size="13.5" font-weight="700">2. 气隙国宝押运路线与拍卖保留底价金库隔离 (record-owner + data-boundary)</text>
  <text x="653" y="326" fill="#f1f5f9" font-size="12">• 图录初筛 Agent (actor="calendar") 跨主体读取 restricted-budget 押运与底价库被立即拒绝</text>
  <text x="653" y="344" fill="#f1f5f9" font-size="12">• 任何包含未公开押运路线、委托底价或匿名号牌的外发消息被出境边界规则死死卡住</text>
  <text x="653" y="358" fill="#34d399" font-size="11.5" font-weight="700">✓ 国宝安防与拍卖公平：押运时刻表与保留底价 0 越权读取、0 外部泄露</text>

  <rect x="637" y="378" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="402" fill="#6ee7b7" font-size="13.5" font-weight="700">3. 合规画廊名录只读锁定与 INTERPOL / ALR 硬件签章绑定结算</text>
  <text x="653" y="424" fill="#f1f5f9" font-size="12">• tool-allowlist + fixed-business-output 严禁 AI 修改 trust-registry 合规送拍商表</text>
  <text x="653" y="442" fill="#34d399" font-size="11.5" font-weight="700">✓ original-requester-payment 阻断外部报告发起的 $4,960 拍品定金电汇</text>

  <rect x="637" y="476" width="510" height="82" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="500" fill="#6ee7b7" font-size="13.5" font-weight="700">4. 全链路 SHA-256 审计收据与 ICOM / UNESCO 1970 / 劳合社艺术险合规</text>
  <text x="653" y="522" fill="#f1f5f9" font-size="12">• 纯内存策略判定 P50 = 0.0248ms / P95 = 0.0409ms；含 SQLite WAL 收据落盘 P50 = 7.21ms</text>
  <text x="653" y="542" fill="#34d399" font-size="11.5" font-weight="700">✓ 满足国际博协 (ICOM)、UNESCO 1970 公约与劳合社 (Lloyd's) 艺术品保险审计</text>

