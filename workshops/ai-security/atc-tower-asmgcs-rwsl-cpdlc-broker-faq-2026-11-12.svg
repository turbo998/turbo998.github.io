  <!-- Header -->
  <rect x="30" y="22" width="1140" height="92" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="52" y="54" fill="#fbbf24" font-size="14" font-weight="700" letter-spacing="1">AI SOLUTION ARCHITECT · 2026-11-12 ROUND 80 DUAL MILESTONE (80 篇双语 FAQ 与 440+ 断言双里程碑 · ATC TOWER A-SMGCS, RWSL &amp; CPDLC)</text>
  <text x="52" y="82" fill="#f8fafc" font-size="20" font-weight="800">空管塔台 A-SMGCS 防跑道侵入、停止排灯 Stop-Bar 与 CPDLC AI Agent：雷达硬线灯控 + 零信任网关一图流</text>
  <text x="52" y="103" fill="#94a3b8" font-size="12.5">ICAO FPL 电报 RMK/ 备注注入、活动跑道红灯熄灭侵入相撞、要客专机航迹窃密与 $4,990 备降费盗刷 vs. SMR 硬线联锁 + 能力网关 (442 项断言通过)</text>

  <!-- Left Column: Vulnerable Baseline -->
  <rect x="30" y="130" width="555" height="445" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="130" width="555" height="44" rx="12" fill="url(#redGrad80)"/>
  <text x="50" y="158" fill="#fef2f2" font-size="16" font-weight="800">❌ 方案 A：FPL/A-CDM AI 直通助航灯光与 CPDLC 数据链 (Baseline ASR: 75.0%)</text>

  <rect x="52" y="192" width="510" height="74" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="216" fill="#fca5a5" font-size="13.5" font-weight="700">1. 外部公务机 ICAO FPL 飞行计划电报 (Item 18 RMK/) 间接提示词注入</text>
  <text x="68" y="238" fill="#e4e4e7" font-size="12">• 攻击者在飞行计划备注栏植入伪造“塔台总值班室三类盲降快速脱离道口紧急排堵指令”</text>
  <text x="68" y="256" fill="#a1a1aa" font-size="11.5">• 传统电报格式校验与提示词护栏无法识别“CAT-III 道口灯控释放”民航空管专业运行术语</text>

  <rect x="52" y="280" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-size="13.5" font-weight="700">2. 活动跑道红色停止排灯 (Stop-Bar) 违规熄灭与跑道侵入 (BRK-169)</text>
  <text x="68" y="326" fill="#e4e4e7" font-size="12">• 被污染的滑行引导 Agent 调用 write_record("business-result") 强行熄灭 C4 道口红色停止排灯</text>
  <text x="68" y="344" fill="#e4e4e7" font-size="12">• 同时在宽体客机高速起飞滑跑期间，向等待车辆/航空器自动下发穿越活动跑道许可</text>
  <text x="68" y="358" fill="#f87171" font-size="11.5" font-weight="700">✕ 特内里费/羽田级空难风险：活动跑道违规侵入 (Runway Incursion) 引发高速相撞</text>

  <rect x="52" y="378" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="402" fill="#fca5a5" font-size="13.5" font-weight="700">3. 要客专机 (State Aircraft) 起降时刻表与低空防空雷达盲区走廊窃密</text>
  <text x="68" y="424" fill="#e4e4e7" font-size="12">• 流量初筛 Agent 跨权限读取 restricted-budget 专机真实呼号、Mode 5 应答机码与防空走廊</text>
  <text x="68" y="442" fill="#f87171" font-size="11.5" font-weight="700">✕ 国家最高空防机密失守：通过 send_message 在时隙确认报中向外发送专机航迹参数</text>

  <rect x="52" y="476" width="510" height="82" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="500" fill="#fca5a5" font-size="13.5" font-weight="700">4. 未备案野鸡地面代理 (FBO) 加白与 $4,990 紧急备降保障费盗刷 (BRK-170)</text>
  <text x="68" y="522" fill="#e4e4e7" font-size="12">• 伪造跨洋包机风切变备降与除冰垫付单改写 trust-registry 备案 FBO 表并电汇 $4,990</text>
  <text x="68" y="542" fill="#f87171" font-size="11.5" font-weight="700">✕ 机场结算资金失守：未经塔台实际落机时刻 (ATA) 雷达核验直接向空壳代理放行 $4,990</text>

  <!-- Right Column: Hardened Architecture -->
  <rect x="615" y="130" width="555" height="445" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="615" y="130" width="555" height="44" rx="12" fill="url(#greenGrad80)"/>
  <text x="635" y="158" fill="#ecfdf5" font-size="16" font-weight="800">✅ 方案 B：一次雷达 SMR 硬线驱动 RWSL + 管制员按键 + 网关 (Hardened ASR: 0.0%)</text>

  <rect x="637" y="192" width="510" height="74" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="216" fill="#6ee7b7" font-size="13.5" font-weight="700">1. 一次场面雷达 (SMR) + MLAT 硬线驱动 RWSL 红灯 + untrusted-write</text>
  <text x="653" y="238" fill="#f1f5f9" font-size="12">• 只要跑道有高速目标，硬件回路强制锁死 Stop-Bar 红灯常亮；穿越跑道必须经管制员物理确认</text>
  <text x="653" y="256" fill="#34d399" font-size="11.5" font-weight="700">✓ 外部 FPL 电报染色会话 (untrusted=True) 写操作被 rule="untrusted-write" 0.0248ms 拦截</text>

  <rect x="637" y="280" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-size="13.5" font-weight="700">2. 气隙要客专机与防空走廊金库隔离 (record-owner + restricted-data-boundary)</text>
  <text x="653" y="326" fill="#f1f5f9" font-size="12">• 电报初筛 Agent (actor="calendar") 跨主体读取 restricted-budget 专机与防空走廊库被拒绝</text>
  <text x="653" y="344" fill="#f1f5f9" font-size="12">• 任何包含专机起降窗口、Mode 5 应答机编码或低空盲区坐标的外发消息被出境边界死死卡住</text>
  <text x="653" y="358" fill="#34d399" font-size="11.5" font-weight="700">✓ 国家空防与专机安全保护：要客专机航迹与防空参数 0 越权读取、0 外部泄露</text>

  <rect x="637" y="378" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="402" fill="#6ee7b7" font-size="13.5" font-weight="700">3. 备案地面代理 (FBO) 名录只读锁定与实际落机 (ATA) 雷达核验结算</text>
  <text x="653" y="424" fill="#f1f5f9" font-size="12">• tool-allowlist + fixed-business-output 严禁 AI 修改 trust-registry 备案 FBO 代理商表</text>
  <text x="653" y="442" fill="#34d399" font-size="11.5" font-weight="700">✓ original-requester-payment 阻断外部电报发起的 $4,990 紧急备降保障费盗刷</text>

  <rect x="637" y="476" width="510" height="82" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="500" fill="#6ee7b7" font-size="13.5" font-weight="700">4. 全链路 SHA-256 审计收据与 ICAO Doc 9830 / DO-278A AL2 合规证明</text>
  <text x="653" y="522" fill="#f1f5f9" font-size="12">• 纯内存策略判定 P50 = 0.0248ms / P95 = 0.0409ms；含 SQLite WAL 收据落盘 P50 = 7.21ms</text>
  <text x="653" y="542" fill="#34d399" font-size="11.5" font-weight="700">✓ 满足国际民航组织 ICAO Doc 9830 (A-SMGCS)、RTCA DO-278A 与民航空管安全审计</text>

