<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="acc4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg4)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#acc4)"/>

  <!-- Header -->
  <rect x="32" y="20" width="350" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
  <text x="48" y="39" fill="#c7d2fe" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">AI 解决方案架构师实战指南 · 2026-11-08 ROUND 4</text>
  <text x="400" y="39" fill="#94a3b8" font-family="monospace" font-size="12">Provenance: measured (n=200/n=50) · synthetic (36 fixtures) · anonymized_reported</text>

  <text x="32" y="76" fill="#f8fafc" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="23" font-weight="800">Coding Agent 代码执行沙盒选型：标准 Docker vs. gVisor 用户态内核 vs. Firecracker MicroVM vs. TEE</text>
  <text x="32" y="102" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13.5">核心铁律：动态代码严禁跑在共享内核 Docker 上，且必须 enforces “沙盒内零长效凭据 (Zero Secrets) + 外部网关代填 + IMDS 169.254.169.254 黑洞”</text>

  <!-- Left Box: Why Standard Docker Fails -->
  <rect x="32" y="122" width="555" height="240" rx="12" fill="#1f1218" stroke="#ef4444" stroke-width="1.5"/>
  <text x="52" y="150" fill="#fca5a5" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700">❌ 沦陷路径：为什么一行恶意 conftest.py 就能打穿标准 Docker？</text>

  <rect x="52" y="166" width="515" height="54" rx="8" fill="#2d161e" stroke="#f87171" stroke-width="1"/>
  <text x="66" y="186" fill="#fecaca" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">1. 无需内核 0-day：直接读取 os.environ 与写穿挂载目录 (BRK-17)</text>
  <text x="66" y="206" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12">若把 GITHUB_TOKEN 注入容器或挂载父目录，pytest 执行瞬间即可窃取密钥并篡改 .github/workflows</text>

  <rect x="52" y="230" width="515" height="54" rx="8" fill="#2d161e" stroke="#f87171" stroke-width="1"/>
  <text x="66" y="250" fill="#fecaca" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">2. 云主机元数据 SSRF 窃取节点 IAM 临时凭据 (BRK-18)</text>
  <text x="66" y="270" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12">默认桥接网络直通 http://169.254.169.254/latest/meta-data/iam/ 与内网 K8s API，10ms 横向接管节点</text>

  <rect x="52" y="294" width="515" height="54" rx="8" fill="#2d161e" stroke="#f87171" stroke-width="1"/>
  <text x="66" y="314" fill="#fecaca" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">3. 共享宿主机 Linux 内核（暴露 ~300+ 系统调用攻击面）</text>
  <text x="66" y="334" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12">runc 容器共享宿主机 vmlinuz，动态生成的不可信 C/Python 载荷可直接冲击 io_uring / bpf 内核态</text>

  <!-- Right Box: Zero-Secret Micro-Isolation Pattern -->
  <rect x="613" y="122" width="555" height="240" rx="12" fill="#0d211d" stroke="#10b981" stroke-width="1.5"/>
  <text x="633" y="150" fill="#6ee7b7" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700">✅ 零信任架构：gVisor / Firecracker + 沙盒内零凭据 + 外部能力网关</text>

  <rect x="633" y="166" width="515" height="54" rx="8" fill="#112e28" stroke="#34d399" stroke-width="1"/>
  <text x="647" y="186" fill="#a7f3d0" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">防线 1：内核态强隔离（gVisor Sentry 拦截 vs. Firecracker 独立内核）</text>
  <text x="647" y="206" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12">标准 K8s 选 gVisor (runsc 用户态 Go 内核)；支持 KVM / 多租户 SaaS 选 Firecracker MicroVM 一次性销毁</text>

  <rect x="633" y="230" width="515" height="54" rx="8" fill="#112e28" stroke="#34d399" stroke-width="1"/>
  <text x="647" y="250" fill="#a7f3d0" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">防线 2：沙盒内零长效凭据 + 沙盒外能力网关代填 (Out-of-Sandbox Broker)</text>
  <text x="647" y="270" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12">沙盒 os.environ 不放任何 Token；网关在沙盒外验签 (measured p50=0.0078ms) 后代填短效 OBO 凭证</text>

  <rect x="633" y="294" width="515" height="54" rx="8" fill="#112e28" stroke="#34d399" stroke-width="1"/>
  <text x="647" y="314" fill="#a7f3d0" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">防线 3：云元数据 IMDS 黑洞 + realpath 路径规范化 + CI 文件只读锁死</text>
  <text x="647" y="334" fill="#e2e8f0" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12">硬封禁 169.254.169.254 与 RFC1918 内网段；锁定 .github/workflows/* 与 .git/hooks/* 防止流水线投毒</text>

  <!-- Bottom Decision Matrix -->
  <rect x="32" y="380" width="1136" height="195" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="52" y="408" fill="#f8fafc" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="700">📊 四级沙盒架构选型矩阵与定量证据口径对比（36 个离线合成夹具 · 137 项 Pytest 断言全通过）</text>

  <rect x="52" y="420" width="1096" height="28" rx="4" fill="#0f172a"/>
  <text x="64" y="439" fill="#94a3b8" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">沙盒隔离层级</text>
  <text x="275" y="439" fill="#94a3b8" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">适用业务场景</text>
  <text x="530" y="439" fill="#94a3b8" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">内核隔离边界</text>
  <text x="770" y="439" fill="#94a3b8" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">夹具 ASR (synthetic)</text>
  <text x="935" y="439" fill="#94a3b8" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="700">启动/网关耗时与出处</text>

  <!-- Row 1 -->
  <text x="64" y="468" fill="#fca5a5" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600">L1 标准 Docker + 静态 Env 密钥</text>
  <text x="275" y="468" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12">仅限固定预编译内部工具（严禁跑动态代码）</text>
  <text x="530" y="468" fill="#fca5a5" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12">共享宿主机 Linux 内核 (~300 Syscalls)</text>
  <text x="770" y="468" fill="#f87171" font-family="monospace" font-size="12.5" font-weight="700">75.0% (IMDS/路径全破)</text>
  <text x="935" y="468" fill="#cbd5e1" font-family="monospace" font-size="11.5">~30-80ms (anonymized_reported)</text>

  <!-- Row 2 -->
  <text x="64" y="498" fill="#93c5fd" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="600">L2 gVisor (runsc) + 零凭据网关</text>
  <text x="275" y="498" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12">无 KVM 的标准 K8s 内部研发/数据分析 Agent</text>
  <text x="530" y="498" fill="#93c5fd" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12">Go 用户态 Sentry 内核拦截系统调用</text>
  <text x="770" y="498" fill="#34d399" font-family="monospace" font-size="12.5" font-weight="700">0.0% (36/36 夹具阻断)</text>
  <text x="935" y="498" fill="#6ee7b7" font-family="monospace" font-size="11.5">网关 p50=0.0078ms (measured)</text>

  <!-- Row 3 -->
  <text x="64" y="528" fill="#6ee7b7" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">L3 Firecracker MicroVM + 零凭据网关</text>
  <text x="275" y="528" fill="#f8fafc" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">外部开源 PR 评测 / 多租户 Code Interpreter</text>
  <text x="530" y="528" fill="#6ee7b7" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">KVM 硬件虚拟化独立 Guest 内核 + 即用即毁</text>
  <text x="770" y="528" fill="#34d399" font-family="monospace" font-size="12.5" font-weight="700">0.0% (100% 良性通过)</text>
  <text x="935" y="528" fill="#6ee7b7" font-family="monospace" font-size="11.5">含落盘 p50=8.07ms (measured)</text>

  <!-- Row 4 -->
  <text x="64" y="556" fill="#c4b5fd" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="700">L4 硬件机密计算 TEE (TDX/SEV-SNP)</text>
  <text x="275" y="556" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12">金融金库独立解码签名 / 跨机构机密数据</text>
  <text x="530" y="556" fill="#c4b5fd" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="12">CPU 硬件内存加密 + 远程证明 Attestation</text>
  <text x="770" y="556" fill="#34d399" font-family="monospace" font-size="12.5" font-weight="700">0.0% ($6B 级熔断保护)</text>
  <text x="935" y="556" fill="#cbd5e1" font-family="monospace" font-size="11.5">~200-500ms (anonymized_reported)</text>

  <!-- Footer -->
  <rect x="32" y="590" width="1136" height="62" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="52" y="615" fill="#fde047" font-family="system-ui, -apple-system, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">🛠️ 架构师上线必查 Checklist： ① 动态代码强制 gVisor/MicroVM ② 沙盒 os.environ 零密钥 ③ 封死 169.254.169.254 与内网 ④ 锁死 .github/workflows 只读</text>
  <text x="52" y="638" fill="#94a3b8" font-family="monospace" font-size="11.5">Repo: github.com/turbo998/ai-security-lab ｜ FAQ: research/offensive-defensive/agent-sandbox-docker-gvisor-microvm-selection-faq.md ｜ live_kvm_escape: not_measured</text>
