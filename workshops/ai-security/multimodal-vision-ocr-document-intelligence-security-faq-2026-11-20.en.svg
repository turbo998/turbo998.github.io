  <text x="212" y="168" text-anchor="middle" fill="#fecaca" font-size="15" font-weight="800">🚨 1. Top 3 Multimodal VLM &amp; PDF Layer Risks</text>

  <rect x="46" y="196" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="218" fill="#f87171" font-size="13" font-weight="700">① Typographic Image Injection &amp; Bid Exfil (BRK-827)</text>
  <text x="60" y="240" fill="#cbd5e1" font-size="12">Low-contrast watermark text, micro-fonts, or XMP</text>
  <text x="60" y="258" fill="#cbd5e1" font-size="12">metadata in RFP images bypass text filters to read</text>
  <text x="60" y="278" fill="#fca5a5" font-size="12" font-weight="700">&amp; exfiltrate sealed reserve bids (`restricted-budget`)!</text>

  <rect x="46" y="306" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="328" fill="#f87171" font-size="13" font-weight="700">② Dual-Layer PDF Desync &amp; Clause Override</text>
  <text x="60" y="350" fill="#cbd5e1" font-size="12">Visible PDF layer shows "$1M liability cap" to</text>
  <text x="60" y="368" fill="#cbd5e1" font-size="12">human lawyers while hidden zero-opacity text stream</text>
  <text x="60" y="388" fill="#fca5a5" font-size="12" font-weight="700">tricks the CLM agent into auto-approving unlimited risk!</text>

  <rect x="46" y="416" width="333" height="100" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="438" fill="#f87171" font-size="13" font-weight="700">③ Invoice Factoring QR Hijack &amp; Wire (BRK-828)</text>
