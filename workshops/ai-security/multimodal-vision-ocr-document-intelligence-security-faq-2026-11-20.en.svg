  <text x="60" y="478" fill="#cbd5e1" font-size="12">receivables factoring notice to overwrite `trust-registry`</text>
  <text x="60" y="498" fill="#fca5a5" font-size="12" font-weight="700">and execute a $7,750 fraudulent wire transfer!</text>

