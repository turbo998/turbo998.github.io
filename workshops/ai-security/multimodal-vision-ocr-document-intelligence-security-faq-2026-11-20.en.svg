  <text x="447" y="218" fill="#34d399" font-size="13" font-weight="700">① Document CDR Rasterization &amp; Layer Stripping</text>
  <text x="447" y="240" fill="#cbd5e1" font-size="12">Rasterize all inbound PDFs to 300 DPI flat bitmaps</text>
  <text x="447" y="258" fill="#cbd5e1" font-size="12">(stripping XMP, JS, and invisible OCR text layers)</text>
  <text x="447" y="278" fill="#6ee7b7" font-size="12" font-weight="700">so AI sees the exact same pixels as human reviewers!</text>

  <rect x="433" y="306" width="333" height="98" rx="8" fill="#0d242c" stroke="#047857" stroke-width="1"/>
  <text x="447" y="328" fill="#34d399" font-size="13" font-weight="700">② Decoupled Typed OCR Extraction &amp; Taint Gate</text>
  <text x="447" y="350" fill="#cbd5e1" font-size="12">Run Prompt Shields on both image &amp; OCR output;</text>
  <text x="447" y="368" fill="#cbd5e1" font-size="12">emit only typed scalar fields (amount, date, PO#)</text>
  <text x="447" y="388" fill="#6ee7b7" font-size="12" font-weight="700">marked `untrusted=True` (`untrusted-write` lock)!</text>

  <rect x="433" y="416" width="333" height="100" rx="8" fill="#0d242c" stroke="#047857" stroke-width="1"/>
  <text x="447" y="438" fill="#34d399" font-size="13" font-weight="700">③ 3-Way PO Match &amp; Pinned Vendor Bank Master</text>
  <text x="447" y="460" fill="#cbd5e1" font-size="12">`record-owner` isolates sealed reserve bids,</text>
  <text x="447" y="478" fill="#cbd5e1" font-size="12">`fixed-business-output` locks vendor bank master &amp;</text>
  <text x="447" y="498" fill="#6ee7b7" font-size="12" font-weight="700">`original-requester-payment` blocks $7,750 wire!</text>

