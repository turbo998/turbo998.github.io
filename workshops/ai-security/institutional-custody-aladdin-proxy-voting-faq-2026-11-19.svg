  <rect width="1200" height="760" fill="url(#bgGrad355)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad355)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 355 · 🏆 355-FAQ, BRK-720 &amp; 1,542-ASSERTION MILESTONE · GLOBAL CUSTODY (STATE STREET ALPHA / ALADDIN) &amp; PROXY VOTING</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">全球资产托管服务 (State Street Alpha/Aladdin)、股东代理投票与公司行动 AI 安全选型指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">主权/养老基金战略调仓 (TAA) 指令流物理气隙 + 代理投票 (Broadridge/ISS) 与融券召回硬锁 vs. 委托征集注入篡改选票与 MT564 公司行动电汇诈骗 (BRK-719 / BRK-720)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad355)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 全球资产托管与代理投票三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 代理权争夺征集函注入窃取主权基金调仓表 (BRK-719)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 激进对冲基金上传的 DEFC14A 董事会改选代理征集材料或</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  上市公司 ESG 补充通函 PDF 夹带间接提示词注入</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 诱导 Agent 跨库读取主权财富基金/养老金未公开季度调仓计划</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  (TAA Rebalancing Order Flow) 与并购表决底牌</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 篡改 Broadridge 股东大会选票与阻断融券召回 (BRK-719)</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令将机构治理准则 (ISS/Glass Lewis) 投向原管理层的</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  反对票翻转为支持野蛮人收购提案</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 在股权登记日 (Record Date) 前阻止借出股票召回 (Share Recall)</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：丧失百亿级持仓表决权与违反 ERISA 受托人信义义务</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造 SWIFT MT564 公司行动与次托管电汇诈骗 (BRK-720)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造新兴市场次托管行 (Sub-Custodian) 自愿要约收购 (Tender</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  Offer) 或预提税退税 (Tax Reclaim) 往来账户 (Nostro) 变更通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 收款账户并电汇 $5,200 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-size="11" font-weight="700">• 违规触发：托管客户分红/认购资金被盗与托管行全额赔付责任</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad355)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 全球资产托管与公司治理零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: DEFC14A 委托材料 / MT564 清洗与槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离股东通函与公司行动公告中的自由文本指令，仅提取 ISO</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  20022 (seev) 强类型槽位 (ISIN、会议代码、议案编号、除权日)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 主权基金战略调仓与表决底牌物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• Aladdin/Alpha 前台投资交易台的季度再平衡指令流 (Order Flow)</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  与投委会秘密并购投票决定存入物理气隙域 (restricted-budget)</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性代理投票政策引擎与融券自动召回硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 选票生成严格绑定基金自定义治理规则集；遇到重大并购/争议</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  议案由确定性代码在登记日前 T-5 自动触发借出股票召回</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断选票翻转与召回取消</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: SWIFT RMA 次托管往来账户只读锁与双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中 CSD/次托管行 Nostro 账户只读 (tool-</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  allowlist + fixed-business-output) + original-requester-payment</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad355)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流全球资产托管与公司行动安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性托管网关 + 调仓气隙 + 投票/召回硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-719/720 拦截率 100% | 满足 SEC Rule 206(4)-6 &amp; ERISA</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. State Street Alpha / Aladdin / Broadridge 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止 ESG 研究机器人在代理通函注入下篡改待提交选票建议</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备股权登记日融券召回窗口与 ISO 20022 Golden Copy 语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统托管运营团队手工比对多源 MT564 报文与阅读百页通函</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 股东大会季单周数千场表决，手工错选或漏召回赔偿动辄千万美元</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 355 · 355 篇 FAQ！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：选票翻转、调仓外泄与公司行动电汇 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取主权基金战略调仓流 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断翻转代理选票与取消融券召回 (business-result)</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向激进对冲基金外传调仓底牌</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定次托管 Nostro 库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,200 伪造要约认购电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 355 · 🏆 355 篇双语 FAQ、BRK-720 &amp; 1,542 项断言三大里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 前台调仓与后台托管长城隔离：前台 Aladdin 交易调仓流 (Order Flow) 与中后台公司行动/代理投票 Agent 物理气隙隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性融券召回与选票双签：重大争议股东大会在登记日前由确定性引擎强制召回借出证券，选票提交需尽责治理官 FIDO2 签批</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. Golden Copy 公司行动双源核验：MT564 要约收购指令必须通过 CSD (DTCC/Euroclear) 与彭博双源比对；锁定 trust-registry</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：738 个场景 (735 风险 + 3 基线) | 806 项 Pytest 检查 | 🏆 1,542 项断言 | 724 个交互向量 | 🏆 355 篇双语 FAQ (173 篇指南) | 🏆 BRK-719/720</text>
</svg>
