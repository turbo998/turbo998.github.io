  <text x="212" y="168" text-anchor="middle" fill="#fecaca" font-size="15" font-weight="800">🚨 1. AI 追踪日志泄漏与二次注入三大风险</text>

  <rect x="46" y="196" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="218" fill="#f87171" font-size="13" font-weight="700">① GenAI Trace 明文记录机密与 PII 外泄 (BRK-821)</text>
  <text x="60" y="240" fill="#cbd5e1" font-size="12">默认开启 `gen_ai.prompt` / `tool.arguments` 全量采集，</text>
  <text x="60" y="258" fill="#cbd5e1" font-size="12">将 OAuth Token、客户身份证号与高管薪资明文推向</text>
  <text x="60" y="278" fill="#fca5a5" font-size="12" font-weight="700">公有云 SaaS 观测后台，沦为全企业最大数据暗网！</text>

