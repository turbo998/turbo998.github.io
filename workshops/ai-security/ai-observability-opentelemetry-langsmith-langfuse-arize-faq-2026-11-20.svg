  <text x="447" y="350" fill="#cbd5e1" font-size="12">高敏场景强制 `OTEL_GENAI_CAPTURE_CONTENT=false`</text>
  <text x="447" y="368" fill="#cbd5e1" font-size="12">（仅采延迟/Token/状态码），或采用 Langfuse/Phoenix</text>
  <text x="447" y="388" fill="#6ee7b7" font-size="12" font-weight="700">VPC 私有化部署 + CMK 客户托管密钥加密存储！</text>

