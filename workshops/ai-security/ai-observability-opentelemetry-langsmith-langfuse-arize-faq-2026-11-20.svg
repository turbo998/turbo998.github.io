  <text x="447" y="240" fill="#cbd5e1" font-size="12">Span 离开应用 VPC 前必须经过本地 OTel Collector</text>
  <text x="447" y="258" fill="#cbd5e1" font-size="12">`redactionprocessor` + Presidio NER，自动剥离</text>
  <text x="447" y="278" fill="#6ee7b7" font-size="12" font-weight="700">Bearer Token、API Key 与 PII（或仅记 SHA-256 哈希）！</text>

