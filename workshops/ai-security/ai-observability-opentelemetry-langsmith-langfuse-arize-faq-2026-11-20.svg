  <text x="447" y="478" fill="#cbd5e1" font-size="12">`fixed-business-output` 锁死 OTLP 导出端点，</text>
  <text x="447" y="498" fill="#6ee7b7" font-size="12" font-weight="700">`original-requester-payment` 拦截 $7,600 电汇！</text>

