  <!-- Header Banner -->
  <rect x="28" y="20" width="1144" height="92" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="44" y="32" width="435" height="24" rx="12" fill="url(#goldGrad194)"/>
  <text x="261" y="49" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="800" fill="#090d16" text-anchor="middle">🔥 ROUND 194 · 194 篇双语 FAQ · 416 场景 · 898 断言 · 402 向量</text>
  <text x="492" y="49" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">1.5万吨级 6N 电子级羰基硫 (COS) 与 6N5 硫化氢 (H₂S) 半导体 3D NAND ACL 硬掩模刻蚀 / 2D MoS₂ 基地</text>
  <text x="44" y="77" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17.5" font-weight="800" fill="#f8fafc">防 COS 遇碱性氧化铝静默水解为 H₂S 触发高强钢瓶 SSC 脆裂、歧化生成 90°C 自燃 CS₂ 与 FeS 露空自燃 vs 能力网关</text>
  <text x="44" y="99" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">第一性原理：COS + H₂O (Al₂O₃) → H₂S↑ + CO₂↑ (HS⁻ 毒化氢复合触发 HRC&gt;22 钢瓶 SSC 脆爆) · 2COS (&gt;420°C) → CO₂ + CS₂ (90°C 自燃) · 4FeS + 7O₂ (-2450 kJ/kg)</text>

  <!-- Left Column: Red Team Attack & Physical Disaster -->
  <rect x="28" y="126" width="558" height="418" rx="12" fill="#18121e" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="44" y="140" width="526" height="34" rx="8" fill="url(#redGrad194)"/>
  <text x="307" y="162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800" fill="#fef2f2" text-anchor="middle">❌ 攻击路径与三大物理化学灾变机理 (Baseline ASR = 75.0%)</text>

  <rect x="44" y="186" width="526" height="106" rx="8" fill="#231420" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="207" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">1. COS 催化水解生成湿 H₂S 触发硫化物应力开裂 (SSC) 脆性炸瓶 (BRK-397)</text>
  <text x="58" y="228" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 外部 HG/T 5816 化验单注入诱导以“蒸汽再生”名义向 COS 纯化塔注入湿碱性水蒸气</text>
  <text x="58" y="247" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• COS 瞬间水解为剧毒湿 H₂S + CO₂，HS⁻ 阻断原子氢复合迫使氢原子钻入钢材晶界</text>
  <text x="58" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#fda4af">• 令 HRC &gt; 22 高强钢瓶在正常压力下发生毫无征兆的 SSC 整体粉碎性脆裂大爆炸！</text>

  <rect x="44" y="302" width="526" height="108" rx="8" fill="#231420" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="323" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">2. &gt;420°C 歧化生成 90°C 自燃二硫化碳 (CS₂) &amp; 纳米 FeS 空气吹扫红热引爆</text>
  <text x="58" y="344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 化验单指令将反应器提温至 580°C：2COS → CO₂ + CS₂↑ 与 2COS → 2CO↑ + S₂↓</text>
  <text x="58" y="363" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 副产 IIC T6 极危 CS₂ (自燃点仅 90°C，最小点火能 0.009 mJ) 与致命一氧化碳 CO</text>
  <text x="58" y="382" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#fda4af">• 向沉积纳米 FeS 的滤器通压缩空气，&lt;3s 红热自燃 (-2450 kJ/kg) 直接引爆管网！</text>

  <rect x="44" y="420" width="526" height="108" rx="8" fill="#231420" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="441" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">3. HRC 38 高硬脆裂钢瓶与碱性氧化铝冒充 NACE 抗硫瓶与 3A 筛及 $4,990 盗刷 (BRK-398)</text>
  <text x="58" y="462" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 伪造急件账单诱导调用 update_trust 将 HRC 38 淬火钢瓶与碱性氧化铝厂写入 trust-registry</text>
  <text x="58" y="481" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 碱性氧化铝常温把 COS 水解成湿 H₂S，充入 HRC 38 钢瓶 4 小时内即发生 SSC 炸瓶！</text>
  <text x="58" y="500" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#fda4af">• 6N 级亚 ppm 脱 CS₂ 低温精馏与 3D NAND ACL 硬掩模刻蚀秘方经 send_message 外泄</text>

  <!-- Right Column: Blue Team SIL-3 + Capability Broker -->
  <rect x="614" y="126" width="558" height="418" rx="12" fill="#0d1f1d" stroke="#10b981" stroke-width="1.8"/>
  <rect x="630" y="140" width="526" height="34" rx="8" fill="url(#greenGrad194)"/>
  <text x="893" y="162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800" fill="#ecfdf5" text-anchor="middle">✅ 硬件 SIL-3 本安联锁 + 确定性零信任能力网关 (Hardened ASR = 0.0%)</text>

  <rect x="630" y="186" width="526" height="106" rx="8" fill="#0f2926" stroke="#059669" stroke-width="1"/>
  <text x="644" y="207" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">1. 0.3nm 孔径排阻中性 3A 分子筛 (H₂O ≤ 0.5 ppm) + NACE MR0175 (≤22 HRC) 气瓶</text>
  <text x="644" y="228" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 强制 0.30nm 孔径 3A 分子筛 (排阻 0.38nm COS，仅吸 0.265nm 水)，严禁碱性氧化铝</text>
  <text x="644" y="247" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 100% 采用 NACE MR0175 (硬度 ≤22 HRC) 电解抛光 316L VAR 抗硫气瓶免疫 SSC</text>
  <text x="644" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#a7f3d0">• Broker untrusted-write 0.0248ms 拦截外部化验单触发的任何注蒸汽与空气吹扫</text>

  <rect x="630" y="302" width="526" height="108" rx="8" fill="#0f2926" stroke="#059669" stroke-width="1"/>
  <text x="644" y="323" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">2. 合成炉 ≤385°C 机械硬锁防 CS₂ 歧化 + 100% 禁空气 KMnO₄ 湿法钝化 FeS</text>
  <text x="644" y="344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 合成炉机械限温 ≤385°C，在线红外/GC 监测 CS₂ ≤ 0.5 ppm 及 H₂S ≤ 0.5 ppm 硬切断</text>
  <text x="644" y="363" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 全车间按 Ex d IIC T6 Gb 最高防爆等级设计，彻底消除 &gt;70°C 裸露热表面</text>
  <text x="644" y="382" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#a7f3d0">• 物理切除压缩空气管，拆检滤器前强制纯氮吹扫 + KMnO₄ 液相温和氧化消除 FeS</text>

  <rect x="630" y="420" width="526" height="108" rx="8" fill="#0f2926" stroke="#059669" stroke-width="1"/>
  <text x="644" y="441" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">3. 气隙 6N 羰基硫/硫化氢金库 + NACE 气瓶 AVL 锁死 + 原发起人鉴权</text>
  <text x="644" y="462" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• record-owner + restricted-data-boundary 封死 6N COS 与 3D NAND ACL 秘方外泄</text>
  <text x="644" y="481" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• tool-allowlist + fixed-business-output 锁死 NACE 抗硫气瓶与 3A 分子筛 AVL</text>
  <text x="644" y="500" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#a7f3d0">• original-requester-payment 拦截外部账单诱导的 $4,990 电汇 (898/898 Pytest 全绿)</text>

  <!-- Bottom Benchmark Banner -->
  <rect x="28" y="558" width="1144" height="96" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="46" y="584" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800" fill="#7dd3fc">📊 确定性红蓝对抗 Benchmark 实测验证 (BRK-397 &amp; BRK-398 · 416 场景 · 898 断言 · 402 向量)</text>
  <text x="46" y="608" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 评估规模：416 个合成夹具场景 (413 攻击 + 3 良性基线) · 898 项 Pytest 确定性断言 100% 通过 · 402 大交互式演练向量 · 194 篇双语架构选型 FAQ</text>
  <text x="46" y="630" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6ee7b7">• 核心指标：合成夹具攻击成功率 (ASR) 75.0% → 0.0% · 误阻断率 (FPR) 0.0% · 纯内存 Broker.evaluate 延迟 P50 = 0.0248 ms / P95 = 0.0409 ms (Windows 11 ARM64)</text>
