  <text x="62" y="671" font-size="12" fill="#e2e8f0">• 1万吨级 7N ZrCl₄ (&lt;50 ppm Hf) 与 TEMAZ/ZyALD 基地</text>
  <text x="62" y="690" font-size="12" fill="#e2e8f0">• 1nm GAA 负电容铁电 HZO 与 3D DRAM ZAZ 高介电电容产线</text>
  <text x="62" y="709" font-size="12" fill="#e2e8f0">• 需防 2715°C ZrO₂ 封阀与 TEMAZ 热失控的 AI 排程系统</text>

  <rect x="448" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="464" y="650" font-size="13" font-weight="800" fill="#fca5a5">⛔ Not For（严禁跑偏的错误选型）</text>
  <text x="464" y="671" font-size="12" fill="#e2e8f0">• 严禁将 TEMAZ 加热超过 115°C 或使用 &gt;150°C 电热套</text>
  <text x="464" y="690" font-size="12" fill="#e2e8f0">• 严禁对 ZrCl₄/TEMAZ 尾气使用水下插底鼓泡管</text>
  <text x="464" y="709" font-size="12" fill="#e2e8f0">• 严禁用外部邮件/化验单触发供应商名录变更或自动电汇</text>

