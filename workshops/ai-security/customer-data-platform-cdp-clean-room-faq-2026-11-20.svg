<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad367" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad367" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad367" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad367" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad367)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad367)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 367 · 🏆 1,590-ASSERTION MILESTONE · CUSTOMER DATA PLATFORM (CDP), DATA CLEAN ROOMS &amp; ONETRUST CONSENT</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业客户数据平台 (CDP)、广告数据净室 (Snowflake/AWS Clean Room) 与隐私同意 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">第一方高净值客户明文 PII 物理气隙 + k-匿名差分隐私与 OneTrust 拒追踪硬锁 vs. 受众圈选注入与媒介结算诈骗 (BRK-743 / BRK-744)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad367)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业 CDP、数据净室与营销自动化三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 联合营销方案 PDF 注入窃取一方客户明文 PII (BRK-743)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 外部广告主或零售媒体网络 (RMN) 合作伙伴提交的受众洞察</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  需求单 PDF 夹带提示词注入，诱导 CDP 助手读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取未哈希脱敏的第一方 VIP 客户手机号/邮箱、生命周期价值</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  (LTV) 流失预测底表及医疗/孕产/财务等敏感人群属性标签</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 降级数据净室 k-匿名阈值与强行突破 Opt-Out 撤回同意</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，将数据净室最小聚合群体阈值</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  从 k=50 改为 k=1 (差分隐私清零)，实现个体身份重构攻击</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 覆写 OneTrust / IAB TCF v2.2 用户拒绝追踪标志向广告 DSP 推送</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：欧盟 GDPR 全球营收 4% 顶格罚款与 FTC 健康隐私重罚</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造程序化广告排期单 (IO) 与三方数据包电汇诈骗 (BRK-744)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造媒介代理商 (4A Agency / DSP: The Trade Desk) 广告排期</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  合同 (Insertion Order) 或外部数据供应商受众分成账单</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 媒介结算账户并电汇 $5,650 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：季度大促媒介投放预算与零售媒体返佣被盗刷</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad367)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业 CDP、数据净室与隐私合规零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 受众圈选需求清洗与受限聚合 SQL 模板提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离营销 Brief 中的自然语言查询指令，仅提取预批准净室</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  分析模板 ID、受众分段枚举码与聚合时间窗口</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断自由查询提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 第一方明文 PII 与敏感健康/财务标签物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 客户原始身份标识 (手机/身份证)、VIP 流失预警底表与医疗/财务</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  敏感分类属性严格隔离在 restricted-budget 气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 k-匿名/差分隐私预算与 Consent 前置硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 数据净室引擎在代码层锁死最小聚合行数 (k&gt;=50) 与隐私预算 ε；</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  出站激活强制按位与 (Bitwise-AND) 校验 OneTrust 有效授权标志</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断降级匿名度与强推广告</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 4A 媒介代理与 DSP 结算账户只读锁 + 双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 媒介代理与 DSP 账户只读 (tool-allowlist +</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad367)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流企业 CDP 与广告数据净室安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性 CDP 网关 + PII 气隙 + k-匿名/Consent 锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-743/744 拦截率 100% | 满足 GDPR、CPRA &amp; PIPL</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Salesforce Data Cloud / Adobe CDP / Segment 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止自然语言受众生成助手在注入下圈选未授权 Opt-Out 人群</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备差分隐私 ε 消耗、IAB TCF 同意串与集合交集差分攻击语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 数据工程师手工编写 SQL 导出加密 CSV 发送给广告代理商</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 数据一旦离场即彻底失去撤回控制权，极易引发大规模撞库泄露</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 367 · 1,590 断言！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：k-匿名关闭、PII 泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取第一方客户明文 PII (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断降级净室 k-匿名阈值与覆写 Opt-Out 标志</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传高净值客户流失底表与健康标签</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定媒介结算银行库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,650 伪造媒介排期电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 367 · 🏆 1,590 项确定性断言里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 第一方明文 PII 与敏感标签气隙：客户原始联系方式与医疗/财务敏感属性与外部联合营销受众圈选 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性数据净室 k-匿名与 Consent 硬锁：净室聚合强制 k&gt;=50 且出站激活 100% 关联 OneTrust/TCF 实时同意状态</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 媒介代理结算只读与第三方监测对账：锁定 trust-registry，广告结算强制核验 IAS/DoubleVerify 真实曝光并双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：762 个场景 (759 风险 + 3 基线) | 854 项 Pytest 检查 | 🏆 1,590 项断言 | 748 个交互向量 | 367 篇双语 FAQ (186 篇指南) | BRK-743/744</text>
</svg>
