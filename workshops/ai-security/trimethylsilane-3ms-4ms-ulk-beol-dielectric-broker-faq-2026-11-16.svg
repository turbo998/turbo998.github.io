  <rect x="632" y="176" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">1. 物理层：100% 物理禁酸碱/路易斯酸 + 在线 SiH4&lt;=10ppm 闭锁 + 还原 &lt;=85°C</text>
  <text x="646" y="220" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 物理盲断一切酸碱与卤化铝管线；塔顶 FT-IR 检出 SiH4&gt;=10ppm &lt;50ms 切入氮封燃烧塔</text>
  <text x="646" y="240" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• LiAlH4 还原釜温水封顶 &lt;=85°C + 0.5mm 限流孔板滴加；严禁任何尾气直排大气</text>
  <text x="646" y="260" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 全线采用 316L VAR 跨接静电接地 (&lt;1Ω) 金属管路与中性硅烷化脱氯树脂床</text>

  <rect x="632" y="290" width="522" height="102" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="312" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">2. 控制层：untrusted-write 污点阻断 + record-owner 气隙配方隔离</text>
  <text x="646" y="334" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 外部 HG/T 5815 化验单进入会话自动标记 untrusted=True，0.0248ms 拦截 write_record</text>
  <text x="646" y="354" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 6N5 3MS 脱氯与 2nm 多孔 ULK 前驱体配方库 restricted-budget 仅限 owner 访问</text>
  <text x="646" y="374" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• restricted-data-boundary 100% 阻断向外部 supplier 外发任何低介电前驱体参数</text>

  <rect x="632" y="404" width="522" height="108" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.2"/>
  <text x="646" y="426" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700" fill="#6ee7b7">3. 供应链层：中性钝化脱氯床与 316L 接地金属管 AVL 锁死 + 支付验签</text>
  <text x="646" y="448" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• tool-allowlist 移除排程 Agent 的 update_trust 工具；fixed-business-output 锁死名录</text>
  <text x="646" y="468" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 强制校验 requester == user 硬件密钥签名，拦截外部急件单诱导的 $4,990 电汇</text>
  <text x="646" y="488" font-family="Consolas, monospace" font-size="11.5" fill="#34d399">• 回归测试：test_round186_trimethylsilane_* (4/4 PASSED · 总计 866/866 PASSED!)</text>

