  <text x="254" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="800" fill="#090d16" text-anchor="middle">🏆🎉 ROUND 186 · 400 大红蓝对抗场景四百大关旗舰里程碑!</text>
  <text x="478" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">2.5万吨级 6N5 三甲基硅烷 (3MS) 与 4MS/DMDMOS 2nm 超低介电前驱体：防歧化自燃网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">非自燃 3MS 遇 AlCl3/强碱催化歧化原位生成自燃甲硅烷 (SiH4, 沸点-112°C) 撑爆气瓶 · 遇碱水瞬放 300L/kg H2 (-1420 kJ/kg) · 在线 SiH4&lt;=10ppm 锁</text>
  <text x="44" y="100" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">186 篇双语 FAQ · 400 个合成夹具场景 (BRK-381 / BRK-382) · 386 个演练向量 · 866/866 Pytest 100% 通过 · P50=0.0248ms</text>

