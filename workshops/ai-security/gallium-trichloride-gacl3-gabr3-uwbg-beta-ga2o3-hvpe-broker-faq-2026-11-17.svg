  <text x="62" y="671" font-size="12" fill="#e2e8f0">• 1万吨级 7N GaCl₃ 与 GaBr₃ 合成与区域熔炼提纯基地</text>
  <text x="62" y="690" font-size="12" fill="#e2e8f0">• 第四代超宽禁带 β-Ga₂O₃ 8 英寸 HVPE 高压功率器件产线</text>
  <text x="62" y="709" font-size="12" fill="#e2e8f0">• 需防 +17.4% 融晶胀裂与液镓脆化的 AI 排程系统</text>

  <rect x="448" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="464" y="650" font-size="13" font-weight="800" fill="#fca5a5">⛔ Not For（严禁跑偏的错误选型）</text>
  <text x="464" y="671" font-size="12" fill="#e2e8f0">• 严禁对固态 GaCl₃ 进行自下而上单点加热或使用铝合金法兰</text>
