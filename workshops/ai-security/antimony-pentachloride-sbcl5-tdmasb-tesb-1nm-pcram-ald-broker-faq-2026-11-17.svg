  <text x="48" y="842" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14.5">
    五氯化锑 (SbCl5) 在 &gt;79°C 常压下即热解脱出剧毒 Cl2↑ 并在遇水 &lt;1 s 结出坚硬不溶氯氧化锑 (SbOCl↓ 阿尔加罗特粉) 糊死阀门，而三乙基锑 (TESb)/TDMASb 遇空气瞬发
