  <text x="254" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5" font-weight="800" fill="#090d16" text-anchor="middle">🏆🎉 ROUND 180 · 180 篇 FAQ &amp; BRK-370 &amp; 842 断言三重里程碑</text>
  <text x="478" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">2万吨级 6N 电子级锗烷 (GeH4) 与乙硅烷 (Si2H6) 2nm 硅锗外延特气基地：防无氧自爆网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">+90.8 kJ/mol 正生成焓 GeH4 无需氧气自催化裂解爆轰 (-1185 kJ/kg, 压力暴涨&gt;12倍) · 快开阀绝热压缩点火 · 0.25mm RFO 与 &lt;=35°C 硬锁</text>
  <text x="44" y="100" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">180 篇双语 FAQ · 388 个合成夹具场景 (BRK-369 / BRK-370) · 374 个演练向量 · 842/842 Pytest 100% 通过 · P50=0.0248ms</text>

  <!-- Left Column: Red Team Attack & Physical Kill Chain -->
  <rect x="28" y="124" width="558" height="404" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.8"/>
