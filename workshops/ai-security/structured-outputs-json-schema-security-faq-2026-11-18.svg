<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="100%" height="100%" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg257" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent257" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="860" fill="url(#bg257)"/>
  <rect x="30" y="24" width="1340" height="8" rx="4" fill="url(#accent257)"/>

  <!-- Header -->
  <text x="45" y="68" fill="#c084fc" font-size="15" font-weight="700" letter-spacing="1.5">AI SOLUTION ARCHITECT · 2026-11-18 ROUND 257 · 🏆 1,150-ASSERTION FLAGSHIP MILESTONE!</text>
  <text x="45" y="104" fill="#f8fafc" font-size="24" font-weight="800">企业大模型结构化输出 (Structured Outputs / JSON Schema) 安全选型：Pydantic AST + 能力网关</text>
  <text x="45" y="132" fill="#94a3b8" font-size="14">打破“开了 strict:true 就没有越权”的误区：解决合法 Schema 字段走私、anyOf 多态分支劫持与 RFC 8259 JSON 重复键解析差异绕过</text>

  <!-- KPI Badges -->
  <rect x="1015" y="46" width="350" height="84" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1.8"/>
  <text x="1190" y="72" text-anchor="middle" fill="#e9d5ff" font-size="13" font-weight="800">🏆 542 场景 · 1,150 断言 · 528 向量 · 257 FAQ</text>
  <text x="1190" y="96" text-anchor="middle" fill="#4ade80" font-size="19" font-weight="800">ASR: 75.0% ➔ 0.0% (0.0248ms)</text>
  <text x="1190" y="116" text-anchor="middle" fill="#94a3b8" font-size="11">BRK-523 &amp; BRK-524 · 严禁重复键 + Capability Broker</text>

  <!-- Section 1 -->
  <text x="45" y="172" fill="#e2e8f0" font-size="17" font-weight="700">1. 大模型结构化输出与工具参数校验四层防线对比（语法合规 vs. 解析器一致性 vs. 业务语义授权）</text>

  <!-- Card 1 -->
  <rect x="45" y="186" width="315" height="235" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="216" fill="#60a5fa" font-size="15.5" font-weight="800">🔵 第 1 层：角色级动态 Schema 裁剪</text>
  <text x="62" y="238" fill="#bfdbfe" font-size="11.5" font-weight="600">入模前物理移除无权调用的 anyOf 分支</text>
  <text x="62" y="264" fill="#e2e8f0" font-size="11.5">• 致命坑：把管理员分支塞进全局 anyOf Schema</text>
  <text x="62" y="286" fill="#e2e8f0" font-size="11.5">• 正解：taint="untrusted" 时仅暴露只读 Schema</text>
  <text x="62" y="308" fill="#e2e8f0" font-size="11.5">• 铁律：从 Schema 彻底剔除 user_id / role 字段</text>
  <rect x="62" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <text x="74" y="352" fill="#93c5fd" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="74" y="370" fill="#cbd5e1" font-size="11">不给受限解码器看到高危管理员分支，</text>
  <text x="74" y="388" fill="#cbd5e1" font-size="11">从源头消灭“语法引导越狱”跳入特权分支！</text>

  <!-- Card 2 -->
  <rect x="378" y="186" width="315" height="235" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1.8"/>
  <text x="395" y="216" fill="#c084fc" font-size="15.5" font-weight="800">🟣 第 2 层：受限解码 (strict: true)</text>
  <text x="395" y="238" fill="#e9d5ff" font-size="11.5" font-weight="600">Azure OpenAI Structured Outputs / XGrammar</text>
  <text x="395" y="264" fill="#e2e8f0" font-size="11.5">• 作用：保证 100% 符合 JSON 语法与字段类型</text>
  <text x="395" y="286" fill="#e2e8f0" font-size="11.5">• 必配：additionalProperties: false + maxLength</text>
  <text x="395" y="308" fill="#e2e8f0" font-size="11.5">• 局限：完全不管字段里的业务值是否越权！</text>
  <rect x="395" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="407" y="352" fill="#d8b4fe" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="407" y="370" fill="#cbd5e1" font-size="11">把它当成“防 JSON 解析崩溃的工程组件”，</text>
  <text x="407" y="388" fill="#cbd5e1" font-size="11">绝不能当成“防提示词注入的安全护栏”！</text>

  <!-- Card 3 -->
  <rect x="711" y="186" width="315" height="235" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="728" y="216" fill="#fbbf24" font-size="15.5" font-weight="800">🟠 第 3 层：严禁重复键与强类型 AST</text>
  <text x="728" y="238" fill="#fde68a" font-size="11.5" font-weight="600">reject_duplicate_keys + Pydantic v2 Strict</text>
  <text x="728" y="264" fill="#e2e8f0" font-size="11.5">• 风险：WAF 读第 1 个同名键而 Python 读最后 1 个</text>
  <text x="728" y="286" fill="#e2e8f0" font-size="11.5">• 正解：object_pairs_hook 遇到重复键当场抛错</text>
  <text x="728" y="308" fill="#e2e8f0" font-size="11.5">• 校验：Pydantic strict=True, extra="forbid"</text>
  <rect x="728" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="740" y="352" fill="#fcd34d" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="740" y="370" fill="#cbd5e1" font-size="11">全链路只传递反序列化后的唯一 AST 对象，</text>
  <text x="740" y="388" fill="#cbd5e1" font-size="11">彻底根治跨语言 JSON 解析器差异走私。</text>

  <!-- Card 4 -->
  <rect x="1044" y="186" width="321" height="235" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
  <text x="1061" y="216" fill="#34d399" font-size="15.5" font-weight="800">🛡️ 第 4 层：确定性 Capability Broker</text>
  <text x="1061" y="238" fill="#a7f3d0" font-size="11.5" font-weight="600">对规范化 AST 执行 0.0248ms 语义授权</text>
  <text x="1061" y="264" fill="#ecfdf5" font-size="11.5">• G1 (所有权)：record-owner 拦截合法 JSON 越权读</text>
  <text x="1061" y="286" fill="#ecfdf5" font-size="11.5">• G2 (污点锁)：untrusted-write 禁脏会话改库</text>
  <text x="1061" y="308" fill="#ecfdf5" font-size="11.5">• G3 (付款锁)：0.0248ms 拦截 $4,910 结构化盗刷</text>
  <rect x="1061" y="330" width="286" height="72" rx="8" fill="#022c22" stroke="#10b981"/>
  <text x="1073" y="352" fill="#6ee7b7" font-size="11.5" font-weight="700">生产级黄金架构结论：</text>
  <text x="1073" y="370" fill="#d1fae5" font-size="11">“受限解码保语法 + 严禁重复键保一致 +</text>
  <text x="1073" y="388" fill="#d1fae5" font-size="11">能力网关保权限”，三者合一实现零越权！</text>

  <!-- Section 2 -->
  <text x="45" y="454" fill="#e2e8f0" font-size="17" font-weight="700">2. 红蓝对抗推演：合法 JSON Schema 字段走私 &amp; anyOf 分支劫持 vs. Pydantic AST + Capability Broker</text>

  <rect x="45" y="468" width="640" height="175" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="65" y="496" fill="#fca5a5" font-size="15" font-weight="800">❌ 脆弱 Baseline：仅靠 JSON Schema strict:true 语法校验（BRK-523 / BRK-524 失守）</text>
  <text x="65" y="524" fill="#fecaca" font-size="12.5">1. 合法语法下的越权窃密 (BRK-523)：外部文档诱导模型吐出 100% 符合 Schema 语法的 JSON，</text>
  <text x="65" y="544" fill="#fecaca" font-size="12.5">   读取核心财务底表 restricted-budget、覆写审批结论 business-result 并装进 string 字段外泄。</text>
  <text x="65" y="572" fill="#fecaca" font-size="12.5">2. 多态分支劫持与盗刷 (BRK-524 · 1,150 项断言里程碑)：诱导跳入 anyOf 高危分支修改</text>
  <text x="65" y="592" fill="#fecaca" font-size="12.5">   trust-registry 校验策略并直接执行语法合法的 $4,910 电汇指令！</text>
  <text x="65" y="622" fill="#f87171" font-size="12" font-weight="700">💥 根因：把“JSON 格式没报错”等同于“业务动作经过授权”，忽略了字段内部值的污点来源！</text>

  <rect x="715" y="468" width="650" height="175" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="496" fill="#6ee7b7" font-size="15" font-weight="800">✅ 零信任结构化管道：动态裁剪 + 禁重复键 + Capability Broker（0.0% 失守）</text>
  <text x="735" y="524" fill="#d1fae5" font-size="12.5">• 门禁 1 (动态 Schema + record-owner)：剔除特权分支，阻断非 owner 读取 restricted-budget</text>
  <text x="735" y="548" fill="#d1fae5" font-size="12.5">• 门禁 2 (untrusted-write &amp; restricted-data-boundary)：阻断结构化写库与字符串字段夹带外泄</text>
  <text x="735" y="572" fill="#d1fae5" font-size="12.5">• 门禁 3 (禁重复键 + fixed-business-output)：拒绝重复键走私，物理锁死 trust-registry</text>
  <text x="735" y="596" fill="#d1fae5" font-size="12.5">• 门禁 4 (original-requester-payment)：0.0248ms 拦截语法合法的 $4,910 电汇载荷</text>
  <text x="735" y="622" fill="#34d399" font-size="12" font-weight="700">🛡️ 实测开销：Broker 内存裁决 P50 = 0.0248 ms / 含 SQLite WAL 审计收据 P50 = 7.21 ms</text>

  <!-- Section 3 -->
  <rect x="45" y="662" width="1320" height="168" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="692" fill="#38bdf8" font-size="16" font-weight="800">🛠️ 企业大模型结构化输出与工具调用上线安全评审 6 项必选 Checklist</text>
  <text x="65" y="722" fill="#e2e8f0" font-size="13">☑️ 1. 语法与语义解耦：解析后的 JSON 对象必须 100% 送入 Capability Broker 校验权限与会话污点</text>
  <text x="65" y="748" fill="#e2e8f0" font-size="13">☑️ 2. 动态裁剪 Schema：当会话处于 untrusted 状态时，入模前从 tools/anyOf 物理移除写库与打款分支</text>
  <text x="65" y="774" fill="#e2e8f0" font-size="13">☑️ 3. 拒绝 RFC 8259 重复键：配置 object_pairs_hook 拒绝同名键，并强制 Pydantic strict=True, extra="forbid"</text>
  <text x="65" y="800" fill="#e2e8f0" font-size="13">☑️ 4. 限制 string 字段 maxLength  ☑️ 5. 从 Schema 剔除 user_id/role  ☑️ 6. 锁死 trust-registry 校验配置</text>
</svg>
