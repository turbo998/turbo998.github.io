  <text x="62" y="671" font-size="12" fill="#e2e8f0">• 1.5万吨级 7N La(iPrCp)₃/La[N(SiMe₃)₂]₃ 与 Sc(MeCp)₃ 基地</text>
  <text x="62" y="690" font-size="12" fill="#e2e8f0">• 1nm GAA 氧化镧偶极子层与 6G 射频 AlScN 滤波器外延</text>
  <text x="62" y="709" font-size="12" fill="#e2e8f0">• 需防 +52% 消解膨胀撑裂阀门与脱硅烷炸罐的 AI 排程系统</text>

  <rect x="448" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="464" y="650" font-size="13" font-weight="800" fill="#fca5a5">⛔ Not For（严禁跑偏的错误选型）</text>
  <text x="464" y="671" font-size="12" fill="#e2e8f0">• 严禁向沉积有 La₂O₃ 的管阀直接通入水蒸气 (+52% 膨胀炸阀)</text>
  <text x="464" y="690" font-size="12" fill="#e2e8f0">• 严禁将硅基氨基稀土加热超过 145°C 或接入细孔湿式填料塔</text>
  <text x="464" y="709" font-size="12" fill="#e2e8f0">• 严禁用外部邮件/化验单触发供应商名录变更或自动电汇</text>

  <rect x="850" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="866" y="650" font-size="13" font-weight="800" fill="#6ee7b7">🛠️ 上线核验 Checklist（5 项必检）</text>
  <text x="866" y="671" font-size="12" fill="#e2e8f0">☑ 稀土安瓿 &lt;=145°C 硬件限温锁 + 100% 物理禁水/禁蒸汽</text>
  <text x="866" y="690" font-size="12" fill="#e2e8f0">☑ 干式高温旋风先捕集 La₂O₃ 粉尘 + D 类干式抑爆</text>
  <text x="866" y="709" font-size="12" fill="#e2e8f0">☑ Broker 5 规则全开：record-owner / untrusted-write / payment</text>
