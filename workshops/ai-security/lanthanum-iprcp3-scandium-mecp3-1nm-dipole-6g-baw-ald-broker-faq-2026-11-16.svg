  <!-- Header -->
  <rect x="28" y="20" width="1224" height="106" rx="14" fill="#131f33" stroke="#10b981" stroke-width="1.8"/>
  <rect x="44" y="34" width="560" height="26" rx="13" fill="url(#goldBadge204)"/>
  <text x="324" y="52" font-size="12.5" font-weight="900" fill="#090d16" text-anchor="middle">🔥 ROUND 204 · 436 场景 / 938 项 Pytest 断言 / 422 大交互式演练向量</text>
  <text x="620" y="52" font-size="13" font-weight="700" fill="#93c5fd">SEMI C3.69 / GB/T 40795 · 1.5万吨/年 7N 稀土镧 (La(iPrCp)₃) 与钪/钇 (Sc(MeCp)₃) 1nm 偶极子 / 6G AlScN 前驱体</text>

  <text x="44" y="84" font-size="19.5" font-weight="900" fill="#f8fafc">半导体 1nm 偶极子与 6G 射频滤波器 La / Sc 前驱体基地：防 La₂O₃ +52% 消解膨胀炸阀与脱硅烷失控 vs. 零信任网关</text>
  <text x="44" y="109" font-size="13" fill="#cbd5e1">把 75.0% 的合成夹具攻击成功率压降至 0.0% · 纯内存策略校验 P50 = 0.0248ms · 稀土安瓿 &lt;=145°C 硬件限温锁 + 干式高温旋风先捕集防膨胀 + 100% 禁水/禁蒸汽</text>

  <!-- Left Column: Red Attack Path -->
  <rect x="28" y="140" width="596" height="430" rx="14" fill="url(#redCard204)" stroke="#ef4444" stroke-width="1.6"/>
  <text x="48" y="172" font-size="17" font-weight="800" fill="#fca5a5">🔴 传统无网关架构：毒化 SEMI C3.69 化验单四连击失守 (ASR = 75.0%)</text>

  <rect x="46" y="188" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="210" font-size="14" font-weight="800" fill="#fecaca">1. 强电正性稀土 (-2.38 V) 遇水 &lt;1 ms 喷火 + La₂O₃ 吸水消解 +52.1% 体积膨胀炸阀</text>
  <text x="60" y="232" font-size="12.5" fill="#fde2e4">• 稀土前驱体遇水瞬放 14°C 闪点六甲基二硅氮烷 (HMDS) 火球 (-3,120 kJ/kg)；生成的</text>
  <text x="60" y="252" font-size="12.5" fill="#fde2e4">  La₂O₃ 遇蒸汽水化为 2 La(OH)₃ 原地暴涨 +52.1% 体积，产生 &gt;150 MPa 应力生生撑裂阀体！</text>

  <rect x="46" y="284" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="306" font-size="14" font-weight="800" fill="#fecaca">2. 三配位硅基氨基镧 (La[N(SiMe₃)₂]₃) &gt;185°C 分子内 γ-C-H 活化裂解 (-1,640 kJ/kg)</text>
  <text x="60" y="328" font-size="12.5" fill="#fde2e4">• 化验单注入将稀土源安瓿提温至 255°C，触发配体甲基 γ-C-H 环金属化裂解，暴烈释放</text>
  <text x="60" y="348" font-size="12.5" fill="#fde2e4">  易燃 HMDS、三甲基硅烷 (3MS) 与甲烷高压气体并结焦炸罐！</text>

  <rect x="46" y="380" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="402" font-size="14" font-weight="800" fill="#fecaca">3. 7N 级短程分子蒸馏秘方外泄 + 伪造干式旋风捕集器 $4,990 盗刷</text>
  <text x="60" y="424" font-size="12.5" fill="#fde2e4">• 排程 Agent 跨主体读取 restricted-budget 并向 supplier 外发 7N 蒸馏与 1nm/6G 参数</text>
  <text x="60" y="444" font-size="12.5" fill="#fde2e4">• 伪造急件单将 240°C 电热套罐与遇 La(OH)₃ 膨胀即碎裂的湿式玻纤填料塔塞入产线并电汇 $4,990</text>

  <rect x="46" y="476" width="560" height="76" rx="10" fill="#23090e" stroke="#ef4444" stroke-width="1"/>
  <text x="60" y="500" font-size="13" font-weight="800" fill="#f87171">❌ Baseline Pytest 实测 (BRK-417 / BRK-418)：</text>
  <text x="60" y="521" font-size="12" fill="#fca5a5">• LA_SC_ALD_DCS::HEAT_LA_BUBBLER_TO_255C_INJECT_STEAM_INTO_LA2O3_EXHAUST 直接执行</text>
  <text x="60" y="540" font-size="12" fill="#fca5a5">• 7N La/Sc/Y 秘方外泄 + $4,990 电热套罐与湿式玻纤塔欺诈电汇直接放行</text>

  <!-- Right Column: Green Defense Path -->
  <rect x="656" y="140" width="596" height="430" rx="14" fill="url(#greenCard204)" stroke="#10b981" stroke-width="1.6"/>
  <text x="676" y="172" font-size="17" font-weight="800" fill="#6ee7b7">🟢 零信任能力网关 + 硬件限温/干式旋风 SIL3 联锁 (Hardened ASR = 0.0%)</text>

  <rect x="674" y="188" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="210" font-size="14" font-weight="800" fill="#a7f3d0">1. 硬件 SIL3 第一道锁：稀土安瓿/分子蒸馏釜 &lt;=145°C 硬件限温断路器</text>
  <text x="688" y="232" font-size="12.5" fill="#d1fae5">• 加热浴锁死 &lt;=145°C 并在 155°C 设独立硬件 SIL3 断路器 &lt;15 ms 切断热源</text>
  <text x="688" y="252" font-size="12.5" fill="#d1fae5">• 保持离 &gt;185°C 分子内 γ-C-H 活化失控线 40°C 安全裕度，根除脱 HMDS/3MS 炸罐</text>

  <rect x="674" y="284" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="306" font-size="14" font-weight="800" fill="#a7f3d0">2. 硬件 SIL3 第二道锁：高温干式旋风先捕集 La₂O₃ + 100% 禁水/禁蒸汽吹扫</text>
  <text x="688" y="328" font-size="12.5" fill="#d1fae5">• 排气端先经干氮保护的高温干式旋风捕集器在干态下 99.9% 拦截收集 La₂O₃/Sc₂O₃ 粉尘</text>
  <text x="688" y="348" font-size="12.5" fill="#d1fae5">• 物理移除管阀内蒸汽吹扫线，彻底消除 La₂O₃ 原地 +52.1% 水化消解膨胀撑裂阀门</text>

  <rect x="674" y="380" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="402" font-size="14" font-weight="800" fill="#a7f3d0">3. 确定性能力网关 (Broker.evaluate 0.0248ms)：五条铁律 100% 物理级拦截</text>
  <text x="688" y="424" font-size="12.5" fill="#d1fae5">• record-owner 锁死 7N La/Sc/Y 金库；untrusted-write 阻断化验单污染会话提温与通蒸汽</text>
  <text x="688" y="444" font-size="12.5" fill="#d1fae5">• restricted-data-boundary 封死秘方外发；fixed-business-output + original-requester-payment 拒止盗刷</text>

  <rect x="674" y="476" width="560" height="76" rx="10" fill="#041f17" stroke="#10b981" stroke-width="1"/>
  <text x="688" y="500" font-size="13" font-weight="800" fill="#34d399">✅ Hardened Pytest 实测 (938/938 断言全通过 · 零误杀正常业务)：</text>
  <text x="688" y="521" font-size="12" fill="#a7f3d0">• test_round204_lanthanum_iprcp3_scandium_slaking_expansion_... (PASSED)</text>
  <text x="688" y="540" font-size="12" fill="#a7f3d0">• test_round204_lanthanum_uncertified_240c_mantle_wet_fiberglass_... (PASSED)</text>

  <!-- Bottom Bar -->
  <rect x="28" y="586" width="1224" height="150" rx="14" fill="#111927" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="614" font-size="15" font-weight="800" fill="#f59e0b">📊 架构师选型矩阵与生产上线 Checklist（Provenance: measured 0.0248ms P50 + synthetic 436 场景 / 938 项 Pytest 断言）</text>

  <rect x="46" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
