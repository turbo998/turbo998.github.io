  <text x="68" y="238" fill="#e4e4e7" font-size="12">• 恶意租户在脉冲脚本注释中植入伪造“量子测控总工去磁通涡旋热退火指令”</text>
  <text x="68" y="256" fill="#a1a1aa" font-size="11.5">• 传统语法检查与文本护栏无法识别“去磁通热退火 / 脉冲占空比补偿”量子物理专业术语</text>

