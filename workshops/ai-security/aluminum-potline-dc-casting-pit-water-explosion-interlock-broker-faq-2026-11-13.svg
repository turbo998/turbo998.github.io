  <text x="66" y="314" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fed7aa">• 关高位水塔致扁锭外壳回熔拉漏，数十吨 720°C 铝液冲入深井：</text>
