  <text x="46" y="608" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 评估规模：418 个合成夹具场景 (415 攻击 + 3 良性基线) · 902 项 Pytest 确定性断言 100% 通过 · 404 大交互式演练向量 · 195 篇双语架构选型 FAQ</text>
  <text x="46" y="630" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6ee7b7">• 核心指标：合成夹具攻击成功率 (ASR) 75.0% → 0.0% · 误阻断率 (FPR) 0.0% · 纯内存 Broker.evaluate 延迟 P50 = 0.0248 ms / P95 = 0.0409 ms (Windows 11 ARM64)</text>
