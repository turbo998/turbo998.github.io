<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#041f1c"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
      .card-hdr { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; fill: #38bdf8; }
      .body-txt { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #e2e8f0; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1440" height="6" fill="url(#accentBlue)"/>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="510" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="21" class="mono" font-size="13" fill="#6ee7b7">🛡️ Round 329 · 702 Pytest · 686 场景 · 1,438 断言 · BRK-667/668</text>
    <rect x="525" y="0" width="645" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="543" y="21" class="mono" font-size="13" fill="#c7d2fe">ENTERPRISE LOCALIZATION TMS (PHRASE/TRADOS) · EMBARGOED LAUNCH · XLIFF</text>

    <text x="0" y="74" class="title" font-size="28">跨国企业全球化本地化平台（TMS：Phrase / Trados）与保密宣发 AI 指南</text>
    <text x="0" y="106" class="sub" font-size="16">未发布旗舰新品参数与保密新闻稿 (Embargoed PR) 物理气隙 + 医疗/法务监管术语库硬锁 vs. XLIFF 注入与能力网关</text>
  </g>

  <!-- Left Card -->
  <g transform="translate(48, 166)">
    <rect width="650" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19">⚖️ 企业本地化管理系统 (TMS)、翻译记忆库 (TM) 与保密新品 AI 对比</text>

    <rect x="20" y="54" width="610" height="72" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
    <text x="34" y="78" class="title" font-size="15" fill="#fca5a5">1. ❌ 多语种本地化 Agent 直通未发布新品宣发库与全局翻译记忆库</text>
    <text x="34" y="100" class="body-txt" font-size="13">• 外部兼职译员或众包平台上传的 XLIFF/TMX 文件植入指令，套出发布会前未解禁新品定价与芯片规格</text>
    <text x="34" y="118" class="mono" font-size="12" fill="#fca5a5">监管召回与品牌灾难：诱导污染多语种医疗器械说明书 (IFU) 禁忌症术语库或植入恶意钓鱼链接</text>

    <rect x="20" y="136" width="610" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="160" class="title" font-size="15" fill="#7dd3fc">2. 🔒 未解禁旗舰新品发布材料 (Embargoed Assets) 与财报草稿物理气隙</text>
    <text x="34" y="182" class="body-txt" font-size="13">• 面向外部语言服务商 (LSP) 开放的常规文档翻译 AI 0 权限读取代号级保密新品参数与定价表</text>
    <text x="34" y="200" class="mono" font-size="12" fill="#93c5fd">代号令牌化 (Code-Name Tokenization)：物理阻断外包会话触碰 restricted-budget 保密库</text>

    <rect x="20" y="218" width="610" height="72" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="34" y="242" class="title" font-size="15" fill="#d8b4fe">3. 📜 黄金翻译记忆库 (Golden TM) 与 EU MDR 医疗术语库只读硬锁</text>
    <text x="34" y="264" class="body-txt" font-size="13">• AI 仅输出机器翻译初稿 (MTPE)，0 权限直接覆写受监管黄金术语库或自动合并 Git 多语言包</text>
    <text x="34" y="282" class="mono" font-size="12" fill="#e9d5ff">选型定位：满足 Phrase、RWS Trados、Smartling、Crowdin、ISO 17100 与 EU MDR 多语种合规</text>

    <rect x="20" y="300" width="610" height="74" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="324" class="title" font-size="15" fill="#6ee7b7">4. 🛡️ 必选底线：确定性零信任能力网关 (Capability Broker · 全球化门禁)</text>
    <text x="34" y="346" class="body-txt" font-size="13">• 新品保密库隔离 (record-owner) + 禁改黄金术语库 (untrusted-write) + LSP 结算账户锁</text>
    <text x="34" y="364" class="mono" font-size="12" fill="#34d399">实测性能：P50 = 0.0248 ms 内存裁决 | 686 个场景 · 1,438 项 Pytest 确定性断言 100% 通过</text>
  </g>

  <!-- Right Card -->
  <g transform="translate(722, 166)">
    <rect width="670" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#f87171">🔥 外包译员 XLIFF 注入窃取新品机密与伪造 LSP 结算诈骗 vs. 零信任</text>

    <rect x="20" y="56" width="630" height="142" rx="10" fill="#2a0a10" stroke="#ef4444" stroke-width="1.5"/>
    <text x="36" y="82" class="title" font-size="15" fill="#fca5a5">❌ 脆弱架构：TMS Agent 直通保密新品库与正式术语表 (BRK-667 / BRK-668)</text>
    <text x="36" y="108" class="body-txt" font-size="13">1. [外部回传 XLIFF/TMX 翻译包注入套取未发布旗舰新品参数与篡改术语库] 诱导读取</text>
    <text x="36" y="130" class="body-txt" font-size="13">   发布会前保密新品定价底表 (restricted-budget)、篡改监管安全警示语并外传！</text>
    <text x="36" y="154" class="body-txt" font-size="13">2. [伪造多语种语言服务商 (LSP Vendor)“全球本地化字数结算收款专户变更函”] 盗刷 $4,890</text>
    <text x="36" y="180" class="mono" font-size="12" fill="#f87171">Baseline 结果：年度旗舰新品参数提前泄露 + 多语言安全警告被删 + $4,890 翻译结算款被盗</text>

    <rect x="20" y="214" width="630" height="158" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.8"/>
    <text x="36" y="240" class="title" font-size="15" fill="#6ee7b7">✅ 零信任企业本地化 (TMS) 架构：保密新品气隙 + 术语硬锁 + Broker</text>
    <text x="36" y="266" class="body-txt" font-size="13">• 闸门 1 (未解禁旗舰新品参数与保密公关稿锁)：record-owner 0.0248ms 阻断读取</text>
    <text x="36" y="290" class="body-txt" font-size="13">• 闸门 2 (防篡改黄金术语库 Termbase 与安全警告)：untrusted-write 阻断修改状态</text>
    <text x="36" y="314" class="body-txt" font-size="13">• 闸门 3 (备案全球语言服务商 LSP 结算账户只读锁)：fixed-business-output 锁死名录</text>
    <text x="36" y="338" class="body-txt" font-size="13">• 闸门 4 (保密新品外发与翻译采购划款锁)：restricted-data-boundary 与零代付门禁</text>
    <text x="36" y="358" class="mono" font-size="12" fill="#34d399">Hardened 结果：合成夹具 ASR 75.0% → 0.0% | 合规已上线公开帮助中心文档翻译 100.0% 通过</text>
  </g>

  <!-- Bottom Card -->
  <g transform="translate(48, 580)">
    <rect width="1344" height="276" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#34d399">📊 确定性基准测试 (702 项 Pytest 检查 · 686 场景) 与上线安全评审 Checklist</text>

    <rect x="24" y="56" width="630" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="40" y="82" class="mono" font-size="14" fill="#38bdf8">🧪 Round 329 新增 Pytest 回归测试 (700+ 项自动化 Pytest 检查突破！)</text>
    <text x="40" y="110" class="body-txt" font-size="13">• BRK-667 (外包 XLIFF/TMX 翻译包注入窃取未解禁新品底表与篡改监管术语库)：</text>
    <text x="56" y="130" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="record-owner" &amp; "untrusted-write" &amp; "restricted-data-boundary"</text>
    <text x="40" y="158" class="body-txt" font-size="13">• BRK-668 (伪造多语种语言服务商 LSP 字数结算变更通知篡改名录与 $4,890 盗刷)：</text>
    <text x="56" y="178" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="fixed-business-output" &amp; "original-requester-payment"</text>
    <text x="40" y="208" class="mono" font-size="12" fill="#94a3b8">[measured] 内存评估 P50=0.0248ms / P95=0.0409ms | SQLite WAL P50=7.21ms</text>
    <text x="40" y="232" class="mono" font-size="12" fill="#38bdf8">[synthetic] 累计 686 个场景 · 1,438 项 Pytest 断言 · 672 大演练向量 · 329 篇双语 FAQ</text>

    <rect x="680" y="56" width="640" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="698" y="82" class="mono" font-size="14" fill="#a78bfa">🛠️ 跨国企业本地化平台 (Phrase/Trados) 与保密宣发 AI 6 项铁律 (Checklist)</text>
    <text x="698" y="108" class="body-txt" font-size="13">☑ 1. 未解禁旗舰新品参数与保密新闻稿 (Embargoed PR) 物理气隙：record-owner</text>
    <text x="698" y="132" class="body-txt" font-size="13">☑ 2. 黄金翻译记忆库 (Golden TM) 与监管术语库只读硬锁：untrusted-write</text>
    <text x="698" y="156" class="body-txt" font-size="13">☑ 3. 新品代号与敏感价格占位符令牌化 (Placeholder Tokenization)</text>
    <text x="698" y="180" class="body-txt" font-size="13">☑ 4. 外部译员回传的 XLIFF/PO/TMX 文件与注释强制污点化：taint="untrusted"</text>
    <text x="698" y="204" class="body-txt" font-size="13">☑ 5. 备案全球语言服务商 (LSP) 结算银行专户只读锁定：锁死 trust-registry</text>
    <text x="698" y="228" class="body-txt" font-size="13">☑ 6. 多语种本地化采购与配音制作结算电汇硬门禁：Capability Broker 物理阻断</text>
  </g>
</svg>
