  <rect x="408" y="106" width="384" height="476" rx="12" fill="#0F1E2E" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="428" y="136" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ Deterministic Secrets &amp; Vault Broker (Hardened)</text>

