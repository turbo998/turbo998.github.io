  <text x="42" y="47" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Round 382 · Secrets Management (HashiCorp Vault / Key Vault / Conjur) &amp; Dynamic Leases AI Security Guide</text>
  <text x="42" y="73" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">BRK-773 &amp; BRK-774 · 🏆 1,650-Assertion Milestone · Unseal Shard Air-Gap + OIDC Namespace Pinning &amp; Short-TTL Lease Lock</text>

  <!-- Left Column -->
  <rect x="24" y="106" width="368" height="476" rx="12" fill="#1A121C" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">⛔ Top 3 Secrets Vault &amp; GitOps Attack Chains</text>

  <rect x="38" y="152" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Unseal Custodian &amp; Static Root Secret Leak (BRK-773)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Prompt injection in K8s ExternalSecret CR or rotation ticket</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Reads restricted-budget Vault Shamir unseal custodian roster</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exfiltrates break-glass static DB root &amp; cloud AK/SK inventory</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Exposes master recovery map for the entire secrets vault</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Wildcard `secret/*` HCL &amp; Infinite TTL Lease (BRK-773)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Mutates business-result to grant path "secret/*" capabilities</text>
  <text x="50" y="362" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Binds ClusterSecretStore so dev pods pull prod DB secrets</text>
  <text x="50" y="382" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Mints non-expiring (TTL=0) orphan root tokens &amp; DB roles</text>
  <text x="50" y="404" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Cross-namespace secret harvesting &amp; persistent backdoor</text>

  <rect x="38" y="444" width="340" height="122" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="466" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Spoofed Vault Active-Client Quota Fraud (BRK-774)</text>
  <text x="50" y="488" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Forged HashiCorp/CyberArk active-client overage notice</text>
  <text x="50" y="508" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Attacks trust-registry to swap security vendor bank IBAN</text>
  <text x="50" y="528" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Tricks finance agent into wiring $6,400 seat true-up fee</text>
  <text x="50" y="550" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Direct financial loss via platform security licensing fraud</text>

