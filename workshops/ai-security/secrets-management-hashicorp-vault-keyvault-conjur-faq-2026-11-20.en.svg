  <text x="438" y="174" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 1: HCL/YAML AST Parsing &amp; Taint Tagging (untrusted=True)</text>
  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Strips free-text comments from Vault HCL &amp; ExternalSecret CRs</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Extracts typed slots (K8s Namespace, ServiceAccount, Lease TTL)</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Eliminates HCL/YAML comment injection into policy approval</text>

  <rect x="424" y="258" width="352" height="96" rx="8" fill="#162A3E" stroke="#10B981" stroke-width="1"/>
  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 2: Unseal Custodian &amp; Static Master Map Air-Gap</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Shamir unseal rosters &amp; static secret maps in restricted-budget</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• record-owner blocks read_record + restricted-data-boundary</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Zero exposure of vault recovery keys or break-glass maps</text>

  <rect x="424" y="364" width="352" height="100" rx="8" fill="#162A3E" stroke="#F59E0B" stroke-width="1"/>
  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 3: Same-Namespace OIDC Pinning &amp; Short-TTL Lock</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Enforces OIDC sub namespace == Vault path prefix &amp; no `*` root</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Caps dynamic credential Max_TTL ≤ 3600s &amp; blocks orphan tokens</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ untrusted-write blocks cross-namespace sync &amp; infinite leases</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
  <text x="438" y="496" fill="#FDA4AF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 4: Immutable Vault Vendor Registry &amp; Payment Lock</text>
  <text x="438" y="518" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• tool-allowlist blocks update_trust + fixed-business-output</text>
  <text x="438" y="538" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• original-requester-payment blocks $6,400 client true-up wire</text>
  <text x="438" y="556" fill="#FB7185" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Requires Platform Security Lead + Controller FIDO2 sign-off</text>

