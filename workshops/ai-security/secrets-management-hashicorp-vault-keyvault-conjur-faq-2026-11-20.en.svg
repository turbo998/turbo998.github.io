  <text x="836" y="200" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">1. Deterministic Vault Broker + OIDC/TTL Lock (🏆)</text>
  <text x="836" y="218" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   100% block on BRK-773/774 | +0.025ms | Zero cross-NS leak</text>
  <text x="836" y="240" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Native Vault / Key Vault / Conjur RBAC</text>
