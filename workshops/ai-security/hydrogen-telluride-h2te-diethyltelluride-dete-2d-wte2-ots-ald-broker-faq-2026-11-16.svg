<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg201" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111c2d"/>
      <stop offset="100%" stop-color="#0b1520"/>
    </linearGradient>
    <linearGradient id="redCard201" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c1016"/>
      <stop offset="100%" stop-color="#19080c"/>
    </linearGradient>
    <linearGradient id="greenCard201" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#092920"/>
      <stop offset="100%" stop-color="#061914"/>
    </linearGradient>
    <linearGradient id="goldBadge201" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
