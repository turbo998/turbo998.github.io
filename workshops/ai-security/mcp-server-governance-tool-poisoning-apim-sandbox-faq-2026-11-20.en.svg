  <text x="42" y="47" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Round 393 · Enterprise MCP Governance, Anti-Tool-Poisoning &amp; MicroVM Sandboxing (APIM / Kata / ACA / E2B)</text>
  <text x="42" y="73" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13">BRK-795 &amp; BRK-796 · 🏆 Historic 800-Vector Milestone! · Per-Audience OBO Token Air-Gap + Schema Hash Pinning vs. Rug-Pulls</text>

  <!-- Left Column -->
  <rect x="24" y="106" width="368" height="476" rx="12" fill="#1A121C" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">⛔ Top 3 MCP Supply-Chain &amp; Sandbox Attack Chains</text>

  <rect x="38" y="152" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Tool Poisoning &amp; Cross-Server Token Theft (BRK-795)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Hidden prompt injection inside MCP `tools/list` JSON description</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Tricks host agent into reading restricted-budget `~/.ssh` keys</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Steals OAuth OBO refresh tokens belonging to sibling MCP servers</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Cross-MCP Shadowing compromises every connected enterprise tool</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Dynamic Schema Rug-Pull &amp; Host `npx` Escape (BRK-795)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Remote MCP server mutates tool schema post-approval (Rug-Pull)</text>
  <text x="50" y="362" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Mutates business-result to enable `autoApprove` host `npx/uvx`</text>
  <text x="50" y="382" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Hijacks built-in tool names (`git_commit`) via tool squatting</text>
  <text x="50" y="404" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Unisolated local stdio MCP executes arbitrary code on laptop</text>

  <rect x="38" y="444" width="340" height="122" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="466" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Spoofed MCP Marketplace &amp; Sandbox Wire Fraud (BRK-796)</text>
  <text x="50" y="488" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Forged commercial MCP connector API overage &amp; sandbox bill</text>
  <text x="50" y="508" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Attacks trust-registry to swap MCP vendor / E2B bank IBAN</text>
  <text x="50" y="528" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Tricks platform procurement agent into wiring $6,950 fee</text>
  <text x="50" y="550" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Diverts developer platform &amp; agentic infrastructure budgets</text>

  <!-- Center Column -->
  <rect x="408" y="106" width="384" height="476" rx="12" fill="#0F1E2E" stroke="#10B981" stroke-width="1.5"/>
  <text x="428" y="136" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">🛡️ Deterministic MCP Gateway &amp; MicroVM Broker (Hardened)</text>

  <rect x="424" y="152" width="352" height="96" rx="8" fill="#162A3E" stroke="#38BDF8" stroke-width="1"/>
  <text x="438" y="174" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 1: Schema Hash Pinning &amp; Description Sanitization</text>
  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Replaces third-party `description` strings with curated summaries</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Verifies `SHA256(tools/list) == Approved_Registry_Digest`</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Instant circuit-breaker trip on any remote Rug-Pull mutation</text>

  <rect x="424" y="258" width="352" height="96" rx="8" fill="#162A3E" stroke="#10B981" stroke-width="1"/>
  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 2: APIM Proxy &amp; Audience-Scoped OBO Token Air-Gap</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• APIM exchanges tokens per MCP audience; zero host credentials</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Sibling connector tokens isolated in restricted-budget</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Server A can never access or replay Server B's OAuth tokens</text>

  <rect x="424" y="364" width="352" height="100" rx="8" fill="#162A3E" stroke="#F59E0B" stroke-width="1"/>
  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 3: No Host `npx/uvx` &amp; Hypervisor MicroVM Sandbox Lock</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Prohibits unisolated local stdio MCP &amp; `autoApprove` overrides</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Enforces ACA Dynamic Sessions / Kata MicroVM + namespace prefix</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ untrusted-write blocks tool squatting &amp; host shell execution</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
  <text x="438" y="496" fill="#FDA4AF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 4: Immutable MCP Vendor &amp; Sandbox Registry Lock</text>
  <text x="438" y="518" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• tool-allowlist blocks update_trust + fixed-business-output</text>
  <text x="438" y="538" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• original-requester-payment blocks $6,950 connector quota wire</text>
  <text x="438" y="556" fill="#FB7185" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Requires Platform Architecture Lead + Controller FIDO2 sign-off</text>

