  <rect x="822" y="152" width="340" height="196" rx="8" fill="#172A36" stroke="#334155" stroke-width="1"/>
  <text x="836" y="176" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">5 MCP Governance &amp; Tool Sandbox Options Compared:</text>
  <text x="836" y="200" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">1. APIM MCP Gateway + Kata/ACA + Hash Lock (🏆)</text>
  <text x="836" y="218" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   100% block on BRK-795/796 | Immune to Tool Poisoning &amp; Rug-Pull</text>
  <text x="836" y="240" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Shared-Kernel Standard Docker Containers</text>
  <text x="836" y="258" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Lacks hypervisor isolation; vulnerable to kernel container escape</text>
  <text x="836" y="280" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Cloud LLM Guardrails (Prompt Shields / Bedrock)</text>
  <text x="836" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Scans user messages only; implicitly trusts `tools/list` schemas</text>
  <text x="836" y="320" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12">4. Direct Local Client `npx -y @untrusted/mcp-server`</text>
  <text x="836" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11">   Runs with developer's full OS &amp; `~/.ssh`/`~/.aws` access</text>

