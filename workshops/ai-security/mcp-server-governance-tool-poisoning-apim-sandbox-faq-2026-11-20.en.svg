  <text x="205" y="622" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Prohibit direct local stdio `npx` MCP execution; proxy all MCP servers via APIM, pin `tools/list` SHA-256 hashes &amp; isolate in Hypervisor MicroVMs!</text>
