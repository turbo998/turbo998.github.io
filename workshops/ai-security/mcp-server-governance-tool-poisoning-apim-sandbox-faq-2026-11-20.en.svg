  <text x="836" y="414" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Total Scenarios: <tspan fill="#6EE7B7" font-weight="700">814</tspan> (811 Risk + 3 Benign)</text>
  <text x="836" y="438" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Pytest Checks: <tspan fill="#6EE7B7" font-weight="700">958 Passed (100%)</tspan></text>
  <text x="836" y="462" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Deterministic Assertions: <tspan fill="#FBBF24" font-weight="700">1,694</tspan></text>
  <text x="836" y="486" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Playground Vectors: <tspan fill="#F472B6" font-weight="700">800</tspan> (🏆 Historic 800-Vector Milestone!)</text>
  <text x="836" y="510" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Bilingual FAQs: <tspan fill="#A78BFA" font-weight="700">393 (212 SA Guides)</tspan></text>
  <text x="836" y="538" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Added: BRK-795 (MCP tool poisoning/Rug-Pull) &amp; BRK-796 ($6,950 wire block)</text>

