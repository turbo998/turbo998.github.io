  <!-- Section 1 -->
  <text x="45" y="172" fill="#e2e8f0" font-size="17" font-weight="700">1. 企业 CI/CD 研发流水线 AI Agent 四大安全架构支柱对比</text>

  <!-- Card 1 -->
  <rect x="45" y="186" width="315" height="235" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="216" fill="#60a5fa" font-size="15.5" font-weight="800">🔵 GitHub Copilot Review + GHAS</text>
  <text x="62" y="238" fill="#bfdbfe" font-size="11.5" font-weight="600">原生托管只读沙盒 + Suggested Changes</text>
  <text x="62" y="264" fill="#e2e8f0" font-size="11.5">• 优势 1：原生零生产 Secrets 暴露，隔离 PR 代码</text>
  <text x="62" y="286" fill="#e2e8f0" font-size="11.5">• 优势 2：CodeQL + Copilot Autofix 自动生成补丁</text>
  <text x="62" y="308" fill="#e2e8f0" font-size="11.5">• 优势 3：补丁仅作为建议，必须人类点击合入</text>
  <rect x="62" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <text x="74" y="352" fill="#93c5fd" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="74" y="370" fill="#cbd5e1" font-size="11">代码审查与 SAST 漏洞修复首选原生平台，</text>
  <text x="74" y="388" fill="#cbd5e1" font-size="11">避免自建高权限 Action 脚本引入供应链漏洞。</text>

  <!-- Card 2 -->
  <rect x="378" y="186" width="315" height="235" rx="12" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
  <text x="395" y="216" fill="#fca5a5" font-size="15.5" font-weight="800">🛑 禁用 pull_request_target 跑 AI</text>
  <text x="395" y="238" fill="#fecaca" font-size="11.5" font-weight="600">强制两阶段读写分离 (Two-Stage Split)</text>
  <text x="395" y="264" fill="#fef2f2" font-size="11.5">• 致命坑：pull_request_target 挂载全量生产密钥</text>
  <text x="395" y="286" fill="#fef2f2" font-size="11.5">• 正解：在只读 pull_request 下运行 AI 审代码</text>
  <text x="395" y="308" fill="#fef2f2" font-size="11.5">• 权限：显式声明 permissions: contents: read</text>
  <rect x="395" y="330" width="280" height="72" rx="8" fill="#450a0a" stroke="#f87171"/>
  <text x="407" y="352" fill="#fca5a5" font-size="11.5" font-weight="700">架构师红线：</text>
  <text x="407" y="370" fill="#fecaca" font-size="11">任何读取外部 PR 代码/标题的 AI 步骤</text>
  <text x="407" y="388" fill="#fecaca" font-size="11">环境变量中必须 100% 零生产云凭据！</text>

  <!-- Card 3 -->
  <rect x="711" y="186" width="315" height="235" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1.8"/>
  <text x="728" y="216" fill="#c084fc" font-size="15.5" font-weight="800">🟣 OIDC Subject 细粒度钉扎</text>
  <text x="728" y="238" fill="#e9d5ff" font-size="11.5" font-weight="600">Entra ID / AWS IAM 绑定 environment:prod</text>
  <text x="728" y="264" fill="#e2e8f0" font-size="11.5">• 痛点：配置 repo:org/app:* 允许任意分支提权</text>
  <text x="728" y="286" fill="#e2e8f0" font-size="11.5">• 正解：生产角色锁死 environment:production</text>
  <text x="728" y="308" fill="#e2e8f0" font-size="11.5">• 门禁：绑定 GitHub Environment 人工审批人</text>
  <rect x="728" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="740" y="352" fill="#d8b4fe" font-size="11.5" font-weight="700">架构师选型建议：</text>
