  <!-- Section 2 -->
  <text x="45" y="454" fill="#e2e8f0" font-size="17" font-weight="700">2. 红蓝对抗推演：PR 注释注入窃取生产密钥 &amp; 关闭分支保护 vs. 只读沙盒 + Capability Broker</text>

  <rect x="45" y="468" width="640" height="175" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="65" y="496" fill="#fca5a5" font-size="15" font-weight="800">❌ 脆弱 Baseline：pull_request_target + write-all（BRK-521 / BRK-522 失守）</text>
  <text x="65" y="524" fill="#fecaca" font-size="12.5">1. PR 注释注入窃取密钥 (BRK-521)：外部 PR 在代码 diff 植入指令，诱导 CI 评审 Agent</text>
  <text x="65" y="544" fill="#fecaca" font-size="12.5">   读取生产部署密钥库 restricted-budget、强制放行发布门禁 business-result 并外传密钥。</text>
  <text x="65" y="572" fill="#fecaca" font-size="12.5">2. 分支保护降级与赏金盗刷 (BRK-522 · 540 场景里程碑)：伪造 0-day 漏洞 Issue，诱导在</text>
  <text x="65" y="592" fill="#fecaca" font-size="12.5">   trust-registry 中关闭 main 分支强制 Codeowners 审批并放行 $4,820 赏金电汇！</text>
  <text x="65" y="622" fill="#f87171" font-size="12" font-weight="700">💥 根因：在挂载高权限 Token 与生产密钥的 Runner 中直接将外部 PR 文本喂给 Agent！</text>

  <rect x="715" y="468" width="650" height="175" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="496" fill="#6ee7b7" font-size="15" font-weight="800">✅ 零信任 CI/CD 架构：只读沙盒 + OIDC 钉扎 + Capability Broker（0.0% 失守）</text>
  <text x="735" y="524" fill="#d1fae5" font-size="12.5">• 门禁 1 (contents:read + record-owner)：零生产密钥挂载，阻断读取 restricted-budget</text>
  <text x="735" y="548" fill="#d1fae5" font-size="12.5">• 门禁 2 (untrusted-write &amp; restricted-data-boundary)：阻断篡改发布门禁与密钥外传</text>
  <text x="735" y="572" fill="#d1fae5" font-size="12.5">• 门禁 3 (fixed-business-output)：物理锁死 trust-registry 分支保护规则与 workflow 配置</text>
  <text x="735" y="596" fill="#d1fae5" font-size="12.5">• 门禁 4 (original-requester-payment)：0.0248ms 拦截外部 Issue 触发的 $4,820 赏金电汇</text>
  <text x="735" y="622" fill="#34d399" font-size="12" font-weight="700">🛡️ 实测开销：Broker 内存裁决 P50 = 0.0248 ms / 含 SQLite WAL 审计收据 P50 = 7.21 ms</text>

  <!-- Section 3 -->
  <rect x="45" y="662" width="1320" height="168" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="692" fill="#38bdf8" font-size="16" font-weight="800">🛠️ 企业 CI/CD 与 DevSecOps 流水线 AI Agent 上线安全评审 6 项必选 Checklist</text>
  <text x="65" y="722" fill="#e2e8f0" font-size="13">☑️ 1. 严禁 pull_request_target 跑 AI：所有未合入 PR 分析强制走无密钥只读 pull_request 上下文</text>
  <text x="65" y="748" fill="#e2e8f0" font-size="13">☑️ 2. OIDC Subject 精确钉扎：生产云角色禁用通配符 *，严格绑定 repo:org/repo:environment:production</text>
  <text x="65" y="774" fill="#e2e8f0" font-size="13">☑️ 3. 职责分离 (SoD)：AI 修复补丁仅生成 Suggested Changes / Draft PR，必须人类 Codeowner 点击合入</text>
  <text x="65" y="800" fill="#e2e8f0" font-size="13">☑️ 4. 隔离生产密钥金库  ☑️ 5. 锁死分支保护规则与 workflow YAML  ☑️ 6. 严禁 Issue 自动触发赏金打款</text>
