  <text x="810" y="677" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="12">1. Stamp raw log sessions untrusted=True; block SOAR writes</text>
  <text x="810" y="697" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">2. Hardcode Tier-0 Self-DoS exemption; lock SIEM allowlist</text>
