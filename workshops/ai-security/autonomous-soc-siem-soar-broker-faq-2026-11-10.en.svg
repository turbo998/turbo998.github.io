  <text x="438" y="697" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Enforce Read-Only Triage + Crown-Jewel Ringfence + Broker</text>

  <rect x="794" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
