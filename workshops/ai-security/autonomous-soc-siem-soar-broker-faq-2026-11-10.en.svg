  <text x="653" y="326" fill="#f1f5f9" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Any session ingesting external WAF/EDR/DNS logs is stamped untrusted=True; direct SOAR write blocked</text>
  <text x="653" y="346" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Hardcoded Crown-Jewel ringfence exempts Tier-0 DCs/DBs/Gateways from automated quarantine (0 Self-DoS)</text>

