  <text x="653" y="422" fill="#f1f5f9" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• tool-allowlist + fixed-business-output lock trust-registry against runtime C2 IoC whitelisting</text>
  <text x="653" y="442" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">• original-requester-payment traces requester="supplier", blocking the $4,100 bounty wire in 0.0248ms</text>

