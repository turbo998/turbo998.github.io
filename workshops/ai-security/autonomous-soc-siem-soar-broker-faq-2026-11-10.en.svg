  <text x="52" y="152" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="15.5" font-weight="800">❌ Vulnerable: Coupled Log Triage &amp; Autonomous SOAR Containment (100% ASR)</text>

  <rect x="52" y="184" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="208" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">1. HTTP User-Agent / DNS Log-Poisoned Prompt Injection (Log Smuggling)</text>
  <text x="68" y="230" fill="#e4e4e7" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Attacker sends crafted HTTP User-Agent or DNS query; WAF/SIEM logs payload verbatim for forensics</text>
  <text x="68" y="250" fill="#9ca3af" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Autonomous SOC Agent ingests raw log lines and treats embedded text as an urgent SOAR directive</text>

  <rect x="52" y="280" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">2. Production Gateway Self-DoS Quarantine &amp; Unpatched 0-Day Exfiltration</text>
  <text x="68" y="326" fill="#e4e4e7" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Monolithic SOC Agent reads confidential unpatched 0-day ledger (restricted-budget)</text>
  <text x="68" y="346" fill="#9ca3af" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Executes SOAR IsolateHost on production payment gateway (business-result) and leaks 0-day inventory</text>

  <rect x="52" y="376" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="400" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700">3. Attacker C2 SIEM Whitelisting &amp; $4,100 Bug-Bounty Fraud</text>
  <text x="68" y="422" fill="#e4e4e7" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• External bug report claims 'Authorized Red-Team Scanner', attempting to add C2 to trust-registry</text>
  <text x="68" y="442" fill="#9ca3af" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Without originator lineage checks, security ops agent executes an unapproved $4,100 P1 bounty wire</text>

  <rect x="52" y="472" width="510" height="74" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
