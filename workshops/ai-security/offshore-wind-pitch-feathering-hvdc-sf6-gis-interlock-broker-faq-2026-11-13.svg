  <text x="446" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">第 1 层：轮毂独立顺桨链 &amp; GIS 气体门锁硬联锁</text>
  <text x="446" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 轮毂超级电容/蓄能器直驱：失电/超速 &gt;11.5rpm/高风速时</text>
  <text x="446" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">  不经主控软件，硬件安全链 8 秒内强制三桨顺桨至 90°</text>
  <text x="446" y="256" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• GIS 室门锁物理串联 SF6(&lt;1000ppm)+O2(&gt;19.5%)+HF(&lt;1ppm)</text>
  <text x="446" y="272" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">  超标即断开门锁供电并强启舱底负压排风机连续抽风 ≥15min</text>

  <rect x="434" y="292" width="332" height="114" rx="8" fill="#071324" stroke="#0284c7" stroke-width="1"/>
  <text x="446" y="314" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">第 2 层：Capability Broker 确定性拦截 (0.0248ms)</text>
  <text x="446" y="334" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• untrusted-write：外部浮标报文污染会话严禁改切出与门禁</text>
  <text x="446" y="352" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• record-owner：阻断测风解析链跨主体读 restricted-budget</text>
  <text x="446" y="370" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• restricted-data-boundary：封死海缆与 DAS 水声坐标外发</text>
  <text x="446" y="388" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• fixed-business-output + original-requester-payment</text>

  <rect x="434" y="418" width="332" height="98" rx="8" fill="#071324" stroke="#0369a1" stroke-width="1"/>
