  <text x="834" y="358" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 1. 拔除 PLC 光纤模拟失电，轮毂超级电容 8s 内 90° 顺桨</text>
  <text x="834" y="380" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 2. 舱底 SF6&gt;1000ppm 或 O2&lt;19.5% 物理断门锁并抽风 15m</text>
  <text x="834" y="402" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 3. 气隙海缆水声库隔离 (record-owner 零跨主体读取)</text>
  <text x="834" y="424" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 4. 外部 NMEA 0183 浮标报文自动标记 untrusted=True</text>
  <text x="834" y="446" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 5. DNV 海工认证名录只读锁定 + PAUT 超声探伤验真门禁</text>
  <text x="834" y="468" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 6. pytest -k round103 与 audit-publication 100% 通过</text>
  <text x="834" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#6ee7b7">Provenance: measured (0.0248ms) + synthetic (234 fixtures)</text>

