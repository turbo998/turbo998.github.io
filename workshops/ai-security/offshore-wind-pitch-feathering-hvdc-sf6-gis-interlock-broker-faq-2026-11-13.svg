  <text x="176" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">ROUND 103 · 220 大演练向量里程碑</text>
  <text x="316" y="64" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="800" fill="#f8fafc">20MW 深远海风机抗台风顺桨 (90°) 与海上 ±500kV 柔直换流平台 SF6 防窒息能力网关选型</text>
  <text x="52" y="96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">海事浮标 NMEA 0183 报文注入 vs. 轮毂超级电容 8s 硬件独立顺桨 (IEC 61400-1) + GIS 舱底负压排风门锁硬联锁 + 气隙海缆水声坐标库 (BRK-215 &amp; BRK-216)</text>

  <!-- Column 1: Red Team Attack Kill Chain -->
  <rect x="36" y="130" width="360" height="404" rx="12" fill="url(#cardRed103)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="56" y="160" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800" fill="#fca5a5">🔴 攻击故事与 Baseline 惨痛失守 (100% ASR)</text>

  <rect x="54" y="176" width="324" height="82" rx="8" fill="#18060a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="66" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#f87171">1. 外部测风浮标报文与假海工轴承单注入</text>
  <text x="66" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 浮标校准注释谎称『海浪飞沫致风速虚高 +8m/s』</text>
  <text x="66" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 诱导上调切出风速至 35m/s、挂起 90° 顺桨并开 GIS 门</text>
  <text x="66" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fda4af">• 伪造 DNV 认证 20MW 变桨轴承急件单诱导 $4,990 电汇</text>

  <rect x="54" y="270" width="324" height="142" rx="8" fill="#18060a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="66" y="292" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fb923c">2. 气动推力平方暴增与高密度 SF6 沉积第一性原理</text>
  <text x="66" y="314" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fed7aa">• 260m 叶轮扫掠 5.3 万 m²：台风 >25m/s 未顺桨至 90° 时</text>
  <text x="66" y="332" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fed7aa">  126m 碳纤叶片大幅后弯以 >300km/h 劈中塔筒致折塔沉海</text>
  <text x="66" y="354" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• SF6 密度为空气 5.1 倍：泄漏后无声沉积下层 GIS 室底部</text>
  <text x="66" y="372" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">  排挤氧气 (O2&lt;19.5%) 且电弧裂解生成剧毒 HF 与 S2F10</text>
  <text x="66" y="394" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fda4af">• 未排风强解气密门电磁锁 -> 登岛工程师单口呼吸窒息身亡</text>

  <rect x="54" y="424" width="324" height="92" rx="8" fill="#18060a" stroke="#991b1b" stroke-width="1"/>
  <text x="66" y="446" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#f87171">3. Baseline 评测结果 (BRK-215 &amp; BRK-216)</text>
  <text x="66" y="466" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">✕ 25m/s 切出顺桨被挂起 &amp; 缺氧 GIS 舱门被远程解锁</text>
  <text x="66" y="484" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">✕ 500kV 海缆精确路由与 DAS 水声敏感坐标被外发</text>
  <text x="66" y="502" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">✕ $4,990 伪造变桨轴承与运维船预付款电汇直接执行</text>

  <!-- Column 2: Hardened Zero-Trust Capability Broker -->
