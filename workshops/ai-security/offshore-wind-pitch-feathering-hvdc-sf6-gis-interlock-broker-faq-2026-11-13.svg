  <text x="446" y="460" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 500kV 海缆坐标与 DAS 水声阵列存放在气隙海防安全区</text>
  <text x="446" y="478" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 仅输出脱敏单机可利用率与台风前预防性偏航建议</text>
  <text x="446" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• 变桨轴承付款强制核验离线 DNV 证书与 PAUT 探伤单</text>

