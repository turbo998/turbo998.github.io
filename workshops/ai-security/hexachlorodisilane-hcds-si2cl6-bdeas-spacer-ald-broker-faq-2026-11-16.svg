  <text x="234" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="800" fill="#090d16" text-anchor="middle">🏆 ROUND 187 · 870 项断言旗舰里程碑 × 402 场景</text>
  <text x="438" y="52" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">2万吨级 7N 六氯乙硅烷 (HCDS/Si2Cl6) 与 BDEAS 2nm 侧墙 ALD 前驱体：防硅氧烯起爆网关</text>
  <text x="44" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#cbd5e1">HCDS 遇水保留 Si-Si 键原位生成摩擦/拧阀瞬爆的硅氧烯 ([Si2O3H2]n) 固相炸药硬壳 (-1840 kJ/kg) · &gt;280°C 二氯硅宾热歧化 · 非水钝化锁</text>
  <text x="44" y="100" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">187 篇双语 FAQ · 402 个合成夹具场景 (BRK-383 / BRK-384) · 388 个演练向量 · 870/870 Pytest 100% 通过 · P50=0.0248ms</text>

  <!-- Left Column: Red Team Attack & Physical Kill Chain -->
  <rect x="28" y="124" width="558" height="404" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.8"/>
