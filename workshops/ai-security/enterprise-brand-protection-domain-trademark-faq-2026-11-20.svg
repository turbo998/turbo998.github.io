<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad366" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad366" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad366" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad366" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad366)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad366)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 366 · 🏆 760-SCENARIO, 850-PYTEST &amp; 185-GUIDE MILESTONE · BRAND PROTECTION, DNS REGISTRAR &amp; TRADEMARK LICENSING</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业品牌保护与核心域名安全 (CSC/MarkMonitor)、商标授权许可与海关打假 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">未发布新品防御性域名库与神秘买手名单物理气隙 + 注册局锁 (Registry Lock/DNSSEC) 硬锁 vs. 侵权申诉注入劫持域名与回购诈骗 (BRK-741 / BRK-742)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad366)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业品牌保护、域名与商标授权三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 侵权反通知/UDRP 申诉注入窃取新品域名库 (BRK-741)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 钓鱼网站或假货卖家提交的 DMCA/商标侵权反通知 PDF 夹带</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  隐藏提示词，诱导品牌保护 Agent 跨权限读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取集团通过匿名壳公司提前抢注的未发布战略新品防御性域名</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  清单 (Stealth Defensive Domains) 与反窜货神秘买手暗访名单</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 解锁核心主域名 (Registry Lock) 与洗白钓鱼站点</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，解除核心主域名注册局物理锁</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  (EPP ServerTransferProhibited) 或篡改权威 NS / DNSSEC 记录</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 将高仿钓鱼域名加入“官方授权经销商白名单”并撤回海关扣货申请</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：全网企业主域名 BGP/DNS 被劫持与假货泛滥失控</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造抢注域名匿名回购托管与海关担保金诈骗 (BRK-742)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造域名经纪商 (CSC / Sedo / WIPO UDRP) 争议域名和解回购</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  托管单或海关知识产权扣留货物仓储销毁担保金通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 托管账户并电汇 $5,600 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：域名赎金被骗且对方拒不移交 EPP 转移密码 (Auth-Info)</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad366)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业品牌保护与核心域名零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 侵权反通知/WHOIS 清洗与结构化槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离申诉材料与网页源码中的隐藏提示词，仅提取强类型槽位</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  (Punnycode 域名、WIPO 商标注册号、ASN 号、海关备案号、授权书哈希)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断反通知提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 保密新品域名库与打假暗访底稿物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 未发布产品匿名防御域名资产包、反假货买手真实身份与商标保底</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  授权费率 (Minimum Guarantee) 严格隔离在 restricted-budget</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 注册局物理锁 (Registry Lock) 与品牌白名单硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 核心域名 NS/DNSSEC 变更与 EPP 解锁对 AI Agent 完全断联，</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  必须走 CSC/MarkMonitor 带外多指定人人工电话口令核身</text>
  <text x="434" y="458" y2="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断洗白钓鱼站与撤诉</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: WIPO/域名托管账户只读锁 + 交割后放款</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 域名托管行与海关专户只读 (tool-allowlist +</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad366)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流企业品牌保护与域名安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性品牌网关 + 新品域名气隙 + Registry Lock (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-741/742 拦截率 100% | 守护核心 DNS 与全球商标资产</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. CSC DBS / MarkMonitor / Corsearch 原生系统权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止打假巡检 Bot 在侵权反通知注入下将钓鱼站加入白名单</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 IDN 同形异义词、EPP 状态码与商标分类尼斯表语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统法务专员人工搜索电商平台假货与手工管理域名续费</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 钓鱼网站存活长达数天，核心证书/域名过期中断事故频发</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 366 · 760 场景！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：钓鱼站洗白、新品泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取保密新品域名库 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断洗白钓鱼域名与撤回海关真假鉴定扣货</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传神秘买手与新品商标底表</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定域名托管银行库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,600 伪造域名回购电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 366 · 🏆 760 个场景、850 项 Pytest &amp; 185 篇双语指南里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 保密新品域名与打假调查气隙：未官宣产品匿名抢注域名库与神秘买手身份与日常侵权巡检 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 核心域名 Registry Lock 与白名单硬锁：生产主域名锁定注册局物理锁，严禁 AI 修改权威 NS 或将外部域名加白</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 域名回购托管交割与双签门禁：锁定 trust-registry，仅在域名 WHOIS 所有权实际过户入库后经总法律顾问双签放款</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：🏆 760 个场景 (757 风险 + 3 基线) | 🏆 850 项 Pytest 检查 | 1,586 项断言 | 746 个交互向量 | 366 篇双语 FAQ (🏆 185 篇指南) | BRK-741/742</text>
</svg>
