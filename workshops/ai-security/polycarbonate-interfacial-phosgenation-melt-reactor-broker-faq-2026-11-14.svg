  <text x="66" y="484" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">✕ AR 光波导级芴基共聚 PC (BPEF) 与 ppb 级 TPPP 催化剂外泄</text>
  <text x="66" y="502" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">✕ $4,990 伪造易被湿光气盐酸腐蚀穿孔的混合器预付款放行</text>

