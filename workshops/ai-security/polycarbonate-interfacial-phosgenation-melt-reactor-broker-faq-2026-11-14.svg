  <text x="52" y="96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">双酚 A (ASTM D6142) 化验单注入 vs. 水相 2oo3 pH≤10.5 &lt;300ms 硬切光气双阀 + 290°C 笼式釜机械禁破空锁 (BRK-249 &amp; BRK-250)</text>

