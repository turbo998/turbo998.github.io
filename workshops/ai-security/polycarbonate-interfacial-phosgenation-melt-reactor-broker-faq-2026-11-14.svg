  <text x="446" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 水相 pH≤10.5 或 NaOH/COCl2&lt;2.2 (2oo3)：&lt;300ms 硬件切断</text>
