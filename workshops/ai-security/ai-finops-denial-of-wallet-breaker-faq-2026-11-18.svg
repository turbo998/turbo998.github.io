<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="100%" height="100%" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg248" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060c17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent248" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="860" fill="url(#bg248)"/>
  <rect x="30" y="24" width="1340" height="8" rx="4" fill="url(#accent248)"/>

  <!-- Header -->
  <text x="45" y="68" fill="#34d399" font-size="15" font-weight="700" letter-spacing="1.5">AI SOLUTION ARCHITECT · 2026-11-18 ROUND 248 · 🏆 510-PLAYGROUND-VECTOR FLAGSHIP MILESTONE!</text>
  <text x="45" y="104" fill="#f8fafc" font-size="24" font-weight="800">企业 AI 算力防刷与反“钱包耗尽攻击 (Anti-Denial-of-Wallet)”选型：PTU + PayGo 溢出 + Token 钳制 + 能力网关</text>
  <text x="45" y="132" fill="#94a3b8" font-size="14">解决大模型上线后三大烧钱黑洞：推理模型 (o3/R1) 32k 思维链海绵提示词攻击、多智能体死循环重试风暴与虚假算力充值账单诈骗</text>

  <!-- KPI Badges -->
  <rect x="1015" y="46" width="350" height="84" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="1190" y="72" text-anchor="middle" fill="#a7f3d0" font-size="13" font-weight="800">🏆 524 场景 · 1,114 断言 · 510 向量 · 248 FAQ</text>
  <text x="1190" y="96" text-anchor="middle" fill="#4ade80" font-size="19" font-weight="800">ASR: 75.0% ➔ 0.0% (0.0248ms)</text>
  <text x="1190" y="116" text-anchor="middle" fill="#94a3b8" font-size="11">BRK-505 &amp; BRK-506 · PTU/PayGo + Capability Broker</text>

  <!-- Section 1 -->
  <text x="45" y="172" fill="#e2e8f0" font-size="17" font-weight="700">1. 企业 AI 算力供给与四层反钱包耗尽 (Anti-DoW / AI FinOps) 架构选型对比</text>

  <!-- Card 1 -->
  <rect x="45" y="186" width="315" height="235" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="216" fill="#60a5fa" font-size="15.5" font-weight="800">🔵 支柱 A：PTU + PayGo + Batch 分级</text>
  <text x="62" y="238" fill="#bfdbfe" font-size="11.5" font-weight="600">Azure OpenAI 三级算力池物理隔离</text>
  <text x="62" y="264" fill="#e2e8f0" font-size="11.5">• 主力池 (PTU)：固定月费，免疫刷量引发天价账单</text>
  <text x="62" y="286" fill="#e2e8f0" font-size="11.5">• 溢出池 (PayGo)：带每日美元硬顶承接突发波峰</text>
  <text x="62" y="308" fill="#e2e8f0" font-size="11.5">• 离线池 (Batch API)：半价处理夜间批量总结任务</text>
  <rect x="62" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <text x="74" y="352" fill="#93c5fd" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="74" y="370" fill="#cbd5e1" font-size="11">严禁离线批处理任务混跑在实时 PTU 池，</text>
  <text x="74" y="388" fill="#cbd5e1" font-size="11">且 PayGo 溢出池必须设单日预算硬熔断！</text>

  <!-- Card 2 -->
  <rect x="378" y="186" width="315" height="235" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="395" y="216" fill="#fbbf24" font-size="15.5" font-weight="800">🟠 支柱 B：防 32k 推理海绵提示词</text>
  <text x="395" y="238" fill="#fde68a" font-size="11.5" font-weight="600">APIM &lt;llm-token-limit&gt; + 输出 Token 硬钳制</text>
  <text x="395" y="264" fill="#e2e8f0" font-size="11.5">• 风险：100 字悖论诱发 o3/R1 空转 32k CoT Token</text>
  <text x="395" y="286" fill="#e2e8f0" font-size="11.5">• 防线 1：废除 RPM，全面按 JWT 用户 TPM 限流</text>
  <text x="395" y="308" fill="#e2e8f0" font-size="11.5">• 防线 2：网关强制覆写 max_completion_tokens</text>
  <rect x="395" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="407" y="352" fill="#fcd34d" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="407" y="370" fill="#cbd5e1" font-size="11">默认走轻量模型，仅复杂问题路由至推理模型，</text>
  <text x="407" y="388" fill="#cbd5e1" font-size="11">并在网关层锁死 reasoning_effort="low/medium"。</text>

  <!-- Card 3 -->
  <rect x="711" y="186" width="315" height="235" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1.8"/>
  <text x="728" y="216" fill="#c084fc" font-size="15.5" font-weight="800">🟣 支柱 C：多 Agent 死循环熔断器</text>
  <text x="728" y="238" fill="#e9d5ff" font-size="11.5" font-weight="600">max_hops &lt;= 5 + 幂等 request_hash 去重</text>
  <text x="728" y="264" fill="#e2e8f0" font-size="11.5">• 风险：Coder 与 Reviewer 半夜报错无限互踢</text>
  <text x="728" y="286" fill="#e2e8f0" font-size="11.5">• 防线 1：每次跨 Agent 传递强制递减剩余跳数</text>
  <text x="728" y="308" fill="#e2e8f0" font-size="11.5">• 防线 2：连续 2 次相同动作哈希立即硬件挂起</text>
  <rect x="728" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="740" y="352" fill="#d8b4fe" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="740" y="370" fill="#cbd5e1" font-size="11">绝不允许子 Agent 无上限递归派生新任务，</text>
  <text x="740" y="388" fill="#cbd5e1" font-size="11">单次用户会话总工具调用次数硬顶 &lt;= 10 次。</text>

  <!-- Card 4 -->
  <rect x="1044" y="186" width="321" height="235" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
  <text x="1061" y="216" fill="#34d399" font-size="15.5" font-weight="800">🛡️ 支柱 D：确定性 Capability Broker</text>
  <text x="1061" y="238" fill="#a7f3d0" font-size="11.5" font-weight="600">锁死 FinOps 配额表与拦截虚假算力账单</text>
  <text x="1061" y="264" fill="#ecfdf5" font-size="11.5">• 门禁 1：record-owner 保护高管 PTU 算力总账</text>
  <text x="1061" y="286" fill="#ecfdf5" font-size="11.5">• 门禁 2：fixed-business-output 锁死网关限流表</text>
  <text x="1061" y="308" fill="#ecfdf5" font-size="11.5">• 门禁 3：0.0248ms 拦截 $4,650 虚假算力预充值</text>
  <rect x="1061" y="330" width="286" height="72" rx="8" fill="#022c22" stroke="#10b981"/>
  <text x="1073" y="352" fill="#6ee7b7" font-size="11.5" font-weight="700">生产级黄金架构结论：</text>
  <text x="1073" y="370" fill="#d1fae5" font-size="11">“网关 Token 钳制 + 编排跳数锁 + 能力网关”，</text>
  <text x="1073" y="388" fill="#d1fae5" font-size="11">实现 AI 算力成本 100% 可预测与零账单惊吓！</text>

  <!-- Section 2 -->
  <text x="45" y="454" fill="#e2e8f0" font-size="17" font-weight="700">2. 红蓝对抗推演：海绵提示词篡改租户配额 &amp; 伪造欠费告警关闭限流 vs. Capability Broker</text>

  <rect x="45" y="468" width="640" height="175" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="65" y="496" fill="#fca5a5" font-size="15" font-weight="800">❌ 脆弱 Baseline：无上限 PayGo + 无能力网关（BRK-505 / BRK-506 失守）</text>
  <text x="65" y="524" fill="#fecaca" font-size="12.5">1. 配额提权与总账泄密 (BRK-505)：外部请求夹带递归扇出指令，诱导 FinOps 助手读取核心算力</text>
  <text x="65" y="544" fill="#fecaca" font-size="12.5">   预算底表 restricted-budget，将外部免费租户配额改为无限额 business-result 并外发凭证。</text>
  <text x="65" y="572" fill="#fecaca" font-size="12.5">2. 限流解除与充值诈骗 (BRK-506 · 510 演练向量里程碑)：伪造云算力余额耗尽停机告警，</text>
  <text x="65" y="592" fill="#fecaca" font-size="12.5">   诱导在 trust-registry 中关闭每日 Token 熔断阈值并直接放行 $4,650 算力预充值电汇！</text>
  <text x="65" y="622" fill="#f87171" font-size="12" font-weight="700">💥 根因：仅靠 RPM 限流防不住单次 32k CoT 放大，且允许 Agent 动态修改配额策略与触发付款！</text>

  <rect x="715" y="468" width="650" height="175" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="496" fill="#6ee7b7" font-size="15" font-weight="800">✅ 零信任 AI FinOps 防线：Token 钳制 + 跳数锁 + Capability Broker（0.0% 失守）</text>
  <text x="735" y="524" fill="#d1fae5" font-size="12.5">• 门禁 1 (APIM TPM + Token 钳制)：按 JWT 强限制每分钟 Token，覆写 max_completion_tokens</text>
  <text x="735" y="548" fill="#d1fae5" font-size="12.5">• 门禁 2 (record-owner &amp; untrusted-write)：阻断读取算力底表与篡改外部租户配额等级</text>
  <text x="735" y="572" fill="#d1fae5" font-size="12.5">• 门禁 3 (fixed-business-output)：物理锁死 trust-registry 中的 Token 限流与预算报警策略</text>
  <text x="735" y="596" fill="#d1fae5" font-size="12.5">• 门禁 4 (original-requester-payment)：0.0248ms 拦截伪造欠费告警触发的 $4,650 充值电汇</text>
  <text x="735" y="622" fill="#34d399" font-size="12" font-weight="700">🛡️ 实测开销：Broker 内存裁决 P50 = 0.0248 ms / 含 SQLite WAL 审计收据 P50 = 7.21 ms</text>

  <!-- Section 3 -->
  <rect x="45" y="662" width="1320" height="168" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="692" fill="#38bdf8" font-size="16" font-weight="800">🛠️ 企业 AI 算力防刷与反钱包耗尽 (Anti-Denial-of-Wallet) 上线评审 6 项必选 Checklist</text>
  <text x="65" y="722" fill="#e2e8f0" font-size="13">☑️ 1. 全面切换至 JWT 级 TPM 与单日美元硬顶：废除单纯 RPM 限流，为 PayGo 溢出池配置硬性日预算熔断</text>
  <text x="65" y="748" fill="#e2e8f0" font-size="13">☑️ 2. 服务端强制钳制生成长度与思考深度：网关层覆写 max_completion_tokens 与 reasoning_effort，免疫海绵攻击</text>
  <text x="65" y="774" fill="#e2e8f0" font-size="13">☑️ 3. 实时 PTU 与离线 Batch API 物理分池：防止夜间批量文档总结任务抢占白天在线客服 PTU 算力</text>
  <text x="65" y="800" fill="#e2e8f0" font-size="13">☑️ 4. 多 Agent 强制 max_hops&lt;=5 与哈希去重  ☑️ 5. 锁死 trust-registry 限流策略  ☑️ 6. 严禁 Agent 自动支付算力账单</text>
</svg>
