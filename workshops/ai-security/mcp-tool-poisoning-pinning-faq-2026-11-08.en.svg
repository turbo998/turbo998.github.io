<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="redBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1f1218"/>
    </linearGradient>
    <linearGradient id="amberBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="greenBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#hdr)"/>

  <!-- Header -->
  <rect x="36" y="24" width="420" height="28" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="52" y="43" fill="#67e8f9" font-size="12" font-weight="700">AI SOLUTION ARCHITECT FIELD GUIDE · 2026-11-08 ROUND 2</text>

  <text x="36" y="82" fill="#f8fafc" font-size="23.5" font-weight="800">MCP Tool Poisoning, Dynamic Rug-Pulls &amp; Manifest Pinning vs. Runtime Sandbox</text>
  <text x="36" y="108" fill="#94a3b8" font-size="13.5">Why LLMs refuse &lt;3% of poisoned tools/list schemas, and when to choose Static SHA-256 Pinning vs. Zero-Trust MCP Capability Sandboxes</text>

  <!-- KPI Strip -->
  <g transform="translate(36, 124)">
    <rect x="0" y="0" width="270" height="66" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
    <text x="16" y="24" fill="#fca5a5" font-size="11.5" font-weight="700">NATIVE LLM SCHEMA REFUSAL</text>
    <text x="16" y="50" fill="#f87171" font-size="22" font-weight="800">&lt; 3.0% (&gt;70% ASR)</text>
    <text x="200" y="48" fill="#94a3b8" font-size="11">System-level trust</text>

    <rect x="286" y="0" width="270" height="66" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="302" y="24" fill="#fcd34d" font-size="11.5" font-weight="700">STATIC SHA-256 PINNING BLIND SPOT</text>
    <text x="302" y="50" fill="#fbbf24" font-size="20" font-weight="800">Blind to Backend Swap</text>
    <text x="500" y="48" fill="#94a3b8" font-size="11">&amp; Cross-Tool Exfil</text>

    <rect x="572" y="0" width="270" height="66" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="588" y="24" fill="#6ee7b7" font-size="11.5" font-weight="700">ZERO-TRUST MCP SANDBOX ASR</text>
    <text x="588" y="50" fill="#34d399" font-size="23" font-weight="800">75.0% → 0.0%</text>
    <text x="745" y="48" fill="#a7f3d0" font-size="11">32 Cases / 129 Checks</text>

    <rect x="858" y="0" width="270" height="66" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="874" y="24" fill="#7dd3fc" font-size="11.5" font-weight="700">BROKER + TAINT LOCK LATENCY</text>
    <text x="874" y="50" fill="#38bdf8" font-size="23" font-weight="800">0.8 ms (P50)</text>
    <text x="1020" y="48" fill="#bae6fd" font-size="11">100% Benign Pass</text>
  </g>

  <!-- Column 1 -->
  <g transform="translate(36, 208)">
    <rect x="0" y="0" width="364" height="330" rx="12" fill="url(#redBox)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="16" y="16" width="225" height="24" rx="6" fill="#7f1d1d"/>
    <text x="26" y="33" fill="#fecaca" font-size="12" font-weight="700">🚨 THE 3 LETHAL MCP KILL CHAINS</text>
    <text x="16" y="64" fill="#ffffff" font-size="16" font-weight="800">How Read-Only Plugins Steal Vault Secrets</text>

    <rect x="16" y="80" width="332" height="72" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="28" y="100" fill="#fca5a5" font-size="12.5" font-weight="700">1. Schema Poisoning ("Line Jumping")</text>
    <text x="28" y="120" fill="#cbd5e1" font-size="11.5">tools/list metadata is injected into the System Prompt;</text>
    <text x="28" y="138" fill="#cbd5e1" font-size="11.5">a free formatter orders co-mounted Email MCP to exfil secrets.</text>

    <rect x="16" y="162" width="332" height="72" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="28" y="182" fill="#fca5a5" font-size="12.5" font-weight="700">2. Post-Approval Dynamic Rug-Pull</text>
    <text x="28" y="202" fill="#cbd5e1" font-size="11.5">Clean on Day 1 audit; on Day 3 remote SSE server silently</text>
    <text x="28" y="220" fill="#cbd5e1" font-size="11.5">mutates tools/list or swaps backend logic without re-consent.</text>

    <rect x="16" y="244" width="332" height="72" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="28" y="264" fill="#fca5a5" font-size="12.5" font-weight="700">3. Tool Shadowing &amp; Slopsquatting</text>
    <text x="28" y="284" fill="#cbd5e1" font-size="11.5">Untrusted MCP registers colliding tool name (send_email)</text>
    <text x="28" y="302" fill="#cbd5e1" font-size="11.5">or squats hallucinated npm/PyPI package via npx -y / uvx.</text>
  </g>

  <!-- Column 2 -->
  <g transform="translate(418, 208)">
    <rect x="0" y="0" width="364" height="330" rx="12" fill="url(#amberBox)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="16" y="16" width="245" height="24" rx="6" fill="#78350f"/>
    <text x="26" y="33" fill="#fde68a" font-size="12" font-weight="700">⚖️ OPTION A/B: PINNING &amp; GATEWAY</text>
    <text x="16" y="64" fill="#ffffff" font-size="16" font-weight="800">Layer 1 Static Lock + Layer 2 Sanitizer</text>

    <rect x="16" y="80" width="332" height="76" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="28" y="100" fill="#fcd34d" font-size="12.5" font-weight="700">✅ Layer 1: Manifest SHA-256 Pinning + AgBOM</text>
    <text x="28" y="120" fill="#cbd5e1" font-size="11.5">• Pins server_id + version + sha256(tools/list) + OCI digest</text>
    <text x="28" y="138" fill="#cbd5e1" font-size="11.5">• Blocks public npx/uvx; stops schema-mutating Rug-Pulls</text>

    <rect x="16" y="166" width="332" height="76" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="28" y="186" fill="#fcd34d" font-size="12.5" font-weight="700">✅ Layer 2: Namespace Prefixing &amp; Schema Strip</text>
    <text x="28" y="206" fill="#cbd5e1" font-size="11.5">• Rewrites to &lt;srv&gt;__&lt;tool&gt;, eliminating Tool Shadowing</text>
    <text x="28" y="224" fill="#cbd5e1" font-size="11.5">• Strips imperative prompt directives from 3rd-party schemas</text>

    <rect x="16" y="252" width="332" height="64" rx="8" fill="#2e1065" stroke="#a855f7"/>
    <text x="28" y="272" fill="#e9d5ff" font-size="12" font-weight="700">⚠️ Why Layer 1+2 Alone Fail on External MCPs:</text>
    <text x="28" y="292" fill="#cbd5e1" font-size="11.5">Remote server can keep Schema SHA-256 identical while</text>
    <text x="28" y="308" fill="#cbd5e1" font-size="11.5">swapping backend code or exploiting output indirect injection!</text>
  </g>

  <!-- Column 3 -->
  <g transform="translate(800, 208)">
    <rect x="0" y="0" width="364" height="330" rx="12" fill="url(#greenBox)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="16" y="16" width="265" height="24" rx="6" fill="#065f46"/>
    <text x="26" y="33" fill="#a7f3d0" font-size="12" font-weight="700">🛡️ OPTION C: LAYER 3 RUNTIME SANDBOX</text>
    <text x="16" y="64" fill="#ffffff" font-size="16" font-weight="800">Cross-Tool Taint Lock + Hash + MicroVM</text>

    <rect x="16" y="80" width="332" height="76" rx="8" fill="#0f172a" stroke="#059669"/>
    <text x="28" y="100" fill="#6ee7b7" font-size="12.5" font-weight="700">🔒 Gate 1: Cross-Server Taint Lock (0.8ms)</text>
    <text x="28" y="120" fill="#cbd5e1" font-size="11.5">Reading internal Email/DB tags session context RESTRICTED;</text>
    <text x="28" y="138" fill="#cbd5e1" font-size="11.5">deterministically blocks passing args to external MCPs.</text>

    <rect x="16" y="166" width="332" height="76" rx="8" fill="#0f172a" stroke="#059669"/>
    <text x="28" y="186" fill="#6ee7b7" font-size="12.5" font-weight="700">🔑 Gate 2: Per-Call request_hash &amp; Target Pin</text>
    <text x="28" y="206" fill="#cbd5e1" font-size="11.5">Verifies SHA256(srv + tool + args + target + schema_hash)</text>
    <text x="28" y="224" fill="#cbd5e1" font-size="11.5">and same-run-target, stopping TOCTOU payload swaps.</text>

    <rect x="16" y="252" width="332" height="64" rx="8" fill="#0f172a" stroke="#059669"/>
    <text x="28" y="272" fill="#6ee7b7" font-size="12.5" font-weight="700">📦 Gate 3: Zero-Egress Credential-Stripped Sandbox</text>
    <text x="28" y="292" fill="#cbd5e1" font-size="11.5">Confines local stdio MCP processes without host env vars,</text>
    <text x="28" y="308" fill="#cbd5e1" font-size="11.5">~/.ssh, or non-allowlisted outbound internet access.</text>
  </g>

  <!-- Bottom Selection Rule & Checklist -->
  <g transform="translate(36, 556)">
    <rect x="0" y="0" width="1128" height="136" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="24" y="30" fill="#38bdf8" font-size="15" font-weight="800">🧭 ARCHITECT 10-SECOND SELECTION RULE &amp; 6-POINT PRODUCTION CHECKLIST</text>

    <text x="24" y="58" fill="#e2e8f0" font-size="12.5"><tspan fill="#34d399" font-weight="700">▶ 1st-Party Internal Read-Only MCP:</tspan> Layer 1 Static SHA-256 Pinning (~0.1ms)　<tspan fill="#fbbf24" font-weight="700">▶ Local Community Utility MCP:</tspan> Layer 1+2 Gateway + Zero-Egress Sandbox</text>
    <text x="24" y="82" fill="#e2e8f0" font-size="12.5"><tspan fill="#f87171" font-weight="700">▶ Remote SaaS MCP or Co-Mounted with Privileged Enterprise Tools:</tspan> Mandatory Layer 1+2+3 Full Zero-Trust Broker (Pinning + Prefixing + Taint Lock, ~0.8ms)</text>

    <rect x="24" y="96" width="1080" height="28" rx="6" fill="#1e293b"/>
    <text x="36" y="115" fill="#a7f3d0" font-size="11.5" font-weight="700">☑️ 6 Go-Live Checks: [1] agbom-lock.json Pinning  [2] Block public npx/uvx  [3] &lt;srv&gt;__&lt;tool&gt; Prefix  [4] Schema Sanitizer  [5] Taint Boundary Lock  [6] Zero-Egress Sandbox</text>
  </g>
</svg>
