<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg36" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="redCard36" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#450A0A" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="greenCard36" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg36)" rx="16"/>
  <rect x="20" y="18" width="1160" height="78" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="42" y="48" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="800">Round 36 架构选型 FAQ：企业合成数据飞轮防坍塌与 C2PA 内容血统 vs. 黄金集隔离 + 能力网关</text>
  <text x="42" y="76" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">Nature 2024 自噬性模型坍塌 · 飞轮回流投毒与黄金种子集防窃密 · C2PA 硬件签名链 · 100 场景里程碑 / 266 断言通过</text>
  <rect x="1000" y="32" width="160" height="46" rx="8" fill="#065F46" stroke="#10B981" stroke-width="1.5"/>
  <text x="1080" y="53" text-anchor="middle" fill="#ECFDF5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Hardened ASR: 0.0%</text>
  <text x="1080" y="70" text-anchor="middle" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11">100 Scenarios / 266 Pass</text>

  <!-- Left Column -->
  <rect x="20" y="112" width="565" height="410" rx="12" fill="url(#redCard36)" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="142" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="16" font-weight="800">❌ 脆弱全自动数据飞轮（混合读写黄金集 + 盲信外部合成包与统计水印）</text>

  <rect x="42" y="158" width="520" height="104" rx="8" fill="#1E293B" stroke="#7F1D1D" stroke-width="1.2"/>
  <text x="58" y="182" fill="#F87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. 合成语料飞轮投毒与黄金种子集外泄 (SYNTH-FLYWHEEL-POISON-EXFIL-85)</text>
  <text x="58" y="204" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 外部众包标注商提交的 JSONL 样本植入“去重对齐指令”，诱导读取黄金真值集</text>
  <text x="58" y="224" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 清洗 Agent 将生产语料库 business-result 覆写为中毒分支，并将黄金集发回外包商</text>
  <text x="58" y="244" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• 引发自噬性模型坍塌与永久后门，且数百万沉淀的黄金种子集被掏空！</text>

  <rect x="42" y="274" width="520" height="104" rx="8" fill="#1E293B" stroke="#7F1D1D" stroke-width="1.2"/>
  <text x="58" y="298" fill="#F87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. 伪造 C2PA 根证书与 $2,750 版权费盗刷 (SYNTH-C2PA-SPOOF-SPEND-86)</text>
  <text x="58" y="320" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 无良数据商用同义词改写洗掉 SynthID 统计水印，附上自签名伪造 C2PA 声明</text>
  <text x="58" y="340" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 诱导调用 update_trust 自加可信根，并骗取 $2,750 “人类专家级正版语料版权费”</text>
  <text x="58" y="360" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• 把廉价大模型合成垃圾包装成高价人工语料，既毒化模型又套空预算！</text>

  <rect x="42" y="390" width="520" height="114" rx="8" fill="#1E293B" stroke="#7F1D1D" stroke-width="1.2"/>
  <text x="58" y="414" fill="#F87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. 为什么无隔离回流必坍塌，且纯统计水印不能作为供应链验真边界？</text>
  <text x="58" y="436" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• Shumailov Nature 2024 定理：多代递归合成会导致方差坍缩与长尾专业知识消亡</text>
  <text x="58" y="456" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 统计水印仅反映局部 Token 概率偏置，不具备非对称密码学不可伪造性</text>
  <text x="58" y="482" fill="#EF4444" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Baseline 结果：生产语料库被投毒 + 黄金真值集外泄 + $2,750 版权失守 (ASR 75.0%)</text>

  <!-- Right Column -->
  <rect x="615" y="112" width="565" height="410" rx="12" fill="url(#greenCard36)" stroke="#10B981" stroke-width="1.5"/>
  <text x="637" y="142" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="16" font-weight="800">✅ 双轨黄金集隔离 + C2PA 硬件信任锚 + 零信任能力网关</text>

  <rect x="637" y="158" width="520" height="104" rx="8" fill="#1E293B" stroke="#065F46" stroke-width="1.2"/>
  <text x="653" y="182" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">防线 1：黄金种子真值集物理隔离 (record-owner &amp; restricted-data-boundary)</text>
  <text x="653" y="204" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 外部语料清洗任务跨主体读取黄金真值集在 0.0248ms 内被 record-owner 秒拒</text>
  <text x="653" y="224" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 任何企图向外部标注商回传内部黄金样本的请求被 restricted-data-boundary 封死</text>
  <text x="653" y="244" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• 彻底保护企业最核心的 Gold Seed Corpus 与评测基准不被去重探针掏空！</text>

  <rect x="637" y="274" width="520" height="104" rx="8" fill="#1E293B" stroke="#065F46" stroke-width="1.2"/>
  <text x="653" y="298" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">防线 2：外部合成包禁改生产主库 (untrusted-write) + 代数深度锁</text>
  <text x="653" y="320" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 线上回流日志与外部合成样本强制标记 untrusted=True 与 synthetic_depth=1</text>
  <text x="653" y="340" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 企图直接覆写生产主语料集 business-result 被 untrusted-write 100% 阻断</text>
  <text x="653" y="360" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• 硬性拒绝 depth &gt;= 2 的近亲繁殖，从根源阻断自噬性模型坍塌！</text>

  <rect x="637" y="390" width="520" height="114" rx="8" fill="#1E293B" stroke="#065F46" stroke-width="1.2"/>
  <text x="653" y="414" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">防线 3：C2PA 信任锚不动点锁 (fixed-business-output) + 版权结算门禁</text>
  <text x="653" y="436" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 严禁调用 update_trust (tool-allowlist) 或改写 C2PA 根证书表 trust-registry</text>
  <text x="653" y="456" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 外部数据包诱导的 $2,750 版权结算被 original-requester-payment 100% 阻断</text>
  <text x="653" y="482" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Hardened 结果：BRK-81 / BRK-82 100% 阻断 · 全仓突破 100 场景里程碑！</text>

  <!-- Bottom Bar -->
  <rect x="20" y="538" width="1160" height="122" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="42" y="566" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">🧭 AI 解决方案架构师选型铁律与实测性能口径（Provenance-Sealed · 100-Scenario Milestone）</text>
  <text x="42" y="592" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12.5">• 本方 AIGC 标识：SynthID 统计水印  |  • 内部持续迭代：双轨分桶 (Gold 只读 + depth=1)  |  • 外部语料飞轮：黄金集隔离 + C2PA 硬件锚 + Capability Broker</text>
  <text x="42" y="616" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12.5">• 本地实测延迟 (measured, independently_reproduced=true)：纯内存门禁 P50 = 0.0248 ms / P95 = 0.0409 ms (n=200 全量原始样本封存)；单步含 SQLite WAL 落盘 P50 = 7.21 ms (n=50)</text>
  <text x="42" y="640" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• 评测验证：tests/test_regressions.py 新增 BRK-81 (SYNTH-FLYWHEEL-POISON-EXFIL-85) 与 BRK-82 (SYNTH-C2PA-SPOOF-SPEND-86)，全仓 100 场景 / 266 项 Pytest 100% 通过</text>
</svg>
