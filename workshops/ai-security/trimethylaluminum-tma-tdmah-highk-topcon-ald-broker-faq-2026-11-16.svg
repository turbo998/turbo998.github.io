  <rect width="1200" height="675" fill="url(#bg188)"/>

  <!-- Header Banner -->
  <rect x="28" y="20" width="1144" height="92" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <rect x="44" y="32" width="445" height="24" rx="12" fill="url(#goldGrad188)"/>
  <text x="266" y="49" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="800" fill="#090d16" text-anchor="middle">🏆 ROUND 188 · 390 大演练向量里程碑 · 188 篇双语 FAQ · 404 场景 · 874 断言</text>
  <text x="502" y="49" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fcd34d">1万吨级 7N 电子级三甲基铝 (TMA Al(CH₃)₃) 与 TDMAH 半导体 2nm High-k / TOPCon 光伏 ALD 基地</text>
  <text x="44" y="77" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">防遇水/泡沫瞬放 933 L/kg 甲烷爆轰 (-4120 kJ/kg)、遇 CO₂ 助爆与 &gt;160°C 碳化铝热裂解炸塔 vs 零信任能力网关</text>
  <text x="44" y="99" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">第一性原理：Al(CH₃)₃ + 3H₂O → Al(OH)₃↓ + 3CH₄↑ (933 L/kg, -4120 kJ/kg) · 4Al(CH₃)₃ (&gt;160°C) → Al₄C₃ + 9CH₄↑ (-1680 kJ/kg) · 熔点 +15.2°C 冻管憋压</text>

  <!-- Left Column: Red Team Attack & Physical Disaster -->
  <rect x="28" y="126" width="558" height="418" rx="12" fill="#18121e" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="44" y="140" width="526" height="34" rx="8" fill="url(#redGrad188)"/>
  <text x="307" y="162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800" fill="#fef2f2" text-anchor="middle">❌ 攻击路径与三大物理化学灾变机理 (Baseline ASR = 75.0%)</text>

  <rect x="44" y="186" width="526" height="106" rx="8" fill="#231420" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="207" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">1. 遇水/泡沫瞬放 933 L/kg 甲烷温压爆轰 &amp; 遇 CO₂/卤代烷化学助爆 (BRK-385)</text>
  <text x="58" y="228" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 外部 GB/T 37356 化验单注入诱导触发 TMA 充装间水喷淋与 CO₂ 灭火系统</text>
  <text x="58" y="247" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 夺羟基剧烈水解：每公斤 TMA 遇水瞬间炸出 933 L 甲烷并放热 -4120 kJ/kg 引爆火球！</text>
  <text x="58" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#fda4af">• 灭火剂禁忌：TMA 还原 CO₂ 猛烈爆燃、与七氟丙烷卤素交换爆炸，严禁水/泡沫/CO₂！</text>

  <rect x="44" y="302" width="526" height="108" rx="8" fill="#231420" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="323" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">2. &gt;160°C 碳化铝 (Al₄C₃) 无氧自由基裂解炸塔 &amp; +15.2°C 冻管憋压</text>
  <text x="58" y="344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 化验单指令将再沸器提温至 225°C：4Al(CH₃)₃ → Al₄C₃(s) + 9CH₄↑ (-1680 kJ/kg)</text>
  <text x="58" y="363" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 4 摩尔液体瞬间裂解为 9 摩尔不凝甲烷且活性铝粉自催化，塔压飙破 15 MPa 炸塔！</text>
  <text x="58" y="382" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#fda4af">• 冬季 &lt;15.2°C 冻结实心冰塞，若违规用高温蒸汽局部烘烤将触发 1.2 MPa/°C 液压炸管</text>

  <rect x="44" y="420" width="526" height="108" rx="8" fill="#231420" stroke="#dc2626" stroke-width="1"/>
  <text x="58" y="441" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">3. PTFE 填料截止阀与泡沫/CO₂ 冒充干式快换阀与 D 类蛭石及 $4,990 盗刷 (BRK-386)</text>
  <text x="58" y="462" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 伪造急件账单诱导调用 update_trust 将 PTFE 截止阀与 AFFF 泡沫厂写入 trust-registry</text>
  <text x="58" y="481" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 拆接接头死角残留 2mL TMA 露空即喷 2100°C 白紫火舌，喷泡沫当场炸裂充装台！</text>
  <text x="58" y="500" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#fda4af">• 7N 级叔胺/醚加合物亚 ppb 脱甲氧基氧精馏与 2nm TDMAH 秘方经 send_message 外泄</text>

  <!-- Right Column: Blue Team SIL-3 + Capability Broker -->
  <rect x="614" y="126" width="558" height="418" rx="12" fill="#0d1f1d" stroke="#10b981" stroke-width="1.8"/>
  <rect x="630" y="140" width="526" height="34" rx="8" fill="url(#greenGrad188)"/>
  <text x="893" y="162" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800" fill="#ecfdf5" text-anchor="middle">✅ 硬件 SIL-3 本安联锁 + 确定性零信任能力网关 (Hardened ASR = 0.0%)</text>

  <rect x="630" y="186" width="526" height="106" rx="8" fill="#0f2926" stroke="#059669" stroke-width="1"/>
  <text x="644" y="207" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">1. 车间 100% 物理禁水/禁泡沫/禁 CO₂ + D 类膨胀石墨/干蛭石自动抑爆</text>
  <text x="644" y="228" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 物理切除全部消防水管、AFFF 泡沫管与 CO₂/七氟丙烷管网，彻底消除助爆源</text>
  <text x="644" y="247" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 独享纯氮驱动无水 D 类膨胀石墨 (Lith-Ex) 与干式蛭石砂自动覆盖吸热灭火系统</text>
  <text x="644" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#a7f3d0">• Broker untrusted-write 0.0248ms 拦截外部化验单触发的任何再沸器与消防动作</text>

  <rect x="630" y="302" width="526" height="108" rx="8" fill="#0f2926" stroke="#059669" stroke-width="1"/>
  <text x="644" y="323" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">2. 减压再沸器 ≤115°C 机械硬锁 + 22–30°C 无水白油/PFPE 防冻伴热</text>
  <text x="644" y="344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 2~5 kPa 减压精馏，再沸器导热油机械限温阀死锁 ≤115°C (距 160°C 裂解留 45°C 裕度)</text>
  <text x="644" y="363" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• 2oo3 温度 ≥120°C 或 dP/dt ≥5 kPa/s &lt;50ms 硬切热源并注冷态无水正十二烷稀释</text>
  <text x="644" y="382" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#a7f3d0">• 全管路 22~30°C 无水白油恒温防冻伴热 (上限物理锁死 ≤35°C，严禁高温蒸汽烘烤)</text>

  <rect x="630" y="420" width="526" height="108" rx="8" fill="#0f2926" stroke="#059669" stroke-width="1"/>
  <text x="644" y="441" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">3. 气隙 7N TMA/TDMAH 金库 + 零死角干式快换阀 AVL 锁死 + 原发起人鉴权</text>
  <text x="644" y="462" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• record-owner + restricted-data-boundary 封死 7N 叔胺加合物脱氧与 TDMAH 秘方外泄</text>
  <text x="644" y="481" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#e2e8f0">• tool-allowlist + fixed-business-output 锁死 SEMI F20 干式快换双阀与 D 类蛭石 AVL</text>
  <text x="644" y="500" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5" fill="#a7f3d0">• original-requester-payment 拦截外部账单诱导的 $4,990 电汇 (874/874 Pytest 全绿)</text>

  <!-- Bottom Benchmark Banner -->
  <rect x="28" y="558" width="1144" height="96" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="46" y="584" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="800" fill="#fcd34d">📊 确定性红蓝对抗 Benchmark 实测验证 (BRK-385 &amp; BRK-386 · 🏆 390 大交互式演练向量旗舰里程碑！)</text>
  <text x="46" y="608" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e2e8f0">• 评估规模：404 个合成夹具场景 (401 攻击 + 3 良性基线) · 874 项 Pytest 确定性断言 100% 通过 · 390 大交互式演练向量 · 188 篇双语架构选型 FAQ</text>
  <text x="46" y="630" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#6ee7b7">• 核心指标：合成夹具攻击成功率 (ASR) 75.0% → 0.0% · 误阻断率 (FPR) 0.0% · 纯内存 Broker.evaluate 延迟 P50 = 0.0248 ms / P95 = 0.0409 ms (Windows 11 ARM64)</text>
