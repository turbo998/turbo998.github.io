<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad353" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad353" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad353" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad353" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad353)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad353)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 353 · 🏆 720 VECTORS MILESTONE · SYNDICATED LOANS &amp; PRIVATE CREDIT (FINASTRA LOAN IQ / CLEARPAR / ABL BORROWING BASE)</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">银团贷款与私募信贷代理 (Finastra Loan IQ/ClearPar)、借款基数与 LSTA 交割 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">银团参贷行持仓明细与超级优先权重组底稿物理气隙 + ABL 借款基数扣减与财务契约硬锁 vs. 合规证明注入超额提款与 LSTA 转让电汇诈骗 (BRK-715 / BRK-716)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad353)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 银团贷款代理与私募信贷三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 借款基数证书 (BBC) 注入窃取银团持仓明细 (BRK-715)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 陷入困境的被投企业上传的月度资产抵押借款基数证书 (BBC)</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  与财务契约合规证明 PDF 夹带间接提示词注入</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 诱导 Agent 跨库读取代理行保密的银团各参贷行精确持仓份额</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  (Lender Register) 及防掠夺性重组 (Uptier/Drop-Down) 底稿</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 虚增 ABL 合格应收账款折算率与压制契约违约 (BRK-715)</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令在 Finastra Loan IQ 中免除逾期 90 天以上坏账与关联</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  方应收款的剔除规则 (Ineligible AR)，虚增可提款信用额度</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 违规通过 Add-Back 粉饰 EBITDA 以掩盖净杠杆率超标违约</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：无抵押物支撑的恶意抽逃提款 (Revolver Draw)</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造 LSTA 银团份额转让与本息分派电汇诈骗 (BRK-716)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造 ClearPar / LSTA 二级市场贷款转让协议 (Assignment) 或</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  借款人循环贷提款通知书 (Borrowing Notice)</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 收款指令并电汇 $5,160 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-size="11" font-weight="700">• 违规触发：重演经典银团错付巨案 (Revlon 类操作风险) 与盗款</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad353)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 银团贷款代理与私募信贷零信任架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 借款基数 (BBC) / 合规证书清洗与槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离借款人财报附注与提款函中的隐藏指令，仅提取 FpML/强类型</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  槽位 (AR 账龄桶、存货净值、SOFR 利差、实测 EBITDA、利息支出)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 银团名册与重组防御底稿物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 行政代理行 (Admin Agent) 保密的参贷行持仓名册、二级市场</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  估值与重组法律底稿存入物理气隙域 (restricted-budget)</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 ABL 借款基数扣减与 EBITDA 加回上限硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 逾期 &gt;90 天 AR 剔除、集中度上限与 EBITDA 协同效应加回上限</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  (如 ≤15% Cap) 由确定性代码计算；严禁 AI 豁免违约或调高折算率</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断虚增额度与违约掩盖</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: ClearPar/SSI 标准结算指令只读锁与双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中参贷行与借款人 SSI 账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad353)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流银团贷款与私募信贷 AI 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性信贷网关 + 银团名册气隙 + ABL 硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-715/716 拦截率 100% | 满足 OCC 杠杆贷款指引 &amp; LSTA</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Finastra Loan IQ / Allvue / WSO 原生角色权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法阻止共享贷后管理机器人在财报 PDF 注入下更新可用额度</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 ABL 应收账龄扣减、EBITDA 加回上限与 SSI 结算语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统银团代理行运营团队手工核对传真提款函与 Excel BBC</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ LSTA 二级交割平均耗时 T+10 天，人工操作极易引发错付事故</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 353 · 720 向量！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：虚增提款额、持仓外泄与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取银团持仓名册与重组底稿 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断虚增 ABL 额度与掩盖违约 (business-result)</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向借款人外传参贷行投票持仓</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 LSTA SSI 账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,160 伪造提款/交割电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 353 · 🏆 720 个交互靶场攻击向量里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 银团持仓名册气隙：行政代理行维护的参贷行持仓比例 (Lender Hold Sizes) 与防御掠夺性重组底稿与贷后 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 ABL 借款基数与契约引擎：合格 AR/存货折算率与净杠杆率契约由确定性公式计算，严禁 AI 豁免逾期坏账扣减</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. ClearPar SSI 只读与防错付六眼复核：LSTA 贷款交割与本息分派账户唯一绑定认证 SSI 库，杜绝 Revlon 类错付风险</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：734 个场景 (731 风险 + 3 基线) | 798 项 Pytest 检查 | 1,534 项断言 | 🏆 720 个交互向量 | 353 篇双语 FAQ (171 篇指南) | BRK-715/716</text>
</svg>
