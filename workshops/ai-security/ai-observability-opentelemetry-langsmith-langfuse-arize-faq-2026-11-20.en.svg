  <text x="60" y="460" fill="#cbd5e1" font-size="12">Spoofed `OTEL_EXPORTER_OTLP_ENDPOINT` migration</text>
  <text x="60" y="478" fill="#cbd5e1" font-size="12">&amp; APM overage invoice tamper with `trust-registry`</text>
  <text x="60" y="498" fill="#fca5a5" font-size="12" font-weight="700">to redirect spans &amp; execute $7,600 wire fraud!</text>

