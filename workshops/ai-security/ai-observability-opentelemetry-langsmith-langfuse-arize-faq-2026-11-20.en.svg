  <text x="60" y="350" fill="#cbd5e1" font-size="12">Adversarial prompts embed payloads targeting</text>
  <text x="60" y="368" fill="#cbd5e1" font-size="12">LLM-as-a-Judge evaluators or SRE triage Copilots,</text>
  <text x="60" y="388" fill="#fca5a5" font-size="12" font-weight="700">disabling OTel redaction &amp; dumping the trace vault!</text>

  <rect x="46" y="416" width="333" height="100" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
