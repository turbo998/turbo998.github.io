  <text x="212" y="168" text-anchor="middle" fill="#fecaca" font-size="15" font-weight="800">🚨 1. Top 3 GenAI Trace Leakage &amp; Injection Risks</text>

  <rect x="46" y="196" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="218" fill="#f87171" font-size="13" font-weight="700">① Unredacted Prompt/Tool Span Exfil (BRK-821)</text>
  <text x="60" y="240" fill="#cbd5e1" font-size="12">Default `gen_ai.prompt` &amp; `tool.arguments` capture</text>
  <text x="60" y="258" fill="#cbd5e1" font-size="12">ships raw OAuth tokens, SSNs, and executive salaries</text>
  <text x="60" y="278" fill="#fca5a5" font-size="12" font-weight="700">to external SaaS observability clouds in cleartext!</text>

