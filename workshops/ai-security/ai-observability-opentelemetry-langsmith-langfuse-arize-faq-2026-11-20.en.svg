  <text x="447" y="350" fill="#cbd5e1" font-size="12">Default to `OTEL_GENAI_CAPTURE_CONTENT=false`</text>
  <text x="447" y="368" fill="#cbd5e1" font-size="12">(metrics/tokens/latency only) or self-host Langfuse/</text>
  <text x="447" y="388" fill="#6ee7b7" font-size="12" font-weight="700">Phoenix inside private VPC with CMK encryption!</text>

  <rect x="433" y="416" width="333" height="100" rx="8" fill="#0d242c" stroke="#047857" stroke-width="1"/>
  <text x="447" y="438" fill="#34d399" font-size="13" font-weight="700">③ Pin OTLP Exporter Sinks &amp; Dual-Sign Billing</text>
