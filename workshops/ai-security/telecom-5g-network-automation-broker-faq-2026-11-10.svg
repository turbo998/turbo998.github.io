  <rect width="1200" height="760" fill="url(#bg39)"/>

  <!-- Header -->
  <rect x="30" y="22" width="1140" height="86" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="54" fill="#60a5fa" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">AI 解决方案架构师实战选型一图流 · ROUND 39 · 电信 5G 核心网、O-RAN 与企业网络自动化 (NETOPS) AI AGENT</text>
  <text x="52" y="84" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">SNMP/BGP 遥测注入、路由劫持与漫游结算欺诈 vs. RPKI 密码学校验 + 数字孪生预演 + 零信任能力网关</text>
  <rect x="935" y="38" width="215" height="52" rx="10" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="1042" y="60" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">106 场景 · 278 项断言全通过</text>
  <text x="1042" y="79" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="800">75.0% → 0.0% ASR (0.0248ms)</text>

  <!-- Left Column: Vulnerable Architecture -->
  <rect x="30" y="124" width="555" height="440" rx="14" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="124" width="555" height="44" rx="14" fill="url(#redGrad39)"/>
  <text x="52" y="152" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">❌ 传统高危架构：遥测诊断与生产控制面混用（100% 沦陷）</text>

  <rect x="52" y="184" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="208" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">1. 跨自治域 BGP Notification / SNMP Trap 遥测注入（无认证跳板）</text>
  <text x="68" y="230" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 外部 Peer AS 在 RFC 9003 停机通信或 SNMP sysDescr 中植入伪造 NOC 应急倒换指令</text>
  <text x="68" y="250" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 传统防火墙视其为合法 BGP/SNMP 协议报文；提示词护栏被“海缆中断 SOP”话术高达 85.1% 绕过</text>

  <rect x="52" y="280" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">2. 5G 专网切片密钥底盘被窃 &amp; BGP 路由/URLLC 切片被恶意降级</text>
  <text x="68" y="326" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 全能型 NetOps Agent 共享高权账号：被诱导读取政企专网拓扑密钥 (restricted-budget)</text>
  <text x="68" y="346" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 直接调用 gNMI 覆写生产路由与 5G UPF 切片策略 (business-result)，并将拓扑回传外部 AS</text>

  <rect x="52" y="376" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="400" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">3. 伪造 GSMA BCE 批发漫游账单自升 Tier-1 与 $4,600 结算盗刷</text>
  <text x="68" y="422" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 外部漫游/转接商在对账单注入指令，企图将恶意 ASN 写入 trust-registry 对等白名单</text>
  <text x="68" y="442" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 缺乏原始发起人血统门禁，直接诱导互联结算 Agent 划拨 $4,600 紧急海缆转接结算费</text>

  <rect x="52" y="472" width="510" height="74" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="68" y="497" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="800">💥 实测 Baseline 后果（BRK-87 &amp; BRK-88）：</text>
  <text x="68" y="519" fill="#fef2f2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 生产 BGP 路由与 5G 切片策略被篡改 + 专网拓扑外泄给外部 AS + $4,600 虚假漫游款直接成交！</text>
  <text x="68" y="537" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 根因：路由器 TACACS+ 仅认服务账号身份，无法识别指令是否由不可信公网遥测报文劫持触发</text>

  <!-- Right Column: Hardened Architecture -->
  <rect x="615" y="124" width="555" height="440" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="615" y="124" width="555" height="44" rx="14" fill="url(#greenGrad39)"/>
  <text x="637" y="152" fill="#d1fae5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">✅ 纵深防御架构：控制面双域隔离 + RPKI/数字孪生 + 能力网关</text>

  <rect x="637" y="184" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="208" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 1 · 只读遥测平面 + 5G 专网密钥库隔离 (record-owner + Egress)</text>
  <text x="653" y="230" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 遥测排障 Agent (calendar) 物理隔离于 5G 核心网密钥库外，读 restricted-budget 0.0248ms 秒拒</text>
  <text x="653" y="250" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 出口门禁 restricted-data-boundary 100% 封死核心网受限拓扑向外部自治域 (supplier) 外发</text>

  <rect x="637" y="280" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 2 · 遥测污点写锁 + RPKI 验签 + 数字孪生预演 (untrusted-write)</text>
  <text x="653" y="326" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 任何摄入外部 BGP/SNMP 报文的会话强制打标 untrusted=True，严禁直写生产路由表与切片策略</text>
  <text x="653" y="346" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 仅允许生成只读变更草案，必须经 RPKI ROA 签名校验 + Batfish 数字孪生无黑洞验证 + 人工签批</text>

  <rect x="637" y="376" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="400" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 3 · 对等运营商表锁死 + 漫游结算血统门禁 (original-requester)</text>
  <text x="653" y="422" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• tool-allowlist + fixed-business-output 双重锁死 trust-registry，严禁运行时私加 Tier-1 运营商</text>
  <text x="653" y="442" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• original-requester-payment 溯源 requester="supplier"，0.0248ms 拦截 $4,600 虚假漫游结算</text>

  <rect x="637" y="472" width="510" height="74" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="653" y="497" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="800">🛡️ 实测 Hardened 战果（Pytest 278 passed · 0 漏报 · 0 误杀）：</text>
  <text x="653" y="519" fill="#ecfdf5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 专网密钥零读取 + 生产 BGP/切片零篡改 + 拓扑零外泄 + $4,600 漫游盗刷零成交！</text>
  <text x="653" y="537" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 纯内存网关裁决延迟 P50 = 0.0248ms / P95 = 0.0409ms，单步 SQLite WAL 审计收据落盘 7.21ms</text>

  <!-- Bottom Decision Bar -->
  <rect x="30" y="582" width="1140" height="154" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="30" y="582" width="1140" height="38" rx="14" fill="url(#blueGrad39)"/>
  <text x="52" y="606" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="800">🧭 电信与网络自动化 AI 安全架构师 30 秒选型口诀与上线核验红线（Architect Decision Cheat-Sheet）</text>

  <rect x="50" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="66" y="655" fill="#93c5fd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🟢 什么时候选方案 A（只读遥测问答助手）？</text>
  <text x="66" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 仅对已脱敏的内网流量报表做自然语言统计查询</text>
  <text x="66" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 零路由器 gNMI/NETCONF 写接口、零结算打款工具</text>

  <rect x="422" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="438" y="655" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🔴 什么时候必须选方案 B（双域隔离 + 能力网关）？</text>
  <text x="438" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 接入外部 BGP/SNMP 遥测、调度 5G/O-RAN 切片或漫游对账</text>
  <text x="438" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 必须强制 RPKI 验签 + 数字孪生预演 + Capability Broker</text>

  <rect x="794" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="810" y="655" fill="#fcd34d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🛠️ 生产上线 3 条铁律（Zero-Trust Invariants）</text>
  <text x="810" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">1. 遥测排障沙盒零密钥权 (record-owner) 且仅产变更草案</text>
  <text x="810" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">2. URLLC 切片设 QoS 硬下限；外部对等方禁触发结算汇款</text>
</svg>
