<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg397" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr397" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg397)" rx="16"/>
  <rect x="20" y="18" width="1160" height="72" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="42" y="47" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">Round 397 · 企业 Agent 身份与权限委托选型对比 (Entra Agent ID + OBO vs. Managed Identity vs. HITL)</text>
  <text x="42" y="73" fill="#67E8F9" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">BRK-803 &amp; BRK-804 · 🏆 1,710 项确定性断言里程碑 · 应用级全局凭据气隙 + OBO 权限交集裁剪与 CIBA FIDO2 审批硬锁</text>

  <!-- Left Column: Threats -->
  <rect x="24" y="106" width="368" height="476" rx="12" fill="#1A121C" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">⛔ 多智能体身份与权限委托三大攻击链</text>

  <rect x="38" y="152" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">1. 滥用应用级 Managed Identity 跨用户越权 (BRK-803)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 面向用户的 Agent 错误使用应用级 `Mail.ReadWrite.All` 身份</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 外部日历邀请/邮件注入诱导 Agent 越权读取 restricted-budget</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 窃取 CEO 邮箱与全租户 Service Principal 高特权客户端密钥</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 最致命的“困惑的代理人 (Confused Deputy)”全租户越权灾难</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">2. 多跳子 Agent 权限放大与伪造 HITL 批准 (BRK-803)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 主 Agent 调用子 Agent 时丢失原始请求人 `requester` 约束</text>
  <text x="50" y="362" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 篡改 business-result 静默授予 `Directory.ReadWrite.All` 范围</text>
  <text x="50" y="382" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 在对话文本中伪造 `[HUMAN_APPROVED=TRUE]` 绕过人工审批弹窗</text>
  <text x="50" y="404" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 低权限外部访客借子 Agent 跳板获得全局管理员写权限</text>

  <rect x="38" y="444" width="340" height="122" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="466" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">3. 伪造身份提供商 (IdP) 非人类身份席位诈骗 (BRK-804)</text>
  <text x="50" y="488" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 伪造 Entra Workload ID / Okta “Agentic 身份许可超量停服函”</text>
  <text x="50" y="508" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 攻击 trust-registry 篡改身份安全厂商与 FIDO2 硬件商收款账户</text>
  <text x="50" y="528" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 诱导 IAM 采购 Agent 直接发起 $7,150 紧急席位电汇</text>
  <text x="50" y="550" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 借“全网 Agent OAuth 令牌即将集体吊销”恐吓实施诈骗</text>

  <!-- Center Column: Zero-Trust Broker -->
  <rect x="408" y="106" width="384" height="476" rx="12" fill="#0F1E2E" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="428" y="136" fill="#67E8F9" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">🛡️ 确定性 Agent 身份委托与 HITL 网关 (Hardened)</text>

  <rect x="424" y="152" width="352" height="96" rx="8" fill="#162A3E" stroke="#38BDF8" stroke-width="1"/>
  <text x="438" y="174" fill="#7DD3FC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 1：跨跳原始请求人钉扎 (`requester` Immutability)</text>
  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 无论经过多少跳子 Agent (`hop=1..N`)，始终锁定初始 `requester`</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 外部不可信输入进入后全链路传播 `untrusted=True` 污点标签</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 彻底终结子 Agent 洗白身份提权的 Confused Deputy 漏洞</text>

  <rect x="424" y="258" width="352" height="96" rx="8" fill="#162A3E" stroke="#10B981" stroke-width="1"/>
  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 2：应用级全局 `.All` 凭据物理气隙</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 租户级全局应用密钥与高管专属资源存入 restricted-budget</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• record-owner 阻断跨用户读取 + restricted-data-boundary</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 交互式 Agent 100% 强制使用 Entra OBO 委派权限，零全局权限</text>

  <rect x="424" y="364" width="352" height="100" rx="8" fill="#162A3E" stroke="#F59E0B" stroke-width="1"/>
  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 3：OBO 权限交集缩减与带外加密 HITL 硬锁</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 有效权限 = `User_Scopes ∩ Agent_Allowed_Scopes` (单向缩减)</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 写/付款动作强制校验带外 FIDO2 WebAuthn 签名与 `plan_hash`</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ untrusted-write 阻断聊天框伪造批准文本与静默提权</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
  <text x="438" y="496" fill="#FDA4AF" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 4：IdP 身份厂商账户只读与原始请求方支付锁</text>
  <text x="438" y="518" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• tool-allowlist 禁用 update_trust + fixed-business-output</text>
  <text x="438" y="538" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• original-requester-payment 拦截 $7,150 伪造席位扩容电汇</text>
  <text x="438" y="556" fill="#FB7185" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ IAM 架构总监 + 财务总监 FIDO2 双签放行身份许可账单</text>

  <!-- Right Column: Matrix & Metrics -->
  <rect x="808" y="106" width="368" height="476" rx="12" fill="#111C24" stroke="#10B981" stroke-width="1.5"/>
  <text x="826" y="136" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">📊 三大身份模式对比与 1,710 断言！</text>

  <rect x="822" y="152" width="340" height="196" rx="8" fill="#172A36" stroke="#334155" stroke-width="1"/>
  <text x="836" y="176" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">企业 Agent 身份与权限委托三大模式对比：</text>
  <text x="836" y="200" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" font-weight="700">1. Entra Agent ID + OBO + 带外 FIDO2 HITL (🏆)</text>
  <text x="836" y="218" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   BRK-803/804 100% 拦截 | 权限交集缩减 + 审计可追溯至人+Agent</text>
  <text x="836" y="240" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">2. Managed Identity (应用级身份 `.All` 权限)</text>
  <text x="836" y="258" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   仅适用于无用户后台批处理；用于对话 Agent 必导致跨用户越权</text>
  <text x="836" y="280" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">3. 聊天框内询问“请输入 Yes 确认” (In-Band HITL)</text>
  <text x="836" y="298" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   极易被注入伪造确认状态或诱导用户盲目点同意 (Consent Fatigue)</text>
  <text x="836" y="320" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">4. 所有子 Agent 透传同一个超级管理员静态 API Key</text>
  <text x="836" y="338" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   一处子 Agent 被注入即全网沦陷，且审计日志完全无法区分是谁</text>

  <rect x="822" y="362" width="340" height="204" rx="8" fill="#0D2329" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="836" y="388" fill="#67E8F9" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14" font-weight="700">🏆 确定性基准回归达成 (Round 397)</text>
  <text x="836" y="414" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 对抗演练场景总数：<tspan fill="#67E8F9" font-weight="700">822 个</tspan> (819 对抗 + 3 基线)</text>
  <text x="836" y="438" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• Pytest 参数化检查：<tspan fill="#6EE7B7" font-weight="700">974 项 100% PASS</tspan></text>
  <text x="836" y="462" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 确定性策略断言数：<tspan fill="#FBBF24" font-weight="700">1,710 项</tspan> (🏆 突破 1,710 里程碑！)</text>
  <text x="836" y="486" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 交互式靶场攻击向量：<tspan fill="#F472B6" font-weight="700">808 个</tspan></text>
  <text x="836" y="510" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 双语架构与选型指南：<tspan fill="#A78BFA" font-weight="700">397 篇 FAQ (216 篇指南)</tspan></text>
  <text x="836" y="538" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">新增测试：BRK-803 (OBO/Confused Deputy 注入) &amp; BRK-804 ($7,150 拦截)</text>

  <!-- Footer -->
  <rect x="20" y="596" width="1160" height="64" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="42" y="622" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">架构师核心铁律：</text>
  <text x="155" y="622" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">交互式 Agent 严禁使用应用级 Managed Identity (`.All`) 调业务 API；必须使用 Entra Agent ID + OBO 权限交集缩减与带外 plan_hash 签名审批！</text>
  <text x="42" y="644" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">Repository: turbo998/ai-security-lab (main) · Enterprise AI Security Architecture &amp; Product Selection Series · Round 397 (2026-11-20)</text>
</svg>
