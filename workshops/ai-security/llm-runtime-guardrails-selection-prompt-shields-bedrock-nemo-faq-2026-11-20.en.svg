  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Air-Gap Layer: Blocklist &amp; Classifier Threshold Isolation</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Custom denied-topic regexes &amp; thresholds in restricted-budget</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• record-owner blocks read_record + zero logit score echoing</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Prevents gradient-free threshold probing &amp; blocklist extraction</text>

