  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Unconditionally tags external data `untrusted=True` even on PASS</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Even if a novel cipher evades the classifier, taint remains 100%</text>

