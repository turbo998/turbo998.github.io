  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Denied-Topic Regex &amp; Threshold Probing Leak (BRK-805)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Prompt injection in false-positive appeal or cipher probe</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Reads restricted-budget custom blocklists &amp; logit thresholds</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exfiltrates fine-tuned Llama Guard weights &amp; regex rules</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Enables white-box GCG adversarial suffix generation</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. `Fail-Open` Timeout Bypass &amp; Polite Abuse (BRK-805)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Floods guardrail API to trigger `Fail-Open` timeout bypass</text>
