  <text x="42" y="73" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13">BRK-805 &amp; BRK-806 · 🏆 810-Vector Milestone · Why Probabilistic Guardrails Alone Fail on Agents: Two-Layer Defense with Broker</text>

