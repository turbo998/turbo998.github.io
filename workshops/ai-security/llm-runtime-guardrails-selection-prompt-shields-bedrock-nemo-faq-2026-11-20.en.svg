  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Enforces `Fail-Closed` on guardrail timeouts &amp; Groundedness</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• `broker.py` blocks tainted tool writes in 0.025ms regardless of prose</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ untrusted-write stops polite business-logic tool abuse</text>

