<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad356" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad356" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad356" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad356" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad356)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad356)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 356 · 🏆 740 SCENARIOS &amp; 810 PYTEST MILESTONE · WORKERS' COMP TPA (SEDGWICK / GALLAGHER BASSETT / GUIDEWIRE) &amp; OSHA 300</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业工伤保险与第三方理赔管理 (Sedgwick/Guidewire)、OSHA 300 上报与医疗审单 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">SIU 反诈调查卷宗与个案赔款准备金 (Case Reserve) 物理气隙 + 州工伤医疗费率表 (OMFS) 与 OSHA 上报硬锁 vs. 伤情报告注入与 MSA 托管电汇诈骗 (BRK-721 / BRK-722)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad356)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业工伤理赔 TPA 与医疗审单三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 独立法医鉴定 (IME) / 账单注入窃取赔付底牌 (BRK-721)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 恶意医疗机构或索赔律师上传的工伤鉴定报告 (IME / QME) 与</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  CMS-1500 医疗账单附件 PDF 夹带间接提示词注入</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 诱导 Agent 跨库读取个案精算赔款准备金上限 (Case Reserve)、</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  SIU 反欺诈跟拍调查底稿及和解底价 (Settlement Authority)</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 绕过州法定工伤费率表 (OMFS) 与压制 OSHA 上报 (BRK-721)</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令在医療账单复核系统 (Mitchell/CorVel) 中豁免州法定</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  费率表 (OMFS) 折算，按 100% 虚高挂牌价全额放行复合药膏账单</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 或将重伤住院事故在 OSHA 300/300A 台账中降级为“仅急救”</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：工伤医疗基金被骗保掏空与 OSHA 瞒报重罚</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造工伤买断和解 (C&amp;R) 与 MSA 医保留存电汇诈骗 (BRK-722)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造工伤委员会批准的一次性买断和解协议 (Compromise &amp;</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  Release) 或联邦医保留存账户 (WCMSA) 结构化年金托管通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 收款账户并电汇 $5,220 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-size="11" font-weight="700">• 违规触发：触发 CMS 联邦医保双倍追偿与托管赔款被盗</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad356)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业工伤理赔与 OSHA 合规零信任架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: FROI/SROI 报案单与医疗账单清洗提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离法医病历与律师函中的隐藏提示词，仅提取 IAIABC EDI</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  强类型槽位 (CPT/HCPCS 代码、ICD-10、MMI 伤残等级、误工天数)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 个案准备金与 SIU 反诈卷宗物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 精算个案准备金阶梯 (Stairstep Reserves)、SIU 视频侦查卷宗</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  与和解授权底线存入物理气隙域 (restricted-budget)</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性州法定费率表 (OMFS) 与 OSHA 24h 上报硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 医疗账单赔付上限由确定性代码按州 OMFS / DRG 费率表硬性折算；</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  住院/截肢/死亡事件强制锁定 OSHA 300 登记与 8/24 小时上报</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断超标赔付与瞒报</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: WCMSA 医保托管与年金公司白名单只读锁</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中 CMS 批准托管账户与年金机构只读 (tool-</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  allowlist + fixed-business-output) + original-requester-payment</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad356)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流企业工伤 TPA 与医疗审单安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性工伤网关 + 准备金气隙 + OMFS/OSHA 硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-721/722 拦截率 100% | 满足 OSHA 29 CFR 1904 &amp; CMS</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Guidewire ClaimCenter / Sedgwick Ventiv 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法阻止医疗账单复核机器人在病历 PDF 注入下豁免 OMFS 折算</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备各州工伤 CPT 折算表、AMA 伤残指南与 WCMSA 算术语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统工伤理赔员与护士个案管理师 (NCM) 人工审阅病历</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 单名理赔员背负 150+ 活跃案件，极易漏审升级编码与重复收费</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 356 · 740 场景！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：豁免折算、准备金外泄与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取个案准备金与 SIU 卷宗 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断豁免 OMFS 折算与抹除 OSHA (business-result)</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向索赔律师外传和解授权底线</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 WCMSA 托管库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,220 伪造买断和解电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 356 · 🏆 740 个场景 &amp; 810 项 Pytest 检查双重里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 准备金与 SIU 调查气隙：个案赔款准备金上限 (Case Reserves)、SIU 反欺诈侦查卷宗与病历/账单解析 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 OMFS 费率折算与 OSHA 硬锁：工伤医疗赔付强制执行各州法定费率上限，住院/截肢事件不可逆写入 OSHA 300 台账</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. CMS WCMSA 核准与买断双签：一次性买断和解 (C&amp;R) 必须绑定工伤法官裁定书哈希与 CMS 医保留存核准函；锁定 trust-registry</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：🏆 740 个场景 (737 风险 + 3 基线) | 🏆 810 项 Pytest 检查 | 1,546 项断言 | 726 个交互向量 | 356 篇双语 FAQ (174 篇指南) | BRK-721/722</text>
</svg>
