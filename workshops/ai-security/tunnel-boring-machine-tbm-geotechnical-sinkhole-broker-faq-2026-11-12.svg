    AI 解决方案架构师 · Round 87 (470 项断言里程碑)：跨江盾构机 TBM、土舱防坍塌与深基坑伺服支撑能力网关
  </text>
  <text x="44" y="84" fill="#fef3c7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600">
