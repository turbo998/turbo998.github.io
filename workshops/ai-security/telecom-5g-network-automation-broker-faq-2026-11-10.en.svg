  <text x="68" y="230" fill="#e4e4e7" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Rogue Peer AS embeds fake NOC failover SOP inside RFC 9003 BGP shutdown text or SNMP sysDescr</text>
