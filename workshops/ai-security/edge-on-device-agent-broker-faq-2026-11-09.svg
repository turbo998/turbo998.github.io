<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg18" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="redCard18" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#450A0A" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.5"/>
