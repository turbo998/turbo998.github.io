  <text x="653" y="216" fill="#6ee7b7" font-size="13.5" font-weight="700">1. 岸基在线 GC + SIL-3 伺服液位密度计 (LTD) 硬联锁 + untrusted-write</text>
  <text x="653" y="238" fill="#f1f5f9" font-size="12">• 上下进液阀门由岸基实测密度差硬件 PLC 闭锁；BOG 压缩机与泄压阀走独立 2oo3 硬线回路</text>
  <text x="653" y="256" fill="#34d399" font-size="11.5" font-weight="700">✓ 外轮 GC 报告染色会话 (untrusted=True) 写操作被 rule="untrusted-write" 0.0248ms 拦截</text>

  <rect x="637" y="280" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-size="13.5" font-weight="700">2. 气隙战略盐穴储气库与管网 HCA 缺陷金库隔离 (record-owner + data-boundary)</text>
  <text x="653" y="326" fill="#f1f5f9" font-size="12">• 交接初筛 Agent (actor="calendar") 跨主体读取 restricted-budget 储气库与管网缺陷库被拒绝</text>
  <text x="653" y="344" fill="#f1f5f9" font-size="12">• 任何包含战略储气库垫底气余量或干线环焊缝裂纹 GPS 的外发消息被出境边界死死卡住</text>
  <text x="653" y="358" fill="#34d399" font-size="11.5" font-weight="700">✓ 冬季能源保供命脉保护：战略储气底牌与高后果区坐标 0 越权读取、0 外部泄露</text>

  <rect x="637" y="378" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="402" fill="#6ee7b7" font-size="13.5" font-weight="700">3. SIGTTO 合规船东/贸易商表只读锁定与岸基计量双签结算</text>
  <text x="653" y="424" fill="#f1f5f9" font-size="12">• tool-allowlist + fixed-business-output 严禁 AI 修改 trust-registry 合规 LNG 贸易商表</text>
  <text x="653" y="442" fill="#34d399" font-size="11.5" font-weight="700">✓ original-requester-payment 阻断外轮单据发起的 $4,990 滞期费与热值升水盗刷</text>

  <rect x="637" y="476" width="510" height="82" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="500" fill="#6ee7b7" font-size="13.5" font-weight="700">4. 全链路 SHA-256 审计收据与 NFPA 59A / EN 1473 / SIGTTO 合规证明</text>
  <text x="653" y="522" fill="#f1f5f9" font-size="12">• 纯内存策略判定 P50 = 0.0248ms / P95 = 0.0409ms；含 SQLite WAL 收据落盘 P50 = 7.21ms</text>
  <text x="653" y="542" fill="#34d399" font-size="11.5" font-weight="700">✓ 满足 NFPA 59A 超低温防爆、PHMSA 管道完整性与国家关键能源基础设施审计要求</text>

