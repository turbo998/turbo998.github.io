  <rect x="30" y="22" width="1140" height="92" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="52" y="54" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1">AI SOLUTION ARCHITECT · 2026-11-12 ROUND 79 DEEP DIVE (LNG -162°C TERMINAL ANTI-ROLLOVER, SMART-PIG PIPELINE &amp; SALT CAVERN)</text>
  <text x="52" y="82" fill="#f8fafc" font-size="20" font-weight="800">液化天然气接收站 LNG -162°C 防翻滚、智能清管器与战略储气库 AI Agent：SIL-3 联锁 + 能力网关一图流</text>
  <text x="52" y="103" fill="#94a3b8" font-size="12.5">外轮 GC 气质单注入、重液底进诱发储罐翻滚 (Rollover)/停运 BOG、战略盐穴与管网裂纹窃密及 $4,990 滞期费盗刷 vs. 密度硬联锁 + 能力网关 (438 项断言通过)</text>

  <!-- Left Column: Vulnerable Baseline -->
