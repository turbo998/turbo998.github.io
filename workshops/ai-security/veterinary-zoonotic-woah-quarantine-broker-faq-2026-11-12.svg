  <rect x="637" y="280" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-size="13.5" font-weight="700">2. 气隙曾祖代 (GGP) 种源基因与 BSL-3 毒株金库隔离 (record-owner + data-boundary)</text>
  <text x="653" y="326" fill="#f1f5f9" font-size="12">• 检疫初筛 Agent (actor="calendar") 跨主体读取 restricted-budget 种源与毒株库被立即拒绝</text>
  <text x="653" y="344" fill="#f1f5f9" font-size="12">• 任何包含原种猪 SNP 育种矩阵或高致病性人畜共患毒株序列的外发消息被出境边界死死卡住</text>
  <text x="653" y="358" fill="#34d399" font-size="11.5" font-weight="700">✓ 种业芯片与生物安全保密：GGP 核心种源与毒株序列 0 越权读取、0 外部泄露</text>

  <rect x="637" y="378" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="402" fill="#6ee7b7" font-size="13.5" font-weight="700">3. 合规无害化处理商表只读锁定与官方兽医 RFID 耳标绑定结算</text>
  <text x="653" y="424" fill="#f1f5f9" font-size="12">• tool-allowlist + fixed-business-output 严禁 AI 修改 trust-registry 合规处理商表</text>
  <text x="653" y="442" fill="#34d399" font-size="11.5" font-weight="700">✓ original-requester-payment 阻断外部公证单发起的 $4,990 扑杀财政补贴电汇</text>

  <rect x="637" y="476" width="510" height="82" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="500" fill="#6ee7b7" font-size="13.5" font-weight="700">4. 全链路 SHA-256 审计收据与 WOAH 陆生法典 / 兽药 GMP 合规证明</text>
  <text x="653" y="522" fill="#f1f5f9" font-size="12">• 纯内存策略判定 P50 = 0.0248ms / P95 = 0.0409ms；含 SQLite WAL 收据落盘 P50 = 7.21ms</text>
  <text x="653" y="542" fill="#34d399" font-size="11.5" font-weight="700">✓ 满足世界动物卫生组织 (WOAH/OIE)、兽药 GMP 与国家生物安全法合规审计</text>

