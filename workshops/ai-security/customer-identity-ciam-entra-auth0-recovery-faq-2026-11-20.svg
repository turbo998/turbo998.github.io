<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad375" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad375" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad375" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad375" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad375)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad375)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 375 · 🏆 375-FAQ, BRK-760 &amp; 1,622-ASSERTION MILESTONE · CUSTOMER IDENTITY (CIAM: ENTRA EXTERNAL ID / AUTH0 / PINGONE)</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">客户身份与访问管理 (CIAM：Entra External ID/Auth0)、B2B 联邦与 Passkey 恢复 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">签名密钥与设备风控底表物理气隙 + FIDO2 Passkey 重置与联邦证书硬锁 vs. 解锁工单注入植入 Golden SAML 与赏金诈骗 (BRK-759 / BRK-760)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad375)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 客户身份管理 (CIAM) 与账户恢复三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① B2B 联邦元数据/解锁工单注入窃取风控底牌 (BRK-759)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 外部客户提交的账户恢复申诉单或 B2B SAML 联邦元数据 XML 夹带</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  隐藏提示词，诱导 CIAM 运维 Agent 跨权限读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取 OAuth 2.0 客户端签名密钥、撞库防护设备指纹特征权重</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  及高净值个人/企业租户超级管理员 (Delegated Admin) 映射表</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 绕过 Passkey/MFA 重置接管账户与植入 Golden SAML</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，在未完成活体人脸/证件核身下</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  重置目标高管客户的 FIDO2 Passkey 并降级为短信验证码登录</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 或在 B2B 客户组织名下挂载黑客自控的 SAML X.509 根证书</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：跨租户企业客户全员账户被一键伪造登录 (ATO)</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造漏洞赏金 (Bug Bounty) 与短信通道充值诈骗 (BRK-760)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造众测平台 (HackerOne / Bugcrowd) 身份认证绕过 P1 漏洞</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  加急赏金兑付单或国际短信验证码网关 (Twilio) 欠费停机充值通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 托管账户并电汇 $6,050 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：虚假白帽漏洞骗取高额赏金与短信轰炸 (SMS Pumping) 资损</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad375)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 客户身份管理 (CIAM) 零信任确定性防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 申诉工单/SAML XML 清洗与强类型槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离恢复工单与 XML 注释中的隐藏指令，仅提取强类型槽位</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  (租户 Org ID、Verified ID 活体核验令牌、DNS TXT 域名所有权证明)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断申诉单提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 签名私钥、风控模型与 VIP 身份图谱物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• OIDC/SAML 令牌签名密钥 (HSM)、Bot 防护指纹阈值与 VIP 客户</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  关联图谱严格隔离在 restricted-budget 物理气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 eKYC 活体核身与联邦域名 DNS TXT 硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 重置 Passkey 强制校验政府证件 + 活体生物识别 (Entra Verified ID)；</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  挂载 B2B 联邦 IdP 强制核验企业域名 DNS TXT 记录，严禁 AI 跳过</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断 MFA 降级与伪造联邦</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 众测赏金池与短信运营商账户只读锁 + 双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中众测托管与运营商账户只读 (tool-allowlist +</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad375)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流客户身份管理 (CIAM) 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性 CIAM 网关 + 风控气隙 + eKYC/DNS 硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-759/760 拦截率 100% | 满足 NIST 800-63B AAL3 &amp; PSD3</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Entra External ID / Okta Auth0 / PingOne 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止客服解锁 Bot 在工单注入下越权解绑客户 MFA 设备</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 WebAuthn 证明链、SAML X.509 指纹与 DNS TXT 语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统客服中心人工接听电话核对“母亲娘家姓/生日”重置密码</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 极易被黑产社工话术 (Scattered Spider 模式) 攻破接管账户</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 375 · 375 篇 FAQ！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：Passkey 被解绑、风控泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取签名密钥与风控阈值 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断跳过 eKYC 解绑 Passkey 与挂载伪造 IdP</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传设备指纹特征与超管列表</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定赏金与运营商库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $6,050 伪造漏洞赏金电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 375 · 🏆 375 篇双语 FAQ、BRK-760 &amp; 1,622 项断言三大里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 签名私钥与反欺诈风控气隙：令牌签名私钥、设备指纹规则与客服账户解锁 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 Verified ID 活体核身与 DNS TXT 锁：重置 Passkey 强制密码学核身，挂载 B2B 联邦强制校验域名所有权</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 众测赏金托管与短信通道只读锁：锁定 trust-registry，漏洞赏金与通道结算强制经安全负责人双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：778 个场景 (775 风险 + 3 基线) | 886 项 Pytest 检查 | 🏆 1,622 项断言 | 764 个交互向量 | 🏆 375 篇双语 FAQ (194 篇指南) | 🏆 BRK-759/760</text>
</svg>
