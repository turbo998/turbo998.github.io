  <text x="66" y="314" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fed7aa">• 地下 1000m 原岩应力达 24MPa，盐岩蠕变率 ∝ (σv-P)⁵：</text>
  <text x="66" y="332" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fed7aa">  抽空垫底气至 2.5MPa 令蠕变暴增 3.2 倍，拱顶 800 吨泥岩</text>
  <text x="66" y="354" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">  夹层拉裂崩落砸断千米中心注采管柱并诱发地表天坑塌陷</text>
  <text x="66" y="372" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 储氢盐穴注压升至 21MPa 突破套管鞋 18.2MPa 破裂压力：</text>
  <text x="66" y="394" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fda4af">  高压 H2 劈开固井水泥环向浅层含水层与地面窜漏引爆</text>

  <rect x="54" y="424" width="324" height="92" rx="8" fill="#18060a" stroke="#991b1b" stroke-width="1"/>
  <text x="66" y="446" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#f87171">3. Baseline 评测结果 (BRK-225 &amp; BRK-226)</text>
