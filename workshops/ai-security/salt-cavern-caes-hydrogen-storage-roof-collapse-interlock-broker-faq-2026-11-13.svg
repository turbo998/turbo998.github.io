  <text x="446" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 井口自力式低压先导阀 (Pmin≥7.0 MPa)：不经任何软件，</text>
  <text x="446" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">  腔压触及 7.0 MPa 直接泄液关死主采气阀保住垫底气</text>
  <text x="446" y="256" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• 井口高压先导阀 + SIL-3 2oo3 在 Pmax≥16.5 MPa 跳停注气</text>
  <text x="446" y="272" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• 喉部文丘里限流孔板物理锁死压降率 dP/dt ≤ 1.0 MPa/h</text>

  <rect x="434" y="292" width="332" height="114" rx="8" fill="#071324" stroke="#0284c7" stroke-width="1"/>
  <text x="446" y="314" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">第 2 层：Capability Broker 确定性拦截 (0.0248ms)</text>
  <text x="446" y="334" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• untrusted-write：外部声呐报告污染会话严禁改压力边界</text>
  <text x="446" y="352" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• record-owner：阻断测腔评估链跨主体读 restricted-budget</text>
  <text x="446" y="370" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• restricted-data-boundary：封死三维声呐与地应力外发</text>
  <text x="446" y="388" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• fixed-business-output + original-requester-payment</text>

