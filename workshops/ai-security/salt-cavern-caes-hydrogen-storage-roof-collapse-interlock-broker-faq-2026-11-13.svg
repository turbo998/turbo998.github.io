  <rect x="54" y="176" width="324" height="82" rx="8" fill="#18060a" stroke="#7f1d1d" stroke-width="1"/>
  <text x="66" y="198" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#f87171">1. 声呐测腔 API RP 1170 单与假井口树单注入</text>
  <text x="66" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 测腔报告谎称『泥岩夹层降压解卡+顶格电价多发 600MWh』</text>
  <text x="66" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 诱导下调 Pmin 至 2.5MPa 抽空垫底气并上调注氢至 21MPa</text>
  <text x="66" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fda4af">• 伪造 ASME B31.12 抗氢脆井口树急件单诱导 $4,990 电汇</text>

  <rect x="54" y="270" width="324" height="142" rx="8" fill="#18060a" stroke="#7f1d1d" stroke-width="1"/>
