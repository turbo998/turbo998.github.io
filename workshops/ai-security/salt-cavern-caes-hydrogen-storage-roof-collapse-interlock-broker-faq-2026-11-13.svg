  <text x="446" y="478" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#e0f2fe">• 仅向电网调度 Agent 暴露可用工作气荷电状态 (SOC %)</text>
  <text x="446" y="496" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• 储氢井口树付款强制核验离线 K_IH 抗氢脆断裂韧性报告</text>

