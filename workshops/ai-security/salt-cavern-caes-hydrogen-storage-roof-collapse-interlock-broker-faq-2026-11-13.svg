  <text x="52" y="96" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#94a3b8">声呐测腔 API RP 1170 报告注入 vs. 井口机械低压先导阀死守 Pmin≥7MPa 垫底气 + 套管鞋 Pmax≤16.5MPa 硬切 + 气隙声呐库 (BRK-225 &amp; BRK-226)</text>

