  </text>
  <text x="44" y="708" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">
    验证命令：.\.venv\Scripts\pytest.exe tests/test_regressions.py -k "round102" -q  —— 530 项断言里程碑 / 102 篇 FAQ / 232 场景 / 218 向量全部通过
  </text>
