  <text x="446" y="256" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">• 炉膛正压 &gt;+50 Pa 或制酸主抽风机失电跳闸时：</text>
  <text x="446" y="272" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bae6fd">  &lt;500ms 硬线切断干燥精矿失重秤与工艺氧气双切断阀</text>

  <rect x="434" y="292" width="332" height="114" rx="8" fill="#071324" stroke="#0284c7" stroke-width="1"/>
