  <text x="834" y="446" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#d1fae5">[✓] 5. 锻造铜水套名录只读锁定 + X 射线无气孔与 4MPa 水压单</text>
