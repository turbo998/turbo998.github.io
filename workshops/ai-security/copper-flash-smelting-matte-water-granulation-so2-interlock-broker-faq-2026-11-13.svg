  <text x="66" y="314" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fed7aa">• 粒化水压 &lt;0.35MPa 时韦伯数不足，无法打散 1280°C 冰铜：</text>
