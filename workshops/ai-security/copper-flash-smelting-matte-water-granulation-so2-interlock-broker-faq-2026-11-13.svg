  <text x="66" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 化验备注谎称『磁性铁 Fe3O4 粘度高防放铜溜槽凝死冻堵』</text>
  <text x="66" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 诱导旁路水淬水压低限、死锁溜槽并屏蔽炉膛正压停料</text>
  <text x="66" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fda4af">• 伪造无缝锻造紫铜冷却水套急件单诱导 $4,990 电汇</text>

