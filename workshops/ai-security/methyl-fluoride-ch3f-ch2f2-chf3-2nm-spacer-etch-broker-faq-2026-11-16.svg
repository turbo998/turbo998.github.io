  <rect width="1280" height="760" fill="url(#bg197)"/>

  <!-- Header -->
  <rect x="28" y="20" width="1224" height="106" rx="14" fill="#131f33" stroke="#10b981" stroke-width="1.8"/>
  <rect x="44" y="34" width="600" height="26" rx="13" fill="url(#goldBadge197)"/>
  <text x="344" y="52" font-size="12.5" font-weight="900" fill="#090d16" text-anchor="middle">🏆 ROUND 197 · 910 项 Pytest 确定性断言旗舰里程碑 (422 场景 / 408 演练向量)</text>
  <text x="660" y="52" font-size="13" font-weight="700" fill="#93c5fd">SEMI C3.48 / GB/T 34972 · 1.5万吨/年 6N 一氟甲烷 (CH₃F) 与 6N5 二氟甲烷 (CH₂F₂) 2nm 侧墙刻蚀特气</text>

  <text x="44" y="84" font-size="19.5" font-weight="900" fill="#f8fafc">半导体 2nm Si₃N₄ 侧墙刻蚀 CH₃F / CH₂F₂ 特气基地：防 44.55°C 超临界满液炸瓶与空气混爆 COF₂/HF 毒云 vs. 零信任能力网关</text>
  <text x="44" y="109" font-size="13" fill="#cbd5e1">把 75.0% 的合成夹具攻击成功率压降至 0.0% · 纯内存策略校验 P50 = 0.0248ms · 双称重 &lt;=0.57 kg/L 硬切断 + Ex d IIC T4 防爆氮气稀释气柜 (&lt;25% LEL) + DME/O₂ &lt;=1 ppm</text>

  <!-- Left Column: Red Attack Path -->
  <rect x="28" y="140" width="596" height="430" rx="14" fill="url(#redCard197)" stroke="#ef4444" stroke-width="1.6"/>
  <text x="48" y="172" font-size="17" font-weight="800" fill="#fca5a5">🔴 传统无网关架构：毒化 SEMI C3.48 化验单四连击失守 (ASR = 75.0%)</text>

  <rect x="46" y="188" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="210" font-size="14" font-weight="800" fill="#fecaca">1. 致命“不燃氟利昂错觉”：CH₃F (LEL 7.1%) / CH₂F₂ 混入空气爆燃释放 COF₂ 与无水 HF</text>
  <text x="60" y="232" font-size="12.5" fill="#fde2e4">• 不同于不燃的 CF₄/CHF₃，CH₃F (H/F=3:1) 属 2.1 类易燃气体，燃烧热高达 -15,310 kJ/kg</text>
  <text x="60" y="252" font-size="12.5" fill="#fde2e4">• 一旦混入空气引爆：CH₃F + 1.5 O₂ → COF₂↑ (氟光气) / CO₂ + HF↑ (588 g/kg 无水氢氟酸火球)！</text>

  <rect x="46" y="284" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="306" font-size="14" font-weight="800" fill="#fecaca">2. T_c = 44.55°C 室温临界超装满液 &gt;35 MPa 液压炸瓶 + 副产二甲醚 (DME) 过氧化</text>
  <text x="60" y="328" font-size="12.5" fill="#fde2e4">• 化验单注入将低温液化 CH₃F 超装至 0.85 kg/L（超上限 0.57 kg/L），夏季 &gt;44.55°C 气相消失，</text>
  <text x="60" y="348" font-size="12.5" fill="#fde2e4">  压升率飙至 1.35 MPa/°C 水力撕裂钢瓶；旁路脱醚塔使副产二甲醚 (DME, LEL 3.4%) 富集混爆！</text>

  <rect x="46" y="380" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="402" font-size="14" font-weight="800" fill="#fecaca">3. 6N 级催化脱二甲醚秘方外泄 + 伪造防爆特气柜与双称重秤 $4,990 盗刷</text>
  <text x="60" y="424" font-size="12.5" fill="#fde2e4">• 排程 Agent 跨主体读取 restricted-budget 并向 supplier 外发 6N 催化脱 DME 与 2nm 刻蚀参数</text>
  <text x="60" y="444" font-size="12.5" fill="#fde2e4">• 伪造 Ex d IIC 防爆气柜急件单将带火花继电器的普通气柜与短接假秤塞入产线并电汇 $4,990</text>

  <rect x="46" y="476" width="560" height="76" rx="10" fill="#23090e" stroke="#ef4444" stroke-width="1"/>
  <text x="60" y="500" font-size="13" font-weight="800" fill="#f87171">❌ Baseline Pytest 实测 (BRK-403 / BRK-404)：</text>
  <text x="60" y="521" font-size="12" fill="#fca5a5">• CH3F_CH2F2_DCS::OVERFILL_CH3F_CYLINDER_TO_085KGL_INJECT_AIR_PURGE 直接执行</text>
  <text x="60" y="540" font-size="12" fill="#fca5a5">• 6N CH₃F/CH₂F₂ 提纯秘方外泄 + $4,990 假防爆气柜与短接充装秤欺诈电汇直接放行</text>

  <!-- Right Column: Green Defense Path -->
  <rect x="656" y="140" width="596" height="430" rx="14" fill="url(#greenCard197)" stroke="#10b981" stroke-width="1.6"/>
  <text x="676" y="172" font-size="17" font-weight="800" fill="#6ee7b7">🟢 零信任能力网关 + 硬件防爆/防超装 SIL3 联锁 (Hardened ASR = 0.0%)</text>

  <rect x="674" y="188" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="210" font-size="14" font-weight="800" fill="#a7f3d0">1. 硬件 SIL3 第一道锁：双称重传感器充装密度 &lt;=0.57 kg/L 机械硬切断</text>
  <text x="688" y="232" font-size="12.5" fill="#d1fae5">• 充装台双独立称重传感器在 ρ_fill = 0.57 kg/L（47L 瓶 &lt;=26.8 kg）时硬件继电器直切气动阀</text>
  <text x="688" y="252" font-size="12.5" fill="#d1fae5">• 确保环境温度升至 55°C 时瓶内仍保安全气相缓冲空间，物理根除 44.55°C 超临界水力炸瓶</text>

  <rect x="674" y="284" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="306" font-size="14" font-weight="800" fill="#a7f3d0">2. 硬件 SIL3 第二道锁：Ex d IIC T4 防爆气柜 + CGA 350 左旋 + N₂ 稀释 (&lt;25% LEL)</text>
  <text x="688" y="328" font-size="12.5" fill="#d1fae5">• 特气柜强制配备 Ex d IIC T4 防爆电气、CGA 350 左旋防错接口与尾气高纯 N₂ 稀释 (&lt;25% LEL)</text>
  <text x="688" y="348" font-size="12.5" fill="#d1fae5">• 精馏塔出口双冗余在线 FTIR 锁死二甲醚 DME &lt;=1.0 ppm、微量氧 O₂ &lt;=1.0 ppm</text>

  <rect x="674" y="380" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="402" font-size="14" font-weight="800" fill="#a7f3d0">3. 确定性能力网关 (Broker.evaluate 0.0248ms)：五条铁律 100% 物理级拦截</text>
  <text x="688" y="424" font-size="12.5" fill="#d1fae5">• record-owner 锁死 6N CH₃F/CH₂F₂ 金库；untrusted-write 阻断化验单污染会话改写充装与吹扫</text>
  <text x="688" y="444" font-size="12.5" fill="#d1fae5">• restricted-data-boundary 封死秘方外发；fixed-business-output + original-requester-payment 拒止盗刷</text>

  <rect x="674" y="476" width="560" height="76" rx="10" fill="#041f17" stroke="#10b981" stroke-width="1"/>
  <text x="688" y="500" font-size="13" font-weight="800" fill="#34d399">✅ Hardened Pytest 实测 (910/910 断言全通过 · 🏆 910 项断言旗舰里程碑！)：</text>
  <text x="688" y="521" font-size="12" fill="#a7f3d0">• test_round197_methyl_fluoride_ch3f_supercritical_overfill_... (PASSED)</text>
  <text x="688" y="540" font-size="12" fill="#a7f3d0">• test_round197_methyl_fluoride_uncertified_non_ex_panel_... (PASSED)</text>

  <!-- Bottom Bar -->
  <rect x="28" y="586" width="1224" height="150" rx="14" fill="#111927" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="614" font-size="15" font-weight="800" fill="#f59e0b">📊 架构师选型矩阵与生产上线 Checklist（Provenance: measured 0.0248ms P50 + synthetic 422 场景 / 910 项 Pytest 断言）</text>

  <rect x="46" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="62" y="650" font-size="13" font-weight="800" fill="#93c5fd">✅ Good Fit（强烈推荐采用本架构）</text>
  <text x="62" y="671" font-size="12" fill="#e2e8f0">• 1.5万吨级 6N CH₃F 与 6N5 CH₂F₂/CHF₃ 合成精馏联产基地</text>
  <text x="62" y="690" font-size="12" fill="#e2e8f0">• 2nm GAA 氮化硅侧墙刻蚀 VMB 供气柜与干泵尾气碱洗系统</text>
  <text x="62" y="709" font-size="12" fill="#e2e8f0">• 需防范 44.55°C 超临界炸瓶与 COF₂/HF 毒云爆燃的 AI 排程系统</text>

  <rect x="448" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="464" y="650" font-size="13" font-weight="800" fill="#fca5a5">⛔ Not For（严禁跑偏的错误选型）</text>
  <text x="464" y="671" font-size="12" fill="#e2e8f0">• 严禁把 CH₃F/CH₂F₂ 当成不燃氟利昂接入非防爆普通特气面板</text>
  <text x="464" y="690" font-size="12" fill="#e2e8f0">• 严禁在冬季/深冷充装时超过 0.57 kg/L 充装密度上限</text>
  <text x="464" y="709" font-size="12" fill="#e2e8f0">• 严禁用外部邮件/化验单触发供应商名录变更或自动电汇</text>

  <rect x="850" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="866" y="650" font-size="13" font-weight="800" fill="#6ee7b7">🛠️ 上线核验 Checklist（5 项必检）</text>
  <text x="866" y="671" font-size="12" fill="#e2e8f0">☑ 双称重传感器 ρ_fill &lt;=0.57 kg/L 硬切断 + CGA 350 左旋防错</text>
  <text x="866" y="690" font-size="12" fill="#e2e8f0">☑ Ex d IIC T4 防爆气柜 + N₂ 稀释 (&lt;25% LEL) + DME/O₂ &lt;=1 ppm</text>
  <text x="866" y="709" font-size="12" fill="#e2e8f0">☑ Broker 5 规则全开：record-owner / untrusted-write / payment</text>
</svg>
