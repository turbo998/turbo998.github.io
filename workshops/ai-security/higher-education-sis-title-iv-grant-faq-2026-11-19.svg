<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad354" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad354" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad354" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad354" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad354)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad354)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 354 · 🏆 802 PYTEST CHECKS HISTORIC MILESTONE · HIGHER ED SIS (ELLUCIAN BANNER / WORKDAY), TITLE IV FAFSA &amp; NIH/NSF GRANTS</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">高校教务与财务系统 (Ellucian Banner/Workday)、Title IV 助学金与科研经费分包 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">捐赠基金持仓与大额校友捐赠档案物理气隙 + Title IV 幽灵学生考勤与 SAP 学业达标硬锁 vs. 助学金申诉注入骗取退费与科研分包电汇诈骗 (BRK-717 / BRK-718)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad354)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 高校助学金发放与科研经费三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 助学金特殊裁量申诉注入窃取捐赠人与招生底表 (BRK-717)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• “幽灵学生 (Ghost Student)”黑产团伙上传的 FAFSA 特殊经济困难</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  申诉 (Professional Judgment) PDF 夹带间接提示词注入</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 诱导 Agent 跨库读取校董会百亿捐赠基金 (Endowment) 另类</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  投资底稿、顶级校友财富背调档案及特招内部评分表</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 幽灵学生批量套取 Pell 助学金与学贷退费 (BRK-717)</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令在 Banner/Workday Student 中将家庭贡献指数 (SAI)</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  强制清零，并豁免学业进展达标 (SAP) 与到课考勤核验冻结</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 自动触发向幽灵学生银行卡发放学贷结余退费 (Credit Balance)</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：教育部 Title IV 联邦拨款被诈骗与高校追缴连带责任</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造 NIH/NSF 科研课题合作分包拨款电汇诈骗 (BRK-718)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造联邦科研项目分包高校/附属医院 (Subrecipient, 2 CFR 200)</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  间接管理费 (F&amp;A Cost) 报销发票与账户变更函</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 收款账户并电汇 $5,180 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-size="11" font-weight="700">• 违规触发：国家自然科学/医学科研经费被盗与联邦审计问责</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad354)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 高校财务助学与科研经费零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 助学金申诉包 / 分包课题账单清洗提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离申诉信与分包发票中的隐藏指令，仅提取联邦 ISIR/强类型</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  槽位 (FAFSA 交易号、IRS 税表哈希、修读学分、课题号、F&amp;A 率)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 捐赠基金与校友财富档案物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 校董会捐赠基金持仓、Advancement 大额校友捐赠背调库与</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  招生委内部评分表存入物理气隙域 (restricted-budget)</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 LMS 实质出勤验证与 COD 拨款硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 学贷结余退费必须确定性核验 Canvas/Blackboard 实质学术参与</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  记录、SAP 达标及教育部 COD 授信；严禁 AI 自动豁免冻结</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断幽灵学生违规放款</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: FDP 科研分包机构库只读锁与 PI/科研院双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中分包院校 UEI 收款账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad354)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流高校 SIS 与科研财务 AI 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性高校网关 + 捐赠气隙 + 出勤/SAP 硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-717/718 拦截率 100% | 满足 FERPA、GLBA &amp; 2 CFR 200</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. Ellucian Banner / Workday Student / PowerFAIDS 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止助学金辅助机器人在申诉 PDF 注入下自动解除 Hold</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 SAI 指数、R2T4 退学追缴公式与 F&amp;A 间接费率语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统资助中心与科研院财务人工核对数万份申诉与分包单</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 开学季助学金审核积压数周，难以识别 AI 批量生成的幽灵学生</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 354 · 802 项 Pytest！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：幽灵学生放款、捐赠档案外泄与电汇 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取捐赠基金与校友档案 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断清零 SAI 与发放学贷退费 (business-result)</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断向外泄露大额捐赠人底稿</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定科研分包账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,180 伪造科研分包电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 354 · 🏆 802 项 Pytest 参数化检查历史性突破 800 大关！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 捐赠基金与招生底表气隙：校董会 Endowment 投资组合、大额校友捐赠背调库与招生特招评分与助学 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性幽灵学生拦截与 PJ 双签：Title IV 助学金退费强制绑定活体身份核验与 LMS 实质到课记录；PJ 裁量需资助主任 FIDO2 签批</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 2 CFR 200 科研分包只读锁：NIH/NSF 分包院校收款账户唯一绑定 FDP Clearinghouse，需课题负责人 (PI) 与科研院双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：736 个场景 (733 风险 + 3 基线) | 🏆 802 项 Pytest 检查 | 1,538 项断言 | 722 个交互向量 | 354 篇双语 FAQ (172 篇指南) | BRK-717/718</text>
</svg>
