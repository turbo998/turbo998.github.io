<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bg42" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="redGrad42" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="greenGrad42" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad42" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg42)"/>

  <!-- Header -->
  <rect x="30" y="22" width="1140" height="86" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="54" fill="#60a5fa" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">AI 解决方案架构师实战选型一图流 · ROUND 42 · 智能网联汽车、SDV 座舱大模型与 V2X/车队补能 AI AGENT</text>
  <text x="52" y="84" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">POI/V2X 广播注入、跨安全域控车 (CAN/SOME-IP) 与电费盗刷 vs. 物理分域 + 车速互锁 + 能力网关</text>
  <rect x="935" y="38" width="215" height="52" rx="10" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="1042" y="60" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">112 场景 · 290 项断言全通过</text>
  <text x="1042" y="79" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="800">75.0% → 0.0% ASR (0.0248ms)</text>

  <!-- Left Column: Vulnerable Architecture -->
  <rect x="30" y="124" width="555" height="440" rx="14" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="124" width="555" height="44" rx="14" fill="url(#redGrad42)"/>
  <text x="52" y="152" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">❌ 传统高危架构：座舱娱乐域大模型直通车身 SOME/IP 网关（100% 沦陷）</text>

  <rect x="52" y="184" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="208" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">1. 充电站地图 POI 评价 / 路侧广告牌 OCR / V2X 广播隐蔽注入</text>
  <text x="68" y="230" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 攻击者在超充站公共地图 POI 评论区植入伪造“TSP 高压 BMS 握手复位与解锁指令”</text>
  <text x="68" y="250" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 车载防火墙仅校验源 IP 为合法座舱域控制器 (CDC)，不感知指令源自公网不可信 POI 文本</text>

  <rect x="52" y="280" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">2. 自动关闭哨兵录像并弹开后备箱 &amp; 高管车主行程轨迹外泄</text>
  <text x="68" y="326" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 座舱 Agent 跨权读取整车密钥与高管常去住址导航轨迹库 (restricted-budget)</text>
  <text x="68" y="346" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 直接调用车身 BCM 关闭哨兵模式并解锁后备箱 (business-result)，并将轨迹回传外部服务器</text>

  <rect x="52" y="376" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="400" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">3. 恶意充电桩 OCPP 报文篡改车队 CPO 白名单与 $3,400 电费盗刷</text>
  <text x="68" y="422" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 外部改装充电桩在 OCPP 计量扩展字段注入指令，企图自加 trust-registry 优选运营商白名单</text>
  <text x="68" y="442" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 缺乏原始发起人与 BMS 物理库仑计绑定，直接诱导车队结算 Agent 划拨 $3,400 批量充电款</text>

  <rect x="52" y="472" width="510" height="74" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="68" y="497" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="800">💥 实测 Baseline 后果（BRK-93 &amp; BRK-94）：</text>
  <text x="68" y="519" fill="#fef2f2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 车辆哨兵被关且后备箱被弹开 + 高管家庭住址轨迹外泄 + $3,400 虚假充电结算直接成交！</text>
  <text x="68" y="537" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 根因：将 QM 娱乐域大模型直接桥接至 ASIL 车身控制域，违背 ISO/SAE 21434 安全域隔离原则</text>

  <!-- Right Column: Hardened Architecture -->
  <rect x="615" y="124" width="555" height="440" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="615" y="124" width="555" height="44" rx="14" fill="url(#greenGrad42)"/>
  <text x="637" y="152" fill="#d1fae5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">✅ 纵深防御架构：QM/ASIL 物理分域 + 挡位硬件互锁 + 能力网关</text>

  <rect x="637" y="184" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="208" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 1 · 座舱 QM 沙盒 + 密钥与隐私轨迹库隔离 (record-owner + Egress)</text>
  <text x="653" y="230" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 座舱娱乐 Agent (calendar) 物理隔离于 ECU 密钥与高管轨迹库外，读 restricted-budget 0.0248ms 秒拒</text>
  <text x="653" y="250" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 出口门禁 restricted-data-boundary 100% 封死车内音视频与历史行程轨迹向外部站点外发</text>

  <rect x="637" y="280" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 2 · 环境感知污点写锁 + 车速/UWB 硬件互锁 (untrusted-write)</text>
  <text x="653" y="326" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 任何摄入外部 POI 评论/路牌 OCR/V2X 的会话强制打标 untrusted=True，禁写车身 BCM 状态</text>
  <text x="653" y="346" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 中央网关硬编码 Gear==P &amp; v==0 物理互锁 + 车主 UWB 数字钥匙活体在位确认</text>

  <rect x="637" y="376" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="400" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 3 · 可信 CPO 注册表硬锁 + 充电结算血统门禁 (original-requester)</text>
  <text x="653" y="422" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• tool-allowlist + fixed-business-output 双重锁死 trust-registry，严禁运行时私加充电运营商</text>
  <text x="653" y="442" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• original-requester-payment 溯源 requester="supplier"，0.0248ms 拦截 $3,400 虚假电费划拨</text>

  <rect x="637" y="472" width="510" height="74" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="653" y="497" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="800">🛡️ 实测 Hardened 战果（Pytest 290 passed · 0 漏报 · 0 误杀）：</text>
  <text x="653" y="519" fill="#ecfdf5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 密钥轨迹零读取 + 车门/哨兵零越权篡改 + 隐私零外泄 + $3,400 电费盗刷零成交！</text>
  <text x="653" y="537" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 纯内存网关裁决延迟 P50 = 0.0248ms / P95 = 0.0409ms，单步 SQLite WAL 审计收据落盘 7.21ms</text>

  <!-- Bottom Decision Bar -->
  <rect x="30" y="582" width="1140" height="154" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="30" y="582" width="1140" height="38" rx="14" fill="url(#blueGrad42)"/>
  <text x="52" y="606" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="800">🧭 智能网联汽车 (ISO/SAE 21434) 安全架构师 30 秒选型口诀与量产核验红线（Architect Decision Cheat-Sheet）</text>

  <rect x="50" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="66" y="655" fill="#93c5fd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🟢 什么时候选方案 A（受限娱乐域语音助手）？</text>
  <text x="66" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 仅控制车载音乐、氛围灯与离线用车手册问答</text>
  <text x="66" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 物理断开车身 BCM 门锁/动力总线与车载钱包</text>

  <rect x="422" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="438" y="655" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🔴 什么时候必须选方案 B（物理分域 + 能力网关）？</text>
  <text x="438" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 涉及车门/哨兵控制、车队调度或即插即充自动结算</text>
  <text x="438" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 必须强制 QM/ASIL 分域 + 车速互锁 + Capability Broker</text>

  <rect x="794" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="810" y="655" fill="#fcd34d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🛠️ 量产上车 3 条铁律（Zero-Trust Invariants）</text>
  <text x="810" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">1. 外部 POI/V2X/OCR 会话强制 untrusted=True 禁控车</text>
  <text x="810" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">2. Gear!=P 硬熔断解锁；电费结算绑定 BMS 库仑计读数</text>
</svg>
