  <text x="42" y="136" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">⛔ Top 3 AI Denial-of-Wallet &amp; FinOps Attack Chains</text>

  <rect x="38" y="152" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Cloud EDP Discount &amp; Uncapped Master Key Leak (BRK-811)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Prompt injection in cost-anomaly ticket or FinOps billing note</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Reads restricted-budget cloud EDP/EA negotiated discount rates</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Exfiltrates uncapped root LLM API keys &amp; BU spend breakdowns</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Stolen uncapped master keys resold on darknet proxy markets</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Sponge Reasoning Loops &amp; Quota Removal (BRK-811)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Sponge prompt triggers infinite multi-agent recursive loops</text>
  <text x="50" y="362" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Mutates business-result to remove TPM caps &amp; force flagship model</text>
  <text x="50" y="382" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Poisons un-namespaced Semantic Cache across tenants</text>
  <text x="50" y="404" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">→ Burns $100K+ in overnight Pay-As-You-Go token overages</text>

  <rect x="38" y="444" width="340" height="122" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="466" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Spoofed GPU Reserved-Instance Broker Fraud (BRK-812)</text>
  <text x="50" y="488" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Forged secondary-market GPU Reserved Instance (RI) broker bill</text>
  <text x="50" y="508" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Attacks trust-registry to swap cloud MSP / FinOps vendor IBAN</text>
