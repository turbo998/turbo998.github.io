  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Gate 3: Per-User TPM Token Bucket &amp; ACL-Keyed Cache Lock</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• APIM `azure-openai-token-limit` keyed on verified JWT `oid`</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Partition Semantic Cache by `Hash(ACL_Groups)` to prevent leaks</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ untrusted-write blocks quota removal &amp; forced flagship routing</text>

