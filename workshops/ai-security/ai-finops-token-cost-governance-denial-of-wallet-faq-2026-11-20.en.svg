  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Enforces `Max_Tool_Steps ≤ 8` &amp; `Max_Completion_Tokens` per run</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Detects recursive sub-agent loops &amp; trips instant circuit breaker</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="11">→ Defeats Sponge prompts &amp; runaway reasoning-token amplification</text>

