  <rect width="1200" height="760" fill="url(#bgGrad364)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad364)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 364 · 🏆 842-PYTEST MILESTONE · CONTINGENT WORKFORCE &amp; VMS (SAP FIELDGLASS / BEELINE / SOW &amp; IR35)</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业外包人力与供应商管理 (VMS：SAP Fieldglass/Beeline)、SOW 里程碑与事实劳动关系 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">外包费率上限与事实用工 (Co-Employment/IR35) 审计底稿气隙 + 工时门禁与在岗期限硬锁 vs. 验收单注入与 MSP 结算诈骗 (BRK-737 / BRK-738)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad364)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业外包人力 (VMS) 与 SOW 采购三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① SOW 交付报告注入窃取费率底价与用工合规底稿 (BRK-737)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 人力外包商提交的 SOW 阶段验收单或工时表 PDF 夹带隐藏提示词，</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  诱导 VMS 智能助手跨权限读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取全球各职级外包最高指导价 (Rate Card Ceiling)、供应商</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  加价率底表及法务部假外包真派遣 (Co-Employment/IR35) 风险清单</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 幽灵外包空挂工时与违规突破 18 个月在岗红线</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，在无 Git 代码提交或园区门禁</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  记录下自动签批幽灵承包商 (Ghost Contractors) 高额加班费与里程碑</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 违规豁免外包人员连续在岗 18 个月强制离场冷却期 (Tenure Cap)</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：微软/谷歌式事实劳动关系集体诉讼与巨额社保追缴</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造 MSP 总包统付账单与外包结算电汇诈骗 (BRK-738)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造托管服务商 (MSP：Allegis / Randstad / Pontoon) 月度汇总</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  结算单 (Consolidated Invoice) 与共管账户变更通知</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 外包付款账户并电汇 $5,500 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：数百家二级人力供应商结算资金池被整体劫持</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad364)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 企业外包人力 (VMS) 与 SOW 零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: SOW 验收单清洗与结构化交付物槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离供应商验收报告中的自然语言审批指令，仅提取强类型槽位</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  (VMS 工单号、外包 Worker ID、门禁/VDI 在线时长、PR 合并哈希)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断验收单提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 全球岗位费率上限与劳动法审计底稿物理气隙</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 各区域外包最高限价卡 (Rate Card Benchmark)、供应商返点与</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  FLSA/IR35 事实用工合规评估底稿严格隔离在 restricted-budget</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性工时遥测核验与 18 个月在岗期限硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 工时与 SOW 里程碑签批强制校验 Entra 登录/门禁遥测与代码库</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  真实交付物；连续在岗满 18 个月自动触发 Entra 账号回收硬锁</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断幽灵工时与超期续签</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: MSP 统付主数据只读锁 + 采购/用人主管双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中 MSP 共管与人力供应商账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad364)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流外包人力管理 (VMS) 与 SOW 安全方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性 VMS 网关 + 费率气隙 + 遥测/在岗硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-737/738 拦截率 100% | 杜绝幽灵外包与事实用工诉讼</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. SAP Fieldglass / Beeline / Workday VNDLY 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止 SOW 验收助手在报告 PDF 注入下自动签批虚假里程碑</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备外包费率表、VDI 活跃遥测与 18 个月冷却期计算语义</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 用人部门经理月底批量点击“一键全部批准”工时单</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 橡皮图章现象严重，无法发现同一外包同时在三家公司挂职领薪</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 364 · 842 Pytest！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：幽灵工时获批、费率泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取外包费率上限与 IR35 底稿 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断空挂 SOW 里程碑与突破 18 个月在岗红线</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传最高指导价与用工合规风险表</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定 MSP 清算账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,500 伪造 MSP 统付电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 364 · 🏆 842 项 Pytest 检查里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 费率上限与用工合规底稿气隙：全球岗位费率上限、MSP 返点与事实劳动关系审计底稿与 SOW 审单 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性工时遥测与在岗期限硬锁：工时签批强制关联 Entra/VDI 活跃记录，满 18 个月强制触发离场与账号自动吊销</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. MSP 共管账户只读与三单匹配：锁定 trust-registry，大额 SOW 里程碑付款强制经由用人主管与间接采购双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：756 个场景 (753 风险 + 3 基线) | 🏆 842 项 Pytest 检查 | 1,578 项断言 | 742 个交互向量 | 364 篇双语 FAQ (183 篇指南) | BRK-737/738</text>
</svg>
