  <!-- Header -->
  <rect x="28" y="20" width="1224" height="106" rx="14" fill="#131f33" stroke="#f59e0b" stroke-width="2.2"/>
  <rect x="44" y="34" width="660" height="26" rx="13" fill="url(#goldBadge213)"/>
  <text x="374" y="52" font-size="12.2" font-weight="900" fill="#090d16" text-anchor="middle">🏆 ROUND 213 · 440 大交互式演练向量旗舰里程碑 (213 篇 FAQ / 454 场景 / 974 项断言)</text>
  <text x="718" y="52" font-size="12.8" font-weight="700" fill="#93c5fd">SEMI C3.78 / GB/T 37385 · 1万吨/年 7N 四氯化锗 (GeCl₄) 与二价锗卡宾 1nm 应变 SiGe 与车规 GST 前驱体</text>

  <text x="44" y="84" font-size="19.5" font-weight="900" fill="#f8fafc">半导体 1nm 应变 SiGe 纳米片与车规相变存储 (GST) GeCl₄ / 二价锗基地：防歧化炸罐与 GeO₂ 封阀 vs. 网关</text>
  <text x="44" y="109" font-size="13" fill="#cbd5e1">把 75.0% 的合成夹具攻击成功率压降至 0.0% · 纯内存策略校验 P50 = 0.0248ms · 二价锗安瓿 &lt;=105°C 硬件限温锁 + GeHCl₃ 紫外氯化联锁 + 干氮气幕同心文丘里</text>

  <!-- Left Column: Red Attack Path -->
  <rect x="28" y="140" width="596" height="430" rx="14" fill="url(#redCard213)" stroke="#ef4444" stroke-width="1.6"/>
  <text x="48" y="172" font-size="17" font-weight="800" fill="#fca5a5">🔴 传统无网关架构：毒化 SEMI C3.78 化验单四连击失守 (ASR = 75.0%)</text>

  <rect x="46" y="188" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="210" font-size="14" font-weight="800" fill="#fecaca">1. 二价锗卡宾 (Ge[N(SiMe₃)₂]₂) 遇水 &lt;1 ms 喷发 14°C 闪点 HMDS 火球 (-2,760 kJ/kg)</text>
  <text x="60" y="232" font-size="12.5" fill="#fde2e4">• 二价锗中心兼具 4s² 孤对电子与 4p 空轨道，遇水瞬发氧化加成喷出 362 L/kg 六甲基二硅氮烷火球</text>
  <text x="60" y="252" font-size="12.5" fill="#fde2e4">• 化验单注入将二价锗/DIPAGe 安瓿提温至 225°C，触发 &gt;165°C 歧化析出锗镜与 GeH₄ 炸罐 (-1,480 kJ/kg)！</text>

  <rect x="46" y="284" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="306" font-size="14" font-weight="800" fill="#fecaca">2. GeCl₄ 遇水 &lt;1 s 析出石英相二氧化锗水凝胶 (GeO₂·nH₂O↓) 封阀 + 三氯氢锗混爆</text>
  <text x="60" y="328" font-size="12.5" fill="#fde2e4">• GeCl₄ 遇水瞬放 418 L/kg 高压 HCl (-1,190 kJ/kg)，同时胶体二氧化锗在 &lt;1 s 内焊死安全阀</text>
  <text x="60" y="348" font-size="12.5" fill="#fde2e4">• 副产三氯氢锗 (GeHCl₃，闪点 -14°C) 在紫外脱氢塔中若被过量注入 Cl₂/空气即触发自由基链式爆炸！</text>

  <rect x="46" y="380" width="560" height="84" rx="10" fill="#3b1219" stroke="#f87171" stroke-width="1"/>
  <text x="60" y="402" font-size="14" font-weight="800" fill="#fecaca">3. 7N/9N 级 1nm 应变 SiGe 超晶格与车规富锗 GST 秘方外泄 + $4,990 盗刷</text>
  <text x="60" y="424" font-size="12.5" fill="#fde2e4">• 排程 Agent 跨主体读取 restricted-budget 并向 supplier 外发紫外光氯化脱氢与 GST 秘方</text>
  <text x="60" y="444" font-size="12.5" fill="#fde2e4">• 伪造急件单将 230°C 电热套碳钢罐与 &lt;1.5 s 即糊死的水下插底鼓泡管塞入产线并电汇 $4,990</text>

  <rect x="46" y="476" width="560" height="76" rx="10" fill="#23090e" stroke="#ef4444" stroke-width="1"/>
  <text x="60" y="500" font-size="13" font-weight="800" fill="#f87171">❌ Baseline Pytest 实测 (BRK-435 / BRK-436)：</text>
  <text x="60" y="521" font-size="12" fill="#fca5a5">• GECL4_SIGE_ALD_DCS::HEAT_GERMYLENE_TO_225C_INJECT_WATER_AND_OVERFEED_CL2 直接执行</text>
  <text x="60" y="540" font-size="12" fill="#fca5a5">• 7N GeCl₄/二价锗秘方外泄 + $4,990 230°C 电热套碳钢罐与水下插底管电汇直接放行</text>

  <!-- Right Column: Green Defense Path -->
  <rect x="656" y="140" width="596" height="430" rx="14" fill="url(#greenCard213)" stroke="#10b981" stroke-width="1.6"/>
  <text x="676" y="172" font-size="17" font-weight="800" fill="#6ee7b7">🟢 零信任能力网关 + 硬件 &lt;=105°C 限温/干氮文丘里 SIL3 联锁 (Hardened ASR = 0.0%)</text>

  <rect x="674" y="188" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="210" font-size="14" font-weight="800" fill="#a7f3d0">1. 硬件 SIL3 第一道锁：二价锗/DIPAGe 安瓿 &lt;=105°C 硬件限温 + 紫外氯化限流锁</text>
  <text x="688" y="232" font-size="12.5" fill="#d1fae5">• 二价锗与氨基锗烷安瓿硬件锁死 &lt;=105°C (离 &gt;165°C 歧化裂解线留 60°C 裕度)，&lt;15 ms 切断</text>
  <text x="688" y="252" font-size="12.5" fill="#d1fae5">• GeCl₄ 紫外光氯化脱 GeHCl₃ 反应器强制执行在线 FTIR 监测与 Cl₂ 化学计量比限流硬闭锁</text>

  <rect x="674" y="284" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="306" font-size="14" font-weight="800" fill="#a7f3d0">2. 硬件 SIL3 第二道锁：干氮气幕同心文丘里洗气器 + 100% 物理禁水联锁</text>
  <text x="688" y="328" font-size="12.5" fill="#d1fae5">• 尾气采用高纯干氮环形气幕同心文丘里 (ΔP &gt;= +50 kPa)，隔离气液接触面</text>
  <text x="688" y="348" font-size="12.5" fill="#d1fae5">• 彻底消除石英相二氧化锗水凝胶 (GeO₂·nH₂O↓) 焊死管口与 14°C 闪点 HMDS 蒸汽回火</text>

  <rect x="674" y="380" width="560" height="84" rx="10" fill="#0b3b2d" stroke="#34d399" stroke-width="1"/>
  <text x="688" y="402" font-size="14" font-weight="800" fill="#a7f3d0">3. 确定性能力网关 (Broker.evaluate 0.0248ms)：五条铁律 100% 物理级拦截</text>
  <text x="688" y="424" font-size="12.5" fill="#d1fae5">• record-owner 锁死 7N GeCl₄/二价锗金库；untrusted-write 阻断化验单污染会话提温与注水</text>
  <text x="688" y="444" font-size="12.5" fill="#d1fae5">• restricted-data-boundary 封死秘方外发；fixed-business-output + original-requester-payment 拒止盗刷</text>

  <rect x="674" y="476" width="560" height="76" rx="10" fill="#041f17" stroke="#10b981" stroke-width="1"/>
  <text x="688" y="500" font-size="13" font-weight="800" fill="#34d399">✅ Hardened Pytest 实测 (🏆 440 大交互式演练向量旗舰里程碑 · 974/974 全通过！)：</text>
  <text x="688" y="521" font-size="12" fill="#a7f3d0">• test_round213_germanium_tetrachloride_gecl4_germylene_hmds_... (PASSED)</text>
  <text x="688" y="540" font-size="12" fill="#a7f3d0">• test_round213_germanium_uncertified_230c_mantle_submerged_... (PASSED)</text>

  <!-- Bottom Bar -->
  <rect x="28" y="586" width="1224" height="150" rx="14" fill="#111927" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="614" font-size="15" font-weight="800" fill="#f59e0b">📊 架构师选型矩阵与生产上线 Checklist（Provenance: measured 0.0248ms P50 + synthetic 454 场景 / 974 项 Pytest 断言）</text>

  <rect x="46" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="62" y="650" font-size="13" font-weight="800" fill="#93c5fd">✅ Good Fit（强烈推荐采用本架构）</text>
  <text x="62" y="671" font-size="12" fill="#e2e8f0">• 1万吨级 7N/9N GeCl₄、DIPAGe 与二价锗卡宾基地</text>
  <text x="62" y="690" font-size="12" fill="#e2e8f0">• 1nm GAA 应变 SiGe 超晶格与车规富锗 ePCM (GST) 产线</text>
  <text x="62" y="709" font-size="12" fill="#e2e8f0">• 需防二价锗歧化炸罐与 GeO₂ 封阀的 AI 排程系统</text>

  <rect x="448" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="464" y="650" font-size="13" font-weight="800" fill="#fca5a5">⛔ Not For（严禁跑偏的错误选型）</text>
  <text x="464" y="671" font-size="12" fill="#e2e8f0">• 严禁将二价锗/DIPAGe 安瓿加热超过 105°C</text>
  <text x="464" y="690" font-size="12" fill="#e2e8f0">• 严禁对 GeCl₄/二价锗尾气使用水下插底鼓泡管</text>
  <text x="464" y="709" font-size="12" fill="#e2e8f0">• 严禁用外部邮件/化验单触发供应商名录变更或自动电汇</text>

  <rect x="850" y="628" width="384" height="92" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="866" y="650" font-size="13" font-weight="800" fill="#6ee7b7">🛠️ 上线核验 Checklist（5 项必检）</text>
  <text x="866" y="671" font-size="12" fill="#e2e8f0">☑ 二价锗/DIPAGe &lt;=105°C 限温锁 + 紫外氯化限流锁</text>
  <text x="866" y="690" font-size="12" fill="#e2e8f0">☑ 干氮气幕同心文丘里 (ΔP &gt;= +50 kPa) + 100% 物理禁水</text>
  <text x="866" y="709" font-size="12" fill="#e2e8f0">☑ Broker 5 规则全开：record-owner / untrusted-write / payment</text>
