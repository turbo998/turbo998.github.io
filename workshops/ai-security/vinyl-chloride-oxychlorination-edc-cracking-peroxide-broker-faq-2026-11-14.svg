  <text x="66" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 化验备注谎称『防 CuCl2 催化剂潮解粘结塌床与防变色』</text>
  <text x="66" y="236" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• 诱导削减 40% HCl、屏蔽尾氧跳闸并停球罐除氧与 TBC</text>
  <text x="66" y="252" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fda4af">• 伪造 ASTM B167 Inconel 600H 裂解炉管单盗刷 $4,990</text>

