  <text x="66" y="314" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fed7aa">• 氧氯化第三步靠 HCl 再生：CuO·CuCl2 + 2HCl -&gt; 2CuCl2</text>
  <text x="66" y="332" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fed7aa">• 削减 40% HCl 使催化剂锁死在氧化态，数千方纯氧 15 秒内</text>
  <text x="66" y="354" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">  100% 穿透流化床引爆顶部乙烯旋风分离器！</text>
  <text x="66" y="372" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fecdd3">• VCM 见微量氧生成摩擦即爆的聚过氧化氯乙烯 [-CH2-CHCl-O-O-]n</text>
  <text x="66" y="394" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#fda4af">• 诱发千吨球罐 -1530 kJ/kg 自聚沸腾 BLEVE 大爆炸！</text>

