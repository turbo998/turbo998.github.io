<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg32" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="redCard32" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#450A0A" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="greenCard32" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg32)" rx="16"/>
  <rect x="20" y="18" width="1160" height="78" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="42" y="48" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="800">Round 32 架构选型 FAQ：自主云基础设施 IaC 与 FinOps Agent vs. Write-Only 状态 + Plan-Hash 网关</text>
  <text x="42" y="76" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">sensitive=true 掩码假象与 .tfstate 明文拖库 · Plan-to-Apply 掉包 (TOCTOU) · $4,800 云算力盗刷 · 92 场景 / 250 断言通过</text>
  <rect x="1000" y="32" width="160" height="46" rx="8" fill="#065F46" stroke="#10B981" stroke-width="1.5"/>
  <text x="1080" y="53" text-anchor="middle" fill="#ECFDF5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Hardened ASR: 0.0%</text>
  <text x="1080" y="70" text-anchor="middle" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11">P50 0.0248ms (n=200)</text>

  <!-- Left Column -->
  <rect x="20" y="112" width="565" height="410" rx="12" fill="url(#redCard32)" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="142" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="16" font-weight="800">❌ 脆弱 IaC Agent（直接挂载明文 .tfstate + 无钉扎 apply -auto-approve）</text>

  <rect x="42" y="158" width="520" height="104" rx="8" fill="#1E293B" stroke="#7F1D1D" stroke-width="1.2"/>
  <text x="58" y="182" fill="#F87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. .tfstate 明文密钥拖库与防火墙全开篡改 (IAC-TFSTATE-SECRET-EXFIL-77)</text>
  <text x="58" y="204" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 外部开源 Module 文档植入“升级兼容性检查”指令，诱导读取生产状态文件</text>
  <text x="58" y="224" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 尽管变量设了 sensitive=true，但 .tfstate JSON 内 100% 存的是未加密明文密码</text>
  <text x="58" y="244" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• 生产部署清单被改为 0.0.0.0/0 全网开放，且主库明文密码被外带！</text>

  <rect x="42" y="274" width="520" height="104" rx="8" fill="#1E293B" stroke="#7F1D1D" stroke-width="1.2"/>
  <text x="58" y="298" fill="#F87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. Plan-to-Apply 掉包与 $4,800 预留实例盗刷 (IAC-PLAN-DRIFT-SPEND-78)</text>
  <text x="58" y="320" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 人工审阅文本 plan 后重跑 apply -auto-approve，攻击者趁窗口掉包 step-0000</text>
  <text x="58" y="340" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 企图调用 update_trust 私加恶意 Provider，并触发 $4,800 高价云市场算力采购</text>
  <text x="58" y="360" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• 无二进制计划哈希锁与发起人门禁时，$4,800 恶意云账单直接成交！</text>

  <rect x="42" y="390" width="520" height="114" rx="8" fill="#1E293B" stroke="#7F1D1D" stroke-width="1.2"/>
  <text x="58" y="414" fill="#F87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. 为什么 sensitive=true 与文本 Plan 审批在 Agent 时代彻底失效？</text>
  <text x="58" y="436" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• sensitive=true 仅对 CLI 屏幕输出打码，State Backend 存储桶内仍是明文凭据</text>
  <text x="58" y="456" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 不绑定二进制 tfplan.binary 的 SHA-256 哈希，apply 时动态数据源随时可被掉包</text>
  <text x="58" y="482" fill="#EF4444" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Baseline 结果：云架构清单被篡改 + 状态密码外泄 + $4,800 算力失守 (ASR 75.0%)</text>

  <!-- Right Column -->
  <rect x="615" y="112" width="565" height="410" rx="12" fill="url(#greenCard32)" stroke="#10B981" stroke-width="1.5"/>
  <text x="637" y="142" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="16" font-weight="800">✅ Write-Only 无密钥状态 + 二进制 Plan-Hash 锁 + 零信任能力网关</text>

  <rect x="637" y="158" width="520" height="104" rx="8" fill="#1E293B" stroke="#065F46" stroke-width="1.2"/>
  <text x="653" y="182" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">防线 1：ephemeral / password_wo 状态零密码 + record-owner 隔离</text>
  <text x="653" y="204" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 启用 Write-Only 属性使数据库密码直传云 API，永不落盘写入 terraform.tfstate</text>
  <text x="653" y="224" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 跨主体读取受保护状态存储 restricted-budget 在 0.0248ms 内被 record-owner 秒拒</text>
  <text x="653" y="244" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• 外部 Module 文档污染会话篡改清单被 untrusted-write 与零外泄边界封杀！</text>

  <rect x="637" y="274" width="520" height="104" rx="8" fill="#1E293B" stroke="#065F46" stroke-width="1.2"/>
  <text x="653" y="298" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">防线 2：编译态二进制 tfplan SHA-256 哈希钉扎 (request_hash Conflict)</text>
  <text x="653" y="320" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 严禁无计划文件裸跑 apply；每个步骤绑定不可变二进制计划的 SHA-256 摘要</text>
  <text x="653" y="340" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 趁重试或审批后掉包 step-0000 参数立即抛出 Conflict 异常终止执行</text>
  <text x="653" y="360" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">• 彻底根除 Plan 与 Apply 之间的 TOCTOU 时间差漂移攻击！</text>

  <rect x="637" y="390" width="520" height="114" rx="8" fill="#1E293B" stroke="#065F46" stroke-width="1.2"/>
  <text x="653" y="414" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">防线 3：Provider 签名注册表锁定 + 原发起人云算力采购门禁</text>
  <text x="653" y="436" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 阻断私调 update_trust (tool-allowlist) 或改写 trust-registry 引入未签名 Provider</text>
  <text x="653" y="456" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">• 外部工单/模块诱导的 $4,800 预留实例采购被 original-requester-payment 拦截</text>
  <text x="653" y="482" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Hardened 结果：BRK-73 / BRK-74 100% 阻断 · 0 状态泄密 · $0 恶意云账单</text>

  <!-- Bottom Bar -->
  <rect x="20" y="538" width="1160" height="122" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="42" y="566" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">🧭 AI 解决方案架构师选型铁律与实测性能口径（Provenance-Sealed）</text>
  <text x="42" y="592" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12.5">• 模板编写：纯 GitOps PR 生成（零云凭据）  |  • 成本与漂移巡检：只读 Plan 沙盒  |  • 自动编排：Write-Only 状态 + 二进制 Plan-Hash + Capability Broker</text>
  <text x="42" y="616" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12.5">• 本地实测延迟 (measured, independently_reproduced=true)：纯内存门禁 P50 = 0.0248 ms / P95 = 0.0409 ms (n=200 全量原始样本封存)；单步含 SQLite WAL 落盘 P50 = 7.21 ms (n=50)</text>
  <text x="42" y="640" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">• 评测验证：tests/test_regressions.py 新增 BRK-73 (IAC-TFSTATE-SECRET-EXFIL-77) 与 BRK-74 (IAC-PLAN-DRIFT-SPEND-78)，全仓 92 场景 / 250 项 Pytest 100% 通过</text>
</svg>
