<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bg57" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="redGrad57" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="greenGrad57" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad57" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg57)"/>

  <!-- Header -->
  <rect x="30" y="22" width="1140" height="86" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="52" y="54" fill="#60a5fa" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">AI 解决方案架构师实战选型一图流 · ROUND 57 (350 项 Pytest 断言里程碑) · 商业地产 PROPTECH、智能楼宇 BMS 与托管交割 AGENT</text>
  <text x="52" y="84" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="800">物业工单/BACnet 注入、机房冷机停机与交割 BEC 电汇诈骗 vs. 硬件温控互锁 + 零信任能力网关</text>
  <rect x="935" y="38" width="215" height="52" rx="10" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <text x="1042" y="60" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">142 场景 · 350 项断言 · 128 向量</text>
  <text x="1042" y="79" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="800">75.0% → 0.0% ASR (0.0248ms)</text>

  <!-- Left Column: Vulnerable Architecture -->
  <rect x="30" y="124" width="555" height="440" rx="14" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="124" width="555" height="44" rx="14" fill="url(#redGrad57)"/>
  <text x="52" y="152" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">❌ 传统高危架构：外部工单解析、保密租约库与 BACnet 楼控混用（100% 沦陷）</text>

  <rect x="52" y="184" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="208" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">1. 外部维保报修工单与 BACnet 对象 Description 植入隐藏楼控指令</text>
  <text x="68" y="230" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 攻击者在暖通校准工单与设备点表中伪造“消防排烟联调与资产核查协议”指令</text>
  <text x="68" y="250" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• BACnet/IP 协议无语义污点鉴权，AI 主站下发的 WriteProperty 被控制器无条件执行</text>

  <rect x="52" y="280" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">2. 智算机房冷机停机 / 周界门禁解锁 &amp; 主力租户底表 (Rent Roll) 外泄</text>
  <text x="68" y="326" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 全能型楼宇 Agent 跨权读取主力奢品店保底租金与安防盲区图 (restricted-budget)</text>
  <text x="68" y="346" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 覆写 BACnet 冷机停机与门禁常开 (business-result)，并将核心租约底表外发给外部邮箱</text>

  <rect x="52" y="376" width="510" height="82" rx="10" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="400" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">3. 伪造《产权交割收款行变更函》篡改托管白名单 &amp; $4,940 电汇诈骗</text>
  <text x="68" y="422" fill="#e4e4e7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 外部 BEC 钓鱼邮件企图将诈骗收款户写入 trust-registry 认证托管与工程商名录</text>
  <text x="68" y="442" fill="#9ca3af" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 缺乏带外电话回拨与原始请求人门禁，直接诱导财务 Agent 划走 $4,940 托管与大修款</text>

  <rect x="52" y="472" width="510" height="74" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="68" y="497" fill="#fecaca" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="800">💥 实测 Baseline 后果（BRK-123 &amp; BRK-124）：</text>
  <text x="68" y="519" fill="#fef2f2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 机房冷机停机高温宕机 + 周界门禁洞开 + 主力店租约底表外泄 + $4,940 交割款被盗！</text>
  <text x="68" y="537" fill="#fca5a5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 根因：工单服务账号未隔离外部污点，且缺乏底层 DDC 温控互锁与托管账户硬件锁</text>

  <!-- Right Column: Hardened Architecture -->
  <rect x="615" y="124" width="555" height="440" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="615" y="124" width="555" height="44" rx="14" fill="url(#greenGrad57)"/>
  <text x="637" y="152" fill="#d1fae5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="800">✅ 纵深防御架构：工单/楼控分域 + DDC/FACP 硬件互锁 + 零信任能力网关</text>

  <rect x="637" y="184" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="208" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 1 · 只读物业工单沙盒 + 主力租户底表隔离 (record-owner)</text>
  <text x="653" y="230" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 外部工单分流 Agent (calendar) 物理隔离于资管库外，读 restricted-budget 0.0248ms 秒拒</text>
  <text x="653" y="250" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 出口门禁 restricted-data-boundary 100% 封死主力租户租金底表与安防拓扑向外发送</text>

  <rect x="637" y="280" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 2 · 工单污点写锁 + DDC 温控包线 + 消防硬线互锁 (untrusted-write)</text>
  <text x="653" y="326" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 任何摄入外部报修单/点表的会话强制打标 untrusted=True，禁改 BACnet 冷机与门禁</text>
  <text x="653" y="346" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 底层 DDC 锁定供水温度 7°C–12°C 包线 + 消防门全开仅受物理 FACP 硬线干接点触发</text>

  <rect x="637" y="376" width="510" height="82" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="400" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Gate 3 · 产权托管收款名录硬锁 + 交割结算血统门禁 (original-requester)</text>
  <text x="653" y="422" fill="#f1f5f9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• tool-allowlist + fixed-business-output 双重锁死 trust-registry，严禁 BEC 邮件换号</text>
  <text x="653" y="442" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• original-requester-payment 溯源 requester="supplier"，0.0248ms 拦截 $4,940 盗刷</text>

  <rect x="637" y="472" width="510" height="74" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="653" y="497" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="800">🛡️ 实测 Hardened 战果（Pytest 350 passed 里程碑 · 128 演练向量全绿）：</text>
  <text x="653" y="519" fill="#ecfdf5" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 保密租约零读取 + 冷机门禁零误动 + 托管收款表零污染 + $4,940 电汇诈骗零成交！</text>
  <text x="653" y="537" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11.5">• 纯内存网关裁决延迟 P50 = 0.0248ms / P95 = 0.0409ms，单步 SQLite WAL 审计收据落盘 7.21ms</text>

  <!-- Bottom Decision Bar -->
  <rect x="30" y="582" width="1140" height="154" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="30" y="582" width="1140" height="38" rx="14" fill="url(#blueGrad57)"/>
  <text x="52" y="606" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="800">🧭 商业地产与智能楼宇安全架构师 30 秒选型口诀与上线红线（Architect Decision Cheat-Sheet）</text>

  <rect x="50" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="66" y="655" fill="#93c5fd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🟢 什么时候选方案 A（只读物业咨询助手）？</text>
  <text x="66" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 仅做公开招租导览与历史能耗图表展示</text>
  <text x="66" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 零 BACnet 控制写权限、零租约底表与托管接口</text>

  <rect x="422" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="438" y="655" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🔴 什么时候必须选方案 B（分域 + 能力网关）？</text>
  <text x="438" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 接入暖通自动调优、门禁联动或托管交割打款</text>
  <text x="438" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">• 必须强制 DDC 温控互锁 + 托管硬锁 + Broker</text>

  <rect x="794" y="632" width="355" height="90" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="810" y="655" fill="#fcd34d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="700">🛠️ 生产上线 3 条铁律（Zero-Trust Invariants）</text>
  <text x="810" y="677" fill="#e2e8f0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">1. 外部工单打标 untrusted=True 禁写冷机/门禁</text>
  <text x="810" y="697" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">2. 封死核心租约外发；交割换号强制带外电话核验</text>
</svg>
