  <rect x="615" y="130" width="555" height="44" rx="12" fill="url(#greenGrad82)"/>
  <text x="635" y="158" fill="#ecfdf5" font-size="16" font-weight="800">✅ 方案 B：2oo3 光纤极控 + 导叶机械液压缓冲 + 能力网关 (Hardened ASR: 0.0%)</text>

  <rect x="637" y="192" width="510" height="74" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="216" fill="#6ee7b7" font-size="13.5" font-weight="700">1. 安全 I/III 区物理单向隔离 + 2oo3 硬件极控 + 机械液压节流塞</text>
  <text x="653" y="238" fill="#f1f5f9" font-size="12">• 双极闭锁由安全 I 区 2oo3 光纤极控硬件决定；导叶接力器内置固定机械缓冲孔物理防止水锤</text>
  <text x="653" y="256" fill="#34d399" font-size="11.5" font-weight="700">✓ 外部录波文件染色会话 (untrusted=True) 写操作被 rule="untrusted-write" 0.0248ms 拦截</text>

  <rect x="637" y="280" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-size="13.5" font-weight="700">2. 气隙黑启动恢复拓扑与安稳切机定值金库隔离 (record-owner + data-boundary)</text>
  <text x="653" y="326" fill="#f1f5f9" font-size="12">• 运检初筛 Agent (actor="calendar") 跨主体读取 restricted-budget 黑启动与安稳库被拒绝</text>
  <text x="653" y="344" fill="#f1f5f9" font-size="12">• 任何包含黑启动零起升压路径或跨区断面安稳切机定值的外发消息被出境边界死死卡住</text>
  <text x="653" y="358" fill="#34d399" font-size="11.5" font-weight="700">✓ 国家主网安全稳定防线保护：黑启动拓扑与安稳判据 0 越权读取、0 外部泄露</text>

  <rect x="637" y="378" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="402" fill="#6ee7b7" font-size="13.5" font-weight="700">3. 电科院认证晶闸管/IGBT 供应商表只读锁定与生技部双签结算</text>
  <text x="653" y="424" fill="#f1f5f9" font-size="12">• tool-allowlist + fixed-business-output 严禁 AI 修改 trust-registry 特高压器件供应商表</text>
  <text x="653" y="442" fill="#34d399" font-size="11.5" font-weight="700">✓ original-requester-payment 阻断外部报告发起的 $4,990 晶闸管阀组件抢修盗刷</text>

  <rect x="637" y="476" width="510" height="82" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="500" fill="#6ee7b7" font-size="13.5" font-weight="700">4. 全链路 SHA-256 审计收据与发改委 14 号令 / IEC 62351 / NERC CIP 合规</text>
  <text x="653" y="522" fill="#f1f5f9" font-size="12">• 纯内存策略判定 P50 = 0.0248ms / P95 = 0.0409ms；含 SQLite WAL 收据落盘 P50 = 7.21ms</text>
  <text x="653" y="542" fill="#34d399" font-size="11.5" font-weight="700">✓ 严格满足《电力监控系统安全防护规定》16 字方针、IEC 62351 与 NERC CIP 监管审计</text>

