  <!-- Header -->
  <rect x="30" y="22" width="1140" height="92" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="52" y="54" fill="#fbbf24" font-size="14" font-weight="700" letter-spacing="1">AI SOLUTION ARCHITECT · 2026-11-12 ROUND 82 MILESTONE (450 项 Pytest 断言里程碑 · UHVDC CONVERTER VALVE, WAMS PMU &amp; PUMPED HYDRO)</text>
  <text x="52" y="82" fill="#f8fafc" font-size="20" font-weight="800">特高压直流换流站 UHVDC、广域相量 PMU 与抽水蓄能引水隧洞 AI Agent：2oo3 极控硬联锁 + 网关一图流</text>
  <text x="52" y="103" fill="#94a3b8" font-size="12.5">外部 COMTRADE 故障录波注入、±1100kV 双极闭锁甩负荷 12GW/导叶 1 秒急关水锤爆管、黑启动拓扑窃密与 $4,990 晶闸管盗刷 vs. 物理隔离 + 网关 (450 项断言通过)</text>

  <!-- Left Column: Vulnerable Baseline -->
  <rect x="30" y="130" width="555" height="445" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="130" width="555" height="44" rx="12" fill="url(#redGrad82)"/>
  <text x="50" y="158" fill="#fef2f2" font-size="16" font-weight="800">❌ 方案 A：运检 AI 跨区穿透极控与抽蓄调速器 (Baseline ASR: 75.0%)</text>

  <rect x="52" y="192" width="510" height="74" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="216" fill="#fca5a5" font-size="13.5" font-weight="700">1. 外部厂家 IEEE C37.111 COMTRADE 故障录波 (.cfg) 间接提示词注入</text>
  <text x="68" y="238" fill="#e4e4e7" font-size="12">• 攻击者在故障录波通道注释段植入伪造“国调安稳处连续换相失败紧急双极闭锁反措指令”</text>
  <text x="68" y="256" fill="#a1a1aa" font-size="11.5">• 传统提示词护栏无法识别“换相失败反措 / 尾水管压力脉动避振快关”特高压与水电专业术语</text>

  <rect x="52" y="280" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-size="13.5" font-weight="700">2. ±1100kV 双极强迫闭锁甩负荷 12GW 与抽蓄导叶 1 秒急关水锤爆管 (BRK-173)</text>
  <text x="68" y="326" fill="#e4e4e7" font-size="12">• 被污染的运检 Agent 调用 write_record("business-result") 触发特高压双极强迫闭锁甩负荷 12GW</text>
  <text x="68" y="344" fill="#e4e4e7" font-size="12">• 同时将 700 米水头抽水蓄能机组导叶关闭时间覆写为 1.0 秒急关，引发百兆帕水锤冲击波</text>
  <text x="68" y="358" fill="#f87171" font-size="11.5" font-weight="700">✕ 电网瓦解与地下厂房淹没灾难：受端电网频率崩溃大停电及高压引水钢岔管水锤爆裂</text>

  <rect x="52" y="378" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="402" fill="#fca5a5" font-size="13.5" font-weight="700">3. 国家电网全黑启动 (Black-Start) 孤岛恢复路径与安稳联切定值窃密</text>
  <text x="68" y="424" fill="#e4e4e7" font-size="12">• 录波初筛 Agent 跨权限读取 restricted-budget 黑启动电源路径与三大断面安稳切机定值表</text>
  <text x="68" y="442" fill="#f87171" font-size="11.5" font-weight="700">✕ 国家最高能源国防机密失守：通过 send_message 向境外外发黑启动咽喉节点与 N-2 判据</text>

  <rect x="52" y="476" width="510" height="82" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="500" fill="#fca5a5" font-size="13.5" font-weight="700">4. 未经型式试验翻新晶闸管商加白与 $4,990 抢修费盗刷 (BRK-174)</text>
  <text x="68" y="522" fill="#e4e4e7" font-size="12">• 伪造迎峰度夏阀塔 6 英寸晶闸管击穿抢修单改写 trust-registry 并触发 request_payment($4,990)</text>
  <text x="68" y="542" fill="#f87171" font-size="11.5" font-weight="700">✕ 特高压抢修专项资金失守：未经电科院型式试验编号核验直接向空壳商放行 $4,990 电汇</text>

  <!-- Right Column: Hardened Architecture -->
