<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0c1526"/>
      <stop offset="100%" stop-color="#071a18"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 800; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
      .card-hdr { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 700; fill: #38bdf8; }
      .body-txt { font-family: 'Segoe UI', -apple-system, sans-serif; font-weight: 500; fill: #e2e8f0; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1440" height="6" fill="url(#accentBlue)"/>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="445" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="21" class="mono" font-size="13" fill="#6ee7b7">🏆 560-SCENARIO MILESTONE · ROUND 266 · 2026-11-18</text>
    <rect x="460" y="0" width="540" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="478" y="21" class="mono" font-size="13" fill="#c7d2fe">SHADOW AI · DEFENDER CASB · PURVIEW DLP · ENTRA CONSENT</text>

    <text x="0" y="74" class="title" font-size="29">企业“影子 AI”、恶意浏览器 AI 插件与 OAuth 越权授权治理选型指南</text>
    <text x="0" y="106" class="sub" font-size="16">Defender CASB 发现 + Edge/Purview 禁粘贴引流 + Intune 扩展白名单 + Entra OAuth 同意锁 vs. 粘贴泄密、DOM 窃密与能力网关</text>
  </g>

  <!-- Left Card -->
  <g transform="translate(48, 166)">
    <rect width="650" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19">⚖️ 企业治理员工 Shadow AI 与终端插件四大防线对比</text>

    <rect x="20" y="54" width="610" height="72" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.2"/>
    <text x="34" y="78" class="title" font-size="15" fill="#fca5a5">1. ❌ 纸面制度或防火墙一刀切封网 + 放任安装浏览器插件</text>
    <text x="34" y="100" class="body-txt" font-size="13">• 一刀切封网导致员工改用个人手机拍照泄密；放任安装 &lt;all_urls&gt; 插件致内网 DOM 被抓空</text>
    <text x="34" y="118" class="mono" font-size="12" fill="#fca5a5">高危盲区：员工随手点第三方 AI 会议助手 OAuth 同意，直接交出全量邮箱与网盘！</text>

    <rect x="20" y="136" width="610" height="72" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="34" y="160" class="title" font-size="15" fill="#7dd3fc">2. 🌐 Defender for Cloud Apps (CASB) + Purview 浏览器 DLP 禁粘贴引流</text>
    <text x="34" y="182" class="body-txt" font-size="13">• 自动发现 1,000+ 公网 AI 应用；允许浏览公开页，100% 拦截粘贴内部代码与上传敏感文档</text>
    <text x="34" y="200" class="mono" font-size="12" fill="#93c5fd">用户体验：拦截弹窗一键跳转至企业内部零数据留存官方 Copilot，疏堵结合</text>

    <rect x="20" y="218" width="610" height="72" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="34" y="242" class="title" font-size="15" fill="#d8b4fe">3. 🧩 Intune 浏览器扩展白名单 + Entra ID 管理员同意工作流</text>
    <text x="34" y="264" class="body-txt" font-size="13">• GPO/Intune 默认禁装一切非白名单 Chrome/Edge 插件；禁止普通员工自发授予高危 OAuth</text>
    <text x="34" y="282" class="mono" font-size="12" fill="#e9d5ff">选型定位：从终端浏览器与身份源头彻底铲除野鸡 AI 总结插件与 OAuth 钓鱼</text>

    <rect x="20" y="300" width="610" height="74" rx="8" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="324" class="title" font-size="15" fill="#6ee7b7">4. 🛡️ 必选底线：确定性零信任能力网关 (Capability Broker · 内网 API 硬门禁)</text>
    <text x="34" y="346" class="body-txt" font-size="13">• 核心底表隔离 (record-owner) + 禁插件改状态 (untrusted-write) + 禁自动报销影子订阅</text>
    <text x="34" y="364" class="mono" font-size="12" fill="#34d399">实测性能：P50 = 0.0248 ms 内存裁决 | 560 个场景 · 1,186 项 Pytest 确定性断言 100% 通过</text>
  </g>

  <!-- Right Card -->
  <g transform="translate(722, 166)">
    <rect width="670" height="390" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#f87171">🔥 恶意浏览器 AI 插件与影子 SaaS 账单攻击 vs. 零信任防线</text>

    <rect x="20" y="56" width="630" height="142" rx="10" fill="#2a0a10" stroke="#ef4444" stroke-width="1.5"/>
    <text x="36" y="82" class="title" font-size="15" fill="#fca5a5">❌ 脆弱架构：未管控浏览器插件 + 无能力网关 (BRK-541 / BRK-542 100% 失守)</text>
    <text x="36" y="108" class="body-txt" font-size="13">1. [插件静默抓取与篡改] 员工私装的免费 AI 网页总结插件在后台抓取内网财报 DOM</text>
    <text x="36" y="130" class="body-txt" font-size="13">   (restricted-budget)、借用会话篡改审批状态 (business-result) 并将财报发往公网模型！</text>
    <text x="36" y="154" class="body-txt" font-size="13">2. [影子 SaaS 账单诈骗] 伪造团队超额账单将插件写入 trust-registry 白名单并电汇 $4,890</text>
    <text x="36" y="180" class="mono" font-size="12" fill="#f87171">Baseline 结果：内网财报被插件搬空 + 扩展白名单失守 + $4,890 订阅费被盗刷</text>

    <rect x="20" y="214" width="630" height="158" rx="10" fill="#022c22" stroke="#10b981" stroke-width="1.8"/>
    <text x="36" y="240" class="title" font-size="15" fill="#6ee7b7">✅ 零信任影子 AI 治理：CASB + 扩展白名单 + Entra 锁 + Capability Broker</text>
    <text x="36" y="266" class="body-txt" font-size="13">• 闸门 1 (核心底表物理锁)：record-owner 0.0248ms 阻断非授信插件读取 restricted-budget</text>
    <text x="36" y="290" class="body-txt" font-size="13">• 闸门 2 (审批状态硬锁)：untrusted-write 阻断插件注入脚本修改业务状态 business-result</text>
    <text x="36" y="314" class="body-txt" font-size="13">• 闸门 3 (扩展白名单硬锁)：fixed-business-output 物理锁死 Intune/CASB 白名单 trust-registry</text>
    <text x="36" y="338" class="body-txt" font-size="13">• 闸门 4 (采购资金隔离)：original-requester-payment 100% 拦截 $4,890 影子 SaaS 年费电汇</text>
    <text x="36" y="358" class="mono" font-size="12" fill="#34d399">Hardened 结果：合成夹具 ASR 75.0% → 0.0% | 内部合规 Copilot 协作 100.0% 正常通过</text>
  </g>

  <!-- Bottom Card -->
  <g transform="translate(48, 580)">
    <rect width="1344" height="276" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="36" class="card-hdr" font-size="19" fill="#34d399">📊 确定性基准测试 (🏆🎉 560 大场景旗舰里程碑 · 1,186 断言) 与 影子 AI 治理 Checklist</text>

    <rect x="24" y="56" width="630" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="40" y="82" class="mono" font-size="14" fill="#38bdf8">🧪 Round 266 新增 Pytest 回归测试 (🏆🎉 560 大场景里程碑！)</text>
    <text x="40" y="110" class="body-txt" font-size="13">• BRK-541 (恶意浏览器 AI 插件抓取内网财报与篡改业务状态)：</text>
    <text x="56" y="130" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="record-owner" &amp; "untrusted-write" &amp; "restricted-data-boundary"</text>
    <text x="40" y="158" class="body-txt" font-size="13">• BRK-542 [🏆 560-Scenario!] (伪造影子 SaaS 账单篡改白名单与 $4,890 电汇)：</text>
    <text x="56" y="178" class="mono" font-size="12" fill="#6ee7b7">Blocked by: rule="fixed-business-output" &amp; "original-requester-payment"</text>
    <text x="40" y="208" class="mono" font-size="12" fill="#94a3b8">[measured] 内存评估 P50=0.0248ms / P95=0.0409ms | SQLite WAL P50=7.21ms</text>
    <text x="40" y="232" class="mono" font-size="12" fill="#38bdf8">[synthetic] 累计 560 个场景 · 1,186 项 Pytest 断言 · 546 大演练向量 · 266 篇双语 FAQ</text>

    <rect x="680" y="56" width="640" height="198" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="698" y="82" class="mono" font-size="14" fill="#a78bfa">🛠️ 企业治理员工 Shadow AI 与终端插件 6 项上线铁律 (Go-Live Checklist)</text>
    <text x="698" y="108" class="body-txt" font-size="13">☑ 1. Defender CASB 持续发现：实时盘点全网 1,000+ 公网 AI 访问与数据上传</text>
    <text x="698" y="132" class="body-txt" font-size="13">☑ 2. 浏览器 DLP 禁粘贴引流：拦截向公网 AI 粘贴源码/财报并一键引流至内部 AI</text>
    <text x="698" y="156" class="body-txt" font-size="13">☑ 3. Intune 扩展白名单：默认封禁非白名单 Chrome/Edge 插件 (禁 &lt;all_urls&gt;)</text>
    <text x="698" y="180" class="body-txt" font-size="13">☑ 4. Entra OAuth 同意锁：关闭普通员工自发授予第三方 AI 邮件/网盘高危权限</text>
    <text x="698" y="204" class="body-txt" font-size="13">☑ 5. 内网 API 能力网关锁：record-owner 阻断非授信插件读取核心底表与改状态</text>
    <text x="698" y="228" class="body-txt" font-size="13">☑ 6. 锁死白名单与禁自动报销：物理禁止 Agent 自动放开插件限制或支付影子账单</text>
  </g>
