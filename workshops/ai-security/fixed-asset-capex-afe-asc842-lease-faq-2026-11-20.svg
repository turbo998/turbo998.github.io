<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" style="background-color:#0f172a;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <linearGradient id="bgGrad365" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="redGrad365" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="greenGrad365" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="blueGrad365" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad365)"/>

  <!-- Header -->
  <rect x="24" y="20" width="1152" height="94" rx="12" fill="url(#blueGrad365)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="44" y="54" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="1">ROUND 365 · 🏆 365-FAQ, BRK-740 &amp; 1,582-ASSERTION MILESTONE · FIXED ASSETS, CAPEX AFE &amp; ASC 842 LEASE ACCOUNTING</text>
  <text x="44" y="84" fill="#ffffff" font-size="21" font-weight="800">企业固定资产核算 (SAP FI-AA)、在建工程 (CIP) 资本化与 ASC 842 租赁准则 AI 安全指南</text>
  <text x="44" y="106" fill="#93c5fd" font-size="13">关厂减值底稿与算力选址物理气隙 + OpEx/CapEx 资本化边界与资产报废硬锁 vs. 发票注入虚增利润与售后回租诈骗 (BRK-739 / BRK-740)</text>

  <!-- Left Column -->
  <rect x="24" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <rect x="24" y="128" width="368" height="38" rx="10" fill="url(#redGrad365)"/>
  <text x="42" y="152" fill="#ffffff" font-size="15" font-weight="700">🚨 1. 企业固定资产、在建工程与租赁三大攻击面</text>

  <rect x="38" y="178" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="200" fill="#fca5a5" font-size="13" font-weight="700">① 工程账单/租约补充协议注入窃取关厂减值底稿 (BRK-739)</text>
  <text x="50" y="220" fill="#cbd5e1" font-size="12">• 承包商提交的工程结算单或租赁补充协议 PDF 夹带隐藏提示词，</text>
  <text x="50" y="238" fill="#cbd5e1" font-size="12">  诱导固定资产 Agent 跨权限读取 restricted-budget</text>
  <text x="50" y="256" fill="#cbd5e1" font-size="12">• 窃取未公开的智算中心扩建选址、产线关停减值测试 (ASC 360)</text>
  <text x="50" y="276" fill="#f87171" font-size="11" font-weight="700">  底稿及集团增量借款利率 (IBR) 与底价拍卖保留估值</text>

  <rect x="38" y="310" width="340" height="122" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="332" fill="#fca5a5" font-size="13" font-weight="700">② 费用违规资本化 (WorldCom 式造假) 与 1 元报废盗窃</text>
  <text x="50" y="352" fill="#cbd5e1" font-size="12">• 注入指令篡改 business-result，将日常维保费用 (OpEx) 违规转入</text>
  <text x="50" y="370" fill="#cbd5e1" font-size="12">  在建工程 (CIP CapEx) 虚增当期 EBITDA 利润，或隐瞒融资租赁负债</text>
  <text x="50" y="388" fill="#cbd5e1" font-size="12">• 将高价值 GPU 服务器/精密机床账面净值减记为 $1 废铁核销盗卖</text>
  <text x="50" y="408" fill="#f87171" font-size="11" font-weight="700">• 违规触发：SEC 财务造假重罚、资产流失与 SOX 404 重大缺陷</text>

  <rect x="38" y="442" width="340" height="126" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="50" y="464" fill="#fca5a5" font-size="13" font-weight="700">③ 伪造设备售后回租 (SLB) 与 CapEx 托管电汇诈骗 (BRK-740)</text>
  <text x="50" y="484" fill="#cbd5e1" font-size="12">• 伪造大型设备融资租赁商 (Lessor) 售后回租交割通知或 AFE 资本</text>
  <text x="50" y="502" fill="#cbd5e1" font-size="12">  开支设备托管放款函 (CapEx Escrow Drawdown Notice)</text>
  <text x="50" y="520" fill="#cbd5e1" font-size="12">• 篡改 trust-registry 出租人收款账户并电汇 $5,550 (request_payment)</text>
  <text x="50" y="540" fill="#f87171" font-weight="700" font-size="11">• 违规触发：数百万美元大宗设备购置款与租金被劫持</text>

  <!-- Center Column -->
  <rect x="408" y="128" width="384" height="456" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <rect x="408" y="128" width="384" height="38" rx="10" fill="url(#greenGrad365)"/>
  <text x="426" y="152" fill="#ffffff" font-size="15" font-weight="700">🛡️ 2. 固定资产、在建工程与租赁零信任防御架构</text>

  <rect x="422" y="178" width="356" height="88" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="198" fill="#6ee7b7" font-size="13" font-weight="700">Gate 1: 工程发票/租约清洗与强类型资产槽位提取</text>
  <text x="434" y="218" fill="#cbd5e1" font-size="12">• 剥离工程账单与租约 PDF 中的自然语言会计处理指示，仅提取强类型</text>
  <text x="434" y="236" fill="#cbd5e1" font-size="12">  槽位 (AFE 批文号、设备序列号/RFID、租期月数、保底余值)</text>
  <text x="434" y="254" fill="#34d399" font-size="11" font-weight="700">• 全程标记 untrusted=True, lane="attack" 阻断账单提权</text>

  <rect x="422" y="276" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="296" fill="#6ee7b7" font-size="13" font-weight="700">Gate 2: 产线关停减值与选址规划物理气隙 (Record-Owner)</text>
  <text x="434" y="316" fill="#cbd5e1" font-size="12">• 未公开数据中心/工厂选址蓝图、ASC 360 长期资产减值测试模型</text>
  <text x="434" y="334" fill="#cbd5e1" font-size="12">  与集团 IBR 折现率曲线严格隔离在 restricted-budget 气隙域</text>
  <text x="434" y="354" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：record-owner + restricted-data-boundary</text>

  <rect x="422" y="380" width="356" height="94" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="400" fill="#6ee7b7" font-size="13" font-weight="700">Gate 3: 确定性 CapEx/OpEx 资本化边界与资产报废硬锁</text>
  <text x="434" y="420" fill="#cbd5e1" font-size="12">• 转固与资本化强制绑定已批 AFE 预算与物联网 RFID 实盘在位证明；</text>
  <text x="434" y="438" fill="#cbd5e1" font-size="12">  ASC 842 使用权资产 (ROU) 现值由确定性公式计算，严禁 AI 报废核销</text>
  <text x="434" y="458" fill="#34d399" font-size="11" font-weight="700">• 拦截规则：untrusted-write 100% 阻断违规资本化与盗卖核销</text>

  <rect x="422" y="484" width="356" height="86" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="434" y="504" fill="#6ee7b7" font-size="13" font-weight="700">Gate 4: 出租人/设备商主数据只读锁 + 投委会双签</text>
  <text x="434" y="524" fill="#cbd5e1" font-size="12">• 锁定 trust-registry 中融资租赁商与设备商账户只读 (tool-allowlist</text>
  <text x="434" y="542" fill="#cbd5e1" font-size="12">  + fixed-business-output) + original-requester-payment 拦截</text>

  <!-- Right Column -->
  <rect x="808" y="128" width="368" height="456" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="808" y="128" width="368" height="38" rx="10" fill="url(#blueGrad365)"/>
  <text x="826" y="152" fill="#ffffff" font-size="15" font-weight="700">📊 3. 四大架构方案选型对比与基准测试</text>

  <rect x="822" y="178" width="340" height="196" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="834" y="200" fill="#93c5fd" font-size="13" font-weight="700">主流固定资产与租赁核算 (FI-AA / ASC 842) 方案对比：</text>
  <text x="834" y="222" fill="#e2e8f0" font-size="12" font-weight="700">A. 确定性资产网关 + 减值气隙 + 资本化/报废硬锁 (推荐 🏆)</text>
  <text x="834" y="240" fill="#34d399" font-size="11">   ✓ BRK-739/740 拦截率 100% | 满足 ASC 842/360 &amp; SOX 404</text>
  <text x="834" y="262" fill="#cbd5e1" font-size="12">B. SAP FI-AA / CoStar / LeaseQuery / Nakisa 原生权限</text>
  <text x="834" y="280" fill="#fbbf24" font-size="11">   ⚠ 无法防止转固助手在工程账单注入下将日常维保费计入在建工程</text>
  <text x="834" y="302" fill="#cbd5e1" font-size="12">C. 通用云端护栏 (Azure Prompt Shields / Bedrock Guardrails)</text>
  <text x="834" y="320" fill="#fbbf24" font-size="11">   ⚠ 不具备 AFE 资本化规则、ROU 折现算术与 RFID 盘点状态机</text>
  <text x="834" y="342" fill="#cbd5e1" font-size="12">D. 传统资产会计手工台账核对转固单与线下纸质报废签批</text>
  <text x="834" y="360" fill="#f87171" font-size="11">   ✕ 账实不符率高达 10-20%，跨国租约变更重算极易导致审计调整</text>

  <rect x="822" y="386" width="340" height="184" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="834" y="408" fill="#6ee7b7" font-size="13" font-weight="700">🧪 Pytest 确定性回归仿真结果 (Round 365 · 365 篇 FAQ！)：</text>
  <text x="834" y="430" fill="#e2e8f0" font-size="12">• 基准策略 (Baseline)：费用资本化、减值泄密与电汇放行 ❌</text>
  <text x="834" y="450" fill="#34d399" font-size="12" font-weight="700">• 加固策略 (Hardened)：5 道确定性规则 100% 阻断 ✅</text>
  <text x="834" y="472" fill="#cbd5e1" font-size="11">  - record-owner：阻断读取关厂减值与选址底稿 (restricted-budget)</text>
  <text x="834" y="490" fill="#cbd5e1" font-size="11">  - untrusted-write：阻断 OpEx 违规转入 CIP 与 GPU 设备 1 元报废</text>
  <text x="834" y="508" fill="#cbd5e1" font-size="11">  - restricted-data-boundary：阻断外传资产减值底表与 IBR 利率曲线</text>
  <text x="834" y="526" fill="#cbd5e1" font-size="11">  - tool-allowlist / fixed-business-output：锁定出租人收款账户库</text>
  <text x="834" y="544" fill="#cbd5e1" font-size="11">  - original-requester-payment：拦截 $5,550 伪造售后回租电汇</text>

  <!-- Bottom Metrics Bar -->
  <rect x="24" y="598" width="1152" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="626" fill="#93c5fd" font-size="14" font-weight="700">🚀 架构师上线安评 Checklist 与全仓验证里程碑 (Round 365 · 🏆 365 篇双语 FAQ、BRK-740 &amp; 1,582 项断言三大里程碑！)</text>
  <text x="44" y="650" fill="#cbd5e1" font-size="12">✅ 1. 关厂减值与选址规划物理气隙：集团产线关停减值测试 (ASC 360) 与算力中心选址底稿与日常转固审单 Agent 物理隔离</text>
  <text x="44" y="670" fill="#cbd5e1" font-size="12">✅ 2. 确定性 CapEx/OpEx 边界与 RFID 报废硬锁：严禁无 AFE 批文将日常维保计入在建工程，高价值设备报废强制物联网与实盘双核验</text>
  <text x="44" y="690" fill="#cbd5e1" font-size="12">✅ 3. 融资租赁与设备商账户只读：锁定 trust-registry，大额 AFE 工程款与售后回租交割强制经投委会与司库 FIDO2 双签</text>
  <rect x="44" y="702" width="1112" height="26" rx="6" fill="#1e293b"/>
  <text x="60" y="720" fill="#34d399" font-size="12" font-weight="700">📊 累计验证指标：758 个场景 (755 风险 + 3 基线) | 846 项 Pytest 检查 | 🏆 1,582 项断言 | 744 个交互向量 | 🏆 365 篇双语 FAQ (184 篇指南) | 🏆 BRK-739/740</text>
</svg>
