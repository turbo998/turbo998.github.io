<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="bg393" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr393" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bg393)" rx="16"/>
  <rect x="20" y="18" width="1160" height="72" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="42" y="47" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="20" font-weight="700">Round 393 · 企业 MCP Server 治理、防工具投毒与沙盒隔离 (APIM AI Gateway / Kata / ACA / E2B) 指南</text>
  <text x="42" y="73" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">BRK-795 &amp; BRK-796 · 🏆 800 个交互式靶场攻击向量历史性里程碑！ · OBO 用户令牌气隙 + Schema 哈希钉扎防 Rug-Pull 硬锁</text>

  <!-- Left Column: Threats -->
  <rect x="24" y="106" width="368" height="476" rx="12" fill="#1A121C" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">⛔ 第三方 MCP Server 与工具沙盒三大攻击链</text>

  <rect x="38" y="152" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="174" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">1. MCP 工具描述投毒 (Tool Poisoning) 窃取令牌 (BRK-795)</text>
  <text x="50" y="196" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 恶意第三方 MCP Server 在 `tools/list` JSON description 埋注入</text>
  <text x="50" y="216" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 诱导宿主机 Agent 越权读取 restricted-budget 里的 `~/.ssh` 与</text>
  <text x="50" y="236" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">  其他受信任企业内部 MCP 連接器的 OAuth OBO 刷新令牌</text>
  <text x="50" y="258" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 跨 MCP Server 影子劫持 (Cross-Server Shadowing) 偷走全网凭证</text>

  <rect x="38" y="298" width="340" height="132" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="320" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">2. 动态 Rug-Pull 篡改定义与宿主机 `npx` 逃逸 (BRK-795)</text>
  <text x="50" y="342" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 审批通过后远程 MCP Server 热更新 Schema (Rug-Pull)</text>
  <text x="50" y="362" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 篡改 business-result 在开发者本机免审批静默执行 `npx/uvx`</text>
  <text x="50" y="382" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 覆盖系统原生 `git/curl` 工具名实施同名工具劫持 (Squatting)</text>
  <text x="50" y="404" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 本地客户端直连未隔离 MCP 导致研发电脑与内网瞬间沦陷</text>

  <rect x="38" y="444" width="340" height="122" rx="8" fill="#2A121A" stroke="#DC2626" stroke-width="1"/>
  <text x="50" y="466" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">3. 伪造商业 MCP 市场订阅与微虚拟机沙盒诈骗 (BRK-796)</text>
  <text x="50" y="488" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 伪造第三方 MCP 连接器提供商 “企业级 API 调用超量结算单”</text>
  <text x="50" y="508" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 攻击 trust-registry 篡改商业 MCP 插件商与沙盒云收款账户</text>
  <text x="50" y="528" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 诱导研发平台采购 Agent 直接发起 $6,950 紧急配额电汇</text>
  <text x="50" y="550" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="600">→ 恶意插件商既偷数据又通过伪造用量账单骗取企业资金</text>

  <!-- Center Column: Zero-Trust Broker -->
  <rect x="408" y="106" width="384" height="476" rx="12" fill="#0F1E2E" stroke="#10B981" stroke-width="1.5"/>
  <text x="428" y="136" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">🛡️ 确定性 MCP 网关与 MicroVM 沙盒架构 (Hardened)</text>

  <rect x="424" y="152" width="352" height="96" rx="8" fill="#162A3E" stroke="#38BDF8" stroke-width="1"/>
  <text x="438" y="174" fill="#7DD3FC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 1：工具 Schema 哈希钉扎与描述净化 (untrusted=True)</text>
  <text x="438" y="196" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 丢弃第三方 MCP 自带的超长诱导性 description，改用内部固定描述</text>
  <text x="438" y="216" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 强制校验 `SHA256(tools/list) == Approved_Manifest_Hash`</text>
  <text x="438" y="234" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 任何远端 Rug-Pull 动态篡改工具定义立即触发网关熔断</text>

  <rect x="424" y="258" width="352" height="96" rx="8" fill="#162A3E" stroke="#10B981" stroke-width="1"/>
  <text x="438" y="280" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 2：APIM 集中代理与按工具隔离 OBO 令牌气隙</text>
  <text x="438" y="302" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 严禁客户端存长效 Token；由 APIM 按单 Server 受众签发 OBO</text>
  <text x="438" y="322" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 跨连接器凭证存入 restricted-budget (record-owner 物理隔离)</text>
  <text x="438" y="340" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ A 插件永远无法读取或借用 B 插件的 OAuth 权限令牌</text>

  <rect x="424" y="364" width="352" height="100" rx="8" fill="#162A3E" stroke="#F59E0B" stroke-width="1"/>
  <text x="438" y="386" fill="#FDE68A" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 3：禁本地裸跑 `npx/uvx` 与 MicroVM 硬件沙盒硬锁</text>
  <text x="438" y="408" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• 严禁宿主机直连 stdio MCP；强制运行于 ACA Dynamic Sessions</text>
  <text x="438" y="428" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">  或 AKS Kata MicroVM 硬件虚拟化沙盒 + 命名空间前缀隔离</text>
  <text x="438" y="448" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ untrusted-write 阻断免审批 autoApprove 与同名工具覆盖</text>

  <rect x="424" y="474" width="352" height="92" rx="8" fill="#162A3E" stroke="#F43F5E" stroke-width="1"/>
  <text x="438" y="496" fill="#FDA4AF" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">闸门 4：商业 MCP 供应商与沙盒平台账户只读锁</text>
  <text x="438" y="518" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• tool-allowlist 禁用 update_trust + fixed-business-output</text>
  <text x="438" y="538" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">• original-requester-payment 拦截 $6,950 伪造插件配额电汇</text>
  <text x="438" y="556" fill="#FB7185" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">→ 平台架构总监 + 财务总监 FIDO2 双签放行商业连接器账单</text>

  <!-- Right Column: Matrix & Metrics -->
  <rect x="808" y="106" width="368" height="476" rx="12" fill="#111C24" stroke="#10B981" stroke-width="1.5"/>
  <text x="826" y="136" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">📊 方案对比与 800 攻击向量里程碑！</text>

  <rect x="822" y="152" width="340" height="196" rx="8" fill="#172A36" stroke="#334155" stroke-width="1"/>
  <text x="836" y="176" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">五类企业 MCP 治理与工具执行隔离方案对比：</text>
  <text x="836" y="200" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12" font-weight="700">1. APIM 集中网关 + Kata/ACA 沙盒 + 哈希锁 (🏆)</text>
  <text x="836" y="218" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   BRK-795/796 100% 拦截 | 免疫 Tool Poisoning 与 Rug-Pull</text>
  <text x="836" y="240" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">2. 普通 Docker 容器共享宿主机内核跑 MCP</text>
  <text x="836" y="258" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   缺乏 Hypervisor 硬件隔离，高危代码执行易触发容器逃逸</text>
  <text x="836" y="280" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">3. 云端通用护栏 (Prompt Shields / Bedrock)</text>
  <text x="836" y="298" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   往往只扫用户输入，默认信任系统加载的 `tools/list` 描述</text>
  <text x="836" y="320" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">4. 开发者本地 IDE 直连公网 `npx -y @untrusted/mcp`</text>
  <text x="836" y="338" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">   直接以开发者本机权限读写 `~/.aws` 与 `~/.ssh`，极度危险</text>

  <rect x="822" y="362" width="340" height="204" rx="8" fill="#0D2329" stroke="#10B981" stroke-width="1.5"/>
  <text x="836" y="388" fill="#6EE7B7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14" font-weight="700">🏆 确定性基准回归达成 (Round 393 里程碑！)</text>
  <text x="836" y="414" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 对抗演练场景总数：<tspan fill="#6EE7B7" font-weight="700">814 个</tspan> (811 对抗 + 3 基线)</text>
  <text x="836" y="438" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• Pytest 参数化检查：<tspan fill="#6EE7B7" font-weight="700">958 项 100% PASS</tspan></text>
  <text x="836" y="462" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 确定性策略断言数：<tspan fill="#FBBF24" font-weight="700">1,694 项</tspan></text>
  <text x="836" y="486" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 交互式靶场攻击向量：<tspan fill="#F472B6" font-weight="700">800 个</tspan> (🏆 突破 800 大关里程碑！)</text>
  <text x="836" y="510" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">• 双语架构与选型指南：<tspan fill="#A78BFA" font-weight="700">393 篇 FAQ (212 篇指南)</tspan></text>
  <text x="836" y="538" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11">新增测试：BRK-795 (MCP 工具投毒/Rug-Pull) &amp; BRK-796 ($6,950 拦截)</text>

  <!-- Footer -->
  <rect x="20" y="596" width="1160" height="64" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="42" y="622" fill="#F8FAFC" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">架构师核心铁律：</text>
  <text x="155" y="622" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">严禁本地直连未验证 stdio MCP；所有 MCP 必须经 APIM 网关集中代理、钉扎 `tools/list` SHA-256 哈希并隔离在 Hypervisor MicroVM 沙盒中！</text>
  <text x="42" y="644" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">Repository: turbo998/ai-security-lab (main) · Enterprise AI Security Architecture &amp; Product Selection Series · Round 393 (2026-11-20)</text>
</svg>
