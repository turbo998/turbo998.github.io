  <!-- Section 1 -->
  <text x="45" y="172" fill="#e2e8f0" font-size="17" font-weight="700">1. 企业 AI 密钥托管与机密计算四大层级横向对比（静态加密 At-Rest vs. 显存态加密 In-Use vs. 动作门禁）</text>

  <!-- Card 1 -->
  <rect x="45" y="186" width="315" height="235" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text x="62" y="216" fill="#60a5fa" font-size="15.5" font-weight="800">🔵 层级 A：客户自管密钥 (CMK/BYOK)</text>
  <text x="62" y="238" fill="#bfdbfe" font-size="11.5" font-weight="600">Azure Key Vault Managed HSM (FIPS 140-3 L3)</text>
  <text x="62" y="264" fill="#e2e8f0" font-size="11.5">• 覆盖：OpenAI 微调/会话、AI Search 向量库</text>
  <text x="62" y="286" fill="#e2e8f0" font-size="11.5">• 王牌能力：一键吊销密钥 (Crypto-Shredding)</text>
  <text x="62" y="308" fill="#e2e8f0" font-size="11.5">• 边界：保护硬盘静态数据，推理时显存仍为明文</text>
  <rect x="62" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#60a5fa"/>
  <text x="74" y="352" fill="#93c5fd" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="74" y="370" fill="#cbd5e1" font-size="11">90% 金融、保险与跨国合规项目的必选基线，</text>
  <text x="74" y="388" fill="#cbd5e1" font-size="11">确保企业随时握有云端数据“物理级断电开关”。</text>

  <!-- Card 2 -->
  <rect x="378" y="186" width="315" height="235" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="395" y="216" fill="#c084fc" font-size="15.5" font-weight="800">🟣 层级 B：Confidential GPU TEE</text>
  <text x="395" y="238" fill="#e9d5ff" font-size="11.5" font-weight="600">Azure NCC H100 v5 (SEV-SNP + H100 TEE)</text>
  <text x="395" y="264" fill="#e2e8f0" font-size="11.5">• 突破：CPU 内存 + PCIe 总线 + GPU 显存全加密</text>
  <text x="395" y="286" fill="#e2e8f0" font-size="11.5">• 证明：MAA 远程证明通过后 HSM 才释放密钥</text>
  <text x="395" y="308" fill="#e2e8f0" font-size="11.5">• 开销：推理吞吐损耗仅 ~5%-12%，隔离云商 Root</text>
  <rect x="395" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="407" y="352" fill="#d8b4fe" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="407" y="370" fill="#cbd5e1" font-size="11">主权财富基金、未公开新药分子与跨境推理必选，</text>
  <text x="407" y="388" fill="#cbd5e1" font-size="11">硬件级证明连云厂商管理员也看不见显存明文！</text>

  <!-- Card 3 -->
  <rect x="711" y="186" width="315" height="235" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="728" y="216" fill="#fbbf24" font-size="15.5" font-weight="800">🟠 层级 C：双密钥加密 (DKE / HYOK)</text>
  <text x="728" y="238" fill="#fde68a" font-size="11.5" font-weight="600">Microsoft Purview DKE + 本地 HSM 驻留</text>
  <text x="728" y="264" fill="#e2e8f0" font-size="11.5">• 机制：云端一把钥匙 + 企业本地机房一把钥匙</text>
  <text x="728" y="286" fill="#e2e8f0" font-size="11.5">• 适用：&lt;1% 极高密级董事会并购与国防红头文件</text>
  <text x="728" y="308" fill="#e2e8f0" font-size="11.5">• 协同：上云推理前须在本地完成格式保留令牌化</text>
  <rect x="728" y="330" width="280" height="72" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="740" y="352" fill="#fcd34d" font-size="11.5" font-weight="700">架构师选型建议：</text>
  <text x="740" y="370" fill="#cbd5e1" font-size="11">仅对皇冠明珠级绝密文档启用 DKE，避免全员</text>
  <text x="740" y="388" fill="#cbd5e1" font-size="11">开启导致云端 Copilot 索引与协同能力受限。</text>

  <!-- Card 4 -->
  <rect x="1044" y="186" width="321" height="235" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2.2"/>
  <text x="1061" y="216" fill="#34d399" font-size="15.5" font-weight="800">🛡️ 飞地内确定性 Capability Broker</text>
  <text x="1061" y="238" fill="#a7f3d0" font-size="11.5" font-weight="600">防御“加密通道内的提示词注入” (BRK-503)</text>
