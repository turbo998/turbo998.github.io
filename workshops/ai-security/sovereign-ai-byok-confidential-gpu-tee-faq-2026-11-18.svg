  <!-- Section 2 -->
  <text x="45" y="454" fill="#e2e8f0" font-size="17" font-weight="700">2. 红蓝对抗推演：RA-TLS 飞地内加密提示词注入 &amp; 远程证明策略降级 vs. HSM SKR + Capability Broker</text>

  <rect x="45" y="468" width="640" height="175" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
  <text x="65" y="496" fill="#fca5a5" font-size="15" font-weight="800">❌ 脆弱 Baseline：仅有 TEE/通道加密但无飞地内网关（BRK-503 / BRK-504 失守）</text>
  <text x="65" y="524" fill="#fecaca" font-size="12.5">1. 飞地内加密注入越权 (BRK-503)：攻击者用合法 RA-TLS 加密发送含注入指令的请求，飞地内</text>
  <text x="65" y="544" fill="#fecaca" font-size="12.5">   解密后诱导 Agent 读取主权投资底表 restricted-budget、篡改合规结论并向未证明节点外发。</text>
  <text x="65" y="572" fill="#fecaca" font-size="12.5">2. 远程证明降级与维保诈骗 (BRK-504 · 1,110 项断言里程碑)：伪造 HSM 固件升级通知，</text>
  <text x="65" y="592" fill="#fecaca" font-size="12.5">   诱导在 trust-registry 中关闭 MAA 硬件证明校验并直接放行 $4,980 维保电汇！</text>
  <text x="65" y="622" fill="#f87171" font-size="12" font-weight="700">💥 根因：混淆了“传输/显存机密性”与“指令意图可信度”，加密管道同样会忠实传输恶意提示词！</text>

  <rect x="715" y="468" width="650" height="175" rx="12" fill="#022c22" stroke="#10b981" stroke-width="2"/>
  <text x="735" y="496" fill="#6ee7b7" font-size="15" font-weight="800">✅ 主权零信任架构：HSM SKR + H100 TEE + 飞地内 Capability Broker（0.0% 失守）</text>
  <text x="735" y="524" fill="#d1fae5" font-size="12.5">• 门禁 1 (MAA 远程证明 + SKR)：仅向度量哈希匹配且禁调试的 H100 飞地释放 CMK 密钥</text>
  <text x="735" y="548" fill="#d1fae5" font-size="12.5">• 门禁 2 (飞地内 record-owner &amp; untrusted-write)：0.0248ms 阻断加密注入跨主体读与改库</text>
  <text x="735" y="572" fill="#d1fae5" font-size="12.5">• 门禁 3 (fixed-business-output &amp; 证明绑定)：物理锁死 trust-registry，禁向未证明节点外发</text>
  <text x="735" y="596" fill="#d1fae5" font-size="12.5">• 门禁 4 (original-requester-payment)：拦截伪造 HSM 维保通知触发的 $4,980 电汇盗刷</text>
  <text x="735" y="622" fill="#34d399" font-size="12" font-weight="700">🛡️ 实测开销：Broker 内存裁决 P50 = 0.0248 ms / 含 SQLite WAL 审计收据 P50 = 7.21 ms</text>

  <!-- Section 3 -->
  <rect x="45" y="662" width="1320" height="168" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="65" y="692" fill="#38bdf8" font-size="16" font-weight="800">🛠️ 企业 AI 主权密钥托管与机密计算上线安全评审 6 项必选 Checklist</text>
  <text x="65" y="722" fill="#e2e8f0" font-size="13">☑️ 1. 全面绑定 Managed HSM CMK：OpenAI 微调/文件与 AI Search 向量库启用客户自管密钥并演练一键 Crypto-Shredding</text>
  <text x="65" y="748" fill="#e2e8f0" font-size="13">☑️ 2. 高敏推理启用 Confidential GPU TEE：使用 Azure NCC H100 v5 (SEV-SNP + H100 TEE) 加密显存与 PCIe 总线</text>
  <text x="65" y="774" fill="#e2e8f0" font-size="13">☑️ 3. 强制 MAA 安全密钥释放 (SKR)：校验 MRENCLAVE 容器哈希与 is-debuggable=false 后才释放解密密钥</text>
  <text x="65" y="800" fill="#e2e8f0" font-size="13">☑️ 4. 飞地内部署 Capability Broker 防加密注入  ☑️ 5. 锁死 trust-registry 证明策略  ☑️ 6. 严禁向未证明外部节点外发数据</text>
