  <text x="447" y="350" fill="#cbd5e1" font-size="12">0.0.0.0/0 流量经 UDR 强制引流至 Hub Firewall，</text>
  <text x="447" y="368" fill="#cbd5e1" font-size="12">启用私有 DNS 解析器阻断外网递归 DNS 隧道，</text>
  <text x="447" y="388" fill="#6ee7b7" font-size="12" font-weight="700">且前端严禁修改防火墙出站规则（`untrusted-write`）！</text>

