  <!-- Header -->
  <rect x="30" y="22" width="1140" height="92" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="52" y="54" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1">AI SOLUTION ARCHITECT · 2026-11-12 ROUND 72 MILESTONE (410 项 PYTEST 断言里程碑 · SUBSEA CABLE PFE, DEEP-SEA ROV &amp; POLAR ICEBREAKER)</text>
  <text x="52" y="82" fill="#f8fafc" font-size="20" font-weight="800">跨洋海底光缆供电 PFE、深海作业 ROV 与极地科考破冰船 AI Agent：机械接地钥匙 + 零信任网关一图流</text>
  <text x="52" y="103" fill="#94a3b8" font-size="12.5">外部 OTDR/声呐故障包注入、岸站 12kV 高压误送电/ROV 误剪主干海缆、海底水听器窃密与 $4,980 租船盗刷 vs. 机械接地锁 + 能力网关 (410 项断言通过)</text>

  <!-- Left Column: Vulnerable Baseline -->
  <rect x="30" y="130" width="555" height="445" rx="12" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="30" y="130" width="555" height="44" rx="12" fill="url(#redGrad72)"/>
  <text x="50" y="158" fill="#fef2f2" font-size="16" font-weight="800">❌ 方案 A：一体化海缆/ROV Agent 直连岸站 PFE 与海床库 (Baseline ASR: 75.0%)</text>

  <rect x="52" y="192" width="510" height="74" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="216" fill="#fca5a5" font-size="13.5" font-weight="700">1. 外包海事勘测 OTDR 故障反射谱 (.sor) / 多波束声呐包间接提示词注入</text>
  <text x="68" y="238" fill="#e4e4e7" font-size="12">• 攻击者在侧扫声呐与 OTDR 故障报告中植入伪造“海缆总控高阻故障脉冲寻障指令”</text>
  <text x="68" y="256" fill="#a1a1aa" font-size="11.5">• 传统卫通防火墙与文本护栏无法识别“高阻接地脉冲测试 / 悬空海缆解脱切割”专业术语</text>

  <rect x="52" y="280" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="304" fill="#fca5a5" font-size="13.5" font-weight="700">2. 岸站 12kV 高压远供电源 (PFE) 误合闸与深海 ROV 误剪主干海缆 (BRK-153)</text>
  <text x="68" y="326" fill="#e4e4e7" font-size="12">• 被污染的协调 Agent 调用 write_record("business-result") 在甲板接续时远程合闸 12,500V DC</text>
  <text x="68" y="344" fill="#e4e4e7" font-size="12">• 同时下发指令驱动水下 3,000m ROV 液压剪切断邻近完好的跨国主干通信海缆</text>
  <text x="68" y="358" fill="#f87171" font-size="11.5" font-weight="700">✕ 致命人命与断网灾难：海缆船甲板接续工程师高压触电与跨国通信中断</text>

  <rect x="52" y="378" width="510" height="84" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="402" fill="#fca5a5" font-size="13.5" font-weight="700">3. 专属经济区海底水听器观测阵列与深海多金属结核矿区坐标窃密</text>
  <text x="68" y="424" fill="#e4e4e7" font-size="12">• 排障初筛 Agent 跨权限读取 restricted-budget 海底声学监听网与钴结壳探矿区精确坐标</text>
  <text x="68" y="442" fill="#f87171" font-size="11.5" font-weight="700">✕ 国家海洋战略机密失守：通过 send_message 将海床敏感设施坐标外发敌对探测方</text>

  <rect x="52" y="476" width="510" height="82" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="1"/>
  <text x="68" y="500" fill="#fca5a5" font-size="13.5" font-weight="700">4. 未备案离岸打捞船东白名单篡改与 $4,980 抢修动船定金盗刷 (BRK-154)</text>
  <text x="68" y="522" fill="#e4e4e7" font-size="12">• 伪造海缆船紧急动船账单改写 trust-registry 备案船东表并触发 request_payment($4,980)</text>
  <text x="68" y="542" fill="#f87171" font-size="11.5" font-weight="700">✕ 海事抢修资金失守：未经海缆联盟执委会硬件多签直接放行 $4,980 动船定金电汇</text>

  <!-- Right Column: Hardened Architecture -->
