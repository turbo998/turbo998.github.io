  <rect x="615" y="130" width="555" height="44" rx="12" fill="url(#greenGrad72)"/>
  <text x="635" y="158" fill="#ecfdf5" font-size="16" font-weight="800">✅ 方案 B：岸站 PFE 机械接地钥匙 + 气隙海床金库 + 能力网关 (Hardened ASR: 0.0%)</text>

  <rect x="637" y="192" width="510" height="74" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="216" fill="#6ee7b7" font-size="13.5" font-weight="700">1. 岸站 PFE 机械接地钥匙联锁 (Kirk Key LOTO) + ROV 死人开关 + untrusted-write</text>
  <text x="653" y="238" fill="#f1f5f9" font-size="12">• 抢修期岸站 12kV PFE 物理旋转接地并拔钥入柜；ROV 液压剪受母船领航员死人开关硬控制</text>
  <text x="653" y="256" fill="#34d399" font-size="11.5" font-weight="700">✓ 外部 OTDR/声呐染色会话 (untrusted=True) 写操作被 rule="untrusted-write" 0.0248ms 拦截</text>

  <rect x="637" y="280" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="304" fill="#6ee7b7" font-size="13.5" font-weight="700">2. 气隙海底水听器阵列与深海矿区坐标金库隔离 (record-owner + data-boundary)</text>
  <text x="653" y="326" fill="#f1f5f9" font-size="12">• 故障初筛 Agent (actor="calendar") 跨主体读取 restricted-budget 海床敏感库被立即拒绝</text>
  <text x="653" y="344" fill="#f1f5f9" font-size="12">• 任何包含专属经济区水听器阵列或多金属结核坐标的外发消息被出境边界死死卡住</text>
  <text x="653" y="358" fill="#34d399" font-size="11.5" font-weight="700">✓ 海洋安全与深海资源保密：海底声学网与矿区坐标 0 越权读取、0 外部泄露</text>

  <rect x="637" y="378" width="510" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="402" fill="#6ee7b7" font-size="13.5" font-weight="700">3. 海缆维护协议 (MA) 备案船东表只读锁定与海缆联盟双人签章结算</text>
  <text x="653" y="424" fill="#f1f5f9" font-size="12">• tool-allowlist + fixed-business-output 严禁 AI 修改 trust-registry 备案海缆船表</text>
  <text x="653" y="442" fill="#34d399" font-size="11.5" font-weight="700">✓ original-requester-payment 阻断外部账单发起的 $4,980 抢修动船定金电汇</text>

  <rect x="637" y="476" width="510" height="82" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="653" y="500" fill="#6ee7b7" font-size="13.5" font-weight="700">4. 全链路 SHA-256 审计收据与 ICPC / IEC 61936 / IMO 海事网安合规</text>
  <text x="653" y="522" fill="#f1f5f9" font-size="12">• 纯内存策略判定 P50 = 0.0248ms / P95 = 0.0409ms；含 SQLite WAL 收据落盘 P50 = 7.21ms</text>
  <text x="653" y="542" fill="#34d399" font-size="11.5" font-weight="700">✓ 满足国际海缆保护委员会 (ICPC)、IEC 61936 高压联锁与 IMO 海事网络安全审计</text>

