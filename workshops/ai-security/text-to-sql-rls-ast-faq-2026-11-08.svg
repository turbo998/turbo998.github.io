  <text x="650" y="495" fill="#94A3B8" font-size="12" font-weight="700">抗跨租户与二阶注入能力</text>
  <text x="915" y="495" fill="#94A3B8" font-size="12" font-weight="700">实测门禁开销 (Provenance)</text>

  <!-- Row 1 -->
  <rect x="68" y="514" width="1064" height="42" rx="6" fill="#111827"/>
  <text x="82" y="539" fill="#4ADE80" font-size="13" font-weight="700">🟢 方案 A：预聚合只读语义视图</text>
  <text x="340" y="539" fill="#E2E8F0" font-size="12">全员公开脱敏宏观 KPI 问答（零写/发信工具）</text>
  <text x="650" y="539" fill="#CBD5E1" font-size="12">静态物理视图隔离（不支持千人千面行隔离）</text>
  <text x="915" y="539" fill="#94A3B8" font-size="12">0 ms 额外网关开销</text>

  <!-- Row 2 -->
  <rect x="68" y="564" width="1064" height="42" rx="6" fill="#111827"/>
  <text x="82" y="589" fill="#FACC15" font-size="13" font-weight="700">🟡 方案 B：OBO 原生 RLS + AST 编译</text>
  <text x="340" y="589" fill="#E2E8F0" font-size="12">多租户/跨部门自助只读 BI 分析 (Fabric/Databricks)</text>
  <text x="650" y="589" fill="#FDE047" font-size="12">内核级行隔离 + 单条 SELECT 白名单 (防越权查)</text>
  <text x="915" y="589" fill="#38BDF8" font-size="12">内存核验 P50 = 0.0248 ms (n=200)</text>

  <!-- Row 3 -->
  <rect x="68" y="614" width="1064" height="46" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="82" y="641" fill="#34D399" font-size="13" font-weight="700">🔴 方案 C：方案 B + Capability Broker</text>
  <text x="340" y="641" fill="#F8FAFC" font-size="12" font-weight="600">Analytics-to-Action 复合 Agent (查库+写报表/发邮件/ERP)</text>
  <text x="650" y="641" fill="#6EE7B7" font-size="12" font-weight="700">阻断跨租户读 + 二阶表单元格注入写/外泄 (0% ASR)</text>
  <text x="915" y="641" fill="#A7F3D0" font-size="12" font-weight="700">SQLite WAL P50 = 7.21 ms (n=50)</text>
