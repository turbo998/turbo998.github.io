  </text>

  <rect x="636" y="472" width="520" height="82" rx="8" fill="#06382c" stroke="#34d399" stroke-width="1" />
  <text x="650" y="496" fill="#a7f3d0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">
    Gate 4 · 钌铱阳极/哈氏合金名录只读锁 + XRF 贵金属验收锁 ($4,990 拦截)
  </text>
  <text x="650" y="518" fill="#6ee7b7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">
