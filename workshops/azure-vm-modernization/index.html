<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Azure VM Workshop moved / 已迁移</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}
body {
  margin: 0;
  padding: 32px 16px;
  background: var(--cp-bg);
  color: var(--cp-text);
  font: 1rem/1.6 "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
}
main { max-width: 640px; margin: 0 auto; }
h1 { color: var(--cp-accent); }
a { color: var(--cp-link); overflow-wrap: anywhere; }
a:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <h1>Azure VM Workshop moved</h1>
  <p lang="zh-CN">Workshop 已迁移至公开的 Azure Infra Lab。正在跳转；如未自动打开，请使用下面的链接。</p>
  <p>This workshop is now maintained in the public Azure Infra Lab. Continue to the moved page:</p>
  <p><a id="moved-to" href="https://turbo998.github.io/Azure-Infra-Lab/workshops/azure-vm-modernization/workshop.html">Open the moved Workshop / 打开新入口</a></p>
  <p><a href="https://turbo998.github.io/Azure-Infra-Lab/workshops/azure-vm-modernization/calculator.html">Calculator / 计算器</a> · <a href="https://turbo998.github.io/Azure-Infra-Lab/workshops/azure-vm-modernization/demo.html">Demo / 自动演示</a> · <a href="https://github.com/turbo998/Azure-Infra-Lab/tree/main/workshops/azure-vm-modernization">Public repository / 公开仓库</a></p>
  <noscript><p>Automatic navigation requires JavaScript. The links above work without it.</p></noscript>
</main>
<script>
  (() => {
    const pages = ["workshop.html", "calculator.html", "demo.html"];
    const requested = window.location.pathname.split("/").pop();
    const page = pages.includes(requested) ? requested : "workshop.html";
    const target = new URL(page, "https://turbo998.github.io/Azure-Infra-Lab/workshops/azure-vm-modernization/");
    const query = new URLSearchParams(window.location.search);
    for (const key of ["lang", "demo", "theme", "scoutTheme"]) {
      if (query.has(key)) target.searchParams.set(key, query.get(key));
    }
    target.hash = window.location.hash;
    const theme = query.get("theme");
    if (!query.has("scoutTheme") && ["light", "dark"].includes(theme)) {
      document.documentElement.setAttribute("data-theme", theme);
    }
    document.getElementById("moved-to").href = target.href;
    window.location.replace(target.href);
  })();
</script>
</body>
</html>
