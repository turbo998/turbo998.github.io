1a2e" stroke="#284466"/><rect x="24" y="327" width="4" height="64" rx="2" fill="#38bdf8"/><text x="38" y="339" fill="#38bdf8" font-size="11.5" font-weight="700"><tspan x="38" dy="0">01 · Sealed Harness &amp; Denominators</tspan></text><text x="38" y="357" fill="#d5e4f5" font-size="12" font-weight="400"><tspan x="38" dy="0">Pin prompts, tool schemas, timeouts, and exact task</tspan><tspan x="38" dy="16.799999999999997">denominators so cross-model comparisons remain fair.</tspan></text></g><g data-takeaway="2"><rect x="467" y="315" width="426" height="88" rx="10" fill="#0b1a2e" stroke="#284466"/><rect x="467" y="327" width="4" height="64" rx="2" fill="#a78bfa"/><text x="481" y="339" fill="#a78bfa" font-size="11.5" font-weight="700"><tspan x="481" dy="0">02 · Deterministic Code Verifiers</tspan></text><text x="481" y="357" fill="#d5e4f5" font-size="12" font-weight="400"><tspan x="481" dy="0">Prefer AST, schema, exit-code, and unit-test</tspan><tspan x="481" dy="16.799999999999997">verifiers over uncalibrated single-LLM judge scores.</tspan></text></g><g data-takeaway="3"><rect x="910" y="315" width="426" height="88" rx="10" fill="#0b1a2e" stroke="#284466"/><rect x="910" y="327" width="4" height="64" rx="2" fill="#34d399"/><text x="924" y="339" fill="#34d399" font-size="11.5" font-weight="700"><tspan x="924" dy="0">03 · Explicit Provenance Separation</tspan></text><text x="924" y="357" fill="#d5e4f5" font-size="12" font-weight="400"><tspan x="924" dy="0">Clearly separate independently measured runs from</tspan><tspan x="924" dy="16.799999999999997">reported external benchmarks and option-swap deltas.</tspan></text></g></svg>
