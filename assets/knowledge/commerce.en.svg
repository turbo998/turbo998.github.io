<svg xmlns="http://www.w3.org/2000/svg" lang="en" role="img" aria-labelledby="knowledge-692d49ab18b9-title knowledge-692d49ab18b9-desc" viewBox="0 0 360 833" width="360" style="display:block;width:100%;height:auto;max-width:560px;margin:0 auto;font-family:system-ui,sans-serif"><title id="knowledge-692d49ab18b9-title">Agentic Commerce</title><desc id="knowledge-692d49ab18b9-desc">Buyer intent &amp; grounded discovery: WebIQ source freshness · product identity → grounds the offer → Offer &amp; merchant constraints: Price · inventory · shipping · provenance → requires consent → Agent authorization boundary: Human confirmation · scoped tools · audit trail → hands off to payment → Trusted checkout &amp; payment: Payment token · merchant contract · idempotency → records outcomes → Receipt, dispute &amp; evaluation: Offline fixtures are not live transactions</desc><rect width="360" height="833" rx="16" fill="#091827"/><text x="20" y="30" fill="#eef5ff" font-size="20" font-weight="700"><tspan x="20" dy="0">Agentic Commerce</tspan></text><text x="20" y="61" fill="#a9b8ce" font-size="13" font-weight="400"><tspan x="20" dy="0">Conceptual topology · not measured metrics</tspan></text><g data-concept="1"><rect x="16" y="87" width="328" height="124" rx="12" fill="#102238" stroke="#43617f"/><rect x="16" y="101" width="4" height="96" rx="2" fill="#63dbca"/><text x="32" y="117" fill="#f0f6ff" font-size="18" font-weight="650"><tspan x="32" dy="0">Buyer intent &amp; grounded</tspan><tspan x="32" dy="25.2">discovery</tspan></text><text x="32" y="173" fill="#c2d1e3" font-size="14" font-weight="400"><tspan x="32" dy="0">WebIQ source freshness · product</tspan><tspan x="32" dy="19.599999999999998">identity</tspan></text></g><g data-relationship="grounds the offer"><path d="M32 211 V256" fill="none" stroke="#63dbca" stroke-width="2"/><path d="M27 251 L32 257 L37 251" fill="none" stroke="#63dbca" stroke-width="2"/><text x="48" y="237" fill="#94e5da" font-size="13" font-weight="400"><tspan x