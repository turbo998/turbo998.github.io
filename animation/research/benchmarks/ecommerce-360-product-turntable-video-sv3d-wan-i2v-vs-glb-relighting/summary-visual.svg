    <text x="24" y="152" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">Key Takeaway: Never ask a 2D video diffusion model to invent the unseen backside of a commercial SKU. Either cap rotation to ±35° (1 photo) or project 2–4 real views onto a 3D proxy mesh before relighting the background with IC-Light.</text>
