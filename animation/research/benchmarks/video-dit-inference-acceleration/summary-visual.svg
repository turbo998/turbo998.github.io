    <text x="904" y="70" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="11.5">• Intra-node NVLink head swap</text>
    <text x="904" y="88" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="11.5">• Inter-node Ring P2P overlap</text>
