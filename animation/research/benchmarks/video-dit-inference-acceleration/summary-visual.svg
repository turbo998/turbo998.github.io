    <text x="72" y="258" fill="#34d399" font-family="Inter,Segoe UI,sans-serif" font-size="11.5" font-weight="700">19.4s (12.8× Speedup) · VBench 86.1 (-0.3 pts)</text>

    <text x="22" y="296" fill="#f87171" font-family="Inter,Segoe UI,sans-serif" font-size="12.5" font-weight="700">✕ Aggressive Uniform Skip + INT4 = 14.2s but VBench collapses to 71.2 (-15.2 pts)</text>
