  <text x="56" y="128" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="14">Accelerating Wan 2.2 14B from 248s to 19.4s (12.8× Speedup), Fitting Single 48GB L40S (35.8GB), and Preserving 86.1 VBench</text>

