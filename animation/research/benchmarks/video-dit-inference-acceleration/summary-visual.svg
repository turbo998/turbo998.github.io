  <text x="56" y="68" fill="#6ee7b7" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">ROUND 268 · DOMAIN 1 SELF-HOSTED VIDEO DIT INFERENCE ACCELERATION &amp; QUANTIZATION LAB</text>
