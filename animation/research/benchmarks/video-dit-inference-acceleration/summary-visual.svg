    <text x="22" y="188" fill="#cbd5e1" font-family="Inter,Segoe UI,sans-serif" font-size="12.5" font-weight="600">3. + SageAttention2 (INT8 QK + FP8 PV) + FP16 Islands (35.8GB)</text>
