<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 87 · GRUEN SIN-THETA NORMAL-OFFSET SHADOW BIAS VS CONSTANT DEPTH BIAS ACNE &amp; PETER-PANNING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Gruen Normal-Offset Bias (80° Shift 0.0492m Clears 0.2836m) vs Const Δz=0.05m (+0.23m Acne, 18.19× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Shifting receiver along N by ½·w_texel·√(1 − (N·L)²) stays bounded ≤ 0.05m while clearing the diverging ½·w·tan(θ) staircase
  </text>

  <!-- Left Panel: Gruen Normal-Offset Shadow Bias -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Gruen Sin-Theta Normal-Offset Bias (δ_N = ½·w·sin θ)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    w_texel = 0.10m · World Shift δ_N ≤ 0.05m Matches ½·w·tan(θ) Staircase Exactly
  </text>

  <!-- Exact clearance curve matching tan(theta) staircase left -->
  <path d="M 100 426 Q 430 416 535 250" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="508" cy="312" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-15 (θ=80°): δ_N = 0.0492 m Clears Δz = 0.2836 m Staircase (0 Acne!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Acne / Peter-Panning Stations: 0 / 17 (0.0000m Residual Error)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.35 ms (Algebraic) vs 6.43 ms (32-Ray Trig, 18.19×)
  </text>

  <!-- Right Panel: Naive Constant Depth Bias -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Constant Depth Bias (Δz = 0.0500 m)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Over-Biases Overhead (Peter-Panning) &amp; Under-Biases Grazing Slopes (+0.52m Acne)!
  </text>

  <!-- Flat constant bias vs rising tan(theta) staircase right -->
  <path d="M 660 426 Q 990 416 1095 250" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="660" y1="406" x2="1095" y2="406" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1068" cy="406" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-15 (80°): +0.2336m Acne · Station-16 (85°): +0.5215m Acne!
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Corrupted Stations: 14 / 17 (7 Peter-Panning + 7 Shadow Acne)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Cannot Simultaneously Fix Overhead Foot Detachment and Grazing Wall Stripes
  </text>
</svg>
