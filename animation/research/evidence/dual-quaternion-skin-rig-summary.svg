<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 30 · UNIT DUAL QUATERNION SKINNING (DQS) VS LINEAR BLEND SKINNING (LBS)
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    Unit Dual Quaternion DQS (R = 1.6000u, 0% Pinch) vs Linear Blend LBS (R = 0.2778u, -82.64% Pinch)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    At 160° wrist twist (w=0.50 midpoint), averaging rotation matrices scales radius by cos(80°)=0.1736, losing 96.98% cross-section area.
  </text>

  <!-- Left Panel: Unit Dual Quaternion Skinning (DQS) -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Unit Dual Quaternion DQS: q̂*(w) = b̂(w) / ||b_r(w)||
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Manifold Screw Interpolation on Spin(3)⋉R³ · 100.00% Cross-Section Preserved
  </text>

  <!-- Uniform cylinder schematic left -->
  <rect x="130" y="285" width="380" height="140" rx="16" fill="#132a4a" stroke="#38bdf8" stroke-width="3"/>
  <ellipse cx="130" cy="355" rx="22" ry="70" fill="#0f233f" stroke="#38bdf8" stroke-width="2.5"/>
  <ellipse cx="320" cy="355" rx="24" ry="70" fill="#064e3b" stroke="#34d399" stroke-width="3.5"/>
  <ellipse cx="510" cy="355" rx="22" ry="70" fill="#132a4a" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="320" y1="285" x2="320" y2="425" stroke="#34d399" stroke-width="4" stroke-dasharray="5,4"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    w=0.50 Midpoint Ring-4: R = 1.6000u · θ_eff = 80.00°
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Radial Shrink: 0.00% · Area Collapse: 0.00% (||q*_r|| ≡ 1.000000)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 54-Vertex Passes: 31.32 ms (Direct Cross) vs 36.05 ms (4x4 Unpack)
  </text>

  <!-- Right Panel: Linear Blend Skinning (LBS) -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Linear Blend LBS: M(w) = (1−w)M₀ + wM₁
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Euclidean Matrix Averaging · Candy-Wrapper Hourglass Collapse!
  </text>

  <!-- Pinched candy-wrapper hourglass schematic right -->
  <path d="M 690 285 Q 880 343 1070 285 L 1070 425 Q 880 367 690 425 Z" fill="#2a1225" stroke="#fb7185" stroke-width="3"/>
  <ellipse cx="690" cy="355" rx="22" ry="70" fill="#1f0d1d" stroke="#fb7185" stroke-width="2.5"/>
  <ellipse cx="880" cy="355" rx="7" ry="12" fill="#881337" stroke="#fda4af" stroke-width="3"/>
  <ellipse cx="1070" cy="355" rx="22" ry="70" fill="#2a1225" stroke="#fb7185" stroke-width="2.5"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    w=0.50 Midpoint Ring-4: R = 0.2778u (cos 80° = 0.1736×)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Radial Pinch: -82.64% · Cross-Section Area Loss: -96.98%
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Radius Collapses from 1.6000u to 0.2778u → Candy-Wrapper Twist Artifact
  </text>
</svg>
