  <line x1="115" y1="215" x2="685" y2="215" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="270" x2="685" y2="270" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="325" x2="685" y2="325" stroke="#334155"/>
  <line x1="115" y1="380" x2="685" y2="380" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="435" x2="685" y2="435" stroke="#334155"/>

  <text x="105" y="219" fill="#94a3b8" font-size="11" text-anchor="end">2.00×</text>
  <text x="105" y="274" fill="#94a3b8" font-size="11" text-anchor="end">1.50×</text>
  <text x="105" y="329" fill="#94a3b8" font-size="11" text-anchor="end">1.00×</text>
  <text x="105" y="384" fill="#94a3b8" font-size="11" text-anchor="end">0.50×</text>
  <text x="105" y="439" fill="#94a3b8" font-size="11" text-anchor="end">0.00×</text>

  <!-- Malley-Nusselt W_Malley(u) = 1.0000x flat line at y=325 -->
  <polyline fill="none" stroke="url(#ok)" stroke-width="4" points="115,325 257,325 400,325 542,325 685,325"/>
  <circle cx="115" cy="325" r="5" fill="#38bdf8"/>
  <circle cx="257" cy="325" r="5" fill="#10b981"/>
  <circle cx="400" cy="325" r="6" fill="#10b981"/>
  <circle cx="542" cy="325" r="5" fill="#10b981"/>
  <circle cx="685" cy="325" r="6" fill="#10b981"/>
  <text x="315" y="313" fill="#34d399" font-size="12" font-weight="700">Malley Cosine Lift W = (cos θ/π)/(cos θ/π) = 1.0000× (Zero Variance)</text>

  <!-- Malley Cosine Lift Height z = √(1-u): u=0(1.0)->325, u=0.25(0.866)->340, u=0.50(0.7071)->357, u=0.75(0.5000)->380, u=1.0(0.0)->435 -->
  <polyline fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 3" points="115,325 257,340 400,357 542,380 685,435"/>
  <text x="155" y="416" fill="#38bdf8" font-size="11" font-weight="600">Malley Elevation z = √(1−u): Median z(0.50) = 0.7071 (45° vs Uniform 60°)</text>

  <!-- Naive Uniform W_unif(u) = 2(1-u): u=0(2.0)->215, u=0.25(1.5)->270, u=0.50(1.0)->325, u=0.75(0.5)->380, u=1.0(0.0)->435 -->
  <polyline fill="none" stroke="url(#danger)" stroke-width="3.5" stroke-dasharray="7 4" points="115,215 257,270 400,325 542,380 685,435"/>
  <circle cx="115" cy="215" r="6" fill="#ef4444"/>
  <circle cx="257" cy="270" r="5" fill="#f97316"/>
  <circle cx="542" cy="380" r="5" fill="#f97316"/>
  <circle cx="685" cy="435" r="6" fill="#ef4444"/>
  <text x="135" y="236" fill="#f87171" font-size="12" font-weight="700">Uniform Solid Angle W = 2(1−u): 2.00× Spike to 0.00× Horizon Waste!</text>

  <!-- X-axis labels -->
  <text x="115" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 0 (u=0.00)</text>
  <text x="257" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 4 (u=0.25)</text>
  <text x="400" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 8 (u=0.50)</text>
  <text x="542" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 12 (u=0.75)</text>
  <text x="685" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 16 (u=1.00)</text>

  <!-- Right panel: KPI cards -->
  <rect x="740" y="152" width="404" height="104" rx="12" fill="#111827" stroke="#0284c7"/>
  <text x="764" y="180" fill="#38bdf8" font-size="12" font-weight="700">EXACT COSINE CANCELLATION (ALL 17 STRATA)</text>
  <text x="764" y="212" fill="#f8fafc" font-size="21" font-weight="800">W = 1.0000× vs [2.00× .. 0.00×]</text>
  <text x="764" y="238" fill="#94a3b8" font-size="12">Nusselt disk projection dA = cos θ dω matches Lambertian law</text>

  <rect x="740" y="268" width="404" height="104" rx="12" fill="#111827" stroke="#ef4444"/>
  <text x="764" y="296" fill="#f87171" font-size="12" font-weight="700">WHITE-SKY VARIANCE &amp; HORIZON RAY WASTE</text>
  <text x="764" y="328" fill="#f8fafc" font-size="21" font-weight="800">0/17 Distorted · Var = 0.0000</text>
  <text x="764" y="354" fill="#94a3b8" font-size="12">Eliminates Var = 1/3 = 0.3333 noise across 16/17 uniform strata</text>

  <rect x="740" y="384" width="404" height="104" rx="12" fill="#111827" stroke="#10b981"/>
  <text x="764" y="412" fill="#34d399" font-size="12" font-weight="700">8,192-PASS THROUGHPUT VS 64-RING POLAR CDF</text>
  <text x="764" y="444" fill="#f8fafc" font-size="21" font-weight="800">0.47 ms vs 130.75 ms (276.55×)</text>
  <text x="764" y="470" fill="#94a3b8" font-size="12">Algebraic z = √(1−u) avoids polar trig inversion (&lt;1e-13 error)</text>

  <!-- Footer provenance bar -->
  <rect x="56" y="508" width="1088" height="72" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="80" y="538" fill="#e2e8f0" font-size="13" font-weight="700">58-Solid 17-Station Malley-Nusselt Cosine Hemisphere Bench · Sealed Evidence: demos/malley-nusselt-cosine-hemisphere-rig/report.json</text>
  <text x="80" y="562" fill="#94a3b8" font-size="12">Provenance: Measured on Windows 11 Chromium Headless WebGL · 12/12 checks passed · Zero runtime model APIs</text>
