  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">ROUND 139 · 149TH DEMO · MALLEY (1988) &amp; NUSSELT (1928) COSINE-WEIGHTED HEMISPHERE SAMPLING</text>
  <text x="56" y="102" fill="#f8fafc" font-size="25" font-weight="800">Malley Cosine Lift z = √(1−u), p = cos θ/π vs Uniform Solid Angle p = 1/(2π)</text>
  <text x="56" y="130" fill="#94a3b8" font-size="14">Cancels cos θ/π identically to lock estimator weight W = 1.0000× (0.0000 variance) vs uniform W = 2(1−u) swinging from 2.0000× to 0.0000×</text>

  <!-- Left panel: 17-station Monte Carlo estimator weight comparison -->
  <rect x="56" y="152" width="660" height="336" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="80" y="182" fill="#e2e8f0" font-size="15" font-weight="700">Monte Carlo Estimator Weight W(u) = (cos θ / π) / p(ω) Across Random Stratum u ∈ [0, 1]</text>

