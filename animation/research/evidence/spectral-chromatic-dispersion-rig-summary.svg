<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 80 · CONTINUOUS SPECTRAL-LUT CHROMATIC DISPERSION VS NAIVE 3-TAP RGB CHANNEL SPLIT GHOSTING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Continuous Spectral Dispersion (x=−3px L = 0.1250, 0 Gaps) vs 3-Tap RGB Split (L = 0.0000 Gap, 13.20× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Integrating across a continuous wavelength LUT turns radial lens dispersion into a smooth rainbow instead of 3 RGB ghosts
  </text>

  <!-- Left Panel: Continuous Spectral Dispersion -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Continuous Spectral-LUT Chromatic Dispersion
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Δr = 12.0 px, w = 1.5 px · Continuous Trapezoidal Rainbow Plateau L = 0.1250
  </text>

  <!-- Smooth trapezoidal plateau left -->
  <line x1="95" y1="348" x2="545" y2="348" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="102" y="338" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Spectral Plateau L = w/Δr = 0.1250</text>
  <polyline points="105,432 145,432 215,348 425,348 495,432 535,432" fill="none" stroke="#34d399" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="242" cy="348" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-5 (x=−3px Orange-Yellow Band): L_disp = 0.1250 (0 Ghost Gaps!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Spectral Gap Dropout Stations: 0 / 17 (Seamless Rainbow)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.79 ms (Closed-Form) vs 10.48 ms (64-Tap LUT, 13.20×)
  </text>

  <!-- Right Panel: Naive 3-Tap RGB Channel Split -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive 3-Tap RGB Channel Split (R=−6px, G=0, B=+6px)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Splits Highlight into 3 Isolated Ghosts with 6 Dead-Black 0.0000 Gaps!
  </text>

  <!-- Three disconnected spikes right -->
  <line x1="655" y1="348" x2="1105" y2="348" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <polyline points="665,432 700,432 725,260 750,432 855,432 880,260 905,432 1010,432 1035,260 1060,432 1095,432" fill="none" stroke="#fb7185" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="802" cy="432" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-5 (x=−3px): Drops to 0.0000 (6 Dead Gaps &amp; 3 Isolated Ghosts!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Gap Dropout Stations: 6 / 17 · Ghost-Corrupted: 15 / 17
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Creates Jarring 3D-Glasses Red/Green/Blue Triple Ghosting at Screen Corners
  </text>
</svg>
