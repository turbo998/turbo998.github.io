<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 60 · SHOEMAKE C1 CUBIC QUATERNION SQUAD SPLINE VS PIECEWISE SLERP CORNER WHIP
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Shoemake C1 SQUAD (Δω_jump = 0.00°/s at q_1) vs Piecewise SLERP (160.00°/s Corner Whip Impulse, 60.17× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Blending main chord SLERP(q_k,q_{k+1},u) and tangent chord SLERP(s_k,s_{k+1},u) with 2u(1−u) locks C1 angular velocity continuity across keyframes
  </text>

  <!-- Left Panel: Shoemake C1 Quaternion SQUAD -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Shoemake C1 Cubic Quaternion SQUAD (2u(1−u) Blend)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    s_k = q_k·exp(−(ln(q_k⁻¹q_{k-1})+ln(q_k⁻¹q_{k+1}))/4) · Smooth Tangent ω(1.0) = +10.0°/s
  </text>

  <!-- Smooth C1 arch left -->
  <path d="M 105 425 C 210 265, 260 275, 315 270 C 370 265, 430 360, 525 390" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <line x1="255" y1="274" x2="375" y2="266" stroke="#a7f3d0" stroke-width="2.5" stroke-dasharray="5,4"/>
  <circle cx="315" cy="270" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Keyframe q_1 (t=1.00s): ω⁻ = ω⁺ = +10.00°/s (0.00°/s Velocity Jump)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Keyframe Angular Velocity Discontinuity: 0.00 °/s (C1 Smooth)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.52 ms (Lie Closed-Form) vs 31.26 ms (3× Trig SLERP, 60.17×)
  </text>

  <!-- Right Panel: Naive Piecewise Geodesic SLERP -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Piecewise Geodesic SLERP (C0 Only · Sharp Corner)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Velocity Snaps from +90.0°/s to −70.0°/s at t=1.00s (160.00°/s Whip!)
  </text>

  <!-- Sharp C0 kink right -->
  <polyline points="665,425 875,270 1085,390" fill="none" stroke="#fb7185" stroke-width="5" stroke-linejoin="miter"/>
  <circle cx="875" cy="270" r="9" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Keyframe q_1 (t=1.00s): Instantaneous Δω = 160.00°/s Corner Whip!
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Angular Velocity Whip Impulse: 160.00 °/s (Infinite Torque Spike)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Jerks Camera Rigs &amp; Character Necks Violently at Every Interior Keyframe
  </text>
</svg>
