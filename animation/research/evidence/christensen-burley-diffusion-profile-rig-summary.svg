<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 108 · CHRISTENSEN-BURLEY DUAL-EXPONENTIAL BSSRDF VS NAIVE SINGLE-GAUSSIAN WAX BLUR
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Christensen-Burley Dual-Exp (I(3d)=0.2088 Tail) vs Single Gaussian (0.0111, 67.09× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Combining e^(−r/d) near-core cusp with e^(−r/3d) diffusion tail preserves crisp pores and deep jade/skin translucency
  </text>

  <!-- Left Panel: Christensen-Burley Dual-Exponential Profile -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Christensen-Burley Dual-Exponential (½(e⁻ᵘ + e⁻ᵘ/³))
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Sharp Core Cusp (1d: 0.5422) + Long Translucent Tail (3d: 0.2088, 4d: 0.1410)
  </text>

  <!-- Sharp Cusp + Heavy Exponential Tail -->
  <path d="M 95 255 Q 205 365 432 395 L 545 412" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="432" cy="395" r="8" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    1d Core: 0.5422 · Station-12 (3d Tail): 0.2088 · Station-16 (4d): 0.1410
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Corrupted Radial Stations: 0 / 17 (Crisp Surface Detail + Warm Deep Glow)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 1.86 ms (Dual-Exp) vs 124.46 ms (64-Dipole, 67.09×)
  </text>

  <!-- Right Panel: Naive Single-Gaussian Wax Blur -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Single-Gaussian Subsurface Blur (e^(−u²/2))
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Bloats Near-Core Pores (1d: 0.6065) &amp; Kills Deep Tail (3d: 0.0111)!
  </text>

  <!-- Dashed Burley reference + Bloated top / dead tail Gaussian -->
  <path d="M 655 255 Q 765 365 992 395 L 1105 412" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 655 255 Q 760 280 865 432 L 1105 435" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="992" cy="434" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-12 (3d Tail): I_Gauss = 0.0111 vs 0.2088 (−0.1977 / −94.68% Extinguished!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Corrupted Stations: 16 / 17 (Smears Fine Pores &amp; Chokes Translucent Ears/Jade)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Produces the Classic CG &quot;Blurry Waxy Plastic&quot; Subsurface Artifact
  </text>
</svg>
