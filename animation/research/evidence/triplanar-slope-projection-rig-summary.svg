<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 91 · GEISS TRIPLANAR WORLD PROJECTION VS TOP-DOWN PLANAR UV CLIFF STRETCHING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Geiss Triplanar Projection (80° Cliff D = 1.0000) vs Top-Down Planar UV (D = 0.1736, 26.74× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Orthogonal YZ + XZ world-plane projection N_x² + N_y² ≡ 1.0000 eliminates 5.76× (80°) to 11.47× (85°) cliff UV stretching
  </text>

  <!-- Left Panel: Geiss Conformal Triplanar Projection -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Geiss Conformal Triplanar Projection (YZ + XZ + XY)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    D_tri(θ) = D₀ · (N_y·cos θ + N_x·sin θ) = D₀ · (N_y² + N_x²) ≡ 1.0000
  </text>

  <!-- Flat unit texel density line left -->
  <line x1="95" y1="310" x2="545" y2="310" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="508" cy="310" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-15 (θ=80° Cliff): D_tri = 1.0000 (0.00% Streak Stretch!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Stretched Cliff Stations: 0 / 17 (Uniform Texel Density 5°..85°)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.49 ms (Algebraic) vs 13.04 ms (64-Step Quad, 26.74×)
  </text>

  <!-- Right Panel: Naive Top-Down Planar XZ Projection -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Top-Down Planar XZ Projection (uv = pos.xz)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Foreshortens by cos(θ) → 5.76× Stretch at 80° &amp; 11.47× Stretch at 85°!
  </text>

  <!-- Cosine collapse curve right -->
  <line x1="655" y1="310" x2="1105" y2="310" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 665 311 Q 880 335 1095 422" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1068" cy="412" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-15 (80°): D = 0.1736 (−82.64% Loss) · Station-16 (85°): D = 0.0872!
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Stretched Cliff Stations: 15 / 17 (Max Loss −0.9128 at 85°)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Turns Steep Terrain Cliffs Into Blurry Vertical Noodle Streaks
  </text>
</svg>
