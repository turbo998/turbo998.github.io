<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 70 · MCGUIRE NEIGHBORMAX VELOCITY TILE MOTION BLUR VS CENTER-VELOCITY SILHOUETTE CUTOFF
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    McGuire NeighborMax (Exterior d=+1px C = 0.4375, 0 Clipped) vs Center Velocity (C = 0.0000 Scissor Cutoff, 13.42× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Dilating tile max velocity via NeighborMax(3×3) allows fast foreground objects (v=16px) to blur smoothly across stationary backgrounds (v=0)
  </text>

  <!-- Left Panel: McGuire NeighborMax Tile Dilation -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ McGuire NeighborMax Tile Dilation + Soft Depth
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    v_NeighborMax = 16.0 px Across Background Tiles · Smooth Shutter Ramp
  </text>

  <!-- Smooth symmetric shutter ramp left -->
  <line x1="205" y1="245" x2="205" y2="435" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="212" y="262" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Object Silhouette (d=0)</text>
  <polyline points="105,295 405,432 525,432" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="230" cy="352" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-5 (d=+1px Outside Edge): C_out = 0.4375 (Smooth 7-px Trail Spill)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Scissor-Clipped Exterior Trail Pixels: 0 / 17
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.78 ms (NeighborMax O(1)) vs 10.53 ms (64-Tap Search, 13.42×)
  </text>

  <!-- Right Panel: Naive Center-Pixel Velocity Lookup -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Center-Velocity Lookup (v_center = 0 Outside)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Reads Background v = 0 at d ≥ +1px → Clips 100% of Exterior Motion Trail!
  </text>

  <!-- Abrupt scissor cliff at d=0 right -->
  <line x1="765" y1="245" x2="765" y2="435" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <polyline points="665,295 765,340 765,432 1085,432" fill="none" stroke="#fb7185" stroke-width="5" stroke-linejoin="miter"/>
  <circle cx="790" cy="432" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-5 (d=+1px Outside Edge): Clipped to 0.0000 (−0.4375 Trail Lost!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Clipped Exterior Trail Stations: 7 / 17 (100% Exterior Trail Erased)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Leaves Fast-Moving Swords, Wheels &amp; Limbs with Hard Cardboard Edges
  </text>
</svg>
