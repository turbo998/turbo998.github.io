<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 50 · BEER-LAMBERT ANALYTICAL EXPONENTIAL VOLUME INTEGRATION VS FORWARD-EULER LINEAR BLOWOUT
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Beer-Lambert 1−e^{−τ} (Step-1 L₁ = 0.7981 ≤ 1.0) vs Forward-Euler τ=1.60 (L₁ = 1.6000, T₁ = -0.6000!)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Analytical intra-step exponential integration guarantees α_step ∈ [0, 1) and T_k &gt; 0 for arbitrarily dense clouds and coarse ray-march steps
  </text>

  <!-- Left Panel: Beer-Lambert Analytical Exponential -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Beer-Lambert Analytical Exponential: α = 1 − e^{−σ_t Δs}
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    T_{k+1} = T_k·e^{−1.60} · Monotonic Asymptotic Convergence to L_e = 1.0000
  </text>

  <!-- Smooth monotonic exponential saturation curve left -->
  <line x1="100" y1="285" x2="540" y2="285" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="430" y="276" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Equilibrium L_e = 1.0000</text>
  <path d="M 105 440 Q 130 300 220 287 L 520 285" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="135" cy="312" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Step-1 (s=0.50m, τ=1.60): L₁ = 0.7981 · T₁ = +0.2019 &gt; 0
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Radiance Overshoot: 0.0000 · Negative-T Flips: 0 / 17
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Step Passes: 5.34 ms (Single Exp) vs 7.32 ms (32-Substep, 1.37×)
  </text>

  <!-- Right Panel: Naive Forward-Euler Linear Blowout -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Forward-Euler Linear Step: α = σ_t·Δs = 1.60
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Overshoots Equilibrium to 1.6000 &amp; Flips Transmittance Negative (T₁ = −0.60)!
  </text>

  <!-- Oscillating sawtooth curve right -->
  <line x1="660" y1="330" x2="1100" y2="330" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <polyline points="665,440 700,252 730,368 760,298 790,340 820,315 850,330 1080,330" fill="none" stroke="#fb7185" stroke-width="4.5" stroke-linejoin="round"/>
  <circle cx="700" cy="252" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Step-1 (s=0.50m, τ=1.60): L₁ = 1.6000 (+60% Blowout!) · T₁ = -0.6000
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Peak Equilibrium Overshoot: +0.6000 · Negative-T Stations: 8 / 17
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Causes Alternating Bright/Dark Ringing Bands in Dense Clouds
  </text>
</svg>
