  <rect x="740" y="152" width="404" height="104" rx="12" fill="#111827" stroke="#0284c7"/>
  <text x="764" y="180" fill="#38bdf8" font-size="12" font-weight="700">GRAZING SILHOUETTE RIM (STATION 16, 90°, μ = 0.00)</text>
