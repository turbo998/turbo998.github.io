  <text x="56" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">ROUND 134 · 144TH DEMO · ASHIKHMIN &amp; SHIRLEY (JGT 2000) SUBTRACTIVE FRESNEL-DIFFUSE TRANSMITTANCE</text>
  <text x="56" y="102" fill="#f8fafc" font-size="25" font-weight="800">Subtractive Coupling (1 − F(μ)) + F(μ) = 1.0000× vs Naive Additive 1 + F(μ)</text>
  <text x="56" y="130" fill="#94a3b8" font-size="14">Attenuates transmitted diffuse as 1 − F(μ) to 0.0000 at 90° grazing rim (E = 1.0000×, 0/17 overbright) vs naive 2.0000× blowout (17/17 overbright)</text>

