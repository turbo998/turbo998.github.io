  <text x="764" y="238" fill="#94a3b8" font-size="12">When F(0) = 1.0000, transmitted diffuse 1 − F(0) = 0.0000</text>

  <rect x="740" y="268" width="404" height="104" rx="12" fill="#111827" stroke="#ef4444"/>
