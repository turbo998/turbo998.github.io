  <text x="764" y="328" fill="#f8fafc" font-size="21" font-weight="800">0/17 Overbright · 1−F = 0.7322</text>
  <text x="764" y="354" fill="#94a3b8" font-size="12">Eliminates +26.78% mid-rim blowout across all 17/17 stations</text>

  <rect x="740" y="384" width="404" height="104" rx="12" fill="#111827" stroke="#10b981"/>
  <text x="764" y="412" fill="#34d399" font-size="12" font-weight="700">8,192-PASS THROUGHPUT VS 64-BOUNCE STOKES SERIES</text>
  <text x="764" y="444" fill="#f8fafc" font-size="21" font-weight="800">0.44 ms vs 11.42 ms (25.66×)</text>
