<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 32 · PREMULTIPLIED ASSOCIATED ALPHA VS STRAIGHT ALPHA BILINEAR DARK HALO
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    Premultiplied Alpha (I_out = 0.9500, 0% Halo) vs Straight Alpha (I_out = 0.7000, -26.32% Dip)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Blending bright foreground (1.00) over bright sky (0.90) at t=0.50: Straight Alpha squares (1-t) into 0.25, creating a dark 0.7000 fringe!
  </text>

  <!-- Left Panel: Premultiplied Associated Alpha -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Premultiplied Associated Alpha: (ONE, 1−SRC_ALPHA)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Filtering &amp; OVER Compositing Commute · Monotonic 1.00 → 0.95 → 0.90 Edge
  </text>

  <!-- Monotonic linear ramp left -->
  <line x1="110" y1="280" x2="530" y2="310" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <line x1="110" y1="310" x2="530" y2="310" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="110" cy="280" r="7" fill="#38bdf8"/>
  <circle cx="320" cy="295" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="530" cy="310" r="7" fill="#38bdf8"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    t=0.50 Midpoint Tap-8: I_out = 0.50(1.0) + 0.50(0.9) = 0.9500
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Dark Halo Dip: 0.0000 · Edge Radiance Loss: 0.00%
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Tap Passes: 3.43 ms (Direct OVER) vs 3.40 ms (Unpremult Divide)
  </text>

  <!-- Right Panel: Straight Unassociated Alpha -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Straight Unassociated Alpha: (SRC_ALPHA, 1−SRC_ALPHA)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Transparent Black (0,0,0,0) Bleeds In · Quadratic (1−t)² Dark Halo Valley!
  </text>

  <!-- Quadratic dark halo dip curve right -->
  <line x1="670" y1="280" x2="1090" y2="310" stroke="#475569" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 670 280 Q 880 490 1090 310" fill="none" stroke="#fb7185" stroke-width="5"/>
  <circle cx="880" cy="392" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    t=0.50 Midpoint Tap-8: I_out = 0.50²(1.0) + 0.50(0.9) = 0.7000!
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Dark Halo Dip: -0.2500 · Edge Radiance Loss: -26.32%
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Edge Drops 0.2000 Darker Than Both Foreground (1.00) &amp; Sky (0.90)!
  </text>
</svg>
