  <text x="646" y="186" fill="#f8fafc" font-size="17" font-weight="800">L_HK(μ_i, μ_v) = 2 · μ_i / (μ_i + μ_v)  →  0/17 Starved</text>
  <text x="646" y="212" fill="#94a3b8" font-size="12.5">St 8 (0.50): 1.3333 · St 12 (0.25): 1.6000 · St 16 (0.00 Horizon): 2.0000 Rim Glow</text>

