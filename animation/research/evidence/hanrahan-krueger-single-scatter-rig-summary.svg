  <text x="48" y="112" fill="#94a3b8" font-size="13.5">Analytical depth integral L_HK = 2·μ_i / (μ_i + μ_v) captures dusty/epidermis grazing rim brightening across 17 viewing cosines (0.31 ms vs 117.32 ms, 384.42× faster)</text>

