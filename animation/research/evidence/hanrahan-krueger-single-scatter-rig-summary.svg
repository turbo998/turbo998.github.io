  <rect x="624" y="362" width="528" height="104" rx="12" fill="#0b1220" stroke="#10b981" stroke-width="1.5"/>
  <text x="646" y="390" fill="#34d399" font-size="12" font-weight="700">8,192 × 17-STATION BENCHMARK &amp; 58-SOLID RIG VERIFICATION</text>
  <text x="646" y="418" fill="#f8fafc" font-size="17" font-weight="800">0.31 ms (Closed-Form HK) vs 117.32 ms (64-Layer Slab) · 384.42× Faster</text>
  <text x="646" y="444" fill="#a7f3d0" font-size="12.5">Agrees with 64-layer optical-depth slab quadrature within &lt; 1e-13 across all 17 stations</text>
