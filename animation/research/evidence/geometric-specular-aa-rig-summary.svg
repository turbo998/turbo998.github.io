<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 71 · KAPLANYAN SCREEN-SPACE CURVATURE GEOMETRIC SPECULAR AA VS SUB-PIXEL BEVEL SPARKLE STROBE
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Kaplanyan Specular AA (α_AA = 0.3536, I = 1.1284, 1.08× Calm) vs Raw α₀ = 0.05 (I = 7.9788, 50.40× Strobe, 159.86× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Adding screen-space geometric normal variance σ_N² = ∥∂n/∂x∥² + ∥∂n/∂y∥² eliminates sub-pixel highlight strobing on curved bevels
  </text>

  <!-- Left Panel: Kaplanyan Curvature Specular AA -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Kaplanyan Geometric Specular AA (α_AA = √(α₀² + κ²))
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Widens α₀=0.05 → α_AA=0.3536 (κ=0.35 rad/px) · Calm 1.08× Sub-Pixel Envelope
  </text>

  <!-- Calm flat envelope left -->
  <line x1="95" y1="398" x2="545" y2="398" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="102" y="388" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Pixel-Conserved Peak I = 1.1284</text>
  <path d="M 105 404 Q 320 392 535 404" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="398" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (δ=0.00px): I_spec = 1.1284 · Edge (δ=±0.40px): I_spec = 1.0436
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Sub-Pixel Firefly Strobe Stations: 0 / 17 (Strobe Ratio: 1.08×)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 1.25 ms (Closed-Form AA) vs 199.69 ms (64-Tap Conv, 159.86×)
  </text>

  <!-- Right Panel: Naive Raw Roughness Firefly Strobe -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Unfiltered Raw Roughness (α₀ = 0.05 Ignores κ)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Point-Samples Narrow Lobe on Curved Bevel → 50.40× Sub-Pixel Disco Sparkle!
  </text>

  <!-- Sharp needle spike right -->
  <line x1="655" y1="398" x2="1105" y2="398" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 665 432 C 780 432, 845 420, 880 250 C 915 420, 980 432, 1095 432" fill="none" stroke="#fb7185" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="880" cy="250" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (δ=0.00px): Spikes to 7.9788 (7.07× Blowout) vs 0.1583 at δ=±0.40px!
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Strobe-Corrupted Stations: 17 / 17 (50.40× Peak-to-Edge Strobe!)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Triggers Violent TAA Flicker &amp; HDR Bloom Fireflies During Slow Camera Pans
  </text>
</svg>
