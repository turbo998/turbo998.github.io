<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 97 · BAVOIL HBAO TANGENT-HORIZON ANGLE BIAS VS LOW-POLY PHONG FACET ACNE
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Bavoil HBAO Tangent Bias (φ=24° V = 1.0000) vs Unbiased SSAO (V = 0.5933, 145.29× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Gating horizon elevation above sin(θ_bias = 25°) prevents Phong-interpolated normals from self-occluding flat low-poly triangles
  </text>

  <!-- Left Panel: Bavoil HBAO Tangent-Angle Bias -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Bavoil HBAO Tangent-Angle Bias (θ_bias = 25.0°)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    AO = max(0, (sin φ − sin 25°) / (1 − sin 25°)) = 0 · Clean Convex Surface
  </text>

  <!-- Flat unoccluded V=1.0000 line left -->
  <line x1="95" y1="285" x2="545" y2="285" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="530" cy="285" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-16 (φ=24.0° Polygon Edge): V_HBAO = 1.0000 (0.0000 Facet Acne!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Facet-Striped Stations: 0 / 17 (Zero Low-Poly Self-Occlusion)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.49 ms (Algebraic) vs 70.55 ms (64-Ray Trig, 145.29×)
  </text>

  <!-- Right Panel: Naive Unbiased Horizon SSAO -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Unbiased Horizon SSAO (θ_bias = 0.0°)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Phong Tilt φ = 24° Mistakes Flat Triangle For Hill → −40.67% Dark Stripe!
  </text>

  <!-- Dropping visibility ramp right -->
  <line x1="655" y1="285" x2="1105" y2="285" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <line x1="655" y1="285" x2="1095" y2="395" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1090" cy="394" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-16 (φ=24.0°): V_naive = 0.5933 (−0.4067 False Polygon Stripe!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Striped Stations: 16 / 17 (All 16 Tilted Stations Self-Occluded)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Paints Dark Polygon-Wireframe Acne Across Smooth-Shaded Cylinders &amp; Cheeks
  </text>
</svg>
