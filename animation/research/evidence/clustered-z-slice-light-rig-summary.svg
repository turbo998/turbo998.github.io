<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 64 · OLSSON LOGARITHMIC CLUSTERED FORWARD+ Z-SLICING VS LINEAR DEPTH SLICE OVERLOAD
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Olsson Logarithmic Slicing (1.00× Lights/Slice, r = 1.7191) vs Linear Slicing (12.00× Slice-0 Overload &amp; 11 Empty Slices, 107.49× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Geometric slice planes z_k = z_near·(z_far/z_near)^(k/N_z) keep 3D froxels cubical across a 10,000:1 frustum depth range
  </text>

  <!-- Left Panel: Olsson Logarithmic Z-Slicing -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Olsson Logarithmic Z-Slicing (s = ⌊ln(z)·scale + bias⌋)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Self-Similar Aspect Ratio z_{k+1}/z_k = 1.7191 · Exact 1/1 Light Band Per Slice
  </text>

  <!-- Flat uniform line left -->
  <line x1="100" y1="385" x2="540" y2="385" stroke="#34d399" stroke-width="5"/>
  <circle cx="115" cy="385" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Slice-0 .. Slice-16: 1 / 1 Light Band Each (0.00× Overload Bias)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Distorted Froxel Depth Slices: 0 / 17 (Balanced Culling Grid)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Slice Passes: 1.75 ms (O(1) Scale+Bias) vs 187.74 ms (Plane Search, 107.49×)
  </text>

  <!-- Right Panel: Naive Linear View-Space Slicing -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Linear View-Space Slicing (Δz = 58.82 m / Slice)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Slice-0 Spans [0.10m, 58.92m] → Crams 12/17 Near-to-Mid Light Bands (12.00×)!
  </text>

  <!-- Giant spike at slice 0 right -->
  <line x1="660" y1="385" x2="1100" y2="385" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <polyline points="675,242 695,385 720,385 745,425 1090,425" fill="none" stroke="#fb7185" stroke-width="5" stroke-linejoin="miter"/>
  <circle cx="675" cy="242" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Slice-0: 12 / 1 Lights (12.00× Overload!) · 11 Far Slices Completely Empty (0 Lights)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Distorted Froxel Slices: 12 / 17 (12× Near Bottleneck + 11 Dead Slices)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Turns Clustered Shading Back into Brute-Force Forward Shading in Indoor Rooms
  </text>
</svg>
