<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 53 · SCREEN-SPACE THICKNESS-GATED DEPTH-SLAB CONTACT SHADOW VS INFINITE-PILLAR HALO
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Thickness Slab [1.00, 1.25]m (0/17 False Halos, 5 True Shadows) vs 2.5D Infinite Pillar (12/17 False Halos, 4.45× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Gating screen-space ray-marching by finite linear-Z thickness [z_buf, z_buf + Δτ] prevents thin foreground posts from casting detached black halos
  </text>

  <!-- Left Panel: Thickness-Gated Depth Slab -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Finite-Thickness Depth Slab: z_ray ∈ [1.00, 1.25] m
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    |z_ray − (z_buf + ½Δτ)| ≤ ½Δτ · Background Rays Pass Behind Post
  </text>

  <!-- Step function: 5 shadowed stations then 12 lit stations left -->
  <line x1="230" y1="255" x2="230" y2="450" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="110" y="272" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Post [1.00, 1.25]m</text>
  <text x="290" y="272" fill="#34d399" font-family="Consolas, monospace" font-size="12">Empty Air Behind Post (V = 1.0)</text>
  <polyline points="105,432 220,432 240,290 520,290" fill="none" stroke="#34d399" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="380" cy="290" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Ray-10 (z=2.00m Behind Post): Visibility = 1.0 (Unoccluded Lit Wall)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    True Contact Shadows: 5 / 5 · False Detached Halos: 0 / 17
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Ray Passes: 0.29 ms (Direct Recip-Z) vs 1.30 ms (4×4 InvProj, 4.45×)
  </text>

  <!-- Right Panel: Naive 2.5D Infinite Pillar Halo -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive 2.5D Infinite-Pillar Test: z_ray ≥ z_buf (1.00 m)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Treats 0.25m Foreground Post as an Infinite Solid Wall [1.00m, +∞)!
  </text>

  <!-- Flat zero visibility across all 17 stations right -->
  <line x1="790" y1="255" x2="790" y2="450" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <polyline points="665,432 780,432 800,290 1080,290" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="5,4"/>
  <line x1="665" y1="432" x2="1080" y2="432" stroke="#fb7185" stroke-width="5"/>
  <circle cx="940" cy="432" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Ray-10 (z=2.00m Behind Post): Falsely Shadowed V = 0.0 (Detached Halo!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    False Detached Shadow Halos: 12 / 17 Background Stations Blackened!
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Stamps Dark Silhouette Halos Around Foreground Legs, Poles &amp; Weapons
  </text>
</svg>
