<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 90 (100TH DEMO MILESTONE) · CASTAÑO COVERAGE-PRESERVING ALPHA MIPMAP VS VANISHING FOLIAGE
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Castaño Alpha Mip Rescaling (Mip 2..4 C = 0.3750) vs Box-Filtered Mip (C = 0.0000, 6.56× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Restoring sub-texel alpha contrast α_corr = ᾱ + (α_mip − ᾱ)·2^L prevents distant alpha-tested forests from vanishing
  </text>

  <!-- Left Panel: Castano Coverage-Preserving Alpha Mipmap -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Castaño Coverage-Preserving Alpha Mipmap
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    ᾱ = 0.35, τ = 0.50 · Locks Canopy Coverage C(L) = 0.3750 Across Mip 0..4
  </text>

  <!-- Flat conserved canopy coverage line left -->
  <line x1="95" y1="335" x2="545" y2="335" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="335" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (Mip L=2.0) to Station-16 (Mip 4.0): C = 0.3750 (0.00% Thinning!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Thinned / Vanished Stations: 0 / 17 (100% Canopy Preserved)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 2.94 ms (Closed-Form) vs 19.32 ms (Bisection, 6.56×)
  </text>

  <!-- Right Panel: Naive Box-Filtered Alpha Mipmap -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Box-Filtered Alpha Mipmap (Unscaled)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Box Averaging Pulls Peak Alpha ≤ 0.50 at Mip ≥ 2 → Distant Trees Vanish to 0%!
  </text>

  <!-- Collapsing coverage curve right -->
  <line x1="655" y1="335" x2="1105" y2="335" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 665 335 Q 780 355 880 432 L 1095 432" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="880" cy="432" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8..16 (Mip 2.0..4.0): C_naive = 0.0000 (−100% Total Extinction!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Thinned Stations: 16 / 17 (9/17 Stations Completely Wiped Out to 0%)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Standard 2×2 Box Mipmaps Conserve Mean ᾱ = 0.35 &lt; τ = 0.50 Instead of Coverage
  </text>
</svg>
