<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 52 · BARYCENTRIC DISPLACED MICRO-MESH (DMM) VS POM RAY-MARCH RIDGE TUNNELING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Barycentric 2^L DMM (17/17 Rays Captured, 1.8000u Crest) vs Fixed-Step POM (9/17 Tunneled, -47.27% Loss, 1.81× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Watertight dyadic barycentric micro-segments capture sharp displaced silhouettes without POM ray-marching tunneling or pancake slicing
  </text>

  <!-- Left Panel: Barycentric Displaced Micro-Mesh -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Barycentric Displaced Micro-Mesh (2^4 = 16 Segments)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    t* = (y_ray − H_k) / (H_{k+1} − H_k) · Watertight Crest Vertex at x = 0.00u
  </text>

  <!-- Sharp ridge captured left -->
  <line x1="100" y1="305" x2="300" y2="305" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 120 440 Q 260 438 300 305 L 320 265 L 340 305 Q 380 438 520 440" fill="none" stroke="#34d399" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="300" cy="305" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Ray-13 (y=1.50u): Exact Flank Hit at x* = -0.0705u (Crest = 1.8000u)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Tunneled Rays: 0 / 17 · Silhouette Crest Loss: 0.00%
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Ray Passes: 14.22 ms (Closed-Form Hit) vs 25.73 ms (48-Step Bisect, 1.81×)
  </text>

  <!-- Right Panel: Coarse Fixed-Step POM Tunneling -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Coarse Fixed-Step POM Ray-Marching (Δx = 0.40u)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Samples at x ∈ {−0.20, +0.20}u Straddle &amp; Miss the x = 0.00u Peak!
  </text>

  <!-- Tunneled ridge right -->
  <path d="M 680 440 Q 820 438 860 305 L 880 265 L 900 305 Q 940 438 1080 440" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="5,4"/>
  <polyline points="680,440 840,355 920,355 1080,440" fill="none" stroke="#fb7185" stroke-width="4.5"/>
  <line x1="660" y1="305" x2="1100" y2="305" stroke="#fb7185" stroke-width="3.5" stroke-dasharray="6,4"/>
  <circle cx="880" cy="305" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Ray-13 (y=1.50u): Tunnels Through Peak! (Max Sampled Crest = 0.9491u)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Tunneled Grazing Rays: 9 / 17 (-47.27% Silhouette Crest Loss!)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Creates Floating Pancake Layers &amp; Clipped Horizons at Grazing Angles
  </text>
</svg>
