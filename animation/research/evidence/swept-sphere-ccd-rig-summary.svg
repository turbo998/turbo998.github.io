<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 33 · SWEPT-SPHERE CONTINUOUS COLLISION DETECTION (CCD) VS DISCRETE TUNNELING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    Swept-Sphere CCD (TOI τ* = 0.0500, x₅ = -1.1200u) vs Discrete Tunneling (x₅ = +0.4000u)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    When step stride Δx = 0.80u exceeds barrier overlap width 2(R+h) = 0.72u, discrete checks jump from x₄=-0.40u to x₅=+0.40u unhindered!
  </text>

  <!-- Left Panel: Swept-Sphere CCD TOI -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Swept-Sphere CCD: Minkowski Slab TOI τ* = 0.0500
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Expands Wall by R+h = 0.36u · Reflects Remaining 95% Step Cleanly
  </text>

  <!-- Wall + Minkowski boundary + reflected trajectory left -->
  <rect x="372" y="256" width="26" height="190" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <line x1="342" y1="256" x2="342" y2="446" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polyline points="130,425 270,380 342,355 195,305" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="342" cy="355" r="8" fill="#fbbf24" stroke="#fef08a" stroke-width="2"/>
  <circle cx="195" cy="305" r="14" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
  <text x="320" y="472" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Impact at x*=-0.3600u (τ*=0.0500) → Rebounds to x₅=-1.1200u
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Wall Penetration: 0.0000u · Tunneling Events: 0
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 11-Step Passes: 1.67 ms (Closed-Form) vs 3.70 ms (52-Step Bisect)
  </text>

  <!-- Right Panel: Discrete End-of-Step Tunneling -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Discrete End-of-Step Check: |x_{k+1}| ≤ R + h_wall
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Bullet-Through-Paper Tunneling · Jumps Across [-0.36, +0.36]u Unseen!
  </text>

  <!-- Wall + ghost tunneling trajectory right -->
  <rect x="867" y="256" width="26" height="190" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <polyline points="690,425 832,372 932,334 1065,284" fill="none" stroke="#fb7185" stroke-width="4.5" stroke-dasharray="8,5"/>
  <circle cx="832" cy="372" r="12" fill="#2a1225" stroke="#fb7185" stroke-width="2.5"/>
  <circle cx="932" cy="334" r="14" fill="#881337" stroke="#fda4af" stroke-width="3"/>
  <text x="880" y="472" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    x₄=-0.4000u → x₅=+0.4000u (100% Barrier Tunneling!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Step-5 Error: 1.5200u · Step-10 Error: 9.5200u
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Integer Frame Endpoints Miss [−0.36, +0.36]u Overlap Window Completely
  </text>
</svg>
