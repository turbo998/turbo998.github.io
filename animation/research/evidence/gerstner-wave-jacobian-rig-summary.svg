<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 93 · TESSENDORF GERSTNER WAVE JACOBIAN LIMITER VS OVER-STEEPENED CREST SELF-INTERSECTION
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Tessendorf Safe Steepness Q=0.80 (Crest J = +0.2000) vs Over-Steep Q=1.60 (J = −0.6000, 557.98× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Bounding trochoidal steepness Q = k·A &lt; 1 keeps horizontal Jacobian J(φ) = 1 − Q·cos φ &gt; 0 and prevents crest loops
  </text>

  <!-- Left Panel: Tessendorf Jacobian-Limited Gerstner Wave -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Tessendorf Jacobian-Limited Gerstner (Q_safe = 0.80)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    J(φ) = 1 − 0.80·cos φ ∈ [+0.2000, +1.8000] &gt; 0 · Sharp Crest Without Loops
  </text>

  <!-- Positive Jacobian curve above J=0 line left -->
  <line x1="95" y1="388" x2="545" y2="388" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="102" y="380" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">J = 0.0000 Wave Breaking Threshold</text>
  <path d="M 100 265 Q 320 460 540 265" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="320" cy="362" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (φ=0° Crest): J_Tess = +0.2000 &gt; 0 (5× Pinch, 0 Loops!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Self-Intersecting Crest Stations: 0 / 17 (Strictly Positive J &gt; 0)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.34 ms (Analytic) vs 188.43 ms (64-Step FD, 557.98×)
  </text>

  <!-- Right Panel: Naive Over-Steepened Gerstner Loop -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Over-Steepened Gerstner (Q_raw = 1.60 &gt; 1.0)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Plunges Negative to J(0°) = −0.6000 &lt; 0 → Crest Folds Inside-Out Into Loop!
  </text>

  <!-- Negative plunging Jacobian curve below J=0 line right -->
  <line x1="655" y1="388" x2="1105" y2="388" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 660 225 Q 880 620 1100 225" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="880" cy="422" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (φ=0° Crest): J_naive = −0.6000 &lt; 0 (Retrograde Loop!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Inverted Loop Stations: 5 / 17 (φ ∈ [−45°, +45°] Folded Inside-Out)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Flips Ocean Crest Normals Upside-Down &amp; Causes Black Sky Reflection Artifacts
  </text>
</svg>
