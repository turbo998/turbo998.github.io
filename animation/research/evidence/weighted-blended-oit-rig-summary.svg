<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 56 · MCGUIRE-BAVOIL WEIGHTED BLENDED OIT (WBOIT) VS UNSORTED ALPHA OVER INVERSION
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Commutative WBOIT (Order Flip ΔC = 0.0000, C = 0.8375) vs Unsorted OVER (C = 0.2813, −60.00% Pop, 17.64× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Decomposing transparency into additive depth-weighted color Σ(αCw(z)) and multiplicative revealage Π(1−α) makes blending 100% commutative
  </text>

  <!-- Left Panel: Commutative WBOIT -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ McGuire-Bavoil Weighted Blended OIT (WBOIT)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    (1 − Π(1−α_k)) · (Σ α_k C_k w(z_k)) / (Σ α_k w(z_k)) · Bit-Exact Commutative
  </text>

  <!-- Smooth high curve left -->
  <line x1="100" y1="305" x2="540" y2="305" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="370" y="295" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">True Sorted OVER = 0.7031</text>
  <path d="M 105 335 Q 200 285 520 278" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="315" cy="282" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (z_far=3.25m): Forward ≡ Reversed = 0.8375 (0.0000 Flip)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Submission-Order Discrepancy: 0.0000 Across All 17 Stations
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 1.26 ms (Single Pass) vs 22.25 ms (Sorted A-Buffer, 17.64×)
  </text>

  <!-- Right Panel: Naive Unsorted Alpha OVER -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Unsorted Porter-Duff OVER (Near Drawn First)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Far Dark Layer (0.15) Overwrites Near Bright Layer (0.90) by −60.00%!
  </text>

  <!-- Inverted low line right -->
  <line x1="660" y1="305" x2="1100" y2="305" stroke="#475569" stroke-width="2.5" stroke-dasharray="5,4"/>
  <line x1="660" y1="412" x2="1100" y2="412" stroke="#fb7185" stroke-width="5"/>
  <line x1="875" y1="305" x2="875" y2="412" stroke="#fda4af" stroke-width="3" stroke-dasharray="4,3"/>
  <circle cx="875" cy="412" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (z_far=3.25m): Inverted to C = 0.2813 (−0.4219 Pop!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Order-Inversion Pop Error: −0.4219 (−60.00% Brightness Collapse!)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Pops Violently Whenever Camera Orbit Flips Draw Order
  </text>
</svg>
