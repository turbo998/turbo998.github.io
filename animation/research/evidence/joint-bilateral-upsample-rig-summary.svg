<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 74 · KOPF JOINT BILATERAL DEPTH UPSAMPLING VS HARDWARE BILINEAR SILHOUETTE HALO BLEED
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Kopf Joint Bilateral (Station-8 L = 0.0500, 0 Bleed) vs Bilinear Upsample (L = 0.5000, +0.4500 Halo, 9.50× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Gating half-res volumetric taps by full-res depth exp(−Δz²/2σ_z²) preserves razor-sharp 2.0m → 25.0m silhouettes
  </text>

  <!-- Left Panel: Kopf Joint Bilateral Upsampling -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Kopf Joint Bilateral Depth-Guided Upsample
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Full-Res Depth Gate σ_z = 0.50 m · Razor-Sharp Step Across 2.0m → 25.0m
  </text>

  <!-- Crisp step function left -->
  <line x1="320" y1="245" x2="320" y2="435" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="328" y="262" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Depth Cliff (2m → 25m)</text>
  <polyline points="105,425 320,425 320,275 535,275" fill="none" stroke="#34d399" stroke-width="5" stroke-linejoin="miter"/>
  <circle cx="320" cy="425" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (z=2.0m Foreground Edge): L_vol = 0.0500 (0.0000 Halo Bleed!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Silhouette Halo Bleed Stations: 0 / 17 (Exact Edge Fidelity)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 1.13 ms (Half-Res JBU) vs 10.71 ms (Full-Res March, 9.50×)
  </text>

  <!-- Right Panel: Naive Hardware Bilinear Upsampling -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Hardware Bilinear Upsample (Ignores z_hi)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Blends 50% of 25m Background Fog onto 2m Foreground Pillar → 10× Halo!
  </text>

  <!-- Blurry diagonal ramp right -->
  <line x1="880" y1="245" x2="880" y2="435" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <polyline points="665,425 765,425 995,275 1095,275" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="880" cy="350" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-8 (u=0.50, z=2.0m): Leaks L_vol = 0.5000 (+0.4500 / 10× Glowing Halo!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Halo-Corrupted Transition Stations: 7 / 17 (Stations 5..11)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Wraps Dark Foreground Characters in Glowing White Fog Fringes
  </text>
</svg>
