<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 24 · ARTICULATED INVERSE KINEMATICS &amp; SPHERE PROJECTION (FABRIK)
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800">
    Target-Clamped FABRIK (0.0000 u Bone Stretch) vs Unprojected Linearized Step (0.4328 u Distortion)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Forward-and-backward point projections onto radius-L_i spheres preserve all 5 bone lengths to 4.4e-16 u without matrix inversions.
  </text>

  <!-- Left Panel: Target-Clamped FABRIK -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Target-Clamped FABRIK (Forward &amp; Backward Sphere Pass)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    p_i' = p_{i+1}' + L_i · (p_i − p_{i+1}') / ||p_i − p_{i+1}'|| · Exact R_max = 5.50 u
  </text>

  <!-- Reachability arc and 5-link chain diagram -->
  <path d="M 130 450 A 320 220 0 0 1 510 265" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,5"/>
  <polyline points="130,450 185,375 255,325 335,295 412,285 478,282" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="130" cy="450" r="9" fill="#f8fafc" stroke="#10b981" stroke-width="3"/>
  <circle cx="185" cy="375" r="6" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
  <circle cx="255" cy="325" r="6" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
  <circle cx="335" cy="295" r="6" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
  <circle cx="412" cy="285" r="6" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/>
  <circle cx="478" cy="282" r="10" fill="#38bdf8" stroke="#f8fafc" stroke-width="2.5"/>
  <text x="478" y="258" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Target (28°, 4.80 u)
  </text>
  <text x="150" y="472" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">
    Root p_0 (0.000 u slip)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Total Chain Length: 5.50 / 5.50 u · Max Stretch: 4.4409e-16 u
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 5-Bone Solves: 59.63 ms (Vector Projection) vs 126.13 ms (Trig)
  </text>

  <!-- Right Panel: Unprojected Linearized Step -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Unprojected Linearized Step (Bone Stretch &amp; Collapse)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    First-Order Cartesian Step Without Sphere Re-Projection Distorts Bone Lengths
  </text>

  <!-- Reference ghost chain vs distorted linear chain -->
  <polyline points="690,450 745,375 815,325 895,295 972,285 1038,282" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="5,4"/>
  <polyline points="690,450 762,402 838,358 912,320 980,296 1038,282" fill="none" stroke="#fb7185" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="690" cy="450" r="9" fill="#f8fafc" stroke="#fb7185" stroke-width="3"/>
  <circle cx="762" cy="402" r="6" fill="#3b0a1e" stroke="#fb7185" stroke-width="2.5"/>
  <circle cx="838" cy="358" r="6" fill="#3b0a1e" stroke="#fb7185" stroke-width="2.5"/>
  <circle cx="912" cy="320" r="6" fill="#3b0a1e" stroke="#fb7185" stroke-width="2.5"/>
  <circle cx="980" cy="296" r="6" fill="#3b0a1e" stroke="#fb7185" stroke-width="2.5"/>
  <circle cx="1038" cy="282" r="10" fill="#fb7185" stroke="#f8fafc" stroke-width="2.5"/>
  <text x="880" y="425" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Total Length Collapses to 8.06 u (Max Bone Error 0.5275 u!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Distorted Chain Length: 8.06 u (vs Rest 5.50 u)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Max Single-Bone Stretch Error: 0.5275 u · Unacceptable Rig Deformation
  </text>
</svg>
