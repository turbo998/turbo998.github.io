<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 103 · ESTEVEZ-KULLA CHARLIE VELVET SHEEN NDF VS NAIVE SURFACE COSINE LOBE INVERSION
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Estevez-Kulla Charlie Sheen (I(60°)=0.7500, I(80°)=0.9698) vs Cosine Lobe (0.2500, 266.69× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Upright velvet pile fibers reflect along sin^(1/α) θ_h = (1 − (N·H)²)^(1/(2α)), locking dark face-on centers and glowing silhouettes
  </text>

  <!-- Left Panel: Estevez-Kulla Charlie Sheen -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Estevez-Kulla Charlie Sheen (I = sin^(1/α) θ_h = 1 − (N·H)²)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Dark Velvet Center (I(0°)=0.0000) + Luminous Grazing Rim (I(80°)=0.9698)
  </text>

  <!-- Rising Sin^2 curve from 0.0000 at 0 deg to 0.9698 at 80 deg -->
  <path d="M 95 435 Q 320 355 545 262" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="95" cy="435" r="7" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="432" cy="300" r="8" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    0°: I=0.0000 · Station-12 (60°): I=0.7500 · Station-16 (80°): I=0.9698
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Corrupted Cloth Stations: 0 / 17 (Authentic Velvet &amp; Suede Rim Halo)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.48 ms (Algebraic Charlie) vs 127.45 ms (64-Azimuth, 266.69×)
  </text>

  <!-- Right Panel: Naive Surface Cosine Lobe -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Surface Cosine Lobe (I = cos^(1/α) θ_h = (N·H)²)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Inverts Upright Fiber Physics → Plastic Center Hotspot + Dead Dark Rim!
  </text>

  <!-- Dashed Charlie reference + inverted falling cosine curve -->
  <path d="M 655 435 Q 880 355 1105 262" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 655 258 Q 880 355 1105 430" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="992" cy="390" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-12 (60°): I_naive = 0.2500 vs 0.7500 (−0.5000 / −66.67% Rim Starved!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Corrupted Stations: 16 / 17 (+1.0000 Center Blob at 0° &amp; −0.9396 Rim Loss at 80°)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Makes Velvet &amp; Suede Look Like Greasy Plastic With Dead Silhouettes
  </text>
</svg>
