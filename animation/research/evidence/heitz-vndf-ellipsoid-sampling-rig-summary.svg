<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 110 · 120TH DEMO MILESTONE · HEITZ GGX VNDF ELLIPSOID SAMPLING VS FULL-NDF FIREFLY SPIKE
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Heitz VNDF Sampling (Weight ≤ 1.0000×) vs Full-NDF (3.3794× at 80°, 9.51× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Sampling camera-visible normals D_V(H) = G1(V)·max(0,V·H)·D(H)/(N·V) eliminates grazing reflection fireflies
  </text>

  <!-- Left Panel: Heitz 2018 VNDF Ellipsoid Sampling -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Heitz 2018 VNDF Ellipsoid Sampling (W = G2/G1 ≤ 1.0000×)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    100% Visible Normals (V·H &gt; 0) · Zero Grazing Weight Explosion
  </text>

  <!-- Flat unit-bounded weight line at W = 1.0000 -->
  <line x1="95" y1="385" x2="545" y2="385" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="432" cy="385" r="8" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-12 (60°, G1=⅔): W_VNDF = 1.0000× · Station-16 (80°): W_VNDF = 1.0000×
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Firefly-Prone Grazing Stations: 0 / 17 (Firefly-Free Ray-Traced Gloss)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 2.24 ms (VNDF Cap) vs 21.34 ms (64-Trial Loop, 9.51×)
  </text>

  <!-- Right Panel: Naive Full-NDF Cosine Sampling -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Full-NDF Sampling (p(H) = D(H) · (N·H))
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Samples Backfacing Slopes &amp; Divides by G1(V) → 3.38× Grazing Fireflies!
  </text>

  <!-- Dashed 1.0000 ceiling + exploding 1/G1 weight curve -->
  <line x1="655" y1="385" x2="1105" y2="385" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 655 385 Q 950 375 992 340 L 1105 235" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="992" cy="340" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-12 (60°): W_NDF = 1.5000× (+50%) · Station-16 (80°): 3.3794× (+238%!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Firefly Stations: 16 / 17 (33.3% Wasted Samples at 60° &amp; 70.4% Wasted at 80°)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Explodes Specular Denoiser Variance at Grazing Floor &amp; Wall Angles
  </text>
</svg>
