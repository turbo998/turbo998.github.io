<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="warmcool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">ROUND 127 · 137TH DEMO · GOOCH (SIGGRAPH 1998) &amp; VALVE HALF-LAMBERT SIGNED-HEMISPHERE SHADING</text>
  <text x="56" y="102" fill="#f8fafc" font-size="25" font-weight="800">Gooch Warm-Cool Remap u = (N·L + 1)/2 vs Naive Clamped Lambert max(0, N·L)</text>
  <text x="56" y="130" fill="#94a3b8" font-size="14">Gooch locks 90° terminator at L = 0.6000 and 120° back flank at L = 0.4000 (0/17 clipped) vs 9/17 dead-black 0.0000 stations under max(0, N·L)</text>

  <!-- Left panel: 17-station signed cosine tone curve -->
  <rect x="56" y="152" width="660" height="336" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="80" y="182" fill="#e2e8f0" font-size="15" font-weight="700">17-Station Signed Cosine Curve (μ = N·L ∈ [+1.00, -1.00], L_cool = 0.20, L_warm = 1.00)</text>

  <!-- Grid lines -->
  <line x1="115" y1="215" x2="685" y2="215" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="295" x2="685" y2="295" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="375" x2="685" y2="375" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="435" x2="685" y2="435" stroke="#334155"/>
  <!-- Terminator vertical line at x=400 -->
  <line x1="400" y1="205" x2="400" y2="435" stroke="#475569" stroke-dasharray="3 3"/>
  <text x="400" y="200" fill="#94a3b8" font-size="10" text-anchor="middle">90° Terminator (μ=0)</text>

  <text x="105" y="219" fill="#94a3b8" font-size="11" text-anchor="end">1.00</text>
  <text x="105" y="299" fill="#94a3b8" font-size="11" text-anchor="end">0.60</text>
  <text x="105" y="379" fill="#94a3b8" font-size="11" text-anchor="end">0.20</text>
  <text x="105" y="439" fill="#94a3b8" font-size="11" text-anchor="end">0.00</text>

  <!-- Gooch Warm-to-Cool Linear Ramp: (115,215) -> (400,303) -> (542,347) -> (685,391) -->
  <polyline fill="none" stroke="url(#warmcool)" stroke-width="4" points="115,215 257,259 400,303 542,347 685,391"/>
  <circle cx="115" cy="215" r="5" fill="#f59e0b"/>
  <circle cx="257" cy="259" r="5" fill="#fbbf24"/>
  <circle cx="400" cy="303" r="6" fill="#38bdf8"/>
  <circle cx="542" cy="347" r="6" fill="#60a5fa"/>
  <circle cx="685" cy="391" r="5" fill="#2563eb"/>
  <text x="412" y="292" fill="#38bdf8" font-size="12" font-weight="700">Gooch L = 0.60 + 0.40·μ (90°=0.6000, 120°=0.4000 · 0/17 Clipped)</text>

  <!-- Naive Clamped Lambert: (115,215) -> (257,325) -> (400,435) -> (685,435) -->
  <polyline fill="none" stroke="url(#danger)" stroke-width="3.5" stroke-dasharray="7 4" points="115,215 257,325 400,435 542,435 685,435"/>
  <circle cx="257" cy="325" r="5" fill="#f97316"/>
  <circle cx="400" cy="435" r="6" fill="#ef4444"/>
  <circle cx="542" cy="435" r="6" fill="#ef4444"/>
  <circle cx="685" cy="435" r="5" fill="#ef4444"/>
  <text x="415" y="423" fill="#f87171" font-size="12" font-weight="700">Naive max(0, N·L) Clips 9/17 Stations (μ ≤ 0) to Dead 0.0000!</text>

  <!-- X-axis labels -->
  <text x="115" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 0 (0°, μ=+1.0)</text>
  <text x="257" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 4 (60°, μ=+0.5)</text>
  <text x="400" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 8 (90°, μ=0.0)</text>
  <text x="542" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 12 (120°, μ=-0.5)</text>
  <text x="685" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 16 (180°, μ=-1.0)</text>

  <!-- Right panel: KPI cards -->
  <rect x="740" y="152" width="404" height="104" rx="12" fill="#111827" stroke="#0284c7"/>
  <text x="764" y="180" fill="#38bdf8" font-size="12" font-weight="700">STATION 8 (90° TERMINATOR) &amp; STATION 12 (120° BACK)</text>
  <text x="764" y="212" fill="#f8fafc" font-size="21" font-weight="800">0.6000 &amp; 0.4000 vs 0.0000</text>
  <text x="764" y="238" fill="#94a3b8" font-size="12">Preserves dL/dμ = 0.4000 across the entire dark hemisphere</text>

  <rect x="740" y="268" width="404" height="104" rx="12" fill="#111827" stroke="#ef4444"/>
  <text x="764" y="296" fill="#f87171" font-size="12" font-weight="700">BACK-HEMISPHERE CLIPPING &amp; INK LINE LEGIBILITY</text>
  <text x="764" y="328" fill="#f8fafc" font-size="21" font-weight="800">0/17 Clipped · L(180°) = 0.2000</text>
  <text x="764" y="354" fill="#94a3b8" fill-opacity="0.95" font-size="12">Reserves cool floor 0.2000 so black ink outlines stay crisp</text>

  <rect x="740" y="384" width="404" height="104" rx="12" fill="#111827" stroke="#10b981"/>
  <text x="764" y="412" fill="#34d399" font-size="12" font-weight="700">8,192-PASS THROUGHPUT VS 64-RING SH QUADRATURE</text>
  <text x="764" y="444" fill="#f8fafc" font-size="21" font-weight="800">0.42 ms vs 13.46 ms (31.98×)</text>
  <text x="764" y="470" fill="#94a3b8" font-size="12">1-FMA signed remap matches 64-ring SH integral (&lt;1e-13 err)</text>

  <!-- Footer provenance bar -->
  <rect x="56" y="508" width="1088" height="72" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="80" y="538" fill="#e2e8f0" font-size="13" font-weight="700">58-Solid 17-Station Gooch Technical Illustration Bench · Sealed Evidence: demos/gooch-warm-cool-signed-hemisphere-rig/report.json</text>
  <text x="80" y="562" fill="#94a3b8" font-size="12">Provenance: Measured on Windows 11 Chromium Headless WebGL · 12/12 checks passed · Zero runtime model APIs</text>
</svg>
