<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 66 · PENNER PRE-INTEGRATED CURVATURE SKIN SSS VS HARD LAMBERT TERMINATOR
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Penner Pre-Integrated SSS (θ=90° I_R = 0.1724, 5.75× R/B Warmth) vs Hard Lambert (0.0000 Dead Plaster, 106.84× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Convolving clamped cosine over curvature arc α_c = κ·ℓ_c bleeds long-wave red light past the N·L=0 shadow terminator
  </text>

  <!-- Left Panel: Penner Pre-Integrated Curvature Skin SSS -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Penner Pre-Integrated Curvature SSS (I_c(θ, κ·ℓ_c))
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    κ = 0.60 mm⁻¹, ℓ_R = 1.20 mm, ℓ_B = 0.20 mm · Smooth Warm Crimson Bleed Past 90°
  </text>

  <!-- Smooth red & blue curves left -->
  <path d="M 105 255 Q 250 325 315 378 Q 380 418 525 432" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <path d="M 105 250 Q 245 315 315 424 L 525 432" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5,4"/>
  <circle cx="315" cy="378" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Terminator θ=90° (N·L=0): I_R = 0.1724 vs I_B = 0.0300 (+0.1424 Warmth)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Terminator Crimson Bleed Retained Across All 17 Stations
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 2.05 ms (Closed-Form) vs 219.42 ms (256-Tap Quad, 106.84×)
  </text>

  <!-- Right Panel: Naive Hard Lambertian -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Hard Lambertian Clamping (max(0, N·L))
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Clamps R=G=B to Dead Black 0.0000 at θ=90° (Cold Gray Plaster Look!)
  </text>

  <!-- Hard kinked cosine right -->
  <polyline points="665,250 765,295 875,432 1085,432" fill="none" stroke="#fb7185" stroke-width="5" stroke-linejoin="miter"/>
  <circle cx="875" cy="432" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Terminator θ=90° (N·L=0): Drops to 0.0000 (−0.1724 Dermal Bleed Lost!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Dead-Terminator Stations: 6 / 17 (Zero Subsurface Translucency)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Makes Human Faces, Ears &amp; Fingers Look Like Lifeless Gray Mannequins
  </text>
</svg>
