<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">ROUND 129 · 139TH DEMO · GREEN (GPU GEMS 2004) ENERGY-CONSERVING SUBSURFACE WRAP DIFFUSE</text>
  <text x="56" y="102" fill="#f8fafc" font-size="25" font-weight="800">Quadratic Wrap max(0, μ+w)/(1+w)² vs Naive Unnormalized max(0, μ+w)/(1+w)</text>
  <text x="56" y="130" fill="#94a3b8" font-size="14">Locks spherical integral at exact E = 1.0000× across all 17 wrap widths (0/17 blown out) vs naive E = 1 + w reaching 2.0000× (16/17 blown out)</text>

  <!-- Left panel: 17-station total spherical energy & apex curve -->
  <rect x="56" y="152" width="660" height="336" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="80" y="182" fill="#e2e8f0" font-size="15" font-weight="700">Integrated Spherical Diffuse Energy E(w) Across Wrap Width w ∈ [0.00, 1.00]</text>

  <!-- Grid lines -->
  <line x1="115" y1="215" x2="685" y2="215" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="270" x2="685" y2="270" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="325" x2="685" y2="325" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="380" x2="685" y2="380" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="435" x2="685" y2="435" stroke="#334155"/>

  <text x="105" y="219" fill="#94a3b8" font-size="11" text-anchor="end">2.00×</text>
  <text x="105" y="274" fill="#94a3b8" font-size="11" text-anchor="end">1.50×</text>
  <text x="105" y="329" fill="#94a3b8" font-size="11" text-anchor="end">1.00×</text>
  <text x="105" y="384" fill="#94a3b8" font-size="11" text-anchor="end">0.50×</text>
  <text x="105" y="439" fill="#94a3b8" font-size="11" text-anchor="end">0.00×</text>

  <!-- Energy-Conserving Total Energy E_norm(w) = 1.0000x flat line at y=325 -->
  <polyline fill="none" stroke="url(#ok)" stroke-width="4" points="115,325 257,325 400,325 542,325 685,325"/>
  <circle cx="115" cy="325" r="5" fill="#38bdf8"/>
  <circle cx="257" cy="325" r="5" fill="#10b981"/>
  <circle cx="400" cy="325" r="6" fill="#10b981"/>
  <circle cx="542" cy="325" r="5" fill="#10b981"/>
  <circle cx="685" cy="325" r="5" fill="#10b981"/>
  <text x="395" y="313" fill="#34d399" font-size="12" font-weight="700">Quadratic 1/(1+w)² Total Energy E = 1.0000× (0/17 Overbright)</text>

  <!-- Energy-Conserving Apex Radiance 1/(1+w): w=0(1.0)->325, w=0.25(0.8)->347, w=0.50(0.667)->362, w=0.75(0.571)->372, w=1.0(0.50)->380 -->
  <polyline fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 3" points="115,325 257,347 400,362 542,372 685,380"/>
  <text x="410" y="396" fill="#38bdf8" font-size="11" font-weight="600">Apex Radiance 1/(1+w): 0.8000 at w=0.25 → 0.6667 at w=0.50 → 0.5000 at w=1.00</text>

  <!-- Naive Unnormalized Total Energy E_unnorm(w) = 1 + w: (115,325) -> (257,298) -> (400,270) -> (542,243) -> (685,215) -->
  <polyline fill="none" stroke="url(#danger)" stroke-width="3.5" stroke-dasharray="7 4" points="115,325 257,298 400,270 542,243 685,215"/>
  <circle cx="257" cy="298" r="5" fill="#ef4444"/>
  <circle cx="400" cy="270" r="6" fill="#ef4444"/>
  <circle cx="542" cy="243" r="5" fill="#ef4444"/>
  <circle cx="685" cy="215" r="6" fill="#f97316"/>
  <text x="275" y="232" fill="#f87171" font-size="12" font-weight="700">Naive 1/(1+w) Inflates Energy E = 1 + w up to 2.0000× (+100% Blowout!)</text>

  <!-- X-axis labels -->
  <text x="115" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 0 (w=0.00)</text>
  <text x="257" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 4 (w=0.25)</text>
  <text x="400" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 8 (w=0.50)</text>
  <text x="542" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 12 (w=0.75)</text>
  <text x="685" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 16 (w=1.00)</text>

  <!-- Right panel: KPI cards -->
  <rect x="740" y="152" width="404" height="104" rx="12" fill="#111827" stroke="#0284c7"/>
  <text x="764" y="180" fill="#38bdf8" font-size="12" font-weight="700">STATION 8 (HALF WRAP w = 0.5000) &amp; STATION 16 (w = 1.00)</text>
  <text x="764" y="212" fill="#f8fafc" font-size="21" font-weight="800">E = 1.0000× vs 1.5000× &amp; 2.0000×</text>
  <text x="764" y="238" fill="#94a3b8" font-size="12">Quadratic 1/(1+w)² cancels cap width (1+w) × height (1+w)</text>

  <rect x="740" y="268" width="404" height="104" rx="12" fill="#111827" stroke="#ef4444"/>
  <text x="764" y="296" fill="#f87171" font-size="12" font-weight="700">APEX RADIANCE ATTENUATION &amp; TERMINATOR LIFT</text>
  <text x="764" y="328" fill="#f8fafc" font-size="21" font-weight="800">0/17 Blown Out · Apex(0.5) = 0.6667</text>
  <text x="764" y="354" fill="#94a3b8" font-size="12">Trades apex peak for terminator wrap (0.2222) at constant energy</text>

  <rect x="740" y="384" width="404" height="104" rx="12" fill="#111827" stroke="#10b981"/>
  <text x="764" y="412" fill="#34d399" font-size="12" font-weight="700">8,192-PASS THROUGHPUT VS 64-RING ZONAL QUADRATURE</text>
  <text x="764" y="444" fill="#f8fafc" font-size="21" font-weight="800">0.73 ms vs 11.60 ms (15.90×)</text>
  <text x="764" y="470" fill="#94a3b8" font-size="12">Exact closed-form normalization (&lt;1e-13 error vs 64-ring integral)</text>

  <!-- Footer provenance bar -->
  <rect x="56" y="508" width="1088" height="72" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="80" y="538" fill="#e2e8f0" font-size="13" font-weight="700">58-Solid 17-Station Subsurface Wrap Calorimeter Bench · Sealed Evidence: demos/green-energy-conserving-wrap-diffuse-rig/report.json</text>
  <text x="80" y="562" fill="#94a3b8" font-size="12">Provenance: Measured on Windows 11 Chromium Headless WebGL · 12/12 checks passed · Zero runtime model APIs</text>
</svg>
