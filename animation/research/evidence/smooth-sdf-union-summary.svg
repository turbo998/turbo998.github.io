      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 27 · IMPLICIT SURFACE CSG &amp; C¹ BOUNDED-SUPPORT POLYNOMIAL SMOOTH-MIN
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800">
    C¹ Quadratic Polynomial smin (0.09° Smooth Seam) vs Hard min (90.13° Crease)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Bounded-support quadratic smin eliminates the 89.26° medial normal discontinuity while keeping far-field bloat at 0.000000 u.
  </text>

  <!-- Left Panel: C1 Quadratic Polynomial smin -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ C¹ Quadratic Polynomial smin: min(a,b) − k·h²/4
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    ∇smin = (1 − w)∇d_A + w∇d_B · Vertical Normal at x = 0 &amp; 0 Far-Field Bloat
  </text>

  <!-- Smooth twin-lobe profile & continuous normal needles -->
  <path d="M 110 440 C 110 275, 235 265, 320 318 C 405 265, 530 275, 530 440" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <!-- Continuous normal needles around seam -->
  <line x1="280" y1="304" x2="294" y2="256" stroke="#38bdf8" stroke-width="3"/>
  <line x1="300" y1="313" x2="306" y2="263" stroke="#38bdf8" stroke-width="3"/>
  <line x1="320" y1="318" x2="320" y2="266" stroke="#f8fafc" stroke-width="4"/>
  <line x1="340" y1="313" x2="334" y2="263" stroke="#38bdf8" stroke-width="3"/>
  <line x1="360" y1="304" x2="346" y2="256" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="320" cy="318" r="7" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="362" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Seam Normal Jump = 0.09° (C¹ Fillet +0.1694 u)
  </text>
  <text x="320" y="384" fill="#94a3b8" font-family="Consolas, monospace" font-size="12" text-anchor="middle">
    Far-Field Boundary Bloat (|a − b| ≥ k): 0.000000 u
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Seam Angle Change: 0.09° · Fillet Lift: +0.1694 u
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 25-Rib Normal Passes: 35.49 ms (Analytical) vs 132.64 ms (4-Tap FD)
  </text>

  <!-- Right Panel: Hard Boolean Union min(dA, dB) -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
