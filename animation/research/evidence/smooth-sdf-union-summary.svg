  </text>

  <!-- Hard crease profile & crossed normal needles -->
  <path d="M 670 440 A 145 145 0 0 1 880 356 A 145 145 0 0 1 1090 440" fill="none" stroke="#fb7185" stroke-width="6" stroke-linejoin="miter"/>
  <!-- Diverging normal needles at the crease -->
  <line x1="876" y1="354" x2="914" y2="312" stroke="#fb7185" stroke-width="4"/>
  <line x1="884" y1="354" x2="846" y2="312" stroke="#fb7185" stroke-width="4"/>
  <circle cx="880" cy="356" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="394" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Seam Normal Jump = 90.13° (Sharp Specular Crease!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Seam Normal Discontinuity: 90.13° · Fillet Lift: 0.0000 u
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Broken Lighting &amp; Specular Tearing Along Every Boolean Joint
  </text>
</svg>
