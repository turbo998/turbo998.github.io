<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 31 · BISHOP PARALLEL TRANSPORT FRAME (PTF) VS FRENET-SERRET INFLECTION FLIP
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    Bishop Parallel Transport (0.00° Inflection Jump) vs Frenet-Serret Frame (180.00° Snap Flip)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Across an S-curve inflection point (u=0, r''=0), Frenet normal N = r''/||r''|| reverses sign instantaneously, twisting ribbons into a bowtie.
  </text>

  <!-- Left Panel: Bishop Parallel Transport Frame -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Bishop Parallel Transport (Rotation Minimizing Frame)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Minimal Dihedral Reflection · 0.00° Twist Across u=0 Inflection Point
  </text>

  <!-- S-curve with consistent upward-left normals on both sides of inflection -->
  <path d="M 110 410 C 210 410, 260 280, 320 345 C 380 410, 430 280, 530 280" fill="none" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="320" cy="345" r="7" fill="#fbbf24" stroke="#fef08a" stroke-width="2"/>
  <line x1="275" y1="322" x2="252" y2="262" stroke="#34d399" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="365" y1="368" x2="342" y2="308" stroke="#34d399" stroke-width="4.5" stroke-linecap="round"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station 9 (u=-0.2) → Station 10 (u=+0.2): Δθ = 0.00° · Max Step = 17.51°
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Inflection Flip: 0.00° · Zero Bowtie Self-Intersection
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 20-Station Passes: 70.93 ms (Algebraic) vs 83.74 ms (Trig Rodrigues)
  </text>

  <!-- Right Panel: Frenet-Serret Curvature Frame -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Frenet-Serret Frame: N(u) = normalize(r'' − (r''·T)T)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Second-Derivative Sign Reversal · 180.00° Instantaneous Bowtie Flip!
  </text>

  <!-- S-curve with opposite normals across u=0 inflection -->
  <path d="M 670 410 C 770 410, 820 280, 880 345 C 940 410, 990 280, 1090 280" fill="none" stroke="#fb7185" stroke-width="5"/>
  <circle cx="880" cy="345" r="7" fill="#fbbf24" stroke="#fef08a" stroke-width="2"/>
  <line x1="835" y1="322" x2="812" y2="262" stroke="#34d399" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="925" y1="368" x2="948" y2="428" stroke="#fb7185" stroke-width="4.5" stroke-linecap="round"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station 9 (u=-0.2) → Station 10 (u=+0.2): Δθ = 180.00° Flip!
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Inflection Snap: 180.00° · Normal Deviation: 180.00°
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Left &amp; Right Ribbon Rails Cross Over at u=0 → Severe Mesh Pinch
  </text>
</svg>
