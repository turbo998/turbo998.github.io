<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">ROUND 138 · 148TH DEMO · RODRIGUES (1840) SO(3) LIE-GROUP EXPONENTIAL MAP ROTATION</text>
  <text x="56" y="102" fill="#f8fafc" font-size="25" font-weight="800">Rodrigues SO(3) Rotation v cos θ + (k×v) sin θ vs Linear Tangent Step v + θ(k×v)</text>
  <text x="56" y="130" fill="#94a3b8" font-size="14">Locks Euclidean norm ‖v‖ = 1.0000× across all 17 angles (0/17 stretched) vs Pythagorean hypotenuse √(1+θ²) = 1.2500× at 0.75 rad &amp; 1.8028× at 1.50 rad</text>

  <!-- Left panel: 17-station norm comparison -->
  <rect x="56" y="152" width="660" height="336" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="80" y="182" fill="#e2e8f0" font-size="15" font-weight="700">Rotated Vector Magnitude ‖v(θ)‖ Across Rotation Angle θ ∈ [0.0000, 1.5000] rad</text>

  <!-- Grid lines: y=215(1.80x), y=270(1.50x), y=316(1.25x), y=362(1.00x), y=435(0.60x) -->
  <line x1="115" y1="215" x2="685" y2="215" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="270" x2="685" y2="270" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="316" x2="685" y2="316" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="362" x2="685" y2="362" stroke="#334155"/>
  <line x1="115" y1="435" x2="685" y2="435" stroke="#334155"/>

  <text x="105" y="219" fill="#94a3b8" font-size="11" text-anchor="end">1.80×</text>
  <text x="105" y="274" fill="#94a3b8" font-size="11" text-anchor="end">1.50×</text>
  <text x="105" y="320" fill="#94a3b8" font-size="11" text-anchor="end">1.25×</text>
  <text x="105" y="366" fill="#94a3b8" font-size="11" text-anchor="end">1.00×</text>
  <text x="105" y="439" fill="#94a3b8" font-size="11" text-anchor="end">0.60×</text>

  <!-- Rodrigues SO(3) ‖v‖ = 1.0000x flat line at y=362 -->
  <polyline fill="none" stroke="url(#ok)" stroke-width="4" points="115,362 257,362 400,362 542,362 685,362"/>
  <circle cx="115" cy="362" r="5" fill="#38bdf8"/>
  <circle cx="257" cy="362" r="5" fill="#10b981"/>
  <circle cx="400" cy="362" r="6" fill="#10b981"/>
  <circle cx="542" cy="362" r="5" fill="#10b981"/>
  <circle cx="685" cy="362" r="6" fill="#10b981"/>
  <text x="280" y="388" fill="#34d399" font-size="12" font-weight="700">Rodrigues SO(3) Isometric Rotation: ‖v(θ)‖ = 1.0000× (0/17 Stretched)</text>

  <!-- Naive Linear Tangent √(1+θ²): θ=0(1.0)->362, θ=0.375(1.068)->349, θ=0.75(1.2500)->316, θ=1.125(1.5052)->269, θ=1.50(1.8028)->215 -->
  <polyline fill="none" stroke="url(#danger)" stroke-width="3.5" stroke-dasharray="7 4" points="115,362 257,349 400,316 542,269 685,215"/>
  <circle cx="257" cy="349" r="4.5" fill="#f97316"/>
  <circle cx="400" cy="316" r="6" fill="#ef4444"/>
  <circle cx="542" cy="269" r="5.5" fill="#ef4444"/>
  <circle cx="685" cy="215" r="6" fill="#ef4444"/>
  <text x="210" y="242" fill="#f87171" font-size="12" font-weight="700">Naive Tangent v + θ(k×v) Inflates as √(1+θ²): 1.2500× (0.75) → 1.8028× (1.50)!</text>

  <!-- X-axis labels -->
  <text x="115" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 0 (0.00 rad)</text>
  <text x="257" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 4 (0.38 rad)</text>
  <text x="400" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 8 (0.75 rad)</text>
  <text x="542" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 12 (1.13 rad)</text>
  <text x="685" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 16 (1.50 rad)</text>

  <!-- Right panel: KPI cards -->
  <rect x="740" y="152" width="404" height="104" rx="12" fill="#111827" stroke="#0284c7"/>
  <text x="764" y="180" fill="#38bdf8" font-size="12" font-weight="700">3-4-5 PYTHAGOREAN STATION 8 (θ = 0.7500 rad, 43.0°)</text>
  <text x="764" y="212" fill="#f8fafc" font-size="21" font-weight="800">‖v‖ = 1.0000× vs 1.2500× (+25%)</text>
  <text x="764" y="238" fill="#94a3b8" font-size="12">Centripetal pullback −v₀(1 − cos θ) keeps radius on the circle</text>

  <rect x="740" y="268" width="404" height="104" rx="12" fill="#111827" stroke="#ef4444"/>
  <text x="764" y="296" fill="#f87171" font-size="12" font-weight="700">WIDE SWAY STATION 16 (θ = 1.5000 rad, 85.9°)</text>
  <text x="764" y="328" fill="#f8fafc" font-size="21" font-weight="800">0/17 Stretched vs 1.8028× (+80%)</text>
  <text x="764" y="354" fill="#94a3b8" font-size="12">Eliminates rubber-band foliage ballooning across 16/17 stations</text>

  <rect x="740" y="384" width="404" height="104" rx="12" fill="#111827" stroke="#10b981"/>
  <text x="764" y="412" fill="#34d399" font-size="12" font-weight="700">8,192-PASS THROUGHPUT VS 64-STEP CAYLEY INTEGRATOR</text>
  <text x="764" y="444" fill="#f8fafc" font-size="21" font-weight="800">7.72 ms vs 22.27 ms (2.89×)</text>
  <text x="764" y="470" fill="#94a3b8" font-size="12">Closed-form exp(θ[k]_×) matches 64-step Cayley within &lt;1e-13</text>

  <!-- Footer provenance bar -->
  <rect x="56" y="508" width="1088" height="72" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="80" y="538" fill="#e2e8f0" font-size="13" font-weight="700">58-Solid 17-Station Rodrigues SO(3) Isometric Rotation Bench · Sealed Evidence: demos/rodrigues-so3-axis-angle-rotation-rig/report.json</text>
  <text x="80" y="562" fill="#94a3b8" font-size="12">Provenance: Measured on Windows 11 Chromium Headless WebGL · 12/12 checks passed · Zero runtime model APIs</text>
</svg>
