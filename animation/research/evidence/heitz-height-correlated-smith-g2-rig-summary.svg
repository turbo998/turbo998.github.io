<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.4">ROUND 137 · 147TH DEMO · HEITZ (JCGT 2014) HEIGHT-CORRELATED SMITH MASKING-SHADOWING G₂</text>
  <text x="56" y="102" fill="#f8fafc" font-size="25" font-weight="800">Height-Correlated G₂ = 1/(1+2Λ) vs Separable G₁(V)·G₁(L) = 1/(1+2Λ+Λ²)</text>
  <text x="56" y="130" fill="#94a3b8" font-size="14">Integrates masking &amp; shadowing at the same microfacet height u (G₂(1.5) = 0.2500 vs separable 0.1600, eliminating −36% spurious darkening)</text>

  <!-- Left panel: 17-station G2 visibility curve -->
  <rect x="56" y="152" width="660" height="336" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="80" y="182" fill="#e2e8f0" font-size="15" font-weight="700">Joint Masking-Shadowing Visibility G₂(Λ) Across Smith Slope Factor Λ ∈ [0.00, 2.00]</text>

  <!-- Grid lines: y=215(1.00), y=325(0.50), y=380(0.25), y=435(0.00) -->
  <line x1="115" y1="215" x2="685" y2="215" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="325" x2="685" y2="325" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="380" x2="685" y2="380" stroke="#1e293b" stroke-dasharray="4 4"/>
  <line x1="115" y1="435" x2="685" y2="435" stroke="#334155"/>

  <text x="105" y="219" fill="#94a3b8" font-size="11" text-anchor="end">1.00</text>
  <text x="105" y="329" fill="#94a3b8" font-size="11" text-anchor="end">0.50</text>
  <text x="105" y="384" fill="#94a3b8" font-size="11" text-anchor="end">0.25</text>
  <text x="105" y="439" fill="#94a3b8" font-size="11" text-anchor="end">0.00</text>

  <!-- Height-Correlated G2 = 1/(1+2Λ): Λ=0(1.0)->215, Λ=0.5(0.50)->325, Λ=1.0(0.3333)->362, Λ=1.5(0.25)->380, Λ=2.0(0.20)->391 -->
  <polyline fill="none" stroke="url(#ok)" stroke-width="4" points="115,215 257,325 400,362 542,380 685,391"/>
  <circle cx="115" cy="215" r="5" fill="#38bdf8"/>
  <circle cx="257" cy="325" r="5" fill="#38bdf8"/>
  <circle cx="400" cy="362" r="6" fill="#10b981"/>
  <circle cx="542" cy="380" r="6" fill="#10b981"/>
  <circle cx="685" cy="391" r="5" fill="#10b981"/>
  <text x="355" y="348" fill="#34d399" font-size="12" font-weight="700">Height-Correlated G₂ = 1/(1+2Λ): 0.3333 (Λ=1.0), 0.2500 (Λ=1.5), 0.2000 (Λ=2.0)</text>

  <!-- Separable G1*G1 = 1/(1+Λ)²: Λ=0(1.0)->215, Λ=0.5(0.4444)->337, Λ=1.0(0.25)->380, Λ=1.5(0.16)->400, Λ=2.0(0.1111)->411 -->
  <polyline fill="none" stroke="url(#danger)" stroke-width="3.5" stroke-dasharray="7 4" points="115,215 257,337 400,380 542,400 685,411"/>
  <circle cx="257" cy="337" r="4.5" fill="#f97316"/>
  <circle cx="400" cy="380" r="5.5" fill="#ef4444"/>
  <circle cx="542" cy="400" r="5.5" fill="#ef4444"/>
  <circle cx="685" cy="411" r="6" fill="#ef4444"/>
  <text x="355" y="427" fill="#f87171" font-size="12" font-weight="700">Separable G₁² = 1/(1+2Λ+Λ²) Drops to 0.2500 (−25%) &amp; 0.1111 (−44.4%)</text>

  <!-- X-axis labels -->
  <text x="115" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 0 (Λ=0.00)</text>
  <text x="257" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 4 (Λ=0.50)</text>
  <text x="400" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 8 (Λ=1.00)</text>
  <text x="542" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 12 (Λ=1.50)</text>
  <text x="685" y="460" fill="#cbd5e1" font-size="11" text-anchor="middle">St 16 (Λ=2.00)</text>

  <!-- Right panel: KPI cards -->
  <rect x="740" y="152" width="404" height="104" rx="12" fill="#111827" stroke="#0284c7"/>
  <text x="764" y="180" fill="#38bdf8" font-size="12" font-weight="700">STATION 8 (Λ = 1.00) &amp; STATION 12 (Λ = 1.50)</text>
  <text x="764" y="212" fill="#f8fafc" font-size="21" font-weight="800">0.3333 &amp; 0.2500 vs 0.2500 &amp; 0.1600</text>
  <text x="764" y="238" fill="#94a3b8" font-size="12">Eliminates spurious +Λ² double-occlusion cross-term</text>

  <rect x="740" y="268" width="404" height="104" rx="12" fill="#111827" stroke="#ef4444"/>
  <text x="764" y="296" fill="#f87171" font-size="12" font-weight="700">GRAZING ROUGHNESS DARKENING (STATION 16, Λ = 2.00)</text>
  <text x="764" y="328" fill="#f8fafc" font-size="21" font-weight="800">0/17 Darkened vs −44.44% Loss</text>
  <text x="764" y="354" fill="#94a3b8" font-size="12">Separable G₁·G₁ darkens 16/17 stations by ignoring peak height</text>

  <rect x="740" y="384" width="404" height="104" rx="12" fill="#111827" stroke="#10b981"/>
  <text x="764" y="412" fill="#34d399" font-size="12" font-weight="700">8,192-PASS THROUGHPUT VS 64-SLAB HEIGHT QUANTILE</text>
  <text x="764" y="444" fill="#f8fafc" font-size="21" font-weight="800">0.32 ms vs 152.99 ms (484.14×)</text>
  <text x="764" y="470" fill="#94a3b8" font-size="12">Closed-form 1/(1+2Λ) matches ∫ u^(2Λ) du within &lt;1e-13</text>

  <!-- Footer provenance bar -->
  <rect x="56" y="508" width="1088" height="72" rx="10" fill="#0b1120" stroke="#1e293b"/>
  <text x="80" y="538" fill="#e2e8f0" font-size="13" font-weight="700">58-Solid 17-Station Height-Correlated Smith G₂ Bench · Sealed Evidence: demos/heitz-height-correlated-smith-g2-rig/report.json</text>
  <text x="80" y="562" fill="#94a3b8" font-size="12">Provenance: Measured on Windows 11 Chromium Headless WebGL · 12/12 checks passed · Zero runtime model APIs</text>
</svg>
