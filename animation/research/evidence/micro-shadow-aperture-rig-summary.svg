<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 82 · CHAN AO-DERIVED DIRECT-LIGHT CONTACT MICRO-SHADOWING VS UNSHADOWED NDOTL PORE LEAK
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Chan Micro-Shadowing (N·L=0.30 Pore Umbra E = 0.0000) vs Unshadowed N·L (E = 0.3000 Leak, 10.90× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Deriving cavity aperture cutoff μ_cut = 1 − 2·AO² from material AO casts sub-millimeter direct shadows inside pores &amp; rivets
  </text>

  <!-- Left Panel: Chan Contact Micro-Shadowing -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Chan AO-Aperture Contact Micro-Shadowing
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    AO = 0.50 → μ_cutoff = 0.50 · Grazing N·L ≤ 0.30 Fully Self-Shadowed
  </text>

  <!-- Self-shadowed umbra then smooth ramp left -->
  <line x1="238" y1="245" x2="238" y2="435" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="246" y="262" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Pore Rim Umbra Limit (N·L=0.30)</text>
  <polyline points="105,432 238,432 450,315 535,255" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="238" cy="432" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-5 (N·L=0.30 Grazing Sun): E_sun = 0.0000 (100% Pore Self-Shadow!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Pore Sunlight Leak Stations: 0 / 17 (Crisp Micro-Texture Depth)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.44 ms (Closed-Form) vs 4.75 ms (64-Strip Quad, 10.90×)
  </text>

  <!-- Right Panel: Naive Unshadowed Direct N·L -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Unshadowed Direct N·L (Ignores Pore AO)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Applies AO Only to Ambient → Low Sunlight Penetrates Solid Pore Walls!
  </text>

  <!-- Unshadowed linear ramp right -->
  <line x1="798" y1="245" x2="798" y2="435" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="665" y1="422" x2="1095" y2="255" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="798" cy="370" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-5 (N·L=0.30): Leaks E_sun = 0.3000 (+0.3000 Sunlight in Umbra!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Leak-Corrupted Stations: 13 / 17 (N·L = 0.05..0.65 Penetrated)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Makes Normal-Mapped Skin, Fabric &amp; Cobblestones Look Flat Under Sun
  </text>
</svg>
