<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 49 · LAMBERT-ARVO CLOSED-FORM POLYGONAL AREA-LIGHT CONTOUR INTEGRAL VS CENTER-POINT 1/R² BLOWOUT
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Stokes 4-Edge Contour (h=0.30m E = 0.9819 ≤ 1.0) vs Center-Point 1/r² (E = 56.59, 57.63× Blowout!)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Stokes' theorem on the unit hemisphere reduces 2D polygonal area-light integration to a 4-edge contour sum bounded strictly by 1.0000
  </text>

  <!-- Left Panel: Lambert-Arvo Stokes Contour Integral -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Lambert-Arvo 4-Edge Stokes Contour Integral
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    E = (1/2π) Σ Θ_k ((u_k × u_{k+1}) / ||u_k × u_{k+1}|| · n) ≤ 1.0000
  </text>

  <!-- Smooth bounded curve approaching 1.0 asymptote left -->
  <line x1="100" y1="275" x2="540" y2="275" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="450" y="266" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Physical Limit E = 1.0000</text>
  <path d="M 110 278 Q 240 290 520 385" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="140" cy="280" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-1 (h=0.30m): Exact E = 0.9819 ≤ 1.0000 (0 Blowout)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Energy Violations (E &gt; 1.0): 0 / 17 · Exact Analytical Horizon
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 28.21 ms (Direct Cross) vs 34.52 ms (Wedge Frame, 1.22×)
  </text>

  <!-- Right Panel: Naive Center-Point 1/r^2 Singularity -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Center-Point Approximation: E = A·cos²θ / (πr²)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Collapses 16m² Panel Into a Single 1/r² Point Singularity!
  </text>

  <!-- Exploding 1/r^2 curve right -->
  <line x1="660" y1="385" x2="1100" y2="385" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="1000" y="376" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">Limit E = 1.0000</text>
  <path d="M 675 245 Q 740 355 1080 398" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="700" cy="256" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-1 (h=0.30m): Explodes to E = 56.5884 (57.63× Hotspot!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Energy-Violating Stations: 15 / 17 (Peak E = 226.35 at 0.15m!)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Creates Blinding White Burn-Out Underneath Softbox Panels
  </text>
</svg>
