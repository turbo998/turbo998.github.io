<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 67 · KARIS SPLIT-SUM IBL ENVIRONMENT BRDF (F0·scale+bias) VS NAIVE SCHLICK FRESNEL HALO
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Karis Split-Sum DFG (Grazing R_IBL = 0.0320, 0 Halo) vs Naive Fresnel (R = 0.7828, 24.48× Rim Blowout, 185.66× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Integrating microfacet Fresnel F(V·H) with Smith G₂ masking prevents rough matte dielectrics from glowing like mirrors at N·V → 0
  </text>

  <!-- Left Panel: Karis Split-Sum Environment BRDF -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Karis Split-Sum Environment BRDF (F₀·scale + bias)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Roughness r = 0.85, F₀ = 0.04 · Controlled Matte Grazing Reflectance R = 0.0320
  </text>

  <!-- Controlled flat-ish curve left -->
  <path d="M 105 415 Q 250 408 525 406" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="115" cy="415" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-0 (Grazing N·V=0.05): R_IBL = 0.04·0.1461 + 0.0261 = 0.0320
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Radioactive Grazing Rim Halos: 0 / 17 Across All View Angles
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 1.78 ms (Closed-Form) vs 330.84 ms (192-Pt GL Quad, 185.66×)
  </text>

  <!-- Right Panel: Naive Macroscopic Schlick Fresnel -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Macroscopic Schlick Fresnel (F₀ + (1−F₀)(1−N·V)⁵)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Rough Clay (r=0.85) Reflects 78.28% Mirror Light at N·V=0.05 (24.48× Halo)!
  </text>

  <!-- Steep grazing spike right -->
  <line x1="660" y1="415" x2="1100" y2="415" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 675 246 Q 760 402 1090 408" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <line x1="675" y1="246" x2="675" y2="415" stroke="#fda4af" stroke-width="3" stroke-dasharray="4,3"/>
  <circle cx="675" cy="246" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-0 (Grazing N·V=0.05): Explodes to R = 0.7828 (24.48× Blowout!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Halo-Corrupted Stations: 13 / 17 (Peak 24.48× Rim Blowout)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Surrounds Rough Rubber, Clay &amp; Concrete with a Glowing Chrome Rim
  </text>
</svg>
