<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 62 · MACKLIN XPBD TIME-SCALED COMPLIANCE (α̃ = α/Δt_s²) VS CLASSIC PBD SUBSTEP STIFFENING
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Macklin XPBD (Δx ≡ 0.8000 m, 0.0000 m Drift) vs Unscaled PBD (Δx = 0.0500 m at N_s=4, −93.75% Collapse, 53.33× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Scaling compliance by α̃ = α / Δt_s² cancels the kinematic impulse Δt_s², locking Hooke's law Δx = α·F across all substep counts &amp; frame rates
  </text>

  <!-- Left Panel: Macklin XPBD Time-Scaled Compliance -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Macklin XPBD Time-Scaled Compliance (α̃ = α / Δt_s²)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Δλ = (−C(x) − α̃λ)/(w + α̃) · Exact Hooke Extension Δx = α·F = 0.8000 m
  </text>

  <!-- Flat extension line left -->
  <line x1="100" y1="305" x2="540" y2="305" stroke="#34d399" stroke-width="5"/>
  <circle cx="195" cy="305" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-3 (N_s=4 Substeps): Δx = 0.8000 m (0.0000 m Drift)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Substep Stiffness Drift: 0.0000 m Across N_s = 1 .. 17
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.36 ms (Single-Pass) vs 19.25 ms (48-Iter GS, 53.33×)
  </text>

  <!-- Right Panel: Naive Unscaled Classic PBD -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Unscaled Classic PBD (Shrinks as 1 / N_s²)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Cloth Turns 16× Stiffer at N_s=4 (−93.75% Extension Collapse)!
  </text>

  <!-- Collapsing 1/N^2 curve right -->
  <line x1="660" y1="305" x2="1100" y2="305" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 675 305 Q 720 422 1090 432" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <line x1="755" y1="305" x2="755" y2="424" stroke="#fda4af" stroke-width="3" stroke-dasharray="4,3"/>
  <circle cx="755" cy="424" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-3 (N_s=4 Substeps): Collapses to Δx = 0.0500 m (−93.75%!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Drifted Substep Stations: 16 / 17 (Peak −99.65% Stiffening Drift)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Breaks Material Tuning Whenever Display FPS or Solver Iteration Count Changes
  </text>
</svg>
