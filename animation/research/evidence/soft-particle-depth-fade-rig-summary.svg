<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 89 · LORACH SOFT PARTICLE HERMITE DEPTH-FADE VS HARD Z-TEST BILLBOARD CLIPPING SEAM
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Lorach Soft Particle Depth-Fade (Δz=+0.2m α = 0.1250) vs Hard Z-Test (α = 0.8000, 26.08× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Cubic Hermite α₀·s²(3−2s) depth-fade dissolves razor-sharp 2D billboard-terrain intersection seams with C¹ continuity
  </text>

  <!-- Left Panel: Lorach Hermite Soft Particle Depth-Fade -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Lorach Hermite Soft Particle Depth-Fade
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    s = clamp((z_scene − z_p)/0.8m, 0, 1) · α_soft = 0.80 · s²(3 − 2s)
  </text>

  <!-- Smooth C1 S-curve left -->
  <path d="M 95 430 L 205 430 C 275 430, 355 275, 425 275 L 540 275" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="260" cy="406" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-6 (Δz=+0.20m, s=0.25): α_soft = 0.1250 (C¹ Smooth Feather!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Cardboard-Seam Stations: 0 / 17 (Zero Intersection Cliff)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 0.35 ms (Hermite) vs 9.15 ms (64-Slab Quad, 26.08×)
  </text>

  <!-- Right Panel: Naive Hard Z-Test Billboard Clipping -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Hard Z-Test Billboard Clipping (z_p ≤ z_scene)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Step-Function Cliff at Δz = 0m Exposes Razor-Sharp 2D Cardboard Cutout!
  </text>

  <!-- Step function cliff vs smooth curve right -->
  <path d="M 655 430 L 765 430 C 835 430, 915 275, 985 275 L 1100 275" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 655 430 L 765 430 L 765 275 L 1100 275" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="820" cy="275" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-6 (Δz=+0.20m): α_hard = 0.8000 (+0.6750 Cliff · +0.8000 at Δz=0!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Corrupted Seam Stations: 8 / 17 (Max Cliff +0.8000 at Δz=0m)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Reveals Paper-Thin 2D Quad Geometry Wherever Smoke Touches Terrain
  </text>
</svg>
