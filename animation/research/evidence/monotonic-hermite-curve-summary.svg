<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 34 · FRITSCH-CARLSON MONOTONIC CUBIC HERMITE (PCHIP) VS CATMULL-ROM OVERSHOOT
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="800">
    Fritsch-Carlson PCHIP (y = 2.0000u, 0u Overshoot) vs Catmull-Rom (y = 2.1465u, +0.1465u Bulge)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    On a [0, 0, 2, 2] ramp-to-plateau, Catmull-Rom enters the flat hold with m₂=+1.0, ringing above ceiling and below ground!
  </text>

  <!-- Left Panel: Fritsch-Carlson Monotonic Cubic Hermite -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Fritsch-Carlson Monotonic Cubic Hermite (PCHIP)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Δ₁·Δ₂ ≤ 0 ⇒ Clamps Tangent m₂ = 0.00 · Zero Plateau Ringing
  </text>

  <!-- Monotonic step curve left -->
  <line x1="100" y1="290" x2="540" y2="290" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="100" y1="420" x2="540" y2="420" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 110 420 L 250 420 C 310 420, 330 290, 390 290 L 530 290" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="110" cy="420" r="6" fill="#38bdf8"/>
  <circle cx="250" cy="420" r="6" fill="#38bdf8"/>
  <circle cx="390" cy="290" r="6" fill="#38bdf8"/>
  <circle cx="442" cy="290" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="530" cy="290" r="6" fill="#38bdf8"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    t=2.375 Station-19: y = 2.0000u · Overshoot = 0.0000u
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Plateau Overshoot: 0.0000u · Ground Undershoot: 0.0000u
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 25-Station Passes: 7.79 ms (Horner) vs 14.60 ms (Expanded Power)
  </text>

  <!-- Right Panel: Unconstrained Catmull-Rom -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Unconstrained Catmull-Rom: m_k = (y_{k+1} − y_{k−1}) / 2
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Non-Zero Slope m₁=m₂=+1.0 at Flat Boundaries · Severe Ringing!
  </text>

  <!-- Ringing Catmull-Rom curve right -->
  <line x1="660" y1="290" x2="1100" y2="290" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="660" y1="420" x2="1100" y2="420" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 670 420 Q 765 462 810 420 C 860 370, 900 330, 950 290 Q 995 248 1090 290" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
  <circle cx="757" cy="441" r="7" fill="#fb7185"/>
  <circle cx="1002" cy="269" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    t=2.375 Station-19: y = 2.1465u (+0.1465u Ceiling Breach!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Overshoot: +0.1465u · Undershoot: -0.1465u
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Total Peak-to-Peak Ringing Span = 0.2930u (14.65% Step Distortion)
  </text>
</svg>
