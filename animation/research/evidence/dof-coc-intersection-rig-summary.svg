<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="#0b1324" stroke="#1e293b" stroke-width="2"/>

  <text x="56" y="74" fill="#38bdf8" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">
    ROUND 84 · JIMÉNEZ DEPTH-OF-FIELD SAMPLE-COC INTERSECTION GATE VS CENTER-COC FOREGROUND HALO BLEED
  </text>
  <text x="56" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">
    Jiménez Sample-CoC Gate (d=+1px L = 1.0000, 0 Bleed) vs Center-CoC Gather (L = 0.5800 Halo, 10.90× Faster)
  </text>
  <text x="56" y="142" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="15">
    Checking CoC(y) ≥ ∥x − y∥ prevents sharp in-focus foreground objects (CoC = 0) from bleeding onto blurry backgrounds
  </text>

  <!-- Left Panel: Jimenez Sample-CoC Intersection Gate -->
  <rect x="56" y="170" width="528" height="396" rx="14" fill="#0f1b33" stroke="#10b981" stroke-width="1.8"/>
  <text x="80" y="204" fill="#34d399" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ✅ Jiménez Sample-CoC Intersection Gate (CoC(y) ≥ |Δx|)
  </text>
  <text x="80" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Sharp Foreground CoC(y) = 0 Rejected · Crisp Step to 1.0000 Bokeh
  </text>

  <!-- Crisp step left -->
  <line x1="205" y1="245" x2="205" y2="435" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="212" y="422" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">In-Focus Edge (d=0)</text>
  <polyline points="105,428 205,428 205,270 535,270" fill="none" stroke="#34d399" stroke-width="5" stroke-linejoin="miter"/>
  <circle cx="230" cy="270" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="2"/>
  <text x="320" y="468" fill="#34d399" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-5 (d=+1px Background Bokeh): L_DoF = 1.0000 (0.0000 Halo Bleed!)
  </text>

  <rect x="80" y="492" width="480" height="54" rx="8" fill="#062e22" stroke="#10b981"/>
  <text x="96" y="514" fill="#a7f3d0" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Foreground Halo Bleed Stations: 0 / 17 (Pin-Sharp Focus Silhouette)
  </text>
  <text x="96" y="534" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13">
    8,192 17-Station Passes: 1.03 ms (Closed-Form) vs 11.21 ms (64-Tap Gather, 10.90×)
  </text>

  <!-- Right Panel: Naive Center-CoC Gather -->
  <rect x="616" y="170" width="528" height="396" rx="14" fill="#1c1124" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="640" y="204" fill="#fb7185" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700">
    ❌ Naive Center-CoC Gather (Uses CoC(x) = 8px Only)
  </text>
  <text x="640" y="228" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="13">
    Pulls 7px of Sharp Dark Foreground into Blurry Background → Dark Halo!
  </text>

  <!-- Bleed ramp right -->
  <line x1="765" y1="245" x2="765" y2="435" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>
  <polyline points="665,428 765,428 790,336 965,270 1095,270" fill="none" stroke="#fb7185" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="790" cy="336" r="8" fill="#fb7185" stroke="#f8fafc" stroke-width="2"/>
  <text x="880" y="468" fill="#fda4af" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
    Station-5 (d=+1px): Bleeds to L_DoF = 0.5800 (−0.4200 Dark Halo!)
  </text>

  <rect x="640" y="492" width="480" height="54" rx="8" fill="#3b0a1e" stroke="#f43f5e"/>
  <text x="656" y="514" fill="#fecdd3" font-family="Consolas, monospace" font-size="14" font-weight="700">
    Bleed-Corrupted Stations: 7 / 17 (d = +1..+7px Surrounded by Dark Fringe)
  </text>
  <text x="656" y="534" fill="#fda4af" font-family="Consolas, monospace" font-size="13">
    Wraps In-Focus Characters in a Ghostly Blurry Halo Over Bright Bokeh
  </text>
</svg>
